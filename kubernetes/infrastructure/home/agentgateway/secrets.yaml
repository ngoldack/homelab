# Manual-but-git-owned objects the generated proxy Deployment references and
# Flux must not prune:
#   - SA agentgateway: the controller's per-Gateway proxy Deployment mounts an
#     xds-token projected from this SA (name = the Gateway's release/service
#     account, not the controller's renamed Helm SA).
#   - agentgateway-session-key: the proxy container requires a Secret with the
#     key `key` (32 random bytes hex) for MCP session encryption.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentgateway
  namespace: agentgateway
