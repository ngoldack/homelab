apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey-operator
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: valkey-system
  chart:
    spec:
      chart: valkey-operator
      version: "0.1.x" # Uses official newer valkey-operator layout
      sourceRef:
        kind: HelmRepository
        name: valkey-operator
      interval: 1h
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values: {}
