apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: "1.19.5"
      sourceRef:
        kind: HelmRepository
        name: cilium
      interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    cluster:
      name: home
      id: 1
    clustermesh:
      useAPIServer: true
    ipam:
      mode: kubernetes
    kubeProxyReplacement: true
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    bpf:
      masquerade: true
    hostServices:
      enabled: true
    tunnel: vxlan
    # Gateway API: Cilium's envoy implementation terminates TLS for the
    # public ingress (Gateway resource in ../network). cert-manager issues the
    # wildcard cert via DNS-01.
    gatewayAPI:
      enabled: true
    # No Cilium pod-to-pod encryption: Talos KubeSpan already encrypts all
    # node-to-node traffic at the OS layer, so Cilium's WireGuard/IPsec
    # datapath encryption is left disabled (its default) to avoid double
    # encryption. `tunnel: vxlan` is just the overlay encapsulation, not a VPN.
