# LAN-only surfaces for the media stack, all on the `public` Gateway
# (10.30.0.200, ARP-announced on the cluster VLAN) and labelled
# dns.ngoldack.de/publish=lan so the LAN external-dns instance owns the
# records. Deliberately NOT on the edge Gateway: these are household
# services, and the download chain's VPN egress already lives in the
# datapath, not in the ingress path.
#
# Hostnames use the repo's canonical service-URL scheme,
# {app}.{namespace}.svc.{domain} — e.g. jellyfin.media.svc.ngoldack.de —
# which the *.svc.${CLUSTER_DOMAIN} wildcard certificate already covers
# (network/certificate.yaml).
#
# Auth is the apps' own login pages (Jellyfin/Seerr/*arr all ship one);
# authentik is not in front of these, matching the immich/paperless posture
# for LAN-resident services.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: media
  labels:
    dns.ngoldack.de/publish: lan
spec:
  parentRefs:
    - name: public
      namespace: network
      sectionName: https-media-svc
  hostnames:
    - jellyfin.media.svc.${CLUSTER_DOMAIN}
  rules:
    - backendRefs:
        - name: media-jellyfin
          port: 8096
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr
  namespace: media
  labels:
    dns.ngoldack.de/publish: lan
spec:
  parentRefs:
    - name: public
      namespace: network
      sectionName: https-media-svc
  hostnames:
    - seerr.media.svc.${CLUSTER_DOMAIN}
  rules:
