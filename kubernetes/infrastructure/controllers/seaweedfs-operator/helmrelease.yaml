apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs-operator
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: seaweedfs-operator
  chart:
    spec:
      chart: seaweedfs-operator
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: seaweedfs-operator
      interval: 1h
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values:
    # The defaulting/validation webhook ships a cert that is awkward to
    # bootstrap on first install; disable it (validation is also enforced by the
    # CRD's CEL rules).
    webhook:
      enabled: false
