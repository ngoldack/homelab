# hermes — hardened single-replica Hermes gateway running the agent_sandbox
# terminal backend. Holds NO Kubernetes credentials beyond its own claim
# RBAC (approved scoped grant in rbac.yaml): it talks to the sandbox-router
# for files (v2 scoped tokens), gRPC-execs into adopted sandboxes directly
# (user-approved fallback), and calls OpenRouter for the model.
#
# Hardening (restricted PSA): runAsNonRoot (hermes uid 10000), fsGroup
# 10000, RuntimeDefault seccomp, drop ALL caps, read-only rootfs, /tmp
# emptyDir, no hostPath/sockets/kubeconfig. s6-overlay is bypassed in the
# image (hermes shim as ENTRYPOINT), so the gateway runs as the unprivileged
# hermes uid; Kubernetes supervises the single replica.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: hermes
spec:
  serviceName: hermes
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      serviceAccountName: hermes
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hermes
          image: registry.ngoldack.de/hermes-agent-sandbox-plugin@sha256:44da0b19a6845ac849e6caa6d7694a8ba3fd26944960a6bc9e518ef60cdf8f51
          args: ["gateway", "run"]
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: OPENROUTER_API_KEY
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: API_SERVER_KEY
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_PORT
              value: "8642"
            - name: AGENT_SANDBOX_ROUTER_URL
              value: http://sandbox-router-svc.agent-sandbox-system.svc.cluster.local:8080
            - name: AGENT_SANDBOX_ROUTER_TOKEN_FILE
              value: /opt/data/router-token
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
            - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: HERMES_DASHBOARD_BASIC_AUTH_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: 8642
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 8642
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8642
            periodSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: router-token
              mountPath: /opt/data/router-token
              subPath: token
              readOnly: true
            - name: tmp
              mountPath: /tmp
      initContainers:
        - name: seed-config
          image: registry.ngoldack.de/hermes-agent-sandbox-plugin@sha256:44da0b19a6845ac849e6caa6d7694a8ba3fd26944960a6bc9e518ef60cdf8f51
          command: ["/bin/sh", "-c"]
          args:
            - >-
              mkdir -p /opt/data &&
              if [ ! -f /opt/data/config.yaml ]; then
                cp /opt/boot/config.yaml /opt/data/config.yaml
              elif grep -q '^_config_version:' /opt/data/config.yaml; then
                # A config generated by a previous hermes boot (template
                # migration marker) predates operator management: replace it
                # with the operator's config exactly once. Operator edits
                # after this point are never clobbered.
                cp /opt/boot/config.yaml /opt/data/config.yaml
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10000
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: boot-config
              mountPath: /opt/boot
              readOnly: true
      volumes:
        - name: boot-config
          configMap:
            name: hermes-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: router-token
          secret:
            secretName: hermes-secret
            items:
              - key: AGENT_SANDBOX_ROUTER_TOKEN
                path: token
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: truenas-fast-nfs
        resources:
          requests:
            storage: 10Gi
