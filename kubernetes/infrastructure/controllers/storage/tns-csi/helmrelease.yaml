apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tns-csi-driver
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: storage
  chart:
    spec:
      chart: tns-csi
      version: "0.17.6"
      sourceRef:
        kind: HelmRepository
        name: tns-csi
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: Secret
      name: tns-csi-credentials
      valuesKey: apiKey
      targetPath: truenas.apiKey
    # TrueNAS IP/hostname is treated as sensitive (network topology) — injected
    # from the same Secret rather than a plaintext value below.
    - kind: Secret
      name: tns-csi-credentials
      valuesKey: url
      targetPath: truenas.url
  values:
    # Storage tiers managed by the CSI driver. Nodes are interconnected at 10GbE.
    # - tns-tank-nfs:    tank (HDD) over NFS — huge files / media libraries (Emby)
    # - tns-fast-nfs:    fast (NVMe) over NFS — default tier for config/general PVCs
    # - tns-fast-nvmeof: fast (NVMe) over NVMe-oF — databases / high-performance block
    #
    # reclaimPolicy: Retain on ALL tiers — deleting a PVC/PV MUST NOT delete the
    # underlying TrueNAS (nas-main) dataset. Volumes are reclaimed manually on the NAS.
    # VERIFY-BEFORE-DEPLOY: confirm the tns-csi chart honors per-class reclaimPolicy.
    storageClasses:
      - name: tns-tank-nfs
        protocol: nfs
        pool: tank
        defaultClass: false
        reclaimPolicy: Retain
      - name: tns-fast-nfs
        protocol: nfs
        pool: fast
        defaultClass: true
        reclaimPolicy: Retain
      - name: tns-fast-nvmeof
        protocol: nvmeof
        pool: fast
        defaultClass: false
        reclaimPolicy: Retain
