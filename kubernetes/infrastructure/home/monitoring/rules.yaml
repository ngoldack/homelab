# CNPG backup- and WAL-archiving health alerts for the home cluster's five
# CloudNativePG clusters. These guard the S3 Barman-Cloud-plugin backups and
# PITR guarantees the per-cluster objectstore/scheduled-backup manifests rely
# on (authentik, langfuse, immich, hindsight — and paperless, whose cluster was
# previously missing from the scrape file entirely).
#
# Metric names verified against plugin-barman-cloud v0.15.0 (the plugin
# supersedes the deprecated cnpg_collector_* backup metrics):
#   barman_cloud_cloudnative_pg_io_last_available_backup_timestamp — unix
#       timestamp of the most recent successfully available backup (0 until
#       the first backup exists, so the age rule also fires on a cluster that
#       has never backed up)
#   cnpg_collector_pg_wal_archive_status{value="ready"} — core CNPG exporter:
#       WAL segments still waiting to be archived (backlog = archiving
#       stalled)
#
# Every CNPG series carries a "cluster" label injected by the relabelings on
# the five CNPG VMPodScrapes in the sibling scrapes.yaml (one per live cluster:
# authentik, immich, hindsight, langfuse and paperless — the fifth scrape is
# new here, and before it existed no series carried cluster="paperless-*" at
# all). The relabeling maps the pod label cnpg.io/cluster onto the metric label
# cluster verbatim, so the label VALUE is the full cluster name
# (cluster="authentik-database", cluster="immich-database", …), not the bare
# namespace. {cluster!=""} therefore selects exactly those five live clusters —
# and matches nothing on any other exporter (these metric names are CNPG-only).
# That label is also why the absence rule below is written once per cluster
# instead of once globally: absent() over {cluster!=""} goes silent as soon as
# ANY cluster reports, so one healthy cluster used to mask another cluster
# whose metrics had vanished.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: data-protection
  namespace: monitoring
spec:
  groups:
    - name: data-protection
      rules:
        - alert: WALArchivingStalled
          expr: >-
            cnpg_collector_pg_wal_archive_status{cluster!="",value="ready"} > 20
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "WAL archiving stalled for {{ $labels.cluster }}"
            description: >-
              Cluster {{ $labels.cluster }} has {{ $value }} WAL segments
              waiting to be archived for over 30 minutes. A backlog above 20
              means the barman-cloud WAL archive upload is stalled, so PITR
              recovery may be incomplete for those WALs.
        - alert: BackupTooOld
          expr: >-
            (time() -
            barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cluster!=""})
            > 30 * 3600
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Last available backup too old for {{ $labels.cluster }}"
            description: >-
              The most recent available backup of cluster {{ $labels.cluster }}
              is {{ $value | humanizeDuration }} old (more than 30h). The
              daily scheduled backup has not completed in time — check the
              ScheduledBackup/Backup objects and the plugin sidecar logs;
              PITR RPO is degraded. An age of ~56 years (timestamp 0) means
              the cluster has never had a successful backup.
        - alert: BackupMetricsAbsent
          # One absent() per cluster, or-joined, matched on the FULL cluster
          # name — the relabeling copies the pod label cnpg.io/cluster
          # verbatim, so the series carry cluster="authentik-database" etc.,
          # never the bare namespace. absent() over the old global selector
          # {cluster!=""} returned empty as soon as ANY cluster had a series,
          # so a single healthy cluster hid another cluster whose metrics had
          # disappeared; per-cluster selectors make each cluster's silence
          # fire on its own. absent() copies the equality matcher's label, so
          # $labels.cluster names the missing cluster.
          expr: >-
            absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cluster="authentik-database"})
            or absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cluster="immich-database"})
            or absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cluster="hindsight-database"})
            or absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cluster="langfuse-database"})
            or absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cluster="paperless-database"})
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "CNPG backup metrics absent for {{ $labels.cluster }}"
            description: >-
              No barman_cloud_cloudnative_pg_io backup-age series is being
              scraped for cluster {{ $labels.cluster }} for over 30m — the
              plugin sidecar is down, the operator is not reconciling, or that
              cluster's VMPodScrape/relabeling broke. This is evaluated per
              cluster, so it fires even while the other four clusters report
              normally. While absent, BackupTooOld is blind for
              {{ $labels.cluster }}, so treat backup coverage as unverifiable
              until this resolves.
