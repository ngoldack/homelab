# Dedicated ServiceAccount for the Browserless pod.
#
# Kyverno's `disallow-default-serviceaccount` (Audit) reads
# `spec.serviceAccountName` only — a pod-level `automountServiceAccountToken:
# false` does not satisfy it — and this namespace is not in that policy's
# exclude list. Naming a dedicated SA is the house pattern (see
# ../image-builds/synthetic-proxy.yaml and ../authentik/oidc-meta-proxy.yaml).
#
# The token is not mounted: Chromium talks to the public web and never to the
# Kubernetes API, and ../browserless/cilium-allowlist.yaml grants no route to
# the apiserver either.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: browserless
  namespace: browserless
automountServiceAccountToken: false
