# CloudNativePG uses n8n-postgres-credentials (basic-auth) for the owner role so the
# password is known and can be shared with the n8n chart (which needs a secret key
# named `postgres-password`). Keep the password value in sync across both secrets in
# secret.sops.yaml.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-postgres
  namespace: n8n
spec:
  instances: 1

  storage:
    size: 10Gi
    storageClass: tns-fast-nvmeof

  # Continuous WAL archiving + base backups to S3 (PITR) via the Barman Cloud plugin.
  # The referenced ObjectStore is defined in barman-objectstore.yaml; daily base
  # backups are scheduled by scheduledbackup.yaml.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: n8n-backup-store

  bootstrap:
    initdb:
      database: n8n
      owner: n8n
      secret:
        name: n8n-postgres-credentials
