# One ServiceAccount per database, so a drill can only touch its own drill
# namespace and its own source credentials. They exist in the control
# namespace and are bound into exactly two namespaces each (the source
# namespace, for one named Secret, and the matching *-drill namespace).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-restore-drill-immich
  namespace: cnpg-restore-drills
  labels:
    app.kubernetes.io/name: cnpg-restore-drills
    app.kubernetes.io/instance: immich
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-restore-drill-paperless
  namespace: cnpg-restore-drills
  labels:
    app.kubernetes.io/name: cnpg-restore-drills
    app.kubernetes.io/instance: paperless
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-restore-drill-hindsight
  namespace: cnpg-restore-drills
  labels:
    app.kubernetes.io/name: cnpg-restore-drills
    app.kubernetes.io/instance: hindsight
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-restore-drill-langfuse
  namespace: cnpg-restore-drills
  labels:
    app.kubernetes.io/name: cnpg-restore-drills
    app.kubernetes.io/instance: langfuse
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-restore-drill-authentik
  namespace: cnpg-restore-drills
  labels:
    app.kubernetes.io/name: cnpg-restore-drills
    app.kubernetes.io/instance: authentik
