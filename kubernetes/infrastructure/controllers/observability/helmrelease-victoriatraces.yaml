# VictoriaTraces — trace storage for the VictoriaMetrics stack (replaces Tempo).
# Ingests OTLP traces from the OTel collector on :10428; queried by Grafana.
# Deployed as a plain Deployment (the chart is young); a single-binary instance.
#
# VERIFY-BEFORE-DEPLOY: VictoriaTraces is a young project - pin the image tag and
# confirm the OTLP ingestion path/port (:10428) and the Grafana datasource type
# against the release you deploy.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-traces-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: tns-fast-nfs
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-traces
  namespace: monitoring
  labels:
    app.kubernetes.io/name: victoria-traces
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-traces
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-traces
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: victoria-traces
          # renovate: datasource=docker depName=victoriametrics/victoria-traces
          image: victoriametrics/victoria-traces:latest
          args:
            - "--storageDataPath=/vt-data"
            - "--retentionPeriod=30d"
            - "--httpListenAddr=:10428"
          ports:
            - name: http
              containerPort: 10428
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /vt-data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: victoria-traces-data
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-traces
  namespace: monitoring
  labels:
    app.kubernetes.io/name: victoria-traces
spec:
  selector:
    app.kubernetes.io/name: victoria-traces
  ports:
    - name: http
      port: 10428
      targetPort: 10428
