# Qwen3.6-35B-A3B on the Tesla P100.
#
# PRIMARY serving model (fleet-research winner, 2026-09-15): MoE 256/8+1 active,
# qwen35moe hybrid attention (10 full-attn of 40 layers, KV ~20 KiB/token), so a
# real 35B fits in 16 GiB at UD-Q3_K_S (14.30 GiB) fully GPU-resident and decodes
# ~3x faster than the 27B dense (MoE reads ~8/256 experts/token from HBM2; the
# measured P100 row for this family is 120.6 t/s at Q2_K_XL + patches + MTP).
# Quality at Q3_K_S is within benchmark noise of the 27B Q3_K_XL.
#
# ENGINE: the freshly-built mainline-image registry.ngoldack.de/llama-p100:0.4.0-p100
# (llama.cpp v0.4.0 + shinbunbun's 29 P100 patches, CMAKE_CUDA_ARCHITECTURES=60) —
# the only MEASURED >=20 t/s path on P100. ik sm60-19dfb71-fp16 stays the A/B
# fallback (swap spec.image to registry.ngoldack.de/ik-llama-server:sm60-19dfb71-fp16).
#
# MTP (--spec-type draft-mtp) is NOT enabled here by default: the unsloth
# MTP-embedded repo ships no UD-Q3_K_S (only I-quants/Q2_K_XL fit 16 GiB), and
# llama.cpp's own CUDA MoE MTP measurements are ~neutral-to-negative. The
# non-MTP config below already clears the >=20 t/s target (bandwidth ~47 t/s
# ideal ceiling; realistic 40-60 t/s). Revisit MTP only if a fitting companion
# emerges (nDraftMax 2 first, per Pascal-class MTP data).
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen36-35b
  namespace: llmkube-system
spec:
  source: https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF/resolve/main/Qwen3.6-35B-A3B-UD-Q3_K_S.gguf
  format: gguf
  quantization: Q3_K_S
  prefetch: true
  # The prefetch Job targets the GPU node by label (untainted since
  # 2026-09-15 — placement is by label only).
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      count: 1
      vendor: nvidia
      memory: "16Gi"
      layers: -1
  resources:
    cpu: "4"
    memory: "8Gi"
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen36-35b
  namespace: llmkube-system
spec:
  modelRef: qwen36-35b
  # window closed 2026-09-20 — production restored.
  replicas: 1
  # The mainline+patches P100 image (fleet-verified engine). ik sm60 HEAD is the
  # A/B fallback (see header comment).
  # Pinned: registry.ngoldack.de/llama-p100:0.4.0-p100
  image: registry.ngoldack.de/llama-p100@sha256:f5839c86e75d832fa538bd8b59715a8ea64dd20d356e2d1e9485b43d3a26aa6d
  # REQUIRED: without the nvidia RuntimeClass the pod schedules onto the GPU node
  # but never gets /dev/nvidia* bind-mounted and runs CPU-only (the ~1 t/s bug,
  # fixed this session on qwen3-27b).
  runtimeClassName: nvidia
  nodeSelector:
    hardware/gpu.model: Tesla-P100
  # 32k context; KV is only ~20 KiB/token on this hybrid arch so 32k costs ~0.6 GiB.
  # Drop to 16384 only if the loaded model OOMs.
  contextSize: 32768
  # Flash attention on: decode-free on P100, quality-clean (ik PR #2144 + the sm_60
  # fp32 carve-out baked into our images).
  flashAttention: true
  # KV quant to f8. V-quant requires FA (Pass ordering); gives cheap headroom.
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  # Single slot: llama.cpp otherwise splits context across N slots (wrong for
  # single-user serving) AND speculative-decoding/single-stream math assumes it.
  parallelSlots: 1
  endpoint:
    port: 8080
    type: ClusterIP
  resources:
    gpu: 1
    gpuMemory: "16Gi"
    cpu: "4"
    memory: "8Gi"
  # Persistent per-session KV slots, broker-managed.
  #
  # The restore -> infer -> save choreography lives in llama-kv-broker (see
  # kv-broker.yaml), not here: the operator only needs to hand llama.cpp the slot
  # directory, and the broker — not a client — decides which slot file is restored and
  # when it is written back. The slot dir is a disposable cache on its own claim
  # (kv-cache-pvc.yaml; /models is mounted readOnly), and invalidation is by the
  # broker's config fingerprint over the fields below, so a flag change here needs no
  # manual cache purge.
  #
  # parallelSlots: 1 above STAYS: with a single slot the server always uses slot 0, so
  # no other slot flag is added or tuned — --slot-prompt-similarity, --slots,
  # --cache-idle-slots and --kv-unified-per-slot keep their defaults, which is the
  # already-live behavior.
  extraArgs:
    - --slot-save-path
    - /var/lib/llama/kv
  extraVolumes:
    - name: kv-cache
      persistentVolumeClaim:
        claimName: llama-kv-cache
  extraVolumeMounts:
    - name: kv-cache
      mountPath: /var/lib/llama/kv
