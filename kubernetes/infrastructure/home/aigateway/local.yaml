# Local P100 model via the AI Gateway — route name "local".
#
# Serves Qwen3.6-35B-A3B (full-GPU on the Tesla P100) through the same gateway
# as the DeepSeek/OpenRouter routes, so a client can pick a local model with
#   "model": "local"  +  x-ai-eg-model: local  (EAG routes on that header).
#
# The upstream is llama.cpp's OpenAI-compatible server (the llmkube
# qwen36-35b InferenceService), which speaks /v1/chat/completions and
# /v1/models like OpenAI — hence schema {name: OpenAI, prefix: /v1}:
# EAG strips the /v1 prefix from incoming /v1/* requests and appends it to the
# backend PathPrefix (llama.cpp's OpenAI API lives under /v1). This mirrors the
# OpenRouter backends in models.yaml, which use prefix /api/v1.
#
# No BackendSecurityPolicy: the local server needs no auth.
#
# Cross-namespace: the Backend resolves the FQDN to the ClusterIP of
# qwen36-35b.llmkube-system (reachable from the Envoy data plane).
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: local-p100
  namespace: aigateway
spec:
  endpoints:
    - fqdn:
        hostname: qwen36-35b.llmkube-system.svc.cluster.local
        port: 8080
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: local-p100
  namespace: aigateway
spec:
  schema:
    name: OpenAI
    prefix: /v1
  backendRef:
    name: local-p100
    kind: Backend
    group: gateway.envoyproxy.io
---
# Route: map downstream model token "local" to the local P100 backend.
# The client sends x-ai-eg-model: local (and "model": "local" in the body).
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: local
  namespace: aigateway
spec:
  parentRefs:
    - name: aigateway
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: local
      backendRefs:
        - name: local-p100
