apiVersion: valkey.io/v1alpha1
kind: Valkey
metadata:
  name: authentik-valkey
  namespace: authentik
spec:
  replicas: 1
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: tns-fast-nvmeof
        resources:
          requests:
            storage: 2Gi
