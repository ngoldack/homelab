apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system
data:
  CLUSTER_NAME: home
  CLUSTER_DOMAIN: ngoldack.de
  # NOTE: there is deliberately no INGRESS_TARGET_IP here any more. It held the
  # Hetzner ingress node's public IPv4 (2.28.31.116) from the host-network
  # era, was referenced by nothing in the repo, and its comment claimed a
  # Gateway annotation that did not exist. Ingress is now the LAN VIP
  # 10.30.0.200, and the external-dns target really is an annotation on the
  # Gateway — see network/gateway.yaml. Deliberately NOT re-added as a
  # variable: the VIP belongs next to the LB-IPAM request that reserves it,
  # and splitting it across two files is how the last one went stale.
