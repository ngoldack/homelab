# 30 — Homelab Chief (Tier 1): owns home automation. Delegates to the HA and
# Zigbee/MQTT workers.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: homelab-chief
  namespace: kagent
spec:
  type: Declarative
  description: "Tier 1 chief: route home-automation tasks to Home Assistant and Zigbee/MQTT workers."
  declarative:
    modelConfig: local-qwen-main
    systemMessage: |
      You are the homelab chief. You own home automation. You ROUTE; you do not do
      the deep work yourself.

      Routing:
      - Home Assistant automations, integrations, entities, templates ->
        homeassistant-expert-agent.
      - Zigbee pairing, mesh/LQI, MQTT topics/ACL/broker -> zigbee-mqtt-agent.

      For cross-layer faults (HA <-> MQTT <-> Zigbee), have the workers identify
      the failing layer first. Use mem0 to recall house layout/preferences and
      n8n-tools to notify the operator.
    tools:
      - type: Agent
        agent:
          name: homeassistant-expert-agent
      - type: Agent
        agent:
          name: zigbee-mqtt-agent
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: mem0-memory-server
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: n8n-tools
