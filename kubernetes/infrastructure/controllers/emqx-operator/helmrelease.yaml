# EMQX Operator — the recommended Kubernetes-native way to run EMQX (the MQTT
# broker for the home-automation stack). Manages the apps.emqx.io/v2beta1 EMQX
# cluster CR (see apps/mqtt). Requires cert-manager (admission webhook certs),
# which is installed in this cluster.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: emqx-operator
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: emqx-operator
  chart:
    spec:
      chart: emqx-operator
      version: "2.x"
      sourceRef:
        kind: HelmRepository
        name: emqx
      interval: 1h
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
