apiVersion: batch/v1
kind: CronJob
metadata:
  name: talos-etcd-backup
  namespace: velero
spec:
  # Run every night at 3:00 AM (1 hour after Velero's daily backup)
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: talos-etcd-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              # Sidero Labs image with the native talosctl tool + python3 & pip for custom scripting/uploading
              image: ghcr.io/siderolabs/talosctl:v1.7.5
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  echo "Installing S3 client upload prerequisites..."
                  apk add --no-cache aws-cli bash

                  echo "Setting up talosconfig..."
                  mkdir -p ~/.talos
                  cp /var/run/secrets/talos/talosconfig ~/.talos/config

                  DATE=$(date +%Y%m%d-%H%M%S)
                  SNAPSHOT_PATH="/tmp/etcd-${DATE}.snapshot"

                  echo "Taking etcd snapshot from control plane nodes..."
                  # Point to the control plane IPs / endpoints. 127.0.0.1 port 7445 (via local proxy) or cluster IP
                  # We can target the control plane nodes resolved by the local DNS or specific master endpoint.
                  talosctl -n k8s-master-0.local,k8s-master-1.local,k8s-master-2.local etcd snapshot "${SNAPSHOT_PATH}"

                  echo "Uploading snapshot to S3 rustfs bucket..."
                  aws --endpoint-url "${S3_ENDPOINT}" s3 cp "${SNAPSHOT_PATH}" \
                    "s3://${S3_BUCKET}/etcd-backups/etcd-${DATE}.snapshot"

                  echo "etcd backup successfully uploaded to S3!"
              env:
                - name: S3_ENDPOINT
                  value: "http://truenas-scale.local:9000"
                - name: S3_BUCKET
                  value: "k8s-backups-rustfs"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: velero-s3-credentials
                      key: cloud
                      # Extract access key ID from the aws credentials template directly
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: velero-s3-credentials
                      key: cloud
                # We overwrite AWS env standard secrets or extract them.
                # To make it cleaner and self-contained, we can supply standard aws-credentials variables directly
              volumeMounts:
                - name: talosconfig
                  mountPath: /var/run/secrets/talos
                  readOnly: true
          volumes:
            - name: talosconfig
              secret:
                secretName: talos-backup-config
                optional: true
