name: OpenTofu Destroy

# DANGER: tears down managed infrastructure. Manual dispatch ONLY, gated behind
# the protected "production" GitHub Environment, and requires the operator to
# type the exact confirmation string below to proceed.
#
# All logic lives in the Dagger module (.dagger). The confirmation string is
# enforced both here and inside the Dagger function. Locally this is:
#   dagger call tofu-destroy --confirm=destroy-production \
#     --sops-age-key=env://SOPS_AGE_KEY \
#     --netbird-setup-key=env://NETBIRD_SETUP_KEY

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy-production" to confirm'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tofu-state
  cancel-in-progress: false

jobs:
  destroy:
    name: OpenTofu Destroy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate Confirmation Input
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "destroy-production" ]; then
            echo "::error::Confirmation string did not match. Aborting."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: OpenTofu Destroy (Dagger)
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "0.21.4"
          verb: call
          args: >-
            tofu-destroy
            --confirm=destroy-production
            --sops-age-key=env://SOPS_AGE_KEY
            --netbird-setup-key=env://NETBIRD_SETUP_KEY
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
