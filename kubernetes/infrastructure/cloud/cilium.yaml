# Cilium for the CLOUD cluster (single Hetzner VPS, id 2). Its own HelmRelease
# (the homelab one is id 1) - a cloud cluster runs its own Flux + Cilium and joins
# the homelab cluster via Cluster Mesh.
#
# Minimal vs homelab: single node (cp schedulable), no WireGuard node-encryption
# (one node). Public box -> it fronts ingress and reaches homelab global Services
# over the mesh.
#
# VERIFY-BEFORE-DEPLOY: the clustermesh-apiserver reachability across WAN/NAT (see
# the homelab cilium note); run `cilium clustermesh connect` once to peer them.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: "1.19.4"
      sourceRef:
        kind: HelmRepository
        name: cilium
      interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    cluster:
      name: cloud
      id: 2
    clustermesh:
      useAPIServer: true
      apiserver:
        service:
          type: LoadBalancer
    gatewayAPI:
      enabled: true
    ipam:
      mode: kubernetes
    cgroup:
      autoMount:
        enabled: false
      hostPath: /sys/fs/cgroup
    kubeProxyReplacement: true
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    bpf:
      masquerade: true
    hostServices:
      enabled: true
    operator:
      # Single-node cluster: one operator replica.
      replicas: 1
      rollOutPods: true
    tunnel: vxlan
    hubble:
      enabled: true
      relay:
        enabled: true
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - DAC_OVERRIDE
          - FOWNER
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_BOOT
          - SYS_CHROOT
          - SYS_PTRACE
          - SYS_RESOURCE
          - NET_ADMIN
          - NET_RAW
          - BPF
          - PERFMON
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_CHROOT
