# Controls Flux reconciliation of the agentgateway control plane.
#
# Core infrastructure (created here):
# - namespace.yaml (ns agentgateway, edge-ingress label)
# - sources.yaml (HelmRepository agentgateway, shared with crds lane)
# - helmrelease.yaml (agentgateway controller pod/service)
# - gateway.yaml (Gateway class-owned by controller)
# - parameters.yaml (LB IP + nodeSelector overlay)
#
# Sibling-owned resources (created by other agents; ordered for dependency):
# - backends.yaml (AgentgatewayBackend definitions)
# - routes.yaml (HTTPRoute / routed via Gateway parentRef)
# - policy-jwt.yaml (authentication policy)
# - policy-tracing.yaml (OpenTelemetry tracing policy)
# - referencegrant-authentik.yaml (allow ik-controller to reach authentik server)
# - langfuse-otel.sops.yaml (OTel collector telegrams → Langfuse)
# - openrouter-key.sops.yaml (OpenRouter API key as secret)
# - synthetic-key.sops.yaml (Synthetic API key as secret)
# - otel-collector.yaml (OpenTelemetry Collector helmrelease)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cilium-default-deny.yaml
  - cilium-allowlist.yaml
  - namespace.yaml
  - sources.yaml
  - helmrelease.yaml
  - gateway.yaml
  - parameters.yaml
  - gateway-edge.yaml
  - parameters-edge.yaml
  - backends.yaml
  - routes.yaml
  - routes-edge.yaml
  - policy-jwt.yaml
  - policy-tracing.yaml
  - policy-jwt-edge.yaml
  - policy-tracing-edge.yaml
  - referencegrant-authentik.yaml
  - langfuse-otel.sops.yaml
  - openrouter-key.sops.yaml
  - synthetic-key.sops.yaml
  - httproute-edge.yaml
  - api-keys.sops.yaml
  - hindsight-chain.yaml
  - chat-chain.yaml
  - policy-retry.yaml
  - agent-chains.yaml
  - policy-agent-chains-health.yaml
  - httproute-key.yaml
  - synthetic-proxy.yaml
  - policy-apikey.yaml
  - httproute-key-edge.yaml
  - policy-retry-edge.yaml
  - policy-apikey-edge.yaml
  - otel-collector.yaml
  - otel-collector-queue-pvc.yaml
