apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen3-14b
  namespace: vllm
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    serving.kserve.io/autoscalerClass: keda
    serving.kserve.io/secretName: vllm-s3-credentials
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  predictor:
    minReplicas: 0
    maxReplicas: 2
    autoScaling:
      metrics:
        - type: External
          external:
            metric:
              backend: prometheus
              serverAddress: http://victoria-metrics-single-server.monitoring.svc.cluster.local:8428
              query: sum(rate(vllm:num_requests_waiting{pod=~"qwen3-14b-predictor.*"}[2m]))
            target:
              type: Value
              value: "1"
    nodeSelector:
      ai: "true"
    tolerations:
      - key: "ai"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    model:
      modelFormat:
        name: huggingface
      storageUri: "s3://vllm-models/qwen3-14b"
      runtime: kserve-vllmserver
      args:
        - "--device=cpu"
        - "--dtype=bfloat16"
        - "--block-size=128"
        - "--max-model-len=4096"
        - "--cpu-memory-utilization=0.85"
        - "--max-num-batched-tokens=2048"
        - "--max-num-seqs=64"
      env:
        - name: VLLM_CPU_OMP_THREADS_BIND
          value: "auto"
        - name: VLLM_CPU_NUM_OF_RESERVED_CPU
          value: "2"
        - name: VLLM_CPU_KVCACHE_SPACE
          value: "24"
      resources:
        requests:
          cpu: "12"
          memory: "32Gi"
        limits:
          cpu: "16"
          memory: "64Gi"
      storageSpec:
        storageClassName: tns-csi-fast-nfs
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
