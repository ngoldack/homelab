# This file holds sensitive OpenTofu secrets encrypted with SOPS + age.
#
# Setup:
#   1. Generate an age key pair:
#        age-keygen -o age.key
#        # The public key is printed to stdout (age1...). Add it to .sops.yaml.
#
#   2. Fill in real values below, then encrypt in place:
#        SOPS_AGE_KEY_FILE=age.key sops --encrypt --in-place tofu/secret.sops.yaml
#
#   3. The encrypted file is safe to commit. Never commit the raw age.key file.
#
# Runtime:
#   OpenTofu automatically decrypts this file at plan/apply time:
#        SOPS_AGE_KEY_FILE=/path/to/age.key tofu plan

proxmox_api_password: "CHANGEME"
