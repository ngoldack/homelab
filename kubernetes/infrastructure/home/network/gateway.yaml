apiVersion: v1
kind: Namespace
metadata:
  name: network
---
# Public ingress gateway. There is ONE cluster now — the Hetzner node is an
# ordinary worker of it, joined over KubeSpan — so this Gateway can route to a
# pod on any node, including the LAN ones, through normal in-cluster
# networking. (It previously lived on a separate "cloud" cluster, which is why
# reaching home workloads used to be impossible and ClusterMesh was on the
# table at all.)
#
# Envoy does NOT run host-network any more. gatewayAPI.hostNetwork.enabled is
# false in tofu/home/cilium.tf; the listener is an ordinary LoadBalancer
# Service given a fixed VIP by Cilium LB-IPAM, announced on the LAN by
# l2announcements. So there is no node-selector that can fail open, and the
# old `nmap -p 443` check for stray binds no longer means anything.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: network
  annotations:
    # Ask Cilium's LB-IPAM for this exact address out of the pool in
    # lb-ipam.yaml, rather than whatever it hands out next. The VIP has to be
    # stable across a Gateway recreate because it is what every DNS record
    # published for this cluster points at.
    lbipam.cilium.io/ips: "10.30.0.200"
    # The target external-dns publishes for every hostname on every HTTPRoute
    # attached to this Gateway.
    #
    # This annotation is not belt-and-braces — it is how the value is actually
    # resolved. external-dns's gateway source takes targets from
    # Gateway.status.addresses ONLY when no target annotation is present
    # (source/gateway.go: overrides = TargetsFromTargetAnnotation(gw.Annotations),
    # and Status.Addresses is consulted only `if len(override) == 0`). Setting
    # it here makes publication deterministic instead of dependent on Cilium
    # populating Gateway status — which it historically did not do at all in
    # host-network mode (cilium/cilium#42786).
    #
    # Note --default-targets does NOT do this job: its help text limits it to
    # "the crd source (DNSEndpoint resources with empty targets)", so it is
    # silently ignored by the gateway-httproute source.
    external-dns.alpha.kubernetes.io/target: "10.30.0.200"
spec:
  gatewayClassName: cilium
  listeners:
    - name: https-wildcard
      protocol: HTTPS
      port: 443
      hostname: "*.svc.${CLUSTER_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-svc-tls
      allowedRoutes:
        namespaces:
          # Opt-in only: a namespace must carry this label before any
          # HTTPRoute in it can attach to the public Gateway. Label a
          # namespace to expose a workload publicly:
          #   kubectl label namespace <ns> gateway.ngoldack.de/public-ingress=true
          from: Selector
          selector:
            matchLabels:
              gateway.ngoldack.de/public-ingress: "true"
    # Second listener for short names directly under the domain
    # (immich.ngoldack.de). A separate listener rather than a broader hostname
    # on the first one, because a wildcard matches a single label: one listener
    # cannot serve both *.ngoldack.de and *.svc.ngoldack.de.
    - name: https-apex
      protocol: HTTPS
      port: 443
      hostname: "*.${CLUSTER_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-svc-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.ngoldack.de/public-ingress: "true"
