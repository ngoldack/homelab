# Knowledge plane: a shared, document-oriented RAG store + front door. Open WebUI
# ingests documents (parsed by the in-cluster Docling service), embeds them with
# the cluster embedding model (via LiteLLM), stores the vectors in its OWN
# pgvector CloudNativePG instance, and serves chat/RAG over every model LiteLLM
# exposes. Distinct from mem0 (per-agent conversational memory) — this is a
# durable knowledge base for humans + (later) agents.
apiVersion: v1
kind: Namespace
metadata:
  name: knowledge
  labels:
    # Open WebUI's image runs as root by default, so the namespace floor is
    # baseline (Talos enforces baseline cluster-wide regardless).
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
