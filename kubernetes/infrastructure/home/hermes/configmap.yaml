# hermes — operator-managed config.yaml overlayed onto /opt/data/config.yaml.
# Keys are the real v2026.9.7 schema (verified against the official docs and
# hermes_cli/config_defaults.py at that tag): `model` names a route of the
# agentgateway custom provider below (local-p100 → the P100's qwen36-35b),
# authenticated with the aigateway-oidc JWT the StatefulSet injects as
# OPENAI_API_KEY — the pod does not read OPENROUTER_API_KEY; the terminal
# backend is our agent_sandbox plugin.
# No messaging platform is enabled in v1, so there are no platform allowlists
# to configure; the only access path is the bearer-authenticated API server
# (API_SERVER_KEY env), and GATEWAY_ALLOW_ALL_USERS does not exist in this
# release — deny-by-default holds.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
data:
  # Revision of config.yaml. The seed initContainer re-copies the boot config
  # onto the data PVC only when this value differs from the revision recorded
  # at /opt/data/.config-rev; bump it together with the pod-template
  # annotation hermes.ngoldack.de/config-rev to roll the pod.
  config-rev: "5"
  config.yaml: |
    # LLM via the agentgateway (agentgateway.dev data plane, ns agentgateway):
    # custom OpenAI-compatible provider, base_url at the in-cluster Service.
    # Auth is the aigateway-oidc client_credentials JWT — same issuer/audience
    # the old gateway used, so the stored token in hermes-secret keeps
    # validating (HERMES_LLM_JWT env -> OPENAI_API_KEY on the pod).
    # `provider` MUST name the custom entry ("custom:<name>"): with the default
    # `auto`, Hermes resolved model "local" to the OpenRouter provider and sent
    # calls to api.openrouter.ai, which this namespace's egress allowlist
    # deliberately blocks — every session then failed with "Hermes can't reach
    # the model provider" while a direct curl to the Service worked (2026-09-17).
    provider: custom:agentgateway
    # model "local" routes to the P100 (qwen36-35b) via local-p100 backend;
    # /v1/chat/completions only — hermes does not use the /v1/chat chain
    # prefix (that route is for hindsight-style single-model clients).
    # The canonical shape is the top-level `providers:` dict, keyed by the
    # identity used in `provider: custom:<key>`; the legacy `custom_providers:`
    # list still normalizes into it (hermes_cli/config_providers.py), but the
    # per-provider keys are only KNOWN in this shape — the old
    # `custom_providers[0].timeout: 600` was an unrecognized key and produced
    # "providers.?: unknown config keys ignored: timeout" on every boot while
    # the P100's 600 s budget was silently NOT in effect.
    model: local
    providers:
      agentgateway:
        base_url: http://agentgateway.agentgateway.svc.cluster.local:80/v1
        # The provider needs an explicit key reference: without it the request
        # reached agentgateway with a malformed/empty bearer token (401
        # "token header is malformed"). key_env names the pod env var that
        # holds the aigateway-oidc JWT (injected from hermes-secret), so no
        # credential is written into this ConfigMap.
        key_env: OPENAI_API_KEY
        # The P100 (qwen36-35b) is a reasoning model on a single GPU: its
        # tool-schema prompt plus thinking routinely exceeds the provider
        # client's default budget, and a turn interrupted there surfaces to
        # the caller as "Operation interrupted: waiting for model response"
        # with zero tokens. 600s covers it (verified live 2026-09-17).
        # CAVEAT (v2026.9.7): hermes_cli/timeouts.get_provider_request_timeout()
        # resolves this as providers.<runtime provider id>, and a named custom
        # endpoint resolves to the bare id "custom" (runtime_provider_custom.
        # _custom_runtime -> rp._runtime("custom", …)), so the key is accepted
        # and warning-free but the budget is actually enforced by the
        # HERMES_API_TIMEOUT=600 env in the StatefulSet. Keep both: this is the
        # canonical declaration and the env is the live knob.
        request_timeout_seconds: 600
    plugins:
      # observability/langfuse ships bundled in the base image and is inert
      # without the langfuse SDK (baked in by ../image-builds/
      # hermes-agent-sandbox-plugin/Dockerfile) plus the two credentials below;
      # it exports turns to the in-cluster Langfuse
      # (HERMES_LANGFUSE_BASE_URL, StatefulSet).
      enabled:
        - agent_sandbox
        - observability/langfuse
    terminal:
      backend: agent_sandbox
      cwd: /workspace
      timeout: 300
      persistent_shell: false
