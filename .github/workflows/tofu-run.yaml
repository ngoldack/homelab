name: Managed OpenTofu Run

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to execute'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      nodepool_override:
        description: 'Deploy target node-pool (leave empty to apply everything)'
        required: false
        type: string
        default: ''

jobs:
  opentofu-run:
    name: OpenTofu (${{ github.event.inputs.action }})
    runs-on: self-hosted # Highly recommended for homelabs so the runner is inside your home LAN and can reach Proxmox directly.
    
    # Restrict concurrent runs to avoid locks on the state file
    concurrency:
      group: opentofu-state-lock
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.6.2

      - name: OpenTofu Format Check
        run: tofu fmt -check
        working-directory: tofu

      - name: Configure Age Decryption Private Key
        run: |
          echo "${{ secrets.SOPS_AGE_KEY }}" > age.key
          echo "SOPS_AGE_KEY_FILE=$PWD/age.key" >> $GITHUB_ENV
        # This will write your private age key stored securely in GitHub Action Secrets to a local file
        # to allow SOPS to decrypt secrets.sops.yaml automatically.

      - name: OpenTofu Init
        run: tofu init
        working-directory: tofu
        env:
          # Use your age-encrypted state passphrase from GitHub Secrets to decrypt the native state file
          TOFU_ENCRYPTION_PASSPHRASE_statekey: ${{ secrets.STATE_ENCRYPTION_PASSPHRASE }}

      - name: OpenTofu Plan
        if: github.event.inputs.action == 'plan'
        run: |
          if [ -n "${{ github.event.inputs.nodepool_override }}" ]; then
            TARGET="-target=proxmox_virtual_environment_vm.talos_nodes[\"${{ github.event.inputs.nodepool_override }}\"]"
          fi
          tofu plan $TARGET -out=tofu.tfplan
        working-directory: tofu
        env:
          TOFU_ENCRYPTION_PASSPHRASE_statekey: ${{ secrets.STATE_ENCRYPTION_PASSPHRASE }}

      - name: OpenTofu Apply
        if: github.event.inputs.action == 'apply'
        run: |
          # Safe execution plan: Always execute a dry run plan first, then apply that explicit plan.
          if [ -n "${{ github.event.inputs.nodepool_override }}" ]; then
            TARGET="-target=proxmox_virtual_environment_vm.talos_nodes[\"${{ github.event.inputs.nodepool_override }}\"]"
          fi
          tofu plan $TARGET -out=tofu.tfplan
          tofu apply -input=false tofu.tfplan
        working-directory: tofu
        env:
          TOFU_ENCRYPTION_PASSPHRASE_statekey: ${{ secrets.STATE_ENCRYPTION_PASSPHRASE }}

      - name: OpenTofu Destroy
        if: github.event.inputs.action == 'destroy'
        # Prevent accidental pipeline destroys in production by ensuring confirmation is explicit
        run: |
          echo "WARNING: PROCEEDING TO DESTROY EXPERIMENTAL OR CRITICAL INFRASTRUCTURE..."
          if [ -n "${{ github.event.inputs.nodepool_override }}" ]; then
            TARGET="-target=proxmox_virtual_environment_vm.talos_nodes[\"${{ github.event.inputs.nodepool_override }}\"]"
          fi
          tofu destroy -auto-approve $TARGET
        working-directory: tofu
        env:
          TOFU_ENCRYPTION_PASSPHRASE_statekey: ${{ secrets.STATE_ENCRYPTION_PASSPHRASE }}

      - name: Commit & Push Encrypted State Changes
        if: always() && (github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tofu/terraform.tfstate
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(tofu): secure auto-update state file [skip ci]" && git push
