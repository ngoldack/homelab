# RBAC for the aigateway-jwt-rotator CronJob (jwt-rotator.yaml).
#
# Least privilege, no exec, no pod patching: the rotator needs
#   - get on the client credentials in the AUTHENTIK namespace (the secret
#     is written there by the blueprint seed — Roles are namespaced, so this
#     Role lives in authentik even though the CronJob's SA does not);
#   - get/patch on the two consumer secrets it owns (hermes-secret,
#     hindsight-env) — one Role per namespace;
#   - get/patch on the three consumer controllers for rollout restarts
#     (a restart is a template-annotation patch) and get for status.
# Everything else is denied by the default service-account bindings.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aigateway-jwt-rotator
  namespace: agentgateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aigateway-jwt-rotator-credentials
  namespace: authentik
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["authentik-oidc-aigateway"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aigateway-jwt-rotator-consumers
  namespace: hermes
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["hermes-secret"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["hermes"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aigateway-jwt-rotator-consumers
  namespace: hindsight
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["hindsight-env"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    resourceNames: ["hindsight-api", "hindsight-worker"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aigateway-jwt-rotator-credentials
  namespace: authentik
subjects:
  - kind: ServiceAccount
    name: aigateway-jwt-rotator
    namespace: agentgateway
roleRef:
  kind: Role
  name: aigateway-jwt-rotator-credentials
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aigateway-jwt-rotator
  namespace: hermes
subjects:
  - kind: ServiceAccount
    name: aigateway-jwt-rotator
    namespace: agentgateway
roleRef:
  kind: Role
  name: aigateway-jwt-rotator-consumers
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aigateway-jwt-rotator
  namespace: hindsight
subjects:
  - kind: ServiceAccount
    name: aigateway-jwt-rotator
    namespace: agentgateway
roleRef:
  kind: Role
  name: aigateway-jwt-rotator-consumers
  apiGroup: rbac.authorization.k8s.io
