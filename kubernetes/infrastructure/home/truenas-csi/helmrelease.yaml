apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: truenas-csi
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: truenas-csi
      version: "1.3.0"
      sourceRef:
        kind: HelmRepository
        name: truenas-csi
      interval: 1h
  targetNamespace: truenas-csi
  values:
    truenas:
      url: wss://nas-main:443/api/current
      defaultPool: fast
      nfsServer: nas-main
      nvmeofPortal: nas-main:4420
      insecureSkipTLS: true
      existingSecret: truenas-api-credentials