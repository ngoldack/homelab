# CNPG backup- and WAL-archiving health alerts for the home cluster's five
# CloudNativePG clusters. These guard the S3 Barman-Cloud-plugin backups and
# PITR guarantees the per-cluster objectstore/scheduled-backup manifests rely
# on (authentik, langfuse, immich, hindsight — and paperless, whose cluster was
# previously missing from the scrape file entirely).
#
# Metric names verified against plugin-barman-cloud v0.15.0 (the plugin
# supersedes the deprecated cnpg_collector_* backup metrics):
#   barman_cloud_cloudnative_pg_io_last_available_backup_timestamp — unix
#       timestamp of the most recent successfully available backup (0 until
#       the first backup exists, so the age rule also fires on a cluster that
#       has never backed up)
#   cnpg_collector_pg_wal_archive_status{value="ready"} — core CNPG exporter:
#       WAL segments still waiting to be archived (backlog = archiving
#       stalled)
#
# Every CNPG series carries a "cluster" label injected by the relabelings on
# the five CNPG VMPodScrapes in the sibling scrapes.yaml (one per live cluster:
# authentik, immich, hindsight, langfuse and paperless — the fifth scrape is
# new here, and before it existed no series carried cluster="paperless-*" at
# all). The relabeling maps the pod label cnpg.io/cluster onto the metric label
# cluster verbatim, so the label VALUE is the full cluster name
# (cluster="authentik-database", cluster="immich-database", …), not the bare
# namespace. {cluster!=""} therefore selects exactly those five live clusters —
# and matches nothing on any other exporter (these metric names are CNPG-only).
# That label is also why the absence rule below is written once per cluster
# instead of once globally: absent() over {cluster!=""} goes silent as soon as
# ANY cluster reports, so one healthy cluster used to mask another cluster
# whose metrics had vanished.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: data-protection
  namespace: monitoring
spec:
  groups:
    - name: data-protection
      rules:
        - alert: WALArchivingStalled
          expr: >-
            cnpg_collector_pg_wal_archive_status{cluster!="",value="ready"} > 20
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "WAL archiving stalled for {{ $labels.cluster }}"
            description: >-
              Cluster {{ $labels.cluster }} has {{ $value }} WAL segments
              waiting to be archived for over 30 minutes. A backlog above 20
              means the barman-cloud WAL archive upload is stalled, so PITR
              recovery may be incomplete for those WALs.
        - alert: BackupTooOld
          expr: >-
            (time() -
            barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cluster!=""})
            > 30 * 3600
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Last available backup too old for {{ $labels.cluster }}"
            description: >-
              The most recent available backup of cluster {{ $labels.cluster }}
              is {{ $value | humanizeDuration }} old (more than 30h). The
              daily scheduled backup has not completed in time — check the
              ScheduledBackup/Backup objects and the plugin sidecar logs;
              PITR RPO is degraded. An age of ~56 years (timestamp 0) means
              the cluster has never had a successful backup.
        - alert: BackupMetricsAbsent
          # One absent() per cluster, or-joined, matched on the FULL cluster
          # name — the relabeling copies the pod label cnpg.io/cluster
          # verbatim, so the series carry cluster="authentik-database" etc.,
          # never the bare namespace. absent() over the old global selector
          # {cluster!=""} returned empty as soon as ANY cluster had a series,
          # so a single healthy cluster hid another cluster whose metrics had
          # disappeared; per-cluster selectors make each cluster's silence
          # fire on its own. absent() copies the equality matcher's label, so
          # $labels.cluster names the missing cluster.
          expr: >-
            absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cluster="authentik-database"})
            or absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cluster="immich-database"})
            or absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cluster="hindsight-database"})
            or absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cluster="langfuse-database"})
            or absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cluster="paperless-database"})
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "CNPG backup metrics absent for {{ $labels.cluster }}"
            description: >-
              No barman_cloud_cloudnative_pg_io backup-age series is being
              scraped for cluster {{ $labels.cluster }} for over 30m — the
              plugin sidecar is down, the operator is not reconciling, or that
              cluster's VMPodScrape/relabeling broke. This is evaluated per
              cluster, so it fires even while the other four clusters report
              normally. While absent, BackupTooOld is blind for
              {{ $labels.cluster }}, so treat backup coverage as unverifiable
              until this resolves.
---
# Alerting for the three security components added by the cluster-hardening
# work (kyverno admission policy, tetragon runtime security, crowdsec
# IP-reputation engine). Every metric/label name below was read off the LIVE
# endpoints at implementation time — the five security-component scrapes in
# scrapes.yaml are what deliver them:
#   kyverno_policy_results_total      kyverno-svc-metrics :8000 (metrics-port)
#   tetragon_*                        tetragon :2112       (metrics)
#   cs_lapi_*, cs_machines_*, cs_info crowdsec-service :6060 (metrics)
#   cs_node_hits_total, cs_parser_*   crowdsec-agent-service :6060 (metrics)
# Anything not verifiable live is omitted rather than guessed; see the notes
# inside each group.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: kyverno
  namespace: monitoring
spec:
  groups:
    - name: kyverno
      rules:
        - alert: KyvernoPolicyViolations
          # rule_result is a real label on this series (live values observed:
          # pass and fail, e.g. policy_name="disallow-privileged-containers",
          # rule_name="privileged-and-escalation-false", resource_namespace=
          # "authentik"). Both dry_run="false" (admission requests) and
          # dry_run="true" (background/report runs) results are counted — each
          # records the same audit violation, and only admission-time results
          # would miss drift found by the background scanner. Policies are all
          # validationFailureAction: Audit, so the workload is still admitted;
          # this alert is the only signal that the cluster is drifting from
          # its own policies.
          expr: >-
            sum by (policy_name, rule_name) (
              increase(kyverno_policy_results_total{rule_result="fail"}[1h])
            ) > 0
          for: 15m
          labels:
            severity: info
          annotations:
            summary: "Kyverno policy violation: {{ $labels.policy_name }}"
            description: >-
              Kyverno rule {{ $labels.rule_name }} of policy
              {{ $labels.policy_name }} recorded {{ $value | humanize }}
              non-passing results in the last hour (audit mode — the resources
              were still admitted). Inspect
              kyverno_policy_results_total{rule_result="fail"} and the
              PolicyReports for the affected resource_kind /
              resource_namespace, then either fix the manifest or narrow the
              policy.
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: tetragon-runtime
  namespace: monitoring
spec:
  groups:
    - name: tetragon-runtime
      rules:
        # No per-event alert is shipped for the tracing policies: the live
        # :2112 endpoint exposes tetragon_policy_events_total{policy=...}
        # (sensitive-host-files: 72+22+2+22+52+112+2+148 = 432 events since
        # deploy) but carries NO enforcement-action label, so a Sigkill block
        # is indistinguishable from the monitor-only policy's normal traffic.
        # A plain "increase > 0" rule would therefore fire permanently on the
        # monitor policy instead of only on enforcement. The two rules below
        # cover what can be decided from verified series: whether a policy
        # actually loaded, and whether events are being lost.
        - alert: TetragonTracingPolicyNotLoaded
          # tetragon_tracingpolicy_loaded is exported with state labels
          # disabled/enabled/error/load_error (all four observed live, value 0
          # for everything but enabled=1). A non-zero error state means a
          # TracingPolicy failed to attach, i.e. it provides no detection or
          # enforcement at all.
          expr: tetragon_tracingpolicy_loaded{state=~"error|load_error"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Tetragon tracing policy failed to load"
            description: >-
              {{ $value }} Tetragon tracing policy(ies) are in state
              {{ $labels.state }}: their kprobes/tracepoints are not attached,
              so the policy is blind. Check the tetragon agent logs for the
              load error (BTF/kprobe mismatch after a kernel or chart change is
              the usual cause).
        - alert: TetragonEventsDropped
          # All three counters exist live on :2112 and are currently 0, so any
          # increase is a real loss: listener-buffer overflow, ring-buffer
          # event loss, or export rate limiting. Each one means the runtime
          # security feed (and any downstream log/pipeline consumer) is
          # incomplete.
          expr: >-
            increase(tetragon_notify_overflowed_events_total[10m]) > 0
            or increase(tetragon_observer_ringbuf_events_lost_total[10m]) > 0
            or increase(tetragon_export_ratelimit_events_dropped_total[10m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Tetragon dropped kernel events"
            description: >-
              Tetragon dropped or failed to deliver kernel events in the last
              10m (listener buffer overflow, perf ring buffer loss, or export
              rate limiting) — runtime security visibility is incomplete while
              this is non-zero and blocked actions may go unrecorded. Check the
              tetragon agent pod's CPU/memory limits and its log pipeline.
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: crowdsec
  namespace: monitoring
spec:
  groups:
    - name: crowdsec
      rules:
        # There is deliberately no "active decisions > 0" rule here: neither
        # :6060 endpoint exports a decisions or alerts gauge. The complete
        # live family list is cs_info, cs_lapi_machine_requests_total,
        # cs_lapi_request_duration_seconds, cs_lapi_route_requests_total,
        # cs_machines_last_heartbeat_timestamp and cs_papi_* on the LAPI, plus
        # cs_filesource_hits_total, cs_node_hits_{,ok_,ko_}total,
        # cs_parser_hits_{,ko_}total and cs_parsing_time_seconds on the agent —
        # the crowdsec dashboards' cs_alerts / cs_active_decisions / cs_buckets
        # series do not exist in this deployment at all. A rule on them could
        # never fire, so the two rules below alert on the scrape/intake being
        # alive instead, which is the strongest signal the live series support.
        - alert: CrowdSecLapiMetricsAbsent
          # cs_lapi_* is LAPI-only (verified: present on crowdsec-service
          # :6060, absent on the agent endpoint). Its absence means the LAPI is
          # down or this scrape target broke — no decisions/alerts can be
          # served to bouncers while it lasts.
          expr: absent(cs_lapi_route_requests_total)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "CrowdSec LAPI metrics absent"
            description: >-
              No cs_lapi_route_requests_total series has been scraped for 15m:
              the CrowdSec LAPI is down, or the crowdsec-lapi
              VMServiceScrape/Service was broken or removed. Bouncers cannot
              pull decisions while the LAPI is unreachable, so the cluster is
              running without IP-reputation enforcement.
        - alert: CrowdSecAgentLogIntakeAbsent
          # cs_node_hits_total is agent-only (verified: present on
          # crowdsec-agent-service :6060, absent on the LAPI endpoint) and
          # exists per acquisition source/stage. Its absence means the agent
          # is not reading a single log line — e.g. the authentik pod-log
          # acquisition that is the only detection feed on Talos.
          expr: absent(cs_node_hits_total)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "CrowdSec agent has no log intake"
            description: >-
              No cs_node_hits_total series has been scraped for 15m: the
              crowdsec agent DaemonSet is down, or its acquisition (the
              authentik pod logs mounted from /var/log/pods) is reading
              nothing. Parsers and scenarios cannot fire without input, so
              brute-force detection is effectively off.
---
# Automated CNPG restore drills (kubernetes/infrastructure/home/
# cnpg-restore-drills/). These series are PUSHED by the drill CronJobs to
# vmsingle's /api/v1/import/prometheus — the same URL vmagent writes to, and
# unauthenticated — so the labels are the drill's own (app="immich", …) rather
# than a scrape relabeling of a pod label:
#
#   cnpg_restore_drill_success                        1/0, pushed by every run
#   cnpg_restore_drill_last_run_timestamp_seconds     pushed by every run
#   cnpg_restore_drill_last_success_timestamp_seconds pushed ONLY on success
#
# Because a drill runs monthly, the last sample is the current state for the
# rest of the month: sampled rules (BackupTooOld-style) would go stale in
# between, which is exactly why these are pushed samples and not scrape targets.
#
# Deliberately absent: a "the restored data is N seconds old" rule. The obvious
# candidate, pg_last_xact_replay_timestamp(), returns NULL on a promoted CNPG
# instance (verified live on the recovered authentik cluster on 2026-09-18), so
# it could never evaluate; backup freshness is already covered by BackupTooOld,
# WALArchivingStalled and BackupMetricsAbsent above.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: restore-drills
  namespace: monitoring
spec:
  groups:
    - name: restore-drills
      rules:
        - alert: RestoreDrillFailed
          # The metric is pushed once per run with no expiry, so this fires
          # when the most recent run for an app FAILED and stays firing until a
          # run succeeds — the correct reading: the cluster's restorability is
          # unproven until a drill proves it again. A failed drill is not a
          # backup problem (that is BackupTooOld's job), it is a problem with
          # the restore path itself: a backup that cannot be turned back into a
          # running database is not a backup.
          expr: >-
            max by (app) (cnpg_restore_drill_success) == 0
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Restore drill failed for {{ $labels.app }}"
            description: >-
              The last scheduled restore drill for {{ $labels.app }} failed
              (cnpg_restore_drill_success == 0). Read
              `kubectl -n cnpg-restore-drills logs job/<failed job>` — the run
              logs its failure reason, then the drill cluster's conditions and
              the recovery pod's logs (recovery pods have no postgres
              container). The drill cleans up after itself, so re-running it by
              hand costs one cronjob-created Job:
              `kubectl -n cnpg-restore-drills create job --from=cronjob/cnpg-restore-drill-{{ $labels.app }} <name>`.
              Until a run passes, this cluster is in the state the review called
              out: backups exist, restores are unproven. Drill contract:
              kubernetes/infrastructure/home/cnpg-restore-drills/README.md.
            runbook_url: https://github.com/ngoldack/homelab/blob/main/docs/disaster-recovery.md
        - alert: RestoreDrillStale
          # 32 days = one monthly cycle (the drills run on the 1st) plus slack,
          # so a single missed or failed month is visible instead of silently
          # absorbed. Silent at first deployment until the first manual runs —
          # see RestoreDrillMetricsAbsent below for that window.
          expr: >-
            (time() - max by (app) (cnpg_restore_drill_last_success_timestamp_seconds))
            > 32 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "No successful restore drill for {{ $labels.app }} in over 32 days"
            description: >-
              The newest successful drill for {{ $labels.app }} is
              {{ $value | humanizeDuration }} old (more than 32 days, i.e. more
              than one monthly cycle). Check that the CronJob still exists and
              is not suspended (`kubectl -n cnpg-restore-drills get cronjob`),
              that its Jobs are not piling up as Failed, and whether the metric
              push is reaching vmsingle. The cluster's restore path is
              unverified while this fires: docs/data-protection.md carries the
              last hand-measured RTO for the two clusters that have one, and
              docs/service-catalog.md marks the rest [unverified].
            runbook_url: https://github.com/ngoldack/homelab/blob/main/docs/disaster-recovery.md
        - alert: RestoreDrillMetricsAbsent
          # Companion to the two rules above, in the style of
          # BackupMetricsAbsent: without it a total absence of series would make
          # RestoreDrillStale and RestoreDrillFailed evaluate an empty vector
          # forever, i.e. they could never fire. This is also the alert that
          # fires between the merge of the drills and the first manual run, and
          # again if the series ever ages out of retention (3 months).
          expr: absent(cnpg_restore_drill_last_success_timestamp_seconds)
          for: 12h
          labels:
            severity: warning
          annotations:
            summary: "No CNPG restore-drill metric has ever been reported"
            description: >-
              cnpg_restore_drill_last_success_timestamp_seconds is absent for
              12h: no drill has ever reported a success (expected until the
              first manual runs documented in
              kubernetes/infrastructure/home/cnpg-restore-drills/README.md), the
              metric push no longer reaches vmsingle, or the samples aged out
              of retention (3 months without a successful drill). While this
              fires, RestoreDrillStale and RestoreDrillFailed are blind —
              restore coverage is unverifiable rather than merely stale.
            runbook_url: https://github.com/ngoldack/homelab/blob/main/docs/disaster-recovery.md
