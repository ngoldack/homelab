# OpenViking — "context file system" / memory backend for AI agents, consumed
# over REST + MCP on port 1933 (e.g. by an external Hermes agent).
#
# The chart comes from the upstream Git repo (see gitrepository.yaml); OpenViking
# does not publish a Helm/OCI repository. Embedding + VLM are pointed at the
# in-cluster LiteLLM proxy (OpenAI-compatible). Storage is embedded (RocksDB +
# SQLite), single-replica, on the fast NVMe-oF tier.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openviking
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: openviking
  chart:
    spec:
      chart: deploy/helm/openviking
      sourceRef:
        kind: GitRepository
        name: openviking
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: false
  values:
    image:
      tag: v0.3.24
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 1933
    persistence:
      enabled: true
      storageClass: tns-fast-nvmeof
      accessMode: ReadWriteOnce
      size: 20Gi
    resources:
      requests:
        cpu: "500m"
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    config:
      server:
        host: "0.0.0.0"
        port: 1933
        # Expanded from the Secret via extraEnv at startup.
        # $$ escapes Flux postBuild substitution so OpenViking expands it itself.
        root_api_key: "$${OPENVIKING_ROOT_API_KEY}"
        cors_origins:
          - "*"
      embedding:
        dense:
          # In-cluster LiteLLM (OpenAI-compatible). Model + dimension must match
          # the TEI model registered in LiteLLM (bge-small-en-v1.5 = 384 dims).
          provider: openai
          api_base: "http://litellm.litellm.svc.cluster.local:4000/v1"
          api_key: "$${OPENVIKING_EMBED_KEY}"
          model: "text-embedding"
          dimension: 384
          input: "text"
        max_concurrent: 5
      vlm:
        # Optional summariser. Pointed at a LiteLLM chat model; if it struggles
        # OpenViking degrades to raw content (no hard failure).
        provider: openai
        api_base: "http://litellm.litellm.svc.cluster.local:4000/v1"
        api_key: "$${OPENVIKING_VLM_KEY}"
        model: "default"
        temperature: 0.0
        max_retries: 2
        thinking: false
        max_concurrent: 4
    extraEnv:
      - name: OPENVIKING_ROOT_API_KEY
        valueFrom:
          secretKeyRef:
            name: openviking-secrets
            key: OPENVIKING_ROOT_API_KEY
      - name: OPENVIKING_EMBED_KEY
        valueFrom:
          secretKeyRef:
            name: openviking-secrets
            key: OPENVIKING_EMBED_KEY
      - name: OPENVIKING_VLM_KEY
        valueFrom:
          secretKeyRef:
            name: openviking-secrets
            key: OPENVIKING_VLM_KEY
