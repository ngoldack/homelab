# cert-manager Hetzner DNS-01 webhook solver (vadimkim/cert-manager-webhook-hetzner,
# Apache-2.0). Lets the existing cert-manager issue a wildcard *.${DOMAIN} cert via
# Let's Encrypt DNS-01 against the Hetzner DNS API. Installs INTO the existing
# cert-manager namespace (no new namespace).
#
# VERIFY-BEFORE-DEPLOY: pin the chart version; this webhook uses the LEGACY Hetzner
# DNS API (dns.hetzner.com/api/v1) — confirm your token type. Alternative: switch
# the ClusterIssuer to cert-manager's built-in rfc2136 solver against Technitium.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-hetzner
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: cert-manager
  chart:
    spec:
      chart: cert-manager-webhook-hetzner
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: cert-manager-webhook-hetzner
      interval: 1h
  values:
    # Must match the solver groupName in the ClusterIssuer.
    groupName: hetzner.cert-mananger-webhook.noshoes.xyz
