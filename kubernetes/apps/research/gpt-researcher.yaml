# gpt-researcher (assafelovic/gpt-researcher, Apache-2.0) — a turnkey,
# Perplexity-style deep-research engine (plan -> multi-source search/scrape ->
# synthesize -> cited report) backed entirely by our own infra: SearXNG for
# retrieval and vLLM for the LLM + embeddings. Exposes a REST/WebSocket API on
# :8000 (human/n8n facing). The kagent agentic pipeline (research-chief + workers)
# is the in-cluster MCP-driven alternative; wiring gpt-researcher INTO research-
# chief needs the gptr-mcp wrapper (MIT, no published image -> build) — TODO.
#
# Runs as root by default (writes reports under /usr/src/app) -> baseline PSA.
#
# VERIFY-BEFORE-DEPLOY: pin the image tag; set FAST/SMART/STRATEGIC_LLM and
# EMBEDDING to the EXACT vLLM --served-model-name values; confirm the embeddings
# service path. gpt-researcher fetches arbitrary web pages (egress to the internet
# + SSRF surface) — it is intentionally NOT exposed outside the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpt-researcher
  namespace: research
  labels:
    app.kubernetes.io/name: gpt-researcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gpt-researcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpt-researcher
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gpt-researcher
          # renovate: datasource=docker depName=gptresearcher/gpt-researcher
          image: gptresearcher/gpt-researcher:latest
          env:
            # --- LLM: routed through LiteLLM (central model layer) via aliases ---
            - name: OPENAI_BASE_URL
              value: "http://litellm.litellm.svc.cluster.local:4000/v1"
            - name: OPENAI_API_KEY
              value: "sk-noop"
            - name: FAST_LLM
              value: "openai:fast"
            - name: SMART_LLM
              value: "openai:smart"
            - name: STRATEGIC_LLM
              value: "openai:smart"
            # --- Retrieval: our SearXNG (JSON format already enabled) ---
            - name: RETRIEVER
              value: "searx"
            - name: SEARX_URL
              value: "http://searxng.searxng.svc.cluster.local:8080"
            # --- Embeddings: the `embeddings` alias (fixes the prior bge-m3 vs
            # bge-small mismatch — LiteLLM maps it to the served TEI model). ---
            - name: EMBEDDING
              value: "openai:embeddings"
            - name: EMBEDDING_KWARGS
              value: >-
                {"openai_api_base":"http://litellm.litellm.svc.cluster.local:4000/v1",
                "check_embedding_ctx_length":false}
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: outputs
              mountPath: /usr/src/app/outputs
            - name: logs
              mountPath: /usr/src/app/logs
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: outputs
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gpt-researcher
  namespace: research
  labels:
    app.kubernetes.io/name: gpt-researcher
spec:
  selector:
    app.kubernetes.io/name: gpt-researcher
  ports:
    - name: http
      port: 8000
      targetPort: 8000
