# TrueNAS storage classes are intentionally non-destructive by default.
# Dynamic provisioning may add or expand data, but it must never delete
# PVC-backed shares or NVMe-oF volumes without explicit human action.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-fast-nvmeof
provisioner: csi.truenas.io
parameters:
  protocol: "nvmeof"
  pool: "fast"
  datasetPath: "k8s/nvmeof"
  compression: "LZ4"
  volblocksize: "16K"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-fast-nfs
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  pool: "fast"
  datasetPath: "k8s/nfs"
  compression: "LZ4"
  nfs.mountOptions: "hard,nfsvers=4.1"
  nfs.rootSquash: "false"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-tank-nfs
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  pool: "tank"
  datasetPath: "k8s/nfs"
  compression: "LZ4"
  nfs.mountOptions: "hard,nfsvers=4.1"
  nfs.rootSquash: "false"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
---
# Per-workload StorageClasses.
#
# These exist for one reason: making TrueNAS datasets identifiable from the
# TrueNAS side. The dataset's leaf name is always pvc-<PV UID> and cannot be
# changed — the driver derives it from the CSI request name
# (volumeName := SanitizeVolumeName(req.Name) in pkg/driver/controller.go),
# which the external-provisioner generates as pvc-<uid>. The provisioner is
# even started with --extra-create-metadata, so the PVC's name and namespace
# ARE passed through in the parameters map, but the driver never reads any
# csi.storage.k8s.io/* key, so it cannot name the dataset after the claim.
#
# datasetPath is the one lever it does honour, so the PATH carries the meaning
# instead: fast/k8s/immich-db/pvc-<uid> rather than fast/k8s/nfs/pvc-<uid>.
# Add a class here for any workload whose data should be recognisable on the
# NAS. To map a UUID back to a workload from the cluster side:
#   kubectl get pv -o custom-columns=PV:.metadata.name,CLAIM:.spec.claimRef.namespace,NAME:.spec.claimRef.name
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-monitoring
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  pool: "fast"
  datasetPath: "k8s/monitoring"
  compression: "LZ4"
  nfs.mountOptions: "hard,nfsvers=4.1"
  nfs.rootSquash: "false"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-immich-db
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  pool: "fast"
  datasetPath: "k8s/immich-db"
  compression: "LZ4"
  nfs.mountOptions: "hard,nfsvers=4.1"
  nfs.rootSquash: "false"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
---
# The photo/video library: bulk data on the spinning pool, not the fast one.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-immich-library
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  pool: "tank"
  datasetPath: "k8s/immich-library"
  compression: "LZ4"
  nfs.mountOptions: "hard,nfsvers=4.1"
  nfs.rootSquash: "false"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
