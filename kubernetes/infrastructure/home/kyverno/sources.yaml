# Kyverno's chart repo (GitHub Pages). Same plain-HTTP HelmRepository style as
# the other app charts here; the Flux Kustomization in
# kubernetes/clusters/home/kyverno.yaml drives the HelmRelease.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 2h
  url: https://kyverno.github.io/kyverno/
