# GatewayConfig — the per-Gateway OpenTelemetry wiring for the external
# processor (extProc) pod. This is how the exporter reaches Phoenix.
#
# Direct EAG-extProc -> Phoenix OTLP (no collector pod):
#   - Endpoint http://phoenix-svc.phoenix.svc:6006 — Phoenix's OTLP/HTTP
#     listener. Per the phoenix HelmRelease, the UI + OTLP/HTTP share port
#     6006 and Phoenix accepts spans at /v1/traces on that port; there is no
#     separate 4318 listener. (OTLP/gRPC 4317 exists, but the OTel Go SDK
#     exporter env here uses the HTTP transport; 6006 is the documented and
#     simpler target.)
#   - OTEL_METRICS_EXPORTER=none — Phoenix ingests traces, NOT metrics
#     (the agent-router tracing doc is explicit about this). LLM metrics
#     still flow to the VictoriaMetrics stack via the built-in /metrics
#     Prometheus endpoint on the extProc pod (VMServiceScrape).
#
# OpenInference semantic conventions are the default (the tracing doc's
# default), which is exactly what Phoenix's evaluations consume, so no
# AI_GATEWAY_TRACING_SEMCONV override is set here.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: GatewayConfig
metadata:
  name: otel-phoenix
  namespace: aigateway
spec:
  extProc:
    kubernetes:
      env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://phoenix-svc.phoenix.svc:6006"
        - name: OTEL_METRICS_EXPORTER
          value: "none"
        # Map the agent-session-id request header to session.id on spans so
        # Phoenix can group multi-turn conversations (documented default
        # mapping — this just makes it explicit and testable).
        - name: OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT
          value: "8192"
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
