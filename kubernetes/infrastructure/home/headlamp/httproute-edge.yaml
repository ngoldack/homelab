# Headlamp behind authentik — now the ONLY path: the LAN twin route
# (httproute.yaml) was retired with the split-horizon design, so the
# cluster-admin-bound UI is identity-gated everywhere, which is what its
# old SECURITY NOTE anticipated. Backend is the edge outpost, not headlamp
# itself: the outpost checks the session, then proxies straight to
# headlamp's Service over the mesh.
#
# The cross-namespace reference is pre-authorized by the ReferenceGrant in
# ../authentik/httproutes-edge.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp-edge
  namespace: headlamp
spec:
  parentRefs:
    - name: edge
      namespace: network
      sectionName: https-apex
  hostnames:
    - headlamp.ngoldack.de
  rules:
    - backendRefs:
        - name: authentik-proxy
          namespace: authentik
          port: 9000
