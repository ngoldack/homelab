# talos-backup allowlist — namespace-scoped zero-trust policy.
#
# Stage 1 granularity: this namespace is one trust domain (all pods may talk to
# each other and to the monitoring scrapers), and everything crossing the
# namespace boundary is denied unless named below. That delivers the property
# this rollout is for — cross-namespace traffic off by default — without
# betting on a per-workload flow map that has to be re-derived every time the
# application's internals change. The pilot namespaces (paperless, immich,
# hindsight, headlamp, monitoring, registry, buildkit, cert-manager, network)
# use the finer per-workload split; any of these can be tightened to that shape
# later without moving the boundary.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: talos-backup-allowlist
  namespace: talos-backup
spec:
  endpointSelector:
    matchLabels: {}
  ingress:
    # In-namespace trust domain.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: talos-backup
    # Gateway-API ingress (reserved `ingress` identity) and kubelet probes
    # (reserved `health`).
    - fromEntities:
        - ingress
        - health
    # The monitoring scrape domain.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: talos-backup
    # The Kubernetes API (entity, control-plane VIP, in-cluster Service CIDR —
    # all three addressing forms are live in this cluster). The apid port
    # rides here too: the etcd-snapshot dial to default/talos resolves to the
    # control-plane node IP, which ipcache maps to the kube-apiserver identity
    # (verified in the 2026-09-18 cilium-agent ipcache on talos-919-w9u), and
    # toCIDRSet rules NEVER match a destination carrying a reserved identity
    # — the dedicated 50000 CIDR rules this replaces were therefore inert,
    # which is what kept talos-backup-29828237 (and every run after the
    # 2026-09-17
    # default-deny rollout) failing with "dial tcp 172.21.96.111:50000:
    # i/o timeout". Matching the entity by ports is the working form.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
            - {port: "50000", protocol: TCP}
    - toCIDRSet:
        - cidr: 10.30.0.10/32
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    - toCIDRSet:
        - cidr: 172.21.0.0/16
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    # (Historic note, kept for the record: dedicated 50000 toCIDRSet entries
    # for 172.21.0.0/16 and 10.30.0.10/32 were shipped on 2026-09-17/18 but
    # were proven inert at the datapath level — the service-VIP dial NATs to
    # the node IP, which ipcache maps to the reserved kube-apiserver identity,
    # and toCIDRSet never matches a destination carrying a reserved identity.
    # The job talos-backup-29828237 failure above is fully explained by that
    # shadowing, which is why the port moved into the toEntities rule.)
    # The Hetzner S3-compatible object storage backend.
    - toEntities:
        - world
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
