apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatekeeper
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: gatekeeper-system
  chart:
    spec:
      chart: gatekeeper
      version: "3.22.x"
      sourceRef:
        kind: HelmRepository
        name: gatekeeper
      interval: 1h
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values:
    # Safe validation config suited perfectly for a lightweight homelab
    replicas: 1
    auditInterval: 60
    postInstall:
      labelNamespace:
        enabled: true
