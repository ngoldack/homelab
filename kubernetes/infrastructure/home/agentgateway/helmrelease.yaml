# agentgateway control plane — the agentgateway-controller that processes
# AgentgatewayBackend / AgentgatewayPolicy CRs and programs the data-plane
# proxies from directives attached to a Gateway of GatewayClass agentgateway.
#
# Chart: agentgateway v1.5.0 (oci://cr.agentgateway.dev/charts). This lane
# only instantiates the control plane; the generated LB Service (spec.infrastructure
# in Gateway.spec) gets overriden by AgentgatewayParameters below.
#
# Values shaping:
# - resources: controller container resource requests/limits (TOP-LEVEL in this
#   chart, not controller.resources — verified from values.yaml).
# - nodeSelector: controller pod placement, TOP-LEVEL (chart maps it onto the
#   controller deployment; controller.nodeSelector is not a chart key).
# - controller.service.type: ClusterIP (controller metrics/service, distinct
#   from the data-plane LB Service, which AgentgatewayParameters shapes).
# - controller.replicaCount: 1.
# - install/upgrade remediation: retries 3.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
  namespace: agentgateway
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: agentgateway
      version: "v1.5.0"
      sourceRef:
        kind: HelmRepository
        name: agentgateway
        namespace: flux-system
      interval: 1h
  targetNamespace: agentgateway
  releaseName: agentgateway-controller
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # fullnameOverride keeps the controller's resources namespaced
    # (agentgateway-controller-*): the controller ALSO generates a per-Gateway
    # proxy Deployment named exactly after the Gateway (agentgateway), and the
    # default release-derived name would collide on that immutable
    # Deployment.spec.selector.
    fullnameOverride: agentgateway-controller
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    controller:
      replicaCount: 1
      service:
        type: ClusterIP
    nodeSelector:
      topology.homelab/site: home
