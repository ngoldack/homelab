# agentgateway control-plane UI Service. The UI is built into the agentgateway
# proxy and listens on 15000 (verified live: /ui/ -> 200, / -> 308); the
# controller-generated Service only publishes the Gateway listener port (80),
# so this separate Service exposes 15000 for the authentik proxy outpost
# (seed.yaml: agentgateway-ui-proxy -> agentgateway-ui:15000) to reach.
#
# Selects the HOME data plane (gateway-name=agentgateway): the outpost reaches
# it pod-to-pod over KubeSpan (measured reliable), and the UI is read-only
# config inspection for that proxy's routes/chains.
apiVersion: v1
kind: Service
metadata:
  name: agentgateway-ui
  namespace: agentgateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: agentgateway
    app.kubernetes.io/name: agentgateway
    gateway.networking.k8s.io/gateway-name: agentgateway
  ports:
    - name: ui
      port: 15000
      targetPort: 15000
      protocol: TCP
