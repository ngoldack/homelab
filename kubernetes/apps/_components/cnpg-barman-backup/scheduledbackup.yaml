# Daily base backup of a CloudNativePG cluster via the Barman Cloud plugin.
# Continuous WAL archiving (configured on the Cluster) provides PITR between
# bases. Identity fields are placeholders patched by each consuming app.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: APP_NAME-postgres-daily
  namespace: APP_NAMESPACE
spec:
  # 6-field cron (CNPG includes a seconds field). Daily at 01:00.
  schedule: "0 0 1 * * *"
  backupOwnerReference: self
  cluster:
    name: APP_NAME-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
