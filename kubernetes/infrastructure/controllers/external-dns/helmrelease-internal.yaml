# external-dns (internal) — publishes INTERNAL DNS records for ngoldack.xyz to the
# edge Technitium DNS via the built-in rfc2136 provider (dynamic DNS UPDATE + AXFR,
# authenticated with a TSIG key). Watches Gateway API HTTPRoutes but only those
# annotated `external-dns.target in (internal)`, so internal-only names are split
# from the public controller. Pinned to the Hetzner edge node.
#
# VERIFY-BEFORE-DEPLOY:
#   - Pin the chart version (1.x range below is a placeholder).
#   - Confirm the Technitium service `technitium.dns.svc.cluster.local:53` exists and
#     that TSIG dynamic updates + AXFR are enabled on it.
#   - TSIG keyname/secret are injected from the `technitium-tsig` Secret via the
#     EXTERNAL_DNS_* env equivalents of the --rfc2136-tsig-keyname/--rfc2136-tsig-secret
#     flags (external-dns maps every flag to an env var) so secrets stay out of args.
#     VERIFY these env names against the pinned external-dns version.
#   - `--rfc2136-zone` is required by the provider; set to the managed zone.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-internal
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: external-dns
  chart:
    spec:
      chart: external-dns
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: external-dns
      interval: 1h
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  values:
    provider:
      name: rfc2136
    extraArgs:
      - --rfc2136-host=technitium.dns.svc.cluster.local
      - --rfc2136-port=53
      - --rfc2136-zone=ngoldack.xyz
      - --rfc2136-tsig-secret-alg=hmac-sha256
      - --rfc2136-tsig-axfr
      - --annotation-filter=external-dns.target in (internal)
    # TSIG keyname + secret (the --rfc2136-tsig-keyname / --rfc2136-tsig-secret flags)
    # are provided via their env equivalents so they can be sourced from the Secret.
    env:
      - name: EXTERNAL_DNS_RFC2136_TSIG_KEYNAME
        valueFrom:
          secretKeyRef:
            name: technitium-tsig
            key: tsig-keyname
      - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
        valueFrom:
          secretKeyRef:
            name: technitium-tsig
            key: tsig-secret
    sources:
      - gateway-httproute
    domainFilters:
      - ngoldack.xyz
    policy: sync
    txtOwnerId: homelab-internal
    # Pin to the edge node.
    nodeSelector:
      node-role: edge
    tolerations:
      - key: node-role
        value: edge
        effect: NoSchedule
