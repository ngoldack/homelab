apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tns-csi-driver
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: storage
  chart:
    spec:
      chart: tns-csi
      version: "0.17.6"
      sourceRef:
        kind: HelmRepository
        name: tns-csi
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: Secret
      name: tns-csi-credentials
      valuesKey: apiKey
      targetPath: truenas.apiKey
  values:
    truenas:
      url: wss://YOUR-TRUENAS-IP:443/api/current  # TODO: set to your TrueNAS API websocket endpoint

    # Storage tiers managed by the CSI driver. Nodes are interconnected at 10GbE.
    # - tns-tank-nfs:    tank (HDD) over NFS — huge files / media libraries (Emby)
    # - tns-fast-nfs:    fast (NVMe) over NFS — default tier for config/general PVCs
    # - tns-fast-nvmeof: fast (NVMe) over NVMe-oF — databases / high-performance block
    storageClasses:
      - name: tns-tank-nfs
        protocol: nfs
        pool: tank
        defaultClass: false
      - name: tns-fast-nfs
        protocol: nfs
        pool: fast
        defaultClass: true
      - name: tns-fast-nvmeof
        protocol: nvmeof
        pool: fast
        defaultClass: false
