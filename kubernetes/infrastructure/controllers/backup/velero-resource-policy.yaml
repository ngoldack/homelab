# Velero volume resource policy: skip filesystem (Kopia) backup of database and
# Valkey volumes. The tns-fast-nvmeof StorageClass is used exclusively by
# CloudNativePG and Valkey (see AGENTS.md storage tiers), whose state is backed up
# out-of-band (CNPG via the Barman Cloud plugin -> S3). Filesystem-copying a running
# Postgres data directory yields crash-inconsistent, unsupported backups, so Velero
# skips those volumes and only protects the Kubernetes objects + non-DB PVCs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: velero-volume-policy
  namespace: velero
data:
  policy.yaml: |
    version: v1
    volumePolicies:
      - conditions:
          storageClass:
            - tns-fast-nvmeof
        action:
          type: skip
