# LiteLLM holds the only key gating the vLLM backends, so restrict who can reach
# it. Ingress is limited to its consumers (Khoj, n8n) and the node (kubelet
# probes). Egress is left open so LiteLLM can reach the KEDA http-add-on
# interceptor that fronts the on-demand vLLM models.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm
  namespace: litellm
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  ingress:
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: khoj
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: n8n
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
