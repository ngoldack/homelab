apiVersion: v1
kind: Namespace
metadata:
  name: docling
---
# Docling (docling-serve) — document parsing API (PDF/DOCX/XLSX/PPTX -> structured
# content) used by the researcher / document agents via its MCP wrapper. Models
# are cached in an emptyDir (downloaded on first use).
#
# VERIFY-BEFORE-DEPLOY: pin a docling-serve image tag and confirm the port (5001)
# + any required env (https://github.com/docling-project/docling-serve).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docling
  namespace: docling
  labels:
    app.kubernetes.io/name: docling
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docling
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docling
    spec:
      containers:
        - name: docling-serve
          # renovate: datasource=docker depName=ghcr.io/docling-project/docling-serve
          image: ghcr.io/docling-project/docling-serve:v0.10.0
          env:
            - name: DOCLING_SERVE_ENABLE_UI
              value: "false"
          ports:
            - name: http
              containerPort: 5001
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: models
              mountPath: /opt/app-root/src/.cache
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: models
          emptyDir:
            sizeLimit: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: docling
  namespace: docling
  labels:
    app.kubernetes.io/name: docling
spec:
  selector:
    app.kubernetes.io/name: docling
  ports:
    - name: http
      port: 5001
      targetPort: 5001
