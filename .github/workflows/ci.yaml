name: CI

# Offline validation only. Runs on every PR and on pushes to main.
# Requires NO secrets, kubeconfig, VPN, or Proxmox access - these are the
# required branch-protection checks. Anything needing private network access
# (tofu plan/apply, flux reconcile) lives in the tofu-* workflows.
#
# Each gate is an independent Dagger function, run here as a matrix so every
# gate is its own GitHub check (granular branch protection + independent
# re-run). The exact same gates run locally, either individually
# (`dagger call kube-validate`) or all at once (`dagger call check`).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate:
          - yamllint
          - actionlint
          - sops-check
          - tofu-validate
          - tofu-security
          - kube-validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: ${{ matrix.gate }} (Dagger)
        uses: dagger/dagger-for-github@v8.3.0
        with:
          verb: call
          args: ${{ matrix.gate }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
