# Hindsight agent memory: CNPG/pgvector + the agentgateway's synthetic LLM
# lane (the local P100 model it started on was removed 2026-09-22).
# Depends on cnpg-operator for the Cluster/Database CRDs and on network for
# the Gateway its routes attach to (same edges as immich/authentik).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hindsight
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/infrastructure/home/hindsight
  prune: true
  wait: false
  timeout: 15m
  retryInterval: 2m
  dependsOn:
    - name: cnpg-operator
    - name: network
    # VMServiceScrape CRDs for the metrics scrape (hindsight/vm-scrapes.yaml)
    - name: monitoring-crds
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
