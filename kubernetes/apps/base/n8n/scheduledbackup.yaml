# Daily base backup of n8n-postgres via the Barman Cloud plugin.
# Continuous WAL archiving (configured on the Cluster) provides PITR between bases.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: n8n-postgres-daily
  namespace: n8n
spec:
  # 6-field cron (CNPG includes a seconds field). Daily at 01:00.
  schedule: "0 0 1 * * *"
  backupOwnerReference: self
  cluster:
    name: n8n-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
