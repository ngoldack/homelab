# Key-authenticated variant of the chat chain: /v1/key/chat/completions
# routes to the same chat-chain backend, but its route-scoped policy
# (policy-apikey.yaml) accepts a static API key instead of an authentik JWT.
# Used by CLI consumers (opencode) whose base URL ends in /v1/key.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: local-llm-key
  namespace: agentgateway
spec:
  parentRefs:
    - name: agentgateway
      namespace: agentgateway
  rules:
    # Coding model: DeepSeek V4.1 Flash (OpenRouter).
    - matches:
        - path:
            type: PathPrefix
            value: /v1/key/chat
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: openrouter-deepseek-v41-flash
    # Free model: Union Alpha (OpenRouter stealth).
    - matches:
        - path:
            type: PathPrefix
            value: /v1/key/free
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: openrouter-union-alpha
