# TrueNAS storage classes are intentionally non-destructive by default.
# Dynamic provisioning may add or expand data, but it must never delete
# PVC-backed shares or NVMe-oF volumes without explicit human action.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-fast-nvmeof
provisioner: csi.truenas.io
parameters:
  protocol: "nvmeof"
  pool: "fast"
  datasetPath: "k8s/nvmeof"
  compression: "LZ4"
  volblocksize: "16K"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-fast-nfs
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  pool: "fast"
  datasetPath: "k8s/nfs"
  compression: "LZ4"
  nfs.mountOptions: "hard,nfsvers=4.1"
  nfs.rootSquash: "false"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-tank-nfs
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  pool: "tank"
  datasetPath: "k8s/nfs"
  compression: "LZ4"
  nfs.mountOptions: "hard,nfsvers=4.1"
  nfs.rootSquash: "false"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
---
# Per-app StorageClasses.
#
# Layout is always {pool}/k8s/{protocol}/{app}/pvc-<uid>, so the three generic
# classes above land at e.g. fast/k8s/nfs/pvc-<uid> and these add the app
# segment: fast/k8s/nfs/immich/pvc-<uid>.
#
# Why a class per app rather than one knob: datasetPath is a StorageClass
# parameter, and it is the ONLY naming lever the driver exposes. The leaf name
# cannot carry the app either — the driver derives it from the CSI request
# name (volumeName := SanitizeVolumeName(req.Name) in pkg/driver/controller.go)
# which the external-provisioner generates as pvc-<uid>. The provisioner does
# run with --extra-create-metadata, so the PVC's name and namespace ARE in the
# parameters map, but the driver reads no csi.storage.k8s.io/* key and its
# dataset Comment is hardcoded to "CSI volume <path>" with no override. So one
# class per (pool, protocol, app) is the cost of an identifiable path.
#
# Name them truenas-{pool}-{protocol}-{app}. To map a UUID back to a workload:
#   kubectl get pv -o custom-columns=PV:.metadata.name,NS:.spec.claimRef.namespace,CLAIM:.spec.claimRef.name
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-fast-nfs-monitoring
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  pool: "fast"
  datasetPath: "k8s/nfs/monitoring"
  compression: "LZ4"
  nfs.mountOptions: "hard,nfsvers=4.1"
  nfs.rootSquash: "false"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
---
# Immich's Postgres. Fast pool.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-fast-nfs-immich
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  pool: "fast"
  datasetPath: "k8s/nfs/immich"
  compression: "LZ4"
  nfs.mountOptions: "hard,nfsvers=4.1"
  nfs.rootSquash: "false"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
---
# Immich's photo/video library: bulk media on the spinning pool. Same app
# segment as above — the pool is what separates them, so both read as
# .../k8s/nfs/immich/ on their respective pools.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-tank-nfs-immich
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  pool: "tank"
  datasetPath: "k8s/nfs/immich"
  compression: "LZ4"
  nfs.mountOptions: "hard,nfsvers=4.1"
  nfs.rootSquash: "false"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
