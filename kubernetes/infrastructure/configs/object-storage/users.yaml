# Service users. The provider generates the secret key and writes a connection
# secret (keys AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) into the consumer
# namespace. Endpoint is supplied out-of-band (KServe global s3 config / app env).
apiVersion: minio.crossplane.io/v1
kind: User
metadata:
  name: vllm
spec:
  forProvider:
    userName: vllm
    policies:
      - vllm-models-rw
  providerConfigRef:
    name: minio-provider
  writeConnectionSecretToRef:
    name: vllm-s3-credentials
    namespace: vllm
---
apiVersion: minio.crossplane.io/v1
kind: User
metadata:
  name: authentik-media
spec:
  forProvider:
    userName: authentik-media
    policies:
      - authentik-media-rw
  providerConfigRef:
    name: minio-provider
  writeConnectionSecretToRef:
    name: authentik-media-credentials
    namespace: authentik
