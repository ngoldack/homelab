# 30 — Summarizer Agent: concise, accurate text summarization and rewriting.
# No external MCPs required (pure model task).
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: summarizer-agent
  namespace: kagent
spec:
  type: Declarative
  description: "Summarizes and rewrites text concisely and accurately."
  declarative:
    modelConfig: local-qwen-main
    systemMessage: |
      You summarise and rewrite text concisely and accurately. Preserve key
      facts, drop filler, and match the requested length and format. When asked
      for structure (bullets/tables), produce clean, scannable output.
