# ReferenceGrant allowing the agentgateway policy (wired via JWT policy) to reach
# the authentik-server Service from the aigateway namespace.

---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-agentgateway-jwks-to-authentik-server
  namespace: authentik
spec:
  from:
    - group: agentgateway.dev
      kind: AgentgatewayPolicy
      namespace: agentgateway
  to:
    - group: ""
      kind: Service
      name: authentik-server
