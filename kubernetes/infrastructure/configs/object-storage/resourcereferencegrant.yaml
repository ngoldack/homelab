# Permits namespaced S3 CRDs (Bucket / S3Identity / S3Credentials) in any
# application namespace to reference the `seaweedfs` cluster here via their
# cross-namespace seaweedRef/clusterRef. Gateway-API ReferenceGrant semantics:
# the grant lives in the *target* namespace (the cluster's). An empty
# namespaceSelector matches every namespace — acceptable for this single-tenant
# homelab; tighten with matchLabels if multi-tenant isolation is ever needed.
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: allow-app-s3-refs
  namespace: seaweedfs
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: Bucket
      namespaceSelector: {}
    - group: seaweed.seaweedfs.com
      kind: S3Identity
      namespaceSelector: {}
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespaceSelector: {}
  to:
    - group: seaweed.seaweedfs.com
      kind: Seaweed
