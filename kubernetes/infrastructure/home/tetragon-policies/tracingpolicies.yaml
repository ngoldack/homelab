# Tetragon tracing policies.
#
# Design decision, recorded here because it is the difference between a
# security tool and an outage: **nothing in this file blocks anything.** Every
# selector ends in the default `Post` (event) action.
#
# Why: the pilot namespaces proved that the Kubernetes API is reached by
# basically everything that matters — the CNPG instance managers report status
# through it, vmagent does service discovery through it, the operators watch
# their CRs through it, and every one of those clients reads the very
# service-account token this policy watches. A Sigkill on token reads is
# therefore an outage generator, not an exfil control. It is safe only in a
# namespace with *verified* zero API egress, and on this cluster the sandbox
# namespace grants API egress on purpose (see
# ../hermes-sandbox/cilium-policy.yaml — it allows the service CIDR), so no
# namespace currently qualifies. Flip a selector to `Sigkill` here only after
# proving that namespace has no API egress.
#
# Note process_exec events (every execve, with arguments) are emitted by
# Tetragon's base sensor already — no policy is needed for exec auditing.
#
# A `sa-token-read-monitor` policy for hermes-sandbox was removed on
# 2026-09-17 after the review showed it could never fire: Kata sandbox pods run
# with `automountServiceAccountToken: false`, so
# /var/run/secrets/kubernetes.io/serviceaccount/ does not exist inside them and
# the fd_install selector has nothing to match (0 events in the retained
# window). The real control there is the absent token, not a tracing policy.
# Re-add it if sandboxes ever gain automounted tokens.
---
# Host-sensitive file writes, cluster-wide. /etc, /etc/shadow and the root
# SSH keys are the classic persistence targets; on an immutable Talos host any
# write here is either a bug or an attack.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sensitive-host-files
spec:
  kprobes:
    - call: "security_file_permission"
      syscall: false
      args:
        - index: 0
          type: "file"
        - index: 1
          type: "int"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Prefix"
              values:
                - "/etc/passwd"
                - "/etc/shadow"
                - "/etc/sudoers"
                - "/root/.ssh/"
          matchActions:
            - action: Post
---
