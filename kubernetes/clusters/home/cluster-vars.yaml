apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-vars
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/clusters/home/cluster-vars
  prune: true
  wait: true
  timeout: 5m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # No postBuild.substituteFrom here: this Kustomization is what CREATES
  # ConfigMap/cluster-vars. Referencing it as a (non-optional) substitution
  # source makes it depend on its own output — Flux resolves variables before
  # applying, so on a fresh cluster the first reconcile fails on the missing
  # ConfigMap and can never create it. Consumers substitute from it instead.
