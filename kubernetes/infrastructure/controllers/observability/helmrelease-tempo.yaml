apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: monitoring
  chart:
    spec:
      chart: tempo
      version: "1.24.4"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1h
  # The S3 credentials (tempo-s3-credentials) are provisioned by the SeaweedFS
  # operator (S3Credentials CRD in tempo-s3.yaml) in infra-configs, which depends
  # on infra-controllers. disableWait keeps this HelmRelease from blocking
  # infra-controllers readiness on the Tempo pod, which crash-loops until that
  # connection secret/bucket exists (then self-heals).
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    tempo:
      # Persist WAL/local cache on fast NFS; durable trace blocks live in SeaweedFS.
      storage:
        trace:
          backend: s3
          s3:
            bucket: tempo-traces
            # In-cluster SeaweedFS S3 gateway (plain HTTP, path-style).
            endpoint: seaweedfs-s3.seaweedfs.svc.cluster.local:8333
            insecure: true
            forcepathstyle: true
          wal:
            path: /var/tempo/wal
      # Static keys omitted on purpose: the s3 backend falls back to the AWS
      # credential chain, picking up AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
      # injected from the SeaweedFS-managed connection secret below.
      extraEnvFrom:
        - secretRef:
            name: tempo-s3-credentials
      reportingEnabled: false
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    persistence:
      enabled: true
      storageClassName: tns-fast-nfs
      accessModes:
        - ReadWriteOnce
      size: 10Gi
