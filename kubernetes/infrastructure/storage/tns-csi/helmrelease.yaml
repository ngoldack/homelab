apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tns-csi-driver
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: storage
  chart:
    spec:
      chart: tns-csi
      version: "0.17.6"
      sourceRef:
        kind: HelmRepository
        name: tns-csi
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: Secret
      name: tns-csi-credentials
      valuesKey: apiKey
      targetPath: truenas.apiKey
  values:
    truenas:
      url: wss://YOUR-TRUENAS-IP:443/api/current
    
    # Pre-scaffolded StorageClasses managed by the CSI Driver
    storageClasses:
      - name: tns-csi-fast-nfs
        protocol: nfs
        pool: fast
      - name: tns-csi-fast-nvmeof
        protocol: nvmeof
        pool: fast
        enabled: false # Comment out or disable as per preference
      - name: tns-csi-tank-nfs
        protocol: nfs
        pool: tank