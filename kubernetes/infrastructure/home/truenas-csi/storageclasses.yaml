# Zot's blob store (../registry/). Container layers: written once by a build,
# then read whole on every pull. Compression is OFF because registry blobs are
# already gzip/zstd-compressed tarballs — LZ4 over them burns CPU for
# essentially no ratio, unlike the GGUF and Postgres cases above.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-fast-nfs-registry-zot
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  pool: "fast"
  datasetPath: "k8s/nfs/registry/zot"
  compression: "OFF"
  nfs.mountOptions: "hard,nfsvers=4.1"
  nfs.rootSquash: "false"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
