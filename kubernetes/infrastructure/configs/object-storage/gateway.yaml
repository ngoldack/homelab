# External S3 endpoint for browser-reachable, presigned object URLs (e.g.
# Authentik media). cert-manager issues the listener cert via the production
# ClusterIssuer; traffic terminates TLS at the Cilium Gateway and forwards to the
# in-cluster SeaweedFS S3 gateway service on plain HTTP (port 8333).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: s3-gateway
  namespace: seaweedfs
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "s3.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "s3.${DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: s3-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: s3
  namespace: seaweedfs
spec:
  parentRefs:
    - name: s3-gateway
  hostnames:
    - s3.${DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: seaweedfs-s3
          port: 8333
