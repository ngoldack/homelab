# matrix-bots-bootstrap — the one-shot Job that configures the Hermes bots in
# MAS (see bootstrap.sh in the ConfigMap next to this file for the logic).
#
# WHY A JOB: creating the bot accounts is a mutation of the deployed auth
# service, it must be re-runnable (it checks existence first), and its output
# (per-bot access tokens + the shared room id) has to be captured rather than
# printed into a log. A Job gives all three: an auditable run, a recorded exit
# status, and a single Secret as the hand-off to SOPS.
#
# WHAT IT DOES NOT DO: it never writes to hermes-agents-secret (that file is
# SOPS-managed in git, and a live write would silently drift from git). It
# publishes `matrix-bots-bootstrap`; the operator copies the values into
# hermes-agents/secret.sops.yaml, rolls the agents and deletes the Secret.
#
# NAME SUFFIX: Jobs are immutable, so editing the script or this spec requires a
# new suffix here (s1 -> s2). Flux cannot patch an existing Job's pod template.
apiVersion: batch/v1
kind: Job
metadata:
  name: matrix-bots-bootstrap-s1
  namespace: matrix
  labels:
    app.kubernetes.io/name: matrix-bots-bootstrap
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-bots-bootstrap
    spec:
      serviceAccountName: matrix-bots-bootstrap
      restartPolicy: Never
      securityContext:
        # matrix enforces PSA `restricted`; the Job runs as an unprivileged,
        # non-root identity with a read-only root filesystem and only /tmp
        # writable (kubectl wants a writable HOME for its cache).
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: alpine/k8s@sha256:358ddfc2d6ff3f00dd461dbd79aaa6d6738709f225b8da0945bb63bd4dbc304e
          command: ["/bin/sh", "/scripts/bootstrap.sh"]
          env:
            - name: NS_MATRIX
              value: matrix
            - name: BOTS
              value: dave chad lindner marius
            - name: SYNAPSE
              value: http://matrix-synapse.matrix.svc.cluster.local:8008
            - name: OUTPUT_SECRET
              value: matrix-bots-bootstrap
            - name: ROOM_ALIAS_LOCALPART
              value: agent-hq
            - name: ROOM_NAME
              value: Agent HQ
            - name: SERVER_NAME
              value: matrix.ngoldack.de
            # Nicolas's Matrix account: invited to the room, not an allowlist
            # entry (the agents' side is MATRIX_ALLOWED_USERS in their own
            # secret). Not sensitive; it is already in the repo.
            - name: OPERATOR_MXID
              value: "@nicolas.matrix:matrix.ngoldack.de"
            # `true` mints fresh tokens (which invalidates the ones the running
            # agents hold) — flip only deliberately, and roll the agents after.
            - name: REISSUE
              value: "false"
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: matrix-bots-bootstrap-script
            defaultMode: 0555
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
