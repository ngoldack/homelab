apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: velero
  chart:
    spec:
      chart: velero
      version: "12.0.x"
      sourceRef:
        kind: HelmRepository
        name: velero
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Use AWS plugin for standard S3 compatible endpoints
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.14.1
        volumeMounts:
          - mountPath: /plugins
            name: plugins

    # S3-compatible Backup Storage Location
    configuration:
      backupStorageLocation:
        - name: truenas-rustfs
          provider: aws
          bucket: k8s-backups-rustfs
          default: true
          config:
            region: us-east-1
            s3ForcePathStyle: true
            # TrueNAS RustFS S3 endpoint (canonical internal hostname).
            s3Url: http://nas-main.server:9000

      # Use Kopia as the default volumes file-system uploader (modern, faster, and more robust than restic)
      defaultVolumesToFsBackup: true
      uploaderType: kopia

    # Credentials mount configuration
    credentials:
      useSecret: true
      name: velero-s3-credentials
      secretContents: {}

    # Node agent is required to back up Persistent Volumes directly at the filesystem level (Restic/Kopia)
    deployNodeAgent: true

    # Declare backup schedules
    schedules:
      daily-backup:
        disabled: false
        schedule: "0 2 * * *" # Every day at 2:00 AM
        template:
          ttl: 240h # Retain backups for 10 days
          includedNamespaces:
            - "*"
          storageLocation: truenas-rustfs
          # Skip filesystem backup of CNPG/Valkey volumes (tns-fast-nvmeof); their
          # state is owned by the Barman Cloud plugin. See velero-resource-policy.yaml.
          resourcePolicy:
            kind: configmap
            name: velero-volume-policy
