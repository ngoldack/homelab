# Let's Encrypt (production) ClusterIssuer using DNS-01 via the Hetzner webhook
# (controllers/cert-manager-webhook-hetzner). DNS-01 issues the wildcard cert
# without any public HTTP challenge. ${ACME_EMAIL} is substituted by infra-configs.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-hetzner-dns
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-hetzner-dns-key
    solvers:
      - dns01:
          webhook:
            groupName: hetzner.cert-mananger-webhook.noshoes.xyz
            solverName: hetzner
            config:
              secretName: hetzner-secret
              apiUrl: https://dns.hetzner.com/api/v1
