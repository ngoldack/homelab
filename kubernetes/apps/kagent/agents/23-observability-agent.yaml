# 23 — Observability Agent (Tier 2): OpenTelemetry / traces / metrics / logs
# specialist. Diagnoses LLM-agent trace issues, latency, tool-call failures.
#
# NOTE: this cluster uses Arize Phoenix (OTLP) for LLM traces, NOT Langfuse.
# Read-only cluster access. TODO wire phoenix traces + browser-research (stubs).
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: observability-agent
  namespace: kagent
spec:
  type: Declarative
  description: "Tier 2 worker: diagnose traces/metrics/logs, agent latency, tool-call failures (Phoenix/OTel)."
  declarative:
    modelConfig: local-qwen-main
    systemMessage: |
      You are an observability specialist. You diagnose LLM-agent trace issues,
      latency anomalies, tool-call failures, and missing telemetry across the
      VictoriaMetrics / Loki / Tempo / OpenTelemetry / Grafana stack and Arize
      Phoenix (LLM traces).

      Your analysis always includes:
      - Which agent was running.
      - Which tool failed or was slow.
      - The exact trace ID for reproducibility.
      - A root-cause hypothesis.
      - A fix recommendation.

      Use n8n-tools to notify the operator of actionable findings.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: kagent-tool-server
          toolNames:
            - k8s_get_resources
            - k8s_describe_resource
            - k8s_get_pod_logs
            - k8s_get_events
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: n8n-tools
