apiVersion: v1
kind: Namespace
metadata:
  name: gotenberg
---
# Gotenberg — stateless HTML/Markdown/Office -> PDF conversion API (used by the
# document-author agent via its MCP wrapper). Official OSS image; no persistence.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg
  namespace: gotenberg
  labels:
    app.kubernetes.io/name: gotenberg
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gotenberg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gotenberg
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gotenberg
          # renovate: datasource=docker depName=gotenberg/gotenberg
          image: gotenberg/gotenberg:8
          args:
            - "gotenberg"
            - "--api-port=3000"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gotenberg
  namespace: gotenberg
  labels:
    app.kubernetes.io/name: gotenberg
spec:
  selector:
    app.kubernetes.io/name: gotenberg
  ports:
    - name: http
      port: 3000
      targetPort: 3000
