# The destination side of the metric push. Declared here rather than in
# ../monitoring/cilium-allowlist.yaml because it exists only for the drills;
# Flux ownership is per object, so monitoring's own Kustomization neither owns
# nor prunes it. monitoring-scrapers-allowlist admits in-namespace peers, the
# kubelet and the API server to vmsingle, and nothing else — without this rule
# the drill's import POST is dropped (fail-closed, by design) and the drill
# metrics would silently never arrive.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-vmsingle-restore-drill-import
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmsingle
      app.kubernetes.io/instance: monitoring-victoria-metrics-k8s-stack
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-restore-drills
      toPorts:
        - ports:
            - {port: "8428", protocol: TCP}
