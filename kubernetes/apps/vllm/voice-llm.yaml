apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llama-3-2-3b
  namespace: vllm
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    # Always-on; no autoscaler (fixed single replica for Home Assistant voice).
    serving.kserve.io/autoscalerClass: none
    serving.kserve.io/secretName: vllm-s3-credentials
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    nodeSelector:
      ai: "true"
    tolerations:
      - key: "ai"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    model:
      modelFormat:
        name: huggingface
      storageUri: "s3://vllm-models/llama-3.2-3b"
      runtime: kserve-vllmserver
      args:
        - "--device=cpu"
        - "--dtype=bfloat16"
        - "--max-model-len=4096"
        - "--max-num-seqs=16"
      env:
        # Pin to E-cores (16-27) so always-on voice never contends with the
        # P-cores reserved for the heavy on-demand models.
        - name: VLLM_CPU_OMP_THREADS_BIND
          value: "16-27"
        - name: VLLM_CPU_KVCACHE_SPACE
          value: "4"
      resources:
        requests:
          cpu: "4"
          memory: "8Gi"
        limits:
          cpu: "8"
          memory: "14Gi"
      storageSpec:
        storageClassName: tns-csi-fast-nfs
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
