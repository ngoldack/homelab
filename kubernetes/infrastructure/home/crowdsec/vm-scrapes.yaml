# VMServiceScrapes so vmagent (selectAllByDefault) collects CrowdSec metrics.
# The prometheus-operator ServiceMonitors the chart would render are OFF in
# helmrelease.yaml/bouncer.yaml (those CRDs do not exist here), so these are
# the sole scrape wiring, picked up with no label plumbing.
#
# Ports/labels are what the charts set: lapi Service app=crowdsec-service
# (:6060), agent Service app=crowdsec-agent-service (:6060), and the bouncer
# Service (app.kubernetes.io/name=envoy-proxy-bouncer) exposing :9090.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: crowdsec-lapi
  namespace: crowdsec
spec:
  endpoints:
    - port: "6060"
  selector:
    matchLabels:
      app: crowdsec-service
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: crowdsec-agent
  namespace: crowdsec
spec:
  endpoints:
    - port: "6060"
  selector:
    matchLabels:
      app: crowdsec-agent-service
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: crowdsec-bouncer
  namespace: crowdsec
spec:
  endpoints:
    - port: "9090"
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy-proxy-bouncer
