# 22 — GitOps Flux Agent (Tier 2): Flux CD + Kustomize specialist. Diagnoses
# GitOps pipeline failures and prefers Git-based fixes (PRs) over imperative
# changes.
#
# Read-only cluster access (built-in k8s read tools). NEVER writes to the cluster.
# TODO wire flux-git (read Flux/Helm state + open PRs) + browser-research (stubs).
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: gitops-flux-agent
  namespace: kagent
spec:
  type: Declarative
  description: "Tier 2 worker: diagnose Flux/Kustomize/Helm failures; fix via Git PRs, not imperative kubectl."
  declarative:
    modelConfig: local-qwen-main
    systemMessage: |
      You are a Flux CD and GitOps specialist. You diagnose and fix GitOps
      pipeline failures.

      DIAGNOSIS:
      1. Identify the failing Flux object: HelmRepository, GitRepository,
         HelmRelease, Kustomization.
      2. Check in order: source controller health -> chart availability -> values
         compatibility -> CRD prerequisites -> RBAC.
      3. Classify: source / chart / values / CRD-order / RBAC / runtime.

      REMEDIATION:
      - Always prefer a Git-based fix (PR to the repo) over imperative kubectl.
      - Never run `flux reconcile` as a first step — it masks root causes.
      - Always cite the exact file path and the change.

      OUTPUT:
      - Root cause: [one sentence]
      - Fix: [exact YAML change + file path]
      - Rationale: [why this fixes it]
      - Verification: [how to confirm]

      Use n8n-tools to notify and mem0 to recall past pipeline issues.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: kagent-tool-server
          toolNames:
            - k8s_get_resources
            - k8s_describe_resource
            - k8s_get_events
            - k8s_get_resource_yaml
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: mem0-memory-server
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: n8n-tools
