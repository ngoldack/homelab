# Agent chains: one Synthetic provider per agent tier, no fallback.
#
# Provider stanzas are verbatim copies of the single-provider Synthetic
# backends in backends.yaml (keep in sync). The OpenRouter group each chain
# used to end with was removed 2026-09-22 for cost, so every chain here now
# has one group and no failover target.
#
# The `groups` shape is deliberately kept: it is what
# policy-agent-chains-health.yaml targets (the proxy's 503 evicts the
# provider), and more than one provider inside a group is intra-group
# failover, so a second Synthetic key would slot in here without
# re-plumbing the chain.
#
# Eviction is driven by policy-agent-chains-health.yaml: a 5xx from the
# proxy evicts the answering synthetic provider for 5 minutes. Without that
# policy, backends are never evicted and these groups are dead weight.
---
# general-purpose: the default agent model — Synthetic DeepSeek V4.1 Flash.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: general-purpose-chain
  namespace: agentgateway
spec:
  ai:
    groups:
      - providers:
          - name: general-purpose-synthetic
            host: synthetic-proxy.agentgateway.svc.cluster.local
            port: 8080
            path: /v1/chat/completions
            openai:
              model: hf:deepseek-ai/DeepSeek-V4.1-Flash
            policies:
              auth:
                secretRef:
                  name: synthetic-key
