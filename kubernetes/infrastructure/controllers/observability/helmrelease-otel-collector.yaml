apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: monitoring
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.158.x"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    mode: daemonset
    # Node-local agent: ships pod/host logs and host metrics. Application traces
    # and OTLP telemetry go to the otel-gateway (deployment) for tail sampling.

    # Must run on EVERY node, including tainted ones (control-plane, ai, edge),
    # or those nodes' container logs never reach Loki. A node-local log/metric
    # agent tolerating all taints is the standard pattern.
    tolerations:
      - operator: Exists

    # contrib distro: includes filelog, hostmetrics, k8sattributes,
    # prometheusremotewrite (the chart requires image.repository to be set).
    image:
      repository: otel/opentelemetry-collector-contrib

    presets:
      logsCollection:
        enabled: true
      hostMetrics:
        enabled: true
      kubernetesAttributes:
        enabled: true

    config:
      exporters:
        prometheusremotewrite:
          endpoint: "http://victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/write"
          tls:
            insecure: true
        otlphttp/loki:
          # Loki ingests OTLP over HTTP at the /otlp path (not gRPC on 3100).
          endpoint: "http://loki.monitoring.svc.cluster.local:3100/otlp"
          tls:
            insecure: true

      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

      processors:
        batch: {}
        memory_limiter:
          check_interval: 1s
          limit_percentage: 75
          spike_limit_percentage: 15

      service:
        pipelines:
          metrics:
            receivers: [otlp, hostmetrics]
            processors: [memory_limiter, k8sattributes, batch]
            exporters: [prometheusremotewrite]
          logs:
            receivers: [otlp, filelog]
            processors: [memory_limiter, k8sattributes, batch]
            exporters: [otlphttp/loki]

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
