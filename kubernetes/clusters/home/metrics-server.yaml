# metrics-server — serves the Kubernetes Metrics API (v1beta1.metrics.k8s.io).
#
# This is what fills Headlamp's NATIVE per-pod CPU/memory usage column (the
# apiserver proxies /apis/metrics.k8s.io/* to metrics-server's APIService).
# It is distinct from the Prometheus graphs Headlamp shows from VictoriaMetrics
# (vlsingle) — metrics-server is the metrics.k8s.io provider, VM is the PromQL
# datastore. Headlamp needs BOTH: metrics-server for the in-dashboard usage
# column, vlsingle for the Prometheus plugin graphs.
#
# Ordering: needs cert-manager (the HelmRelease depends on it), and the shared
# HelmRepository (metrics-server in ../sources.yaml, applied by
# infra-controllers).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/infrastructure/home/metrics-server
  prune: true
  wait: true
  timeout: 10m
  retryInterval: 2m
  dependsOn:
    - name: infra-controllers
      namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
