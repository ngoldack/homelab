# Build + SIGN the hermes-egress-guard image — the ONE binary behind both egress
# services (authorizer + reaper), a stdlib-only Go port of the former Python
# `egress_guard` package. The image entrypoint is the single Go binary /guard,
# which selects its role from the FIRST argv (`authorizer` | `reaper`); there is
# no EGRESS_ROLE env. The image is IDENTICAL for both roles, so the digest this
# Job prints is the same artifact hermes-egress-reaper.yaml builds and pushes.
#
# BUILD SHAPE — the build context is THIS REPO at the pinned commit and the
# Dockerfile is fetched from that tree by path, exactly like llama-kv-broker.yaml:
# `--opt=context=<repo>#<sha>` plus `--opt=filename=<repo-relative Dockerfile>`,
# and the Dockerfile's COPY sources are repo-relative.
# ACTION REQUIRED — the context SHA below (4cb8c87, 2026-09-18) PREDATES the Go
# port: the Dockerfile in that tree is the former Python one, so running this Job
# as written rebuilds the PYTHON image. Bump the context SHA to a commit whose tree
# carries the Go sources (image-builds/hermes-egress-guard/{go/,go.mod,Dockerfile})
# — together with the --output tag and the Job name suffix — then run it; THAT build
# produces the Go image. Never run it against the old SHA and re-pin the result.
#
# SIGNING — the job runs the docs/hermes-review.md Unit 4.2 pipeline against the
# pushed DIGEST: trivy CRITICAL gate -> CycloneDX SBOM (attached with cosign) ->
# SLSA provenance attestation -> signature LAST (--tlog-upload=false everywhere).
# An image that fails the gate is left UNSIGNED and the Job fails loudly, so the
# digest is never re-pinned. cosign-linux-amd64 v2.4.3 = sha256 caaad125…4708;
# trivy v0.74.0 Linux-64bit tarball = sha256 2ae6fe3e…4371a (same trivy version
# as the image-scan loop). The cosign private key is the SOPS-encrypted
# cosign-signing-key secret (ns buildkit), mounted read-only; COSIGN_PASSWORD
# comes from the password item in the same secret. None of this is new work —
# only the Dockerfile's sources changed, from Python to Go.
#
# OUTPUT: registry.ngoldack.de/hermes-egress-guard:0.1.0-4cb8c87 — after a GO build,
# the digest printed by buildctl is pinned in hermes-egress/authorizer.yaml and
# hermes-egress/reaper.yaml. Last built digest (the Python image, 2026-09-18):
#   sha256:0536c29113325512bcd792be91df40864153b89ff677098ce22b35fcd5d7fe5f
#
# RE-BUILDING: Jobs are immutable. Bump the Job name suffix, the --output tag and
# the context SHA together; Flux prunes the old Job. Because one image serves two
# Deployments, re-run this file AND hermes-egress-reaper.yaml together and re-pin
# both Deployments, so the two Job files never disagree about what was built.
apiVersion: batch/v1
kind: Job
metadata:
  name: build-hermes-egress-authorizer-s2
  namespace: buildkit
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 2700
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        topology.homelab/site: home
      containers:
      - name: buildctl
        image: moby/buildkit:v0.31.0
        command:
        - /bin/sh
        - -c
        args:
        - 'set -euo pipefail &&

          apk add --no-cache curl tar gzip >/dev/null 2>&1 &&

          echo "== fetch cosign (pinned) ==" &&

          curl -fsSL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v2.4.3/cosign-linux-amd64
          &&

          printf ''caaad125acef1cb81d58dcdc454a1e429d09a750d1e9e2b3ed1aed8964454708  /usr/local/bin/cosign\n''
          | sha256sum -c - &&

          chmod +x /usr/local/bin/cosign &&

          echo "== fetch trivy (pinned, same version as image-scan) ==" &&

          curl -fsSL -o /tmp/trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          &&

          printf ''2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  /tmp/trivy.tgz\n''
          | sha256sum -c - &&

          tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy &&

          chmod +x /usr/local/bin/trivy &&

          echo "== buildctl build+push ==" &&

          set +e && buildctl ''--addr=tcp://buildkitd:1234'' ''--tlscacert=/certs/ca.crt''
          ''--tlscert=/certs/tls.crt'' ''--tlskey=/certs/tls.key'' ''build'' ''--frontend=dockerfile.v0''
          ''--opt=context=https://github.com/ngoldack/homelab.git#4cb8c873885884aa7fb825824c4d022e3ac4c3e4''
          ''--opt=filename=kubernetes/infrastructure/home/image-builds/hermes-egress-guard/Dockerfile''
          ''--output=type=image,name=registry.ngoldack.de/hermes-egress-guard:0.1.0-4cb8c87,push=true''
          ''--export-cache=type=registry,ref=registry.ngoldack.de/hermes-egress-guard:buildcache,mode=max''
          ''--import-cache=type=registry,ref=registry.ngoldack.de/hermes-egress-guard:buildcache''
          ''--progress=plain'' > /tmp/build.log 2>&1; rc=$?; set -e;

          cat /tmp/build.log;

          test $rc -eq 0 || { echo "BUILD FAILED rc=$rc"; exit $rc; };

          DIGEST=$(grep -oE ''sha256:[a-f0-9]{64}'' /tmp/build.log | tail -1);

          test -n "$DIGEST" || { echo "NO DIGEST in build log"; exit 1; };

          echo "DIGEST=$DIGEST";

          IMAGE=registry.ngoldack.de/hermes-egress-guard:0.1.0-4cb8c87;

          echo "== trivy gate ==" &&

          trivy image --severity CRITICAL --exit-code 1 --no-progress "$IMAGE" &&

          echo "== SBOM ==" &&

          trivy image --format cyclonedx -o /tmp/sbom.xml --no-progress "$IMAGE" &&

          echo "== attach sbom ==" &&

          export COSIGN_PASSWORD="$(cat /cosign/password)" &&

          DOCKER_CONFIG=/docker cosign attach sbom --sbom /tmp/sbom.xml --type cyclonedx
          "$IMAGE" &&

          echo "== provenance attest ==" &&

          printf ''{"builder":{"name":"https://github.com/ngoldack/homelab"},"buildType":"https://slsa.dev/provenance/v1.0","source":{"uri":"https://github.com/ngoldack/homelab","digest":{"sha1":"4cb8c87"}},"buildMetadata":{"reproducible":"false"}}''
          > /tmp/prov.json &&

          DOCKER_CONFIG=/docker cosign attest --type slsaprovenance --predicate /tmp/prov.json
          --key /cosign/cosign.key --tlog-upload=false "registry.ngoldack.de/hermes-egress-guard@$DIGEST"
          &&

          echo "== sign LAST ==" &&

          DOCKER_CONFIG=/docker cosign sign --key /cosign/cosign.key --tlog-upload=false
          "registry.ngoldack.de/hermes-egress-guard@$DIGEST" &&

          echo "SIGNED $IMAGE ($DIGEST)"

          '
        env:
        - name: DOCKER_CONFIG
          value: /docker
        volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
        - name: docker
          mountPath: /docker
          readOnly: true
        - name: cosign
          mountPath: /cosign
          readOnly: true
      volumes:
      - name: certs
        secret:
          secretName: buildctl-client-tls
      - name: docker
        secret:
          secretName: registry-credentials
          items:
          - key: .dockerconfigjson
            path: config.json
      - name: cosign
        secret:
          secretName: cosign-signing-key
          items:
          - key: cosign.key
            path: cosign.key
          - key: password
            path: password
