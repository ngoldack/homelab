# Phoenix's Postgres on CloudNativePG, the same operator every relational
# store here uses (immich/hindsight/authentik). Traces, projects, datasets,
# prompts and evals all live here; the pod's /data mount is an emptyDir, so
# this cluster is the only durable state.
#
# The app role/database are named phoenix (not the CNPG default "app") and the
# password comes from OUR secret (postgres-credentials.sops.yaml) via
# bootstrap.initdb.secret — that same literal is what the Phoenix HelmRelease
# injects as PHOENIX_POSTGRES_PASSWORD (auth.secret[].valueFrom), so nothing
# is auto-generated and a drift between the two fails loudly at connect time.
# Same reasoning as hindsight/authentik.
#
# pgvector + pg_trgm ship inside 18-standard-trixie (verified live against
# immich-database-1: pg_available_extensions lists 'vector'); the CREATE
# EXTENSION itself is reconciled by the Database CR (database.yaml).
#
# Block storage (NVMe-oF zvol + ext4) — same 6h/14d snapshot schedule via the
# class parameters. storageClassName is immutable on a bound PVC, so the swap
# from NFS to this class went through dump → delete PVC → re-init → restore.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: phoenix-database
  namespace: phoenix
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
  affinity:
    nodeSelector:
      topology.homelab/site: home
  bootstrap:
    initdb:
      database: phoenix
      owner: phoenix
      secret:
        name: phoenix-database-credentials
  storage:
    size: 10Gi
    storageClass: truenas-fast-nvmeof-phoenix-database

    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  postgresql:
    parameters:
      # Force a WAL segment switch every 60s so archived WAL trails the
      # primary by at most ~1 minute regardless of write volume — without
      # it a quiet database leaves its newest WAL unarchived until the
      # 16 MiB segment fills (first restore drill died exactly on this:
      # "recovery ended before configured recovery target was reached").
      archive_timeout: "60"
  # Backups + WAL archiving via the Barman Cloud plugin: the ObjectStore CR
  # (objectstore.yaml) owns destination/retention; this reference enables
  # archiving. spec.backup.retentionPolicy is NOT set here — in-tree-Barman-
  # only, ignored when a plugin owns backups.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: phoenix-backup-store
