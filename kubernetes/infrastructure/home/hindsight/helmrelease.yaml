# Hindsight — agent memory that learns (vectorize-io/hindsight, MIT).
# Self-hosted after the Hindsight Cloud credits ran out; the client just
# repoints base_url.
# LLM: OpenRouter DIRECT (2026-09-16) — single model
# ~deepseek/deepseek-v4-flash-latest at low reasoning effort, strictly JSON
# via STRICT_SCHEMA. The prior 3-member failover chain (incl. the local
# qwen3-27b leg) made startup verification cross the chart's 30s liveness
# budget, crash-looping the API pod mid-boot — removed 2026-09-13. The
# in-cluster Envoy AI Gateway hop (model "chat") was removed 2026-09-16
# because the aigateway controller is crash-looping and its routes 500;
# restore it once the gateway is healthy (see the api env block).
#
# Embeddings + reranker stay on the chart defaults (LOCAL bge-small-en-v1.5 /
# ms-marco-MiniLM in-process on CPU): they are small, they run per-pod, and
# they need no GPU. The model files (~200 MB) re-download into the container
# cache on pod restart — accepted; the alternative is a RWO PVC that pins the
# pods to one node for a 30-second download.
# DB: CNPG (hindsight-database + the Database CR that owns vector/pg_trgm),
# password shared with the chart via existingSecret (key postgres-password).
# The chart's bundled ankane/pgvector subchart is OFF — every relational store
# here runs on the CNPG operator.
#
# metrics.serviceMonitor stays false: those are prometheus-operator CRDs this
# cluster does not have (the stack is VictoriaMetrics); VMServiceScrapes in
# monitoring/ scrape api:8888 and worker:8889 directly.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hindsight
  namespace: flux-system
spec:
  interval: 1h
  # 20m, not 10m: a worker boots in 2-5 min (sentence_transformers model
  # download), and two simultaneous worker restarts under the 10m budget
  # marked the install/upgrade stalled — the remediation then DELETED the
  # sts before the workers ever finished, and every retry churned the same
  # way (2026-09-18 outage: repeated install-fail/delete cycles from 17:00).
  timeout: 20m
  chart:
    spec:
      chart: hindsight
      version: "0.9.2"
      sourceRef:
        kind: HelmRepository
        name: hindsight
      interval: 1h
  targetNamespace: hindsight
  releaseName: hindsight
  install:
    createNamespace: false
    remediation:
      # 3, not 0: a failed install wait must not uninstall the release
      # (deleting the sts mid-boot was the 17:00-19:00 churn engine, and
      # the uninstall is what the final failed retry would do). But 0 also
      # marks the FIRST failed wait terminal — it latched Stalled/
      # RetriesExceeded at 18:17 and blocked the subsequent installs that
      # empty release storage should have allowed. 3 attempts lets helm
      # re-evaluate a transient stall; the new 20m timeout (chart boot
      # worst case) is the actual fix for the mid-boot failure.
      retries: 3
  upgrade:
    remediation:
      # Once the release latches "failed" (a transient sts-health blip marked
      # every history entry failed across the model swap), a plain retry won't
      # move off it because there's no "last successful" to roll back to.
      # Force replacement of the current (failed) revision's helm state on the
      # next reconcile; the deployed resources are already healthy.
      remediateLastFailure: true
      retries: 3
  # No dependsOn here: 'cnpg-operator' is a Flux Kustomization, not a
  # HelmRelease — the entry Kustomization (clusters/home/hindsight.yaml)
  # already waits on it for the CRDs.
  values:
    existingSecret: hindsight-env
    postgresql:
      enabled: false
      external:
        host: hindsight-database-rw
        port: 5432
        database: hindsight
        username: hindsight
    api:
      # Conservative cpu REQUEST (500m chart default vs ~284m free on the sole
      # untolerated home node talos-3bi) was stalling the API replacement pod
      # at 97% node cpu requests. The API is latency-sensitive I/O (recall),
      # not CPU-bound: request 200m (same as the workers) so it schedules;
      # limits stay generous for burst.
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          cpu: 2
          # Raised 4Gi -> 9Gi on 2026-09-19 with the same evidence pattern as
          # the worker limit below: the pod was OOMKilled (exit 137) 7 times
          # in 3h28m — a fresh start sits at ~0.9Gi VmRSS and reaches the 4Gi
          # limit within ~30 min, taking the UI's proxied /api calls down with
          # it (502/500 in hindsight-ui). The API pod runs the maintenance
          # loop (consolidation reconcile + mental-model refresh every 5 min),
          # which hydrates the same multi-MB retain payloads the worker's
          # claim path does, so it inherits the same unbounded-bytes
          # pathology. 9Gi matches the worker limit already accepted on
          # 2026-09-18; the durable fix stays upstream (producers submit
          # ~20MB retains). Request unchanged: the limit raise adds no
          # scheduling pressure.
          memory: 9Gi
      env:
        HINDSIGHT_API_LLM_PROVIDER: openai
        # agentgateway synthetic OVER (2026-09-18): telemetry-tracer OpenAI-compatible API.
        # The retryable synthetic model hf/openai/gpt-oss-120b is pulled from the
        # agentgateway backend named synthetic (api.synthetic.new), verified on
        # 2026-09-16. The base URL stays OpenAI-compatible (/v1/...), the model
        # name matches the backend's openai.model stanza.
        HINDSIGHT_API_LLM_BASE_URL: http://agentgateway.agentgateway.svc.cluster.local:80/v1/key/synthetic-gpt-oss
        HINDSIGHT_API_LLM_MODEL: hf:openai/gpt-oss-120b
        # Static-key auth (X-Api-Key) via the /v1/key/* route scope: no JWT
        # expiry to rotate. HINDSIGHT_API_LLM_DEFAULT_HEADERS lives in
        # secret.sops.yaml (envFrom injects every key into the pod): the
        # gateway policy reads the key from X-Api-Key; the SDK's own
        # Authorization: Bearer header is harmless on this backend (verified
        # live: both headers together do not clobber the upstream credential).
        # Reasoning LOW + STRICT_SCHEMA so extraction is fast and JSON-only.
        HINDSIGHT_API_LLM_REASONING_EFFORT: "low"
        HINDSIGHT_API_LLM_STRICT_SCHEMA: "true"
        # Extraction bundles a large system schema + chunk; raise timeout.
        HINDSIGHT_API_LLM_TIMEOUT: "600"
        HINDSIGHT_API_LLM_CONNECT_TIMEOUT: "15"
        # Audit logging enabled so ingest paths are visible.
        HINDSIGHT_API_AUDIT_LOG_ENABLED: "true"
        # Retention (verified against hindsight_api/config.py in the shipped
        # image: these feed the hourly maintenance sweep in
        # engine/maintenance.py `_run_retention`). The defaults keep rows
        # forever — DEFAULT_OPERATION_RETENTION_DAYS=0 ("zero retention days
        # disables automatic pruning entirely, and is the default") and
        # DEFAULT_AUDIT_LOG_RETENTION_DAYS=-1 (keep forever) — so the
        # Postgres store grows without bound and every prompt/response body
        # llm_requests captured during retain survives indefinitely. 14 days
        # bounds that store and the personal-data surface; bump only with a
        # reason. Config applies on pod start: api AND both workers read it
        # (the worker env block below is written out in full, not anchored),
        # so the values are repeated there on purpose.
        HINDSIGHT_API_OPERATION_RETENTION_DAYS: "14"
        HINDSIGHT_API_AUDIT_LOG_RETENTION_DAYS: "14"
        HINDSIGHT_API_RETAIN_LLM_REASONING_EFFORT: "low"
        HINDSIGHT_API_CONSOLIDATION_LLM_REASONING_EFFORT: "medium"
    worker:
      # Dedicated workers (not the API's internal one): retain/consolidation
      # LLM chains are long and must not starve recall latency on the API pod.
      enabled: true
      # Ingest throughput scaling: a single worker serializes every
      # retain/consolidation chain — the measured bottleneck (LLM call ~3s but
      # end-to-end 9-14s/diff; 212s under contention). 2 allow two parallel
      # chains while keeping the home CPU pool schedulable (the 3-worker setup
      # saturated talos-3bi, stalling API/worker rollouts at 98% cpu requests).
      # Chart default is 2.
      replicaCount: 2
      # Memory raised three times on 2026-09-18. Evidence, not estimation —
      # live VmRSS of a booting worker, sampled every 2s:
      #   306MB -> 535 -> 631 -> 740 -> 841MB (steady, ~30s of startup)
      #   then 1.93GB -> 3.78GB -> OOMKilled (5Gi) within 8s of the polling
      #   loop starting, every restart, LLM verification already passed.
      # So base RSS + local models is only ~300MB and is NOT the driver; the
      # claim path adds ~3.5GB in seconds. Mechanism, read from the shipped
      # source: claim_tasks selects `task_payload` per slot, then each
      # claimed retain folds up to DEFAULT_MAX_FOLD_PEERS=16 peers, which
      # fetch_foldable_retain_peers also loads WITH task_payload. The fold's
      # only bound is a TOKEN budget (RETAIN_BATCH_TOKENS, 10k ~ 40KB text),
      # applied after the JSON is already in memory; RETAIN_MEMORY_BUDGET_MB
      # covers extraction state (memory_budget.py), not claim hydration.
      # Nothing bounds bytes at claim time. The backlog holds retains of
      # ~20MB each (161MB total over 9 rows), and a fold of those parses to
      # GBs. 9Gi absorbs one cycle; nodes have the headroom (48Gi allocatable
      # on talos-919-w9u). MAX_SLOTS=4 halves the cycle's claim width.
      # The durable fix is upstream: producers submit 20MB retains.
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          cpu: 1000m
          memory: 9Gi
      # Probes widened from the chart default (3x10s) to 12x10s. The
      # 2026-09-18 kill events read "Liveness probe failed: /health/live:
      # context deadline exceeded" — the request TIMED OUT rather than the
      # failure count running out — while the app's loop watchdog reported only
      # brief (~1s) stalls in the same window, and a direct in-pod curl answers
      # 200 in <1ms. So the endpoint is healthy but intermittently too slow to
      # answer within 5s, and the chart's 3-miss budget turns that into a
      # restart mid-retain, requeuing the operation onto the other replica
      # (observed alternating between worker-0 and worker-1).
      # The load behind it: one 24.6M-token document (claimed 20:28:25,
      # "Processing sub-batch 1" 47s later, then every extraction call hitting
      # HTTP 429 from api.synthetic.new) fans into thousands of sub-calls.
      # A wider budget lets a worker that is genuinely progressing keep its
      # claimed work; verified: no liveness kills for the 15+ min after the
      # 12x10s config rolled, both replicas steady.
      # Durable fixes are producer-side (bank unikraft submitted ~100MB of
      # text in one retain) and upstream (the 429s are the model provider's).
      livenessProbe:
        httpGet:
          path: /health/live
          port: 8889
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 12
      readinessProbe:
        httpGet:
          path: /health
          port: 8889
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 12
      # Spread the 2 worker replicas across the two home nodes (podAntiAffinity):
      # both can otherwise co-schedule on one 10-core node and, being burstable
      # to 1000m each, compete for CPU during retain bursts — the exact
      # contention that showed 212s/diff. Workers are I/O-bound on OpenRouter, so
      # spreading only helps; preferred (not required) so placement still works if
      # one home node is full.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: worker
                topologyKey: kubernetes.io/hostname
      # env written out IN FULL (not `*llm-env`): a YAML anchor substitutes the
      # whole map and cannot be appended to. The worker needs the same model
      # config (the chart does NOT merge api.env into the worker) PLUS its
      # batch/poll tunables.
      env:
        HINDSIGHT_API_LLM_PROVIDER: openai
        # agentgateway synthetic OVER (2026-09-18): same model as the api.
        HINDSIGHT_API_LLM_BASE_URL: http://agentgateway.agentgateway.svc.cluster.local:80/v1/key/synthetic-gpt-oss
        HINDSIGHT_API_LLM_MODEL: hf:openai/gpt-oss-120b
        # Static-key auth (X-Api-Key) via the /v1/key/* route scope: no JWT
        # expiry to rotate. HINDSIGHT_API_LLM_DEFAULT_HEADERS lives in
        # secret.sops.yaml (envFrom injects every key into the pod): the
        # gateway policy reads the key from X-Api-Key; the SDK's own
        # Authorization: Bearer header is harmless on this backend (verified
        # live: both headers together do not clobber the upstream credential).
        HINDSIGHT_API_LLM_REASONING_EFFORT: "low"
        HINDSIGHT_API_LLM_STRICT_SCHEMA: "true"
        HINDSIGHT_API_LLM_TIMEOUT: "600"
        HINDSIGHT_API_LLM_CONNECT_TIMEOUT: "15"
        # Tasks claimed per poll cycle to match 2 replica balance.
        HINDSIGHT_API_WORKER_BATCH_SIZE: "20"
        # Retain/claim bounds. The claim query selects `task_payload` per
        # slot and each claimed retain folds up to 16 peers, also fetching
        # `task_payload` — no byte bound at claim time (see the memory note
        # on the worker resources above). MAX_SLOTS=4 narrows the cycle's
        # claim width; RETAIN_MEMORY_BUDGET_MB=96 bounds extraction state
        # (memory_budget.py), which is a separate pool.
        HINDSIGHT_API_WORKER_MAX_SLOTS: "4"
        HINDSIGHT_API_RETAIN_MEMORY_BUDGET_MB: "96"
        # RETAIN_BATCH_TOKENS stays at the 10k default on purpose: it keeps
        # each extraction prompt far inside gpt-oss-120b's context window. The
        # 24,645,631-token document behind the 2026-09-18 incident (bank
        # unikraft submitted ~100MB of text in one retain) is a producer defect
        # to fix at the source, not something to widen batches for.
        # Audit logging enabled for the worker too.
        HINDSIGHT_API_AUDIT_LOG_ENABLED: "true"
        # Same retention window as the api (the chart does not merge api.env
        # into the worker — the env above is deliberately written out in
        # full, not anchored — and the maintenance sweep runs per process).
        HINDSIGHT_API_OPERATION_RETENTION_DAYS: "14"
        HINDSIGHT_API_AUDIT_LOG_RETENTION_DAYS: "14"
        HINDSIGHT_API_RETAIN_LLM_REASONING_EFFORT: "low"
        HINDSIGHT_API_CONSOLIDATION_LLM_REASONING_EFFORT: "medium"
    controlPlane:
      enabled: true
    nodeSelector:
      topology.homelab/site: home
    podDisruptionBudget:
      enabled: false
