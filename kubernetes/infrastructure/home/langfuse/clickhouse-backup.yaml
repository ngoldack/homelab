# ClickHouse backups for langfuse's event store.
#
# Why this exists: the langfuse namespace's only backup mechanism was CNPG
# (Postgres). ClickHouse holds the trace data itself — `events_full`, the
# immutable per-observation table Langfuse v4 reads from — on a 5Gi
# truenas-fast-nfs PVC with nothing protecting it, so an app upgrade that runs
# schema migrations (or a bad day on the volume) had no fallback.
#
# Credentials never appear in SQL text or logs: the S3 pair comes from the
# existing `langfuse-backup-s3-credentials` Secret as env, and the statement
# uses clickhouse-client's `--param_x` substitution with `SET log_queries = 0`
# so the substituted text is not written to system.query_log (the reason the
# one-off inline BACKUP taken during the 2026-09-18 upgrade had to be scrubbed
# from query_log afterwards).
#
# Only `events_full` is backed up: it is the authoritative table, while
# `events_core` is a materialized-view projection that is rebuilt from it (and
# refuses BACKUP with Code 598 as an MV target). Everything else in the
# `default` database is schema bookkeeping — the table list showed parts only
# on events_full/events_core/schema_migrations.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-backup-prune-script
  namespace: langfuse
data:
  prune.py: |
    """Delete whole backup sets under BACKUP_PREFIX older than RETAIN_DAYS.

    A backup set is the first path component under the prefix (its timestamp
    directory); it is removed only when its NEWEST object is older than the
    cutoff, so a set being written can never be half-deleted.
    """
    import collections
    import datetime
    import os

    import boto3

    days = int(os.environ.get("RETAIN_DAYS", "30"))
    prefix = os.environ["BACKUP_PREFIX"].lstrip("/")
    bucket, _, base = prefix.partition("/")

    s3 = boto3.client(
        "s3",
        endpoint_url=os.environ["S3_ENDPOINT"],
        region_name=os.environ.get("AWS_REGION", "fsn1"),
        aws_access_key_id=os.environ["AWS_ACCESS_KEY_ID"],
        aws_secret_access_key=os.environ["AWS_SECRET_ACCESS_KEY"],
    )

    groups = collections.defaultdict(list)
    for page in s3.get_paginator("list_objects_v2").paginate(Bucket=bucket, Prefix=base):
        for obj in page.get("Contents", []):
            relative = obj["Key"][len(base):]
            groups[relative.split("/")[0]].append((obj["Key"], obj["LastModified"]))

    cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=days)
    pruned_sets = pruned_objects = 0
    for name, objects in sorted(groups.items()):
        newest = max(modified for _, modified in objects)
        if newest >= cutoff:
            continue
        for key, _ in objects:
            s3.delete_object(Bucket=bucket, Key=key)
            pruned_objects += 1
        pruned_sets += 1
        print(f"pruned {name}: {len(objects)} objects, newest {newest.isoformat()}")

    print(f"done: {len(groups)} sets seen, {pruned_sets} pruned, {pruned_objects} objects deleted, retain {days}d")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: langfuse-clickhouse-backup
  namespace: langfuse
spec:
  # After the CNPG daily backup (02:17) so the two never fight over the bucket.
  schedule: "47 2 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            topology.homelab/site: home
          containers:
            - name: backup
              image: clickhouse/clickhouse-server:26.4
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  dest="https://fsn1.your-objectstorage.com/home-cnpg-backups-7cd4e906/langfuse/clickhouse/$${stamp}"
                  echo "backing up events_full to $${dest}"
                  # log_queries=0 first: the substituted credentials must never
                  # reach system.query_log. --multiquery runs both statements in
                  # one session, so the SET applies to the BACKUP.
                  # $$ escapes Flux's strict postBuild envsubst, which otherwise
                  # tries to expand these shell variables at build time.
                  clickhouse-client \
                    --host langfuse-clickhouse-headless.langfuse.svc.cluster.local \
                    --multiquery \
                    --param_dest="$${dest}" \
                    --param_key="$${AWS_ACCESS_KEY_ID}" \
                    --param_secret="$${AWS_SECRET_ACCESS_KEY}" \
                    -q "SET log_queries = 0;
                        BACKUP TABLE default.events_full TO S3({dest:String}, {key:String}, {secret:String})"
                  echo "backup complete: $${dest}"
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: langfuse-backup-s3-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: langfuse-backup-s3-credentials
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_REGION
                  valueFrom:
                    secretKeyRef:
                      name: langfuse-backup-s3-credentials
                      key: AWS_REGION
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: langfuse-clickhouse-backup-prune
  namespace: langfuse
spec:
  schedule: "23 4 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            topology.homelab/site: home
          containers:
            - name: prune
              # Same image the barman plugin injects into the CNPG pods: it
              # ships python3 + boto3, is already resident on the home nodes,
              # and keeps this job free of a new registry dependency.
              image: ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar:v0.15.0
              command: ["python3", "/scripts/prune.py"]
              env:
                - name: BACKUP_PREFIX
                  value: langfuse/clickhouse/
                - name: RETAIN_DAYS
                  value: "30"
                - name: S3_ENDPOINT
                  value: https://fsn1.your-objectstorage.com
                - name: AWS_REGION
                  valueFrom:
                    secretKeyRef:
                      name: langfuse-backup-s3-credentials
                      key: AWS_REGION
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: langfuse-backup-s3-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: langfuse-backup-s3-credentials
                      key: AWS_SECRET_ACCESS_KEY
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 192Mi
          volumes:
            - name: scripts
              configMap:
                name: clickhouse-backup-prune-script
