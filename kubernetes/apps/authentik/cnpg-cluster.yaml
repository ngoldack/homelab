apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-postgres
  namespace: authentik
spec:
  instances: 1
  storage:
    size: 10Gi
    storageClass: tns-fast-nvmeof
  # Continuous WAL archiving + base backups to S3 (PITR) via the Barman Cloud plugin.
  # The referenced ObjectStore is defined in barman-objectstore.yaml; daily base
  # backups are scheduled by scheduledbackup.yaml.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik-backup-store
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
