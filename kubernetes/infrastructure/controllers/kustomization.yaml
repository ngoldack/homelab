apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Helm chart sources (HelmRepository definitions) consumed by the controllers below
  - sources.yaml
  # Networking & CRDs — Cilium is the sole CNI and provides all networking
  - gateway-api
  - cilium
  # Storage — TrueNAS CSI (4 tiers) + node-local-path (local/scratch tier)
  - storage/local-path
  - storage/tns-csi
  # GPU enablement (NVIDIA device plugin + nvidia RuntimeClass for the P100)
  - nvidia-device-plugin
  # Observability — VictoriaMetrics stack (metrics + logs + traces) + Grafana
  - observability
