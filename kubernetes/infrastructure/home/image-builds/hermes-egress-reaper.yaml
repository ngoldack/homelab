# Build + SIGN the hermes-egress-guard image — the ONE binary behind both egress
# services (reaper + authorizer), a stdlib-only Go port of the former Python
# `egress_guard` package. The image entrypoint is the single Go binary /guard,
# which selects its role from the FIRST argv (`reaper` | `authorizer`); there is
# no EGRESS_ROLE env. The image is IDENTICAL for both roles, so the digest this
# Job prints is the same artifact hermes-egress-authorizer.yaml builds and pushes
# (see there for the build shape, signing chain and pin discipline — the two Job
# files share one image and must be re-run + re-pinned together).
#
# BUILD SHAPE — the build context is THIS REPO at the pinned commit and the
# Dockerfile is fetched from that tree by path: `--opt=context=<repo>#<sha>` plus
# `--opt=filename=<repo-relative Dockerfile>`, and the Dockerfile's COPY sources
# are repo-relative.
# GO BUILD — the context SHA below (fe3dfb3, "port authorizer+reaper to Go") is the
# commit whose tree carries the Go sources (image-builds/hermes-egress-guard/go/
# incl. go.mod and cmd/guard) and the rewritten Dockerfile, so this Job now builds
# the Go image. It replaces the 4cb8c87 pin, which pointed at the former Python
# tree; never re-pin a digest built from that SHA. The context SHA, the --output tag
# and the Job name suffix travel together (Jobs are immutable).
#
# SIGNING — trivy CRITICAL gate -> CycloneDX SBOM (cosign attach) -> SLSA
# provenance attestation -> signature LAST (--tlog-upload=false everywhere). An
# image that fails the gate is left UNSIGNED and the Job fails loudly. cosign
# v2.4.3 = sha256 caaad125…4708; trivy v0.74.0 = sha256 2ae6fe3e…4371a. The
# cosign key is the SOPS-encrypted cosign-signing-key secret (ns buildkit), and
# COSIGN_PASSWORD comes from the password item in the same secret.
#
# OUTPUT: registry.ngoldack.de/hermes-egress-guard:0.1.0-e57ae0a — the digest
# printed by buildctl is pinned in hermes-egress/reaper.yaml and
# hermes-egress/authorizer.yaml. Last built digest (the Python image, 2026-09-18):
#   sha256:0536c29113325512bcd792be91df40864153b89ff677098ce22b35fcd5d7fe5f
#
# RE-BUILDING: Jobs are immutable. Bump the Job name suffix, the --output tag and
# the context SHA together; Flux prunes the old Job. Re-run both guard Job files
# and re-pin both Deployments in the same change.
apiVersion: batch/v1
kind: Job
metadata:
  name: build-hermes-egress-reaper-s5
  namespace: buildkit
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 2700
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        topology.homelab/site: home
      containers:
      - name: buildctl
        image: moby/buildkit:v0.31.0
        command:
        - /bin/sh
        - -c
        args:
        - 'set -euo pipefail &&

          apk add --no-cache curl tar gzip >/dev/null 2>&1 &&

          echo "== fetch cosign (pinned) ==" &&

          curl -fsSL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v2.4.3/cosign-linux-amd64
          &&

          printf ''caaad125acef1cb81d58dcdc454a1e429d09a750d1e9e2b3ed1aed8964454708  /usr/local/bin/cosign\n''
          | sha256sum -c - &&

          chmod +x /usr/local/bin/cosign &&

          echo "== fetch trivy (pinned, same version as image-scan) ==" &&

          curl -fsSL -o /tmp/trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          &&

          printf ''2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  /tmp/trivy.tgz\n''
          | sha256sum -c - &&

          tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy &&

          chmod +x /usr/local/bin/trivy &&

          echo "== buildctl build+push ==" &&

          set +e && buildctl ''--addr=tcp://buildkitd:1234'' ''--tlscacert=/certs/ca.crt''
          ''--tlscert=/certs/tls.crt'' ''--tlskey=/certs/tls.key'' ''build'' ''--frontend=dockerfile.v0''
          ''--opt=context=https://github.com/ngoldack/homelab.git#e57ae0a5dae46554329a715df86c61d0d8f51a4f''
          ''--opt=filename=kubernetes/infrastructure/home/image-builds/hermes-egress-guard/Dockerfile''
          ''--output=type=image,name=registry.ngoldack.de/hermes-egress-guard:0.1.0-e57ae0a,push=true''
          ''--export-cache=type=registry,ref=registry.ngoldack.de/hermes-egress-guard:buildcache,mode=max''
          ''--import-cache=type=registry,ref=registry.ngoldack.de/hermes-egress-guard:buildcache''
          ''--progress=plain'' > /tmp/build.log 2>&1; rc=$?; set -e;

          cat /tmp/build.log;

          test $rc -eq 0 || { echo "BUILD FAILED rc=$rc"; exit $rc; };

          # Prefer the manifest-export line buildkit prints. The naive last-digest
          # scan is only a fallback - a build that exports a registry cache writes
          # the CACHE manifest last, and pinning that yields a pod that cannot start.
          DIGEST=$(grep -oE ''exporting manifest sha256:[a-f0-9]{64}'' /tmp/build.log | tail -1 | grep -oE ''sha256:[a-f0-9]{64}'');
          [ -n "$DIGEST" ] || DIGEST=$(grep -oE ''pushing manifest for [^ ]+@sha256:[a-f0-9]{64}'' /tmp/build.log | tail -1 | grep -oE ''sha256:[a-f0-9]{64}'');
          if [ -z "$DIGEST" ]; then
            echo "WARN - no manifest line in the build log, falling back to the last digest";
            DIGEST=$(grep -oE ''sha256:[a-f0-9]{64}'' /tmp/build.log | tail -1);
          fi;

          test -n "$DIGEST" || { echo "NO DIGEST in build log"; exit 1; };

          echo "DIGEST=$DIGEST";

          IMAGE=registry.ngoldack.de/hermes-egress-guard:0.1.0-e57ae0a;

          echo "== trivy gate ==" &&

          trivy image --severity CRITICAL --exit-code 1 --no-progress "$IMAGE" &&

          echo "== SBOM ==" &&

          trivy image --format cyclonedx -o /tmp/sbom.xml --no-progress "$IMAGE" &&

          echo "== attach sbom ==" &&

          export COSIGN_PASSWORD="$(cat /cosign/password)" &&

          DOCKER_CONFIG=/docker cosign attach sbom --sbom /tmp/sbom.xml --type cyclonedx
          "$IMAGE" &&

          echo "== provenance attest ==" &&

          printf ''{"builder":{"name":"https://github.com/ngoldack/homelab"},"buildType":"https://slsa.dev/provenance/v1.0","source":{"uri":"https://github.com/ngoldack/homelab","digest":{"sha1":"e57ae0a"}},"buildMetadata":{"reproducible":"false"}}''
          > /tmp/prov.json &&

          DOCKER_CONFIG=/docker cosign attest --type slsaprovenance --predicate /tmp/prov.json
          --key /cosign/cosign.key --tlog-upload=false "registry.ngoldack.de/hermes-egress-guard@$DIGEST"
          &&

          echo "== sign LAST ==" &&

          DOCKER_CONFIG=/docker cosign sign --key /cosign/cosign.key --tlog-upload=false
          "registry.ngoldack.de/hermes-egress-guard@$DIGEST" &&

          echo "SIGNED $IMAGE ($DIGEST)"

          '
        env:
        - name: DOCKER_CONFIG
          value: /docker
        volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
        - name: docker
          mountPath: /docker
          readOnly: true
        - name: cosign
          mountPath: /cosign
          readOnly: true
      volumes:
      - name: certs
        secret:
          secretName: buildctl-client-tls
      - name: docker
        secret:
          secretName: registry-credentials
          items:
          - key: .dockerconfigjson
            path: config.json
      - name: cosign
        secret:
          secretName: cosign-signing-key
          items:
          - key: cosign.key
            path: cosign.key
          - key: password
            path: password
