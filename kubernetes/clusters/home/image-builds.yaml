# Build Jobs. Deliberately wait: false.
#
# A Kustomization with wait: true blocks until every object it applies reports
# Ready, and for a Job that means running to completion — here, a multi-hour
# CUDA compile. Flux would report this Kustomization as failed on every
# reconcile until the build finished, and the 10m default timeout would mark it
# failed long before that. The Job's own backoffLimit and activeDeadlineSeconds
# are what actually bound it; Flux only needs to have applied it.
#
# Watch a build with:
#   kubectl -n buildkit logs -f job/build-ik-llama-<sha>
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: image-builds
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/infrastructure/home/image-builds
  prune: true
  wait: false
  dependsOn:
    - name: buildkit
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
