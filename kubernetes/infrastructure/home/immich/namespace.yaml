apiVersion: v1
kind: Namespace
metadata:
  name: immich
  labels:
    # Pod Security Admission: audit+warn at `restricted`, enforcement left to
    # Talos' cluster default (`baseline`). What actually surfaces drift here is
    # the `warn` level (kubectl warnings) and Kyverno's PolicyReports — NOT the
    # `audit` level: this cluster runs no API audit policy (Talos leaves audit
    # logging off and nothing in tofu/ configures it), so `audit:` records
    # nothing today. Reported-only on purpose besides: a live check on
    # 2026-09-17 found almost every workload violating `restricted`
    # (runAsNonRoot, seccompProfile, capabilities.drop, allowPrivilegeEscalation)
    # and Kyverno's four policies do not cover those fields, so
    # `enforce: restricted` needs those securityContexts added workload by
    # workload first.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # The public Gateway's allowedRoutes selector requires this label before
    # any HTTPRoute in the namespace may attach to it. The label name says
    # "public-ingress" because that is the Gateway's gate, not because this
    # service is public — Immich is reachable only from the tailnet, enforced
    # by where its DNS record points (see httproute.yaml).
    gateway.ngoldack.de/public-ingress: "true"
