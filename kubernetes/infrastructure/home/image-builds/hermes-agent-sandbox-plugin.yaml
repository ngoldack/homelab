apiVersion: batch/v1
kind: Job
metadata:
  name: build-hermes-agent-sandbox-plugin-s3
  namespace: buildkit
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 3600
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        topology.homelab/site: home
      containers:
      - name: buildctl
        image: moby/buildkit:v0.31.0
        command:
        - /bin/sh
        - -c
        args:
        - 'set -euo pipefail &&

          apk add --no-cache curl tar gzip >/dev/null 2>&1 &&

          echo "== fetch cosign (pinned) ==" &&

          curl -fsSL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v2.4.3/cosign-linux-amd64
          &&

          printf ''caaad125acef1cb81d58dcdc454a1e429d09a750d1e9e2b3ed1aed8964454708  /usr/local/bin/cosign\n''
          | sha256sum -c - &&

          chmod +x /usr/local/bin/cosign &&

          echo "== fetch trivy (pinned, same version as image-scan) ==" &&

          curl -fsSL -o /tmp/trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          &&

          printf ''2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  /tmp/trivy.tgz\n''
          | sha256sum -c - &&

          tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy &&

          chmod +x /usr/local/bin/trivy &&

          echo "== buildctl build+push ==" &&

          set +e && buildctl ''--addr=tcp://buildkitd:1234'' ''--tlscacert=/certs/ca.crt''
          ''--tlscert=/certs/tls.crt'' ''--tlskey=/certs/tls.key'' ''build'' ''--frontend=dockerfile.v0''
          ''--opt=context=https://github.com/ngoldack/homelab.git#aa9130d369788327311c188648ee45d438b5f77e''
          ''--opt=filename=kubernetes/infrastructure/home/image-builds/hermes-agent-sandbox-plugin/Dockerfile''
          ''--output=type=image,name=registry.ngoldack.de/hermes-agent-sandbox-plugin:0.1.0-aa9130d,push=true''
          ''--export-cache=type=registry,ref=registry.ngoldack.de/hermes-agent-sandbox-plugin:buildcache,mode=max''
          ''--import-cache=type=registry,ref=registry.ngoldack.de/hermes-agent-sandbox-plugin:buildcache''
          ''--progress=plain'' > /tmp/build.log 2>&1; rc=$?; set -e;

          cat /tmp/build.log;

          test $rc -eq 0 || { echo "BUILD FAILED rc=$rc"; exit $rc; };

          DIGEST=$(grep -oE ''docker-content-digest: sha256:[a-f0-9]{64}'' /tmp/build.log | tail -1 | grep -oE ''sha256:[a-f0-9]{64}'');

          if [ -z "$DIGEST" ]; then
            echo "note: buildctl printed no docker-content-digest line; asking the registry"
            DIGEST=$(curl -fsSI "https://registry.ngoldack.de/v2/hermes-agent-sandbox-plugin/manifests/0.1.0-aa9130d" | tr -d ''\\r'' | sed -n ''s/^docker-content-digest: //Ip'' | tr -d ''\\n'');
          fi
          test -n "$DIGEST" || { echo "NO DIGEST in build log"; exit 1; };

          echo "DIGEST=$DIGEST";

          IMAGE=registry.ngoldack.de/hermes-agent-sandbox-plugin:0.1.0-aa9130d;

          echo "== trivy gate ==" &&

          trivy image --severity CRITICAL --exit-code 1 --no-progress "$IMAGE" &&

          echo "== SBOM ==" &&

          trivy image --format cyclonedx -o /tmp/sbom.xml --no-progress "$IMAGE" &&

          echo "== attach sbom ==" &&

          export COSIGN_PASSWORD="$(cat /cosign/password)" &&

          DOCKER_CONFIG=/docker cosign attach sbom --sbom /tmp/sbom.xml --type cyclonedx
          "$IMAGE" &&

          echo "== provenance attest ==" &&

          printf ''{"builder":{"name":"https://github.com/ngoldack/homelab"},"buildType":"https://slsa.dev/provenance/v1.0","source":{"uri":"https://github.com/ngoldack/homelab","digest":{"sha1":"aa9130d369788327311c188648ee45d438b5f77e"}},"buildMetadata":{"reproducible":"false"}}''
          > /tmp/prov.json &&

          DOCKER_CONFIG=/docker cosign attest --type slsaprovenance --predicate /tmp/prov.json
          --key /cosign/cosign.key --tlog-upload=false "registry.ngoldack.de/hermes-agent-sandbox-plugin@$DIGEST"
          &&

          echo "== sign LAST ==" &&

          DOCKER_CONFIG=/docker cosign sign --key /cosign/cosign.key --tlog-upload=false
          "registry.ngoldack.de/hermes-agent-sandbox-plugin@$DIGEST" &&

          echo "SIGNED $IMAGE ($DIGEST)"

          '
        env:
        - name: DOCKER_CONFIG
          value: /docker
        volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
        - name: docker
          mountPath: /docker
          readOnly: true
        - name: cosign
          mountPath: /cosign
          readOnly: true
      volumes:
      - name: certs
        secret:
          secretName: buildctl-client-tls
      - name: docker
        secret:
          secretName: registry-credentials
          items:
          - key: .dockerconfigjson
            path: config.json
      - name: cosign
        secret:
          secretName: cosign-signing-key
          items:
          - key: cosign.key
            path: cosign.key
          - key: password
            path: password
