# hermes-sandbox Cilium policies — default-deny baseline plus the two keeps.
#
# Cilium default-deny semantics (same pattern as agent-sandbox/cilium-*.yaml):
# every endpoint starts OPEN; the FIRST policy rule that selects an endpoint
# (its endpointSelector matches) and carries an ingress and/or egress section
# flips that endpoint to default-deny for the matching direction. The
# default-deny doc therefore carries one empty rule per direction, and the
# allow docs below carve out exactly the traffic sandboxes emit and accept:
# a wildcard DNS backstop, one egress-class doc per profile, and the ingress
# allowlist. Every field is grounded in `kubectl explain
# ciliumnetworkpolicy.spec --recursive` of the installed cilium.io/v2 CRD.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-sandbox-default-deny
  namespace: hermes-sandbox
spec:
  description: >-
    Deny-all traffic baseline for every pod in hermes-sandbox. The egress
    and ingress-router allow docs are the only exceptions; the egressDeny
    rules below additionally keep management-plane ranges dropped with a
    labeled verdict even if a future allow rule ever mentions them.
  endpointSelector:
    matchLabels: {}
  ingress:
    - {}
  egress:
    - {}
  egressDeny:
    # RFC1918 + link-local are the networks this cluster's management planes
    # (Talos, Proxmox, Kubernetes API, host metadata services) live on.
    # Explicit deny beats allow: these ranges stay dropped and the verdict
    # stays labeled (Hubble-observable) no matter what any allow rule says.
    # 172.20.0.0/16 + 172.21.0.0/16 (node + k8s service subnets) are
    # excepted because legitimately allowed flows live there: cluster DNS,
    # kube-apiserver egress and Router-to-sandbox traffic.
    - toCIDRSet:
        - cidr: 10.0.0.0/8
        - cidr: 192.168.0.0/16
        - cidr: 169.254.169.254/32
        - cidr: 172.16.0.0/12
          except:
            - 172.20.0.0/16
            - 172.21.0.0/16
    # openrouter.ai / api.openrouter.ai MUST stay unreachable. The installed
    # cilium.io/v2 CRD has no FQDN-scoped field under egressDeny (verified
    # `kubectl explain ciliumnetworkpolicy.spec.egressDeny`), so a named deny
    # cannot be expressed; they are instead STRICTLY absent from the egress
    # allowlist, which lands every attempt on default-deny. Allowing these
    # FQDNs therefore requires a deliberate, reviewable edit.
---
# hermes-sandbox egress allowlist — the only network a sandbox may emit.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-sandbox-egress-allowlist
  namespace: hermes-sandbox
spec:
  description: >-
    Backstop egress allowlist: cluster DNS for every pod in hermes-sandbox,
    including any pod that no per-profile class doc covers (a sandbox
    provisioned before the workload.hermes.io/profile label existed must keep
    working across this change). The classes themselves are the
    hermes-sandbox-class-* docs below, one per profile; this doc stays a
    wildcard on purpose and must never grow beyond DNS — Phase 3 routes
    sandbox egress through the hermes-egress forward proxy, so anything added
    here would be a bypass of that guard.
  endpointSelector:
    matchLabels: {}
  egress:
    # Cluster DNS is the sandbox's entire allowed egress. Keyed on the
    # k8s-app label Cilium recognizes for kube-dns.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # DNS-only by design — an FQDN-scoped rule cannot work here: the Cilium DNS
    # proxy is not in transparent mode (tofu/home/cilium.tf), so no policy
    # engine sees the resolved IPs and an FQDN allow would never learn the
    # identity it is meant to permit (the github.com / proxy.golang.org /
    # sum.golang.org rule this replaces was inert while looking permissive).
    # Guest-side package/module fetches therefore need either an internal
    # mirror selected with toEndpoints, or a deliberate CIDR allow added
    # here. The plugin's injected sandbox facts tell the model the same.
---
# Egress class `dns-only` — profile `go` (template hermes-go).
#
# WHY a class doc per profile: reachability is a property of the PROFILE, not
# of the namespace, and Phase 3 (the hermes-egress forward proxy) will move
# one profile at a time — hermes-offline to "deny everything", the toolchain
# profiles to "DNS + proxy only". One doc per profile keeps that change a
# single-doc edit and keeps "what may profile X reach?" a single grep.
#
# WHY it repeats the wildcard backstop's DNS rule instead of relying on it:
# this doc IS the class definition (an endpointSelector with no rules would
# define nothing), so the allowed set has to be written here. Cilium computes
# the effective allow set as the UNION of the rules of every policy selecting
# the endpoint, so the duplicate changes nothing today — both allow cluster
# DNS and nothing else.
#
# NOTHING MAY WIDEN EGRESS FROM THIS FILE before Phase 3: today the sandbox
# has no egress proxy and no dependency mirror, so an added CIDR/FQDN rule
# would be unmediated internet access for model-authored commands. The FQDN
# caveat above applies here too (no transparent DNS proxy => FQDN rules are
# inert), and a new allowance belongs in Phase 3's proxy config, not here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-sandbox-class-dns-only-go
  namespace: hermes-sandbox
spec:
  description: >-
    Egress class dns-only for profile go: cluster DNS, nothing else.
  endpointSelector:
    matchLabels:
      workload.hermes.io/profile: go
  egress:
    # Cluster DNS only — keyed on the k8s-app label Cilium recognizes for
    # kube-dns, the same peer as the wildcard backstop above.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Egress class `dns-only` — profile `core` (template hermes-core).
#
# Same class, same single allowance as the go doc above (see it for the union
# semantics and the Phase 3 hand-over); only the profile differs. A claim that
# carries no profile label lands on the wildcard backstop instead — same
# reachability, but with no class of its own to tighten in Phase 3.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-sandbox-class-dns-only-core
  namespace: hermes-sandbox
spec:
  description: >-
    Egress class dns-only for profile core: cluster DNS, nothing else.
  endpointSelector:
    matchLabels:
      workload.hermes.io/profile: core
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Egress class `dns-only` — profile `offline` (template hermes-offline).
#
# The profile that will NOT keep this class: Phase 3 gives it the strictest
# one (the egress proxy denies every CONNECT), which is the whole point of
# having a profile that declares it fetches nothing. Until the proxy exists,
# an offline session gets exactly what every other profile gets — cluster DNS
# — because removing DNS today would break name resolution without adding any
# guard, and the class list is enforced here, not by the template (the CRD's
# spec.networkPolicy is K8s-NetworkPolicy-shaped and additive next to Cilium,
# which is why every template sets networkPolicyManagement: Unmanaged).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-sandbox-class-dns-only-offline
  namespace: hermes-sandbox
spec:
  description: >-
    Egress class dns-only for profile offline: cluster DNS, nothing else
    until Phase 3 replaces this class with the proxy's deny-all.
  endpointSelector:
    matchLabels:
      workload.hermes.io/profile: offline
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# hermes-sandbox ingress allowlist — the only callers of sandbox APIs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-sandbox-ingress-router
  namespace: hermes-sandbox
spec:
  description: >-
    The only ingress a sandbox accepts: the sandbox-router reaching the
    runtime REST port (8080) and the Hermes gateway reaching the runtime
    gRPC ProcessService (9090, exec). Cilium v2 has no namespaceSelector —
    cross-namespace matching uses the k8s:io.kubernetes.pod.namespace
    virtual label combined with the peer's real pod labels (repo pattern
    from agent-sandbox/cilium-router.yaml).
  endpointSelector:
    matchLabels: {}
  ingress:
    # Identity match on the Router itself, not on its namespace: the labels
    # below are the vendored Deployment's own selector and pod-template
    # labels (agent-sandbox/upstream/sandbox-router/deployment.yaml).
    # Matching the namespace alone would admit every pod in it —
    # agent-sandbox-system enforces PSA baseline, and PSA constrains HOW a
    # pod runs, never WHICH workloads exist, so the namespace label does not
    # narrow the peer set. 8080 is the Router's REST proxy port and the only
    # runtime API it may reach.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agent-sandbox-system
            app.kubernetes.io/name: sandbox-router
            app.kubernetes.io/component: sandbox-router
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Direct gRPC exec (user-approved fallback: sandboxd v1.0.2 has no HTTP
    # exec route and the Go router cannot proxy gRPC). The Hermes gateway is
    # the only pod that mounts the router token and owns claims, so only its
    # namespace is admitted, and only on the ProcessService port: only the
    # gateway may exec into a sandbox.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
