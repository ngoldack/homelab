# Technitium's SQLite data dir (/etc/dns). Backed by ZFS snapshots on the
# StorageClass (../truenas-csi/storageclasses.yaml truenas-fast-nfs-dns-technitium).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dns-data
  namespace: dns
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-fast-nfs-dns-technitium
  resources:
    requests:
      storage: 5Gi
