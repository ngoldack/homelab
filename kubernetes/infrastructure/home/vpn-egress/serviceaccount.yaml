# Dedicated ServiceAccount (repo convention + the cluster's
# disallow-default-serviceaccount audit policy: a pod must never run as
# `default`). The gluetun pods make no Kubernetes API call at all, so the token
# is not mounted — a compromised tunnel pod has no cluster credentials to abuse.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vpn-egress
  namespace: vpn-egress
automountServiceAccountToken: false
