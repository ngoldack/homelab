name: OpenTofu Plan

# Live planning against private Proxmox/Talos infrastructure.
# Requires NetBird VPN, the SOPS age key, and the state-encryption passphrase,
# so it deliberately does NOT run on pull requests from forks. It runs on:
#   - pushes to main that touch tofu/**
#   - manual dispatch
# Plan is read-only: it never mutates infrastructure.
#
# Network connectivity to the private cluster is established by the NetBird
# step BELOW, before the Dagger call - the Dagger module itself is network
# agnostic. All tofu logic lives in the Dagger module (.dagger). Locally
# (with your mesh already connected) this is:
#   dagger call tofu-plan --sops-age-key=env://SOPS_AGE_KEY

on:
  push:
    branches:
      - main
    paths:
      - 'tofu/**'
      - '.dagger/**'
      - '.github/workflows/tofu-plan.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tofu-state
  cancel-in-progress: false

jobs:
  plan:
    name: OpenTofu Plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to NetBird mesh
        env:
          NB_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          set -euo pipefail
          curl -fsSL https://pkgs.netbird.io/install.sh | sh
          sudo netbird up --setup-key "$NB_SETUP_KEY"
          sudo netbird status

      - name: OpenTofu Plan (Dagger)
        uses: dagger/dagger-for-github@v8.3.0
        with:
          verb: call
          args: >-
            tofu-plan
            --sops-age-key=env://SOPS_AGE_KEY
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
