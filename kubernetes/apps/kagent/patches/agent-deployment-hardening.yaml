# Cross-cutting hardening applied to EVERY declarative Agent's generated
# Deployment (kustomize patch, target kind: Agent). Keeps the 20 agent specs DRY
# instead of repeating securityContext in each file.
#
# - restricted-PSA-compliant securityContext + podSecurityContext
# - readOnlyRootFilesystem with a writable /tmp emptyDir (the ADK needs a temp dir)
# - a stable pod label (homelab.io/kagent-agent) used by the scoped Kyverno
#   Enforce policy and (Phase 2) the Cilium egress policies.
#
# SandboxAgents (finance/mail) are intentionally NOT covered here; they run on
# Agent Substrate (gVisor) and are hardened in the Substrate phase.
#
# VERIFY-BEFORE-DEPLOY: if an agent's runtime needs additional writable paths
# beyond /tmp, add them to volumes/volumeMounts here.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: agent-hardening  # ignored; the kustomize target selector matches all Agents
spec:
  declarative:
    deployment:
      labels:
        homelab.io/kagent-agent: "true"
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumes:
        - name: tmp
          emptyDir: {}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
