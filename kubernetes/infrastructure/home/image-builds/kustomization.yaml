# One-shot image build Jobs, driven by the builder in ../buildkit/.
#
# Separate from ../buildkit/ so that re-pinning a build does not churn the
# builder's own Kustomization, and so a failed Job cannot block the builder
# from reconciling — a Flux Kustomization that cannot apply also cannot prune.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ik-llama.yaml
  - hermes-sandbox-runtime.yaml
  - llama-p100.yaml
  - hermes-agent-sandbox-plugin.yaml

# The ik_llama build needs OUR Dockerfile (with the sm_60 fast-FP16 patch) while
# its build context is the remote ik_llama git tree. buildkit accepts a local
# Dockerfile alongside a remote context via `--local dockerfile=` +
# `--opt dockerfilekey=...`, so the Dockerfile ships as a ConfigMap generated
# from ik-llama/dockerfile and is mounted at /dockerfile in the buildctl pod
# (see ik-llama.yaml volumes). llama-p100/dockerfile gets the same treatment for
# the mainline-v0.4.0+patches build. disableNameSuffixHash is on because the
# Jobs reference the ConfigMaps by the exact names `ik-llama-dockerfile` and
# `llama-p100-dockerfile`.
configMapGenerator:
  - name: ik-llama-dockerfile
    namespace: buildkit
    files: [ik-llama/dockerfile]
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: llama-p100-dockerfile
    namespace: buildkit
    files: [llama-p100/dockerfile]
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true
