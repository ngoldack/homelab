# Traefik — Gateway API controller, runs ONLY on the Hetzner edge node and binds
# the node's public 80/443 (hostPort; the net.ipv4.ip_unprivileged_port_start=0
# sysctl set in tofu/edge.tf lets the non-root pod bind low ports). Implements the
# Gateway API as a second GatewayClass alongside Cilium's. Routes to homelab
# Services over the KubeSpan mesh.
#
# VERIFY-BEFORE-DEPLOY: pin the chart version; confirm the chart's GatewayClass
# behaviour (we define our own GatewayClass+Gateway in configs/edge-ingress, so
# gateway.enabled is false here). CrowdSec bouncer plugin is added in a later step.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: traefik
  chart:
    spec:
      chart: traefik
      version: "33.x"
      sourceRef:
        kind: HelmRepository
        name: traefik
      interval: 1h
  values:
    deployment:
      replicas: 1
    # Pin to the edge node only.
    nodeSelector:
      node-role: edge
    tolerations:
      - key: node-role
        value: edge
        effect: NoSchedule
    service:
      type: ClusterIP
    ports:
      web:
        port: 8000
        hostPort: 80
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
      websecure:
        port: 8443
        hostPort: 443
    providers:
      kubernetesGateway:
        enabled: true
      kubernetesIngress:
        enabled: false
    # We declare our own GatewayClass + Gateway in configs/edge-ingress.
    gateway:
      enabled: false
    # Expose access logs so the CrowdSec agent can parse them (added later).
    logs:
      access:
        enabled: true
