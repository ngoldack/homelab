# Build + push the synthetic-proxy image — the Go reverse proxy that fronts
# api.synthetic.new for the agentgateway data plane (sources:
# image-builds/synthetic-proxy/go/, entrypoint cmd/synthetic-proxy).
#
# BUILD SHAPE — identical to hermes-egress-authorizer.yaml: the context is
# THIS REPO at the pinned commit and the Dockerfile is fetched from that tree by
# repo-relative path:
# `--opt=context=<repo>#<sha>` plus `--opt=filename=<repo-relative Dockerfile>`,
# and the Dockerfile's COPY sources are repo-root-relative.
#
# CONTEXT SHA — 7ccb99f carries DisableKeepAlives (one egress per request through
# the vpn-egress pool) on top of the failover-rule migration (applyFailoverRule,
# VerdictRateLimited). The context SHA, the --output tag and the Job name
# suffix travel together (Jobs are immutable): to rebuild, bump all three.
#
# WHY THE CONTEXT SHA — NOT "was this edit only a comment?" — IS WHAT KEEPS THE
# PIN REPRODUCIBLE: Go embeds a build ID derived from the source content, so even
# a comment-only edit yields a different binary. Measured 2026-09-21: two builds
# of the same program differing only in a comment hash differently, with
# `-trimpath -ldflags="-s -w"` applied. A pinned digest therefore only
# reproduces from the exact revision recorded here, which is why a docs-only
# source change still moves this SHA (the commit `76f9ae6` reasoning — "the
# compiled binary is unchanged" — is not sound).
#
# WHY s11 AND NOT s9: the suffix only has to be unique among the Jobs that
# actually exist in the cluster, because a Job spec is immutable and Flux fails
# the whole Kustomization on a colliding name. Two newer suffixes are already
# taken there by an in-flight branch (s9 and s10, both built from
# feat/proxy-debug-error-logs and applied by hand), so this change steps past
# them rather than colliding. If that branch lands its own rebuild, it will need
# the same treatment in reverse.
#
# WHY NO cosign/trivy pipeline (unlike hermes-egress-authorizer.yaml): that
# pipeline exists to satisfy the hermes egress supply-chain lane. This proxy is
# an internal, cluster-only component with no equivalent signing policy, so the
# Job stays minimal — buildctl build+push, then print the digest to pin in
# agentgateway/synthetic-proxy.yaml.
#
# DIGEST SOURCE — the pin is read from the image's own
# `pushing manifest for <tag>@sha256:…` line, NOT the last sha256 in the log:
# that last one is the cache-export manifest, which is a DIFFERENT digest (the
# s1 build printed the wrong one, hence the s2 suffix).
#
# WHY no Zot repository pre-create: BuildKit/Zot create the repository on the
# first push, so this Job only builds and pushes.
apiVersion: batch/v1
kind: Job
metadata:
  name: build-synthetic-proxy-s11
  namespace: buildkit
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 2700
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        topology.homelab/site: home
      containers:
      - name: buildctl
        image: moby/buildkit:v0.31.0
        command:
        - /bin/sh
        - -c
        args:
        - 'set -euo pipefail &&

          echo "== buildctl build+push ==" &&

          set +e && buildctl ''--addr=tcp://buildkitd:1234'' ''--tlscacert=/certs/ca.crt''
          ''--tlscert=/certs/tls.crt'' ''--tlskey=/certs/tls.key'' ''build'' ''--frontend=dockerfile.v0''
          ''--opt=context=https://github.com/ngoldack/homelab.git#7ccb99f2a1a75e43368b9423b731a1d37a8aadd0''
          ''--opt=filename=kubernetes/infrastructure/home/image-builds/synthetic-proxy/Dockerfile''
          ''--output=type=image,name=registry.ngoldack.de/synthetic-proxy:0.1.0-7ccb99f,push=true''
          ''--export-cache=type=registry,ref=registry.ngoldack.de/synthetic-proxy:buildcache,mode=max''
          ''--import-cache=type=registry,ref=registry.ngoldack.de/synthetic-proxy:buildcache''
          ''--progress=plain'' > /tmp/build.log 2>&1; rc=$?; set -e;

          cat /tmp/build.log;

          test $rc -eq 0 || { echo "BUILD FAILED rc=$rc"; exit $rc; };

          IMAGE=registry.ngoldack.de/synthetic-proxy:0.1.0-7ccb99f;
          DIGEST=$(grep -oE "pushing manifest for $IMAGE@sha256:[a-f0-9]{64}" /tmp/build.log | grep -oE ''sha256:[a-f0-9]{64}'' | tail -1);

          test -n "$DIGEST" || { echo "NO DIGEST in build log"; exit 1; };

          echo "DIGEST=$DIGEST";

          echo "PIN: registry.ngoldack.de/synthetic-proxy@$DIGEST"

          '
        env:
        - name: DOCKER_CONFIG
          value: /docker
        volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
        - name: docker
          mountPath: /docker
          readOnly: true
      volumes:
      - name: certs
        secret:
          secretName: buildctl-client-tls
      - name: docker
        secret:
          secretName: registry-credentials
          items:
          - key: .dockerconfigjson
            path: config.json
