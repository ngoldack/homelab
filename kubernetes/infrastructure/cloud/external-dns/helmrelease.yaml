# external-dns creates/updates Hetzner DNS A records for Gateway HTTPRoute
# hostnames under svc.{domain}, so each app's route resolves to the cloud
# ingress automatically. Scoped by domainFilters so it cannot touch records
# outside this cluster's naming convention.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: "1.15.2"
      sourceRef:
        kind: HelmRepository
        name: external-dns
      interval: 1h
  targetNamespace: network
  values:
    # "hetzner" is not a built-in provider in external-dns 0.15.x (app
    # version of chart 1.15.2) — it was moved out to the separate
    # webhook-provider pattern. This runs the maintained community webhook
    # (github.com/mconfalonieri/external-dns-hetzner-webhook) as a sidecar;
    # bump webhook.image.tag deliberately, same as any other chart version.
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/mconfalonieri/external-dns-hetzner-webhook
          tag: v1.0.2
        env:
          - name: HETZNER_API_KEY
            valueFrom:
              secretKeyRef:
                name: hetzner-dns-token
                key: api-token
    sources:
      - gateway-httproute
      - service
    # Only manage records under svc.{domain} — nothing else in the zone.
    domainFilters:
      - svc.${CLUSTER_DOMAIN}
    txtOwnerId: ${CLUSTER_NAME:-home-talos}
    policy: sync
    interval: 1m
