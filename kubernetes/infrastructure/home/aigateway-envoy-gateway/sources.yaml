# OCI source for the Envoy Gateway data-plane control plane. This lane is a
# SEPARATE Flux Kustomization from the aigateway lane so the gateway.envoyproxy.io
# CRDs (Kind: Backend) land before aigateway's Backend CRs dry-run — without
# the split, aigateway's kustomization fails atomically on the Backend CR
# (CRD not yet present) and the envoy-gateway HelmRelease inside it never gets
# created at all.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  type: oci
  interval: 1h
  url: oci://docker.io/envoyproxy
