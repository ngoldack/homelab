# Kata RuntimeClass for sandbox Pods. handler observed LIVE from the installed
# extension: /etc/cri/conf.d/10-kata-containers.part declares
# [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.kata] with
# runtime_type io.containerd.kata.v2 — the handler is `kata` (never a guess).
# Scheduling MUST be confined to the dedicated sandbox worker: selector +
# taint toleration keep every non-sandbox workload off the node, and the taint
# (applied by the node-taints Flux Job) keeps sandboxes from landing anywhere
# else.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
handler: kata
scheduling:
  nodeSelector:
    workload.hermes.io/sandbox: "true"
  tolerations:
    - key: workload.hermes.io/sandbox
      operator: Equal
      value: "true"
      effect: NoSchedule
