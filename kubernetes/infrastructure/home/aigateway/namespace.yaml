# Envoy AI Gateway (theagentrouter.ai, "formerly Envoy AI Gateway") control
# plane: the ai-gateway-controller Deployment, its CRDs, and the model-route
# CRs that describe the DeepSeek routes via OpenRouter.
#
# Two exposure layers, independent:
#   * LAN data plane (envoyproxy.yaml): the LB Service keeps
#     dns.ngoldack.de/scope=internal so Cilium L2-announcements hand it a
#     LAN VIP (10.30.0.201). This is the in-cluster / LAN path to all models.
#   * Public edge (httproute-edge.yaml): a single hostname (llm.ngoldack.de)
#     fronts ONLY the local P100 model through the authentik edge outpost
#     (Basic-auth). The namespace carries gateway.ngoldack.de/edge-ingress so
#     the edge Gateway (network/edge.yaml, allowedRoutes from: Selector)
#     accepts routes from here.
apiVersion: v1
kind: Namespace
metadata:
  name: aigateway
  labels:
    gateway.ngoldack.de/edge-ingress: "true"
