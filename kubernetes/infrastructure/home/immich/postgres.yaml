# Immich's Postgres, following immich-charts' own reference setup
# (local/cloudnative-pg.yaml upstream).
#
# The vchord extension is the reason this is not a stock Postgres: Immich's
# smart search stores CLIP embeddings as vectors, and vchord provides the
# index type it queries them with. It arrives as an OCI extension image
# mounted into the instance rather than a custom Postgres build, which is why
# the operator must be recent.
#
# shared_preload_libraries loads vchord.so at startup; the extensions are then
# CREATEd inside the database by the Database CR in database.yaml. Both halves
# are required — preloading alone does not create the extension, and creating
# it without the preload fails.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
  namespace: immich
spec:
  # 2 instances with a strict synchronous quorum: Immich is user-facing
  # availability-critical (photo library), so the primary's commits wait for
  # the replica before acking.
  instances: 2
  minSyncReplicas: 1
  maxSyncReplicas: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
  # Pinned to the home site: every TrueNAS StorageClass reaches the NAS at
  # 10.20.10.10, which is not routable from the Hetzner ingress node.
  affinity:
    nodeSelector:
      topology.homelab/site: home
  storage:
    size: 20Gi
    storageClass: truenas-fast-nvmeof-immich-database
  postgresql:
    parameters:
      # Force a WAL segment switch every 60s so archived WAL trails the
      # primary by at most ~1 minute regardless of write volume — without
      # it a quiet database leaves its newest WAL unarchived until the
      # 16 MiB segment fills (first restore drill died exactly on this:
      # "recovery ended before configured recovery target was reached").
      archive_timeout: "60"
    shared_preload_libraries:
      - "vchord.so"
    extensions:
      - name: vchord
        image:
          # Pinned: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1
          reference: ghcr.io/tensorchord/vchord-scratch@sha256:bdea43bed2a414e21bbf71767bf6f0739747ac480b267b51772dc214ac28dcb3
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18/
  # Backups + WAL archiving via the Barman Cloud plugin: the ObjectStore CR
  # (objectstore.yaml) owns destination/retention; this reference enables
  # archiving. spec.backup.retentionPolicy is NOT set here — in-tree-Barman-
  # only, ignored when a plugin owns backups.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-backup-store
