apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright-mcp
  namespace: playwright-mcp
  labels:
    app.kubernetes.io/name: playwright-mcp
spec:
  # Always-on single replica. The Playwright MCP server keeps per-session
  # browser state over long-lived SSE / streamable-HTTP connections, so the
  # KEDA http-add-on scale-from-zero pattern (used for vLLM) is not a fit here.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: playwright-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: playwright-mcp
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: playwright-mcp
          # Microsoft Playwright MCP — exposes browser automation as MCP tools
          # consumed by n8n (MCP Client node) and Khoj over HTTP/SSE.
          # Pinned for reproducible GitOps (was :latest).
          image: mcr.microsoft.com/playwright/mcp:v0.0.75
          # Headless Chromium needs a writable root fs and its bundled user, so
          # runAsNonRoot/readOnlyRootFilesystem are not enforced. The real control
          # for this unauthenticated browser surface is the CiliumNetworkPolicy,
          # which blocks egress to the LAN/cluster/metadata ranges.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - --port
            - "8931"
            - --host
            - 0.0.0.0
            - --headless
            - --browser
            - chromium
            # Required to run headless Chromium inside an unprivileged container.
            - --no-sandbox
            # Fresh in-memory profile per session; no persistent state on disk.
            - --isolated
          ports:
            - name: http
              containerPort: 8931
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              # Chromium is memory-hungry; keep a generous ceiling.
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
