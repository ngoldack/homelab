# The media stack on one app-template release (releaseName `media`, hence
# Services `media-jellyfin`, `media-sonarr`, ... and the HTTPRoute backends),
# except the request UI: Seerr ships its own upstream chart + release
# (seerr.yaml) instead of a controller/service entry here.
#
# Two pods families live here:
#
#   playback   jellyfin (+ Seerr for requests, its own release above) —
#              LAN-resident media server, no VLAN attachment, reached on the
#              LAN VIP.
#   automation sabnzbd, prowlarr, sonarr, radarr, bazarr — the download chain.
#              Every one of these carries a macvlan interface on VLAN 2080
#              (UniFi "Obfuscated", auto-VPN-routed) so indexer queries and
#              usenet traffic leave through the VPN, and a vlan-routes init
#              container that moves the pod's default route onto it while
#              keeping cluster traffic on eth0. See ../media/nad-vlan-2080.yaml
#              and vlan-routes-configmap.yaml.
#
# Everything shares /data (the media-library PVC): downloads land in
# /data/usenet/complete and Sonarr/Radarr import into /data/media/{tv,movies}
# by hardlink — which is only possible on ONE filesystem, the reason the
# downloads directory is not a separate volume.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: media
  namespace: flux-system
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: app-template
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: media
      interval: 1h
  targetNamespace: media
  releaseName: media
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Everything reads/writes TrueNAS NFS, which only the LAN workers can
    # reach; jellyfin additionally pulls onto the iGPU node via its own
    # nodeSelector below (overriding this default).
    defaultPodOptions:
      nodeSelector:
        topology.homelab/site: home
    controllers:
      jellyfin:
        type: deployment
        pod:
          # Pull onto the single node with the passthrough iGPU (QuickSync):
          # Jellyfin transcodes with it via /dev/dri (mount below).
          nodeSelector:
            workload/media: "true"
        containers:
          main:
            image:
              repository: jellyfin/jellyfin
              tag: "12.1"
            env:
              TZ: Europe/Berlin
              # Advertised to clients so apps auto-discover the right URL
              # instead of the cluster-internal address. {app}.{namespace}.svc
              # is the repo's canonical service URL scheme (see
              # network/certificate.yaml, *.svc.${CLUSTER_DOMAIN}).
              JELLYFIN_PublishedServerUrl: https://jellyfin.media.svc.${CLUSTER_DOMAIN}
            ports:
              - name: http
                containerPort: 8096
            # Intel QuickSync: the node's iGPU is passed through to
            # wk-main-efficiency (hostpci intel-igpu, i915 extension in the
            # image) and shows up as /dev/dri — mounted below via hostPath,
            # no privileged mode needed (the image runs as root).
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 4Gi
            # Generous: first boot initializes the library DB and the first
            # transcode can take a while (mirrors immich/paperless posture).
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
      sabnzbd:
        type: deployment
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: '[{"name":"vlan-2080","ips":["10.20.80.205/24"]}]'
        initContainers:
          vlan-routes:
            image:
              repository: ghcr.io/nicolaka/netshoot
              tag: v0.16
            command: ["sh", "/scripts/attach.sh"]
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
          host-whitelist:
            image:
              repository: linuxserver/sabnzbd
              tag: "5.1.3"
            command:
              - sh
              - -c
              - |
                python3 - <<'PY'
                import pathlib, re
                p = pathlib.Path("/config/sabnzbd.ini")
                want = ["localhost", "media-sabnzbd.media",
                        "media-sabnzbd.media.svc.cluster.local",
                        "sabnzbd.media.svc.ngoldack.de"]
                if not p.exists():
                    p.write_text("[misc]\nhost_whitelist = localhost\n")
                def repl(m):
                    cur = [x.strip() for x in m.group(1).split(",") if x.strip()]
                    merged = cur + [w for w in want if w not in cur]
                    return "host_whitelist = " + ",".join(merged)
                s = p.read_text()
                s2, n = re.subn(r'^host_whitelist\s*=\s*(.*)$', repl, s, flags=re.M)
                p.write_text(s2)
                print("merged host_whitelist entries:", n)
                PY
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
            resources:
              requests:
                cpu: 10m
                memory: 30Mi
              limits:
                memory: 80Mi
        containers:
          main:
            image:
              repository: linuxserver/sabnzbd
              tag: "5.1.3"
            env:
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
              TZ: Europe/Berlin
            ports:
              - name: http
                containerPort: 8080
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
      sonarr:
        type: deployment
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: '[{"name":"vlan-2080","ips":["10.20.80.201/24"]}]'
        initContainers:
          vlan-routes:
            image:
              repository: ghcr.io/nicolaka/netshoot
              tag: v0.16
            command: ["sh", "/scripts/attach.sh"]
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
          external-auth:
            image:
              repository: docker.io/library/busybox
              tag: "1.36"
            # Sonarr/Radarr/Prowlarr/Bazarr "trust the external authentication
            # layer" (goauthentik sonarr integration): set
            # AuthenticationMethod=External in config.xml. Idempotent; if the
            # file is missing (very first boot) the app creates it with its
            # default and the next restart external-izes it.
            command:
              - sh
              - -c
              - |
                echo "external-auth init"
                # strip trailing whitespace from the image lines
                sed -i 's#<AuthenticationMethod>[^<]*#<AuthenticationMethod>External#' /config/config.xml
                if [ ! -f /config/config.xml ] || ! grep -q '<AuthenticationMethod>' /config/config.xml; then
                  echo "config.xml not yet seeded; will external-ize on next start"
                else
                  grep -o '<AuthenticationMethod>[^<]*' /config/config.xml || true
                fi
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
            resources:
              requests:
                cpu: 10m
                memory: 20Mi
              limits:
                memory: 50Mi
        containers:
          main:
            image:
              repository: linuxserver/sonarr
              tag: "4.0.19"
            env:
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
              TZ: Europe/Berlin
            ports:
              - name: http
                containerPort: 8989
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
      radarr:
        type: deployment
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: '[{"name":"vlan-2080","ips":["10.20.80.202/24"]}]'
        initContainers:
          vlan-routes:
            image:
              repository: ghcr.io/nicolaka/netshoot
              tag: v0.16
            command: ["sh", "/scripts/attach.sh"]
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
          external-auth:
            image:
              repository: docker.io/library/busybox
              tag: "1.36"
            # Sonarr/Radarr/Prowlarr/Bazarr "trust the external authentication
            # layer" (goauthentik sonarr integration): set
            # AuthenticationMethod=External in config.xml. Idempotent; if the
            # file is missing (very first boot) the app creates it with its
            # default and the next restart external-izes it.
            command:
              - sh
              - -c
              - |
                echo "external-auth init"
                # strip trailing whitespace from the image lines
                sed -i 's#<AuthenticationMethod>[^<]*#<AuthenticationMethod>External#' /config/config.xml
                if [ ! -f /config/config.xml ] || ! grep -q '<AuthenticationMethod>' /config/config.xml; then
                  echo "config.xml not yet seeded; will external-ize on next start"
                else
                  grep -o '<AuthenticationMethod>[^<]*' /config/config.xml || true
                fi
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
            resources:
              requests:
                cpu: 10m
                memory: 20Mi
              limits:
                memory: 50Mi
        containers:
          main:
            image:
              repository: linuxserver/radarr
              tag: "6.3.0"
            env:
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
              TZ: Europe/Berlin
            ports:
              - name: http
                containerPort: 7878
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
      prowlarr:
        type: deployment
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: '[{"name":"vlan-2080","ips":["10.20.80.203/24"]}]'
        initContainers:
          vlan-routes:
            image:
              repository: ghcr.io/nicolaka/netshoot
              tag: v0.16
            command: ["sh", "/scripts/attach.sh"]
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
          external-auth:
            image:
              repository: docker.io/library/busybox
              tag: "1.36"
            # Sonarr/Radarr/Prowlarr/Bazarr "trust the external authentication
            # layer" (goauthentik sonarr integration): set
            # AuthenticationMethod=External in config.xml. Idempotent; if the
            # file is missing (very first boot) the app creates it with its
            # default and the next restart external-izes it.
            command:
              - sh
              - -c
              - |
                echo "external-auth init"
                # strip trailing whitespace from the image lines
                sed -i 's#<AuthenticationMethod>[^<]*#<AuthenticationMethod>External#' /config/config.xml
                if [ ! -f /config/config.xml ] || ! grep -q '<AuthenticationMethod>' /config/config.xml; then
                  echo "config.xml not yet seeded; will external-ize on next start"
                else
                  grep -o '<AuthenticationMethod>[^<]*' /config/config.xml || true
                fi
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
            resources:
              requests:
                cpu: 10m
                memory: 20Mi
              limits:
                memory: 50Mi
        containers:
          main:
            image:
              repository: linuxserver/prowlarr
              tag: "2.5.2"
            env:
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
              TZ: Europe/Berlin
            ports:
              - name: http
                containerPort: 9696
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
      bazarr:
        type: deployment
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: '[{"name":"vlan-2080","ips":["10.20.80.204/24"]}]'
        initContainers:
          vlan-routes:
            image:
              repository: ghcr.io/nicolaka/netshoot
              tag: v0.16
            command: ["sh", "/scripts/attach.sh"]
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
          external-auth:
            image:
              repository: docker.io/library/busybox
              tag: "1.36"
            # Sonarr/Radarr/Prowlarr/Bazarr "trust the external authentication
            # layer" (goauthentik sonarr integration): set
            # AuthenticationMethod=External in config.xml. Idempotent; if the
            # file is missing (very first boot) the app creates it with its
            # default and the next restart external-izes it.
            command:
              - sh
              - -c
              - |
                echo "external-auth init"
                # strip trailing whitespace from the image lines
                sed -i 's#<AuthenticationMethod>[^<]*#<AuthenticationMethod>External#' /config/config.xml
                if [ ! -f /config/config.xml ] || ! grep -q '<AuthenticationMethod>' /config/config.xml; then
