# SeaweedFS S3 wiring for Authentik media storage: an IAM identity + generated
# credentials Secret (authentik-media-credentials, AWS_*-named keys) and the
# authentik-media bucket owned by that identity. Replaces the previous
# Crossplane-provisioned MinIO user/bucket.
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: authentik-media
  namespace: authentik
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: authentik-media
  namespace: authentik
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  identityRef:
    name: authentik-media
  secretRef:
    name: authentik-media-credentials
    accessKeyField: AWS_ACCESS_KEY_ID
    secretKeyField: AWS_SECRET_ACCESS_KEY
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: authentik-media
  namespace: authentik
spec:
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  reclaimPolicy: Retain
  owner: authentik-media
  access:
    - user: authentik-media
      actions: [Read, Write, List, Tagging, Admin]
