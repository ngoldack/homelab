# Key-authenticated routes for the EDGE data plane (agentgateway-edge):
# mirror of httproute-key.yaml (local-llm-key) parented to the edge Gateway,
# so CLI consumers (opencode via /v1/key/chat) keep working on the public
# hostname llm.aigateway.svc.ngoldack.de with the same X-Api-Key auth.
#
# KEEP IN SYNC with httproute-key.yaml — identical rules, identical order.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: local-llm-key-edge
  namespace: agentgateway
spec:
  parentRefs:
    - name: agentgateway-edge
      namespace: agentgateway
  rules:
    # Coding model: DeepSeek V4.1 Flash (OpenRouter).
    - matches:
        - path:
            type: PathPrefix
            value: /v1/key/chat
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: openrouter-deepseek-v41-flash
    # Free model: Union Alpha (OpenRouter stealth).
    - matches:
        - path:
            type: PathPrefix
            value: /v1/key/free
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: openrouter-union-alpha
    # Synthetic gpt-oss-120b: hindsight's extraction/consolidation model.
    # Walks the hindsight-chain backend (synthetic primary, OpenRouter
    # fallback). The fallback is driven by the proxy's 503 -- see the
    # equivalent comment in httproute-key.yaml -- not by the gateway reading a
    # 429.
    - matches:
        - path:
            type: PathPrefix
            value: /v1/key/synthetic-gpt-oss
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: hindsight-chain
    # Agent chains: synthetic-first with OpenRouter fallback (see
    # agent-chains.yaml). Same chains as the home data plane.
    - matches:
        - path:
            type: PathPrefix
            value: /v1/key/general-purpose
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: general-purpose-chain
    - matches:
        - path:
            type: PathPrefix
            value: /v1/key/coding-small
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: coding-small-chain
    - matches:
        - path:
            type: PathPrefix
            value: /v1/key/coding-medium
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: coding-medium-chain
    - matches:
        - path:
            type: PathPrefix
            value: /v1/key/coding-large
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: coding-large-chain
