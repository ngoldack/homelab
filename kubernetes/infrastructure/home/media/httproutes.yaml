# Books stack (books.yaml): the three UIs behind the same authentik proxy
# outpost as the *arr chain. Bindery runs in proxy auth mode, so its outpost
# session IS its login; Grimmory and pyLoad keep their own login behind the
# gate. The outpost's skip_path_regex (authentik/seed.yaml) is what keeps the
# e-reader/API surfaces (grimmory /api + /komga, bindery /api, pyload /api)
# reachable without a browser session.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bindery
  namespace: media
  labels:
    dns.ngoldack.de/publish: lan
spec:
  parentRefs:
    - name: public
      namespace: network
      sectionName: https-media-svc
  hostnames:
    - bindery.media.svc.${CLUSTER_DOMAIN}
  rules:
    - backendRefs:
        - name: authentik-proxy
          namespace: authentik
          port: 9000
---
