# Routes for agentgateway: /v1/chat/completions and /v1/models spring to
# local-p100, /v1/chat (prefix) falls back to the tiered chat-chain, and
# /v1/synthetic-{small,large,deepseek} pin one Synthetic tier each
# (synthetic-small / synthetic-large / synthetic-hf-deepseek backends).
#
# The exact-match rules (/v1/chat/completions, /v1/models) are placed BEFORE
# the /v1/chat prefix rule to respect Gateway API's first-match semantics (the
# agentgateway OpenTelemetry demo uses the same ordering: exact completions
# before chain). The same constraint applies to the tier rules below: they are
# listed before /v1/chat, and nothing here may widen /v1/chat to a bare /v1
# prefix — that would swallow /v1/models and every /v1/synthetic-* path, since
# first-match means the earlier broad rule wins. (PathPrefix matches on path
# segments, so today /v1/chat cannot capture /v1/synthetic-*; the ordering is
# belt-and-braces against a later edit.)
#
# No host-based routing is added (the old aigateway had host-based ingress via
# EdgeOutpost). The new gateway uses path-only matching; authentication and
# backend selection are handled by policies (jwt-auth) and backends.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: local-llm
  namespace: agentgateway
spec:
  parentRefs:
    - name: agentgateway
      namespace: agentgateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: local-p100
    - matches:
        - path:
            type: PathPrefix
            value: /v1/models
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: local-p100
    - matches:
        - path:
            type: PathPrefix
            value: /v1/synthetic-small
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: synthetic-small
    - matches:
        - path:
            type: PathPrefix
            value: /v1/synthetic-large
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: synthetic-large
    - matches:
        - path:
            type: PathPrefix
            value: /v1/synthetic-deepseek
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: synthetic-hf-deepseek
    - matches:
        - path:
            type: PathPrefix
            value: /v1/synthetic-gpt-oss
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: synthetic-hf-openai-gpt-oss-120b
    # OpenAI-compatible path for browser-side AI assistants (Headlamp's AI
    # plugin normalizes its baseUrl to end in /v1 and appends
    # /chat/completions, so this is the exact path such a client emits).
    # JWT-authenticated (the gateway's Strict JWT policy); NOT under /v1/key/*
    # (apiKeyAuthentication Strict on X-Api-Key would reject a JWT-only
    # request). Targets the general-purpose chain: synthetic-first with
    # OpenRouter fallback, so it stays healthy while synthetic rate-limits.
    - matches:
        - path:
            type: PathPrefix
            value: /assistant/v1/chat/completions
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: general-purpose-chain
    # Agent chains (R4): JWT-authenticated aliases for the multi-agent LLM
    # routing (the 4 chains in agent-chains.yaml). Hermes agents call these
    # paths with the SAME aigateway-oidc JWT the existing /v1/* routes use
    # (the /v1/key/* static-key variants remain for CLI consumers). Each
    # walks its own chain backend; synthetic 429 evicts synthetic for 10 min
    # (policy-agent-chains-health.yaml).
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chain/general-purpose
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: general-purpose-chain
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chain/coding-small
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: coding-small-chain
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chain/coding-medium
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: coding-medium-chain
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chain/coding-large
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: coding-large-chain
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: chat-chain
