# CrowdSec core: the Local API (LAPI) plus one agent per node. The LAPI is the
# single source of truth for alerts/decisions and holds the bouncer API keys;
# the agents read every node's pod logs and feed detections to it.
#
# releaseName is pinned to "crowdsec" for the same reason immich pins its: the
# chart derives Service/Deployment/PVC names from .Release.Name, and Flux's
# default would render <targetNamespace>-<name> (crowdsec-crowdsec), making the
# LAPI Service crowdsec-crowdsec-service. Everything downstream (the bouncer's
# config.bouncer.lapiURL, the Job, the VMServiceScrapes) keys off the
# chart-default crowdsec-service, so the release name must stay crowdsec.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: flux-system
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: crowdsec
      version: "0.24.2"
      sourceRef:
        kind: HelmRepository
        name: crowdsecurity
      interval: 1h
  targetNamespace: crowdsec
  releaseName: crowdsec
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Talos runs containerd (no docker shim), so the docker-logs parser's
    # stream framing must be set to containerd or parsed lines are junk.
    container_runtime: containerd

    lapi:
      replicas: 1
      # The LAPI's data + config PVCs live on truenas-fast-nfs, whose CSI node
      # plugin only runs on the LAN nodes (truenas-csi is pinned to
      # topology.homelab/site=home). Pin the LAPI here too, or it could land on
      # the Hetzner ingress node where the NFS mount never comes up (TrueNAS
      # 10.30.0.5 is not routed on that site). Same rule every NFS consumer in
      # this repo follows (phoenix/authentik CNPG clusters).
      nodeSelector:
        topology.homelab/site: home
      persistentVolume:
        data:
          # NO default StorageClass exists in this cluster; every PVC must name
          # one. Bouncer API keys + decisions DB, so this must survive LAPI
          # restarts.
          storageClassName: truenas-fast-nfs
        config:
          # ReadWriteMany, not the chart's ReadWriteOnce default: the one-shot
          # bouncer-registration Job (bouncer-register.yaml) mounts this same
          # PVC read-write alongside the running LAPI to reach cscli's machine
          # credentials. They may land on different home nodes, and NFS is
          # shared anyway; RWO would trap the Job on whatever node the LAPI
          # happened to pick.
          accessModes:
            - ReadWriteMany
          storageClassName: truenas-fast-nfs
      # Metrics are ON (port 6060 on the lapi Service), but the prometheus-
      # operator ServiceMonitor the chart would otherwise render is OFF — those
      # CRDs do not exist here (the stack is VictoriaMetrics). Scraping is a
      # VMServiceScrape in vm-scrapes.yaml; vmagent runs selectAllByDefault.
      metrics:
        enabled: true
        serviceMonitor:
          enabled: false

    agent:
      # DaemonSet is the chart default: one agent per node, each reading the
      # logs of the pods scheduled there. The acquisitions below are the
      # authentik pods whose logs feed the firix/authentik parsers; the
      # program name is arbitrary but must match what the parser's
      # acquisitions look for (see COLLECTIONS below).
      acquisition:
        - namespace: authentik
          podName: authentik-server-*
          program: authentik
        - namespace: authentik
          podName: authentik-worker-*
          program: authentik
        - namespace: authentik
          podName: authentik-proxy-*
          program: authentik
      env:
        # base-config/app-default/linux are the stock collections; firix/authentik
        # is the third-party parser for authentik flows (the reason authentik's
        # logs are acquired at all). Space-separated is the cscli collection
        # syntax.
        - name: COLLECTIONS
          value: crowdsecurity/app-default crowdsecurity/base-config firix/authentik crowdsecurity/linux
      metrics:
        enabled: true
        serviceMonitor:
          enabled: false
