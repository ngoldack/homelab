# egress-authorizer — plan Unit 3.2. The deterministic ext_authz decision point
# (image-builds/hermes-egress-guard/go/authorizer.go: POST /check,
# GET /healthz, both on :8080 by default). It makes NO network call except the
# signed event POST to the reaper, and NO Kubernetes API call at all (identity
# is the HMAC token only), so the egress its Cilium allowlist admits for this
# namespace is consumed by: this pod -> reaper:8080 (events) + cluster DNS.
# The kube-apiserver egress rule in cilium-policy.yaml is NOT namespace-wide:
# it lives in the hermes-egress-apiserver-reaper document, whose
# endpointSelector matches the reaper pod only. So the authorizer has no API
# path at all — matching its grants: no API RBAC, no ServiceAccount token.
#
# Image: ONE guard image, TWO services selected by the ROLE passed as the
# first argv (the Go binary /guard dispatches authorizer|reaper). Tag +
# PENDING-digest comment:
#
# Env vars are exactly the ones authorizer.go reads (config.go env_*
# helpers fail-fast on a missing required value or unparseable integer — a
# wrong key is a CrashLoopBackOff, never a silent misconfiguration).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-authorizer
  namespace: hermes-egress
  labels:
    app.kubernetes.io/name: egress-authorizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: egress-authorizer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxSurge 0 (repo convention) forces maxUnavailable >= 1; see
      # envoy.yaml for the full note.
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: egress-authorizer
    spec:
      serviceAccountName: egress-authorizer
      # The authorizer NEVER touches the Kubernetes API (its identity comes
      # from the HMAC token, not from pod labels), so it mounts no SA token:
      # a compromised authorizer has no cluster credentials to abuse.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: authorizer
          # Pinned by manifest digest (Docker-Content-Digest of
          # registry.ngoldack.de/hermes-egress-guard:0.1.0, built from this
          # revision's sources through buildkitd:1234 and verified with
          # `skopeo inspect`). Re-pin after every rebuild — record the new
          # digest in image-builds/hermes-egress-authorizer.yaml too.
          image: registry.ngoldack.de/hermes-egress-guard@sha256:65b188a78da480483c0e2fd4be67df5243d94ddae6856a5e2ea4727d9b735578
          # argv dispatch: the image entrypoint is the Go binary /guard, which
          # selects its role from the FIRST argv (authorizer | reaper). There
          # is no EGRESS_ROLE env — the argv IS the selector, so a wrong or
          # missing arg fails loudly at startup.
          command: ["/guard"]
          args: ["authorizer"]
          env:
            # The HMAC secret: identity + event signing material. Mounted from
            # the SOPS-encrypted egress-hmac Secret (secret.sops.yaml) — the
            # same key material the Hermes gateway and the reaper consume, so
            # the minter, verifier and signer agree byte-for-byte.
            - name: EGRESS_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: egress-hmac
                  key: EGRESS_HMAC_SECRET
            # Policy file: the ConfigMap above (policy-configmap.yaml).
            - name: EGRESS_POLICY_FILE
              value: /etc/egress/policy.json
            # Strikes: 3 denies inside 60 s => quarantine (plan contract).
            - name: EGRESS_STRIKE_THRESHOLD
              value: "3"
            - name: EGRESS_STRIKE_WINDOW_S
              value: "60"
            # Reaper endpoint for signed events (authorizer.DEFAULT_REAPER_URL
            # is this same in-cluster address).
            - name: EGRESS_REAPER_URL
              value: http://sandbox-reaper.hermes-egress.svc.cluster.local:8080/events
            # Token window: mints live ≤24 h, verify accepts ±60 s skew. The
            # plugin mints at claim-create with the same max TTL, so a token
            # never expires mid-session (sessions are ≤4 h by claim lifetime).
            - name: EGRESS_TOKEN_SKEW_S
              value: "60"
            - name: EGRESS_TOKEN_MAX_TTL_S
              value: "86400"
            - name: EGRESS_LISTEN_PORT
              value: "8080"
            - name: EGRESS_MAX_SESSIONS
              value: "4096"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: check
              containerPort: 8080
              protocol: TCP
          # /healthz answers 200 with the policy version + profile set —
          # a healthy answer proves the policy file loaded (a bad policy is a
          # startup abort, so a ready pod always has a parseable policy).
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: policy
              mountPath: /etc/egress
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: policy
          configMap:
            name: egress-authorizer-policy
        - name: tmp
          emptyDir: {}
---
# Service egress-authorizer:8080 — the fixed contract endpoint (POST /check →
# 200 allow / 403 deny+strike / 403 + x-egress-kill: 1).
apiVersion: v1
kind: Service
metadata:
  name: egress-authorizer
  namespace: hermes-egress
  labels:
    app.kubernetes.io/name: egress-authorizer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: egress-authorizer
  ports:
    - name: check
      port: 8080
      targetPort: 8080
      protocol: TCP
