# Scoped Enforce hardening for kagent declarative-agent pods ONLY (selected by the
# homelab.io/kagent-agent label set via apps/kagent/patches). This is Enforce
# (unlike the three cluster-wide Audit baseline policies in policies.yaml) but is
# label-scoped so it cannot block the kagent controller / tool-server / UI /
# bundled-postgres pods that share the kagent namespace.
#
# Defense-in-depth: the agents already carry this securityContext from the
# kustomize patch; this policy rejects any future agent pod that is missing it.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: kagent-agent-restricted
  annotations:
    policies.kyverno.io/title: "kagent Agent Pods Restricted"
    policies.kyverno.io/category: "AI Agent Hardening"
    policies.kyverno.io/severity: "high"
    policies.kyverno.io/description: >-
      Enforces restricted-style securityContext on kagent declarative-agent pods
      (least privilege, no host namespaces, drop ALL caps, read-only rootfs).
spec:
  background: true
  rules:
    - name: agent-no-privileged-or-host
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  homelab.io/kagent-agent: "true"
      validate:
        failureAction: Enforce
        message: "kagent agent pods must not use host namespaces or privileged/hostPath."
        pattern:
          spec:
            =(hostNetwork): false
            =(hostPID): false
            =(hostIPC): false
            =(volumes):
              - X(hostPath): "null"
            containers:
              - =(securityContext):
                  =(privileged): false
    - name: agent-restricted-security-context
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  homelab.io/kagent-agent: "true"
      validate:
        failureAction: Enforce
        message: >-
          kagent agent containers must set runAsNonRoot, drop ALL capabilities,
          disable privilege escalation, and use a read-only root filesystem.
        pattern:
          spec:
            containers:
              - securityContext:
                  runAsNonRoot: true
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - ALL
    - name: agent-require-seccomp
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  homelab.io/kagent-agent: "true"
      validate:
        failureAction: Enforce
        message: "kagent agent pods must set seccompProfile RuntimeDefault."
        pattern:
          spec:
            securityContext:
              seccompProfile:
                type: RuntimeDefault
