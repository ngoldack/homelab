# Session key secret for the controller's per-Gateway proxy Deployment:
# the proxy container requires Secret agentgateway-session-key with key `key`
# (32 random bytes hex) for MCP session encryption. The controller builds the
# Deployment but expects this pre-existing; Flux prune:true would delete a
# manually created one, so it lives here. The SA (agentgateway) is
# controller-owned — declaring it in git collided (id matched 2 resources).
apiVersion: v1
kind: Secret
metadata:
  name: agentgateway-session-key
  namespace: agentgateway
type: Opaque
stringData:
  key: REPLACE-BY-SOPS
