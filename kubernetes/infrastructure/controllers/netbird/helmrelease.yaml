apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbird-operator
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: netbird
  chart:
    spec:
      # Upstream renamed the chart from "netbird-operator" to "kubernetes-operator"
      # and moved publishing to https://netbirdio.github.io/helms.
      # Check latest: https://github.com/netbirdio/kubernetes-operator/releases
      chart: kubernetes-operator
      version: "0.3.x"
      sourceRef:
        kind: HelmRepository
        name: netbird
      interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # The operator reads the NetBird Management API key from a referenced Secret
    # (replaces the old operator.apiToken value). See secret.sops.yaml.
    netbirdAPI:
      keyFromSecret:
        name: netbird-mgmt-api-key
        key: NB_API_KEY
    webhook:
      # Provision webhook certificates via cert-manager (recommended).
      enableCertManager: true
