# Authentik — identity provider + edge authorizer. SERVER and WORKER live at
# home (they need Postgres/Valkey, which live here); the public-facing slice is
# the separate outpost Deployment (outpost.yaml), not this release.
#
# Config is 100% in secret.sops.yaml via authentik.existingSecret — the chart's
# typed values block is ignored wholesale when that is set, which is deliberate:
# one sops file holds every AUTHENTIK_* knob, matching how this repo treats
# tofu/home/secret.sops.yaml.
#
# First boot runs django migrations against CNPG — can exceed 10 minutes with a
# cold 5Gi initdb; hence wait:false on the owning Flux Kustomization and a
# generous HelmRelease timeout.
#
# The blueprint ConfigMap (seed.yaml) is mounted at /blueprints/ — authentik
# imports and applies anything there at startup, idempotently. That is the
# declarative seeding path: proxy provider + application + outpost record +
# service-account token, no manual UI clicks, no API scripting.
#
# Pin: 2026.8.2 (current stable line; 2026.8.0/8.2 had known outpost bugs
# #25485/#26014 — watch, this is the version the research was done against).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 1h
  timeout: 20m
  chart:
    spec:
      chart: authentik
      version: "2026.8.2"
      sourceRef:
        kind: HelmRepository
        name: authentik
      interval: 2h
  targetNamespace: authentik
  releaseName: authentik
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    authentik:
      existingSecret:
        secretName: authentik-config
    # global.*, not server.*: the chart exposes volumes/volumeMounts only at
    # the global level (verified against the 2026.8.2 values structure) —
    # these land on server AND worker; blueprint import is a server-side
    # startup action, the duplicate worker mount is inert.
    # Chart-native blueprint import (replaces hand-mounting /blueprints —
    # the entrypoint discovery only keys off *.yaml files mounted by this
    # block, and doing it by hand silently shipped nothing the first time).
    blueprints:
      configMaps:
        - authentik-blueprints
    global:
      volumes:
        # The seed blueprint reads the Grafana OIDC client secret via !File.
        # It MUST NOT land under /blueprints: authentik walks that tree for
        # *.yml and would try to parse the secret as a blueprint.
        - name: seed-secrets
          secret:
            secretName: authentik-oidc-grafana
        # Langfuse's OIDC client secret, read via !File /secrets-langfuse/…
        # in the same seed. Kept on its own path (not /secrets) because the
        # grafana secret already occupies that mount.
        - name: seed-secrets-langfuse
          secret:
            secretName: authentik-oidc-langfuse
        # Paperless's OIDC client secret, read via !File /secrets-paperless/…
        # in the same seed. Kept on its own path (not /secrets) because the
        # grafana secret already occupies that mount.
        - name: seed-secrets-paperless
          secret:
            secretName: authentik-oidc-paperless
        # Headlamp's OIDC client secret, read via !File /secrets-headlamp/…
        # in the same seed. Kept on its own path (not /secrets) because the
        # grafana secret already occupies that mount.
        - name: seed-secrets-headlamp
          secret:
            secretName: authentik-oidc-headlamp
        # aigateway's OIDC client secret, read via !File
        # /secrets-aigateway/client_secret in the same seed (the M2M
        # client_credentials provider). Its own path, like the others.
        - name: seed-secrets-aigateway
          secret:
            secretName: authentik-oidc-aigateway
        # LibreChat's OIDC client secret, read via !File
        # /secrets-librechat/client_secret in the same seed. Its own path,
        # like the others.
        - name: seed-secrets-librechat
          secret:
            secretName: authentik-oidc-librechat
      volumeMounts:
        - name: seed-secrets
          mountPath: /secrets
          readOnly: true
        - name: seed-secrets-langfuse
          mountPath: /secrets-langfuse
          readOnly: true
        - name: seed-secrets-paperless
          mountPath: /secrets-paperless
          readOnly: true
        - name: seed-secrets-headlamp
          mountPath: /secrets-headlamp
          readOnly: true
        - name: seed-secrets-aigateway
          mountPath: /secrets-aigateway
          readOnly: true
        - name: seed-secrets-librechat
          mountPath: /secrets-librechat
          readOnly: true
    server:
      # 2 replicas, HOME ONLY. The 2026-09-18 edge straddle (one replica
      # tolerating the ingress taint so the host-netns edge envoy had a LOCAL
      # upstream) is gone: it put an API replica on the public node where the
      # DB round-trip over KubeSpan made the app slow enough that liveness
      # probes killed it in a loop (49 restarts, 2026-09-19), and it exposed
      # identity data on the internet-facing node. Live re-measurement
      # (2026-09-19, netprobe pod on fsn1): pod→remote-pod is reliable
      # (20/20 incl. 73 KB responses, ~0.2 s) — the stale "~50% flaky"
      # claim that justified local-only routing no longer holds. The edge
      # envoy still cannot leave host-netns, so portal-bridge-cloud remains
      # the edge hop; the bridge and the outpost now cross the site in a pod
      # netns via the global authentik-server Service (works 20/20, tail
      # ~1.1 s on the cross-site service path — acceptable for login/refresh
      # traffic, and no identity data plane on the public node).
      replicas: 2
      # maxSurge=0 serializes the swap against the hard anti-affinity (a
      # surge pod has no third schedulable node — cp and gpu workers are
      # tainted out). type:Recrete is NOT usable: the chart's strategy
      # template emits rollingUpdate defaults regardless, which
      # server-side-apply then rejects as invalid (observed).
      deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
      # HARD anti-affinity by hostname: exactly one server per node, so the
      # pair straddles the two schedulable home nodes (919, 3bi) instead of
      # both landing on one (ScheduleAnyway spread let that happen, which
      # then 503'd the INTERNAL portal — the failure is directional-symmetric:
      # host-netns envoy only ever reaches LOCAL pods).
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: authentik
                  app.kubernetes.io/component: server
              topologyKey: kubernetes.io/hostname
      # Spread one replica per home node (hostname): with the pair spread
      # across 919 and 3bi, losing one node still leaves one serving replica.
      # (The previous topology.homelab/site DoNotSchedule spread was what
      # pinned replica 2 onto the ingress node — home+home was unschedulable
      # by definition; with the server home-only that constraint would
      # deadlock, so it is hostname-based now.)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
              app.kubernetes.io/component: server
      # NO ingress-taint toleration: the server must never schedule onto the
      # public node (dedicated=ingress is for the outpost, the portal bridge
      # and edge agents only).
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 1536Mi
    worker:
      replicas: 1
      nodeSelector:
        topology.homelab/site: home
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
