apiVersion: v1
kind: Namespace
metadata:
  name: ollama
  labels:
    # Ollama needs no elevated privileges (GPU access comes via the nvidia
    # RuntimeClass + device plugin), but the image runs as root, so baseline.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
