apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  # .yaml suffix is mandatory: the chart only
  # discovers keys ending in .yaml.
  00-homelab.yaml: |
    version: 1
    metadata:
      name: homelab-edge-ingress
    # context keeps the long default-mapping names on single lines so the
    # !Find flow nodes stay under the 120-char lint limit
    context:
      sm_openid: "authentik default OAuth Mapping: OpenID 'openid'"
      sm_profile: "authentik default OAuth Mapping: OpenID 'profile'"
      sm_email: "authentik default OAuth Mapping: OpenID 'email'"
      sm_groups: "authentik default OAuth Mapping: OpenID 'groups'"
    entries:
      # ---------- headlamp behind the edge outpost ----------
      - model: authentik_core.application
        state: present
        identifiers:
          slug: headlamp
        attrs:
          name: headlamp
          meta_name: Headlamp (edge)
          meta_launch_url: https://headlamp.ngoldack.de/
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, headlamp-proxy]]
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: headlamp-proxy
        attrs:
          mode: proxy
          internal_host: http://headlamp-headlamp.headlamp.svc.cluster.local/
          external_host: https://headlamp.ngoldack.de/
          cookie_domain: ngoldack.de
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # ---------- hindsight control-plane UI behind the edge outpost ----------
      # The owning application is what gives the outpost its vhost (learned
      # the hard way with grafana-proxy: without it the outpost silently
      # falls back to the default provider for every Host). The provider MUST
      # be defined before the app that !Finds it — earlier in this file broke
      # the whole blueprint (same ordering rule as the outpost entries).
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: hindsight-ui-proxy
        attrs:
          mode: proxy
          internal_host: http://hindsight-control-plane.hindsight.svc.cluster.local:3000/
          external_host: https://hindsight-ui.ngoldack.de/
          cookie_domain: ngoldack.de
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: hindsight-ui
        attrs:
          name: hindsight-ui
          meta_name: Hindsight (memory UI)
          meta_launch_url: https://hindsight-ui.ngoldack.de/
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, hindsight-ui-proxy]]
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: grafana-proxy
        attrs:
          mode: proxy
          internal_host: http://monitoring-victoria-metrics-k8s-stack-grafana.monitoring.svc.cluster.local/
          external_host: https://grafana.ngoldack.de/
          cookie_domain: ngoldack.de
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # ---------- grafana via OIDC (app federates, no outpost) ----------
      # authentik ships NO groups scope mapping (verified live: the default
      # set is openid/profile/email/proxy-outpost/entitlements/...); define
      # one so Grafana's role_attribute_path sees membership.
      - model: authentik_core.application
        state: present
        identifiers:
          name: grafana-edge
        attrs:
          slug: grafana-edge
          meta_icon: application/default
          launch_url: https://grafana.ngoldack.de/
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, grafana-proxy]]
      - model: authentik_outposts.outpost
        state: present
        identifiers:
          name: edge-outpost
        attrs:
          type: proxy
          managed: null
          # serializer requires config; {} = OutpostConfig dataclass defaults.
          config: {}
          providers:
            - !Find [authentik_providers_proxy.proxyprovider, [name, headlamp-proxy]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, grafana-proxy]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, hindsight-ui-proxy]]
      # grafana behind the SAME edge outpost (proxy provider; the edge envoy
      # cannot dial grafana's home pod directly — pod->pod only, measured
      # 20/20). Distinct from the OIDC federation below, which serves the
      # LAN-direct path; grafana's own login page simply shows authentik.
      - model: authentik_providers_oauth2.scopemapping
        state: present
        identifiers:
          name: "authentik default OAuth Mapping: OpenID 'groups'"
        attrs:
          description: Groups membership for downstream role mapping
          scope_name: groups
          expression: |-
            {
              "groups": [
                group.name for group in request.user.ak_groups.all()
              ]
            }
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: grafana-oidc
        attrs:
          client_id: grafana
          client_type: confidential
          client_secret: !File /secrets/client_secret
          # grant_types MUST be pinned. OAuth2Provider.grant_types is a PG
          # ArrayField defaulting to [] — when it is empty every OIDC login is
          # denied: authorize.py check_grant logs "Invalid grant_type for
          # provider" and errors.py maps it to oauthlib's "The request is
          # otherwise malformed". The importer's partial update does NOT reset
          # undeclared fields on an existing entry, so this guards re-creation
          # (fresh provider -> model default []), which is how grants vanish.
          # Do NOT add response_types: it is not in the serializer's fields, so
          # the importer silently ignores it — response types derive from the
          # grants above.
          issuer_mode: per_provider
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.ngoldack.de/login/generic_oauth
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [name, !Context sm_openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, !Context sm_profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, !Context sm_email]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, !Context sm_groups]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: grafana
        attrs:
          name: grafana
          meta_name: Grafana
          meta_launch_url: https://grafana.ngoldack.de/
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, grafana-oidc]]
