# GatewayClass for the LAN AI gateway. This is the resource that binds the
# data plane to the gateway-helm control plane (controllerName
# gateway.envoyproxy.io/gatewayclass-controller, matching the config.envoyGateway
# in helmrelease-envoy-gateway.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aigateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller