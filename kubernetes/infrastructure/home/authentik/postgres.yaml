# Authentik's Postgres, CloudNativePG like every other relational store here.
#
# The app role/database are named authentik (not the CNPG default "app") and
# the password comes from OUR secret (postgres-credentials.sops.yaml) via
# bootstrap.initdb.secret — nothing is auto-generated, so the same literal
# password serves both this secret and AUTHENTIK_POSTGRESQL__PASS in
# secret.sops.yaml. If the two ever drift, django fails auth at startup
# loudly; that is the safer failure mode than a silently rotating secret.
#
# NFS again mirrors the immich-database tradeoff (see that file): the
# block-class (nvmeof) path is still unusable cluster-wide, so PG waits on
# NFS with the same caveats, smaller footprint.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-database
  namespace: authentik
spec:
  instances: 2
  minSyncReplicas: 1
  maxSyncReplicas: 1
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: authentik-database-credentials
  affinity:
    nodeSelector:
      topology.homelab/site: home
  storage:
    size: 5Gi
    storageClass: truenas-fast-nfs
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  postgresql:
    parameters:
      # Force a WAL segment switch every 60s so archived WAL trails the
      # primary by at most ~1 minute regardless of write volume — without
      # it a quiet database leaves its newest WAL unarchived until the
      # 16 MiB segment fills (first restore drill died exactly on this:
      # "recovery ended before configured recovery target was reached").
      archive_timeout: "60"
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik-backup-store
  # backup retention lives on the ObjectStore CR (spec.retentionPolicy "30d"),
  # not here: spec.backup.retentionPolicy is in-tree-Barman-only and ignored
  # when the Barman Cloud plugin owns backups.
