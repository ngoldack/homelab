version: '3'

vars:
  REPO_ROOT: .
  AGE_KEY_FILE: age.key

dotenv:
  - .env

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  setup:
    desc: Prepare the local age key and print the env needed for SOPS and OpenTofu
    cmds:
      - |
        if [ ! -f "{{.AGE_KEY_FILE}}" ]; then
          echo "Creating local age key at {{.AGE_KEY_FILE}}"
          age-keygen -o {{.AGE_KEY_FILE}}
        else
          echo "Using existing age key at {{.AGE_KEY_FILE}}"
        fi
      - |
        echo "export SOPS_AGE_KEY_FILE=$PWD/{{.AGE_KEY_FILE}}"
        echo "Use: task sops:edit FILE=tofu/home/secret.sops.yaml"

  sops:keys:local:public:
    desc: Print the local age recipient
    cmds:
      - |
        test -f "{{.AGE_KEY_FILE}}"
        age-keygen -y "{{.AGE_KEY_FILE}}"

  sops:keys:home-flux:public:
    desc: Print the Home Flux age recipient
    cmds:
      - |
        test -f home-flux.age.key
        age-keygen -y home-flux.age.key

  authentik:admin:password:
    desc: Print the authentik console login (URL + akadmin password) from SOPS
    env:
      SOPS_AGE_KEY_FILE: '{{.AGE_KEY_FILE}}'
    cmds:
      - |
        sops --decrypt kubernetes/infrastructure/home/authentik/secret.sops.yaml \
          | grep '^ *AUTHENTIK_ADMIN_PASSWORD' \
          | sed -E 's/^ *AUTHENTIK_ADMIN_PASSWORD: *//'

  hindsight:cp:access-key:
    desc: Print the Hindsight dashboard (control-plane) login access key from SOPS
    env:
      SOPS_AGE_KEY_FILE: '{{.AGE_KEY_FILE}}'
    cmds:
      - |
        sops --decrypt kubernetes/infrastructure/home/hindsight/secret.sops.yaml \
          | grep '^ *HINDSIGHT_CP_ACCESS_KEY' \
          | sed -E 's/^ *HINDSIGHT_CP_ACCESS_KEY: *//'

  hindsight:api:key:
    desc: Print the Hindsight API tenant key (Bearer auth) from SOPS
    env:
      SOPS_AGE_KEY_FILE: '{{.AGE_KEY_FILE}}'
    cmds:
      - |
        sops --decrypt kubernetes/infrastructure/home/hindsight/secret.sops.yaml \
          | grep '^ *HINDSIGHT_API_TENANT_API_KEY' \
          | sed -E 's/^ *HINDSIGHT_API_TENANT_API_KEY: *//'

  sops:edit:
    desc: Edit a SOPS-encrypted file
    requires:
      vars: [FILE]
    env:
      SOPS_AGE_KEY_FILE: '{{.AGE_KEY_FILE}}'
    cmds:
      - sops "{{.FILE}}"

  sops:encrypt:
    desc: Encrypt a .local.yaml working copy into a .sops.yaml file
    requires:
      vars: [SOURCE, FILE]
    env:
      SOPS_AGE_KEY_FILE: '{{.AGE_KEY_FILE}}'
    cmds:
      - |
        sh -eu -c '
          source=$1
          target=$2
          case "$source" in
            *.local.yaml|*.local.yml) ;;
            *) echo "SOURCE must end in .local.yaml or .local.yml" >&2; exit 1 ;;
          esac
          case "$target" in
            *.sops.yaml|*.sops.yml) ;;
            *) echo "FILE must end in .sops.yaml or .sops.yml" >&2; exit 1 ;;
          esac
          test -f "$source"
          temp_file=$(mktemp "${target}.tmp.XXXXXX")
          trap "rm -f \"$temp_file\"" EXIT HUP INT TERM
          sops --encrypt --filename-override "$target" "$source" > "$temp_file"
          mv "$temp_file" "$target"
        ' sh "{{.SOURCE}}" "{{.FILE}}"

  sops:decrypt:
    desc: Decrypt a .sops.yaml file into a new .local.yaml working copy
    requires:
      vars: [FILE, OUTPUT]
    env:
      SOPS_AGE_KEY_FILE: '{{.AGE_KEY_FILE}}'
    cmds:
      - |
        sh -eu -c '
          source=$1
          output=$2
          case "$source" in
            *.sops.yaml|*.sops.yml) ;;
            *) echo "FILE must end in .sops.yaml or .sops.yml" >&2; exit 1 ;;
          esac
          case "$output" in
            *.local.yaml|*.local.yml) ;;
            *) echo "OUTPUT must end in .local.yaml or .local.yml" >&2; exit 1 ;;
          esac
          test -f "$source"
          test ! -e "$output"
          sops --decrypt "$source" > "$output"
        ' sh "{{.FILE}}" "{{.OUTPUT}}"

  sops:decrypt:all:
    desc: Decrypt every .sops.yaml file into a new ignored .local.yaml working copy
    cmds:
      - |
        sh -eu -c '
          key_file=$(mktemp)
          trap "rm -f \"$key_file\"" EXIT HUP INT TERM
          for identity in age.key home-flux.age.key; do
            if [ -f "$identity" ]; then
              cat "$identity" >> "$key_file"
            fi
          done
          test -s "$key_file"
          export SOPS_AGE_KEY_FILE="$key_file"
          find tofu kubernetes -type f -name "*.sops.yaml" -exec sh -eu -c "
            for source do
              output=\${source%.sops.yaml}.local.yaml
              test ! -e \"\$output\"
              sops --decrypt \"\$source\" >/dev/null
            done
          " sh {} +
          find tofu kubernetes -type f -name "*.sops.yaml" -exec sh -eu -c "
            for source do
              output=\${source%.sops.yaml}.local.yaml
              temp_file=\$(mktemp \"\${output}.tmp.XXXXXX\")
              if ! sops --decrypt \"\$source\" > \"\$temp_file\"; then
                rm -f \"\$temp_file\"
                exit 1
              fi
              mv \"\$temp_file\" \"\$output\"
            done
          " sh {} +
        '

  sops:check:all:
    desc: Verify every SOPS-encrypted OpenTofu and Kubernetes file can decrypt
    cmds:
      - |
        sh -eu -c '
          key_file=$(mktemp)
          trap "rm -f \"$key_file\"" EXIT HUP INT TERM
          for identity in age.key home-flux.age.key; do
            if [ -f "$identity" ]; then
              cat "$identity" >> "$key_file"
            fi
          done
          test -s "$key_file"
          export SOPS_AGE_KEY_FILE="$key_file"
          find tofu kubernetes -type f -name "*.sops.yaml" \
            -exec sh -e -c "for file do sops --decrypt \"\$file\" >/dev/null; done" sh {} +
        '

  sops:updatekeys:all:
    desc: Rekey every SOPS-encrypted OpenTofu and Kubernetes file using .sops.yaml
    cmds:
      - |
        sh -eu -c '
          key_file=$(mktemp)
          trap "rm -f \"$key_file\"" EXIT HUP INT TERM
          for identity in age.key home-flux.age.key; do
            if [ -f "$identity" ]; then
              cat "$identity" >> "$key_file"
            fi
          done
          test -s "$key_file"
          export SOPS_AGE_KEY_FILE="$key_file"
          find tofu kubernetes -type f -name "*.sops.yaml" -exec sops updatekeys --yes {} \;
        '

  tofu:home:init:
    desc: Initialize the Home OpenTofu root
    cmds:
      - task: tofu:run
        vars:
          TOFU_DIR: tofu/home
          TOFU_ARGS: init

  tofu:home:validate:
    desc: Validate the Home OpenTofu root
    cmds:
      - task: tofu:run
        vars:
          TOFU_DIR: tofu/home
          TOFU_ARGS: validate

  sandbox:preflight:
    desc: Verify pmx-main nested virtualization before Kata on wk-main-performance
    cmds:
      - |
        set -eu
        # pmx-main is the only fleet hypervisor (94 GiB i9-13900HX), mgmt
        # IP 10.20.10.21 = tofu/home/terraform.tfvars proxmox_nodes.endpoint
        # (its bare hostname does not resolve from every LAN client). Kata
        # sandboxes run real QEMU microVMs inside the Talos guest, so the
        # host must expose VMX. kvm_intel is the right knob on this Intel
        # host; on a future AMD host this task must check kvm_amd instead.
        nested=$(ssh root@10.20.10.21 'cat /sys/module/kvm_intel/parameters/nested' 2>/dev/null || true)
        if [ "$nested" = "Y" ] || [ "$nested" = "1" ]; then
          echo "NESTED VIRT OK: kvm_intel.nested=${nested} on pmx-main"
        else
          echo "NESTED VIRT NOT ENABLED on pmx-main (10.20.10.21, kvm_intel.nested='${nested:-<unreadable>}')" >&2
          echo "  — enable it and reboot before tofu apply" >&2
          exit 1
        fi

  kata:smoke:
    desc: Run the Kata smoke test on the sandbox worker (requires kubeconfig-home.yaml export)
    cmds:
      - |
        set -eu
        [ -f kubeconfig-home.yaml ]
        if ! kubectl --kubeconfig kubeconfig-home.yaml get ns hermes-sandbox >/dev/null 2>&1; then
          echo "hermes-sandbox namespace missing — apply hermes-sandbox/namespace.yaml first" >&2
          exit 1
        fi
        kubectl --kubeconfig kubeconfig-home.yaml apply -f - <<'EOF'
        apiVersion: v1
        kind: Pod
        metadata:
          name: kata-smoke-test
          namespace: hermes-sandbox
        spec:
          runtimeClassName: kata
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: test
              image: registry.k8s.io/e2e-test-images/agnhost:2.53
              command: ["sh", "-c", "uname -a; sleep 90"]
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                runAsUser: 1000
                runAsGroup: 1000
                capabilities:
                  drop: ["ALL"]
        EOF
        kubectl --kubeconfig kubeconfig-home.yaml -n hermes-sandbox \
          wait --for=condition=Ready --timeout=300s pod/kata-smoke-test
        node=$(kubectl --kubeconfig kubeconfig-home.yaml -n hermes-sandbox \
          get pod kata-smoke-test -o jsonpath='{.spec.nodeName}')
        sandbox_node=$(kubectl --kubeconfig kubeconfig-home.yaml get nodes \
          -l workload.hermes.io/sandbox=true \
          -o jsonpath='{.items[0].metadata.name}')
        echo "sandbox_node=$sandbox_node scheduled_on=$node"
        [ "$node" = "$sandbox_node" ] || { echo "FAIL: not scheduled on sandbox node" >&2; exit 1; }
        rc=$(kubectl --kubeconfig kubeconfig-home.yaml -n hermes-sandbox \
          get pod kata-smoke-test -o jsonpath='{.spec.runtimeClassName}')
        [ "$rc" = "kata" ] || { echo "FAIL: runtimeClassName=$rc" >&2; exit 1; }
        uname_out=$(kubectl --kubeconfig kubeconfig-home.yaml -n hermes-sandbox logs kata-smoke-test)
        echo "guest: $uname_out"
        echo "$uname_out" | grep -qi talos && { echo "FAIL: guest looks like the Talos host kernel" >&2; exit 1; }
        if kubectl --kubeconfig kubeconfig-home.yaml -n hermes-sandbox \
          exec kata-smoke-test -- test ! -e /var/run/secrets/kubernetes.io/serviceaccount/token; then
          echo "OK: no serviceaccount token in guest"
        else
          echo "FAIL: serviceaccount token present" >&2
          exit 1
        fi
        kubectl --kubeconfig kubeconfig-home.yaml -n hermes-sandbox \
          exec kata-smoke-test -- ls /dev/kvm >/dev/null 2>&1 \
          && echo "OK: /dev/kvm visible in guest" \
          || echo "WARN: /dev/kvm not visible in guest (may be fine — Kata qemu only needs host KVM)"
        echo "KATA SMOKE OK"
        kubectl --kubeconfig kubeconfig-home.yaml -n hermes-sandbox delete pod kata-smoke-test --wait=false

  tofu:run:
    internal: true
    desc: Run OpenTofu with state encryption configured from SOPS
    requires:
      vars: [TOFU_DIR, TOFU_ARGS]
    cmds:
      - |
        set -eu
        export SOPS_AGE_KEY_FILE="${SOPS_AGE_KEY_FILE:-$PWD/{{.AGE_KEY_FILE}}}"
        test -f "$SOPS_AGE_KEY_FILE"
        passphrase=$(sops --output-type json --decrypt {{.TOFU_DIR}}/secret.sops.yaml \
          | jq -r '.state_encryption_passphrase')
        test -n "$passphrase"
        export TF_VAR_state_encryption_passphrase="$passphrase"
        # Both roots now use a remote S3-compatible (Hetzner Object Storage)
        # state backend. Backend blocks can't read var./local. — the s3
        # backend authenticates purely from these env vars, on every
        # invocation (not just init), same as any other S3 client.
        export AWS_ACCESS_KEY_ID=$(sops --output-type json --decrypt {{.TOFU_DIR}}/secret.sops.yaml \
          | jq -r '.hetzner_object_storage_access_key')
        export AWS_SECRET_ACCESS_KEY=$(sops --output-type json --decrypt {{.TOFU_DIR}}/secret.sops.yaml \
          | jq -r '.hetzner_object_storage_secret_key')
        if [ -n "{{.TOFU_OUTPUT_FILE}}" ]; then
          # Write to a private (0600) temp file first, then atomically move
          # it into place — `> "{{.TOFU_OUTPUT_FILE}}"` alone truncates any
          # existing (still-good) kubeconfig/talosconfig immediately, before
          # tofu even runs, so a failed command destroys it instead of
          # leaving it untouched.
          temp_file=$(mktemp "{{.TOFU_OUTPUT_FILE}}.tmp.XXXXXX")
          # EXIT only, not "EXIT HUP INT TERM" like the sops:* tasks use —
          # those wrap themselves in a real `sh -c`, so their traps run
          # under the system shell. This task runs directly under Task's
          # own embedded POSIX shell (mvdan.cc/sh), which doesn't recognize
          # signal names in `trap` at all ("trap: HUP: invalid signal
          # specification" — confirmed live). EXIT alone still covers
          # normal completion and most abnormal termination paths.
          trap 'rm -f "$temp_file"' EXIT
          chmod 600 "$temp_file"
          tofu -chdir={{.TOFU_DIR}} {{.TOFU_ARGS}} > "$temp_file"
          mv "$temp_file" "{{.TOFU_OUTPUT_FILE}}"
        else
          exec tofu -chdir={{.TOFU_DIR}} {{.TOFU_ARGS}}
        fi

  tofu:home:plan:
    desc: Show the Home OpenTofu plan
    cmds:
      - task: tofu:run
        vars:
          TOFU_DIR: tofu/home
          TOFU_ARGS: plan

  tofu:home:apply:
    desc: Apply the Home OpenTofu configuration
    cmds:
      - task: tofu:run
        vars:
          TOFU_DIR: tofu/home
          TOFU_ARGS: apply

  tofu:home:destroy:
    desc: Destroy the Home OpenTofu-managed infrastructure
    cmds:
      - task: tofu:run
        vars:
          TOFU_DIR: tofu/home
          TOFU_ARGS: destroy

  kubeconfig:home:export:
    desc: Export the Home kubeconfig to kubeconfig-home.yaml
    cmds:
      - task: tofu:run
        vars:
          TOFU_DIR: tofu/home
          TOFU_ARGS: output -raw kubeconfig
          TOFU_OUTPUT_FILE: kubeconfig-home.yaml

  talosconfig:home:export:
    desc: Export the Home talosconfig to talosconfig-home.yaml
    cmds:
      - task: tofu:run
        vars:
          TOFU_DIR: tofu/home
          TOFU_ARGS: output -raw talosconfig
          TOFU_OUTPUT_FILE: talosconfig-home.yaml

  talos-backup:home:bucket:
    desc: Print the Home Talos etcd backup bucket name
    cmds:
      - task: tofu:run
        vars:
          TOFU_DIR: tofu/home
          TOFU_ARGS: output -raw home_talos_backup_bucket

  lint:yaml:
    desc: Lint all YAML with yamllint (honors .yamllint ignores)
    cmds:
      - yamllint .

  lint:tofu:
    desc: Check OpenTofu formatting (no files written)
    cmds:
      - tofu fmt -check -recursive tofu/home

  lint:kustomize:
    desc: Build every kustomization under kubernetes/ to catch reference errors
    cmds:
      - |
        set -eu
        for k in $(git ls-files 'kubernetes/**/kustomization.yaml'); do
          kustomize build "$(dirname "$k")" >/dev/null
        done

  check:
    desc: Run all local validations (yamllint, tofu fmt, kustomize builds, sops decrypt)
    cmds:
      - task: lint:yaml
      - task: lint:tofu
      - task: lint:kustomize
      - task: sops:check:all
