# AI Gateway CRDs (aigateway.envoyproxy.io/v1beta1) — their own entry so the
# aigateway lane can dependOn them (CRD-before-CR, the monitoring-crds pattern).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aigateway-crds
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/infrastructure/home/aigateway-crds
  prune: true
  wait: true
  timeout: 10m
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
