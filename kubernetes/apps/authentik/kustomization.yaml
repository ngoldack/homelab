apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authentik
resources:
  - namespace.yaml
  - cnpg-cluster.yaml
  - barman-s3.sops.yaml
  - valkey.yaml
  - secret.sops.yaml
  - s3.yaml
  - proxy-blueprint.yaml
  - helmrelease.yaml
  - gateway.yaml
  - netbird.yaml
  - referencegrant.yaml
# Shared CNPG -> Hetzner DR backup wiring (ObjectStore + ScheduledBackup).
# Static config lives in the component; only this app's identity is patched in.
components:
  - ../_components/cnpg-barman-backup
patches:
  - target:
      kind: ObjectStore
      name: APP_NAME-backup-store
    patch: |-
      - op: replace
        path: /metadata/name
        value: authentik-backup-store
      - op: replace
        path: /spec/configuration/destinationPath
        value: s3://${DR_S3_BUCKET}/cnpg/authentik
      - op: replace
        path: /spec/configuration/s3Credentials/accessKeyId/name
        value: authentik-backup-s3
      - op: replace
        path: /spec/configuration/s3Credentials/secretAccessKey/name
        value: authentik-backup-s3
  - target:
      kind: ScheduledBackup
      name: APP_NAME-postgres-daily
    patch: |-
      - op: replace
        path: /metadata/name
        value: authentik-postgres-daily
      - op: replace
        path: /spec/cluster/name
        value: authentik-postgres
