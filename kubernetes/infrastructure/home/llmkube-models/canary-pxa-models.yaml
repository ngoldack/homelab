# PXA-specialized models for the qwen36-35b canary A/B (2026-09-20).
#
# Both are PXA-engine-only formats (PXQ codecs: custom dequant/matmul kernels in the
# pxa engine) — they do NOT run on stock llama.cpp / llama-p100. Arch is qwen35moe
# (same hybrid-attention family as production qwen36-35b), so the KV slot-restore
# findings apply. `format: gguf` matches the file extension; the pxa engine parses
# the PXQ bytes at serve time, the operator only caches the byte blobs.
#
# NOTE: pxa-coder-35b is a ~17.7 GiB PXQ4 file — full offload (-1) OOMs on the
# 16 GiB card, so `layers: 30` pins the partial-offload configuration the boot
# ladder lands on; the KV-restore test stays valid (attention/KV on GPU).
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: pxa-fusion4-35b
  namespace: llmkube-system
spec:
  source: https://huggingface.co/poisonxa/PXA-Fusion4-35B-GGUF/resolve/main/PXA-Fusion4-35B-PXQ2.gguf
  format: gguf
  quantization: PXQ2
  prefetch: true
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      count: 1
      vendor: nvidia
      memory: "16Gi"
      # Full offload — the PXQ2 tier is the card's "one 16 GB card" tier.
      layers: -1
  resources:
    cpu: "4"
    memory: "8Gi"
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: pxa-coder-35b
  namespace: llmkube-system
spec:
  source: https://huggingface.co/poisonxa/PXA-Coder-35B-PXQ4/resolve/main/PXA-Coder-35B-v2-PXQ4.gguf
  format: gguf
  quantization: PXQ4
  prefetch: true
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      count: 1
      vendor: nvidia
      memory: "16Gi"
      # Partial offload: the ~17.7 GiB PXQ4 file cannot fully fit the 16 GiB P100;
      # 30/41 layers on GPU is the ladder's landing configuration.
      layers: 30
  resources:
    cpu: "4"
    memory: "8Gi"