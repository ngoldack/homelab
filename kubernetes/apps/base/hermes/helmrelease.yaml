# Hermes Agent (Nous Research) — self-hosted personal agent run in gateway +
# OpenAI-compatible API-server mode, using OpenViking as its memory backend and
# the in-cluster LiteLLM proxy as its LLM.
#
# Deployed via the community (unofficial) Helm chart sourced from Git (see
# gitrepository.yaml); neither Hermes nor the chart publishes a Helm/OCI repo.
#
# NOTE: Hermes publishes no official container image. The chart's default tag
# (nousresearch/hermes-agent:0.8.0) may not exist on Docker Hub; set image.tag
# to an image you have pushed. Hermes also REJECTS models advertising <64K
# context — it is pointed at qwen3-coder-80b, which is configured for 65536.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: hermes
  chart:
    spec:
      chart: .
      sourceRef:
        kind: GitRepository
        name: hermes-agent-chart
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: false
  values:
    image:
      repository: nousresearch/hermes-agent
      # No official image is published; override with one you build/push.
      tag: latest
      pullPolicy: IfNotPresent
    # Single-writer state safety (enforced by the chart when persistence is on).
    replicaCount: 1
    strategy:
      type: Recreate
    args:
      - gateway
      - run
    persistence:
      enabled: true
      storageClass: tns-fast-nfs
      accessMode: ReadWriteOnce
      size: 5Gi
    # Hermes' own OpenAI-compatible API server (so other apps can drive it).
    apiServer:
      enabled: true
      host: 0.0.0.0
      port: 8642
    service:
      enabled: true
    # Secrets (OPENAI_API_KEY, API_SERVER_KEY) come from the SOPS-managed Secret.
    secrets:
      existingSecret: hermes-secrets
    bootstrap:
      enabled: true
      overwrite: true
    config:
      values:
        model:
          # OpenAI-compatible LiteLLM proxy. 'coder' = qwen3-coder-80b (64K ctx).
          default: coder
          provider: custom
          base_url: http://litellm.litellm.svc.cluster.local:4000/v1
          context_length: 65536
        memory:
          # Native OpenViking memory provider (not MCP); endpoint via env below.
          provider: openviking
        terminal:
          backend: local
    extraEnv:
      - name: OPENVIKING_ENDPOINT
        value: http://openviking.openviking.svc.cluster.local:1933
