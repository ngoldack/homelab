schema: spec-driven

context: |
  PROJECT: Homelab AI platform. Talos Kubernetes + Flux GitOps + Cilium, serving
  self-hosted LLMs via llama.cpp on NVIDIA Tesla P100 (Pascal). Goal is a lean MVP
  delivered in phases (v0 -> v1 -> v2); each phase adds the minimum set of apps and
  reuses earlier components (synergy: n8n/kagent -> agentgateway -> llama.cpp).

  CLUSTERS (3 SEPARATE Talos/Cilium clusters joined by Cilium Cluster Mesh; tag
  every node/resource with its cluster):
  - home (MAIN, all heavy compute) - cluster-id 1:
      * Always a Proxmox VE host; Talos runs as VMs (never bare-metal).
      * pmx-main: Minisforum AR900i, 96GB DDR5, 1x Tesla P100. FOUR VMs:
        cp (control plane), wk (general worker), wk-gpu (P100 -> qwen3.5:9b),
        wk-cpu (64GB, dedicated CPU -> qwen3-coder-next). Driver 580.159.04.
  - cloud (Hetzner) - cluster-id 2 - v1:
      * ONE VPS = a single-node cluster (control plane that ALSO runs workloads).
      * Public IP; the ingress edge for all non-LAN traffic + Hetzner S3 backups.
      * Joins home via Cluster Mesh. (home is built mesh-ready in v0; the
        cloud cluster + the actual mesh land together in v1.)
  - offsite (v3) - cluster-id 3:
      * ONE VM on TrueNAS Scale, 6GB = a single-node cluster (cp + workloads).
      * Disaster-recovery / remote presence. No tofu provider for TrueNAS VMs -
        provision the VM by hand, then Talos+Flux as usual.

  CLUSTER MESH: all three clusters run Cilium and are connected with Cilium
  Cluster Mesh (unique cluster.id/name, shared CA, clustermesh-apiserver). Cross-
  cluster service discovery via global services (service.cilium.io/global: true).
  Each cluster has its own Flux + clusters/<name>/ entrypoint and runs a SUBSET.

  STORAGE TIERS (home - TrueNAS CSI; pick the tier per workload):
  - fast     = tns-fast-nvmeof  (NVMe-oF block) - ONLY where it materially helps (DBs).
  - standard = tns-fast-nfs     (fast pool, NFS) - DEFAULT for everything.
  - storage  = tns-tank-nfs     (tank/HDD pool, NFS) - huge media libraries only.
  - local    = local-path       (node-local) - tmp/scratch only.
  (cloud/offsite single-node clusters use local-path; home tiers are LAN-only.)

  STACK & CONVENTIONS:
  - Talos OS (immutable), Flux CD (GitOps, one Flux per cluster), Cilium (ALL
    networking uses Cilium and its features: kube-proxy replacement, Gateway API,
    Hubble, encryption, LB-IPAM, and Cluster Mesh to join the 3 clusters).
  - LLM serving: llama.cpp (llama-server) tuned for Pascal/P100. NOT vLLM (dropped
    Pascal) and not Ollama. Models exposed OpenAI-compatible; consumers reach them
    only via agentgateway aliases (from v1).
  - Observability: the VictoriaMetrics stack END TO END - VictoriaMetrics (metrics)
    + VictoriaLogs (logs) + VictoriaTraces (traces) + Grafana (dashboards). Prefer
    VM-ecosystem components; do NOT use Loki or Tempo. One OTel collector ships
    logs/traces/metrics to the three VM backends.
  - Secrets: SOPS + age, key anchored in .sops.yaml (age_recipients); every secret
    is a *.sops.yaml file encrypted in place. Do not introduce a second key provider.
  - Validation: kustomize build + kubeconform (-strict -ignore-missing-schemas),
    yamllint (.yamllint), tofu validate. Conventional Commits.
  - Repo layout (community Flux best practice, kept simple):
      clusters/home/   (Flux entrypoints: infra-controllers, infra-configs, apps)
      infrastructure/{controllers,configs}/
      apps/<app>/         (flat, one dir per app; apps/kustomization.yaml = toggle)
      tofu/               (Proxmox + Talos + Hetzner, site-tagged)
      openspec/           (this plan)

  PHASES (reduce apps to the minimum per phase):
  - v0 (MVP foundation): the home cluster ONLY (4 Talos VMs on pmx-main:
    cp/wk/wk-gpu/wk-cpu); the 4 storage tiers; Cilium; observability
    (VictoriaMetrics + VictoriaLogs + VictoriaTraces + Grafana); llama.cpp
    (qwen3.5:9b on wk-gpu, qwen3-coder-next on wk-cpu).
  - v1 (platform): ADD the cloud cluster (single Hetzner VPS, cp+workloads) +
    Cilium Cluster Mesh joining home(id 1)+cloud(id 2); public ingress routes
    on the cloud cluster; backup to Hetzner S3; Authentik; CloudNativePG operator
    + backups; Valkey operator; agentgateway (in front of llama.cpp).
  - v2 (agents): n8n; kagent; agentgateway; mem0 - all wired through agentgateway -> llama.cpp.
  - v3 (offsite): the offsite cluster (single TrueNAS Scale VM, 6GB, cp+workloads)
    provisioned by hand and joined to the Cluster Mesh for DR / remote presence.

rules:
  proposal:
    - State which of the 3 sites (home/cloud/offsite) the change touches.
    - List apps ADDED and apps/components REMOVED (this project is a deliberate reduction to MVP).
  design:
    - Call out P100/Pascal-specific tuning when LLM serving is involved.
    - Prefer reusing an existing component over adding a new one (note the synergy).
  tasks:
    - Each task must be independently validatable (kustomize build / kubeconform / yamllint / tofu validate).
    - Group tasks so each maps to one Conventional Commit.
