apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Zero-trust network policy: namespace default-deny + per-workload allowlists
  # (the scrape hub's exporter-port egress is documented in the allowlist).
  - cilium-default-deny.yaml
  - cilium-allowlist.yaml
  - helmrelease.yaml
  # httproute.yaml (LAN twin) retired with the split-horizon design:
  # grafana is edge-only now, SSO via authentik everywhere.
  - httproute-edge.yaml
  - grafana-authentik.sops.yaml
  # Every VMServiceScrape/VMPodScrape in one place. Applies under this
  # Kustomization, which dependsOn monitoring-crds (see
  # kubernetes/clusters/home/monitoring.yaml), so the VM operator CRDs are
  # installed before these CRs are reconciled.
  - scrapes.yaml
  # CNPG data-protection alerting (WAL archiving + PITR RPO) as VMRule CRs,
  # same dependency on monitoring-crds as the pod/service scrapes above.
  - rules.yaml
  # Alerting pipeline itself: the Alertmanager routing tree and receiver
  # capability URLs (SOPS Secret, loaded via alertmanager.spec.configSecret in
  # helmrelease.yaml) plus the VMRule that proves the pipeline end to end —
  # the Watchdog heartbeat the external dead-man destination expects, and an
  # alert on the notification-failure counters themselves.
  - alertmanager-config.sops.yaml
  - rules-alerting.yaml
  # The in-use-digest rescan alerts (image-scan CronJob in ../image-scan/):
  # critical CVE found in a digest that is actually running, and the scan
  # itself going stale. Separate file so a scan-rule edit never touches the
  # platform rules.
  - rules-image-scan.yaml
  # Platform alert-rule pack (certificate expiry, Flux controller errors,
  # talos-backup staleness, node health, cloud-ingress-node hygiene) and the
  # in-cluster probe of the public edge: the blackbox exporter, the policy
  # that lets it be probed and reach the internet, and the VMProbe that makes
  # vmagent scrape it. Expressions carry their live-verified evidence inline,
  # same convention as rules.yaml.
  - rules-platform.yaml
  - blackbox-exporter.yaml
  - probe.yaml

# One ConfigMap per vendored dashboard. The Grafana sidecar (enabled in
# helmrelease.yaml) watches every namespace for ConfigMaps carrying
# grafana_dashboard: "1" and drops their contents into Grafana's provisioning
# directory — so this is the whole wiring; no operator, no CRDs.
#
# Every dashboard entry carries the same two options:
#   - grafana_dashboard: "1" — the label the sidecar keys off.
#   - kustomize.toolkit.fluxcd.io/substitute: disabled — Grafana dashboards
#     are full of ${...} placeholders; Flux's postBuild.substituteFrom
#     (strict envsubst) fails the whole Kustomization on any ${...} it cannot
#     resolve, so each dashboard ConfigMap must opt out.
#
# disableNameSuffixHash is on because the sidecar keys off the label, not the
# name, and a hash-suffixed name churns on every content change for no benefit.
configMapGenerator:
  - name: grafana-dashboard-node-exporter-full
    namespace: monitoring
    files: [dashboards/node-exporter-full.json]
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: grafana-dashboard-k8s-views-global
