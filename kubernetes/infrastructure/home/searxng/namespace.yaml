# searxng — self-hosted metasearch, reached ONLY from the Hermes gateway as its
# `web_search` backend (plugins/web/searxng in the pinned Hermes image,
# key_env SEARXNG_URL). It aggregates public search engines and returns JSON.
#
# Deliberately NOT exposed on the edge Gateway: there is no HTTPRoute in this
# directory and the namespace carries no gateway.ngoldack.de/*-ingress label, so
# an accidental route could not attach. SearXNG is not a public metasearch proxy.
#
# PSA restricted is enforced (not merely audited) because the pinned image runs
# as its own unprivileged uid with a read-only rootfs and dropped capabilities —
# verified live 2026-09-23 against docker.io/searxng/searxng:2026.9.22-b3c389529.
apiVersion: v1
kind: Namespace
metadata:
  name: searxng
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
