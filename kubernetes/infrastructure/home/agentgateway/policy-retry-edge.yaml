# Retry policy for the EDGE data plane's key-authenticated routes.
#
# Mirror of policy-retry.yaml targeting local-llm-key-edge: same 429/500
# single-retry semantics so the edge proxy transparently fails over onto the
# next chain group exactly like the home proxy.
#
# KEEP IN SYNC with policy-retry.yaml.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: key-route-retry-edge
  namespace: agentgateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: local-llm-key-edge
  traffic:
    retry:
      attempts: 2
      backoff: 1s
      # 503 is synthetic-proxy's "this leg is unhealthy" signal: it rewrites
      # failover-worthy upstream answers AND its own local refusals to 503, and
      # the health policy evicts on `response.code >= 500`. So 503 MUST be
      # retried here, or the in-flight failover never happens and the client
      # sees the 503 instead of the OpenRouter answer. 502/504 are the same
      # class. 429 stays for a transient parallel-limit answer, which the proxy
      # deliberately passes through untouched.
      codes:
        - 429
        - 500
        - 502
        - 503
        - 504
