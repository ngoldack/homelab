# NVMe-oF block storage for PostgreSQL data directories.
#
# These mirror the per-app NFS database classes above one-to-one
# ({pool}/k8s/nvmeof/{namespace}/app/pvc-<uid>, same 6h/14d snapshot
# schedule) but serve the PG data directory as a block device (zvol,
# ext4) instead of an NFS mount — block semantics are what a WAL-heavy
# Postgres wants (fsync latency, no attribute caching / locking layer).
# NVMe-oF is RWO single-writer, which is exactly the CNPG access model.
#
# The snapshot.* parameters create NAS-side ZFS snapshot tasks on the
# zvol's parent dataset path, so the 6h/14d DB protection carries over.
#
# Classes are named truenas-fast-nvmeof-{namespace}-app to match the NFS
# naming convention above.

