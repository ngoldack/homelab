# kagent Agent Substrate — EXPERIMENTAL gVisor (runsc) runtime for kagent
# SandboxAgents (Apache-2.0, kagent-dev/substrate). Namespace (privileged PSA) +
# SeaweedFS S3 + Valkey + CRDs/controller HelmReleases. The `agent-substrate` OCI
# HelmRepository is defined in the shared controllers/sources.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - s3.yaml
  - valkey.yaml
  - helmrelease.yaml
