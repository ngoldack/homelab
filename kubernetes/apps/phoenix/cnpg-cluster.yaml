# Phoenix's own CloudNativePG cluster (trace/eval storage). Its own instance +
# credentials, backed up to Hetzner DR via the Barman plugin.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: phoenix-postgres
  namespace: phoenix
spec:
  instances: 1
  storage:
    size: 10Gi
    storageClass: tns-fast-nvmeof
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: phoenix-backup-store
  bootstrap:
    initdb:
      database: phoenix
      owner: phoenix
      secret:
        name: phoenix-postgres-credentials
