apiVersion: v1
kind: Namespace
metadata:
  name: network
---
# Public ingress gateway. Cilium's Gateway API implementation programs an envoy
# listener on the cloud node(s); TLS terminates here using the cert-manager
# wildcard cert. Traffic lands only on cloud nodes — the listener is pinned to
# site=cloud and home nodes are never a public ingress path.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: network
spec:
  gatewayClassName: cilium
  listeners:
    - name: https-wildcard
      protocol: HTTPS
      port: 443
      hostname: "*.svc.${CLUSTER_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-svc-tls
      allowedRoutes:
        namespaces:
          from: All
