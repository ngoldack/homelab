# Open WebUI's own CloudNativePG cluster (pgvector vector store for the document
# knowledge base). Its own instance + credentials, backed up to Hetzner DR via
# the Barman plugin (shared cnpg-barman-backup component). pgvector ships in the
# CNPG default image; the extension is created at init. Block storage on the fast
# NVMe-oF tier per the storage policy for databases.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: knowledge-postgres
  namespace: knowledge
spec:
  instances: 1
  storage:
    size: 20Gi
    storageClass: tns-fast-nvmeof
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: knowledge-backup-store
  bootstrap:
    initdb:
      database: knowledge
      owner: knowledge
      secret:
        name: knowledge-postgres-credentials
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
