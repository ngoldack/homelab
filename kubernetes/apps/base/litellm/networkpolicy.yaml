# LiteLLM holds the only key gating the vLLM backends, so restrict who can reach
# it. Ingress is limited to its consumers (Khoj, n8n), the NetBird routing peer
# (for the SSO-protected proxy UI), and the node (kubelet probes). Egress is left
# open so LiteLLM can reach the KEDA http-add-on interceptor that fronts the
# on-demand vLLM models and the Authentik OIDC token/userinfo endpoints.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm
  namespace: litellm
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  ingress:
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: khoj
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: n8n
        # NetBird routing peer for perplexity-stack-router runs in the authentik
        # namespace; it forwards mesh traffic to the LiteLLM UI for OIDC login.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
