# Single-Node Single-Drive (SNSD) MinIO Tenant.
# - 1 server / 1 volume on tns-fast-nvmeof (NVMe-oF block) per the storage matrix.
# - requestAutoCert: false => MinIO serves plain HTTP on the in-cluster service
#   http://minio.minio.svc.cluster.local (S3 API port 80 -> container 9000).
# - Root credentials are injected via spec.configuration (minio-tenant-config).
apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: minio
  namespace: minio
  labels:
    app: minio
  annotations:
    prometheus.io/path: /minio/v2/metrics/cluster
    prometheus.io/port: "9000"
    prometheus.io/scrape: "true"
spec:
  image: quay.io/minio/minio:RELEASE.2025-04-08T15-41-24Z
  imagePullPolicy: IfNotPresent
  mountPath: /export
  subPath: ""
  podManagementPolicy: Parallel
  requestAutoCert: false
  configuration:
    name: minio-tenant-config
  pools:
    - name: pool-0
      servers: 1
      volumesPerServer: 1
      volumeClaimTemplate:
        apiVersion: v1
        kind: persistentvolumeclaims
        metadata: {}
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: tns-fast-nvmeof
          resources:
            requests:
              storage: 200Gi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containerSecurityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
