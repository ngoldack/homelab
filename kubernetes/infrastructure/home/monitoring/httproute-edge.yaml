# Grafana over the edge path goes THROUGH THE OUTPOST, like headlamp — the
# edge envoy (host-netns, Hetzner) cannot reach grafana's home pods, but the
# outpost is a pod and pod->pod crosses sites fine (20/20 measured).
# authentik session checked at the edge, then proxied to grafana internally.
# The LAN twin route (httproute.yaml) was retired with the split-horizon
# design; grafana's own OIDC config remains configured but the outpost is
# now the only way in.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-edge
  namespace: monitoring
spec:
  parentRefs:
    - name: edge
      namespace: network
      sectionName: https-apex
  hostnames:
    - grafana.ngoldack.de
  rules:
    - backendRefs:
        - name: authentik-proxy
          namespace: authentik
          port: 9000
