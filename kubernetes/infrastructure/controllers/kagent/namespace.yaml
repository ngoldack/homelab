apiVersion: v1
kind: Namespace
metadata:
  name: kagent
  labels:
    # Enforce the restricted Pod Security Standard. The chart's infra pods
    # (controller/UI/tool-server/bundled-postgres/kmcp) comply by default; the
    # bundled demo agents (which don't) are disabled in the HelmRelease; our own
    # agents carry a restricted securityContext via apps/kagent/patches.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
