apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-lmcache-config
  namespace: vllm
data:
  config.yaml: |
    chunk_size: 256
    local_cpu: true
    max_local_cpu_size: 6
    remote_url: "valkey://vllm-lmcache-valkey.vllm.svc.cluster.local:6379"
    remote_serde: "naive"
    blocking_timeout_secs: 10
    # Stable hash is recommended when parallelism grows beyond single-rank serving.
    pre_caching_hash_algorithm: sha256_cbor_64bit
    extra_config:
      valkey_mode: "standalone"
      valkey_num_workers: 8