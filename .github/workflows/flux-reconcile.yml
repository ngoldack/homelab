# Post-merge Flux reconciliation, run on the in-cluster self-hosted runner.
#
# The runner pod carries the ci-runner ServiceAccount, which rbac.yaml binds to
# a flux-system Role allowing exactly this: patch the GitRepository and the
# Kustomizations. There is no kubeconfig anywhere but the pod.
#
# Manual nudge: gh workflow run flux-reconcile.yml
#
# The trigger is deliberately push-to-main plus manual dispatch only. The
# runner holds write access to Flux objects and its GitHub PAT is readable from
# its own process environment, so a workflow from a pull request must never run
# here.
name: flux reconcile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main SUPERSEDES an in-flight run: each run pins the revision it
# must see applied everywhere, so once main advances, the older run's revision can
# never be applied again and it burns its whole wait budget before failing — a red
# check for a merge that is not broken (observed 2026-09-22: run 35714299454
# asserted cd60fcd while the cluster had already moved to 178abfcf). Cancelling it
# loses no coverage: the run triggered by the newer merge asserts a revision that
# contains the older one. The wait script reports this case explicitly if a run
# does time out before the cancel lands.
concurrency:
  group: flux-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: [self-hosted, homelab]
    timeout-minutes: 20
    steps:
      # The wait step below runs a script from hack/, so the runner needs the
      # repo — the first step of this workflow has never checked it out because
      # every previous step was a single kubectl/flux command. The checkout is
      # read-only (contents: read), matching the runner's existing posture.
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Point the flux CLI at the in-cluster API server
        run: |
          mkdir -p "$HOME/.kube"
          cat > "$HOME/.kube/config" <<EOF
          apiVersion: v1
          kind: Config
          clusters:
            - name: in-cluster
              cluster:
                certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                server: https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS:-443}
          users:
            - name: ci-runner
              user:
                tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          contexts:
            - name: in-cluster
              context:
                cluster: in-cluster
                user: ci-runner
          current-context: in-cluster
          EOF

      # Order matters: the source is refreshed first, so the children annotated
      # below already see the new revision and reconcile it immediately instead
      # of waiting out their own 10m poll. The revision this run must end with
      # applied everywhere is whatever the fetch just produced.
      - name: Force a fetch of main and record the revision it produced
        run: |
          flux reconcile source git flux-system -n flux-system
          REVISION=$(kubectl get gitrepository flux-system -n flux-system \
            -o jsonpath='{.status.artifact.revision}')
          echo "REVISION=$REVISION" >> "$GITHUB_ENV"

      - name: Reconcile the root Kustomization
        run: flux reconcile kustomization flux-system -n flux-system

      - name: Nudge every child Kustomization
        run: >-
          kubectl annotate kustomizations.kustomize.toolkit.fluxcd.io -n flux-system --all
          "reconcile.fluxcd.io/requestedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" --overwrite

      # A Kustomization that is already Ready stays Ready until its own
      # reconcile starts, so a bare Ready check can pass before this revision
      # has been applied anywhere — a green run proving nothing. Gate on the
      # revision itself being the last thing every one of them applied.
      #
      # Deliberately NOT the reconcile-request annotation's echo in
      # status.lastHandledReconcileAt: that value can be superseded before a
      # controller consumes it, which makes the equality unsatisfiable and
      # hangs the run for the whole timeout (observed). lastAppliedRevision has
      # no such lifecycle and is set only by an actual apply.
      #
      # Why a polling script instead of `kubectl wait`: kubectl wait prints
      # nothing until it passes or times out, so a stuck dependency
      # ("dependency 'x' is not ready") or a dry-run failure ("field is
      # immutable") just burns the 15-minute timeout with zero signal. The
      # script prints, every poll, which Kustomizations have not converged and
      # the message on their Ready condition — the message is where Flux says
      # what it is waiting for. It runs the revision gate then the Ready gate
      # (540 s each; the 20-min job timeout is the outer bound).
      - name: Wait for this run's revision + Ready everywhere (with visibility)
        run: hack/flux-wait-kustomizations.sh "$REVISION" 540

      - name: Status
        if: always()
        run: flux get kustomizations -n flux-system
