[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent-sandbox"
version = "0.1.0"
description = "Hermes terminal backend that runs commands in a Kubernetes Agent Sandbox (Kata) via hermes-go warm pool and the authenticated router."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "k8s-agent-sandbox==1.0.2",
    "cryptography>=42",
    "grpcio>=1.60",
    "protobuf>=4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

# Hermes discovers installed plugins via this entry-point group (plugins.py
# discover_entrypoint_manifests): no file placement under /opt/data needed.
[project.entry-points."hermes_agent.plugins"]
agent_sandbox = "hermes_agent_sandbox.provider:AgentSandboxProvider"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]