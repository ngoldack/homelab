# Build the Hermes gateway image (hermes-agent-sandbox-plugin).
#
# --opt=context pins the repo commit whose Dockerfile carries the build: the
# base image is index-digest-pinned, the plugin venv is wired via a .pth
# derived from the interpreter, and the build asserts the plugin is importable
# and discoverable. It derives from the Hermes base image
# (nousresearch/hermes-agent:v2026.9.7) and installs the agent-sandbox SDK +
# plugin, registering the plugin via the hermes_agent.plugins entry point.
#
# OUTPUT: this Job records the digest of the image it BUILT (the base image's
# digest lives in the Dockerfile). Last built digest — the one
# hermes/statefulset.yaml pins today:
#   sha256:246a3c50471e5b3c62a87eaab62bbedec9a8874979af4ca4d118ab6f7f7aed37
# Previous build (context ...#035bc51a1a73), pinned until 2026-09-17:
#   sha256:df25223f2264f0f5415652c248d77e394d6709dc646c4cefca9321b1ffddcc1c
# Re-record the digest here and re-pin the StatefulSet after every rebuild.
#
# RE-BUILDING: bump the Job name suffix and BOTH the context SHA and image
# tag. Flux sees a new Job (Jobs are immutable), prunes the old one.
apiVersion: batch/v1
kind: Job
metadata:
  name: build-hermes-agent-sandbox-plugin-970fd38
  namespace: buildkit
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 3600
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        topology.homelab/site: home
      containers:
        - name: buildctl
          image: moby/buildkit:v0.31.0
          command:
            - buildctl
          args:
            - --addr=tcp://buildkitd:1234
            - --tlscacert=/certs/ca.crt
            - --tlscert=/certs/tls.crt
            - --tlskey=/certs/tls.key
            - build
            - --frontend=dockerfile.v0
            - --opt=context=https://github.com/ngoldack/homelab.git#970fd38265526b9b150471093bf867fb540b32b6
            - --opt=filename=kubernetes/infrastructure/home/image-builds/hermes-agent-sandbox-plugin/Dockerfile
            - --output=type=image,name=registry.ngoldack.de/hermes-agent-sandbox-plugin:0.1.0-970fd38,push=true
            - --export-cache=type=registry,ref=registry.ngoldack.de/hermes-agent-sandbox-plugin:buildcache,mode=max
            - --import-cache=type=registry,ref=registry.ngoldack.de/hermes-agent-sandbox-plugin:buildcache
            - --progress=plain
          env:
            - name: DOCKER_CONFIG
              value: /docker
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: docker
              mountPath: /docker
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: buildctl-client-tls
        - name: docker
          secret:
            secretName: registry-credentials
            items:
              - key: .dockerconfigjson
                path: config.json
