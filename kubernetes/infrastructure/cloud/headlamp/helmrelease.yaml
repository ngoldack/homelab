apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 1h
  dependsOn:
    - name: cert-manager
  chart:
    spec:
      chart: headlamp
      version: "0.45.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
      interval: 1h
  targetNamespace: headlamp
  values:
    config:
      watchPlugins: true
    pluginsManager:
      enabled: true
      baseImage: node:lts-alpine
      version: latest
      configContent: |
        plugins:
          - name: headlamp_flux
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
            version: 0.7.0
          - name: headlamp_cert-manager
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
            version: 0.1.1
          - name: headlamp_keda
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_keda
            version: 0.1.2
        installOptions:
          parallel: true
          maxConcurrent: 3
    httpRoute:
      enabled: true
      parentRefs:
        - name: public
          namespace: network
      hostnames:
        - headlamp.network.svc.${CLUSTER_DOMAIN}