apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: "1.19.4"
      sourceRef:
        kind: HelmRepository
        name: cilium
      interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # --- Cluster Mesh: this is the homelab cluster (id 1). Joined to the cloud
    # (id 2) and later offsite (id 3) clusters via Cilium Cluster Mesh. Each
    # cluster has a unique name/id and shares a CA so they trust each other.
    # VERIFY-BEFORE-DEPLOY: the clustermesh-apiserver must be reachable from the
    # peer clusters across the WAN/NAT - homelab is behind NAT, so expose it via
    # the cloud edge or a WireGuard/VPN transport; tune the service type/IP. The
    # actual peer wiring is a one-time `cilium clustermesh connect` (exchanges the
    # CA + apiserver certs), run from the workstation.
    cluster:
      name: homelab
      id: 1
    clustermesh:
      useAPIServer: true
      apiserver:
        service:
          type: LoadBalancer

    # Enable Cilium Gateway API support (K8s Service Mesh / Ingress)
    gatewayAPI:
      enabled: true

    # Use standard K8s-based PodCIDR allocation
    ipam:
      mode: kubernetes

    # Talos specific mounts for cgroups
    cgroup:
      autoMount:
        enabled: false
      hostPath: /sys/fs/cgroup

    # Cilium eBPF-based kube-proxy replacement
    kubeProxyReplacement: true

    # Talos local API proxy endpoint. This avoids the bootstrap circulardependency
    # where the CNI needs to reach the cluster_endpoint but the CNI isn't running yet.
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445

    # Enable eBPF-based masquerading
    bpf:
      masquerade: true

    # Enable native host services routing
    hostServices:
      enabled: true

    # Native WireGuard node-to-node encryption — the cross-network transport for
    # the Hetzner edge worker (replaces NetBird/KubeSpan). Unlike KubeSpan this is
    # compatible with the eBPF-masquerade + kube-proxy-replacement datapath.
    # VERIFY-BEFORE-DEPLOY: enabling this re-keys node-to-node traffic
    # cluster-wide; Talos ships the in-kernel WireGuard module (no extension).
    encryption:
      enabled: true
      type: wireguard
      nodeEncryption: true

    # Secure Operator deployment config
    operator:
      replicas: 2
      rollOutPods: true

    # Standard overlay network tunnel
    tunnel: vxlan

    # Enable Cilium Hubble observability
    hubble:
      enabled: true
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - icmp
          - http
      relay:
        enabled: true
      ui:
        enabled: true

    # Necessary security capabilities for Talos Linux Kernel interaction
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - DAC_OVERRIDE
          - FOWNER
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_BOOT
          - SYS_CHROOT
          - SYS_PTRACE
          - SYS_RESOURCE
          - NET_ADMIN
          - NET_RAW
          - BPF
          - PERFMON
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_CHROOT
