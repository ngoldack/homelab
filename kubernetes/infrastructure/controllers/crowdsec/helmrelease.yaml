# CrowdSec — behavioural intrusion detection for the edge. The agent (DaemonSet)
# tails Traefik's access logs, parses them, and ships signals to the LAPI; the LAPI
# stores decisions and serves them to bouncers (the Traefik bouncer plugin enforces
# bans at the edge). Both the agent and LAPI are pinned to the Hetzner edge node so
# they sit next to Traefik. Decisions DB is persisted on node-local edge storage.
#
# VERIFY-BEFORE-DEPLOY:
#   - Pin the chart version (0.x range below is a placeholder).
#   - LAPI is deployed by the chart by default (no explicit lapi.enabled toggle);
#     confirm against the chart values schema.
#   - Confirm value keys: agent.acquisition[].{namespace,podName,program},
#     lapi.persistentVolume.data.*, lapi.env / agent.env, container_runtime.
#   - The bouncer registers via the BOUNCER_KEY_<name> env on LAPI; the Traefik
#     bouncer plugin must use the SAME key (key `bouncer-key`).
#   - Console enrollment uses ENROLL_KEY (+ ENROLL_INSTANCE_NAME) on LAPI.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: crowdsec
  chart:
    spec:
      chart: crowdsec
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: crowdsecurity
      interval: 1h
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  values:
    # Talos uses containerd; the agent needs this to resolve container log paths.
    container_runtime: containerd

    agent:
      # Acquire Traefik access logs from the traefik namespace pods.
      acquisition:
        - namespace: traefik
          podName: traefik-*
          program: traefik
      # Pin the agent DaemonSet to the edge node (next to Traefik).
      nodeSelector:
        node-role: edge
      tolerations:
        - key: node-role
          value: edge
          effect: NoSchedule

    lapi:
      # Local API + decisions store. Persist the decisions DB on edge-local storage.
      persistentVolume:
        data:
          enabled: true
          accessModes:
            - ReadWriteOnce
          storageClassName: local-storage-edge
          size: 2Gi
        config:
          enabled: false
      env:
        # Bouncer API key consumed by the Traefik bouncer plugin (env-sourced).
        - name: BOUNCER_KEY_traefik
          valueFrom:
            secretKeyRef:
              name: crowdsec-credentials
              key: bouncer-key
        # Console enrollment.
        - name: ENROLL_INSTANCE_NAME
          value: homelab-edge
        - name: ENROLL_KEY
          valueFrom:
            secretKeyRef:
              name: crowdsec-credentials
              key: enrollment-key
      # Pin LAPI to the edge node (co-located with the agent + decisions PV).
      nodeSelector:
        node-role: edge
      tolerations:
        - key: node-role
          value: edge
          effect: NoSchedule
