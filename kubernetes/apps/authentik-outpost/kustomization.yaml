apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No top-level `namespace:` on purpose: the Deployment/Service live in the
# authentik-outpost namespace while the Middleware lives in the traefik namespace,
# so each resource carries its own `metadata.namespace`.
resources:
  - namespace.yaml
  - secret.sops.yaml
  - deployment.yaml
  - service.yaml
  - middleware.yaml
