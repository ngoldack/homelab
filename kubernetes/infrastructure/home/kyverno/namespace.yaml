# Kyverno's namespace. No gateway labels: Kyverno has no user-facing surface —
# only the API server talks to it (admission webhooks on 9443), and nothing
# routes through the edge Gateway.
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
  labels:
    # Pod Security Admission: audit+warn at `restricted`, enforcement left to
    # Talos' cluster default (`baseline`) — same posture as the app namespaces.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
