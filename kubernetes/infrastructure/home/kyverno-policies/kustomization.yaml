apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Audit-only ClusterPolicies. Separate Kustomization from the engine itself
  # (kubernetes/clusters/home/kyverno-policies.yaml dependsOn kyverno) so the
  # kyverno.io CRDs are Established by the HelmRelease before these CRs are
  # applied — the same CRD-before-CR split as monitoring-crds/monitoring and
  # agentgateway-crds/agentgateway.
  - policies.yaml
