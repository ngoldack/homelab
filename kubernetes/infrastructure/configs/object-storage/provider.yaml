# Crossplane provider that reconciles MinIO Bucket / User / Policy CRDs against
# the in-cluster Tenant. The package CRDs (minio.crossplane.io) are installed by
# the crossplane controller after this Provider becomes Healthy.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-minio
spec:
  package: ghcr.io/vshn/provider-minio:v0.4.5
  packagePullPolicy: IfNotPresent
  revisionActivationPolicy: Automatic
  revisionHistoryLimit: 1
