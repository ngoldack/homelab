# Tetragon's TracingPolicies — their own Kustomization so the cilium.io
# TracingPolicy CRDs are Established by the tetragon release first
# (CRD-before-CR ordering, same as kyverno/kyverno-policies).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tetragon-policies
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/infrastructure/home/tetragon-policies
  prune: true
  wait: false
  timeout: 10m
  retryInterval: 2m
  dependsOn:
    - name: tetragon
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
