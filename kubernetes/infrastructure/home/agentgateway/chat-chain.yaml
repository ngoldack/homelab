# LLM chain backend for the agentgateway data plane — tiered Synthetic chain.
#
# Groups are priority order: the gateway tries providers from the first group
# onward; when a provider's upstream fails (connect failure or retriable
# status), the gateway moves to the next priority group — the tiered behavior
# the old EAG chain got from prioritized backendRefs + the
# BackendTrafficPolicy's retriable-status-codes trigger.
#
# Every tier is Synthetic: syn:small:text → syn:large:text →
# hf:deepseek-ai/DeepSeek-V4.1-Flash. The OpenRouter flash leg that used to end
# this chain (the `~deepseek/deepseek-v4-flash-latest` alias) was removed
# 2026-09-22 for cost, so the chain now ends at the DeepSeek tier.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: chat-chain
  namespace: agentgateway
spec:
  ai:
    groups:
      - providers:
          - name: synthetic-small
            host: synthetic-proxy.agentgateway.svc.cluster.local
            port: 8080
            path: /v1/chat/completions
            openai:
              model: syn:small:text
            policies:
              auth:
                secretRef:
                  name: synthetic-key
      - providers:
          - name: synthetic-large
            host: synthetic-proxy.agentgateway.svc.cluster.local
            port: 8080
            path: /v1/chat/completions
            openai:
              model: syn:large:text
            policies:
              auth:
                secretRef:
                  name: synthetic-key
      - providers:
          - name: synthetic-hf-deepseek
            host: synthetic-proxy.agentgateway.svc.cluster.local
            port: 8080
            path: /v1/chat/completions
            openai:
              model: hf:deepseek-ai/DeepSeek-V4.1-Flash
            policies:
              auth:
                secretRef:
                  name: synthetic-key
