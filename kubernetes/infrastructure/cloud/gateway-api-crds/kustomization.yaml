# Gateway API standard-channel CRDs. Nothing else in this repo installs them,
# and both Cilium's gatewayAPI.enabled and external-dns's gateway-httproute
# source need them present before they can run — Cilium silently skips
# creating its own GatewayClass without them, external-dns crash-loops
# trying to watch a CRD that doesn't exist, and the Gateway/HTTPRoute
# manifests in this repo fail outright ("no matches for kind").
#
# PINNED TO WHAT CILIUM SUPPORTS, NOT TO LATEST. Cilium 1.19's Gateway API
# docs require exactly v1.4.1. This was previously v1.6.2, which broke the
# Gateway API controller outright: v1.6.2 graduated TLSRoute to the standard
# channel at v1 and stopped serving v1alpha2, but cilium-operator 1.19.5
# unconditionally builds a field indexer for TLSRoute at v1alpha2 and dies if
# it can't resolve that exact GVK —
#   failed to setup field indexer "backendServiceTLSRouteIndex":
#   no matches for kind "TLSRoute" in version "gateway.networking.k8s.io/v1alpha2"
# — taking the whole operator down in CrashLoopBackOff. TLSRoute is nominally
# optional (Cilium only needs it for TLS passthrough, which this repo doesn't
# use) and at v1.4.1 it lives in the experimental channel, so the standard
# channel alone leaves it absent, which the operator handles gracefully.
# Bump this in lockstep with Cilium, against Cilium's own docs — never to
# "whatever Gateway API released most recently".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.4.1/standard-install.yaml
