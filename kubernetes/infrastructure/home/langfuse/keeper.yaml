# KeeperCluster for langfuse's ClickHouse: the coordinator KeeperNode that the
# ClickHouseCluster's keeperClusterRef points at (the operator runs Keeper via
# this separate CR; ClickHouse itself needs a Keeper coordinator). Single
# replica, small footprint, home node.
apiVersion: clickhouse.com/v1alpha1
kind: KeeperCluster
metadata:
  name: langfuse
  namespace: langfuse
spec:
  replicas: 1
  containerTemplate:
    image:
      repository: clickhouse/clickhouse-keeper
      # Digest of clickhouse/clickhouse-keeper:26.4 — keeper must stay
      # version-aligned with the ClickHouse server (clickhouse.yaml).
      hash: "sha256:3e356a2d04518ec4687275c8c0794985a67ab7a1acf0918c1ff2fcfffa1fd5a5"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  podTemplate:
    nodeSelector:
      topology.homelab/site: home
  dataVolumeClaimSpec:
    resources:
      requests:
        storage: 1Gi
    storageClassName: truenas-fast-nfs
