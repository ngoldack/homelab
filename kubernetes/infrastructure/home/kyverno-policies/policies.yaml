# Kyverno cluster policies — Audit-only on purpose.
#
# Why audit: this cluster is reconciled from Git by Flux, so a blocking policy
# fails the *reconcile* of whatever manifest it catches, not a human's
# `kubectl apply`. Flipping one to Enforce (`validationFailureAction: Enforce`)
# is a deliberate per-namespace decision — and clean PolicyReports are NOT the
# gate for it.
#
# What this file covers. The original Pod-shape policies handle latest tags,
# host namespaces, hostPath volumes and privileged/escalation. Seven more,
# appended in Audit mode, close the rest of the PSA `restricted` checklist:
# require-pod-non-root, require-seccomp-runtimedefault,
# require-drop-all-capabilities, require-resource-requests,
# disallow-default-serviceaccount, restrict-image-registries and
# require-cilium-default-deny-floor. The census paragraph below is the record
# of why audit had to come first — it is not a description of what is missing
# today. (A read-only root filesystem is good practice but is not one of this
# cluster's PSA `restricted` controls, so it is not part of the gap.)
#
# The reason the flip is not mechanical: a namespace can report clean and still
# be rejected the moment enforce=restricted lands, and because enforcement only
# evaluates new pods the breakage arrives late and looks unrelated. A live
# census on 2026-09-17 found 40 of 52 in-scope pods failing at least one
# restricted control, so those securityContexts have to be added per workload
# first. Pod Security Admission labels carry the actual pod-hardening
# enforcement in the meantime.
#
# hermes-sandbox-profile-allowlist is a different animal and is NOT part of the
# hardening census above: it audits
# Agent Sandbox custom resources (Sandbox/SandboxClaim/SandboxTemplate/
# SandboxWarmPool), not Pods, and it is the one policy here whose scope is
# exactly the namespace every Pod policy above excludes (hermes-sandbox
# sandboxes are hardened by their SandboxTemplate + the ValidatingAdmissionPolicy
# agent-sandbox/policies/secure-hermes-sandbox, so Pod patterns do not apply to
# them).
#
# Scope: the app namespaces (authentik, paperless, immich, langfuse, hindsight,
# headlamp, hermes, agentgateway, aigateway, registry, llmkube-system,
# talos-backup, unpoller, homelab-infra-metrics, …). The platform namespaces
# below are excluded because they legitimately need what these policies
# prohibit — the CNI/CSI/device-plugin plane uses host namespaces and hostPath
# by design, monitoring and the image builder mount host paths, the media
# stack's VLAN egress needs NET_ADMIN, and Flux/Kyverno must be able to write
# the policy objects themselves:
#   kube-system, kube-node-lease, kube-public, cilium-secrets, flux-system,
#   kyverno, monitoring, network, cert-manager, cnpg-system,
#   clickhouse-operator, seaweedfs-operator, valkey-operator-system,
#   truenas-csi, nvidia-device-plugin, buildkit, agent-sandbox-system,
#   hermes-sandbox, media, tetragon, crowdsec
---
# Explicit image tags (or digests) only. Two rules so the report distinguishes
# "no tag at all" (implicit :latest) from "literally :latest" — the same shape
# as the upstream disallow-latest-tag policy. Autogen extends the Pod rule to
# the pod controllers Flux actually applies (Deployment/StatefulSet/Job/…).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow latest / untagged images
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: medium
    # Exception register, Unit 6.2: expanded into docs/policy-exceptions.md.
    homelab.ngoldack.de/policy-exceptions: |
      - scope: platform-namespaces
        owner: platform
        reason: >-
          Platform planes ship image tags from upstream charts/operators (Cilium, Kyverno, CSI,
          device plugins) and Flux/Kyverno must be able to write the policy objects themselves.
        review: "2027-03-18"
spec:
  validationFailureAction: Audit
  # Surface violations to whoever runs kubectl apply, not just to
  # PolicyReports and to the applier as a kubectl warning (the review found
  # the applier saw nothing; note this cluster runs no kube-apiserver audit
  # policy, so the `audit:` PSA level records nothing either).
  emitWarning: true
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - cilium-secrets
                - flux-system
                - kyverno
                - monitoring
                - network
                - cert-manager
                - cnpg-system
                - clickhouse-operator
                - seaweedfs-operator
                - valkey-operator-system
                - truenas-csi
                - nvidia-device-plugin
                - buildkit
                - agent-sandbox-system
                - hermes-sandbox
                - media
                - tetragon
                - crowdsec
      validate:
        message: "Image must carry an explicit tag or digest (not an implicit :latest)."
        pattern:
          spec:
            containers:
              - image: "*:*"
    - name: validate-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - cilium-secrets
                - flux-system
                - kyverno
                - monitoring
                - network
                - cert-manager
                - cnpg-system
                - clickhouse-operator
                - seaweedfs-operator
                - valkey-operator-system
                - truenas-csi
                - nvidia-device-plugin
                - buildkit
                - agent-sandbox-system
                - hermes-sandbox
                - media
                - tetragon
                - crowdsec
      validate:
        message: "Using the mutable `latest` tag is not allowed."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
---
# Host namespaces (hostNetwork/hostPID/hostIPC) escape pod isolation entirely:
# a hostNetwork pod shares the node's network namespace, and hostPID can read
# every process on the node. The `=(...)` anchors let the fields be absent
# (their Kubernetes default is false) instead of failing the pattern.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-host-namespaces
  annotations:
    policies.kyverno.io/title: Restrict host namespaces
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    # Exception register, Unit 6.2: expanded into docs/policy-exceptions.md.
    homelab.ngoldack.de/policy-exceptions: |
      - scope: platform-namespaces
        owner: platform
        reason: >-
          CNI/CSI/device-plugin/monitoring planes need host namespaces by design, and Flux/Kyverno
          must be able to write the policy objects themselves.
        review: "2027-03-18"
spec:
  validationFailureAction: Audit
  # Surface violations to whoever runs kubectl apply, not just to
  # PolicyReports and to the applier as a kubectl warning (the review found
  # the applier saw nothing; note this cluster runs no kube-apiserver audit
  # policy, so the `audit:` PSA level records nothing either).
  emitWarning: true
  background: true
  rules:
    - name: host-namespaces-false
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - cilium-secrets
                - flux-system
                - kyverno
                - monitoring
                - network
                - cert-manager
                - cnpg-system
                - clickhouse-operator
                - seaweedfs-operator
                - valkey-operator-system
                - truenas-csi
                - nvidia-device-plugin
                - buildkit
                - agent-sandbox-system
                - hermes-sandbox
                - media
                - tetragon
                - crowdsec
      validate:
        message: "hostNetwork, hostPID and hostIPC must be false."
        pattern:
          spec:
            =(hostNetwork): false
            =(hostPID): false
            =(hostIPC): false
---
# hostPath volumes mount a node directory into the pod — the standard way a
# compromised workload reaches the host. X() is Kyverno's deny anchor: the
# pattern only matches when the field is ABSENT.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-path
  annotations:
    policies.kyverno.io/title: Disallow hostPath volumes
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    # Exception register, Unit 6.2: expanded into docs/policy-exceptions.md.
    homelab.ngoldack.de/policy-exceptions: |
      - scope: platform-namespaces
        owner: platform
        reason: >-
          Monitoring, the image builder and the CNI/CSI/device-plugin planes mount host paths by
          design, and Flux/Kyverno must be able to write the policy objects themselves.
        review: "2027-03-18"
spec:
  validationFailureAction: Audit
  # Surface violations to whoever runs kubectl apply, not just to
  # PolicyReports and to the applier as a kubectl warning (the review found
  # the applier saw nothing; note this cluster runs no kube-apiserver audit
  # policy, so the `audit:` PSA level records nothing either).
  emitWarning: true
  background: true
  rules:
    - name: no-host-path-volumes
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - cilium-secrets
                - flux-system
                - kyverno
                - monitoring
                - network
                - cert-manager
                - cnpg-system
                - clickhouse-operator
                - seaweedfs-operator
                - valkey-operator-system
                - truenas-csi
                - nvidia-device-plugin
                - buildkit
                - agent-sandbox-system
                - hermes-sandbox
                - media
                - tetragon
                - crowdsec
      validate:
        message: "hostPath volumes are not allowed."
        pattern:
          spec:
            =(volumes):
              - X(hostPath): "null"
---
# Privileged containers get every capability and device on the node, and
# allowPrivilegeEscalation lets a setuid binary regain them. `privileged`
# defaults to false, so it keeps the `=(...)` anchor. allowPrivilegeEscalation
# defaults to TRUE when omitted, so it is REQUIRED here and the container
# securityContext is required with it — anchoring either would let exactly the
# pods this audit exists to find pass silently (PSA reports an omitted field as
# a violation, and that is the population the census counted).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow privileged containers
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    # Exception register, Unit 6.2: expanded into docs/policy-exceptions.md.
    homelab.ngoldack.de/policy-exceptions: |
      - scope: platform-namespaces
        owner: platform
        reason: >-
          CNI/CSI/device-plugin/Kata/crowdsec planes are privileged by design and the media stack
          needs NET_ADMIN, while Flux/Kyverno must be able to write the policy objects themselves.
        review: "2027-03-18"
spec:
  validationFailureAction: Audit
  # Surface violations to whoever runs kubectl apply, not just to
  # PolicyReports and to the applier as a kubectl warning (the review found
  # the applier saw nothing; note this cluster runs no kube-apiserver audit
  # policy, so the `audit:` PSA level records nothing either).
  emitWarning: true
  background: true
  rules:
    - name: privileged-and-escalation-false
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - cilium-secrets
                - flux-system
                - kyverno
                - monitoring
                - network
                - cert-manager
                - cnpg-system
                - clickhouse-operator
                - seaweedfs-operator
                - valkey-operator-system
                - truenas-csi
                - nvidia-device-plugin
                - buildkit
                - agent-sandbox-system
                - hermes-sandbox
                - media
                - tetragon
                - crowdsec
      validate:
        message: >-
          allowPrivilegeEscalation must be explicitly false (it defaults to true
          when omitted, which is what most of these findings are) and privileged
          must be false.
        pattern:
          spec:
            containers:
              - securityContext:
                  =(privileged): false
                  allowPrivilegeEscalation: false
---
# The Hermes sandbox profile allowlist — the fixed set of backends a session
# may be aimed at, audited on the Agent Sandbox custom resources.
#
# WHY this policy exists: Hermes selects a sandbox by NAME only. The plugin
# hardcodes namespace+template as a module-constant allowlist and never reads
# either from the caller
# (image-builds/hermes-agent-sandbox-plugin/src/hermes_agent_sandbox/config.py),
# and the templates in kubernetes/infrastructure/home/hermes-sandbox/ define
# the vocabulary: hermes-go (sandbox-template.yaml), hermes-core and
# hermes-offline (sandbox-templates-profiles.yaml). Nothing in the CRDs stops a
# claim, pool or template from naming anything else — any string is a valid
# name — so this rule set is what turns "the plugin is careful" into "the
# cluster reports the name". It is the other half of the profile contract the
# templates and the per-profile Cilium classes (hermes-sandbox/cilium-policy.yaml)
# express.
#
# THREE CHECKS, one per hop of the reference chain (claim -> pool -> template),
# plus the profile label that ties an object to its class:
#   1. profile label — WHERE IT EXISTS it must be a known profile name. Absence
#      is deliberately allowed for now: the plugin starts stamping the label on
#      claims in the same phase, and the warm-pool sandbox provisioned before
#      this change carries no label and must not be reported. Every path the
#      CRDs let it appear on is checked (object metadata; the claim's
#      spec.additionalPodMetadata; a template's spec.podTemplate.metadata), so
#      a label that skips one of them cannot slip through unnoticed. When the
#      label is on every claim, a follow-up flips this to "must exist".
#   2. claim -> warm pool (spec.warmPoolRef.name): a claim may only adopt a pool
#      of the fixed set. Today that set is exactly {hermes-go} — one warm slot,
#      the ceiling the mixed-use sandbox node's headroom supports
#      (sandbox-warm-pool.yaml) — so a claim naming any other pool is a typo or
#      an attempt to leave the profile set, and it would never become Ready
#      anyway. The field is CRD-required, so there is no absent case here.
#   3. pool -> template (SandboxWarmPool.spec.sandboxTemplateRef.name) and the
#      template's own metadata.name: both must be in the shipped template
#      allowlist. The empty string is allowed in the sandboxTemplateRef
#      condition because that field does not exist on a SandboxTemplate — for
#      those, the metadata.name condition is the binding one.
#
# ADDING A PROFILE = ONE COMMIT: the template, its warm pool, its Cilium class
# doc (cilium-policy.yaml) and its name in the lists below — all of them. The
# label vocabulary below already names the six contract profiles (core,
# offline, python, go, node, web), because a label alone grants nothing: it
# only classifies. What makes a profile USABLE is its template + pool + class,
# which is what the name lists gate. hermes-python ships with the python
# toolchain image, not before (the current runtime image contains no Python).
#
# Operator and format facts (both grounded in the Kyverno JMESPath docs, and
# both checked against the pinned engine version 3.9.1 / Kyverno 1.14, whose
# admission webhook also VALIDATES this policy's expressions at apply time):
#   * AllNotIn takes a LIST value, which is how a name allowlist is expressed.
#     It is the non-deprecated spelling of NotIn (the live webhook warns
#     "Operator NotIn has been deprecated ... Use AllNotIn/AnyNotIn"), and for
#     these scalar keys AllNotIn is the exact replacement: one value, so "any
#     not in" and "all not in" coincide.
#   * `|| 'token'` supplies the default for an absent field as a raw STRING
#     literal; `|| ""` would be a quoted identifier (a field lookup named ""),
#     not a string, and would leave the default null. Proven with a JMESPath
#     implementation, not assumed.
#   * kinds are written in Group/Version/Kind form — "SandboxClaim" alone is
#     ambiguous across the two Agent Sandbox API groups here
#     (agents.x-k8s.io: Sandbox; extensions.agents.x-k8s.io: SandboxClaim,
#     SandboxTemplate, SandboxWarmPool).
#   * `deny` rules with explicit kinds ARE evaluated in background scans, which
#     is why this policy can keep background: true and report pre-existing
#     objects; wildcards in match would not be allowed to.
#   * the live API server also warns that kyverno.io/v1 ClusterPolicy itself is
#     deprecated in favour of ValidatingPolicy (policies.kyverno.io); migrating
#     is a repo-wide decision for all five policies here, so this one stays in
#     the same API version as the four above rather than splitting the file.
#   * Kyverno's reports controller needs get/list/watch on these CRs to write
#     PolicyReports at all; that grant lives beside the CRs
#     (hermes-sandbox/kyverno-policy-read-rbac.yaml), scoped to this namespace.
#   * ORDERING CAVEAT: this policy matches CRDs owned by the
#     kubernetes/clusters/home/agent-sandbox.yaml Kustomization, while
#     kubernetes/clusters/home/kyverno-policies.yaml dependsOn kyverno only.
#     Kyverno resolves the kinds at evaluation time, so an early reconcile can
#     mark the policy not-ready until Agent Sandbox has installed the CRDs
#     (Flux retries); adding agent-sandbox to that dependsOn list removes the
#     window, and is the recommended follow-up.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: hermes-sandbox-profile-allowlist
  annotations:
    policies.kyverno.io/title: Restrict Hermes sandbox profiles to the fixed set
    policies.kyverno.io/category: Hermes sandbox
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Audit
  # Surface violations to whoever runs kubectl apply, not just to
  # PolicyReports (the applier otherwise sees nothing — same rationale as the
  # four policies above).
  emitWarning: true
  # Report pre-existing CRs, not just newly admitted ones.
  background: true
  rules:
    # Hop 0: the profile label, wherever a claim, sandbox, template or pool can
    # carry it. `|| ""` maps "field absent" to the empty string, which is in the
    # allowed list — that is the deliberate presence-optional behaviour.
    - name: profile-label-known
      match:
        any:
          - resources:
              kinds:
                - agents.x-k8s.io/v1beta1/Sandbox
                - extensions.agents.x-k8s.io/v1beta1/SandboxClaim
                - extensions.agents.x-k8s.io/v1beta1/SandboxTemplate
                - extensions.agents.x-k8s.io/v1beta1/SandboxWarmPool
              namespaces:
                - hermes-sandbox
      validate:
        message: >-
          workload.hermes.io/profile must be one of the fixed Hermes profiles
          (core, offline, python, go, node, web) when it is set — an unknown
          value would give the sandbox an egress class that does not exist.
        deny:
          conditions:
            any:
              # Object-level label (set by Hermes on the claim, by us on the
              # templates — see sandbox-template.yaml / sandbox-templates-profiles.yaml).
              # `|| 'unlabelled'` is a JMESPath raw-string default (single quotes —
              # double quotes are quoted identifiers in JMESPath, not strings),
              # so an absent label becomes a real token that is present in the
              # allowlist instead of an empty value with ambiguous semantics.
              - key: "{{ request.object.metadata.labels.\"workload.hermes.io/profile\" || 'unlabelled' }}"
                operator: AllNotIn
                value: [unlabelled, core, offline, python, go, node, web]
              # Claim-side pod label passthrough (the SandboxClaim CRD exposes
              # spec.additionalPodMetadata.labels; absent on the other kinds).
              # Folded scalars keep the expression on one logical line while the
              # file stays inside the 120-column limit.
              - key: >-
                  {{ request.object.spec.additionalPodMetadata.labels."workload.hermes.io/profile" || 'unlabelled' }}
                operator: AllNotIn
                value: [unlabelled, core, offline, python, go, node, web]
              # Template-side pod label (the label the pod actually gets, and
              # therefore the one the Cilium class docs select on).
              - key: >-
                  {{ request.object.spec.podTemplate.metadata.labels."workload.hermes.io/profile" || 'unlabelled' }}
                operator: AllNotIn
                value: [unlabelled, core, offline, python, go, node, web]
    # Hop 1: claim -> warm pool.
    - name: claim-warmpool-allowlisted
      match:
        any:
          - resources:
              kinds:
                - extensions.agents.x-k8s.io/v1beta1/SandboxClaim
              namespaces:
                - hermes-sandbox
      validate:
        message: >-
          SandboxClaim spec.warmPoolRef.name must name a warm pool of the fixed
          Hermes profile set (hermes-go) — the only pool that exists, and the
          only one a claim can become Ready against.
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.warmPoolRef.name }}"
                operator: AllNotIn
                value: [hermes-go]
    # Hop 2: pool -> template, and the template's own identity.
    - name: pool-and-template-name-allowlisted
      match:
        any:
          - resources:
              kinds:
                - extensions.agents.x-k8s.io/v1beta1/SandboxTemplate
                - extensions.agents.x-k8s.io/v1beta1/SandboxWarmPool
              namespaces:
                - hermes-sandbox
      validate:
        message: >-
          SandboxTemplate/SandboxWarmPool names must be one of the shipped
          Hermes profile names (hermes-core, hermes-offline, hermes-go). Add the
          template, its warm pool, its Cilium class and this allowlist entry in
          the same commit.
        deny:
          conditions:
            any:
              # The object's own name — what Hermes selects by, and what a pool
              # must be named after (pool name == profile name is the contract
              # the plugin's NAME-only selection relies on).
              - key: "{{ request.object.metadata.name || 'none' }}"
                operator: AllNotIn
                value: [none, hermes-core, hermes-offline, hermes-go]
              # The template a pool provisions from; 'none' (the JMESPath
              # raw-string default) is the SandboxTemplate case, where this
              # field does not exist at all.
              - key: "{{ request.object.spec.sandboxTemplateRef.name || 'none' }}"
                operator: AllNotIn
                value: [none, hermes-core, hermes-offline, hermes-go]

---
# hermes-session-quarantine — plan Unit 3.4. Reports (Audit; the Enforce flip
# is a deliberate follow-up, same posture as every policy above) sessions the
# egress reaper has quarantined: a deny or kill through the hermes-egress
# guard escalates to a signed event, the reaper writes the session's hash into
# the hermes-quarantine ConfigMap (hermes-egress/README.md, quarantine path),
# and this policy matches every new Sandbox/SandboxClaim carrying that hash.
#
# CONTEXT: the ConfigMap lookup hermes-sandbox/hermes-quarantine. The reaper
# CREATES that (initially empty) ConfigMap AT STARTUP (hermes-egress README),
# so a missing ConfigMap means the reaper is not running — exactly the state
# where fail-open would silently skip quarantine.
#
# failurePolicy: Fail — fail-closed BY DESIGN: with the context lookup
# unavailable (reaper down, ConfigMap gone), Kyverno treats every matched
# admission as a policy failure. In Audit mode that keeps reporting instead of
# silently passing; when this flips to Enforce, new claims are REJECTED while
# the reaper is down rather than admitted unquarantined. A missing ConfigMap
# is the same condition as a reaper outage — never a pass.
#
# apiGroups are exactly the kinds the hermes-sandbox-profile-allowlist policy
# above matches (grounded in the vendored agent-sandbox upstream CRDs:
# SandboxClaim extensions.agents.x-k8s.io/v1beta1, Sandbox
# agents.x-k8s.io/v1beta1). Kyverno resolves these kinds at evaluation time;
# the same not-ready window note as the policy above applies.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: hermes-session-quarantine
  annotations:
    policies.kyverno.io/title: Flag quarantined Hermes sandbox sessions
    policies.kyverno.io/category: Hermes sandbox
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Audit
  emitWarning: true
  background: true
  # Fail-closed on the context lookup (see header): a reaper outage must
  # surface as policy failures, never as silent passes.
  failurePolicy: Fail
  rules:
    - name: quarantined-session-hash
      match:
        any:
          - resources:
              kinds:
                - agents.x-k8s.io/v1beta1/Sandbox
                - extensions.agents.x-k8s.io/v1beta1/SandboxClaim
              namespaces:
                - hermes-sandbox
      context:
        - name: quarantine
          configMap:
            name: hermes-quarantine
            namespace: hermes-sandbox
      validate:
        message: >-
          Session is quarantined by the hermes-egress reaper (hermes-quarantine
          ConfigMap): egress violations (allowlist denials / instant-kill
          targets) escalated to a kill event. Clearing requires the documented
          key deletion (hermes-egress/README.md, "Clearing a quarantine") —
          false positives affect only one session.
        deny:
          conditions:
            any:
              # The claim's own label (stamped by the plugin at claim create)
              # OR the pod-side passthrough label the claim carries for its
              # pods (spec.additionalPodMetadata.labels). Either matching the
              # quarantine ledger flags the admission — the pod gets the label
              # from the claim, so checking both is checking the session once.
              - key: "{{ request.object.metadata.labels.\"workload.hermes.io/session-hash\" || 'none' }}"
                operator: AllIn
                value: "{{ quarantine.data.keys(@) | sort(@) }}"
              - key: >-
                  {{ request.object.spec.additionalPodMetadata.labels."workload.hermes.io/session-hash" || 'none' }}
                operator: AllIn
                value: "{{ quarantine.data.keys(@) | sort(@) }}"

---
# require-pod-non-root — Phase 6.1, control "running as non-root".
#
# WHY IT IS A GAP: none of the four Pod policies above checks runAsNonRoot, so a
# namespace can report clean against them and still be rejected the day
# PSA enforce=restricted lands (file header). Only hermes, hermes-sandbox,
# hermes-egress and github-runner carry enforce=restricted today; every other app
# namespace carries audit/warn only, and with no API audit policy (see
# security-baseline/kustomization.yaml) nothing outside PSA's own reports even
# surfaces this. A read-only census on 2026-09-18 over the namespaces this file
# covers found 40 of 75 containers with no effective runAsNonRoot=true, and 43 of
# 55 pods failing at least one of {non-root, seccomp, drop-ALL}.
#
# SEMANTICS: PSA-exact, read from the upstream check source (check_runAsNonRoot.go)
# rather than inferred. Three violations:
#   1. pod-level runAsNonRoot explicitly false — flagged even when every container
#      overrides it (rule pod-level-not-false);
#   2. a container whose own runAsNonRoot is explicitly false;
#   3. a container whose own runAsNonRoot is absent while the pod level is not true.
# `foreach` + `deny` is used instead of a `pattern` because no pattern can express
# that per-container override/fallback pair: a single-element `pattern` list
# applies to every container (there is no either/or), and `anyPattern`
# alternatives are evaluated per pattern, not per container. Each condition is a
# PASS expression compared with NotEquals "true", so a rendering surprise (null,
# expression error) reports instead of silently passing.
#
# CONDITION IDIOM (verified against the engine, not assumed): a condition key
# that resolves to a JSON boolean never equals a string value, so
# `key: "{{ x == \`true\` }}"` + `operator: NotEquals value: "true"` is ALWAYS
# true — every pass-expression in this file is therefore wrapped as
# `(pass-expression) && 'pass' || 'fail'` and compared with NotEquals "pass"
# (also fail-safe: a rendering error is not the string "pass", so it reports).
# Verified with `kyverno jp query` on the exact expressions and end-to-end with
# `kyverno apply` (CLI v1.19.1, the cluster's engine version) against compliant
# and violating fixture pods.
#
# AUDIT -> ENFORCE: fix the securityContexts, then flip this and its two sibling
# policies (seccomp, drop-ALL) in the same commit as that namespace's PSA
# enforce=restricted label. Clean reports alone are not the gate: enforcement
# only evaluates newly admitted pods, so breakage from an unclean namespace
# arrives late and looks unrelated.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-pod-non-root
  annotations:
    policies.kyverno.io/title: Require an effective non-root runAsNonRoot
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    # Exception register, Unit 6.2: expanded into docs/policy-exceptions.md.
    homelab.ngoldack.de/policy-exceptions: |
      - scope: platform-namespaces
        owner: platform
        reason: >-
          Platform planes legitimately run as root (CNI/CSI/device-plugin/monitoring/build/Kata) and
          Flux/Kyverno must be able to write the policy objects themselves.
        review: "2027-03-18"
spec:
  validationFailureAction: Audit
  # Surface violations to whoever runs kubectl apply, like the four policies above.
  emitWarning: true
  background: true
  rules:
    - name: pod-level-not-false
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - cilium-secrets
                - flux-system
                - kyverno
                - monitoring
                - network
                - cert-manager
                - cnpg-system
                - clickhouse-operator
                - seaweedfs-operator
                - valkey-operator-system
                - truenas-csi
                - nvidia-device-plugin
                - buildkit
                - agent-sandbox-system
                - hermes-sandbox
                - media
                - tetragon
                - crowdsec
      validate:
        message: >-
          spec.securityContext.runAsNonRoot must not be false: PSA restricted rejects the pod for
          it even when every container overrides the field.
        deny:
          conditions:
            any:
              - key: >-
                  {{ (!(request.object.spec.securityContext.runAsNonRoot == `false`)) && 'pass' || 'fail' }}
                operator: NotEquals
                value: "pass"
    - name: effective-runasnonroot-true
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - cilium-secrets
                - flux-system
                - kyverno
                - monitoring
                - network
                - cert-manager
                - cnpg-system
                - clickhouse-operator
                - seaweedfs-operator
                - valkey-operator-system
                - truenas-csi
                - nvidia-device-plugin
                - buildkit
                - agent-sandbox-system
                - hermes-sandbox
                - media
                - tetragon
                - crowdsec
      validate:
        message: >-
          Containers must run as non-root: the effective runAsNonRoot (container securityContext,
          else the pod securityContext) must be true.
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: >-
                      {{ (element.securityContext.runAsNonRoot == `true`
                      || (element.securityContext.runAsNonRoot == `null`
                      && request.object.spec.securityContext.runAsNonRoot == `true`)) && 'pass' || 'fail' }}
                    operator: NotEquals
                    value: "pass"
          - list: "request.object.spec.initContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: >-
                      {{ (element.securityContext.runAsNonRoot == `true`
                      || (element.securityContext.runAsNonRoot == `null`
                      && request.object.spec.securityContext.runAsNonRoot == `true`)) && 'pass' || 'fail' }}
                    operator: NotEquals
                    value: "pass"
          # Ephemeral containers can be added by kubectl debug; PSA restricted
          # applies to them too, so the audit reports them rather than letting a
          # debug container escape the census.
          - list: "request.object.spec.ephemeralContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: >-
                      {{ (element.securityContext.runAsNonRoot == `true`
                      || (element.securityContext.runAsNonRoot == `null`
                      && request.object.spec.securityContext.runAsNonRoot == `true`)) && 'pass' || 'fail' }}
                    operator: NotEquals
                    value: "pass"

---
# require-seccomp-runtimedefault — Phase 6.1, control "seccompProfile".
#
# WHY IT IS A GAP: PSA restricted requires a seccomp profile (RuntimeDefault or
# Localhost) for every container; no policy here checks it, so a clean
# PolicyReport does not mean a pod will survive enforce=restricted. Same census
# as above (2026-09-18): 42 of 75 containers in covered namespaces have no
# effective RuntimeDefault profile, and none uses Localhost — so requiring
# RuntimeDefault exactly is not lossy for this cluster (Localhost would be
# allowed by PSA but is not in use; if a workload ever needs it, whitelist it
# here with a comment rather than loosening the rule).
#
# SEMANTICS: PSA-exact, read from the upstream check source
# (check_seccompProfile_restricted.go) rather than inferred. Violations: a
# pod-level profile set to a value other than the allowed one (flagged even when
# every container overrides it — rule pod-level-allowed); a container-level
# profile set to a disallowed value; a container with no profile while the pod
# level has none either. `.type` on an absent object is null, so the comparison
# against the allowed value is total without anchors.
#
# AUDIT -> ENFORCE: same transition as require-pod-non-root.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-seccomp-runtimedefault
  annotations:
    policies.kyverno.io/title: Require an effective RuntimeDefault seccomp profile
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    # Exception register, Unit 6.2: expanded into docs/policy-exceptions.md.
    homelab.ngoldack.de/policy-exceptions: |
      - scope: platform-namespaces
        owner: platform
        reason: >-
          Platform planes legitimately need what this policy prohibits (host namespaces, hostPath,
          privileged/root, no seccomp floor) and Flux/Kyverno must write the policy objects themselves.
        review: "2027-03-18"
spec:
  validationFailureAction: Audit
  emitWarning: true
  background: true
  rules:
    - name: pod-level-allowed
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - cilium-secrets
                - flux-system
                - kyverno
                - monitoring
                - network
                - cert-manager
                - cnpg-system
                - clickhouse-operator
                - seaweedfs-operator
                - valkey-operator-system
                - truenas-csi
                - nvidia-device-plugin
                - buildkit
                - agent-sandbox-system
                - hermes-sandbox
                - media
                - tetragon
                - crowdsec
      validate:
        message: >-
          spec.securityContext.seccompProfile, when set, must be RuntimeDefault (this cluster's
          floor; PSA would also allow Localhost).
        deny:
          conditions:
            any:
              - key: >-
                  {{ (request.object.spec.securityContext.seccompProfile == `null`
                  || request.object.spec.securityContext.seccompProfile.type == 'RuntimeDefault') && 'pass' || 'fail' }}
                operator: NotEquals
                value: "pass"
    - name: effective-seccomp-runtimedefault
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - cilium-secrets
                - flux-system
                - kyverno
                - monitoring
                - network
                - cert-manager
                - cnpg-system
                - clickhouse-operator
                - seaweedfs-operator
                - valkey-operator-system
                - truenas-csi
                - nvidia-device-plugin
                - buildkit
                - agent-sandbox-system
                - hermes-sandbox
                - media
                - tetragon
                - crowdsec
      validate:
        message: >-
          Containers must set an effective seccompProfile of RuntimeDefault (container securityContext,
          else the pod securityContext).
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: >-
                      {{ (element.securityContext.seccompProfile.type == 'RuntimeDefault'
                      || (element.securityContext.seccompProfile == `null`
                      && request.object.spec.securityContext.seccompProfile.type == 'RuntimeDefault'))
                      && 'pass' || 'fail' }}
                    operator: NotEquals
                    value: "pass"
          - list: "request.object.spec.initContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: >-
                      {{ (element.securityContext.seccompProfile.type == 'RuntimeDefault'
                      || (element.securityContext.seccompProfile == `null`
                      && request.object.spec.securityContext.seccompProfile.type == 'RuntimeDefault'))
                      && 'pass' || 'fail' }}
                    operator: NotEquals
                    value: "pass"
          - list: "request.object.spec.ephemeralContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: >-
                      {{ (element.securityContext.seccompProfile.type == 'RuntimeDefault'
                      || (element.securityContext.seccompProfile == `null`
                      && request.object.spec.securityContext.seccompProfile.type == 'RuntimeDefault'))
                      && 'pass' || 'fail' }}
                    operator: NotEquals
                    value: "pass"

---
# require-drop-all-capabilities — Phase 6.1, control "capabilities.drop: ALL".
#
# WHY IT IS A GAP: PSA restricted requires every container to drop ALL
# capabilities; no policy here checks the capability set, so the media stack's
# NET_ADMIN need is invisible to the reports in every other namespace. Same
# census (2026-09-18): 35 of 75 containers in covered namespaces have no
# effective drop of ALL.
#
# SEMANTICS: PSA-exact, read from the upstream check source
# (check_capabilities_restricted.go) rather than inferred: the check looks ONLY
# at the container's own securityContext.capabilities — a container that inherits
# the pod-level field is reported as missing it, and a container whose
# `capabilities` object exists without `drop` is reported too (the override wins
# either way). This is why the expression reads the container object only, with
# no pod-level fallback, and why `|| 'none'` is used: it keeps the expression
# total when the field is absent (a string has no .drop, so contains() returns
# false and the container is reported).
#
# NOT COVERED HERE, deliberately: PSA also restricts `capabilities.add` to
# NET_BIND_SERVICE, and it additionally requires the same drop from init and
# ephemeral containers — the latter two ARE covered below (three foreach lists),
# but the `add` allowlist is a distinct control that this checklist item
# ("drop ALL") does not ask for; it would flag intentional NET_BIND_SERVICE adds
# that are legitimate today. Add it as its own policy if it is wanted.
#
# AUDIT -> ENFORCE: same transition as require-pod-non-root. Namespaces that
# genuinely need an added capability (media's NET_ADMIN today) are already in the
# exclude list at the top of this file rather than being exceptions here.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-drop-all-capabilities
  annotations:
    policies.kyverno.io/title: Require an effective capabilities drop of ALL
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    # Exception register, Unit 6.2: expanded into docs/policy-exceptions.md.
    homelab.ngoldack.de/policy-exceptions: |
      - scope: platform-namespaces
        owner: platform
        reason: >-
          Platform planes legitimately need added capabilities (media/NET_ADMIN, CNI, CSI, device
          plugins) and Flux/Kyverno must write the policy objects themselves.
        review: "2027-03-18"
spec:
  validationFailureAction: Audit
  emitWarning: true
  background: true
  rules:
    - name: effective-drop-all
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - cilium-secrets
                - flux-system
                - kyverno
                - monitoring
                - network
                - cert-manager
                - cnpg-system
                - clickhouse-operator
                - seaweedfs-operator
                - valkey-operator-system
                - truenas-csi
                - nvidia-device-plugin
                - buildkit
                - agent-sandbox-system
                - hermes-sandbox
                - media
                - tetragon
                - crowdsec
      validate:
        message: >-
          Containers must drop ALL capabilities: the container's own
          securityContext.capabilities.drop must include ALL (PSA looks only at the container's
          own field, never at an inherited pod-level one).
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: >-
                      {{ ((element.securityContext.capabilities.drop || 'none')
                      | contains(@, 'ALL')) && 'pass' || 'fail' }}
                    operator: NotEquals
                    value: "pass"
          - list: "request.object.spec.initContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: >-
                      {{ ((element.securityContext.capabilities.drop || 'none')
                      | contains(@, 'ALL')) && 'pass' || 'fail' }}
                    operator: NotEquals
                    value: "pass"
          - list: "request.object.spec.ephemeralContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: >-
                      {{ ((element.securityContext.capabilities.drop || 'none')
                      | contains(@, 'ALL')) && 'pass' || 'fail' }}
                    operator: NotEquals
                    value: "pass"

---
# require-resource-requests — Phase 6.1, control "resource requests present".
#
# WHY IT IS A GAP: PSA has no resource control at all, and no policy here checks
# it — the Kubernetes scheduler and the eviction path are the only backstops. The
# cluster has already hit the consequence once: a rolling update deadlocked
# because a node was CPU-saturated and every replacement pod had to fit the
# scheduler's view of it (see the rollout-capacity-deadlock runbook entry in
# docs/disaster-recovery.md). A pod without requests is scheduled into whatever
# headroom "looks" free and is the first thing to destabilise a node.
#
# SCOPE: cpu and memory requests on every container and init container (an
# ephemeral container cannot declare resources — the API rejects it — so they are
# not iterated). Limits are deliberately NOT required here: requests are what the
# scheduler acts on, and a limits rule would be a different control with a
# different blast radius (memory-limited JVMs, burstable databases).
#
# EXEMPT: none beyond the platform namespaces at the top of the file. A census on
# 2026-09-18 found 16 of 75 containers in covered namespaces without both
# requests; those are reported, not excluded — an exclusion here would hide the
# exact population the control exists to shrink.
#
# AUDIT -> ENFORCE: only after every covered workload declares requests (start
# with the CronJobs and one-shot pods, which are the usual offenders, then the
# long-running ones), in the same commit as the namespace's other hardening
# flips.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-requests
  annotations:
    policies.kyverno.io/title: Require cpu and memory requests
    policies.kyverno.io/category: Reliability
    policies.kyverno.io/severity: medium
    # Exception register, Unit 6.2: expanded into docs/policy-exceptions.md.
    homelab.ngoldack.de/policy-exceptions: |
      - scope: platform-namespaces
        owner: platform
        reason: >-
          Platform planes are managed by their charts/operators (Cilium, CSI, device plugins,
          monitoring agents) whose requests are set by upstream, and Flux/Kyverno must write the
          policy objects themselves.
        review: "2027-03-18"
spec:
  validationFailureAction: Audit
  emitWarning: true
  background: true
  rules:
    - name: requests-present
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - cilium-secrets
                - flux-system
                - kyverno
                - monitoring
                - network
                - cert-manager
                - cnpg-system
                - clickhouse-operator
                - seaweedfs-operator
                - valkey-operator-system
                - truenas-csi
                - nvidia-device-plugin
                - buildkit
                - agent-sandbox-system
                - hermes-sandbox
                - media
                - tetragon
                - crowdsec
      validate:
        message: >-
          Every container must declare resources.requests.cpu and
          resources.requests.memory — an unsized pod is scheduled against headroom that is not
          actually free.
        foreach:
          # Two deny conditions (an `any`): either request missing is a violation.
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: >-
                      {{ (element.resources.requests.cpu != `null`
                      && element.resources.requests.memory != `null`) && 'pass' || 'fail' }}
                    operator: NotEquals
                    value: "pass"
          - list: "request.object.spec.initContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: >-
                      {{ (element.resources.requests.cpu != `null`
                      && element.resources.requests.memory != `null`) && 'pass' || 'fail' }}
                    operator: NotEquals
                    value: "pass"

---
# disallow-default-serviceaccount — Phase 6.1, control "no default ServiceAccount".
#
# WHY IT IS A GAP: PSA does not look at ServiceAccount identity at all, and
# neither did any policy here. security-baseline/default-service-accounts.yaml
# hardens the SYMPTOM (automountServiceAccountToken: false on the `default` SA of
# 27 namespaces, after an inventory showed not one binding in the cluster names a
# `default` subject) but every pod that omits serviceAccountName still RUNS as
# `default`. That is a latent identity problem, not a token problem: the day
# anything grants a role to `default` in one of those namespaces — or the
# namespace is not in that file's list, which has no floor for new namespaces —
# every such pod silently inherits it, and RBAC/audit evidence cannot tell them
# apart. A read-only census on 2026-09-18 found 19 of the 55 pods in covered
# namespaces running as `default`.
#
# EXEMPTION ALREADY MADE ELSEWHERE: the agent/sandbox plane (hermes,
# hermes-sandbox, agent-sandbox-system) is out of scope: those pods are denied a
# token at pod level by the secure-hermes-sandbox ValidatingAdmissionPolicy and
# are excluded below anyway. kube-system is excluded because its debug pods
# (hostNetwork+hostPID+privileged, hostPath /) are the one place a default token
# may legitimately be wanted (documented in the baseline file).
#
# NOT READ AS A VARIABLE: `request.object.spec.serviceAccountName` is the pod
# field. The bare `serviceAccountName` variable Kyverno pre-defines is the
# REQUESTER's account and, per the Kyverno docs, must not be used in rules with
# background scanning — this rule reads the field, so background: true is safe.
#
# AUDIT -> ENFORCE: give each workload a dedicated ServiceAccount (a two-line
# manifest per app dir) and then flip per namespace. Enforcing first would break
# every pod that omits the field, which is most of the 19.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-default-serviceaccount
  annotations:
    policies.kyverno.io/title: Disallow the default ServiceAccount
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: medium
    # Exception register, Unit 6.2: expanded into docs/policy-exceptions.md.
    homelab.ngoldack.de/policy-exceptions: |
      - scope: platform-namespaces
        owner: platform
        reason: >-
          Platform planes use the default ServiceAccount for kubelet-style duties and for cluster
          debug pods, and Flux/Kyverno must be able to write the policy objects themselves.
        review: "2027-03-18"
spec:
  validationFailureAction: Audit
  emitWarning: true
  background: true
  rules:
    - name: no-default-serviceaccount
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - cilium-secrets
                - flux-system
                - kyverno
                - monitoring
                - network
                - cert-manager
                - cnpg-system
                - clickhouse-operator
                - seaweedfs-operator
                - valkey-operator-system
                - truenas-csi
                - nvidia-device-plugin
                - buildkit
                - agent-sandbox-system
                - hermes-sandbox
                - media
                - tetragon
                - crowdsec
      validate:
        message: >-
          Pods must name a dedicated serviceAccountName: an omitted field runs the pod as the
          namespace's `default` ServiceAccount, which flattens RBAC and audit identity.
        deny:
          conditions:
            any:
              # `|| 'default'` is the API default made explicit: an absent field
              # IS the default account.
              - key: >-
                  {{ ((request.object.spec.serviceAccountName || 'default') != 'default')
                  && 'pass' || 'fail' }}
                operator: NotEquals
                value: "pass"

---
# restrict-image-registries — Phase 6.1, control "registry allowlist + digest".
#
# WHY IT IS A GAP: disallow-latest-tag above only demands *a* tag or digest, so
# any registry and any image name passes it, and nothing verifies that a
# first-party image is pinned by digest rather than a mutable tag. Unit 4.1 pins
# the directly-referenced images in Git (chart-internal images stay
# chart-managed), but pinning in Git is not an admission control: a hand-applied
# pod, a new app dir, or a re-tagged first-party image is invisible until someone
# re-reads the manifests. This policy is the admission half. Signature and
# provenance verification is a DIFFERENT control (cosign verifyImages, Phase 4.3)
# and is deliberately not duplicated here.
#
# SCOPE: cluster-wide — unlike the Pod-shape policies above there is no platform
# exemption, because supply chain applies to every namespace, and every image
# deployed on 2026-09-18 already satisfies the allowlist: a live census of all
# container images found exactly nine registries in use — docker.io, ghcr.io,
# quay.io, registry.k8s.io, registry.ngoldack.de, reg.kyverno.io, nvcr.io,
# cr.agentgateway.dev, docker.langfuse.com — plus Docker-Hub-implicit names
# (alpine, busybox, node, alpine/k8s). Adding a registry is therefore a
# deliberate edit of the allowlist below, which is the point: today it would be a
# silent default.
#
# HOW (both rules use JMESPath, not a deny-operator regex: Kyverno's deny
# operators are Equals/NotEquals/In/LessThan/… only — there is no Matches
# operator, which the policy webhook rejects at admission):
#   1. regex_match() against an alternation that passes an allowlisted registry,
#      a bare Docker Hub name (`busybox:1.36`, no slash at all), or a Hub-implicit
#      `name/path` reference whose first segment carries neither a dot (hostname)
#      nor a colon (host:port) — the same rule Docker itself applies to decide
#      whether a reference names a registry;
#   2. a first-party image (registry.ngoldack.de/…) must carry @sha256:<64 hex>.
#      `!regex_match(...)` on the prefix replaces a negative lookahead, which Go's
#      RE2 engine (used by Kyverno) does not support.
#
# AUDIT -> ENFORCE: rule 1 is enforceable once a fresh report is clean (it already
# is); rule 2 waited on Unit 4.1's digest pass, which has since landed — the
# llmkube-models manifests now pin
# registry.ngoldack.de/llama-p100@sha256:f5839c86e75d832fa538bd8b59715a8ea64dd20d356e2d1e9485b43d3a26aa6d
# (commit 4ac06c9). The only tag-pinned first-party references still visible are
# the two llmkube-system pods running the pre-change ReplicaSets, which the next
# Flux reconcile replaces; enforce rule 2 once an audit report taken AFTER that
# reconcile is clean.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Allowlist image registries and pin our own images by digest
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: high
    # No exception register entry: this policy has no excludes, by design (see the
    # header). The tag-pinned first-party image it reports is a finding, not an
    # accepted exception — it is listed under "known findings" in
    # docs/policy-exceptions.md.
spec:
  validationFailureAction: Audit
  emitWarning: true
  background: true
  rules:
    - name: registry-allowlist
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: >-
          Image must come from an allowlisted registry. Add the registry to this policy's allowlist
          deliberately (and record why) instead of pulling from a new one.
        # Five anchored alternatives, ORed across folded lines (a folded scalar
        # joins with spaces, so one long regex cannot be split): the three
        # allowlisted registry groups, a bare Docker Hub name (`busybox:1.36` —
        # no slash at all), and a Hub-implicit `name/path` reference whose first
        # segment carries neither a dot (hostname) nor a colon (host:port).
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: >-
                      {{ (regex_match('^(registry\.ngoldack\.de|docker\.io|ghcr\.io|quay\.io)/.*$', element.image)
                      || regex_match('^(registry\.k8s\.io|reg\.kyverno\.io|nvcr\.io)/.*$', element.image)
                      || regex_match('^(cr\.agentgateway\.dev|docker\.langfuse\.com)/.*$', element.image)
                      || regex_match('^[^/]+$', element.image)
                      || regex_match('^[^/.:]+/.*$', element.image)) && 'pass' || 'fail' }}
                    operator: NotEquals
                    value: "pass"
          - list: "request.object.spec.initContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: >-
                      {{ (regex_match('^(registry\.ngoldack\.de|docker\.io|ghcr\.io|quay\.io)/.*$', element.image)
                      || regex_match('^(registry\.k8s\.io|reg\.kyverno\.io|nvcr\.io)/.*$', element.image)
                      || regex_match('^(cr\.agentgateway\.dev|docker\.langfuse\.com)/.*$', element.image)
                      || regex_match('^[^/]+$', element.image)
                      || regex_match('^[^/.:]+/.*$', element.image)) && 'pass' || 'fail' }}
                    operator: NotEquals
                    value: "pass"
          # Ephemeral containers are how `kubectl debug` injects a tool image into
          # a running pod — the likeliest bypass of a registry allowlist.
          - list: "request.object.spec.ephemeralContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: >-
                      {{ (regex_match('^(registry\.ngoldack\.de|docker\.io|ghcr\.io|quay\.io)/.*$', element.image)
                      || regex_match('^(registry\.k8s\.io|reg\.kyverno\.io|nvcr\.io)/.*$', element.image)
                      || regex_match('^(cr\.agentgateway\.dev|docker\.langfuse\.com)/.*$', element.image)
                      || regex_match('^[^/]+$', element.image)
                      || regex_match('^[^/.:]+/.*$', element.image)) && 'pass' || 'fail' }}
                    operator: NotEquals
                    value: "pass"
    - name: first-party-digest-pin
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: >-
          Images built by this repo (registry.ngoldack.de/…) must be pinned by digest
          (image@sha256:<64 hex>), not by a mutable tag.
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: >-
                      {{ (!regex_match('^registry\.ngoldack\.de/.*$', element.image)
                      || regex_match('^registry\.ngoldack\.de/[^@]+@sha256:[a-f0-9]{64}$', element.image))
                      && 'pass' || 'fail' }}
                    operator: NotEquals
                    value: "pass"
          - list: "request.object.spec.initContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: >-
                      {{ (!regex_match('^registry\.ngoldack\.de/.*$', element.image)
                      || regex_match('^registry\.ngoldack\.de/[^@]+@sha256:[a-f0-9]{64}$', element.image))
                      && 'pass' || 'fail' }}
                    operator: NotEquals
                    value: "pass"
          - list: "request.object.spec.ephemeralContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: >-
                      {{ (!regex_match('^registry\.ngoldack\.de/.*$', element.image)
                      || regex_match('^registry\.ngoldack\.de/[^@]+@sha256:[a-f0-9]{64}$', element.image))
                      && 'pass' || 'fail' }}
                    operator: NotEquals
                    value: "pass"

---
# require-cilium-default-deny-floor — Phase 6.1, control "NetworkPolicy requirement".
#
# WHY IT IS A GAP: the zero-trust floor in this cluster is a per-namespace Cilium
# pair (`<namespace>-default-deny` + `<namespace>-allowlist`, in each app dir),
# not a Kubernetes NetworkPolicy — a census on 2026-09-18 found zero
# networking.k8s.io/v1 NetworkPolicy objects in any covered namespace. And the
# floor has no admission control behind it: security-baseline/kustomization.yaml
# records both that a cluster-wide CCNP was trialled and rolled back (it denied
# every Gateway route) and that therefore "a NEW namespace starts open and must
# ship its own policy pair — there is no automatic floor". This policy is that
# missing floor check: every pod admitted into a covered namespace must land in a
# namespace that already carries the default-deny half of the pair. A Cilium
# default-deny is what makes a missing per-workload allowlist a CLOSED door
# instead of an open one, so its absence is the finding that matters — the
# allowlists themselves are policy content, not a Pod-shape property.
#
# HOW: a namespace-scoped API lookup for CiliumNetworkPolicies whose name
# contains '-default-deny' (the naming convention every app dir follows; a
# census found the pair present in all 13 Flux-managed workload namespaces). The
# count is compared with LessThan 1, so "namespace has no CiliumNetworkPolicy at
# all" and "namespace has allowlists but no floor" are the same violation.
#
# RBAC: Kyverno's shipped roles do NOT include cilium.io — verified read-only
# with `kubectl auth can-i list ciliumnetworkpolicies --as=...` returning no —
# so this policy ships with rbac-cilium-netpol-read.yaml beside it. Without that
# grant the lookup fails and every admission is reported as a policy error, which
# is why the grant is part of this change and not a follow-up.
#
# background: false, deliberately: the rule resolves a live lookup for the
# namespace of the object being ADMITTED (admission-time data). Keeping it out of
# the background scan also keeps the semantics simple — this control exists to
# catch pods landing in a namespace that starts open, and it reports nothing for
# existing pods (background scans without an admission request are not the place
# to resolve request.namespace).
#
# KNOWN NON-FLUX HOLES (reported, not excluded): the scratch namespaces `default`
# and `reach-test` have no floor (`default` holds a single non-Flux
# `fqdn-probe` CiliumNetworkPolicy, which is not the default-deny half;
# `reach-test` has none). Neither carries Flux-managed workloads, but short-lived
# probe pods do appear in them (a read-only `kyverno apply --cluster` run on
# 2026-09-18 over 457 live resources reported exactly these two and nothing else)
# — so they are left reported rather than excluded, which makes each probe pod
# visible while it exists. `aigateway` is a retired lane with zero resources.
#
# AUDIT -> ENFORCE: once a fresh report is clean for the covered namespaces,
# enforce. The excluded system namespaces stay excluded (Cilium itself, and the
# platform planes, own their policies).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-cilium-default-deny-floor
  annotations:
    policies.kyverno.io/title: Require a Cilium default-deny floor per namespace
    policies.kyverno.io/category: Network
    policies.kyverno.io/severity: high
    # Exception register, Unit 6.2: expanded into docs/policy-exceptions.md.
    homelab.ngoldack.de/policy-exceptions: |
      - scope: platform-namespaces
        owner: platform
        reason: >-
          System and platform namespaces are policed by Cilium/the platform charts themselves (and
          several have no workloads), while Flux/Kyverno must write the policy objects.
        review: "2027-03-18"
spec:
  validationFailureAction: Audit
  emitWarning: true
  # The rule needs the admitted object's namespace for its API lookup; see header.
  background: false
  rules:
    - name: cilium-default-deny-present
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - cilium-secrets
                - flux-system
                - kyverno
                - monitoring
                - network
                - cert-manager
                - cnpg-system
                - clickhouse-operator
                - seaweedfs-operator
                - valkey-operator-system
                - truenas-csi
                - nvidia-device-plugin
                - buildkit
                - agent-sandbox-system
                - hermes-sandbox
                - media
                - tetragon
                - crowdsec
      context:
        - name: defaultDenies
          apiCall:
            urlPath: "/apis/cilium.io/v2/namespaces/{{request.namespace}}/ciliumnetworkpolicies"
            jmesPath: "items[?contains(metadata.name, '-default-deny')] | length(@)"
      validate:
        message: >-
          Namespace {{request.namespace}} has no CiliumNetworkPolicy whose name contains
          '-default-deny'. Per-namespace allowlists only narrow traffic that a default-deny floor
          already blocks; without the floor the namespace is open.
        # The count compare is numeric (LessThan 1) — numbers, unlike booleans,
        # do compare against a literal value in a condition key (same reason the
        # other policies here render a 'pass' token instead).

        deny:
          conditions:
            any:
              - key: "{{ defaultDenies }}"
                operator: LessThan
                value: 1
