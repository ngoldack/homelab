name: OpenTofu Destroy

# DANGER: tears down managed infrastructure. Manual dispatch ONLY, gated behind
# the protected "production" GitHub Environment, and requires the operator to
# type the exact confirmation string below to proceed.
#
# Network connectivity to the private cluster is established by the NetBird
# step BELOW, before the Dagger call - the Dagger module itself is network
# agnostic. The confirmation string is enforced both here and inside the
# Dagger function. Locally (with your mesh already connected) this is:
#   dagger call tofu-destroy --confirm=destroy-production \
#     --sops-age-key=env://SOPS_AGE_KEY

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy-production" to confirm'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tofu-state
  cancel-in-progress: false

jobs:
  destroy:
    name: OpenTofu Destroy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate Confirmation Input
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "destroy-production" ]; then
            echo "::error::Confirmation string did not match. Aborting."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Cache Dagger engine image
        uses: ./.github/actions/dagger-engine-cache

      - name: Connect to NetBird mesh
        env:
          NB_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          set -euo pipefail
          curl -fsSL https://pkgs.netbird.io/install.sh | sh
          sudo netbird up --setup-key "$NB_SETUP_KEY"
          sudo netbird status

      - name: OpenTofu Destroy (Dagger)
        uses: dagger/dagger-for-github@v8.3.0
        with:
          verb: call
          args: >-
            tofu-destroy
            --confirm=destroy-production
            --sops-age-key=env://SOPS_AGE_KEY
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
