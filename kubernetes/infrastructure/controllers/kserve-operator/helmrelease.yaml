apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve-crd
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: kserve
  # As of v0.15+, KServe publishes its Helm charts as OCI artifacts and splits
  # CRDs (kserve-crd) from the controller/resources (kserve-resources).
  chart:
    spec:
      chart: kserve-crd
      version: "v0.18.0"
      sourceRef:
        kind: HelmRepository
        name: kserve
      interval: 1h
  install:
    createNamespace: true
  upgrade:
    crds: CreateReplace
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve-resources
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: kserve
  dependsOn:
    - name: cert-manager
      namespace: flux-system
    - name: kserve-crd
      namespace: flux-system
  chart:
    spec:
      chart: kserve-resources
      version: "v0.18.0"
      sourceRef:
        kind: HelmRepository
        name: kserve
      interval: 1h
  install:
    createNamespace: true
  values:
    kserve:
      controller:
        # Raw deployment mode (Standard is the canonical value; RawDeployment
        # remains accepted as a legacy alias).
        deploymentMode: "RawDeployment"
