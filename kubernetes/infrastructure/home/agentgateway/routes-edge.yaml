# Routes for the EDGE data plane (agentgateway-edge): mirror of routes.yaml
# (local-llm) parented to the agentgateway-edge Gateway so the edge proxy
# applies the same /v1/* rules as the home proxy. Parented per-Gateway:
# agentgateway v1.5.0 scopes each proxy's config to its Gateway, so the
# route resources are duplicated rather than multi-parented.
#
# KEEP IN SYNC with routes.yaml — same rule set, same ordering (first-match
# wins: exact /v1/chat/completions + /v1/models BEFORE the /v1/chat prefix).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: local-llm-edge
  namespace: agentgateway
spec:
  parentRefs:
    - name: agentgateway-edge
      namespace: agentgateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: local-p100
    - matches:
        - path:
            type: PathPrefix
            value: /v1/models
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: local-p100
    - matches:
        - path:
            type: PathPrefix
            value: /v1/synthetic-small
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: synthetic-small
    - matches:
        - path:
            type: PathPrefix
            value: /v1/synthetic-large
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: synthetic-large
    - matches:
        - path:
            type: PathPrefix
            value: /v1/synthetic-deepseek
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: synthetic-hf-deepseek
    - matches:
        - path:
            type: PathPrefix
            value: /v1/synthetic-gpt-oss
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: synthetic-hf-openai-gpt-oss-120b
    # OpenAI-compatible path for browser-side AI assistants (Headlamp's AI
    # plugin normalizes its baseUrl to end in /v1 and appends
    # /chat/completions, so this is the exact path such a client emits).
    # JWT-authenticated (the gateway's Strict JWT policy); NOT under /v1/key/*
    # (apiKeyAuthentication Strict on X-Api-Key would reject a JWT-only
    # request). Targets the general-purpose chain: one Synthetic group, so a
    # Synthetic rate-limit surfaces as the proxy's 503 rather than a failover.
    - matches:
        - path:
            type: PathPrefix
            value: /assistant/v1/chat/completions
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: general-purpose-chain
    # Agent chains (R4): same as routes.yaml — KEEP IN SYNC. JWT-authenticated
    # aliases for the 4 agent chains (general-purpose/coding-{small,medium,
    # large}); each walks its own chain backend, now a single Synthetic group,
    # with a 5xx from the proxy evicting that provider for 5m.
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chain/general-purpose
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: general-purpose-chain
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chain/coding-small
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: coding-small-chain
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chain/coding-medium
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: coding-medium-chain
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chain/coding-large
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: coding-large-chain
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: chat-chain
