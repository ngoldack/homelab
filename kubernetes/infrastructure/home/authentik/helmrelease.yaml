# Authentik — identity provider + edge authorizer. SERVER and WORKER live at
# home (they need Postgres/Valkey, which live here); the public-facing slice is
# the separate outpost Deployment (outpost.yaml), not this release.
#
# Config is 100% in secret.sops.yaml via authentik.existingSecret — the chart's
# typed values block is ignored wholesale when that is set, which is deliberate:
# one sops file holds every AUTHENTIK_* knob, matching how this repo treats
# tofu/home/secret.sops.yaml.
#
# First boot runs django migrations against CNPG — can exceed 10 minutes with a
# cold 5Gi initdb; hence wait:false on the owning Flux Kustomization and a
# generous HelmRelease timeout.
#
# The blueprint ConfigMap (seed.yaml) is mounted at /blueprints/ — authentik
# imports and applies anything there at startup, idempotently. That is the
# declarative seeding path: proxy provider + application + outpost record +
# service-account token, no manual UI clicks, no API scripting.
#
# Pin: 2026.8.2 (current stable line; 2026.8.0/8.2 had known outpost bugs
# #25485/#26014 — watch, this is the version the research was done against).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 1h
  timeout: 20m
  chart:
    spec:
      chart: authentik
      version: "2026.8.2"
      sourceRef:
        kind: HelmRepository
        name: authentik
      interval: 2h
  targetNamespace: authentik
  releaseName: authentik
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    authentik:
      existingSecret:
        secretName: authentik-config
    # global.*, not server.*: the chart exposes volumes/volumeMounts only at
    # the global level (verified against the 2026.8.2 values structure) —
    # these land on server AND worker; blueprint import is a server-side
    # startup action, the duplicate worker mount is inert.
    # Chart-native blueprint import (replaces hand-mounting /blueprints —
    # the entrypoint discovery only keys off *.yaml files mounted by this
    # block, and doing it by hand silently shipped nothing the first time).
    blueprints:
      configMaps:
        - authentik-blueprints
    global:
      volumes:
        # The seed blueprint reads the Grafana OIDC client secret via !File.
        # It MUST NOT land under /blueprints: authentik walks that tree for
        # *.yml and would try to parse the secret as a blueprint.
        - name: seed-secrets
          secret:
            secretName: authentik-oidc-grafana
      volumeMounts:
        - name: seed-secrets
          mountPath: /secrets
          readOnly: true
    server:
      # 2 replicas, NOT site-pinned, tolerating the ingress taint: the edge
      # Gateway's envoy is the host-netns cilium-envoy DaemonSet, and
      # host-origin traffic from the Hetzner node cannot reach LAN pod IPs
      # (the edge portal 503, while the outpost→server path in a pod netns
      # worked). With one replica landing on the ingress node, the edge
      # listener's upstream is LOCAL and the cross-site hop moves into pod
      # networking where KubeSpan serves it fine. The scheduler cannot put
      # them both on one home node without more capacity pressure than exists
      # (two untainted home nodes vs cp taint + gpu taint), and
      # topologySpread below makes home/home illegal anyway.
      replicas: 2
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
              app.kubernetes.io/component: server
      tolerations:
        - key: dedicated
          operator: Equal
          value: ingress
          effect: NoSchedule
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 1536Mi
    worker:
      replicas: 1
      nodeSelector:
        topology.homelab/site: home
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
