# hermes — the Hermes gateway. Applies only after the sandbox stack
# (controller/router) and the warm pool namespace are healthy; the gateway
# needs both to run its first command.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/infrastructure/home/hermes
  prune: true
  wait: true
  timeout: 20m
  retryInterval: 2m
  dependsOn:
    - name: hermes-sandbox
    - name: agent-sandbox
    - name: network
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
