apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Minimal controller set for the cloud cluster (single Hetzner VPS): Cilium
# (id 2, mesh) + the shared Gateway API CRDs. The cloud cluster is the public
# ingress edge - it routes external traffic to homelab global Services over the
# mesh, and runs no heavy workloads.
resources:
  - sources.yaml
  - cilium.yaml
  - ../controllers/gateway-api
