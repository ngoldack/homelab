# Makes a home node answer ARP for the VIPs allocated above, so the address is
# actually reachable on the LAN rather than merely assigned.
#
# Restricted to the home site on purpose. The Hetzner ingress node is on a
# different L2 segment entirely — it could never answer ARP for a 10.30.0.0/24
# address, and letting it try would just add a node that loses every election
# it enters.
#
# Leadership is per-service and backed by a Kubernetes Lease, so the VIP fails
# over to another home node when the current holder reboots. That is the main
# thing this buys over pinning a service to one node's IP.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan
spec:
  # Only Services labelled as the internal scope — the edge Gateway's Service
  # carries scope=public and its LB IP (the Hetzner primary) must never be
  # ARP-answered on ens18. Without this selector the policy announces ALL
  # LoadBalancer IPs of ALL Services, which since edge.yaml exists would
  # include that public address on the LAN segment.
  #
  # Naming, learned live: Cilium 1.20's CRD schema is SINGULAR
  # serviceSelector — the plural used by 1.19-era docs is rejected
  # ("field not declared") and failed the whole network Kustomization
  # dry-run after the 1.20 CRD auto-upgrade.
  serviceSelector:
    matchLabels:
      dns.ngoldack.de/scope: internal
  nodeSelector:
    matchLabels:
      topology.homelab/site: home
  # ens18 is the LAN interface on every Proxmox-hosted node (verified with
  # `talosctl get addresses` — 10.30.0.x/24 sits on ens18). Announcing on the
  # wrong interface fails silently: the Service still shows an assigned IP and
  # nothing answers ARP for it.
  interfaces:
    - ens18
  loadBalancerIPs: true
