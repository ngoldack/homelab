# PXA-specialized models for the qwen36-35b canary A/B (2026-09-20).
#
# Both are PXA-engine-only formats (PXQ codecs: custom dequant/matmul kernels in the
# pxa engine) — they do NOT run on stock llama.cpp / llama-p100. Arch is qwen35moe
# (same hybrid-attention family as production qwen36-35b), so the KV slot-restore
# findings apply. `format: gguf` matches the file extension; the pxa engine parses
# the PXQ bytes at serve time, the operator only caches the byte blobs.
#
# NOTE: pxa-coder-35b is a ~17.7 GiB PXQ4 file — `layers: -1` WILL oversubscribe the
# 16 GiB card at load. The Step-5 boot ladder reduces hardware.gpu.layers
# (-1 -> 30 -> 20) until it loads; the KV-restore test stays valid (attention/KV on
# GPU). pxa-fusion4-35b uses the PXQ2 tier (10.5 GiB) — the card's documented
# "one 16 GB card (P100/V100/T4)" tier; the PXQ4 tier does not fit.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: pxa-fusion4-35b
  namespace: llmkube-system
spec:
  source: https://huggingface.co/poisonxa/PXA-Fusion4-35B-GGUF/resolve/main/PXA-Fusion4-35B-PXQ2.gguf
  format: gguf
  quantization: PXQ2
  prefetch: true
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      count: 1
      vendor: nvidia
      memory: "16Gi"
      layers: -1
  resources:
    cpu: "4"
    memory: "8Gi"
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: pxa-coder-35b
  namespace: llmkube-system
spec:
  source: https://huggingface.co/poisonxa/PXA-Coder-35B-PXQ4/resolve/main/PXA-Coder-35B-v2-PXQ4.gguf
  format: gguf
  quantization: PXQ4
  prefetch: true
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      count: 1
      vendor: nvidia
      memory: "16Gi"
      layers: -1
  resources:
    cpu: "4"
    memory: "8Gi"
