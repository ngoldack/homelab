# The edge outpost: authentik's proxy component, pinned to the Hetzner node.
# This is the only authentik-movement process that runs on the public side —
# it answers ext-auth decisions and (in a later step) may front routes itself.
#
# Manual lifecycle, deliberately: the Outpost record created by the seed
# blueprint is managed=null, so authentik's embedded k8s controller will never
# touch this Deployment (it only manages resources it created with its own
# ownerRefs). That ends the classic GitOps-vs-authentik ownership collision.
#
# Image ghcr.io/goauthentik/proxy is the current Rust proxy outpost (the old
# transparent-Envoy python image is gone as of 2025.x); multi-arch, arm64
# confirmed — this node is cax11.
#
# Env: AUTHENTIK_TOKEN authenticates it to the server API over the KubeSpan
# mesh (the value is the initial_token pinned in seed.yaml); it pulls its
# provider bindings from the server, so adding apps later means changing the
# blueprint, not this Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-proxy
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-proxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-proxy
    spec:
      nodeSelector:
        topology.homelab/site: cloud
      tolerations:
        - key: dedicated
          value: ingress
          effect: NoSchedule
      containers:
        - name: proxy
          # ghcr.io/goauthentik/proxy — the current Rust proxy outpost
          # (multi-arch, arm64 confirmed; the old transparent-Envoy python
          # image is gone). The launcher authenticates with AUTHENTIK_TOKEN
          # — the token of the Outpost's own service user, minted lazily
          # server-side and republished into authentik-outpost-live by the
          # outpost-token CronJob (see outpost-token.yaml). Until that Secret
          # exists this pod sits in CreateContainerConfigError; the CronJob
          # converges within 15m, or run it by hand.
          image: ghcr.io/goauthentik/proxy:2026.8.2
          envFrom:
            # Static half (AUTHENTIK_HOST / HOST_BROWSER / INSECURE) is a
            # ConfigMap; only the token is secret material, and the cluster
            # generates it.
            - configMapRef:
                name: authentik-outpost-config
            - secretRef:
                name: authentik-outpost-live
          ports:
            - name: proxy
              containerPort: 9000
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-proxy
  namespace: authentik
spec:
  selector:
    app.kubernetes.io/name: authentik-proxy
  ports:
    - name: proxy
      port: 9000
      targetPort: proxy
