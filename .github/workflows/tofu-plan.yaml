name: OpenTofu Plan

# Live planning against private Proxmox/Talos infrastructure.
# Requires NetBird VPN, the SOPS age key, and the state-encryption passphrase,
# so it deliberately does NOT run on pull requests from forks. It runs on:
#   - pushes to main that touch tofu/**
#   - manual dispatch
# Plan is read-only: it never mutates infrastructure.
#
# All logic lives in the Dagger module (.dagger). Locally this is:
#   dagger call tofu-plan \
#     --sops-age-key=env://SOPS_AGE_KEY \
#     --netbird-setup-key=env://NETBIRD_SETUP_KEY

on:
  push:
    branches:
      - main
    paths:
      - 'tofu/**'
      - '.dagger/**'
      - '.github/workflows/tofu-plan.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tofu-state
  cancel-in-progress: false

jobs:
  plan:
    name: OpenTofu Plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: OpenTofu Plan (Dagger)
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "0.21.4"
          verb: call
          args: >-
            tofu-plan
            --sops-age-key=env://SOPS_AGE_KEY
            --netbird-setup-key=env://NETBIRD_SETUP_KEY
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
