# Publishes the edge outpost's API token to the cluster.
#
# Why a CronJob: the 2026.x outpost model self-manages its service user +
# token server-side — Outpost.token is a get-or-create keyed on the row's
# uuid, so no blueprint/git file can pre-declare the value, and no public
# API returns the raw key. The ORM inside the server image is the only
# supported door. `ak manage shell` connects straight to Postgres/redis via
# the same authentik-config secret the server uses (no HTTP dependency on
# the server pod being up).
#
# Idempotent: re-running reads the same key and rewrites the Secret; if the
# token is ever rotated in the UI, the next run republishes it. Cron every
# 15m keeps convergence fast after any authentik change; cost is one short
# python run against the local DB.
#
# RBAC is namespaced: get/create/update of the single
# authentik-outpost-live secret, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: outpost-token
  namespace: authentik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: outpost-token
  namespace: authentik
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # Per-outpost secrets (authentik-outpost-live, authentik-outpost-live-*)
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: outpost-token
  namespace: authentik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: outpost-token
subjects:
  - kind: ServiceAccount
    name: outpost-token
    namespace: authentik
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: outpost-token
  namespace: authentik
spec:
  schedule: "*/15 * * * *"
  # keep exactly one job's pods of history; the token only changes on
  # rotation, every run after the first is a no-op rewrite
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        metadata:
          labels:
            app.kubernetes.io/name: outpost-token
        spec:
          serviceAccountName: outpost-token
          restartPolicy: Never
          nodeSelector:
            topology.homelab/site: home
          containers:
            - name: publish
              image: ghcr.io/goauthentik/server:2026.8.2
              # envFrom is a CONTAINER field; under spec it is silently
              # pruned by apply and the job runs unconfigured (observed:
              # "Secret key missing" then a clean-looking exit).
              envFrom:
                - secretRef:
                    name: authentik-config
              command: ["/lifecycle/ak"]
              # /lifecycle/ak *is* manage.py — "ak manage shell" is a doubled
              # subcommand (observed: Unknown command 'manage').
              args:
                - shell
                - -c
                - |
                  from authentik.outposts.models import Outpost
                  from kubernetes import client, config
                  config.load_incluster_config()
                  api = client.CoreV1Api()
                  for o in Outpost.objects.all():
                      # "authentik Embedded Outpost" is the in-process manager,
                      # not a deployable component: it has no service token.
                      if o.token is None or o.name == "authentik Embedded Outpost":
                          print(f"skip {o.name}: no outpost token")
                          continue
                      key = o.token.key
                      # edge-outpost keeps the historic secret name so the
                      # existing proxy Deployment keeps working; every other
                      # outpost publishes to authentik-outpost-live-<name>.
                      secret_name = "authentik-outpost-live" if o.name == "edge-outpost" \
                          else f"authentik-outpost-live-{o.name}"
                      body = client.V1Secret(
                          metadata=client.V1ObjectMeta(name=secret_name),
                          string_data={"AUTHENTIK_TOKEN": key},
                          type="Opaque",
                      )
                      try:
                          api.patch_namespaced_secret(secret_name, "authentik", body)
                      except client.exceptions.ApiException as e:
                          if e.status == 404:
                              api.create_namespaced_secret("authentik", body)
                          else:
                              raise
                      print(f"published {secret_name} for {o.name}")
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
