# Applies the node taint Talos itself can never self-apply (see rbac.yaml's
# comment: Kubernetes' NodeRestriction admission plugin forbids a node from
# setting its own taints, confirmed on every node this repo has ever tainted,
# brand-new ones included). This is the one thing in this repo that runs
# `kubectl` directly rather than going through tofu or a native Kubernetes
# resource — because nothing else CAN set a taint here. Expressing it as a
# Flux-managed Job keeps it fully reproducible: no operator ever runs this by
# hand, Flux applies it as part of a normal reconcile.
#
# Selects nodes by label, not by name: Talos assigns each node a random
# generated hostname at install time (there is no stable node name to hard-
# code), but node.kubernetes.io/instance-type is deterministic — set by tofu
# from each node's own declared role (see tofu/home/terraform.tfvars).
#
# The nvidia container is REMOVED (2026-09-15): the P100/gpu-worker became
# the only schedulable home node with spare CPU once the general worker (
# talos-3bi) saturated at ~97% cpu requests, so hindsight and other general
# pods need to spill onto it until home-pool headroom returns. The
# dedicated=nvidia taint it carried was deleted live (see flux reconcile +
# kubectl taint delete) so general workloads can schedule; it can be
# re-added by restoring this container when the gpu pool is no longer the
# spill-over. Only the sandbox taint remains applied.
#
# Idempotent (--overwrite) and safe to re-run: a Job only actually executes
# once per unique name. Bumped to -6 (Job specs are immutable; the rename is
# what makes Flux recreate it; prune removes the -5 predecessor).
apiVersion: batch/v1
kind: Job
metadata:
  name: node-taints-6
  namespace: kube-system
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: node-taints
      restartPolicy: OnFailure
      # rancher/kubectl is a distroless-style image (no /bin/sh), so this
      # runs kubectl directly as the container's entrypoint — no shell
      # dependency anywhere.
      containers:
        - name: taint-sandbox
          image: rancher/kubectl:v1.36.2
          command: ["kubectl"]
          args:
            - taint
            - nodes
            - -l
            - node.kubernetes.io/instance-type=sandbox-worker
            - workload.hermes.io/sandbox=true:NoSchedule
            - --overwrite
