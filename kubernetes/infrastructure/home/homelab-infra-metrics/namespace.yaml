# unpoller runs here. Deliberately its own namespace rather than piggybacking
# on 'monitoring': it is a forwarder pulling from the UDM Pro, not part of the
# monitoring stack, and keeping it isolated means the monitoring HelmRelease
# (owned by a different lane) never has to know about it.
apiVersion: v1
kind: Namespace
metadata:
  name: unpoller
  labels:
    # Pod Security Admission: audit+warn at `restricted`, enforcement left to
    # Talos' cluster default (`baseline`). Restricted-level drift becomes
    # visible in the API audit log, in kubectl warnings and in Kyverno's
    # PolicyReports without being able to reject a pod; the flip to
    # `enforce: restricted` is a per-namespace decision once those reports are
    # clean.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
