# A dedicated namespace rather than kube-system, purely for least privilege.
# machine.features.kubernetesTalosAPIAccess.allowedKubernetesNamespaces in
# tofu/home/talos.tf names the namespaces whose pods may mint Talos API
# credentials by creating a ServiceAccount CR. Pointing that at kube-system
# would let anything already running there mint an etcd-backup credential;
# pointing it at a namespace that contains only this CronJob does not.
apiVersion: v1
kind: Namespace
metadata:
  name: talos-backup
  labels:
    # Pod Security Admission: audit+warn at `restricted`, enforcement left to
    # Talos' cluster default (`baseline`). Reported-only on purpose: a live
    # check on 2026-09-17 found almost every workload in these namespaces
    # violating `restricted` (runAsNonRoot, seccompProfile, capabilities.drop,
    # allowPrivilegeEscalation) and Kyverno's four audit policies do not cover
    # those fields — so `enforce: restricted` needs those securityContexts added
    # workload by workload first; clean policy reports alone are not the gate.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
