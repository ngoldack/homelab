# KeeperCluster for langfuse's ClickHouse: the coordinator KeeperNode that the
# ClickHouseCluster's keeperClusterRef points at (the operator runs Keeper via
# this separate CR; ClickHouse itself needs a Keeper coordinator). Single
# replica, small footprint, home node.
apiVersion: clickhouse.com/v1alpha1
kind: KeeperCluster
metadata:
  name: langfuse
  namespace: langfuse
spec:
  replicas: 1
  containerTemplate:
    image:
      repository: clickhouse/clickhouse-keeper
      # Aligned with the ClickHouse server tag (clickhouse.yaml) — the chart
      # pairs keeper "26.4" with server "26.4".
      tag: "26.4"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  podTemplate:
    nodeSelector:
      topology.homelab/site: home
  dataVolumeClaimSpec:
    resources:
      requests:
        storage: 1Gi
    storageClassName: truenas-fast-nfs
