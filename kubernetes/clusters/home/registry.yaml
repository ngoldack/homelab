# Zot, the cluster's own OCI registry.
#
# dependsOn network, not just infra-controllers: the chart renders an HTTPRoute
# attaching to the Gateway in ../../infrastructure/home/network/, and that
# Kustomization is also what owns the Gateway API objects and the wildcard
# certificate the route's hostname relies on. It needs truenas-csi's
# StorageClasses too, which come from infra-controllers.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: registry
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/infrastructure/home/registry
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: infra-controllers
    - name: network
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
