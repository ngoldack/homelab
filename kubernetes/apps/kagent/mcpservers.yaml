# MCP servers registered with the kagent control plane: Mem0 (long-term memory)
# and n8n (external integrations / tools). VERIFY the McpServer apiVersion and
# the upstream MCP endpoint paths (mem0 + n8n) against the installed CRDs.
apiVersion: kagent.dev/v1alpha1
kind: McpServer
metadata:
  name: mem0-memory-server
  namespace: kagent
spec:
  url: "http://mem0.mem0.svc.cluster.local:8080/mcp"
---
apiVersion: kagent.dev/v1alpha1
kind: McpServer
metadata:
  name: n8n-tools
  namespace: kagent
spec:
  url: "http://n8n.n8n.svc.cluster.local:5678/mcp"
