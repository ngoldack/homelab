name: OpenTofu Deploy & GitOps Loop

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'OpenTofu Action to Perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  pull-requests: write

jobs:
  run-pipeline:
    name: Run Network Connectivity & Provisioning Loop
    # Utilizes environmental variables and native runners
    runs-on: ubuntu-latest
    environment: production  # Requires manual approval if production environment gating is configured

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Connect to the private Proxmox and Kubernetes clusters via NetBird
      - name: Connect to NetBird VPN Mesh
        uses: Alemiz112/netbird-connect@v1
        with:
          # Uses SOPS or GitHub Secret mapping matching public anchors
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}

      # Setup secure Age decryption keys for OpenTofu state decryption
      - name: Setup Decryption Keys
        run: |
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.7.2

      - name: OpenTofu Init
        run: |
          export SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt
          export TOFU_ENCRYPTION_PASSPHRASE_statekey=$(sops -d secret.sops.yaml | yq .state_encryption_passphrase)
          tofu init
        working-directory: tofu

      - name: OpenTofu Plan
        if: |
          github.event_name == 'push' ||
          github.event_name == 'pull_request' ||
          github.event.inputs.action == 'plan'
        run: |
          export SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt
          export TOFU_ENCRYPTION_PASSPHRASE_statekey=$(sops -d secret.sops.yaml | yq .state_encryption_passphrase)
          tofu plan -no-color
        working-directory: tofu

      # Manual/Human-in-the-loop Approval logic check or runs target block
      - name: OpenTofu Apply
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          export SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt
          export TOFU_ENCRYPTION_PASSPHRASE_statekey=$(sops -d secret.sops.yaml | yq .state_encryption_passphrase)
          tofu apply -auto-approve -no-color
        working-directory: tofu

      - name: OpenTofu Destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: |
          export SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt
          export TOFU_ENCRYPTION_PASSPHRASE_statekey=$(sops -d secret.sops.yaml | yq .state_encryption_passphrase)
          tofu destroy -auto-approve -no-color
        working-directory: tofu

      # Sync and force Flux to immediately reconcile changes over secure NetBird tunnel
      - name: Set up Kubeconfig & Flux Reconcile
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" > ~/.kube/config
          echo "Setting up Flux CLI..."
          curl -s https://fluxcd.io/install.sh | sudo bash
          echo "Triggering Flux GitOps source reconciliation over NetBird VPN..."
          flux reconcile source git flux-system
          echo "Triggering Cluster synchronization..."
          flux reconcile kustomization infrastructure
          flux reconcile kustomization apps
