# Public-ingress probe. The cluster's only public entry point is the Cilium
# Gateway on the Hetzner edge node; this object is the synthetic (black-box)
# user that asks "is https://<public host>/ answering" from inside the
# cluster every 30s, so an outage is detected without a human noticing.
#
# Targets, both fronted by the same Gateway:
#   https://grafana.ngoldack.de/    — the user-facing dashboard UI (SSO via
#     authentik; verified reachable from outside the cluster: 302 to the
#     authentik login).
#   https://authentik.ngoldack.de/  — the identity provider every edge
#     route's login depends on; a break here is the highest-blast-radius
#     edge failure there is.
# Both are probed with module http_2xx (the blackbox exporter's built-in
# module: follows the redirect chain, so the check ends on the SSO login
# page's 200 rather than on the 302).
#
# Why a static target list: the routes are Cilium HTTPRoutes attached to a
# Gateway, and VMProbe's dynamic discovery roles only know Service, Ingress,
# Pod and Node objects (checked against the live CRD and the operator's
# probe generator) — an ingress-role probe would find nothing to probe. The
# two hostnames are stable by design, so they are written down here; adding
# a public host means adding one line here (and that is the reviewable
# artifact the plan asked for).
#
# Mechanics (from VictoriaMetrics/operator
# internal/controller/operator/factory/vmscrapes/probe.go, operator v0.74.1
# as deployed): vmagent scrapes the prober URL with params
# module=http_2xx&target=<url>, relabels instance=<target url> and
# __address__=<prober url>, and names the job probe/<namespace>/<name> —
# so the resulting series are
#   probe_success{job="probe/monitoring/public-ingress", instance="https://grafana.ngoldack.de/"}
# plus probe_duration_seconds / probe_http_* / probe_ssl_earliest_cert_expiry.
# vmagent picks this up with no extra wiring: it runs with
# selectAllByDefault: true (monitoring/helmrelease.yaml).
#
# Requires blackbox-exporter.yaml (the prober, in this namespace). The alert
# pair that consumes these series lives in rules-platform.yaml (group
# ingress-probe): PublicIngressProbeFailing on probe_success == 0 and
# PublicIngressProbeMetricsAbsent on absent(probe_success).
#
# KNOWN BLIND SPOT (proven 2026-09-25): this probe cannot detect a KubeSpan
# mesh partition. Its vantage — the blackbox-exporter pod on a home node — is
# short-circuited at the edge: during the 02:42Z edge KubeSpan collapse the
# same URL returned 503 to a LAN client and 403 "Access denied" (envoy, 15
# bytes) to this probe pod at the same moment, and http_edge accepts 403, so
# probe_success stayed 1 for the whole 6h45m outage. The probe is still the
# right instrument for DNS/TLS/Gateway/app failures; mesh health is covered
# separately by the kubespan-mesh VMRule group (rules-platform.yaml) on
# cilium_node_health_connectivity_status, which did detect that outage.
#
# Post-deploy confirmation (orchestrator):
#   curl -s 'http://<victoria-metrics>/api/v1/query?query=probe_success'
#   → expect one series per target with value 1
#   kubectl -n monitoring get vmprobe public-ingress -o jsonpath='{.status}'
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: public-ingress
  namespace: monitoring
spec:
  interval: 30s
  # Our own edge module (defined in blackbox-exporter.yaml), not the image's
  # http_2xx: the edge answers 403 to an unauthenticated caller while being
  # perfectly healthy (measured live — DNS 10 ms, valid TLS, status 403 from
  # the identity layer), so http_2xx would report both targets as down
  # forever. http_edge keeps DNS/connect/TLS/5xx fatal and accepts
  # 2xx/3xx/401/403.
  module: http_edge
  vmProberSpec:
    url: http://blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    static:
      targets:
        - https://grafana.ngoldack.de/
        - https://authentik.ngoldack.de/
