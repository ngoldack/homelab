# Hindsight — agent memory that learns (vectorize-io/hindsight, MIT).
# Self-hosted after the Hindsight Cloud credits ran out; the client just
# repoints base_url.
# LLM: three-member failover chain (Hindsight-native {"mode":"failover"}).
# Primary openai/gpt-5-nano: $0.05/$0.40 per M, 400k ctx, flat price, and the
# most reliable strict-JSON writer at its cost tier — memory extraction is an
# input-heavy workload, so input price decides the bill. Secondary
# z-ai/glm-5.3-flash: $0.15/$0.50 flat, 1.3M ctx, Artificial Analysis 57 —
# the quality hop when nano is down or rate-limited. Last member is the
# cluster's own qwen3-27b llama.cpp server: free, offline-capable, 8k ctx —
# slow but the lights never go out when credits do. (deepseek-v4-flash was
# the pick until DeepSeek retired it 2026-09-10; its OpenRouter listing now
# routes to V4.1 with weekday-Beijing peak double pricing — the flat two
# above are the better homelab economics.)
# REASONING_EFFORT=none stops thinking blocks; STRICT_SCHEMA grammar-
# enforces structured output for the cheap members.
#
# Embeddings + reranker stay on the chart defaults (LOCAL bge-small-en-v1.5 /
# ms-marco-MiniLM in-process on CPU): they are small, they run per-pod, and
# they need no GPU. The model files (~200 MB) re-download into the container
# cache on pod restart — accepted; the alternative is a RWO PVC that pins the
# pods to one node for a 30-second download.
# DB: CNPG (hindsight-database + the Database CR that owns vector/pg_trgm),
# password shared with the chart via existingSecret (key postgres-password).
# The chart's bundled ankane/pgvector subchart is OFF — every relational store
# here runs on the CNPG operator.
#
# metrics.serviceMonitor stays false: those are prometheus-operator CRDs this
# cluster does not have (the stack is VictoriaMetrics); VMServiceScrapes in
# monitoring/ scrape api:8888 and worker:8889 directly.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hindsight
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: hindsight
      version: "0.9.2"
      sourceRef:
        kind: HelmRepository
        name: hindsight
      interval: 1h
  targetNamespace: hindsight
  releaseName: hindsight
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # No dependsOn here: 'cnpg-operator' is a Flux Kustomization, not a
  # HelmRelease — the entry Kustomization (clusters/home/hindsight.yaml)
  # already waits on it for the CRDs.
  values:
    existingSecret: hindsight-env
    postgresql:
      enabled: false
      external:
        host: hindsight-database-rw
        port: 5432
        database: hindsight
        username: hindsight
    api:
      env: &llm-env
        HINDSIGHT_API_LLM_PROVIDER: openai
        HINDSIGHT_API_LLM_BASE_URL: https://openrouter.ai/api/v1
        HINDSIGHT_API_LLM_MODEL: openai/gpt-5-nano
        HINDSIGHT_API_LLM_1_PROVIDER: openai
        HINDSIGHT_API_LLM_1_BASE_URL: https://openrouter.ai/api/v1
        HINDSIGHT_API_LLM_1_MODEL: z-ai/glm-5.3-flash
        HINDSIGHT_API_LLM_2_PROVIDER: openai
        HINDSIGHT_API_LLM_2_BASE_URL: http://qwen3-27b.llmkube-system.svc.cluster.local:8080/v1
        HINDSIGHT_API_LLM_2_MODEL: qwen3-27b
        HINDSIGHT_API_LLM_2_API_KEY: not-needed
        HINDSIGHT_API_LLM_STRATEGY: '{"mode": "failover"}'
        HINDSIGHT_API_LLM_REASONING_EFFORT: none
        HINDSIGHT_API_LLM_STRICT_SCHEMA: "true"
        # Extraction bundles a large system schema + chunk; upstream first-token
        # latency plus 4k max_tokens generation busts the chart-default ~60s
        # budget on a cold gpt-5-nano slot. Raise generously; connect is still
        # capped so a dead route fails fast.
        HINDSIGHT_API_LLM_TIMEOUT: "300"
        HINDSIGHT_API_LLM_CONNECT_TIMEOUT: "15"
    worker:
      # Dedicated workers (not the API's internal one): retain/consolidation
      # LLM chains are long and must not starve recall latency on the API pod.
      enabled: true
      replicaCount: 1
      # The worker runs the LLM calls for retain — it needs the same model
      # config, and the chart does NOT merge api.env into the worker.
      env: *llm-env
    controlPlane:
      enabled: true
    nodeSelector:
      topology.homelab/site: home
    podDisruptionBudget:
      enabled: false
