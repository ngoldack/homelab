# Hindsight — agent memory that learns (vectorize-io/hindsight, MIT).
# Self-hosted after the Hindsight Cloud credits ran out; the client just
# repoints base_url.
# LLM: a SINGLE OpenRouter model (z-ai/glm-5.3-flash at low reasoning effort —
# fast and cost-efficient; strictly JSON via STRICT_SCHEMA). The prior 3-member
# failover chain (incl. the local qwen3-27b leg) made startup verification
# cross the chart's 30s liveness budget, crash-looping the API pod mid-boot —
# removed 2026-09-13. One working model keeps startup fast and singular.
#
# Embeddings + reranker stay on the chart defaults (LOCAL bge-small-en-v1.5 /
# ms-marco-MiniLM in-process on CPU): they are small, they run per-pod, and
# they need no GPU. The model files (~200 MB) re-download into the container
# cache on pod restart — accepted; the alternative is a RWO PVC that pins the
# pods to one node for a 30-second download.
# DB: CNPG (hindsight-database + the Database CR that owns vector/pg_trgm),
# password shared with the chart via existingSecret (key postgres-password).
# The chart's bundled ankane/pgvector subchart is OFF — every relational store
# here runs on the CNPG operator.
#
# metrics.serviceMonitor stays false: those are prometheus-operator CRDs this
# cluster does not have (the stack is VictoriaMetrics); VMServiceScrapes in
# monitoring/ scrape api:8888 and worker:8889 directly.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hindsight
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: hindsight
      version: "0.9.2"
      sourceRef:
        kind: HelmRepository
        name: hindsight
      interval: 1h
  targetNamespace: hindsight
  releaseName: hindsight
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      # Once the release latches "failed" (a transient sts-health blip marked
      # every history entry failed across the model swap), a plain retry won't
      # move off it because there's no "last successful" to roll back to.
      # Force replacement of the current (failed) revision's helm state on the
      # next reconcile; the deployed resources are already healthy.
      remediateLastFailure: true
      retries: 3
  # No dependsOn here: 'cnpg-operator' is a Flux Kustomization, not a
  # HelmRelease — the entry Kustomization (clusters/home/hindsight.yaml)
  # already waits on it for the CRDs.
  values:
    existingSecret: hindsight-env
    postgresql:
      enabled: false
      external:
        host: hindsight-database-rw
        port: 5432
        database: hindsight
        username: hindsight
    api:
      env: &llm-env
        HINDSIGHT_API_LLM_PROVIDER: openai
        HINDSIGHT_API_LLM_BASE_URL: https://openrouter.ai/api/v1
        HINDSIGHT_API_LLM_MODEL: z-ai/glm-5.3-flash
        # GLM-5.3 Flash (z-ai/glm-5.3-flash): fast, cost-efficient, large
        # context (1.3M). Low reasoning effort keeps latency/token cost down for
        # hindsight's heavy extraction/consolidation chain while STRICT_SCHEMA
        # grammar-forces structured output. (Verified 'low' as a supported
        # reasoning effort for this endpoint on OpenRouter before pinning.)
        # Single OpenRouter model only — no local qwen3-27b failover leg
        # (2026-09-13): the local leg made startup verification cross the
        # chart's 30s liveness budget, crash-looping the pod mid-boot. One
        # reliable OpenRouter model keeps startup fast and singular.
        HINDSIGHT_API_LLM_REASONING_EFFORT: "low"
        HINDSIGHT_API_LLM_STRICT_SCHEMA: "true"
        # Extraction bundles a large system schema + chunk; upstream first-token
        # latency plus 4k max_tokens generation busts the chart-default ~60s
        # budget on a cold gpt-5-nano slot. Raise generously; connect is still
        # capped so a dead route fails fast.
        HINDSIGHT_API_LLM_TIMEOUT: "600"
        HINDSIGHT_API_LLM_CONNECT_TIMEOUT: "15"
        # Audit logging off by default; enable so the ingest paths are auditable.
        HINDSIGHT_API_AUDIT_LOG_ENABLED: "true"
    worker:
      # Dedicated workers (not the API's internal one): retain/consolidation
      # LLM chains are long and must not starve recall latency on the API pod.
      enabled: true
      # Ingest throughput scaling: a single worker serializes every
      # retain/consolidation chain — the measured bottleneck (LLM call ~3s but
      # end-to-end 9-14s/diff; 212s under contention). 3 allow parallel chains.
      # Chart default is 2; we were below it at 1.
      replicaCount: 3
      # env written out IN FULL (not `*llm-env`): a YAML anchor substitutes the
      # whole map and cannot be appended to. The worker needs the same model
      # config (the chart does NOT merge api.env into the worker) PLUS its
      # batch/poll tunables.
      env:
        HINDSIGHT_API_LLM_PROVIDER: openai
        HINDSIGHT_API_LLM_BASE_URL: https://openrouter.ai/api/v1
        HINDSIGHT_API_LLM_MODEL: z-ai/glm-5.3-flash
        HINDSIGHT_API_LLM_REASONING_EFFORT: "low"
        HINDSIGHT_API_LLM_STRICT_SCHEMA: "true"
        HINDSIGHT_API_LLM_TIMEOUT: "600"
        HINDSIGHT_API_LLM_CONNECT_TIMEOUT: "15"
        # Tasks claimed per poll cycle (chart default 10). With 3 workers we
        # raise the claim batch so each worker takes bigger chunks per poll.
        HINDSIGHT_API_WORKER_BATCH_SIZE: "20"
        # Audit logging is disabled by default — roll it on for the worker too.
        HINDSIGHT_API_AUDIT_LOG_ENABLED: "true"
    controlPlane:
      enabled: true
    nodeSelector:
      topology.homelab/site: home
    podDisruptionBudget:
      enabled: false
