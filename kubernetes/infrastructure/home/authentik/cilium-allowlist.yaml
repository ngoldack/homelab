#  allowlist — namespace-scoped zero-trust policy (stage 1: the namespace
# is one trust domain; everything crossing the namespace boundary is denied
# unless named below). The cross-namespace edges below are the ones observed as
# live traffic on this cluster; add a rule here (and on the peer's side) rather
# than widening the boundary when a new integration appears.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-allowlist
  namespace: authentik
spec:
  endpointSelector:
    matchLabels: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
    - fromEntities:
        - ingress
        - health
    # OIDC metadata fetches from the NODE, not from a pod: the kube-apiserver
    # runs the JWT authenticator in-process and therefore fetches the issuer's
    # discovery document + JWKS from its node's host network. Those requests
    # carry the host/remote-node identity (not a pod identity), and the
    # authentik edge route's backend is this namespace's portal-bridge — so
    # without these entities the fetch dies as an envoy
    # "upstream connect error" (503, observed live on the control-plane node)
    # and the API rejects every OIDC token with a JWT-authenticator failure.
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
    # The media namespace's Jellyfin authenticates over this namespace's LDAP outpost (389/636).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
    # The valkey operator manages this namespace's Valkey pods.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: valkey-operator-system
    # The AI gateway validates its JWTs against this namespace's OIDC provider.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentgateway
    # The native-OIDC apps (grafana, langfuse, headlamp, paperless) point their
    # provider endpoints at the edge hostname (https://authentik.ngoldack.de/…)
    # rather than an in-cluster URL, so their server-side discovery/JWKS/token
    # calls traverse the Gateway. Cilium evaluates Gateway traffic against the
    # CLIENT identity with the route's backend pod as the peer (the
    # authentik.ngoldack.de route backends the portal-bridge in this
    # namespace), so each client needs its own rule here as well as the
    # matching egress rule in its own allowlist — without the pair the edge
    # answers 403 "Access denied" before the request reaches the app.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: langfuse
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: headlamp
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: paperless
    # The Hermes dashboard federates natively against this namespace's OIDC
    # provider and points its issuer at the edge hostname, so its server-side
    # discovery/token/JWKS calls traverse the Gateway and are checked against
    # the portal-bridge pod with the hermes pod's identity — the same pair
    # rule described above (../hermes/cilium-policy.yaml holds the egress
    # half).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes
    # Hindsight's control-plane UI is published through this namespace's proxy outpost.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hindsight
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
    # The Kubernetes API (entity, control-plane VIP, in-cluster Service CIDR) —
    # the CNPG instance manager reports status and backup results through it.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    - toCIDRSet:
        - cidr: 10.30.0.10/32
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    - toCIDRSet:
        - cidr: 172.21.0.0/16
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    # The proxy outposts front two UIs whose internal_host is an in-cluster
    # Service (seed.yaml: hindsight-ui-proxy -> hindsight-control-plane:3000,
    # grafana-proxy -> the grafana Service:80). The outpost pod lives in this
    # namespace and is bound by this same egress list, so omitting these rules
    # makes the outpost answer 502 to real browsers even though the SSO
    # redirect itself succeeds — a failure this session's earlier 302-only
    # check could not see.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - {port: "80", protocol: TCP}
            - {port: "3000", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hindsight
      toPorts:
        - ports:
            - {port: "3000", protocol: TCP}
    # The proxy outposts forward authenticated requests to the media apps
    # they front (the media HTTPRoutes' service URLs).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
    # Outbound HTTPS (provider/webhook calls) and SMTP submission.
    - toEntities:
        - world
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "587", protocol: TCP}
