# agentgateway — the AI gateway control plane from agentgateway.dev (kgateway
# lineage), running as a PARALLEL lane next to the existing aigateway lane
# (Envoy AI Gateway). Same job — LLM routing + auth + tracing for the LAN —
# different controller: this one is the agentgateway controller, which
# programs its own data-plane proxies from AgentgatewayBackend /
# AgentgatewayPolicy CRs attached to a Gateway of GatewayClass agentgateway.
#
# The label below lets the edge Gateway (network/edge.yaml, allowedRoutes from
# Selector) accept HTTPRoutes from this namespace later, mirroring aigateway.
apiVersion: v1
kind: Namespace
metadata:
  name: agentgateway
  labels:
    # Pod Security Admission: audit+warn at `restricted`, enforcement left to
    # Talos' cluster default (`baseline`). What actually surfaces drift here is
    # the `warn` level (kubectl warnings) and Kyverno's PolicyReports — NOT the
    # `audit` level: this cluster runs no API audit policy (Talos leaves audit
    # logging off and nothing in tofu/ configures it), so `audit:` records
    # nothing today. Reported-only on purpose besides: a live check on
    # 2026-09-17 found almost every workload violating `restricted`
    # (runAsNonRoot, seccompProfile, capabilities.drop, allowPrivilegeEscalation)
    # and Kyverno's four policies do not cover those fields, so
    # `enforce: restricted` needs those securityContexts added workload by
    # workload first.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    gateway.ngoldack.de/edge-ingress: "true"
