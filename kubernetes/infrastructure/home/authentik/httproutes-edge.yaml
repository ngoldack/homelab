# authentik.ngoldack.de on the edge: the portal must be reachable for
# external login redirects; no outpost in front — the portal IS the auth.
#
# The LAN twin route (httproutes.yaml) was retired with the split-horizon
# design; the cross-namespace ReferenceGrant below is what the edge
# headlamp/grafana routes need to reach authentik-proxy.
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-edge-routes-to-authentik
  namespace: authentik
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: headlamp
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: monitoring
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: hindsight
  to:
    - group: ""
      kind: Service
      name: authentik-proxy
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-edge
  namespace: authentik
spec:
  parentRefs:
    - name: edge
      namespace: network
      sectionName: https-apex
  hostnames:
    - authentik.ngoldack.de
  rules:
    - filters:
        # CrowdSec enforcement at the edge (GEP-1494 ExternalAuth filter,
        # native Gateway API — no Cilium ext-auth CRD needed). Every request
        # to the portal is checked against the kdwils ext_authz bouncer
        # (gRPC, Envoy ext_authz v3); the bouncer streams LAPI decisions and
        # returns DENIED for a banned IP, ALLOW otherwise. Fail-closed per
        # spec: if the bouncer is unreachable the portal refuses, which is the
        # right posture for a login endpoint. The bouncer is pinned to the
        # Hetzner node (same cloud node as the edge envoy) to keep the dial
        # node-local. ReferenceGrant for the cross-namespace Service ref lives
        # in ../crowdsec/ (allow-edge-ext-auth-to-crowdsec-bouncer).
        - type: ExternalAuth
          externalAuth:
            protocol: GRPC
            # Gateway API v1.6 validates `protocol == 'GRPC' ? has(grpc)` — the
            # grpc key must be present (all its fields optional); without it the
            # route is rejected and the filter silently never applies.
            grpc: {}
            backendRef:
              name: crowdsec-bouncer
              namespace: crowdsec
              port: 8080
      backendRefs:
        # portal-bridge, NOT authentik-server — edge envoy (host-netns) only
        # reaches node-local pods; see portal-bridge.yaml.
        - name: portal-bridge-cloud
          port: 9100
