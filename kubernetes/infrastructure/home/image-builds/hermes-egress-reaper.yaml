# Build the egress guard REAPER service image (same hermes-egress-guard
# sources; the reaper service is selected at runtime by the module path passed
# as argv; plan Unit 3.3).
#
# The guard image is ONE image for both services (authorizer + reaper). Both
# Jobs assemble the same sources with different output names; the running
# process picks its role from argv (egress_guard.authorizer |
# egress_guard.reaper), never from an env var. This Job pushes the reaper tag;
# hermes-egress-authorizer.yaml pushes the authorizer tag.
#
# OUTPUT: this Job records the digest of the image it BUILT. Last built digest:
#   sha256:0536c29113325512bcd792be91df40864153b89ff677098ce22b35fcd5d7fe5f
#   (registry.ngoldack.de/hermes-egress-guard:0.1.0 — the SAME image as the
#   authorizer's, one build serves both roles; pinned in
#   hermes-egress/reaper.yaml. The sources were not yet pushed when this build
#   ran; a rebuild after the push yields the same image content and a new
#   digest — re-pin.)
# Re-record the digest here and re-pin hermes-egress/reaper.yaml after
# every rebuild.
#
# RE-BUILDING: bump the Job name suffix and BOTH the context SHA and image
# tag. Flux sees a new Job (Jobs are immutable), prunes the old one.
#
# !! The context SHA above MUST be the commit that contains
# image-builds/hermes-egress-guard/ — a run against a tree without those
# sources fails in the Dockerfile's COPY step. The digest recorded above was
# produced from this working revision through buildkitd directly
# (buildctl --local context=.), which is the same build the Job performs. Both
# Jobs build the SAME image (one image, two roles), so their tags match.
apiVersion: batch/v1
kind: Job
metadata:
  name: build-hermes-egress-reaper-4cb8c87
  namespace: buildkit
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        topology.homelab/site: home
      containers:
        - name: buildctl
          image: moby/buildkit:v0.31.0
          command:
            - buildctl
          args:
            - --addr=tcp://buildkitd:1234
            - --tlscacert=/certs/ca.crt
            - --tlscert=/certs/tls.crt
            - --tlskey=/certs/tls.key
            - build
            - --frontend=dockerfile.v0
            - --opt=context=https://github.com/ngoldack/homelab.git#4cb8c87
            - --opt=filename=kubernetes/infrastructure/home/image-builds/hermes-egress-guard/Dockerfile
            - --output=type=image,name=registry.ngoldack.de/hermes-egress-guard:0.1.0-4cb8c87,push=true
            - --export-cache=type=registry,ref=registry.ngoldack.de/hermes-egress-guard:buildcache,mode=max
            - --import-cache=type=registry,ref=registry.ngoldack.de/hermes-egress-guard:buildcache
            - --progress=plain
          env:
            - name: DOCKER_CONFIG
              value: /docker
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: docker
              mountPath: /docker
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: buildctl-client-tls
        - name: docker
          secret:
            secretName: registry-credentials
            items:
              - key: .dockerconfigjson
                path: config.json
