# Qwen3-Coder-80B (A3B MoE) served by vLLM (CPU backend) as a plain Deployment.
# Coding / agentic slot for n8n agents, code gen and multi-file edits.
#
# WARNING: an 80B model on a CPU-only backend is functional but slow; it is the
# heaviest workload on the 84GB AI node. Tune threads/KV space to the box.
#
# Weights are staged in the SeaweedFS `vllm-models` bucket and copied into an
# emptyDir by an initContainer; vLLM serves them from the local path. Reachable
# only via LiteLLM.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-coder-80b
  namespace: vllm
  labels:
    app.kubernetes.io/name: qwen3-coder-80b
    app.kubernetes.io/part-of: vllm
spec:
  replicas: 1
  strategy:
    # Big model + single node: never run two copies at once (would OOM).
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qwen3-coder-80b
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen3-coder-80b
        app.kubernetes.io/part-of: vllm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        ai: "true"
      tolerations:
        - key: "ai"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      initContainers:
        - name: fetch-model
          image: amazon/aws-cli:2.31.21
          command:
            - /bin/sh
            - -c
            - >-
              aws --endpoint-url "$AWS_ENDPOINT_URL"
              s3 sync "s3://vllm-models/qwen3-coder-80b" /models/qwen3-coder-80b
          env:
            - name: AWS_ENDPOINT_URL
              value: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: vllm-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: vllm
          image: vllm/vllm-openai-cpu:v0.22.0-x86_64
          command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - "--model"
            - "/models/qwen3-coder-80b"
            - "--served-model-name"
            - "qwen3-coder-80b"
            - "--port"
            - "8080"
            - "--device=cpu"
            - "--dtype=bfloat16"
            # 64K context: required by the Hermes agent (rejects <64K models).
            - "--max-model-len=65536"
            - "--max-num-batched-tokens=4096"
            - "--max-num-seqs=16"
            - "--enable-prefix-caching"
            - "--otlp-traces-endpoint"
            - "http://otel-gateway.monitoring.svc.cluster.local:4317"
          env:
            - name: VLLM_CPU_OMP_THREADS_BIND
              value: "0-21"
            - name: VLLM_CPU_NUM_OF_RESERVED_CPU
              value: "1"
            # Large CPU KV region for the long-context coding workload (64K).
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "24"
            # LMCache shared KV pool — inert on the CPU image (CUDA-only wheels);
            # ready for a future GPU node + CUDA vLLM image.
            - name: LMCACHE_CHUNK_SIZE
              value: "256"
            - name: LMCACHE_REMOTE_URL
              value: redis://vllm-cache-valkey.vllm.svc.cluster.local:6379
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: HF_TOKEN
          securityContext:
            capabilities:
              add: ["SYS_NICE"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            # 80B weights take a long time to load into RAM on CPU.
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 60
          resources:
            requests:
              cpu: "10"
              memory: "52Gi"
            limits:
              cpu: "11"
              memory: "60Gi"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: models
          emptyDir:
            sizeLimit: 120Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-coder-80b
  namespace: vllm
  labels:
    app.kubernetes.io/name: qwen3-coder-80b
    app.kubernetes.io/part-of: vllm
spec:
  selector:
    app.kubernetes.io/name: qwen3-coder-80b
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
