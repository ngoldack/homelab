apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    # Pod Security Admission: audit+warn at `restricted`, enforcement left to
    # Talos' cluster default (`baseline`). What actually surfaces drift here is
    # the `warn` level (kubectl warnings) and Kyverno's PolicyReports — NOT the
    # `audit` level: this cluster runs no API audit policy (Talos leaves audit
    # logging off and nothing in tofu/ configures it), so `audit:` records
    # nothing today. Reported-only on purpose besides: a live check on
    # 2026-09-17 found almost every workload violating `restricted`
    # (runAsNonRoot, seccompProfile, capabilities.drop, allowPrivilegeEscalation)
    # and Kyverno's four policies do not cover those fields, so
    # `enforce: restricted` needs those securityContexts added workload by
    # workload first.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "v1.18.2"
      sourceRef:
        kind: HelmRepository
        name: jetstack
      interval: 1h
  targetNamespace: cert-manager
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
    # Without this, the chart's default "cert-manager.fullname" template
    # doubles up (release name "cert-manager" + chart name "cert-manager" ->
    # ServiceAccount "cert-manager-cert-manager"), which doesn't match
    # cert-manager-webhook-hetzner's default certManager.serviceAccountName
    # ("cert-manager") — its ClusterRoleBinding then grants the DNS01
    # domain-solver role to a ServiceAccount that doesn't match the one
    # actually running, so every Hetzner challenge is silently rejected as
    # forbidden.
    fullnameOverride: cert-manager
    # Gateway API integration is left off; the Gateway listener references the
    # wildcard Certificate's secret directly, so no shim is required.
    extraArgs:
      - --dns01-recursive-nameservers-only
      - --dns01-recursive-nameservers=1.1.1.1:53,1.0.0.1:53
