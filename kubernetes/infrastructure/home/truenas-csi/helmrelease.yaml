apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: truenas-csi
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: truenas-csi
      version: "1.3.0"
      sourceRef:
        kind: HelmRepository
        name: truenas-csi
      interval: 1h
  targetNamespace: truenas-csi
  values:
    truenas:
      url: wss://10.20.10.10:443/api/current
      defaultPool: fast
      nfsServer: 10.20.10.10
      nvmeofPortal: 10.20.10.10:4420
      insecureSkipTLS: true
      existingSecret: truenas-api-credentials
