# Build mainline llama.cpp v0.4.0 + shinbunbun's 29 P100 patches for the P100.
#
# WHY THIS IMAGE — the ONLY measured P100 path to >= 20 t/s decode on a
# Qwen3.8-27B-class model (see the Dockerfile's header for the measurement
# lineage and the ik-vs-mainline reasoning). It serves alongside ik:
# ik sm60 for the deep-prompt-crash-fixed fallback; this image is the primary
# >= 20 t/s candidate (native qwen35/qwen35moe + MTP on mainline v0.4.0).
#
# BUILD SHAPE — self-contained (qwen: the Dockerfile clones BOTH upstreams at
# pinned SHAs and applies the 29 patches itself), so the operator context is
# only provenance; nothing is COPY'd from it. The Dockerfile ships as a
# ConfigMap (llama-p100-dockerfile), mounted at /dockerfile — same
# --local dockerfile + dockerfilekey mechanism as build-ik-llama-19dfb71.
#
# RE-BUILDING: Jobs are immutable. Bump the Job name suffix, the tag, and the
# PATCHES_SHA/LLAMA_REF args in the Dockerfile together; Flux prunes the old Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: build-llama-p100-5ac8471
  namespace: buildkit
spec:
  backoffLimit: 2
  # Whole-source clone + 29 patches + a CUDA compile of ~100 .cu files on a
  # single arch. Generous, like the ik Job; the registry buildcache makes
  # rebases incremental.
  activeDeadlineSeconds: 10800
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        topology.homelab/site: home
      containers:
        - name: buildctl
          # Same version as the daemon (chart 1.8.0 -> appVersion v0.31.0).
          # Pinned: moby/buildkit:v0.31.0
          image: moby/buildkit@sha256:a095b3d11ce1a9a05b6064ef515dfca0291ec5bcf2ea8178da8f6461924294e1
          command:
            - buildctl
          args:
            - --addr=tcp://buildkitd:1234
            - --tlscacert=/certs/ca.crt
            - --tlscert=/certs/tls.crt
            - --tlskey=/certs/tls.key
            - build
            - --frontend=dockerfile.v0
            # Provenance only — the Dockerfile self-clones its real source at
            # the pinned SHA and never COPYs from this context.
            - --opt=context=https://github.com/ggml-org/llama.cpp.git#5ac847190e979e0da7c4a21806630805f396d487
            # Our Dockerfile (with the PINNED patch-application logic), from the
            # ConfigMap below.
            - --local=dockerfile=/dockerfile
            - --opt=dockerfilekey=dockerfile
            # Single Pascal arch — the entire point of this image.
            - --opt=build-arg:CUDA_DOCKER_ARCH=60
            # Pushes to the cluster's own Zot (../registry/), same TLS setup as
            # the ik image.
            - --output=type=image,name=registry.ngoldack.de/llama-p100:0.4.0-p100,push=true
            # Dedicated cache ref so this engine's layers don't collide with
            # ik's buildcache.
            - --export-cache=type=registry,ref=registry.ngoldack.de/llama-p100:buildcache,mode=max
            - --import-cache=type=registry,ref=registry.ngoldack.de/llama-p100:buildcache
            - --progress=plain
          env:
            - name: DOCKER_CONFIG
              value: /docker
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: docker
              mountPath: /docker
              readOnly: true
            - name: dockerfile
              mountPath: /dockerfile
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: buildctl-client-tls
        - name: docker
          secret:
            secretName: registry-credentials
            items:
              - key: .dockerconfigjson
                path: config.json
        - name: dockerfile
          configMap:
            # Generated by configMapGenerator in this directory's
            # kustomization.yaml from llama-p100/dockerfile.
            name: llama-p100-dockerfile
