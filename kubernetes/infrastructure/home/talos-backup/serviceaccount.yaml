# NOT a core v1 ServiceAccount — this is Talos's own CRD
# (serviceaccounts.talos.dev, short name "tsa"). Talos installs and serves it
# itself, through the same bootstrap-manifest machinery that installs CoreDNS
# and kube-proxy; there is no operator to deploy and nothing to add to
# sources.yaml. The CRD only appears once
# machine.features.kubernetesTalosAPIAccess is enabled in the control plane's
# machine config (tofu/home/talos.tf) — that is why this Kustomization
# depends on a tofu change having been applied first.
#
# A controller on the control-plane node reconciles this CR into a plain
# core/v1 Secret named EXACTLY after this object ("talos-backup"), containing
# a single key "config" holding a generated talosconfig. Verified in Talos
# v1.13.4 source: internal/app/machined/pkg/controllers/kubeaccess/
# serviceaccount/crd_controller.go returns &corev1.Secret{ObjectMeta:
# {Name: talosSA.GetName(), OwnerReferences: [...]}} with
# Data[constants.TalosconfigFilename]. The OwnerReference means deleting this
# CR garbage-collects the Secret, so the credential is never orphaned.
#
# Do not add a Secret manifest of that name here: it is created by Talos, and
# committing a placeholder would fight the controller and be pruned/recreated
# in a loop.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-backup
  namespace: talos-backup
spec:
  roles:
    # os:etcd:backup is the narrowest role that can do this. Per
    # docs.siderolabs.com/talos/v1.13/security/rbac it authorizes exactly one
    # API method, /machine.MachineService/EtcdSnapshot — not os:reader and
    # certainly not os:admin. The machine config's allowedRoles list is the
    # ceiling; the reconciler refuses any role requested here that is not in
    # it, so the two must agree.
    - os:etcd:backup
