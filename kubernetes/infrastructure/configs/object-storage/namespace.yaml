apiVersion: v1
kind: Namespace
metadata:
  name: seaweedfs
  labels:
    # SeaweedFS runs as root by default; baseline (not restricted) lets the
    # storage pods start while Kyverno still audits against restricted.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
