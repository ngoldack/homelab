apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nvidia
  namespace: flux-system
spec:
  interval: 2h
  url: https://nvidia.github.io/k8s-device-plugin
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: truenas-csi
  namespace: flux-system
spec:
  interval: 2h
  url: https://raw.githubusercontent.com/truenas/truenas-csi/master/charts
---
# Consumed by headlamp/, which is applied from this same Kustomization.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 2h
  url: https://kubernetes-sigs.github.io/headlamp/
---
# Consumed by metrics-server/ — serves the Kubernetes Metrics API
# (metrics.k8s.io) that Headlamp's native per-pod usage column reads.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 2h
  url: https://kubernetes-sigs.github.io/metrics-server/
---
# Consumed by monitoring-crds/ and monitoring/, which are applied by their own
# Flux Kustomizations (clusters/home/monitoring-crds.yaml, monitoring.yaml) so
# the CRD-before-CR ordering can be expressed as a dependsOn edge. Both of
# those depend on infra-controllers, which is what applies this file.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: victoria-metrics
  namespace: flux-system
spec:
  interval: 2h
  url: https://victoriametrics.github.io/helm-charts/
---
# Consumed by cnpg-operator/, applied by its own Flux Kustomization so Immich's
# Cluster/Database CRs can depend on the CRDs existing.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 2h
  url: https://cloudnative-pg.github.io/charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: immich
  namespace: flux-system
spec:
  interval: 2h
  url: https://immich-app.github.io/immich-charts
---
# Consumed by llmkube/, applied by its own Flux Kustomization so the Model and
# InferenceService CRs can depend on the operator's CRDs existing.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: llmkube
  namespace: flux-system
spec:
  interval: 2h
  url: https://defilantech.github.io/LLMKube
---
# Consumed by buildkit/, applied by its own Flux Kustomization so the build
# Jobs in image-builds/ can depend on the builder being up. moby/buildkit
# ships no chart of its own — only the Kubernetes examples this one wraps.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: andrcuns
  namespace: flux-system
spec:
  interval: 2h
  url: https://andrcuns.github.io/charts
---
# Consumed by registry/ — Zot, the cluster's own OCI registry. Its own Flux
# Kustomization so image-builds/ can depend on the registry being up before a
# build tries to push to it.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: zot
  namespace: flux-system
spec:
  interval: 2h
  url: https://zotregistry.dev/helm-charts
---
# Consumed by authentik/ — the identity provider. NOTE the domain: the
# chart repo is charts.goauthentik.io (GitHub Pages); code.goauthentik.io
# is the source forge and has NO DNS record — Flux surfaced this as
# "no such host" while local helm still "worked" off a pre-existing repo
# entry, which is exactly how the wrong URL survives a laptop-only test.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 2h
  url: https://charts.goauthentik.io
---
# Consumed by valkey-operator/ — the official valkey-io operator chart.
# Standing rule: datastores come through their operator (CNPG for Postgres,
# valkey-operator for Valkey), never a bare Deployment.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: valkey
  namespace: flux-system
spec:
  interval: 2h
  url: https://valkey.io/valkey-helm
---
# Consumed by librechat/ — LibreChat, the self-hosted LLM chat front-end. OCI
# chart published on GHCR (the chart repo has no HTTPS index; type: oci, same
# as the agentgateway entry above).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: librechat
  namespace: flux-system
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/danny-avila/librechat-chart
