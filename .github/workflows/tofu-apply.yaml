name: OpenTofu Apply

# Mutating apply against private Proxmox/Talos infrastructure.
# Manual dispatch ONLY, gated behind the protected "production" GitHub
# Environment (configure required reviewers there for human approval).
# Optionally nudges Flux to reconcile immediately after a successful apply.
#
# Network connectivity to the private cluster is established by the NetBird
# step BELOW, before the Dagger calls - the Dagger module itself is network
# agnostic. All tofu/flux logic lives in the Dagger module (.dagger). Locally
# (with your mesh already connected) this is:
#   dagger call tofu-apply --sops-age-key=env://SOPS_AGE_KEY

on:
  workflow_dispatch:
    inputs:
      reconcile_flux:
        description: 'Force Flux to reconcile after apply'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: tofu-state
  cancel-in-progress: false

jobs:
  apply:
    name: OpenTofu Apply
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Cache Dagger engine image
        uses: ./.github/actions/dagger-engine-cache

      - name: Connect to NetBird mesh
        env:
          NB_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          set -euo pipefail
          curl -fsSL https://pkgs.netbird.io/install.sh | sh
          sudo netbird up --setup-key "$NB_SETUP_KEY"
          sudo netbird status

      - name: OpenTofu Apply (Dagger)
        uses: dagger/dagger-for-github@v8.4.1
        with:
          verb: call
          args: >-
            tofu-apply
            --sops-age-key=env://SOPS_AGE_KEY
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

      - name: Flux Reconcile (Dagger)
        if: ${{ inputs.reconcile_flux }}
        uses: dagger/dagger-for-github@v8.4.1
        with:
          verb: call
          args: >-
            flux-reconcile
            --kubeconfig=env://KUBECONFIG_DATA
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
