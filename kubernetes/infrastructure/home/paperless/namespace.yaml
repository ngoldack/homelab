# Paperless-ngx: self-hosted document management (OCR, tagging, full-text
# search). Documents are uploaded and landed via the mobile/desktop apps and
# the web UI — there is no third-party WAN integration that needs to reach
# it, so like immich this is a LAN-resident service and deliberately NOT for
# public WAN exposure.
apiVersion: v1
kind: Namespace
metadata:
  name: paperless
  labels:
    # Pod Security Admission: audit+warn at `restricted`, enforcement left to
    # Talos' cluster default (`baseline`). Reported-only on purpose: a live
    # check on 2026-09-17 found almost every workload in these namespaces
    # violating `restricted` (runAsNonRoot, seccompProfile, capabilities.drop,
    # allowPrivilegeEscalation) and Kyverno's four audit policies do not cover
    # those fields — so `enforce: restricted` needs those securityContexts added
    # workload by workload first; clean policy reports alone are not the gate.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    gateway.ngoldack.de/public-ingress: "true"
    # edge-ingress so the paperless.ngoldack.de route can attach to the edge
    # Gateway; exposure is still gated by authentik SSO in front of the app.
    gateway.ngoldack.de/edge-ingress: "true"
