# EMQX MQTT broker (3-node core) managed by the EMQX Operator. The MQTT TCP
# listener (:1883) is exposed in-cluster as the `emqx-listeners` Service; the
# dashboard stays internal-only (no Gateway/Ingress). Volume on the fast NVMe-oF
# block tier.
#
# MQTT client auth: built_in_database password authentication, seeded from the
# emqx-auth bootstrap CSV (zigbee2mqtt, homeassistant). Anonymous is rejected.
#
# VERIFY-BEFORE-DEPLOY: the EMQX v2beta1 config HOCON keys + the bootstrap_file
# format/path and coreTemplate.spec.extraVolumes support for your operator
# version (https://docs.emqx.com).
apiVersion: apps.emqx.io/v2beta1
kind: EMQX
metadata:
  name: emqx
  namespace: mqtt
spec:
  image: emqx/emqx:6
  config:
    data: |
      authentication = [
        {
          mechanism = password_based
          backend = built_in_database
          user_id_type = username
          password_hash_algorithm { name = sha256, salt_position = suffix }
          bootstrap_file = "/opt/emqx/data/auth/bootstrap_users.csv"
          bootstrap_type = plain
        }
      ]
  coreTemplate:
    spec:
      replicas: 3
      env:
        - name: EMQX_DASHBOARD__DEFAULT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: emqx-dashboard
              key: password
      extraVolumes:
        - name: emqx-auth
          secret:
            secretName: emqx-auth
      extraVolumeMounts:
        - name: emqx-auth
          mountPath: /opt/emqx/data/auth
          readOnly: true
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 2Gi
      volumeClaimTemplates:
        storageClassName: tns-fast-nvmeof
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
  dashboardServiceTemplate:
    spec:
      type: ClusterIP
  listenersServiceTemplate:
    spec:
      type: ClusterIP
