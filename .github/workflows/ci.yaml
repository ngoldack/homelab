name: CI

# Offline validation only. Runs on every PR and on pushes to main.
# Requires NO secrets, kubeconfig, VPN, or Proxmox access - this is the
# required branch-protection check. Anything needing private network access
# (tofu plan/apply, flux reconcile) lives in the tofu-* workflows.
#
# All validation logic lives in the Dagger module (.dagger). The exact same
# command runs locally: `dagger call check`.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Offline Validation (Dagger)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Offline Gates
        uses: dagger/dagger-for-github@v8.3.0
        with:
          verb: call
          args: check
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
