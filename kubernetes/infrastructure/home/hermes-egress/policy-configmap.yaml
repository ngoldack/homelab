# hermes-egress policy — plan Unit 3.2, the file policy.py:load_policy consumes
# (env EGRESS_POLICY_FILE, default /etc/egress/policy.json; ConfigMap named
# egress-authorizer-policy per the guard's docstring, key policy.json).
#
# Schema (validated by load_policy — unknown keys are PolicyError, fail-fast):
#   {version: str, profiles: {<profile>: {allow: [{host, ports[]}]}},
#    kill_cidrs?: [CIDR], kill_exact?: [IP]}
# AllowEntry host semantics (policy.py AllowEntry.matches): an entry starting
# with "." matches the bare name and any subdomain suffix; otherwise EXACT host
# only. Hosts are compared lowercase with a trailing dot stripped. Hostnames are
# never resolved by the authorizer — an IP-literal target is instead evaluated
# against kill_cidrs/kill_exact FIRST (policy.py kill_reason), so allowlisting
# an IP is impossible and the management plane stays unreachable by value, not
# by omission (BUILTIN_KILL_CIDRS covers RFC1918/loopback/link-local/CGNAT and
# the IPv6 counterparts; this file adds the cluster's own ranges).
#
# Per-profile allowlists (fixed profile vocabulary: core, offline, python, go,
# node, web):
#   offline  — NO allow entries: the profile promises it fetches nothing, so
#              every CONNECT through the proxy is denied for it.
#   core     — the shared dependency baseline: the package indices a session
#              of any profile cannot avoid touching. Widening needs a
#              why-comment and a version bump.
#   python   — PyPI + files.pythonhosted (the actual wheel CDN) on 443.
#   go       — the Go module proxy chain: proxy.golang.org (module proxy) and
#              sum.golang.org (checksum DB). The Go toolchain dials
#              proxy.golang.org only for module downloads.
#   node     — registry.npmjs.org (+ the registry.npmjs.com legacy alias).
#   web      — same baseline as core (no dedicated promise yet).
#
# kill_cidrs: the cluster's own pod/service ranges (terraform.tfvars: pod_cidr
# 172.20.0.0/16, service_cidr 172.21.0.0/16). Node/Proxmox/management VLANs are
# inside RFC1918 ranges the builtin set already kills.
#
# Byte budgets were removed 2026-09-20: no Envoy-side byte reporter exists, so
# the x-egress-bytes hint is never supplied and the tripwire never fires; the
# rows were inert config paying the cost of a control that cannot signal (plan
# Unit 2.D). Remove-only — a session that legitimately transfers more than the
# old ceiling (e.g. a large model artifact through the web profile) is no
# longer cut off mid-transfer by a phantom budget. Real byte accounting returns
# with an Envoy byte reporter (EGRESS_BYTES hint), not with config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress-authorizer-policy
  namespace: hermes-egress
  labels:
    app.kubernetes.io/name: egress-authorizer
data:
  policy.json: |
    {
      "version": "2026-09-18.2",
      "profiles": {
        "offline": {
          "allow": []
        },
        "core": {
          "allow": [
            {"host": "pypi.org", "ports": [443]},
            {"host": "files.pythonhosted.org", "ports": [443]},
            {"host": "proxy.golang.org", "ports": [443]},
            {"host": "sum.golang.org", "ports": [443]},
            {"host": "registry.npmjs.org", "ports": [443]}
          ]
        },
        "python": {
          "allow": [
            {"host": "pypi.org", "ports": [443]},
            {"host": "files.pythonhosted.org", "ports": [443]}
          ]
        },
        "go": {
          "allow": [
            {"host": "proxy.golang.org", "ports": [443]},
            {"host": "sum.golang.org", "ports": [443]}
          ]
        },
        "node": {
          "allow": [
            {"host": "registry.npmjs.org", "ports": [443]},
            {"host": "registry.npmjs.com", "ports": [443]}
          ]
        },
        "web": {
          "allow": [
            {"host": "pypi.org", "ports": [443]},
            {"host": "files.pythonhosted.org", "ports": [443]},
            {"host": "proxy.golang.org", "ports": [443]},
            {"host": "sum.golang.org", "ports": [443]},
            {"host": "registry.npmjs.org", "ports": [443]}
          ]
        }
      },
      "kill_cidrs": [
        "172.20.0.0/16",
        "172.21.0.0/16"
      ],
      "kill_exact": [
        "169.254.169.254"
      ]
    }