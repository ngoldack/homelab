name: CI

# Offline validation only. Runs on every PR and on pushes to main.
# Requires NO secrets, kubeconfig, VPN, or Proxmox access — this is the
# required branch-protection check. Anything needing private network access
# (tofu plan/apply, flux reconcile) lives in the tofu-* workflows.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Detect which areas changed so we only run the relevant validation jobs.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      tofu: ${{ steps.filter.outputs.tofu }}
      kubernetes: ${{ steps.filter.outputs.kubernetes }}
      sops: ${{ steps.filter.outputs.sops }}
      workflows: ${{ steps.filter.outputs.workflows }}
      yaml: ${{ steps.filter.outputs.yaml }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tofu:
              - 'tofu/**'
              - '.github/workflows/ci.yaml'
            kubernetes:
              - 'kubernetes/**'
              - '.yamllint'
              - '.github/workflows/ci.yaml'
            sops:
              - '**/*.sops.yaml'
              - '.sops.yaml'
            workflows:
              - '.github/workflows/**'
            yaml:
              - '**/*.yaml'
              - '**/*.yml'
              - '.yamllint'

  # ---------------------------------------------------------------------------
  # Generic linting: YAML + GitHub Actions workflow correctness.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (yamllint + actionlint)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.yaml == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint YAML Files
        if: needs.changes.outputs.yaml == 'true'
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint

      - name: Lint GitHub Actions Workflows
        if: needs.changes.outputs.workflows == 'true'
        uses: raven-actions/actionlint@v2

  # ---------------------------------------------------------------------------
  # Ensure every *.sops.yaml file is actually encrypted (has SOPS metadata).
  # ---------------------------------------------------------------------------
  secrets:
    name: SOPS Encryption Policy
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sops == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify All *.sops.yaml Files Are Encrypted
        run: |
          set -euo pipefail
          echo "Scanning workspace for unencrypted SOPS files..."
          unencrypted=0
          while IFS= read -r -d '' f; do
            # A properly encrypted SOPS file has a top-level "sops:" block
            # AND at least one ENC[...] encrypted value.
            if ! grep -q '^sops:' "$f" || ! grep -q 'ENC\[' "$f"; then
              echo "::error file=$f::Unencrypted or malformed SOPS file detected"
              unencrypted=$((unencrypted + 1))
            fi
          done < <(find . -type f -name '*.sops.yaml' -print0)
          if [ "$unencrypted" -gt 0 ]; then
            echo "Security validation failed: $unencrypted file(s) are not properly encrypted."
            exit 1
          fi
          echo "All *.sops.yaml files are securely encrypted."

  # ---------------------------------------------------------------------------
  # OpenTofu offline validation. No credentials, no backend, no state access.
  # ---------------------------------------------------------------------------
  tofu-validate:
    name: OpenTofu Validate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.tofu == 'true'
    defaults:
      run:
        working-directory: tofu
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.7.2

      - name: OpenTofu Format Check
        run: tofu fmt -check -recursive

      - name: OpenTofu Init (syntax only, no backend, pinned providers)
        run: tofu init -backend=false -lockfile=readonly

      - name: OpenTofu Validate
        run: tofu validate

  tofu-security:
    name: OpenTofu Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.tofu == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Config Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: tofu
          ignore-unfixed: true
          exit-code: '1'
          severity: CRITICAL

  # ---------------------------------------------------------------------------
  # Kubernetes / Flux offline validation: kustomize build + schema validation
  # + structural assertions on the Flux Kustomizations.
  # ---------------------------------------------------------------------------
  kubernetes-validate:
    name: Kubernetes & Flux Validate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.kubernetes == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Install kubeconform
        run: |
          set -euo pipefail
          KCV=v0.6.7
          BASE=https://github.com/yannh/kubeconform/releases/download
          curl -fsSL "${BASE}/${KCV}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Kustomize Build + Schema Validation
        run: |
          set -euo pipefail
          # CRDs (Flux, Cilium, cert-manager, CNPG, KServe, Gateway API, KEDA,
          # Gatekeeper, etc.) are not part of the upstream schema set, so we skip
          # missing schemas rather than failing on every custom resource.
          validate() {
            local path="$1"
            echo "==== Building & validating $path ===="
            kustomize build "$path" \
              | kubeconform -strict -ignore-missing-schemas -summary -verbose=false
          }
          validate kubernetes/clusters/production
          validate kubernetes/infrastructure
          validate kubernetes/apps

      - name: Install yq
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Assert Flux Kustomization Invariants
        run: |
          set -euo pipefail
          infra=kubernetes/clusters/production/infrastructure.yaml
          apps=kubernetes/clusters/production/apps.yaml

          assert() {
            local file="$1" expr="$2" expected="$3" desc="$4"
            actual="$(yq "$expr" "$file")"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$file::$desc (got '$actual', expected '$expected')"
              exit 1
            fi
            echo "OK: $file — $desc"
          }

          # Both Flux Kustomizations must keep SOPS decryption wired up.
          for f in "$infra" "$apps"; do
            assert "$f" '.spec.decryption.provider' 'sops' 'decryption.provider must be sops'
            assert "$f" '.spec.decryption.secretRef.name' 'sops-age' 'decryption.secretRef.name must be sops-age'
            assert "$f" '.spec.prune' 'true' 'prune must be enabled'
          done

          # apps must depend on infrastructure so ordering is preserved.
          assert "$apps" '.spec.dependsOn[] | select(.name == "infrastructure") | .name' \
            'infrastructure' 'apps must dependsOn infrastructure'
