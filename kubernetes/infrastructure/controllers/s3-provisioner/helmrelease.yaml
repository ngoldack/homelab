apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: s3-provisioner
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: s3-provisioner
  chart:
    spec:
      chart: minio
      version: "14.x"
      sourceRef:
        kind: HelmRepository
        name: bitnami
      interval: 1h
  install:
    createNamespace: true
  values:
    statefulset:
      replicaCount: 0
    provisioning:
      enabled: true
