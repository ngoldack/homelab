apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio-operator
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: minio-operator
  chart:
    spec:
      chart: operator
      version: "7.1.1"
      sourceRef:
        kind: HelmRepository
        name: minio-operator
      interval: 1h
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values: {}
