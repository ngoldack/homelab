apiVersion: k8sgpt.ai/v1alpha1
kind: K8sgpt
metadata:
  name: k8sgpt-localai
  namespace: k8sgpt-operator-system
spec:
  ai:
    enabled: true
    model: fast
    backend: localai
    baseUrl: http://localai.localai.svc.cluster.local:8080/v1
  noCache: false
  filters:
    - Pod
    - Service
    - Ingress
    - ReplicaSet
    - PersistentVolumeClaim
