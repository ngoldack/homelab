# langfuse.ngoldack.de on the EDGE path. Unlike phoenix (which sits behind the
# authentik outpost because it uses the outpost proxy pattern), langfuse speaks
# native OIDC itself — the edge route backends the langfuse web Service
# directly (langfuse-web:3000) and authentik handles the OIDC handshake in-app
# via the langfuse-oidc provider (seed.yaml). Same namespace backend, so no
# ReferenceGrant is needed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: langfuse-edge
  namespace: langfuse
spec:
  parentRefs:
    - name: edge
      namespace: network
      sectionName: https-apex
  hostnames:
    - langfuse.${CLUSTER_DOMAIN}
  rules:
    - backendRefs:
        - name: langfuse-web
          port: 3000
