# Build + SIGN the llama-kv-broker image (stdlib-only Go reverse proxy that owns the
# per-session KV slot files in front of the qwen36-35b llama-server).
#
# BUILD SHAPE — the build context is THIS REPO at the pinned commit and the
# Dockerfile is fetched from that tree by path, exactly like
# hermes-agent-sandbox-plugin.yaml: `--opt=context=<repo>#<sha>` plus
# `--opt=filename=<repo-relative Dockerfile>`, and the Dockerfile's COPY sources
# are repo-relative. The pin is the commit whose tree carries the broker sources
# and this Dockerfile; bump it (with the Job name and tag) whenever either moves.
#
# SIGNING — the job now runs the docs/hermes-review.md Unit 4.2 pipeline against
# the pushed DIGEST: trivy CRITICAL/HIGH gate -> CycloneDX SBOM (attached with
# cosign) -> SLSA provenance attestation -> signature LAST (--tlog-upload=false).
# An image that fails the gate is left UNSIGNED and the Job fails loudly so the
# digest is never re-pinned. cosign-linux-amd64 v2.4.3 = sha256 caaad125…
# 4708 (sigstore release, resolved 2026-09-20); trivy v0.74.0 Linux-64bit
# tarball = sha256 2ae6fe3e…4371a (same trivy version as the image-scan loop:
# one trivy cluster-wide). The cosign private key is the SOPS-encrypted
# cosign-signing-key secret (ns buildkit), mounted read-only; COSIGN_PASSWORD
# comes from the password item in the same secret.
#
# OUTPUT: registry.ngoldack.de/llama-kv-broker:6 — the digest printed by buildctl
# is pinned in kubernetes/infrastructure/home/llmkube-models/kv-broker.yaml.
# (-5 corrected to -6 on 2026-09-20: trivy 0.74's SBOM format is 'cyclonedx'
# (XML), not 'cyclonedx-json'.)
#
# RE-BUILDING: Jobs are immutable. Bump the Job name suffix, the --output tag and
# the context SHA together; Flux prunes the old Job. The registry cache keeps a
# source-only change to a few seconds of recompile.
apiVersion: batch/v1
kind: Job
metadata:
  name: build-llama-kv-broker-6
  namespace: buildkit
spec:
  backoffLimit: 2
  # One static Go build over two cached bases + scan/SBOM/attest/sign; generous.
  activeDeadlineSeconds: 2700
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        topology.homelab/site: home
      containers:
        - name: buildctl
          # Same version as the daemon (chart 1.8.0 -> appVersion v0.31.0).
          # Alpine-based (has /bin/sh + apk); shell needed for the signer chain.
          image: moby/buildkit:v0.31.0
          command:
            - /bin/sh
            - -c
          args:
            - >-
              set -euo pipefail &&
              apk add --no-cache curl tar gzip >/dev/null 2>&1 &&
              echo "== fetch cosign (pinned) ==" &&
              curl -fsSL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v2.4.3/cosign-linux-amd64 &&
              printf 'caaad125acef1cb81d58dcdc454a1e429d09a750d1e9e2b3ed1aed8964454708  /usr/local/bin/cosign\n' | sha256sum -c - &&
              chmod +x /usr/local/bin/cosign &&
              echo "== fetch trivy (pinned, same version as image-scan) ==" &&
              curl -fsSL -o /tmp/trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz &&
              printf '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  /tmp/trivy.tgz\n' | sha256sum -c - &&
              tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy &&
              chmod +x /usr/local/bin/trivy &&
              echo "== buildctl build+push ==" &&
              set +e && buildctl --addr=tcp://buildkitd:1234 --tlscacert=/certs/ca.crt --tlscert=/certs/tls.crt --tlskey=/certs/tls.key build --frontend=dockerfile.v0 --opt=context=https://github.com/ngoldack/homelab.git#2c26ba790e2f8696a9fc34adb87227c51748f5d0 --opt=filename=kubernetes/infrastructure/home/image-builds/llama-kv-broker/dockerfile --output=type=image,name=registry.ngoldack.de/llama-kv-broker:6,push=true --export-cache=type=registry,ref=registry.ngoldack.de/llama-kv-broker:buildcache,mode=max --import-cache=type=registry,ref=registry.ngoldack.de/llama-kv-broker:buildcache --progress=plain > /tmp/build.log 2>&1; rc=$?; set -e;
              cat /tmp/build.log;
              test $rc -eq 0 || { echo "BUILD FAILED rc=$rc"; exit $rc; };
              DIGEST=$(grep -oE 'sha256:[a-f0-9]{64}' /tmp/build.log | tail -1);
              test -n "$DIGEST" || { echo "NO DIGEST in build log"; exit 1; };
              echo "DIGEST=$DIGEST";
              IMAGE=registry.ngoldack.de/llama-kv-broker:6;
              echo "== trivy gate ==" &&
              trivy image --severity CRITICAL,HIGH --exit-code 1 --no-progress "$IMAGE" &&
              echo "== SBOM ==" &&
              trivy image --format cyclonedx -o /tmp/sbom.xml --no-progress "$IMAGE" &&
              echo "== attach sbom ==" &&
              export COSIGN_PASSWORD="$(cat /cosign/password)" &&
              DOCKER_CONFIG=/docker cosign attach sbom --sbom /tmp/sbom.xml --type cyclonedx "$IMAGE" &&
              echo "== provenance attest ==" &&
              printf '{"builder":{"name":"https://github.com/ngoldack/homelab"},"buildType":"https://slsa.dev/provenance/v1.0","source":{"uri":"https://github.com/ngoldack/homelab","digest":{"sha1":"2c26ba790e2f8696a9fc34adb87227c51748f5d0"}},"buildMetadata":{"reproducible":"false"}}' > /tmp/prov.json &&
              DOCKER_CONFIG=/docker cosign attest --type slsaprovenance --predicate /tmp/prov.json --key /cosign/cosign.key --tlog-upload=false "$DIGEST" &&
              echo "== sign LAST ==" &&
              DOCKER_CONFIG=/docker cosign sign --key /cosign/cosign.key --tlog-upload=false "$DIGEST" &&
              echo "SIGNED $IMAGE ($DIGEST)"
          env:
            - name: DOCKER_CONFIG
              value: /docker
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: docker
              mountPath: /docker
              readOnly: true
            - name: cosign
              mountPath: /cosign
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: buildctl-client-tls
        - name: docker
          secret:
            secretName: registry-credentials
            items:
              - key: .dockerconfigjson
                path: config.json
        - name: cosign
          secret:
            secretName: cosign-signing-key
            items:
              - key: cosign.key
                path: cosign.key
              - key: password
                path: password