# Envoy Gateway data plane (gateway.envoyproxy.io) — split out of the
# aigateway lane so the Backend CRD (installed by the gateway-helm chart)
# is Established before aigateway's Backend/AIServiceBackend CRs dry-run.
# Without this split, aigateway's Kustomization failed atomically: its
# server-side dry-run tripped on the Backend CR (CRD not yet present) and
# the same-tree envoy-gateway HelmRelease was never created — a chicken-and-egg
# only a separate CRD-before-CR reconciliation order resolves.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aigateway-envoy-gateway
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/infrastructure/home/aigateway-envoy-gateway
  prune: true
  wait: true
  timeout: 5m
  retryInterval: 2m
  dependsOn:
    - name: cluster-vars
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
