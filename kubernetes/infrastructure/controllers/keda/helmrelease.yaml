apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: keda
  chart:
    spec:
      chart: keda
      version: "2.14.x"
      sourceRef:
        kind: HelmRepository
        name: keda
      interval: 1h
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values:
    # Highly secure, optimized configurations for homogeneous cluster metrics scaling
    prometheus:
      metricServer:
        enabled: true
        port: 8080
    logging:
      operator:
        level: info
      metricServer:
        level: info
