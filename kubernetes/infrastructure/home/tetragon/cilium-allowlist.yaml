# tetragon allowlist — the only traffic that may cross the default-deny baseline.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tetragon-allowlist
  namespace: tetragon
spec:
  endpointSelector:
    matchLabels: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tetragon
    - fromEntities:
        - ingress
        - health
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
    # vmagent scrapes Tetragon's :2112 metrics.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - {port: "2112", protocol: TCP}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tetragon
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    - toCIDRSet:
        - cidr: 10.30.0.10/32
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    - toCIDRSet:
        - cidr: 172.21.0.0/16
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
