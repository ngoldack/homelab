apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: khoj-postgres
  namespace: khoj
spec:
  instances: 1
  # pgvector-enabled image; Khoj stores embeddings via the pgvector extension.
  imageName: ghcr.io/cloudnative-pg/postgresql:16-pgvector

  storage:
    size: 10Gi
    storageClass: tns-fast-nvmeof

  # Continuous WAL archiving + base backups to S3 (PITR) via the Barman Cloud plugin.
  # The referenced ObjectStore is defined in barman-objectstore.yaml; daily base
  # backups are scheduled by scheduledbackup.yaml.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: khoj-backup-store

  bootstrap:
    initdb:
      database: khoj
      owner: khoj
      # Enable the pgvector extension on first bootstrap so Khoj can create its
      # embedding columns without a manual initContainer step.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
