name: OpenTofu Apply

# Mutating apply against private Proxmox/Talos infrastructure.
# Manual dispatch ONLY, gated behind the protected "production" GitHub
# Environment (configure required reviewers there for human approval).
# Optionally nudges Flux to reconcile immediately after a successful apply.
#
# All logic lives in the Dagger module (.dagger). Locally this is:
#   dagger call tofu-apply \
#     --sops-age-key=env://SOPS_AGE_KEY \
#     --netbird-setup-key=env://NETBIRD_SETUP_KEY

on:
  workflow_dispatch:
    inputs:
      reconcile_flux:
        description: 'Force Flux to reconcile after apply'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: tofu-state
  cancel-in-progress: false

jobs:
  apply:
    name: OpenTofu Apply
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: OpenTofu Apply (Dagger)
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "0.21.4"
          verb: call
          args: >-
            tofu-apply
            --sops-age-key=env://SOPS_AGE_KEY
            --netbird-setup-key=env://NETBIRD_SETUP_KEY
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}

      - name: Flux Reconcile (Dagger)
        if: ${{ inputs.reconcile_flux }}
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "0.21.4"
          verb: call
          args: >-
            flux-reconcile
            --kubeconfig=env://KUBECONFIG_DATA
            --netbird-setup-key=env://NETBIRD_SETUP_KEY
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
