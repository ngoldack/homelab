# agentgateway — OSS agent gateway / control plane (GatewayClass: agentgateway).
# Namespace + CRDs/controller HelmReleases. The `agentgateway` OCI HelmRepository
# is defined in the shared controllers/sources.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrelease.yaml
