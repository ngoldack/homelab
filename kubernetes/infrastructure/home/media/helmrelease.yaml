            resources:
              requests:
                cpu: 10m
                memory: 20Mi
              limits:
                memory: 50Mi
        containers:
          main:
            image:
              repository: linuxserver/bazarr
              tag: "1.6.1"
            env:
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
              TZ: Europe/Berlin
            ports:
              - name: http
                containerPort: 6767
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
    service:
      jellyfin:
        controller: jellyfin
        ports:
          http:
            port: 8096
      sabnzbd:
        controller: sabnzbd
        ports:
          http:
            port: 8080
      sonarr:
        controller: sonarr
        ports:
          http:
            port: 8989
      radarr:
        controller: radarr
        ports:
          http:
            port: 7878
      prowlarr:
        controller: prowlarr
        ports:
          http:
            port: 9696
      bazarr:
        controller: bazarr
        ports:
          http:
            port: 6767
    persistence:
      # The route-script ConfigMap, mounted into every VLAN pod's init
      # container (not the app container — nothing else needs it).
      vlan-routes:
        type: configMap
        name: vlan-routes
        advancedMounts:
          sabnzbd:
            vlan-routes:
              - path: /scripts
          sonarr:
            vlan-routes:
              - path: /scripts
          radarr:
            vlan-routes:
              - path: /scripts
          prowlarr:
            vlan-routes:
              - path: /scripts
          bazarr:
            vlan-routes:
              - path: /scripts
      library:
        type: persistentVolumeClaim
        existingClaim: media-library
        advancedMounts:
          sabnzbd:
            main:
              - path: /data
          sonarr:
            main:
              - path: /data
          radarr:
            main:
              - path: /data
          bazarr:
            main:
              - path: /data
          jellyfin:
            main:
              # Read-only: Jellyfin plays the library, it never writes to it.
              - path: /media
                readOnly: true
      jellyfin-config:
        type: persistentVolumeClaim
        existingClaim: jellyfin-config
        advancedMounts:
          jellyfin:
            main:
              - path: /config
      # Jellyfin's transcode scratch: deliberately NOT on NFS (transcodes are
      # throwaway, high-churn and would hammer the NAS).
      jellyfin-cache:
        type: emptyDir
        sizeLimit: 20Gi
        advancedMounts:
          jellyfin:
            main:
              - path: /cache
      # QuickSync device: the node's passthrough iGPU. Exposes card0 +
      # renderD128; Jellyfin picks VAAPI/QSV up from the container's
      # transcoding menu (no privileged mode, the image runs as root).
      dri:
        type: hostPath
        hostPath: /dev/dri
        hostPathType: Directory
        advancedMounts:
          jellyfin:
            main:
              - path: /dev/dri
      sabnzbd-config:
        type: persistentVolumeClaim
        existingClaim: sabnzbd-config
        advancedMounts:
          sabnzbd:
            main:
              - path: /config
            host-whitelist:
              - path: /config
      sonarr-config:
        type: persistentVolumeClaim
        existingClaim: sonarr-config
        advancedMounts:
          sonarr:
            main:
              - path: /config
            external-auth:
              - path: /config
      radarr-config:
        type: persistentVolumeClaim
        existingClaim: radarr-config
        advancedMounts:
          radarr:
            main:
              - path: /config
            external-auth:
              - path: /config
      prowlarr-config:
        type: persistentVolumeClaim
        existingClaim: prowlarr-config
        advancedMounts:
          prowlarr:
            main:
              - path: /config
            external-auth:
              - path: /config
      bazarr-config:
        type: persistentVolumeClaim
        existingClaim: bazarr-config
        advancedMounts:
          bazarr:
            main:
              - path: /config
            external-auth:
              - path: /config
