name: OpenTofu Plan

# Live planning against private Proxmox/Talos infrastructure.
# Requires NetBird VPN, the SOPS age key, and the state-encryption passphrase,
# so it deliberately does NOT run on pull requests from forks. It runs on:
#   - pushes to main that touch tofu/**
#   - manual dispatch
# Plan is read-only: it never mutates infrastructure.

on:
  push:
    branches:
      - main
    paths:
      - 'tofu/**'
      - '.github/workflows/tofu-plan.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tofu-state
  cancel-in-progress: false

jobs:
  plan:
    name: OpenTofu Plan
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: tofu
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to NetBird VPN Mesh
        uses: Alemiz112/netbird-connect@v1
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}

      - name: Setup Age Decryption Key
        run: |
          set -euo pipefail
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.7.2

      - name: Install SOPS & yq
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/sops \
            https://github.com/getsops/sops/releases/latest/download/sops-v3.9.1.linux.amd64
          sudo chmod +x /usr/local/bin/sops
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: OpenTofu Init
        env:
          SOPS_AGE_KEY_FILE: /home/runner/.config/sops/age/keys.txt
        run: |
          set -euo pipefail
          passphrase="$(sops -d secret.sops.yaml | yq '.state_encryption_passphrase')"
          export TF_ENCRYPTION="key_provider \"pbkdf2\" \"statekey\" { passphrase = \"${passphrase}\" }"
          tofu init -lockfile=readonly

      - name: OpenTofu Plan
        env:
          SOPS_AGE_KEY_FILE: /home/runner/.config/sops/age/keys.txt
        run: |
          set -euo pipefail
          passphrase="$(sops -d secret.sops.yaml | yq '.state_encryption_passphrase')"
          export TF_ENCRYPTION="key_provider \"pbkdf2\" \"statekey\" { passphrase = \"${passphrase}\" }"
          tofu plan -no-color -input=false -out=tofu.tfplan | tee plan.txt

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tofu-plan
          path: |
            tofu/tofu.tfplan
            tofu/plan.txt
          retention-days: 7
