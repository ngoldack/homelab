name: CI

# Lint only. Runs on every push and PR to main. Requires NO secrets, kubeconfig,
# VPN, or Proxmox access, and never deploys or mutates anything. All live
# operations (tofu apply, flux reconcile) are run manually from a workstation
# (see the Taskfile). This is purely static validation of the repo.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint
          file_or_dir: kubernetes/ tofu/

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2

      - name: Assert SOPS files are encrypted
        run: |
          set -euo pipefail
          # Every *.sops.yaml payload (not the .sops.yaml config) must carry a
          # top-level sops: block and at least one ENC[ value. Inspects ciphertext
          # only - no decryption key required.
          bad=0
          while IFS= read -r -d '' f; do
            if [ "$(basename "$f")" = ".sops.yaml" ]; then
              continue
            fi
            if grep -qE '^sops:' "$f" && grep -q 'ENC\[' "$f"; then
              echo "OK: $f"
            else
              echo "ERROR: unencrypted or malformed SOPS file: $f"
              bad=1
            fi
          done < <(find . -name '*.sops.yaml' -type f -print0)
          exit "$bad"

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Validate OpenTofu
        working-directory: tofu
        env:
          # Throwaway passphrase: init builds the pbkdf2 key eagerly, but no real
          # state is read or written during fmt/validate.
          TF_ENCRYPTION: >-
            key_provider "pbkdf2" "statekey" {
            passphrase = "ci-offline-validate-dummy-passphrase" }
        run: |
          set -euo pipefail
          tofu fmt -check -recursive
          tofu init -backend=false -lockfile=readonly
          tofu validate

      - name: Setup kustomize + kubeconform
        run: |
          set -euo pipefail
          kustomize_install="https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh"
          # GitHub runners now pre-install kustomize; install_kustomize.sh aborts
          # ("exists. Remove it first.") if the target is present, so clear it to
          # pin our version.
          sudo rm -f /usr/local/bin/kustomize
          curl -fsSL "$kustomize_install" | bash -s -- 5.4.3 /usr/local/bin
          kubeconform_url="https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz"
          curl -fsSL "$kubeconform_url" | tar -xz -C /usr/local/bin kubeconform

      - name: Validate Kubernetes manifests
        run: |
          set -euo pipefail
          for overlay in \
            kubernetes/clusters/production \
            kubernetes/infrastructure/controllers \
            kubernetes/infrastructure/configs \
            kubernetes/apps; do
            echo "==== $overlay ===="
            kustomize build "$overlay" \
              | kubeconform -strict -ignore-missing-schemas -summary
          done
