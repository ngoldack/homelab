# The public edge Gateway. App HTTPRoutes (in any namespace) attach here with a
# hostname under *.${DOMAIN}; Traefik terminates TLS with the wildcard cert and
# proxies to the backend Service over the KubeSpan mesh.
#
# VERIFY-BEFORE-DEPLOY: confirm Traefik maps the Gateway listener ports (443/80)
# to its web/websecure entrypoints (container 8443/8000, hostPort 443/80).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: traefik
spec:
  gatewayClassName: traefik
  listeners:
    - name: websecure
      protocol: HTTPS
      port: 443
      hostname: "*.${DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: web
      protocol: HTTP
      port: 80
      hostname: "*.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
