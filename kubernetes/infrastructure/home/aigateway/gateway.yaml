# The AI Gateway's Gateway. The ai-gateway-controller programs every Gateway
# under this class; AIGatewayRoute / MCPRoute resources attach here via
# parentRefs.
#
# The Gateway annotation aigateway.envoyproxy.io/gateway-config points the
# external processor of THIS gateway at the OTel config in otel-pipeline.yaml
# so spans land in Phoenix.
#
# Listener on :80. Envoy Gateway's generated Envoy Service is a LoadBalancer
# whose ip we reserve on the LAN pool (see envoyproxy.yaml), so clients reach
# this at the same port they would use in-cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: aigateway
  namespace: aigateway
spec:
  gatewayClassName: aigateway
  infrastructure:
    # REQUIRED for the EnvoyProxy CR below to be read at all: Envoy Gateway
    # only binds an EnvoyProxy through Gateway.spec.infrastructure.parametersRef
    # (or the GatewayClass's), or its lowest-priority config default — there is
    # NO "same name as the Gateway" auto-discovery in EG v1.8.x
    # (provider/kubernetes/controller.go: GetEnvoyProxy(gtw.Namespace,
    # gtw.Spec.Infrastructure.ParametersRef.Name)). Without this ref the
    # generated Service keeps defaults: no LAN VIP, no dns.ngoldack.de/scope
    # label, externalTrafficPolicy Local.
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: aigateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
