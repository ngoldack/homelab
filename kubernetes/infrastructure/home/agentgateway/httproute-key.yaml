# Key-authenticated variant of the chat chain: /v1/key/chat/completions
# routes to the same chat-chain backend, but its route-scoped policy
# (policy-apikey.yaml) accepts a static API key instead of an authentik JWT.
# Used by CLI consumers (opencode) whose base URL ends in /v1/key.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: local-llm-key
  namespace: agentgateway
spec:
  parentRefs:
    - name: agentgateway
      namespace: agentgateway
  rules:
    # Coding model: DeepSeek V4.1 Flash (OpenRouter).
    - matches:
        - path:
            type: PathPrefix
            value: /v1/key/chat
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: openrouter-deepseek-v41-flash
    # Free model: Union Alpha (OpenRouter stealth).
    - matches:
        - path:
            type: PathPrefix
            value: /v1/key/free
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: openrouter-union-alpha
    # Synthetic gpt-oss-120b: hindsight's extraction/consolidation model.
    # Walks the hindsight-chain backend (synthetic primary, OpenRouter
    # fallback on 429/5xx eviction); the JWT path /v1/synthetic-gpt-oss in
    # routes.yaml still pins the single synthetic backend.
    - matches:
        - path:
            type: PathPrefix
            value: /v1/key/synthetic-gpt-oss
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: hindsight-chain
    # Agent chains: synthetic-first with OpenRouter fallback (see
    # agent-chains.yaml). Each walks its own chain backend; a synthetic 429
    # evicts synthetic for 10 minutes (policy-agent-chains-health.yaml), so
    # agents keep working through OpenRouter while synthetic cools down.
    - matches:
        - path:
            type: PathPrefix
            value: /v1/key/general-purpose
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: general-purpose-chain
    - matches:
        - path:
            type: PathPrefix
            value: /v1/key/coding-small
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: coding-small-chain
    - matches:
        - path:
            type: PathPrefix
            value: /v1/key/coding-medium
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: coding-medium-chain
    - matches:
        - path:
            type: PathPrefix
            value: /v1/key/coding-large
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: coding-large-chain
