apiVersion: v1
kind: Namespace
metadata:
  name: authentik
  labels:
    # Pod Security Admission: audit+warn at `restricted`, enforcement left to
    # Talos' cluster default (`baseline`). Restricted-level drift becomes
    # visible in the API audit log, in kubectl warnings and in Kyverno's
    # PolicyReports without being able to reject a pod; the flip to
    # `enforce: restricted` is a per-namespace decision once those reports are
    # clean.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # Both Gateway gates: `public-ingress` so the internal route can attach to
    # the LAN VIP Gateway, `edge-ingress` so the portal + outpost routes can
    # attach to the Hetzner Gateway. See network/gateway.yaml + edge.yaml.
    gateway.ngoldack.de/public-ingress: "true"
    gateway.ngoldack.de/edge-ingress: "true"
