---
# Security-orchestrator support tools. kagent has no built-in policy/audit tool;
# these would be a small custom MCP. NOTE: kagent cannot force calls through a
# policy gate at runtime, so these are advisory/audit only (see README).
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: policy-evaluator
  namespace: kagent
spec:
  description: "STUB: evaluate a tool/agent request against the policy table. Advisory only."
  protocol: STREAMABLE_HTTP
  url: "http://policy-evaluator-mcp.kagent.svc.cluster.local:8080/mcp"
  timeout: 30s
  terminateOnClose: true
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: audit-log
  namespace: kagent
spec:
  description: "STUB: append security decisions to a persistent audit trail. Build a small append-only MCP."
  protocol: STREAMABLE_HTTP
  url: "http://audit-log-mcp.kagent.svc.cluster.local:8080/mcp"
  timeout: 30s
  terminateOnClose: true
