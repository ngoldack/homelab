# Created here rather than in ../monitoring/ because this Kustomization is
# applied first and its HelmRelease already targets this namespace. The
# monitoring Kustomization depends on this one, so the namespace is guaranteed
# to exist by the time the stack lands.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # Talos ships a cluster-wide PodSecurity admission default of "baseline"
    # (exempting only kube-system), so a namespace with no pod-security labels
    # silently inherits it. baseline forbids exactly the things node-exporter
    # exists to use — hostNetwork, hostPID, hostPath mounts of /proc, /sys and
    # /, and hostPort 9100 — and the DaemonSet controller cannot create pods at
    # all. The failure is quiet in the worst way: the DaemonSet reports
    # DESIRED=5 CURRENT=0 and no pod is ever created, so there is nothing to
    # look at with `kubectl logs`; the reason lives only in the DaemonSet's
    # events. Reading host CPU/memory/disk/network for every node is the whole
    # point of node-exporter, so the namespace has to permit it.
    # Lets the Grafana HTTPRoute attach to the public Gateway. The name says
    # "public-ingress" because that is the Gateway's own gate; Grafana is
    # reachable only on the LAN, via local DNS.
    gateway.ngoldack.de/public-ingress: "true"
    # grafana is edge-SERVED (route to the outpost); its public DNS entry is
    # the Hetzner address — see network/edge.yaml + external-dns-edge.
    gateway.ngoldack.de/edge-ingress: "true"
    pod-security.kubernetes.io/enforce: privileged
    # enforce is relaxed, but audit and warn are deliberately left at baseline
    # so anything ELSE in this namespace that starts demanding host access
    # still shows up — as a warning on apply — instead of the exemption quietly
    # covering the whole namespace forever. It will NOT appear in a Kyverno
    # report: this namespace is in every policy's exclude list. And the cluster
    # runs no kube-apiserver audit policy, so the `audit:` level below records
    # nothing yet either.
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
