apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: langfuse-postgres
  namespace: langfuse
spec:
  instances: 1

  # Set up a volume claim spec
  storage:
    size: 10Gi
    storageClass: tns-csi-fast-nfs

  # Database configuration
  bootstrap:
    initdb:
      database: langfuse
      owner: langfuse
      # The credentials will be auto-generated by the operator or we can supply an explicit user/password secret.
      # The operator creates a secret named `<cluster-name>-app` containing username & password.
