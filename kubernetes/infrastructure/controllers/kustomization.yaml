apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Helm chart sources (HelmRepository definitions) consumed by the controllers below
  - sources.yaml
  # Networking & CRDs
  - gateway-api
  - cilium
  # Certificates
  - cert-manager
  # Storage
  - storage/local-path
  - storage/tns-csi
  # Observability
  - observability
  # Security & runtime enforcement
  - security
  - tetragon
  # Networking overlay
  - netbird
  # Data operators
  - cnpg-operator
  - cnpg-barman-plugin
  - valkey-operator
  # AI/ML autoscaling (KEDA; vLLM is served as plain Deployments, reached directly)
  - keda
  # Object storage (SeaweedFS: S3-compatible, embedded IAM, CRD-driven buckets/users)
  - seaweedfs-operator
  # AI agent control plane (kagent + khook event triggers)
  - kagent
  - khook
  # Platform services
  - backup
  - headlamp
