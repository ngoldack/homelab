# The monitoring core: VictoriaMetrics (vmsingle + vmagent + vmalert),
# Alertmanager, node-exporter, kube-state-metrics and Grafana, from the
# victoria-metrics-k8s-stack umbrella chart.
#
# Why the umbrella chart rather than the operator plus hand-written CRs: the
# stack ships the scrape configuration for kubelet, cAdvisor, kube-apiserver,
# CoreDNS, kube-state-metrics and node-exporter, plus the RBAC each of those
# needs. Hand-rolling that is dozens of bespoke VMServiceScrape/VMNodeScrape
# objects to write and keep correct across upgrades, for no control worth
# having. (The repo's hand-roll-it rule came from a vendored OpenTofu module
# that hid resource wiring — it is not a rule against Helm charts, which this
# repo already uses for cert-manager, external-dns, truenas-csi and nvidia.)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: flux-system
  annotations:
    # Nothing in this manifest uses ${VAR} templating any more (root_url is
    # a literal), and the grafana.ini now carries Grafana's own $__env{...}
    # interpolation — which Flux's strict envsubst would otherwise try to
    # resolve and fail the whole Kustomization with "variable not set
    # (strict mode): __env" (same class of breakage documented on every
    # dashboard ConfigMap in kustomization.yaml). Opt this release out.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  interval: 1h
  timeout: 20m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: "0.92.1"
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
      interval: 1h
  targetNamespace: monitoring
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Chart-conformance: syncJob runs a network-fetch hook Job (plus its own
    # ServiceAccount/ClusterRole) on every install/upgrade to populate the
    # defaultDashboards/defaultRules it is NOT gated on — which are both off
    # here. It would add an egress dependency and cluster-wide RBAC for
    # zero effect, so disable it.
    syncJob:
      enabled: false

    # Talos does not expose these control-plane endpoints the way the chart's
    # default scrape config expects, so they stay `down` forever and pollute
    # the Kubernetes Views APIServer/control-plane panels:
    #   - kubeEtcd: no service endpoints at all (Talos etcd wants client certs,
    #     not the chart's bearer-token + CA path). Confirmed: zero etcd targets.
    #   - kubeControllerManager / kubeScheduler: :10257/:10259 connection
    #     refused (Talos serves no http-metrics on those ports).
    # (kubeApiServer + kubelet + coredns remain enabled and healthy.)
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false

    # kube-apiserver /metrics on a busy cluster exceeds the chart default
    # max_scrape_size (16777216 bytes / 16 MiB) — confirmed live: the apiserver
    # target is perpetually `down` with "exceeds -promscrape.maxScrapeSize".
    # Raise the per-endpoint ceiling to 50 MiB, matching the kube-prometheus
    # default for apiserver scrapes and ~3x headroom over the failing response,
    # so the control-plane is actually collected. (Setting the global vmagent
    # -promscrape.maxScrapeSize would apply to every target and buy unbounded
    # memory; scoping it to this one endpoint is deliberate.) The value must be
    # a plain byte count, NOT a "50Mi" suffix string: the vmagent promscrape
    # engine parses max_scrape_size with strconv.ParseFloat and rejects any
    # "50Mi"/"50MB" form ("invalid syntax"), silently skipping the whole scrape
    # job (confirmed live in vmagent logs). 52428800 = 50 MiB exactly.
    kubeApiServer:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              max_scrape_size: "52428800"

    victoria-metrics-operator:
      # The CRDs come from the standalone victoria-metrics-operator-crds
      # release (../monitoring-crds/), so the operator subchart must not also
      # try to install them — two Helm releases owning the same 25 cluster
      # scoped objects is a fight neither wins cleanly.
      #
      # Note the umbrella overrides the operator subchart's own default here:
      # standalone the operator ships crds.plain=false, but this chart's values
      # set crds.plain=true. With crds.enabled=false that distinction is moot,
      # but it is exactly the kind of override that makes a values snippet
      # copied from the operator chart's docs behave differently here.
      crds:
        enabled: false
        plain: false

    # vmsingle, not vmcluster. vmcluster splits into vminsert/vmselect/vmstorage
    # for horizontal scale and HA that a five-node homelab has no use for; it
    # triples the moving parts and the failure modes for the same data.
    vmsingle:
      enabled: true
      spec:
        # MONTHS, not days. VictoriaMetrics' retentionPeriod is month-based
        # when it carries no unit suffix, so "3" is three months — a bare
        # number copied from a Prometheus config meaning days would silently
        # retain ~90x too much. Deliberately conservative to start: all three
        # TrueNAS StorageClasses set allowVolumeExpansion, so this and the PVC
        # can both grow once real cardinality is known. VictoriaMetrics'
        # own guidance is to size from a live burn-in rather than a formula.
        retentionPeriod: "3"
        # Graphite plaintext listener for the TrueNAS Metrics/Graphite reporter
        # (homelab-infra-metrics/INFRA.md). Prom remote_write + InfluxDB line
        # protocol (PVE/PBS) already answer on the :8428 Service without this.
        extraArgs:
          graphiteListenAddr: ":2003"
        # Pinned to the home site, and this is load-bearing rather than
        # tidiness. All TrueNAS StorageClasses reach the NAS at 10.20.10.10,
        # which is not routable from the Hetzner ingress node across KubeSpan —
        # the same reachability limit truenas-csi's own node DaemonSet is
        # pinned for. Losing this selector does not degrade performance, it
        # hangs the pod unable to mount.
        nodeSelector:
          topology.homelab/site: home
        storage:
          accessModes:
            - ReadWriteOnce
          # NFS, deliberately and temporarily, and this is the weakest choice
          # in this file.
          #
          # truenas-fast-nvmeof is the right substrate for a TSDB — small
          # random writes and frequent fsync are what block storage is for, and
          # VictoriaMetrics advises against NFS for its data directory, with a
          # reported corruption risk on unclean shutdown.
          #
          # It is not usable yet, and NOT for the reason it first appeared.
          # Every layer was cleared by hand from the node's own CSI container:
          # the subsystem is set to "All hosts are allowed", `nvme discover`
          # against 10.20.10.10:4420 returns the expected subsystem, and
          # `nvme connect` establishes it — creating /dev/nvme0n1 and the
          # by-id symlink nvme-uuid.<ns-uuid> that the driver looks for. So the
          # transport, the target and the host permissions are all fine; what
          # fails is only the driver's own post-connect wait, which gives up
          # after ~9s with "device did not appear after connect". Retry this
          # before assuming anything is broken on the NAS: the earlier attempts
          # ran while the container still had no stable host NQN, and that has
          # since been fixed (see ../truenas-csi/helmrelease.yaml).
          #
          # Switch this back to truenas-fast-nvmeof once that is done. Because
          # storageClassName is immutable on a bound PVC, the change means
          # deleting the PVC so the operator recreates it — and every TrueNAS
          # StorageClass is reclaimPolicy: Retain, so the old volume is kept on
          # the NAS rather than deleted, leaving the historical data
          # recoverable but also orphaned until cleaned up by hand.
          storageClassName: truenas-fast-nfs-monitoring-vmsingle
          resources:
            requests:
              storage: 50Gi
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 4Gi
    vmcluster:
      enabled: false

    vmagent:
      enabled: true
      spec:
        # Leave selectAllByDefault on (chart default) so any VMServiceScrape,
        # VMPodScrape, VMNodeScrape, VMStaticScrape, VMProbe or VMScrapeConfig
        # created anywhere in the cluster is scraped without per-object label
        # wiring. Exporters added later need only their scrape object.
        selectAllByDefault: true
        nodeSelector:
          topology.homelab/site: home
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi

    vmalert:
      enabled: true
      spec:
        nodeSelector:
          topology.homelab/site: home

    alertmanager:
      enabled: true
      spec:
        nodeSelector:
          topology.homelab/site: home

    # VictoriaLogs: the log half of the stack, declared through the same
    # operator that runs vmsingle (VLSingle/VLAgent CRDs ship in
    # ../monitoring-crds/). No custom log shipper is needed: the chart's
    # VLAgent supports an operator-managed k8s collector DaemonSet reading
    # /var/log/pods, and the chart auto-wires its remoteWrite to vlsingle's
    # /insert/native (verified by helm template). This replaces the upstream
    # defaultRules/defaultDashboards network-fetch trade-off too — nothing here
    # pulls from the internet at sync time, though Grafana fetches the logs
    # datasource plugin at pod start (see the grafana.plugins note below).
    vlsingle:
      enabled: true
      spec:
        # DAYS, explicit. The chart default "1" carries no unit suffix, which
        # means MONTHS — the same unsigned-integer gotcha as vmsingle's
        # retentionPeriod, pointed the other way. 14 days is a generous
        # debugging window for a homelab and keeps the NFS volume small;
        # bump as real usage shows.
        retentionPeriod: "14d"
        # Same substrate as vmsingle: the monitoring-dedicated TrueNAS NFS
        # class (allowVolumeExpansion=true, so this can grow). The nvmeof
        # migration caveat in vmsingle's storage comment applies to this PVC
        # equally.
        nodeSelector:
          topology.homelab/site: home
        storage:
          accessModes:
            - ReadWriteOnce
          storageClassName: truenas-fast-nfs-monitoring-vmsingle
          resources:
            requests:
              storage: 20Gi
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi

    vlagent:
      enabled: true
      spec:
        k8sCollector:
          enabled: true
          # Also stream pod labels through as kubernetes.pod_labels.* — cheap
          # enrichment that lets dashboards filter by app=... instead of only
          # namespace/pod/container.
          includePodLabels: true
        # Deliberately no nodeSelector, and tolerate ALL NoSchedule taints
        # (operator: Exists) — for the same reason prometheus-node-exporter
        # below must not be pinned: pod logs exist on every node, including
        # the arm64 Hetzner ingress node (dedicated=ingress), the nvidia node
        # and the control-plane node. The vlagent image is multi-arch (amd64
        # + arm64 verified against the registry) and the collector streams to
        # vlsingle over the in-cluster Service, so it can run on nodes that
        # cannot reach the NAS.

        # Resources are left at the operator's VLAgent defaults (requests
        # 64Mi/250m, limits 128Mi/500m per VM_VLAGENTDEFAULT_* — documented in
        # docs.victoriametrics.com/operator/resources/vlagent/), which are
        # deliberately modest for a log collector on every node.
        tolerations:
          - operator: Exists

    # OFF for the same reason as defaultDashboards below, ...
    # explicit about because "no alerting rules" looks like an oversight.
    #
    # defaultRules does not embed rules in the chart. It renders a sync-job
    # (helm.sh/hook: post-install,post-upgrade) that fetches PrometheusRule
    # YAML over the network on every install and every upgrade, from unpinned
    # branch tips:
    #   raw.githubusercontent.com/prometheus-operator/kube-prometheus/main/...
    #   raw.githubusercontent.com/monitoring-mixins/website/master/...
    # Two consequences this repo cannot accept. First, reproducibility: two
    # applies a month apart produce different alerting rules from identical
    # git state, which is exactly what "reproducible from the repo" rules out.
    # Second, availability: the fetch is a Helm hook, so a reconcile with no
    # egress to GitHub fails the whole HelmRelease rather than degrading.
    #
    # Rules are vendored into this repo as VMRule objects at a known
    # revision: rules.yaml carries `data-protection` (CNPG backup/WAL health)
    # and the `hermes-sandbox` group (Hermes/Kata warm pool, gateway,
    # sandbox eviction and shared-node pressure alerts), with their targets
    # defined in scrapes.yaml. Alerting therefore no longer depends on this
    # chart's network-fetching defaultRules, which stay off.
    defaultRules:
      enabled: false

    # OFF on purpose, and not because dashboards are unwanted.
    #
    # The chart populates these through a sync-job that fetches dashboard JSON
    # over the network at run time from raw.githubusercontent.com URLs pointing
    # at master branches — unpinned, unverified, re-fetched on every sync. That
    # is a live network dependency and a supply-chain path for arbitrary JSON
    # rendered in a browser holding a Grafana session, and it means the cluster
    # is not reproducible from this repo alone. Dashboards are instead vendored
    # into the repo as ConfigMaps and picked up by the sidecar below, so every
    # dashboard is a reviewable, diffable file at a known revision.
    defaultDashboards:
      enabled: false

    grafana:
      enabled: true
      # Grafana builds redirects and absolute links from root_url. Without it
      # it assumes localhost:3000 and OAuth/redirect flows and some panel
      # share-links point at the wrong host once it is behind the Gateway.
      grafana.ini:
        server:
          root_url: "https://grafana.ngoldack.de"
        # SSO via authentik (OIDC application seeded in
        # ../authentik/seed.yaml — client id "grafana", redirect_uri
        # /login/generic_oauth). The secret arrives through envFromSecret
        # below; $__env{...} is Grafana's in-INI env interpolation.
        # auto_login stays OFF: the login page keeps the local admin form,
        # so a broken OIDC app is never a lockout.
        auth:
          oauth_auto_login: false
        "auth.generic_oauth":
          enabled: true
          name: authentik
          client_id: grafana
          client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
          auth_url: https://authentik.ngoldack.de/application/o/authorize/
          token_url: https://authentik.ngoldack.de/application/o/token/
          api_url: https://authentik.ngoldack.de/application/o/userinfo/
          scopes: openid profile email groups
          email_attribute_path: email
          # authentik puts group NAMES in the token (groups_on_token_claims);
          # grafana-admins group members get the Admin role, everyone else
          # Viewer — deny-by-default, upgrade by group membership.
          role_attribute_path: "contains(groups[*], 'grafana-admins') && 'Admin' || 'Viewer'"
          allow_sign_up: true
      # envFromSecret is the community Grafana chart's documented single-
      # secret injection; the value mirrors authentik's OAuthProvider
      # client_secret (both halves generated from one literal — see the two
      # sops files).
      envFromSecret: grafana-authentik
      nodeSelector:
        topology.homelab/site: home
      # The sidecar watches for ConfigMaps carrying this label and drops their
      # contents into Grafana's provisioning directory — this is what makes
      # "dashboards declared in git" work without a second operator and its
      # CRDs. Add a dashboard by committing a ConfigMap with
      # `grafana_dashboard: "1"`; there is nothing else to wire.
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL
        datasources:
          enabled: true
      # The VictoriaLogs datasource is the victoriametrics-logs-datasource
      # plugin, which is NOT bundled in the stock grafana image. Declaring it
      # in `plugins:` makes the community subchart preinstall it at container
      # start (GF_PLUGINS_PREINSTALL_SYNC in the rendered grafana Deployment —
      # verified by helm template); no custom image is required. It is exactly
      # the same mechanism the upstream chart's defaultDatasources uses, and
      # the datasource entry for it is emitted automatically by the chart when
      # vlsingle is enabled (uid "VictoriaLogs", URL pointing at the vlsingle
      # Service). Grafana needs egress to registry.grafana.com or the plugin
      # feed once at pod start to fetch it.
      plugins:
        - victoriametrics-logs-datasource
      # No Ingress/HTTPRoute. Reaching this is an unresolved decision — the
      # standing policy keeps internal services off the public edge rather
      # than exposing home addresses, and attaching it to the public Cilium Gateway
      # would put a credentialed UI on the internet. Until that is settled,
      # access is via `kubectl -n monitoring port-forward svc/<grafana> 3000`.
      ingress:
        enabled: false

    # Runs on every node, including the arm64 Hetzner ingress node. Its own
    # chart default toleration is {effect: NoSchedule, operator: Exists} with
    # NO key, which tolerates every NoSchedule taint in this cluster —
    # dedicated=ingress, dedicated=nvidia and the control-plane
    # taint alike. So it is deliberately left at defaults and must NOT be given
    # a nodeSelector: pinning it to the home site would silently drop the
    # ingress node's OS metrics, and adding per-taint tolerations would be
    # redundant. Verified against the subchart's values.yaml.
    prometheus-node-exporter:
      enabled: true

    kube-state-metrics:
      enabled: true
      nodeSelector:
        topology.homelab/site: home
