# KEDA http-add-on: wake on-demand models from zero on the first HTTP request.
# The interceptor buffers the request, scales the target Deployment 0 -> 1,
# then forwards once the pod is Ready. Cilium HTTPRoutes for these models point
# at the shared interceptor proxy service (see gateway.yaml).
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: llama-8b
  namespace: vllm
spec:
  hosts:
    - llama.vllm.home.arpa
  scaleTargetRef:
    name: llama-8b-predictor
    kind: Deployment
    apiVersion: apps/v1
    service: llama-8b-predictor
    port: 80
  replicas:
    min: 0
    max: 1
  scaledownPeriod: 600
---
