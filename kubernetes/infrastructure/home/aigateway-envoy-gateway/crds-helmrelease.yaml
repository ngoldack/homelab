# Envoy-specific CRDs for Envoy Gateway (gateway.envoyproxy.io group: Backend,
# EnvoyProxy, BackendTrafficPolicy, etc.), installed from gateway-crds-helm
# with ONLY crds.envoyGateway.enabled. The standard Gateway API CRDs
# (gateway.networking.k8s.io) are deliberately excluded here (crds.gatewayAPI
# enabled=false): this repo owns them in tofu (tofu/home/gateway-api-crds.tf,
# chart pinned v1.6.1) and they are applied by cilium-operator at startup.
#
# This split is REQUIRED, not cosmetic: gateway-helm v1.8.1 bundles the
# standard Gateway API CRDs at bundle v1.5.1 (tcproutes serves v1alpha2 only),
# which conflicts with the tofu-installed v1.6.1 copies (tcproutes serves
# v1+v1alpha2, stored v1) — a server-side-apply storedVersions rejection that
# fails the whole envoy-gateway HelmRelease install. So the CRDs come from
# their own dedicated chart, and the envoy-gateway HelmRelease installs with
# skipCRDs to stop the overlap. Ordering is CRD-before-CR: this lane's
# kustomization lists this HelmRelease FIRST, installed to flux-system before
# the envoy-gateway control plane reconcilers use the CRs.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway-crds
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: gateway-crds-helm
      version: "v1.8.1"
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
      interval: 1h
  values:
    crds:
      gatewayAPI:
        enabled: false
      envoyGateway:
        enabled: true
