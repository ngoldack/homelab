# agentgateway allowlist — the only traffic that may cross the default-deny baseline.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentgateway-allowlist
  namespace: agentgateway
spec:
  endpointSelector:
    matchLabels: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentgateway
    - fromEntities:
        - ingress
        - health
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
    # In-cluster OTLP senders (every app exporting traces/metrics) — OTLP only;
    # the proxy's own listeners are scoped by the rules below, not to every pod.
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - {port: "4317", protocol: TCP}
            - {port: "4318", protocol: TCP}
    # In-cluster :80 clients of the proxy: hermes (config.yaml base_url
    # http://agentgateway.../v1) and hindsight (helmrelease base_url
    # .../v1/synthetic-gpt-oss).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes
      toPorts:
        - ports:
            - {port: "80", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hindsight
      toPorts:
        - ports:
            - {port: "80", protocol: TCP}
    # LibreChat (chat.ngoldack.de) calls the static-key scope
    # (/v1/key/*) on this proxy's in-cluster :80 listener, carrying an
    # X-Api-Key from the agentgateway-api-keys Secret (identifier `librechat`).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: librechat
      toPorts:
        - ports:
            - {port: "80", protocol: TCP}
    # The authentik proxy outpost (agentgateway.ngoldack.de UI) reaches the
    # agentgateway-ui Service on :15000. The controller-generated Service only
    # publishes listener port 80; ui-service.yaml adds the 15000 listener.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - {port: "15000", protocol: TCP}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentgateway
    # Model backends: the only in-cluster backend is the llmkube KV broker in
    # front of the llama.cpp InferenceService (backends.yaml:
    # llama-kv-broker.llmkube-system.svc:8080), so this is scoped to that
    # namespace instead of every cluster endpoint.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: llmkube-system
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
    # JWT validation: the gateway fetches the OIDC provider's JWKS from
    # authentik's server/portal ports in the authentik namespace (observed as
    # a sustained denied flow when this rule was missing).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - {port: "9000", protocol: TCP}
            - {port: "9443", protocol: TCP}
    # Trace export: the OTel collector (otel-collector.yaml, this namespace)
    # posts spans to langfuse-web:3000/api/public/otel. Langfuse's own
    # allowlist already accepts this namespace as an OTLP sender; the client
    # half is required too, or the collector's exports are dropped silently.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: langfuse
      toPorts:
        - ports:
            - {port: "3000", protocol: TCP}
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    - toCIDRSet:
        - cidr: 10.30.0.10/32
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    - toCIDRSet:
        - cidr: 172.21.0.0/16
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    # Upstream model providers (OpenRouter etc.) and OTLP export.
    - toEntities:
        - world
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
