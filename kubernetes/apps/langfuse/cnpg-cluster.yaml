# Langfuse's own CloudNativePG cluster (app data; no pgvector needed - analytics
# live in ClickHouse). Its own instance + credentials, backed up to Hetzner DR.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: langfuse-postgres
  namespace: langfuse
spec:
  instances: 1
  storage:
    size: 10Gi
    storageClass: tns-fast-nvmeof
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: langfuse-backup-store
  bootstrap:
    initdb:
      database: langfuse
      owner: langfuse
      secret:
        name: langfuse-postgres-credentials
