# Official SeaweedFS operator (github.com/seaweedfs/seaweedfs-operator).
# Installs the Seaweed / SeaweedCSIDriver CRDs, the operator Deployment, RBAC,
# and a cert-manager-issued webhook (cluster already runs cert-manager).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs-operator
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: seaweedfs-operator
      version: "0.1.42"
      sourceRef:
        kind: HelmRepository
        name: seaweedfs-operator
      interval: 1h
  targetNamespace: seaweedfs-operator
  releaseName: seaweedfs-operator
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values: {}