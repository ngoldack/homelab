# agent_sandbox Hermes config — reference shape for the runtime config.yaml
# (the live file is the hermes/configmap.yaml, mounted over /opt/data).
# ``plugins.enabled`` is the opt-in allow-list Hermes reads
# (plugins_discovery._get_enabled_plugins); the plugin registers via the
# hermes_agent.plugins entry-point group, so no file placement is needed.
plugins:
  enabled:
    - agent_sandbox
terminal:
  backend: agent_sandbox
  cwd: /workspace
  timeout: 300
  persistent_shell: false
