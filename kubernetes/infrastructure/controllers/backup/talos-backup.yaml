# Official Sidero Labs talos-backup tool (https://github.com/siderolabs/talos-backup).
# Takes an etcd snapshot via the in-cluster Talos API, age-encrypts it, and uploads
# it to the OVH Object Storage (S3) DR bucket. Replaces the previous hand-rolled CronJob.
#
# In-cluster Talos API access is granted by the controlplane machine-config patch
# (tofu/talos.tf -> machine.features.kubernetesTalosAPIAccess) which allows the
# `os:etcd:backup` role for pods in the `velero` namespace. The Talos node controller
# materialises the requested credentials into the `talos-backup-secrets` secret which
# is projected into the pod at /var/run/secrets/talos.dev.
---
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-backup-secrets
  namespace: velero
spec:
  roles:
    - os:etcd:backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: talos-backup
  namespace: velero
spec:
  # Daily at 03:00 (1 hour after Velero's daily backup).
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # Fail the job (and surface it) rather than retry forever on a broken backup.
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: talos-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: talos-backup
              # renovate: datasource=github-releases depName=siderolabs/talos-backup
              image: ghcr.io/siderolabs/talos-backup:v0.1.0-beta.3
              imagePullPolicy: IfNotPresent
              workingDir: /tmp
              command:
                - /talos-backup
              env:
                # S3 (OVH Object Storage) destination — offsite DR, shared bucket.
                - name: CUSTOM_S3_ENDPOINT
                  # CHANGEME: OVH S3 endpoint for the chosen region.
                  value: "https://s3.gra.io.cloud.ovh.net"
                - name: USE_PATH_STYLE
                  value: "true"
                - name: AWS_REGION
                  # CHANGEME: OVH region (e.g. gra, sbg, de, waw, bhs).
                  value: "gra"
                - name: BUCKET
                  # CHANGEME: OVH Object Storage bucket name.
                  value: "changeme-ovh-dr-bucket"
                - name: S3_PREFIX
                  value: "etcd-backups"
                - name: CLUSTER_NAME
                  value: "homelab-talos"
                # zstd-compress the snapshot before encrypting/uploading.
                - name: ENABLE_COMPRESSION
                  value: "true"
                # age recipient (homelab key). The matching private key decrypts the
                # snapshot during disaster recovery (see docs/disaster-recovery.md).
                - name: AGE_RECIPIENT_PUBLIC_KEY
                  value: "age1h3lgj5t47k5vx67ck9gztwa7kr8pafzlnk725p82nvlvhn8z9g0qze7alf"
                # S3 credentials (split keys, not the Velero INI blob).
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: talos-backup-s3
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: talos-backup-s3
                      key: AWS_SECRET_ACCESS_KEY
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: talos
                  mountPath: /.talos
                - name: talos-secrets
                  mountPath: /var/run/secrets/talos.dev
          volumes:
            - name: tmp
              emptyDir: {}
            - name: talos
              emptyDir: {}
            - name: talos-secrets
              secret:
                secretName: talos-backup-secrets
