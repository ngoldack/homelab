# LAN-only exposure on the internal Gateway (10.30.0.200, publish=lan so the
# LAN external-dns instance owns both records). Two hosts, not one path-split:
# the Next.js control plane would need a base-path rewrite dance to share a
# host with the API, and the API wants the clean root for its SDKs.
#
# hindsight.ngoldack.de        → API :8888   (agents, CLI, SDK clients)
# hindsight-ui.ngoldack.de     → control plane :3000 (browser dashboard;
#                                proxies the API internally, no auth hop)
#
# Deliberately NOT on the edge Gateway: the self-hosted API has no auth layer
# of its own (multi-tenant auth is a custom TenantExtension), so it stays on
# the trusted network. Clients outside the LAN reach it through Teleport.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hindsight-api
  namespace: hindsight
  labels:
    dns.ngoldack.de/publish: lan
spec:
  parentRefs:
    - name: public
      namespace: network
      sectionName: https-apex
  hostnames:
    - hindsight.${CLUSTER_DOMAIN}
  rules:
    - backendRefs:
        - name: hindsight-api
          port: 8888
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hindsight-ui
  namespace: hindsight
  labels:
    dns.ngoldack.de/publish: lan
spec:
  parentRefs:
    - name: public
      namespace: network
      sectionName: https-apex
  hostnames:
    - hindsight-ui.${CLUSTER_DOMAIN}
  rules:
    - backendRefs:
        - name: hindsight-control-plane
          port: 3000
