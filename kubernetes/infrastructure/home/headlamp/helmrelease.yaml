apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
  labels:
    # Required before httproute.yaml can attach to the public Gateway. Despite
    # the label name this is LAN-only: the hostname exists solely in local DNS.
    gateway.ngoldack.de/public-ingress: "true"
    # Separate gate for the edge Gateway (Hetzner VIP): headlamp is reachable
    # there only through the authentik outpost — see httproute-edge.yaml and
    # the SECURITY NOTE in httproute.yaml, which this satisfies.
    gateway.ngoldack.de/edge-ingress: "true"
    # Pod Security Admission: audit+warn at `restricted`, enforcement left to
    # Talos' cluster default (`baseline`) — drift is reported, nothing is
    # rejected. Same posture as the app namespaces.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 1h
  dependsOn:
    - name: cert-manager
  chart:
    spec:
      chart: headlamp
      version: "0.45.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
      interval: 1h
  targetNamespace: headlamp
  values:
    config:
      watchPlugins: true
      # Native per-user OIDC login via authentik (see ../authentik/seed.yaml
      # headlamp-oidc provider). externalSecret injects the whole Secret as
      # OIDC_* env (chart envFrom); the non-secret OIDC fields are read from
      # config.oidc.* to toggle the matching args. Client secret + issuer live
      # in headlamp-oidc.sops.yaml and MUST match the authentik provider.
      oidc:
        externalSecret:
          enabled: true
          name: headlamp-oidc
          hasScopes: true
        callbackURL: https://headlamp.ngoldack.de/oidc-callback
        usePKCE: true
        validatorClientID: headlamp-oidc
        validatorIssuerURL: https://authentik.ngoldack.de/application/o/headlamp-oidc
    pluginsManager:
      enabled: true
      baseImage: node:lts-alpine
      version: latest
      configContent: |
        plugins:
          - name: headlamp_flux
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
            version: 0.7.0
          - name: headlamp_cert-manager
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
            version: 0.1.1
          - name: headlamp_keda
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_keda
            version: 0.1.2
        installOptions:
          parallel: true
          maxConcurrent: 3
    # Not exposed on the public Gateway: this chart's pod ServiceAccount is
    # bound to cluster-admin, and no OIDC provider is configured here (the
    # chart supports real per-user OIDC login — config.oidc.* — but that
    # needs an external IdP client the operator sets up first). Reach it via
    # `kubectl -n headlamp port-forward` until an OIDC provider is wired up;
    # re-enable httpRoute (parentRefs: [{name: public, namespace: network}],
    # hostnames: [headlamp.network.svc.${CLUSTER_DOMAIN}]) only once it is.
    httpRoute:
      enabled: false
