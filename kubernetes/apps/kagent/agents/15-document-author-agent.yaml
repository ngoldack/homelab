# 15 — Document Author Agent (Tier 2): turns cited research into polished
# deliverables. Delegates rendering to its specialists.
#
# TODO wire carbone + gotenberg + filesystem-write (output dir only) — stubs in
# mcp-servers/scaffolds.yaml / document-tools.yaml. Rendering currently flows
# through the specialist sub-agents (also pending their MCP bridges).
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: document-author-agent
  namespace: kagent
spec:
  type: Declarative
  description: "Tier 2 worker: author polished DOCX/PDF/XLSX deliverables from structured content."
  declarative:
    modelConfig: local-qwen-main
    systemMessage: |
      You are a professional document author. You receive structured content and
      produce polished deliverables.

      Decision logic:
      - DOCX / editable -> use carbone with the standard report template.
      - PDF distribution -> draft Markdown, convert via pdf-converter-specialist.
      - XLSX / tabular -> delegate to spreadsheet-specialist.

      Quality standards:
      - Clear heading hierarchy. Tables for 3+ comparable items. Bullets only for
        genuinely list-like content.
      - Executive summary for documents over 1000 words.
      - Professional, concise language.
      - Deliver files to /output/artifacts/ always.
    tools:
      - type: Agent
        agent:
          name: pdf-converter-specialist
      - type: Agent
        agent:
          name: spreadsheet-specialist
