# Paperless-ngx DMS: web (webserver+consumer run in-process in the single
# app-template deployment) + separate gotenberg/tika OCR sidecars, on CNPG
# postgres + valkey + TrueNAS storage. Depends on cnpg-operator for the
# Cluster CRDs, on valkey-operator for the ValkeyCluster CR, and on network
# for the edge Gateway its HTTPRoute attaches to. No monitoring-crds
# dependency: there is no metrics endpoint to scrape.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/infrastructure/home/paperless
  prune: true
  wait: false
  timeout: 15m
  retryInterval: 2m
  dependsOn:
    - name: cnpg-operator
    - name: network
    - name: valkey-operator
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
