apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: monitoring
  chart:
    spec:
      chart: grafana
      version: "10.5.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    admin:
      existingSecret: "grafana-admin-credentials"
      passwordKey: "admin-password"

    # ── Authentik SSO (OpenID Connect via generic_oauth) ───────────────────
    # NOTE: this HelmRelease lives in the infra-controllers layer, which has no
    # Flux postBuild var substitution (enabling it would clobber the
    # ${datasource}/${DS_VICTORIAMETRICS} tokens in the dashboard JSON). The
    # public domain is therefore written literally here; only the client secret
    # is sourced from SOPS via envValueFrom.
    grafana.ini:
      server:
        root_url: https://grafana.netbird.ngoldack.xyz
      auth.generic_oauth:
        enabled: true
        name: Authentik
        client_id: grafana
        scopes: "openid email profile"
        auth_url: https://auth.ngoldack.xyz/application/o/authorize/
        token_url: https://auth.ngoldack.xyz/application/o/token/
        api_url: https://auth.ngoldack.xyz/application/o/userinfo/
        # Authentik returns groups; map the akadmin group to Grafana admin.
        role_attribute_path: "contains(groups[*], 'authentik Admins') && 'Admin' || 'Viewer'"
        use_pkce: true
    envValueFrom:
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secretKeyRef:
          name: grafana-admin-credentials
          key: oauth-client-secret
    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL
        label: grafana_dashboard
        labelValue: "1"
      datasources:
        enabled: true
        searchNamespace: ALL
        label: grafana_datasource
        labelValue: "1"

    additionalDataSources:
      - name: VictoriaMetrics
        type: prometheus
        uid: victoriametrics
        access: proxy
        url: http://victoria-metrics-single-server.monitoring.svc.cluster.local:8428
        isDefault: true
        jsonData:
          prometheusType: Prometheus
          timeInterval: 15s
      - name: VictoriaLogs
        # Requires the victoriametrics-logs-datasource plugin (installed below).
        type: victoriametrics-logs-datasource
        uid: victorialogs
        access: proxy
        url: http://victoria-logs-single-server.monitoring.svc.cluster.local:9428
      - name: VictoriaTraces
        # VictoriaTraces exposes a Jaeger-compatible query API.
        # VERIFY-BEFORE-DEPLOY: confirm the datasource type/URL for your release.
        type: jaeger
        uid: victoriatraces
        access: proxy
        url: http://victoria-traces.monitoring.svc.cluster.local:10428
        jsonData:
          tracesToLogsV2:
            datasourceUid: victorialogs
          tracesToMetrics:
            datasourceUid: victoriametrics

    # VictoriaLogs Grafana datasource plugin.
    plugins:
      - victoriametrics-logs-datasource

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
