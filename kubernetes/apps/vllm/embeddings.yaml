# Text Embeddings Inference (TEI, CPU build) serving a small sentence-embedding
# model: an OpenAI-compatible embeddings endpoint reached directly by clients
# that need embeddings (e.g. mem0) over its in-cluster Service.
#
# bge-small-en-v1.5 is fast on CPU and small (~130MB); the model is pulled from
# Hugging Face on startup (HF_TOKEN from the shared vllm hf-secret).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embeddings
  namespace: vllm
  labels:
    app.kubernetes.io/name: embeddings
    app.kubernetes.io/part-of: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: embeddings
  template:
    metadata:
      labels:
        app.kubernetes.io/name: embeddings
        app.kubernetes.io/part-of: vllm
    spec:
      nodeSelector:
        ai: "true"
      tolerations:
        - key: "ai"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-0.2.0
          args:
            - "--model-id"
            - "BAAI/bge-small-en-v1.5"
            - "--port"
            - "8080"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: HF_TOKEN
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 20
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: embeddings
  namespace: vllm
  labels:
    app.kubernetes.io/name: embeddings
    app.kubernetes.io/part-of: vllm
spec:
  selector:
    app.kubernetes.io/name: embeddings
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
