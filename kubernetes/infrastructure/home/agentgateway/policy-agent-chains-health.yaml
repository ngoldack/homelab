# Health/eviction policies for the agent chains (agent-chains.yaml).
#
# Synthetic's 429s are NOT all equal — the failover decision depends on which
# of three flavors the response is, and agentgateway evicts a provider only
# when unhealthyCondition matches:
#
#   | flavor                    | signal                                     | fail over? |
#   |---------------------------|--------------------------------------------|------------|
#   | parallel-limit 429        | has `Retry-After` header (concurrency)     | NO         |
#   | generic 429 (rate limit)  | body: "Too many requests, try again later" | YES        |
#   | quota-exceeded 429        | body: "exceeded your subscription rate     | YES        |
#   |                           |        limits"                             |            |
#
# VERIFIED (operator 2026-09-20): the parallel-limit 429 is the ONLY flavor
# that carries a Retry-After header; the generic 429 does not. So the header
# cleanly isolates the transient concurrency case, and each fail-over flavor
# is also positively body-matched:
#
#   - parallel-limit 429 ("max 4 parallel requests per model") is a transient
#     concurrency condition that recovers as in-flight calls finish; evicting
#     on it would burn a failover for no reason -> excluded via `has(Retry-
#     After)` and no body match.
#   - generic 429 is Synthetic's rate-limit state that only clears if NO new
#     request pokes it for a recovery window -> MUST fail over.
#   - quota-exceeded 429 -> MUST fail over.
#
# CEL: evict on 5xx, or on a 429 that carries no Retry-After header, or whose
# body is the generic or quota-exceeded error. The body clauses make the
# fail-over flavors independent of header behavior; `!has(Retry-After)` covers
# the case where a fail-over 429 happens to omit the header.
#
# duration: 1h — the base recovery window for a generic 429: Synthetic's
# rate-limit state clears only after ~1h with no new request (verified by
# operator 2026-09-20; a 429 that kept being poked stayed in the 429 state
# for 8h+ despite available quota). The chains fail over to OpenRouter for
# this window and then try Synthetic again. When a 429 DOES include
# Retry-After (the concurrent-limit flavor), agentgateway uses that header as
# the eviction duration — but that flavor is excluded above, so it is never
# evicted.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: general-purpose-health
  namespace: agentgateway
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: general-purpose-chain
  backend:
    health:
      unhealthyCondition: >-
        response.code >= 500 ||
        (response.code == 429 &&
        (!("retry-after" in response.headers) ||
        response.body.contains("Too many requests, try again later") ||
        response.body.contains("exceeded your subscription rate limits")))
      eviction:
        duration: 1h
        consecutiveFailures: 1
