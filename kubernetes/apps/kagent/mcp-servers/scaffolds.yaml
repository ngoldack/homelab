# Mail read (IMAP). better-email-mcp, read-only credentials. Deploy as a kmcp
# MCPServer pod with SOPS-encrypted IMAP creds; never log/trace credentials.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: mail-mcp-read
  namespace: kagent
spec:
  description: "STUB: IMAP read/search/summarize. Deploy better-email-mcp (read creds) + SOPS secret."
  protocol: STREAMABLE_HTTP
  url: "http://better-email-mcp.kagent.svc.cluster.local:8080/mcp"
  timeout: 30s
  terminateOnClose: true
---
# Mail write (SMTP). Separate write-credential variant. ONLY the mail-agent may
# reference this, and ONLY under requireApproval.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: mail-mcp-write
  namespace: kagent
spec:
  description: "STUB: SMTP send. Separate write creds. mail-agent only, requireApproval enforced."
  protocol: STREAMABLE_HTTP
  url: "http://better-email-mcp-write.kagent.svc.cluster.local:8080/mcp"
  timeout: 30s
  terminateOnClose: true
---
