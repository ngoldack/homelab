apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: monitoring
  chart:
    spec:
      chart: grafana
      version: "10.5.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    admin:
      existingSecret: "grafana-admin-credentials"
      passwordKey: "admin-password"

    # v0: local admin login only. Authentik SSO (generic_oauth) returns in v1.
    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL
        label: grafana_dashboard
        labelValue: "1"
      datasources:
        enabled: true
        searchNamespace: ALL
        label: grafana_datasource
        labelValue: "1"

    additionalDataSources:
      - name: VictoriaMetrics
        type: prometheus
        uid: victoriametrics
        access: proxy
        url: http://victoria-metrics-single-server.monitoring.svc.cluster.local:8428
        isDefault: true
        jsonData:
          prometheusType: Prometheus
          timeInterval: 15s
      - name: VictoriaLogs
        # Requires the victoriametrics-logs-datasource plugin (installed below).
        type: victoriametrics-logs-datasource
        uid: victorialogs
        access: proxy
        url: http://victoria-logs-single-server.monitoring.svc.cluster.local:9428
      - name: VictoriaTraces
        # VictoriaTraces exposes a Jaeger-compatible query API.
        # VERIFY-BEFORE-DEPLOY: confirm the datasource type/URL for your release.
        type: jaeger
        uid: victoriatraces
        access: proxy
        url: http://victoria-traces.monitoring.svc.cluster.local:10428
        jsonData:
          tracesToLogsV2:
            datasourceUid: victorialogs
          tracesToMetrics:
            datasourceUid: victoriametrics

    # VictoriaLogs Grafana datasource plugin.
    plugins:
      - victoriametrics-logs-datasource

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
