# browser-use/web-ui — LLM-driven browser agent with a Gradio UI (port 7788)
# and an in-container headless Chromium.
#
# IMPORTANT: upstream publishes NO official container image. This references
# ghcr.io/browser-use/web-ui:latest as a placeholder; the pod will
# ImagePullBackOff until you build the image from the web-ui repo Dockerfile and
# push it to this ref (or change image: to your registry). Everything else
# (LLM wiring, browser runtime) is ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browser-use
  namespace: browser-use
  labels:
    app.kubernetes.io/name: browser-use
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: browser-use
  template:
    metadata:
      labels:
        app.kubernetes.io/name: browser-use
    spec:
      containers:
        - name: web-ui
          image: ghcr.io/browser-use/web-ui:latest
          envFrom:
            - configMapRef:
                name: browser-use-config
            - secretRef:
                name: browser-use-secrets
          ports:
            - name: ui
              containerPort: 7788
            - name: novnc
              containerPort: 6080
          securityContext:
            capabilities:
              # Chromium sandbox needs SYS_ADMIN (alternative: --no-sandbox).
              add: ["SYS_ADMIN"]
          readinessProbe:
            httpGet:
              path: /
              port: 7788
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        # Chromium needs more than the default 64MB /dev/shm.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: browser-use
  namespace: browser-use
  labels:
    app.kubernetes.io/name: browser-use
spec:
  selector:
    app.kubernetes.io/name: browser-use
  ports:
    - name: ui
      port: 80
      targetPort: 7788
    - name: novnc
      port: 6080
      targetPort: 6080
