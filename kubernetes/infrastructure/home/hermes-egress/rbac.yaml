# RBAC for the egress guard — plan Unit 3.3. Verbs are exactly the ones the
# REAPER code path calls (reaper.py + k8sapi.py), verified against the module:
#
#   * extensions.agents.x-k8s.io/v1beta1 sandboxclaims: get, list, delete
#     (list_claims by the workload.hermes.io/session-hash label; delete_claim
#     carries a UID precondition).
#   * core configmaps: get + update RESTRICTED to resourceNames
#     [hermes-quarantine], plus a separate create rule (create cannot be
#     name-restricted — see the rule comment; the earlier single rule listing
#     create under resourceNames denied the startup ledger create, so the
#     quarantine path answered 503 for every event).
#     (get + create_configmap for the startup ledger, replace_configmap for
#     the quarantine write; nothing else writable.)
#
# NO pods/sandboxes verbs: the identity contract binds an event to cluster
# objects through the CLAIM LABEL, not through a pod-IP lookup (no code path
# calls get_sandbox/list_pods), so the grant is not carried "for later".
#
# NO authorizer RBAC at all: the authorizer is deliberately stateless about
# identity (token-only, no Kubernetes API call — authorizer.py docstring) and
# its Deployment mounts no ServiceAccount token.
#
# The reaper Role lives in hermes-sandbox (the objects it touches); its
# ServiceAccount lives in hermes-egress.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-reaper
  namespace: hermes-egress
---
# Dedicated ServiceAccounts for the two no-RBAC workloads (proxy, authorizer).
# Both set automountServiceAccountToken: false AND a dedicated name: running
# under the namespace `default` ServiceAccount trips Kyverno
# disallow-default-serviceaccount (flat RBAC/audit identity), and a named SA
# with no RoleBinding carries zero privileges even if token mounting is ever
# re-enabled by accident.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-egress-proxy
  namespace: hermes-egress
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: egress-authorizer
  namespace: hermes-egress
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-reaper-claims
  namespace: hermes-sandbox
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["get", "list", "delete"]
  # get/update ARE name-restricted to the ledger.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["hermes-quarantine"]
    verbs: ["get", "update"]
  # `create` CANNOT be restricted by resourceName: Kubernetes RBAC ignores
  # resourceNames for create/deletecollection (the object name is not
  # authoritative at authorization time), so listing create in the rule above
  # denied every create — the reaper's startup ensure_ledger() 403'd, the
  # hermes-quarantine ConfigMap never existed, and every quarantine event
  # answered 503 (found live 2026-09-19 via hack/hermes-egress-e2e.sh).
  # The verb therefore lives in its own rule, and the grant is only for
  # creating ConfigMaps in this namespace; writes stay name-restricted above.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-reaper-claims
  namespace: hermes-sandbox
subjects:
  - kind: ServiceAccount
    name: sandbox-reaper
    namespace: hermes-egress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-reaper-claims
