# Portal bridges: pod-netns nginx hops, one per site, each fronting the
# authentik server via the global Service.
#
# Why bridges exist at all: the gateway data plane is host-netns
# cilium-envoy, and host→remote-pod fails outright (verified live), so each
# envoy needs a LOCAL backend on its site. The bridge is that local hop; the
# cross-site hop to the server then happens in a pod netns, where KubeSpan
# carries it reliably (2026-09-19 live re-measurement from fsn1: pod→remote-
# pod 20/20 incl. 73 KB responses; the global Service path works 20/20 with a
# ~1.1 s tail — the old pod-netns "~50% flaky" reading that required a
# node-local server replica no longer holds, so the server is home-only and
# the -local internalTrafficPolicy Service is retired).
#
# arm64-safe image; the cloud side tolerates the ingress taint.
apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-bridge-config
  namespace: authentik
data:
  nginx.conf: |
    events {}
    http {
      resolver 172.21.0.10 valid=10s ipv6=off;
      server {
        listen 9100;
        location / {
          set $upstream http://authentik-server.authentik.svc.cluster.local;
          proxy_pass $upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-bridge-home
  namespace: authentik
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-bridge
      portal.ngoldack.de/site: home
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-bridge
        portal.ngoldack.de/site: home
    spec:
      nodeSelector:
        topology.homelab/site: home
      containers:
        - name: nginx
          # Pinned: docker.io/library/nginx:1.29-alpine
          image: docker.io/library/nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
          args: ["nginx", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
      volumes:
        - name: conf
          configMap:
            name: portal-bridge-config
---
apiVersion: v1
kind: Service
metadata:
  name: portal-bridge-home
  namespace: authentik
spec:
  selector:
    app.kubernetes.io/name: portal-bridge
    portal.ngoldack.de/site: home
  ports:
    - name: http
      port: 9100
      targetPort: 9100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-bridge-cloud
  namespace: authentik
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-bridge
      portal.ngoldack.de/site: cloud
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-bridge
        portal.ngoldack.de/site: cloud
    spec:
      nodeSelector:
        topology.homelab/site: cloud
      tolerations:
        - key: dedicated
          value: ingress
          effect: NoSchedule
      containers:
        - name: nginx
          # Pinned: docker.io/library/nginx:1.29-alpine
          image: docker.io/library/nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
          args: ["nginx", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
      volumes:
        - name: conf
          configMap:
            name: portal-bridge-config
---
apiVersion: v1
kind: Service
metadata:
  name: portal-bridge-cloud
  namespace: authentik
spec:
  selector:
    app.kubernetes.io/name: portal-bridge
    portal.ngoldack.de/site: cloud
  ports:
    - name: http
      port: 9100
      targetPort: 9100
