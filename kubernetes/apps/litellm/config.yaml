# LiteLLM model routing config — THE central place to map stable aliases to
# concrete backends. Switch a model everywhere by editing one entry here; all
# consumers (kagent, mem0, gpt-researcher, Open WebUI, ...) only reference aliases.
#
# Backends now run on Ollama (the P100s are Pascal; vLLM dropped Pascal support).
# Ollama exposes an OpenAI-compatible API on :11434/v1 and loads/unloads models in
# VRAM on demand, so there is no per-model Service or scale-to-zero plumbing.
#
# Aliases: default/smart = the 32B coder, fast = the small low-latency model,
# embeddings = the embedding model. (STT is no longer an alias — Ollama has no
# speech-to-text; the Qwen3-ASR service is reached directly, not via OpenAI /v1.)
#
# VERIFY-BEFORE-DEPLOY: confirm the model tags are pulled in Ollama
# (apps/ollama/helmrelease.yaml ollama.models.pull) and that Ollama's
# /v1/embeddings works for nomic-embed-text.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    model_list:
      - model_name: default
        litellm_params:
          model: openai/qwen2.5-coder:32b
          api_base: http://ollama.ollama.svc.cluster.local:11434/v1
          api_key: dummy
      - model_name: smart
        litellm_params:
          model: openai/qwen2.5-coder:32b
          api_base: http://ollama.ollama.svc.cluster.local:11434/v1
          api_key: dummy
      - model_name: fast
        litellm_params:
          model: openai/qwen3:8b
          api_base: http://ollama.ollama.svc.cluster.local:11434/v1
          api_key: dummy
      - model_name: embeddings
        litellm_params:
          model: openai/nomic-embed-text
          api_base: http://ollama.ollama.svc.cluster.local:11434/v1
          api_key: dummy
    litellm_settings:
      drop_params: true
      num_retries: 2
    # No master_key: in-cluster open proxy (Ollama is unauthenticated in-cluster).
    # Future hardening: set general_settings.master_key + per-consumer virtual
    # keys, backed by a dedicated CNPG instance.
