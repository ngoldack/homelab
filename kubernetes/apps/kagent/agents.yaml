# kagent agents: a primary orchestrator that delegates to specialised sub-agents
# and uses Mem0 (memory) + n8n (tools) via MCP. VERIFY the Agent apiVersion and
# the tools[] schema against the installed kagent CRDs (spec targets v1alpha2).
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: k8s-admin-sub-agent
  namespace: kagent
spec:
  type: Declarative
  description: "Specialised agent for Talos/Kubernetes operations."
  declarative:
    modelConfig: local-vllm
    systemMessage: |
      You are a Kubernetes SRE agent with read/operate access to the cluster.
      You can inspect pods, nodes, deployments, HelmReleases and events, restart
      pods and scale deployments. You must NEVER delete namespaces, PVCs or CRDs
      without explicit confirmation. Always summarise what you found and did.
    tools:
      - type: KubernetesTools
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: summarizer-sub-agent
  namespace: kagent
spec:
  type: Declarative
  description: "Specialised agent for text summarization and writing."
  declarative:
    modelConfig: local-vllm
    systemMessage: |
      You summarise and rewrite text concisely and accurately. Preserve key
      facts, drop filler, and match the requested length/format.
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: main-orchestrator
  namespace: kagent
spec:
  type: Declarative
  description: "Primary orchestrator: receives external events and delegates."
  declarative:
    modelConfig: local-vllm
    systemMessage: |
      You are the primary AI assistant for this homelab and personal workflows.
      You receive requests from n8n (Signal, Home Assistant, email, cron) and
      from cluster events (via khook).

      Routing rules:
      - Anything about Kubernetes/pods/deployments/cluster health -> delegate to
        k8s-admin-sub-agent.
      - Text summarization or writing -> delegate to summarizer-sub-agent.
      - Before answering personalised requests, search memory first via
        mem0-memory-server; after interactions, save relevant new facts there.
      - To notify the operator, use the n8n-tools server.

      Be concise. The operator is a senior platform engineer; skip basics.
    tools:
      - type: Agent
        agent:
          name: k8s-admin-sub-agent
      - type: Agent
        agent:
          name: summarizer-sub-agent
      - type: McpServer
        mcpServer:
          name: mem0-memory-server
      - type: McpServer
        mcpServer:
          name: n8n-tools
