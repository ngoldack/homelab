# hermes — hardened single-replica Hermes gateway running the agent_sandbox
# terminal backend. Holds NO Kubernetes credentials beyond its own claim
# RBAC (approved scoped grant in rbac.yaml): it talks to the sandbox-router
# for files (v2 scoped tokens), gRPC-execs into adopted sandboxes directly
# (user-approved fallback), and calls the agentgateway data plane for the
# model.
#
# Hardening (restricted PSA): runAsNonRoot (hermes uid 10000), fsGroup
# 10000, RuntimeDefault seccomp, drop ALL caps, read-only rootfs, /tmp
# emptyDir, no hostPath/sockets/kubeconfig. s6-overlay is bypassed in the
# image, whose entrypoint runs the gateway and supervises the dashboard in the
# same unprivileged container (the pod passes no argv, so the command line
# cannot drift), and readiness checks both listeners; Kubernetes supervises
# the single replica. /opt/data/config.yaml is seeded revision-aware from the
# hermes-config key "config-rev".
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: hermes
spec:
  serviceName: hermes
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
      annotations:
        # Bump together with the hermes-config key config-rev: a change here
        # rolls the pod and re-seeds /opt/data/config.yaml.
        hermes.ngoldack.de/config-rev: "7"
    spec:
      serviceAccountName: hermes
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        fsGroup: 10000
        # The data PVC holds thousands of files on a slow NFS-class backend:
        # a recursive fsGroup chown on every pod start costs minutes of
        # downtime per rollout (observed twice live), and the volume's
        # ownership is already correct after the first pass.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hermes
          image: registry.ngoldack.de/hermes-agent-sandbox-plugin@sha256:0a37a01713f9123fa784d76fb1974e1b6d246dc51c3b2e5009c718afe706838f
          # No args: the image entrypoint owns the command line (it starts the
          # gateway and supervises the dashboard); declaring args here would be
          # silently ignored.
          env:
            # LLM credential for the agentgateway custom provider
            # (config.yaml providers.agentgateway.key_env -> OPENAI_API_KEY).
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: OPENAI_API_KEY
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: API_SERVER_KEY
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_PORT
              value: "8642"
            - name: AGENT_SANDBOX_ROUTER_URL
              value: http://sandbox-router-svc.agent-sandbox-system.svc.cluster.local:8080
            - name: AGENT_SANDBOX_ROUTER_TOKEN_FILE
              value: /opt/data/router-token
            # Enforce the sandboxed backend even if config.yaml is later
            # rewritten by the app (TERMINAL_ENV is the hard override).
            - name: TERMINAL_ENV
              value: agent_sandbox
            # Stable claim-ownership id for the agent_sandbox plugin; without
            # it ownership falls back to the pod hostname.
            - name: AGENT_SANDBOX_GATEWAY_ID
              value: hermes
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
            - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: HERMES_DASHBOARD_BASIC_AUTH_SECRET
            # Edge access (https://hermes.ngoldack.de, ../httproute-edge.yaml)
            # uses the dashboard's own OIDC login — provider
            # hermes-dashboard-oidc in ../../authentik/seed.yaml. The
            # basic-auth vars above stay: they back the dashboard's `basic`
            # password provider (the /login form and POST
            # /auth/password-login, which returns the session cookies Desktop
            # and port-forward use). HTTP Basic itself is not accepted.
            # PUBLIC_URL makes the redirect URI absolute
            # (<public_url>/auth/callback), which is exactly the provider's
            # registered redirect_uris entry.
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: https://hermes.ngoldack.de
            # Per-provider issuer, shaped by the application slug
            # (hermes-dashboard); must match the browser-visible host so the
            # ID token's `iss` validates.
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: https://authentik.ngoldack.de/application/o/hermes-dashboard/
            - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
              value: hermes-dashboard-oidc
            # Observability: the bundled observability/langfuse plugin (enabled
            # in config.yaml) exports turns to the in-cluster Langfuse. The
            # `langfuse` SDK is baked into the image — without it the plugin's
            # hooks fail open and nothing is sent. Keys come from the same
            # Langfuse project as the OTLP exporter in
            # ../agentgateway/langfuse-otel.sops.yaml.
            - name: HERMES_LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: HERMES_LANGFUSE_PUBLIC_KEY
            - name: HERMES_LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: HERMES_LANGFUSE_SECRET_KEY
            # In-cluster Langfuse web/ingestion Service (ns langfuse); the
            # plugin defaults to cloud.langfuse.com, which this namespace's
            # egress allowlist does not permit. The matching ingress half is
            # ../../langfuse/cilium-allowlist.yaml.
            - name: HERMES_LANGFUSE_BASE_URL
              value: http://langfuse-web.langfuse.svc.cluster.local:3000
            # P100 request budget, 600 s (default is 1800). This is the knob the
            # client actually reads: run_agent._resolved_api_call_timeout and
            # chat_completion_helpers._stream_timeouts both prefer a per-provider
            # providers.<id>.request_timeout_seconds and fall back to this env —
            # and the per-provider key does not match here, because a named
            # custom endpoint resolves to the bare provider id "custom" (see the
            # CAVEAT in configmap.yaml). The read timeout for this local
            # endpoint follows the same value (is_local_endpoint matches
            # .cluster.local).
            - name: HERMES_API_TIMEOUT
              value: "600"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: 8642
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            # Both listeners must answer: the API (401 without a bearer key is
            # a healthy answer, curl returns 0 without -f) and the dashboard.
            # A single container has one readiness probe, so this checks both.
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  curl -s -o /dev/null --max-time 3 http://127.0.0.1:8642/v1/models &&
                  curl -s -o /dev/null --max-time 3 http://127.0.0.1:9119/
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8642
            periodSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: router-token
              mountPath: /opt/data/router-token
              subPath: token
              readOnly: true
            - name: tmp
              mountPath: /tmp
        # Pod-local relay in front of the three Synthetic-tier base_urls. It
        # exists only because agentgateway v1.5.0 never terminates the chunked
        # body of a streamed response from a *remote* upstream, which makes every
        # Hermes turn against those providers die with httpx
        # RemoteProtocolError (error_code=output_truncated); the relay re-frames
        # that response close-delimited, the shape that completes. It listens on
        # 127.0.0.1 only (same pod network namespace, no Service, no Cilium
        # change) and forwards to the same agentgateway Service the P100
        # provider keeps calling directly. Script + rationale: stream-relay.yaml;
        # removal condition: docs/hermes-agent-sandbox.md, "Model choice".
        - name: syn-stream-relay
          image: registry.ngoldack.de/hermes-agent-sandbox-plugin@sha256:0a37a01713f9123fa784d76fb1974e1b6d246dc51c3b2e5009c718afe706838f
          command: ["/opt/hermes/.venv/bin/python3", "-u", "/opt/relay/stream_relay.py"]
          env:
            - name: RELAY_UPSTREAM
              value: http://agentgateway.agentgateway.svc.cluster.local:80
            - name: RELAY_LISTEN_HOST
              value: "127.0.0.1"
            - name: RELAY_LISTEN_PORT
              value: "8643"
            # The mounted script directory is read-only anyway; this keeps the
            # interpreter from trying to cache bytecode next to it.
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          # Loopback probe: reaches the relay inside the pod's network namespace
          # and never touches the gateway.
          readinessProbe:
            exec:
              command:
                - /usr/bin/curl
                - -s
                - -o
                - /dev/null
                - --max-time
                - "3"
                - http://127.0.0.1:8643/healthz
            periodSeconds: 10
          volumeMounts:
            - name: relay-script
              mountPath: /opt/relay
              readOnly: true
      initContainers:
        - name: seed-config
          image: registry.ngoldack.de/hermes-agent-sandbox-plugin@sha256:0a37a01713f9123fa784d76fb1974e1b6d246dc51c3b2e5009c718afe706838f
          command: ["/bin/sh", "-c"]
          env:
            - name: HERMES_CONFIG_REV
              valueFrom:
                configMapKeyRef:
                  name: hermes-config
                  key: config-rev
          args:
            - |
              set -eu
              mkdir -p /opt/data
              current="$(cat /opt/data/.config-rev 2>/dev/null || true)"
              if [ "$current" != "$HERMES_CONFIG_REV" ]; then
                if [ -f /opt/data/config.yaml ]; then
                  cp /opt/data/config.yaml /opt/data/config.yaml.bak
                fi
                cp /opt/boot/config.yaml /opt/data/config.yaml
                printf '%s\n' "$HERMES_CONFIG_REV" > /opt/data/.config-rev
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10000
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: boot-config
              mountPath: /opt/boot
              readOnly: true
      volumes:
        - name: boot-config
          configMap:
            name: hermes-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: router-token
          secret:
            secretName: hermes-secret
            items:
              - key: AGENT_SANDBOX_ROUTER_TOKEN
                path: token
        - name: relay-script
          configMap:
            name: hermes-stream-relay
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: truenas-fast-nfs
        resources:
          requests:
            storage: 10Gi
