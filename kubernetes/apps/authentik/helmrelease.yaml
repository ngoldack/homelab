apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: authentik
  chart:
    spec:
      chart: authentik
      version: "2024.4.2"
      sourceRef:
        kind: HelmRepository
        name: authentik
      interval: 1h
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values:
    # Disable embedded stateful services in favor of cloud-native operators
    postgresql:
      enabled: false
    redis:
      enabled: false

    # Environment variables to configure Authentik, PostgreSQL, Valkey, and CrowdSec
    authentik:
      email:
        host: "localhost"
        port: 25
        use_tls: false

    # Inject connection properties and keys via environment overrides
    env:
      - name: AUTHENTIK_POSTGRESQL__HOST
        value: "authentik-postgres-rw.authentik.svc.cluster.local"
      - name: AUTHENTIK_POSTGRESQL__NAME
        value: "authentik"
      - name: AUTHENTIK_POSTGRESQL__USER
        value: "authentik"
      - name: AUTHENTIK_POSTGRESQL__PORT
        value: "5432"
      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        valueFrom:
          secretKeyRef:
            name: authentik-postgres-app
            key: password
      - name: AUTHENTIK_REDIS__HOST
        value: "authentik-valkey.authentik.svc.cluster.local"
      - name: AUTHENTIK_REDIS__PORT
        value: "6379"
      - name: AUTHENTIK_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: authentik-secrets
            key: secret-key
      - name: CROWDSEC_BOUNCER_KEY
        valueFrom:
          secretKeyRef:
            name: authentik-secrets
            key: authentik-bouncer-key

    # Configure server deployment components & mount the CrowdSec policy blueprint configmap
    server:
      replicas: 1
      volumeMounts:
        - name: crowdsec-blueprint
          mountPath: /blueprints/crowdsec
      volumes:
        - name: crowdsec-blueprint
          configMap:
            name: crowdsec-authentik-blueprint

    # Configure worker deployment components & mount the CrowdSec policy blueprint configmap
    worker:
      replicas: 1
      volumeMounts:
        - name: crowdsec-blueprint
          mountPath: /blueprints/crowdsec
      volumes:
        - name: crowdsec-blueprint
          configMap:
            name: crowdsec-authentik-blueprint
