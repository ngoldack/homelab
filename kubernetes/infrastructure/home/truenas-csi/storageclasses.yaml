# TrueNAS storage classes are intentionally non-destructive by default.
# Dynamic provisioning may add or expand data, but it must never delete
# PVC-backed shares or NVMe-oF volumes without explicit human action.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-fast-nvmeof
provisioner: csi.truenas.io
parameters:
  protocol: "nvmeof"
  pool: "fast"
  datasetPath: "k8s/nvmeof"
  compression: "LZ4"
  volblocksize: "16K"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-fast-nfs
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  pool: "fast"
  datasetPath: "k8s/nfs"
  compression: "LZ4"
  nfs.mountOptions: "hard,nfsvers=4.1"
  nfs.rootSquash: "false"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-tank-nfs
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  pool: "tank"
  datasetPath: "k8s/nfs"
  compression: "LZ4"
  nfs.mountOptions: "hard,nfsvers=4.1"
  nfs.rootSquash: "false"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
---
# Per-PVC StorageClasses.
#
# Layout is always {pool}/k8s/{protocol}/{namespace}/{app}/pvc-<uid>, so a
# dataset identifies itself on the NAS without cross-referencing anything:
#   fast/k8s/nfs/immich/database/pvc-<uid>
#   tank/k8s/nfs/immich/library/pvc-<uid>
# Classes are named truenas-{pool}-{protocol}-{namespace}-{app} to match.
#
# This costs roughly one StorageClass per PVC, which is worth stating plainly:
# datasetPath is a StorageClass parameter, so a per-PVC path needs a per-PVC
# class. There is no cheaper mechanism. The leaf cannot carry the meaning
# either — the driver derives it from the CSI request name
# (volumeName := SanitizeVolumeName(req.Name) in pkg/driver/controller.go),
# which the external-provisioner generates as pvc-<uid>. The provisioner runs
# with --extra-create-metadata, so the PVC's name and namespace ARE in the
# parameters map, but the driver reads no csi.storage.k8s.io/* key, and its
# dataset Comment is hardcoded to "CSI volume <path>" with no override.
#
# Adding a workload means adding a class here. To map a UUID back from the
# cluster side:
#   kubectl get pv -o custom-columns=PV:.metadata.name,NS:.spec.claimRef.namespace,CLAIM:.spec.claimRef.name

# VictoriaMetrics' TSDB.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-fast-nfs-monitoring-vmsingle
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  pool: "fast"
  datasetPath: "k8s/nfs/monitoring/vmsingle"
  compression: "LZ4"
  nfs.mountOptions: "hard,nfsvers=4.1"
  nfs.rootSquash: "false"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate

---
# Immich's PostgreSQL data directory.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-fast-nfs-immich-database
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  pool: "fast"
  datasetPath: "k8s/nfs/immich/database"
  compression: "LZ4"
  # Every 6 hours, kept two weeks. More frequent than the library because the
  # database is small and changes constantly, and because losing it loses the
  # index of the photos even when the photo files survive.
  snapshot.schedule: "0 */6 * * *"
  snapshot.naming: "auto-%Y-%m-%d_%H-%M"
  snapshot.retention: "14"
  snapshot.retentionUnit: "DAY"
  snapshot.recursive: "false"
  nfs.mountOptions: "hard,nfsvers=4.1"
  nfs.rootSquash: "false"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate

---
# Immich's machine-learning model cache (CLIP/face models).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-fast-nfs-immich-cache
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  pool: "fast"
  datasetPath: "k8s/nfs/immich/cache"
  compression: "LZ4"
  nfs.mountOptions: "hard,nfsvers=4.1"
  nfs.rootSquash: "false"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate

---
# Immich's photo/video library: bulk media, spinning pool.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-tank-nfs-immich-library
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  pool: "tank"
  datasetPath: "k8s/nfs/immich/library"
  compression: "LZ4"
  # Automatic ZFS snapshots of the photo library. These parameters make the
  # driver create a real TrueNAS Periodic Snapshot Task scoped to THIS PVC's
  # own dataset (createSnapshotTaskFromParameters in pkg/driver/controller.go),
  # not a hand-made task on the parent — so it is declarative and travels with
  # the volume. Daily at 03:15, kept one month.
  #
  # These are independent of Kubernetes VolumeSnapshot objects, which matters:
  # the driver's DeleteSnapshot returns success to Kubernetes even when ZFS
  # refuses the delete, so k8s-side snapshots are not a trustworthy record.
  # A TrueNAS-side task is.
  snapshot.schedule: "15 3 * * *"
  snapshot.naming: "auto-%Y-%m-%d_%H-%M"
  snapshot.retention: "1"
  snapshot.retentionUnit: "MONTH"
  snapshot.recursive: "false"
  nfs.mountOptions: "hard,nfsvers=4.1"
  nfs.rootSquash: "false"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
---
# LLMKube's shared model cache. Big GGUF files, written once and then read
# (mmap'd) on every inference-pod start, so it wants the fast pool.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-fast-nfs-llmkube-models
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  pool: "fast"
  datasetPath: "k8s/nfs/llmkube/models"
  compression: "LZ4"
  nfs.mountOptions: "hard,nfsvers=4.1"
  nfs.rootSquash: "false"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
---
# Zot's blob store (../registry/). Container layers: written once by a build,
# then read whole on every pull. Compression is OFF because registry blobs are
# already gzip/zstd-compressed tarballs — LZ4 over them burns CPU for
# essentially no ratio, unlike the GGUF and Postgres cases above.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-fast-nfs-registry-zot
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  pool: "fast"
  datasetPath: "k8s/nfs/registry/zot"
  compression: "OFF"
  nfs.mountOptions: "hard,nfsvers=4.1"
  nfs.rootSquash: "false"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
