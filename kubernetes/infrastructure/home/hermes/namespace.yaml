# hermes — the Hermes gateway namespace. PSA restricted is the floor: the
# gateway holds the router token and the model-gateway API key, so only a hardened
# pod may run here. The derived image's ENTRYPOINT bypasses s6-overlay so the
# gateway runs as the unprivileged hermes uid under restricted.
apiVersion: v1
kind: Namespace
metadata:
  name: hermes
  labels:
    # The edge Gateway's https-apex listener only attaches HTTPRoutes from
    # namespaces carrying this label (see ../hermes/httproute-edge.yaml for
    # the dashboard route).
    gateway.ngoldack.de/edge-ingress: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
