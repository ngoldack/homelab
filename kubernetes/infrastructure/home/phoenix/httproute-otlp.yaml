# Public OTLP ingest endpoint for external producers (OpenRouter's OTLP
# broadcast) — the token-checking otlp-gate, NOT the authentik-gated UI path.
# otlp.ngoldack.de -> edge Gateway -> otlp-gate:8081 (bearer check) ->
# phoenix-svc:6006/v1/traces. Deliberately NOT behind the authentik outpost:
# the outpost is session-cookie only and cannot accept a header API key, which
# is exactly why OpenRouter's POST got 403 at the UI's auth edge.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: phoenix-otlp
  namespace: phoenix
spec:
  parentRefs:
    - name: edge
      namespace: network
      sectionName: https-apex
  hostnames:
    - otlp.${CLUSTER_DOMAIN}
  rules:
    - backendRefs:
        - name: otlp-gate
          port: 8081