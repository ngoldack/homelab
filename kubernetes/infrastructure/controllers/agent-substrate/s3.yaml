# SeaweedFS S3 wiring for the Agent Substrate: an IAM identity + generated
# credentials Secret (substrate-s3-credentials, AWS_*-named keys atelet reads)
# and the substrate-snapshots bucket owned by that identity. atelet ships
# SandboxAgent snapshots here (ATE_STORAGE_BACKEND=s3) instead of GCS. The
# cross-namespace cluster reference is permitted by the ResourceReferenceGrant
# in the seaweedfs namespace. EXPERIMENTAL.
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: substrate
  namespace: ate-system
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: substrate
  namespace: ate-system
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  identityRef:
    name: substrate
  # The operator generates the keypair and writes it here; field names match
  # what the atelet S3 backend expects (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY).
  secretRef:
    name: substrate-s3-credentials
    accessKeyField: AWS_ACCESS_KEY_ID
    secretKeyField: AWS_SECRET_ACCESS_KEY
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: substrate-snapshots
  namespace: ate-system
spec:
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  reclaimPolicy: Retain
  owner: substrate
  access:
    - user: substrate
      actions: [Read, Write, List, Tagging, Admin]
