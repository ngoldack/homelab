# ============================================================================
# SCAFFOLD MCP SERVERS — NOT YET DEPLOYED, NOT REFERENCED BY ANY AGENT.
# ============================================================================
# Every RemoteMCPServer below points at an endpoint that DOES NOT EXIST yet. They
# are version-controlled placeholders that capture intent and the wiring target.
# Each one needs a real backing MCP server or REST->MCP bridge built first (some
# also need SOPS-encrypted credentials). Until then, do NOT add these to any
# agent's `tools:` — referencing a dead MCP only produces failed tool discovery.
#
# Build order / notes per server is in the `description` field and in
# docs/ai-home-automation-roadmap.md. Several (mail-*, scalable-portfolio) are
# better implemented as in-cluster kmcp `MCPServer` pods (kagent.dev/v1alpha1)
# with SOPS creds rather than RemoteMCPServer; represented here as the eventual
# service URL for clarity.
#
# VERIFY-BEFORE-DEPLOY: everything in this file is a stub.
# ----------------------------------------------------------------------------

# Web research (browser-research) is DONE — superseded by `searxng-mcp`
# (apps/research, registered in existing-mcp-servers.yaml). It provides
# searxng_web_search + web_url_read against the in-cluster SearXNG and is wired
# into research-chief, web-search, document-ingest, cluster-update and k8s-sre.
# Other agents (gitops-flux, observability, etc.) can reference searxng-mcp too.
# Flux + Git — read Flux/Kustomize/Helm object state and open PRs against the
# homelab repo. Read + PR only; never imperative cluster writes.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: flux-git
  namespace: kagent
spec:
  description: "STUB: read Flux/Kustomize/Helm state + open Git PRs. Build a flux+git MCP."
  protocol: STREAMABLE_HTTP
  url: "http://flux-git-mcp.kagent.svc.cluster.local:8080/mcp"
  timeout: 30s
  terminateOnClose: true
---
# Home Assistant REST/WebSocket API. Read entities/states + write automations.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
