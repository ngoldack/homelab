# The media stack on one app-template release (releaseName `media`, hence
# Services `media-jellyfin`, `media-sonarr`, ... and the HTTPRoute backends),
# except the request UI: Seerr ships its own upstream chart + release
# (seerr.yaml) instead of a controller/service entry here.
#
# Three pod families live here:
#
#   playback   jellyfin (+ Seerr for requests, its own release above) —
#              LAN-resident media server, no VLAN attachment, reached on the
#              LAN VIP.
#   gateway    vpn-gateway — the stack's single WireGuard tunnel, on VLAN 2080.
#              It is what makes the download chain's egress obfuscated: see the
#              controller below and vpn-gateway-configmap.yaml.
#   automation sabnzbd, prowlarr, sonarr, radarr — the download chain.
#              Every one of these carries a macvlan interface on VLAN 2080
#              (UniFi "Obfuscated") and a vpn-routes init container that moves
#              the pod's default route onto it, pointing at the vpn-gateway
#              pod: their internet egress is tunneled and NAT'd there, while
#              cluster traffic stays on eth0. See ../media/nad-vlan-2080.yaml,
#              vpn-routes-configmap.yaml and vpn-gateway-configmap.yaml.
#
# Everything shares /data (the media-library PVC): downloads land in
# /data/usenet/complete and Sonarr/Radarr import into /data/media/{tv,movies}
# by hardlink — which is only possible on ONE filesystem, the reason the
# downloads directory is not a separate volume.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: media
  namespace: flux-system
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: app-template
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: media
      interval: 1h
  targetNamespace: media
  releaseName: media
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Everything reads/writes TrueNAS NFS, which only the LAN workers can
    # reach; jellyfin additionally pulls onto the iGPU node via its own
    # nodeSelector below (overriding this default).
    defaultPodOptions:
      nodeSelector:
        topology.homelab/site: home
    controllers:
      jellyfin:
        type: deployment
        pod:
          # Pull onto the single node with the passthrough iGPU (QuickSync):
          # Jellyfin transcodes with it via /dev/dri (mount below).
          nodeSelector:
            workload/media: "true"
        containers:
          main:
            image:
              repository: jellyfin/jellyfin
              tag: "12.1@sha256:78d3ea1207d1322471fcac39a614f004f2ccf7e878f95ab2977d752f07e4dd7e"
            env:
              TZ: Europe/Berlin
              # Advertised to clients so apps auto-discover the right URL
              # instead of the cluster-internal address. {app}.{namespace}.svc
              # is the repo's canonical service URL scheme (see
              # network/certificate.yaml, *.svc.${CLUSTER_DOMAIN}).
              JELLYFIN_PublishedServerUrl: https://jellyfin.media.svc.${CLUSTER_DOMAIN}
            ports:
              - name: http
                containerPort: 8096
            # Intel QuickSync: the node's iGPU is passed through to
            # wk-main-efficiency (hostpci intel-igpu, i915 extension in the
            # image) and shows up as /dev/dri — mounted below via hostPath,
            # no privileged mode needed (the image runs as root).
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 4Gi
            # Generous: first boot initializes the library DB and the first
            # transcode can take a while (mirrors immich/paperless posture).
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
      sabnzbd:
        type: deployment
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: '[{"name":"vlan-2080","ips":["10.20.80.205/24"]}]'
        initContainers:
          vpn-routes:
            image:
              repository: ghcr.io/nicolaka/netshoot
              tag: v0.16
            command: ["sh", "/scripts/attach.sh"]
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
          host-whitelist:
            image:
              repository: linuxserver/sabnzbd
              tag: "5.1.3@sha256:4f7ee6c53834bc336365bd0a7c35f4fc870156a72d33a334753010258aa077a4"
            command:
              - sh
              - -c
              - |
                python3 - <<'PY'
                import pathlib, re
                p = pathlib.Path("/config/sabnzbd.ini")
                want = ["localhost", "media-sabnzbd.media",
                        "media-sabnzbd.media.svc.cluster.local",
                        "sabnzbd.media.svc.ngoldack.de"]
                if not p.exists():
                    p.write_text("[misc]\nhost_whitelist = localhost\n")
                def repl(m):
                    cur = [x.strip() for x in m.group(1).split(",") if x.strip()]
                    merged = cur + [w for w in want if w not in cur]
                    return "host_whitelist = " + ",".join(merged)
                s = p.read_text()
                s2, n = re.subn(r'^host_whitelist\s*=\s*(.*)$', repl, s, flags=re.M)
                p.write_text(s2)
                print("merged host_whitelist entries:", n)
                PY
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
            resources:
              requests:
                cpu: 10m
                memory: 30Mi
              limits:
                memory: 80Mi
        containers:
          main:
            image:
              repository: linuxserver/sabnzbd
              tag: "5.1.3@sha256:4f7ee6c53834bc336365bd0a7c35f4fc870156a72d33a334753010258aa077a4"
            env:
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
              TZ: Europe/Berlin
            ports:
              - name: http
                containerPort: 8080
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
      sonarr:
        type: deployment
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: '[{"name":"vlan-2080","ips":["10.20.80.201/24"]}]'
        initContainers:
          vpn-routes:
            image:
              repository: ghcr.io/nicolaka/netshoot
              tag: v0.16
            command: ["sh", "/scripts/attach.sh"]
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
          external-auth:
            image:
              repository: docker.io/library/busybox
              tag: "1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662"
            # Sonarr/Radarr/Prowlarr "trust the external authentication
            # layer" (goauthentik sonarr integration): set
            # AuthenticationMethod=External in config.xml. Idempotent; if the
            # file is missing (very first boot) the app creates it with its
            # default and the next restart external-izes it.
            command:
              - sh
              - -c
              - |
                echo "external-auth init"
                # strip trailing whitespace from the image lines
                sed -i 's#<AuthenticationMethod>[^<]*#<AuthenticationMethod>External#' /config/config.xml
                if [ ! -f /config/config.xml ] || ! grep -q '<AuthenticationMethod>' /config/config.xml; then
                  echo "config.xml not yet seeded; will external-ize on next start"
                else
                  grep -o '<AuthenticationMethod>[^<]*' /config/config.xml || true
                fi
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
            resources:
              requests:
                cpu: 10m
                memory: 20Mi
              limits:
                memory: 50Mi
        containers:
          main:
            image:
              repository: linuxserver/sonarr
              tag: "4.0.19@sha256:82172b363f9eddc02aca544f880a044f2ceb9aaf190bc87e4454e2f705eb91d0"
            env:
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
              TZ: Europe/Berlin
              # PostgreSQL (media-database, see postgres.yaml). By default the
              # *arr apps keep everything in SQLite on the config PVC; these
              # vars switch them to the shared cluster, where the state is
              # snapshotted and backed up with the rest of the platform. The
              # password comes from the SOPS secret, never a literal here.
              # `-rw` is CNPG's primary Service (the cluster is single-instance).
              SONARR__POSTGRES__HOST: media-database-rw.media.svc.cluster.local
              SONARR__POSTGRES__PORT: "5432"
              SONARR__POSTGRES__USER: media
              SONARR__POSTGRES__PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: media-database-credentials
                    key: password
              SONARR__POSTGRES__MAINDB: sonarr-main
              SONARR__POSTGRES__LOGDB: sonarr-log
            ports:
              - name: http
                containerPort: 8989
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
      radarr:
        type: deployment
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: '[{"name":"vlan-2080","ips":["10.20.80.202/24"]}]'
        initContainers:
          vpn-routes:
            image:
              repository: ghcr.io/nicolaka/netshoot
              tag: v0.16
            command: ["sh", "/scripts/attach.sh"]
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
          external-auth:
            image:
              repository: docker.io/library/busybox
              tag: "1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662"
            # Sonarr/Radarr/Prowlarr "trust the external authentication
            # layer" (goauthentik sonarr integration): set
            # AuthenticationMethod=External in config.xml. Idempotent; if the
            # file is missing (very first boot) the app creates it with its
            # default and the next restart external-izes it.
            command:
              - sh
              - -c
              - |
                echo "external-auth init"
                # strip trailing whitespace from the image lines
                sed -i 's#<AuthenticationMethod>[^<]*#<AuthenticationMethod>External#' /config/config.xml
                if [ ! -f /config/config.xml ] || ! grep -q '<AuthenticationMethod>' /config/config.xml; then
                  echo "config.xml not yet seeded; will external-ize on next start"
                else
                  grep -o '<AuthenticationMethod>[^<]*' /config/config.xml || true
                fi
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
            resources:
              requests:
                cpu: 10m
                memory: 20Mi
              limits:
                memory: 50Mi
        containers:
          main:
            image:
              repository: linuxserver/radarr
              tag: "6.3.0@sha256:fe051413dfd91b383ba04910552e83fb0306895fefee275c48dafe7bb90807dc"
            env:
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
              TZ: Europe/Berlin
              # PostgreSQL (media-database) — see the sonarr block above for
              # why, and postgres.yaml/database.yaml for the databases.
              RADARR__POSTGRES__HOST: media-database-rw.media.svc.cluster.local
              RADARR__POSTGRES__PORT: "5432"
              RADARR__POSTGRES__USER: media
              RADARR__POSTGRES__PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: media-database-credentials
                    key: password
              RADARR__POSTGRES__MAINDB: radarr-main
              RADARR__POSTGRES__LOGDB: radarr-log
            ports:
              - name: http
                containerPort: 7878
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
      prowlarr:
        type: deployment
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: '[{"name":"vlan-2080","ips":["10.20.80.203/24"]}]'
        initContainers:
          vpn-routes:
            image:
              repository: ghcr.io/nicolaka/netshoot
              tag: v0.16
            command: ["sh", "/scripts/attach.sh"]
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
          external-auth:
            image:
              repository: docker.io/library/busybox
              tag: "1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662"
            # Sonarr/Radarr/Prowlarr "trust the external authentication
            # layer" (goauthentik sonarr integration): set
            # AuthenticationMethod=External in config.xml. Idempotent; if the
            # file is missing (very first boot) the app creates it with its
            # default and the next restart external-izes it.
            command:
              - sh
              - -c
              - |
                echo "external-auth init"
                # strip trailing whitespace from the image lines
                sed -i 's#<AuthenticationMethod>[^<]*#<AuthenticationMethod>External#' /config/config.xml
                if [ ! -f /config/config.xml ] || ! grep -q '<AuthenticationMethod>' /config/config.xml; then
                  echo "config.xml not yet seeded; will external-ize on next start"
                else
                  grep -o '<AuthenticationMethod>[^<]*' /config/config.xml || true
                fi
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
            resources:
              requests:
                cpu: 10m
                memory: 20Mi
              limits:
                memory: 50Mi
        containers:
          main:
            image:
              repository: linuxserver/prowlarr
              tag: "2.5.2@sha256:aaa16ba7d66e413db6d0358d3b6c68d833578ba7f176f24a51807181e7637fce"
            env:
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
              TZ: Europe/Berlin
              # PostgreSQL (media-database) — see the sonarr block above for
              # why, and postgres.yaml/database.yaml for the databases.
              PROWLARR__POSTGRES__HOST: media-database-rw.media.svc.cluster.local
              PROWLARR__POSTGRES__PORT: "5432"
              PROWLARR__POSTGRES__USER: media
              PROWLARR__POSTGRES__PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: media-database-credentials
                    key: password
              PROWLARR__POSTGRES__MAINDB: prowlarr-main
              PROWLARR__POSTGRES__LOGDB: prowlarr-log
            ports:
              - name: http
                containerPort: 9696
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
      # The one shared WireGuard tunnel for the whole download/indexer chain.
      #
      # A WireGuard peer is identified by its public key, so a sidecar per app
      # sharing one config would be a single peer whose endpoint flips to
      # whichever pod handshook last — only one of them would ever work. Instead
      # the tunnel lives here, on the VLAN 2080 address (10.20.80.200) the app
      # pods route their default through, and this pod does what a router does:
      # masquerade their traffic into wg0 (media-vpn.nft), drop anything that
      # tries to leave any other way, and clamp MSS to the tunnel MTU.
      vpn-gateway:
        type: deployment
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: '[{"name":"vlan-2080","ips":["10.20.80.200/24"]}]'
        containers:
          main:
            image:
              repository: linuxserver/wireguard
              tag: "1.0.20260223-r0-ls122@sha256:dca67384e3e9a5bcc288461fa983e6fcb0e248e5a2d8e5b3e5d3f753bfac3e35"
            # Bypass the image's s6 entrypoint (which would run wg-quick and
            # rewrite the pod's shared /etc/resolv.conf): the script owns the
            # interface, the routes and the firewall. The image is used for its
            # tooling — wg, wg-quick strip, iproute2, nftables.
            command: ["/bin/sh", "/scripts/gateway.sh"]
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            probes:
              # The pod is not usable (and the apps' egress fails closed) until
              # the first handshake lands; 60 x 5s gives the tunnel five
              # minutes to come up at boot.
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/bin/sh", "/scripts/healthcheck.sh"]
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/bin/sh", "/scripts/healthcheck.sh"]
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
    service:
      jellyfin:
        controller: jellyfin
        ports:
          http:
            port: 8096
      sabnzbd:
        controller: sabnzbd
        ports:
          http:
            port: 8080
      sonarr:
        controller: sonarr
        ports:
          http:
            port: 8989
      radarr:
        controller: radarr
        ports:
          http:
            port: 7878
      prowlarr:
        controller: prowlarr
        ports:
          http:
            port: 9696
    persistence:
      # The route script, mounted into the download pods' init container (not
      # the app container — nothing else needs it).
      vpn-routes:
        type: configMap
        name: vpn-routes
        advancedMounts:
          sabnzbd:
            vpn-routes:
              - path: /scripts
          sonarr:
            vpn-routes:
              - path: /scripts
          radarr:
            vpn-routes:
              - path: /scripts
          prowlarr:
            vpn-routes:
              - path: /scripts
      # The WireGuard config (SOPS-encrypted Secret) and the gateway's own
      # scripts, mounted only into the gateway pod. /wg, not /etc/wireguard:
      # the image ships /etc/wireguard as a symlink to /config/wg_confs.
      wireguard:
        type: secret
        name: media-wireguard
        advancedMounts:
          vpn-gateway:
            main:
              - path: /wg
                readOnly: true
      vpn-gateway-scripts:
        type: configMap
        name: vpn-gateway
        advancedMounts:
          vpn-gateway:
            main:
              - path: /scripts
      library:
        type: persistentVolumeClaim
        existingClaim: media-library
        advancedMounts:
          sabnzbd:
            main:
              - path: /data
          sonarr:
            main:
              - path: /data
          radarr:
            main:
              - path: /data
          jellyfin:
            main:
              # Read-only: Jellyfin plays the library, it never writes to it.
              - path: /media
                readOnly: true
      jellyfin-config:
        type: persistentVolumeClaim
        existingClaim: jellyfin-config
        advancedMounts:
          jellyfin:
            main:
              - path: /config
      # Jellyfin's transcode scratch: deliberately NOT on NFS (transcodes are
      # throwaway, high-churn and would hammer the NAS).
      jellyfin-cache:
        type: emptyDir
        sizeLimit: 20Gi
        advancedMounts:
          jellyfin:
            main:
              - path: /cache
      # QuickSync device: the node's passthrough iGPU. Exposes card0 +
      # renderD128; Jellyfin picks VAAPI/QSV up from the container's
      # transcoding menu (no privileged mode, the image runs as root).
      dri:
        type: hostPath
        hostPath: /dev/dri
        hostPathType: Directory
        advancedMounts:
          jellyfin:
            main:
              - path: /dev/dri
      sabnzbd-config:
        type: persistentVolumeClaim
        existingClaim: sabnzbd-config
        advancedMounts:
          sabnzbd:
            main:
              - path: /config
            host-whitelist:
              - path: /config
      sonarr-config:
        type: persistentVolumeClaim
        existingClaim: sonarr-config
        advancedMounts:
          sonarr:
            main:
              - path: /config
            external-auth:
              - path: /config
      radarr-config:
        type: persistentVolumeClaim
        existingClaim: radarr-config
        advancedMounts:
          radarr:
            main:
              - path: /config
            external-auth:
              - path: /config
      prowlarr-config:
        type: persistentVolumeClaim
        existingClaim: prowlarr-config
        advancedMounts:
          prowlarr:
            main:
              - path: /config
            external-auth:
              - path: /config
