apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
  labels:
    # Gate labels the Gateway's allowedRoutes selectors require. The edge label
    # is what httproute-edge.yaml attaches headlamp.ngoldack.de with; the
    # public-ingress label is vestigial (the LAN twin route was retired with the
    # split-horizon design) but kept so re-adding a LAN route needs no label
    # change. Headlamp authenticates with native OIDC — there is no proxy
    # outpost in front of it.
    gateway.ngoldack.de/public-ingress: "true"
    gateway.ngoldack.de/edge-ingress: "true"
    # Pod Security Admission: audit+warn at `restricted`, enforcement left to
    # Talos' cluster default (`baseline`). What actually surfaces drift here is
    # the `warn` level (kubectl warnings) and Kyverno's PolicyReports — NOT the
    # `audit` level: this cluster runs no API audit policy (Talos leaves audit
    # logging off and nothing in tofu/ configures it), so `audit:` records
    # nothing today. Reported-only on purpose besides: a live check on
    # 2026-09-17 found almost every workload violating `restricted`
    # (runAsNonRoot, seccompProfile, capabilities.drop, allowPrivilegeEscalation)
    # and Kyverno's four policies do not cover those fields, so
    # `enforce: restricted` needs those securityContexts added workload by
    # workload first.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 1h
  dependsOn:
    - name: cert-manager
  chart:
    spec:
      chart: headlamp
      version: "0.45.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
      interval: 1h
  targetNamespace: headlamp
  values:
    config:
      watchPlugins: true
      # Native per-user OIDC login via authentik (see ../authentik/seed.yaml
      # headlamp-oidc provider). externalSecret injects the whole Secret as
      # OIDC_* env (chart envFrom); the non-secret OIDC fields are read from
      # config.oidc.* to toggle the matching args. Client secret + issuer live
      # in headlamp-oidc.sops.yaml and MUST match the authentik provider.
      oidc:
        externalSecret:
          enabled: true
          name: headlamp-oidc
          hasScopes: true
        callbackURL: https://headlamp.ngoldack.de/oidc-callback
        usePKCE: true
        validatorClientID: headlamp-oidc
        # Application-slug path, not the client id: …/application/o/headlamp-oidc/
        # 404s (the id_token's iss claim carries /application/o/headlamp/), and
        # the apiserver's --oidc-issuer-url in tofu/home/talos.tf must match the
        # same string. The Secret's OIDC_VALIDATOR_ISSUER_URL already carries
        # the correct value; this keeps the chart value from contradicting it.
        validatorIssuerURL: https://authentik.ngoldack.de/application/o/headlamp
    pluginsManager:
      enabled: true
      baseImage: node:lts-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
      version: latest
      configContent: |
        plugins:
          - name: headlamp_flux
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
            version: 0.7.0
          - name: headlamp_cert-manager
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
            version: 0.1.1
          - name: headlamp_keda
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_keda
            version: 0.1.2
          - name: headlamp_ai_assistant
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_ai_assistant
            version: 0.4.0-alpha
          - name: headlamp-click-ops
            source: https://artifacthub.io/packages/headlamp/headlamp-click-ops/headlamp-click-ops
            version: 0.4.0
        installOptions:
          parallel: true
          maxConcurrent: 3
    # The chart's built-in httpRoute stays disabled because this namespace's
    # exposure is declared explicitly in httproute-edge.yaml (edge Gateway), and
    # login is native OIDC via config.oidc.* above — the provider is seeded in
    # ../authentik/seed.yaml. Security note: this release's pod ServiceAccount
    # carries a cluster-admin binding, so the dashboard's server-side identity
    # is far more privileged than any signed-in user; that binding is the
    # remaining item to retire now that per-user OIDC works.
    httpRoute:
      enabled: false
