# NetBird mesh exposure for the LiteLLM proxy UI's OIDC (generic SSO) login.
#
# LiteLLM drives the OAuth2 flow itself, so the browser must reach LiteLLM
# directly (not via the Authentik outpost). The DNS record is
# <metadata.name>.<router dnsZone> => litellm.netbird.${DOMAIN}, matching
# PROXY_BASE_URL and the redirect_uri of the Authentik "litellm" provider.
#
# The shared router (perplexity-stack-router) and the "perplexity-stack" group
# are defined alongside Authentik (kubernetes/apps/authentik/netbird.yaml);
# the group is referenced here by name since it lives in another namespace.
apiVersion: netbird.io/v1alpha1
kind: NetworkResource
metadata:
  name: litellm
  namespace: litellm
spec:
  networkRouterRef:
    name: perplexity-stack-router
    namespace: authentik
  serviceRef:
    name: litellm
  groups:
    - name: perplexity-stack
