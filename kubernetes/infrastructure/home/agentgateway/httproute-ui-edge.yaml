# agentgateway.ngoldack.de — the agentgateway control-plane UI, gated by the
# authentik proxy outpost (the UI has no auth of its own; the outpost pattern
# matches hindsight-ui/grafana/media). NO path match: the outpost must also
# serve its own /outpost.goauthentik.io/* callback paths. Backend is the
# authentik outpost (ns authentik), which SSO-gates then proxies to
# agentgateway-ui:15000 (ui-service.yaml) — the ReferenceGrant entry lives in
# ../authentik/httproutes-edge.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-ui-edge
  namespace: agentgateway
spec:
  parentRefs:
    - name: edge
      namespace: network
      sectionName: https-apex
  hostnames:
    - agentgateway.ngoldack.de
  rules:
    - backendRefs:
        - name: authentik-proxy
          namespace: authentik
          port: 9000
