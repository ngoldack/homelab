# Allowlists for the drill namespaces, plus the one rule the metric push needs
# in the monitoring namespace.
#
# Granularity, stated plainly: each *-drill namespace is treated as ONE trust
# domain (endpointSelector `{}` + a namespace-wide allowlist rather than the
# repo's usual per-workload split). The namespace contains only drill-owned
# endpoints — the recovered CNPG instance pods and the recovery Job pod that
# CNPG creates for this Cluster — and the Job's label set is the operator's to
# decide, which is exactly why selecting it by workload label is the wrong
# shape here: a missed label would silently block the S3 egress the restore
# depends on. The boundary that matters (drill namespace vs everything else)
# is enforced as strictly as anywhere else in the repo, and the peer sets below
# are the whole of what a recovered database needs:
#
#   ingress: kubelet probes; the CNPG operator + barman plugin from
#     cnpg-system (instance manager 5432/8000, the flow the paperless pilot
#     proved with the drop monitor); the drill namespace's own pods
#     (instance <-> recovery Job);
#   egress: DNS; its own pods; the Kubernetes API (three addressing forms, as
#     in cnpg-operator/cilium-allowlist.yaml); and world:443 for the S3
#     endpoint the backup lives on — the only off-cluster destination.
#
# The five blocks are deliberately byte-identical apart from namespace names;
# change one, change all five.
---
# The control namespace: the drill driver. It talks to the Kubernetes API and
# posts metrics; it has no reason to reach any database, because the invariant
# query runs through `kubectl exec` inside the recovered pod (API traffic, not
# pod-to-pod traffic). That absence is the point — the drill cannot read a live
# database over the network, only its own restored copy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpg-restore-drills-allowlist
  namespace: cnpg-restore-drills
spec:
  endpointSelector:
    matchLabels: {}
  ingress:
    - fromEntities:
        - health
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    - toCIDRSet:
        - cidr: 10.30.0.10/32
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    - toCIDRSet:
        - cidr: 172.21.0.0/16
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    # VictoriaMetrics import endpoint (drill result metrics). The destination
    # side of this flow is the rule in monitoring-vmsingle-restore-drill-import
    # at the end of this file: Cilium allows are the union, but the vmsingle
    # pod's own baseline denies cross-namespace peers unless named.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - {port: "8428", protocol: TCP}
---
