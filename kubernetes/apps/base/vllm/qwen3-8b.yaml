# Qwen3-8B served by vLLM (CPU backend) as a plain Deployment.
# Always-warm (1 replica) low-latency chat / Home Assistant slot.
#
# Weights are staged in the MinIO `vllm-models` bucket and copied into an
# emptyDir by an initContainer (the cluster has no KServe storage-initializer);
# vLLM then serves them from the local path. Exposed in-cluster as a Service and
# routed to only via LiteLLM (the model gateway).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-8b
  namespace: vllm
  labels:
    app.kubernetes.io/name: qwen3-8b
    app.kubernetes.io/part-of: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qwen3-8b
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen3-8b
        app.kubernetes.io/part-of: vllm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        ai: "true"
      tolerations:
        - key: "ai"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      initContainers:
        # Pull the model weights from MinIO into the shared emptyDir.
        - name: fetch-model
          image: amazon/aws-cli:2.31.21
          command:
            - /bin/sh
            - -c
            - >-
              aws --endpoint-url "$AWS_ENDPOINT_URL"
              s3 sync "s3://vllm-models/qwen3-8b" /models/qwen3-8b
          env:
            - name: AWS_ENDPOINT_URL
              value: http://minio.minio.svc.cluster.local
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: vllm-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: vllm
          # CPU-only build (AVX2). GPU upgrade path: swap to vllm/vllm-openai
          # and add --device=cuda + nvidia.com/gpu resources.
          image: vllm/vllm-openai-cpu:v0.22.0-x86_64
          command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - "--model"
            - "/models/qwen3-8b"
            - "--served-model-name"
            - "qwen3-8b"
            - "--port"
            - "8080"
            - "--device=cpu"
            - "--dtype=bfloat16"
            - "--max-model-len=8192"
            - "--max-num-batched-tokens=4096"
            - "--max-num-seqs=64"
            # Per-instance KV reuse for repeated prompt prefixes (CPU-safe).
            - "--enable-prefix-caching"
            # Emit request traces over OTLP gRPC to the otel-gateway (-> Tempo).
            - "--otlp-traces-endpoint"
            - "http://otel-gateway.monitoring.svc.cluster.local:4317"
          env:
            - name: VLLM_CPU_OMP_THREADS_BIND
              value: "0-7"
            - name: VLLM_CPU_NUM_OF_RESERVED_CPU
              value: "1"
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "6"
            # LMCache shared KV pool. NOTE: LMCache ships CUDA-only wheels and
            # will NOT load on the CPU image; these are inert until the cluster
            # gains a GPU node + a CUDA vLLM image. Kept so the wiring is ready.
            - name: LMCACHE_CHUNK_SIZE
              value: "256"
            - name: LMCACHE_REMOTE_URL
              value: redis://vllm-cache-valkey.vllm.svc.cluster.local:6379
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: HF_TOKEN
          securityContext:
            capabilities:
              # vLLM CPU backend uses sched_setaffinity for OMP thread pinning.
              add: ["SYS_NICE"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "12Gi"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: models
          emptyDir:
            sizeLimit: 20Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-8b
  namespace: vllm
  labels:
    app.kubernetes.io/name: qwen3-8b
    app.kubernetes.io/part-of: vllm
spec:
  selector:
    app.kubernetes.io/name: qwen3-8b
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
