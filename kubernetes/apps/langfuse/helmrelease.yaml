# Langfuse v3 (LLM trace observability) wired to this cluster's own services:
#   - Postgres  -> langfuse-postgres (CloudNativePG, external)
#   - Redis     -> langfuse-valkey (Valkey operator, external, passwordless)
#   - S3 blobs  -> SeaweedFS bucket "langfuse" (creds from langfuse-s3-credentials)
#   - ClickHouse-> bundled subchart, trimmed to a single non-clustered node
#                  (clusterEnabled=false avoids ZooKeeper) for the homelab.
#
# NOTE: the chart uses bitnami-legacy images (allowInsecureImages); ClickHouse is
# still a heavy stateful service on the AI node. kagent emits OTLP traces here.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langfuse
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: langfuse
  chart:
    spec:
      chart: langfuse
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: langfuse
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: false
  values:
    global:
      security:
        allowInsecureImages: true
    langfuse:
      nextauth:
        url: "https://langfuse.netbird.${DOMAIN}"
        secret:
          secretKeyRef:
            name: langfuse-secrets
            key: NEXTAUTH_SECRET
      salt:
        secretKeyRef:
          name: langfuse-secrets
          key: SALT
      encryptionKey:
        secretKeyRef:
          name: langfuse-secrets
          key: ENCRYPTION_KEY
    # External CloudNativePG.
    postgresql:
      deploy: false
      host: langfuse-postgres-rw.langfuse.svc.cluster.local
      port: 5432
      auth:
        username: langfuse
        database: langfuse
        existingSecret: langfuse-postgres-credentials
        secretKeys:
          userPasswordKey: password
          adminPasswordKey: password
    # External Valkey (passwordless).
    redis:
      deploy: false
      host: langfuse-valkey.langfuse.svc.cluster.local
      port: 6379
      auth:
        username: null
        password: null
    # Bundled ClickHouse, single non-clustered node (no ZooKeeper) for a homelab.
    clickhouse:
      deploy: true
      clusterEnabled: false
      replicaCount: 1
      resourcesPreset: medium
      auth:
        username: default
        existingSecret: langfuse-secrets
        existingSecretKey: CLICKHOUSE_PASSWORD
    # External S3 -> in-cluster SeaweedFS bucket.
    s3:
      deploy: false
      bucket: langfuse
      region: us-east-1
      endpoint: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
      forcePathStyle: true
      accessKeyId:
        secretKeyRef:
          name: langfuse-s3-credentials
          key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        secretKeyRef:
          name: langfuse-s3-credentials
          key: AWS_SECRET_ACCESS_KEY
