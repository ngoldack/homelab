# LLM backends for the agentgateway — the AgentgatewayBackend resources.
#
# Replaces the aigateway (Envoy AI Gateway) lane's per-model backends:
# - aigateway/synthetic.yaml -> `synthetic` (host api.synthetic.new:443,
#   OpenAI-compatible /v1 — mirrored verbatim from the old EG Backend fqdn).
# NO OpenRouter. Removed 2026-09-22 for cost: the backend, the key Secret and
# every chain's OpenRouter leg are gone. Each backend below is Synthetic
# (through the in-cluster synthetic-proxy), so a Synthetic outage is an outage
# rather than a failover.
# - chat-chain's per-tier Synthetic providers -> `synthetic-small`,
#   `synthetic-large`, `synthetic-hf-deepseek`: the three provider stanzas
#   chat-chain lists as priority groups, each promoted to a single-provider
#   backend so a client can PIN a tier instead of walking the chain. Exposed
#   as /v1/synthetic-{small,large,deepseek} in routes.yaml; the stanzas are
#   verbatim copies, so edit chat-chain.yaml and here together.
#
# Every backend here is remote; there is no in-cluster model backend any more
# (the P100, llmkube and the llama-kv-broker were removed 2026-09-22).
#
# Auth: policies.auth.secretRef resolves the Authorization header from the
# named Secret ("Credential source for the authorization value, defaulting
# to ... the `Authorization` key" — CRD docs). TLS: policies.tls.sni pins
# SNI; the destination hostname alone would set the same SNI, but pinning
# makes the intent explicit (the old lane used BackendTLSPolicy hostname).
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: synthetic
  namespace: agentgateway
spec:
  ai:
    groups:
      - providers:
          - name: synthetic
            openai: {}
            host: synthetic-proxy.agentgateway.svc.cluster.local
            port: 8080
            path: /v1/chat/completions
            policies:
              auth:
                secretRef:
                  name: synthetic-key

---
# Per-tier Synthetic paths. Each of these is one of chat-chain's priority
# groups promoted to a single-provider backend, so a client that wants a
# specific tier can select it by path (routes.yaml) instead of walking the
# chain. Provider stanzas are verbatim copies of chat-chain's — the model
# strings are synthetic.new's tier aliases (`syn:*` = Synthetic's own models,
# `hf:*` = HuggingFace-hosted).
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: synthetic-small
  namespace: agentgateway
spec:
  ai:
    groups:
      - providers:
          - name: synthetic-small
            host: synthetic-proxy.agentgateway.svc.cluster.local
            port: 8080
            path: /v1/chat/completions
            openai:
              model: syn:small:text
            policies:
              auth:
                secretRef:
                  name: synthetic-key
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: synthetic-large
  namespace: agentgateway
spec:
  ai:
    groups:
      - providers:
          - name: synthetic-large
            host: synthetic-proxy.agentgateway.svc.cluster.local
            port: 8080
            path: /v1/chat/completions
            openai:
              model: syn:large:text
            policies:
              auth:
                secretRef:
                  name: synthetic-key
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: synthetic-hf-deepseek
  namespace: agentgateway
spec:
  ai:
    groups:
      - providers:
          - name: synthetic-hf-deepseek
            host: synthetic-proxy.agentgateway.svc.cluster.local
            port: 8080
            path: /v1/chat/completions
            openai:
              model: hf:deepseek-ai/DeepSeek-V4.1-Flash
            policies:
              auth:
                secretRef:
                  name: synthetic-key
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: synthetic-hf-openai-gpt-oss-120b
  namespace: agentgateway
spec:
  ai:
    groups:
      - providers:
          - name: synthetic-hf-openai-gpt-oss-120b
            host: synthetic-proxy.agentgateway.svc.cluster.local
            port: 8080
            path: /v1/chat/completions
            openai:
              model: hf:openai/gpt-oss-120b
            policies:
              auth:
                secretRef:
                  name: synthetic-key
