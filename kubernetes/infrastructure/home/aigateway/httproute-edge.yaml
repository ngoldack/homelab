# llm.ngoldack.de on the EDGE path, through the authentik outpost — the PUBLIC
# route to the shared P100 model, identity-gated like phoenix/hindsight. The
# outpost (authentik-proxy:9000) authenticates Basic + App Password then
# forwards to the P100 35B (the qwen36-35b InferenceService) directly via this
# proxy provider's internal_host (see the local-llm-proxy provider in
# ../authentik/seed.yaml).
#
# Scope: this hostname exposes ONLY the local model. The DeepSeek/OpenRouter
# routes live behind the data plane's LAN VIP (10.30.0.201) and are never
# reachable through this edge path. Cross-namespace backend to authentik-proxy
# is pre-authorized by the ReferenceGrant in ../authentik/httproutes-edge.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: local-llm-edge
  namespace: aigateway
spec:
  parentRefs:
    - name: edge
      namespace: network
      sectionName: https-apex
  hostnames:
    - llm.${CLUSTER_DOMAIN}
  rules:
    - backendRefs:
        - name: authentik-proxy
          namespace: authentik
          port: 9000
