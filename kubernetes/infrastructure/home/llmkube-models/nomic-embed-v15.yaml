# nomic-embed-text-v1.5 (f16) on the Tesla P100 — the fleet's embedding endpoint.
#
# 768-dim mean-pooled vectors served over llama.cpp's OpenAI-compatible
# POST /v1/embeddings on port 8080. This service shares the single P100 with the
# qwen36-35b chat model: the device plugin's time-slicing advertises
# nvidia.com/gpu: 2 so both pods can open the whole device, which means VRAM is
# budgeted here by hand (see nvidia/helmrelease.yaml).
#
# `--pooling mean` in extraArgs is LOAD-BEARING, not decoration: llmkube's
# embedding mode injects `--pooling last` for embedding Models, and flags passed
# through extraArgs win over the operator's own (verified in llmkube v0.9.25
# internal/controller/runtime_llamacpp_args.go). Omit it and every similarity
# score silently degrades to last-token pooling. (The GGUF does declare
# nomic-bert.pooling_type = MEAN, so an unforced server agrees — the flag is what
# keeps the operator's own default from overriding the file.)
#
# llmkube stages the GGUF into the shared model cache PVC mounted at /models, so
# llama-server is handed /models/<cacheKey>/nomic-embed-v15.gguf — the source URL
# below is a prefetch input, never a runtime fetch (hence prefetch).
#
# Embedding mode also auto-appends `--cache-ram 0`. llama.cpp's host-side prompt
# cache exists for completion (it keeps the prompt prefix for the next token),
# which is meaningless for a one-shot embedding request and would only pin RAM.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: nomic-embed-v15
  namespace: llmkube-system
spec:
  source: https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.f16.gguf
  format: gguf
  quantization: F16
  prefetch: true
  prefetchTolerations:
    - key: dedicated
      operator: Equal
      value: nvidia
      effect: NoSchedule
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      count: 1
      vendor: nvidia
      memory: "16Gi"
      layers: -1
  resources:
    cpu: "4"
    memory: "4Gi"
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: nomic-embed-v15
  namespace: llmkube-system
spec:
  modelRef: nomic-embed-v15
  # 0 = pxa canary window 2026-09-20 (VRAM: qwen36-35b-pxa-canary needs the full
  # card); restore replicas: 1 after the window (git-driven).
  replicas: 0
  # Same P100-patched mainline image as the chat service; the embedding endpoint
  # is a llama.cpp server flag, not a different engine.
  # Pinned: registry.ngoldack.de/llama-p100:0.4.0-p100
  image: registry.ngoldack.de/llama-p100@sha256:f5839c86e75d832fa538bd8b59715a8ea64dd20d356e2d1e9485b43d3a26aa6d
  # REQUIRED: without the nvidia RuntimeClass the pod schedules onto the GPU node
  # but never gets /dev/nvidia* bind-mounted and runs CPU-only.
  runtimeClassName: nvidia
  nodeSelector:
    hardware/gpu.model: Tesla-P100
  tolerations:
    - key: dedicated
      operator: Equal
      value: nvidia
      effect: NoSchedule
  mode: embedding
  # 2048 is the model's declared context (nomic-bert.context_length = 2048), and
  # llama.cpp treats it as a ceiling: at --ctx-size 8192 it logs
  # `n_ctx_seq (8192) > n_ctx_train (2048)` and /props then reports n_ctx = 2048.
  # The model card's 8192-token claim needs dynamic RoPE scaling at load time,
  # which this file does not carry (no rope.scaling keys; freq_base is a bare
  # 1000.0), so asking for 8192 would only advertise a capability that silently
  # degrades long inputs. Raising it is a separate job: an explicit ropeScaling
  # and an HF-transformers reference to check the embedding geometry against.
  contextSize: 2048
  # Embedding requests are not decoded — llama.cpp pushes the whole sequence
  # through ONE physical micro-batch and llama-server forces n_batch = n_ubatch
  # in embedding mode. At llama.cpp's default ubatch of 512 every input over 512
  # tokens fails with `input (N tokens) is too large to process. increase the
  # physical batch size`, which would cap this endpoint at a quarter of the
  # model's context, so both batch sizes are pinned to the context length.
  batchSize: 2048
  uBatchSize: 2048
  # Single slot: embeddings are one-shot, and llama.cpp otherwise splits the
  # context across slots, shrinking what a single request may carry.
  parallelSlots: 1
  extraArgs:
    - --pooling
    - mean
  endpoint:
    port: 8080
    type: ClusterIP
  resources:
    gpu: 1
    gpuMemory: "16Gi"
    cpu: "2"
    memory: "4Gi"
