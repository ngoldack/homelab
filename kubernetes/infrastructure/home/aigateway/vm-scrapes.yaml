# VMServiceScrape so vmagent collects the Envoy AI Gateway control-plane
# metrics: the controller exposes GenAI metrics (gen_ai.*) on its
# http-metrics port 8080 (the controller Service "ai-gateway-controller",
# port 8080). The external-processor pod's metrics are scraped from the Envoy
# data plane pod in envoy-gateway-system (not selected here — vmagent's
# selectAllByDefault already covers cluster workload, this pin keeps the
# control-plane scrape independent of naming).
#
# Phoenix ingests traces, not metrics (OTEL_METRICS_EXPORTER=none in
# otel-pipeline.yaml); these metrics land in VictoriaMetrics where the
# monitoring stack stores gen_ai.client.token.usage / request.duration.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: aigateway-controller
  namespace: aigateway
spec:
  endpoints:
    - port: "http-metrics"
      path: /metrics
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-gateway-helm
  namespaceSelector:
    matchNames:
      - aigateway
