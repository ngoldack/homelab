# Primary reasoning/tool-use model — routed through LiteLLM (the central model
# layer). The `default` alias maps to a concrete backend in apps/litellm/config
# (now Ollama on the P100s); switch the model there without touching this
# ModelConfig. The backend needs no auth; the kagent-vllm secret carries the
# dummy key the OpenAI client wants.
#
# VERIFY-BEFORE-DEPLOY: confirm the ModelConfig apiVersion/fields against the
# installed kagent CRDs (group kagent.dev; spec targets v1alpha2).
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: local-qwen-main
  namespace: kagent
spec:
  model: "default"
  provider: OpenAI
  openAI:
    baseUrl: "http://litellm.litellm.svc.cluster.local:4000/v1"
  apiKeySecret: kagent-vllm
  apiKeySecretKey: OPENAI_API_KEY
# TODO(spec): add a `local-embedding-model` ModelConfig (alias `embeddings` via
# LiteLLM) once kagent-native pgvector memory is enabled (memory is currently
# handled by Mem0).
