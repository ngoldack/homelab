# agentgateway — the AI gateway control plane from agentgateway.dev (kgateway
# lineage), running as a PARALLEL lane next to the existing aigateway lane
# (Envoy AI Gateway). Same job — LLM routing + auth + tracing for the LAN —
# different controller: this one is the agentgateway controller, which
# programs its own data-plane proxies from AgentgatewayBackend /
# AgentgatewayPolicy CRs attached to a Gateway of GatewayClass agentgateway.
#
# The label below lets the edge Gateway (network/edge.yaml, allowedRoutes from
# Selector) accept HTTPRoutes from this namespace later, mirroring aigateway.
apiVersion: v1
kind: Namespace
metadata:
  name: agentgateway
  labels:
    # Pod Security Admission: audit+warn at `restricted`, enforcement left to
    # Talos' cluster default (`baseline`). Restricted-level drift becomes
    # visible in the API audit log, in kubectl warnings and in Kyverno's
    # PolicyReports without being able to reject a pod; the flip to
    # `enforce: restricted` is a per-namespace decision once those reports are
    # clean.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    gateway.ngoldack.de/edge-ingress: "true"
