# clickhouse-operator allowlist — namespace-scoped zero-trust policy.
#
# Stage 1 granularity: this namespace is one trust domain (all pods may talk to
# each other and to the monitoring scrapers), and everything crossing the
# namespace boundary is denied unless named below. That delivers the property
# this rollout is for — cross-namespace traffic off by default — without
# betting on a per-workload flow map that has to be re-derived every time the
# application's internals change. The pilot namespaces (paperless, immich,
# hindsight, headlamp, monitoring, registry, buildkit, cert-manager, network)
# use the finer per-workload split; any of these can be tightened to that shape
# later without moving the boundary.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: clickhouse-operator-allowlist
  namespace: clickhouse-operator
spec:
  endpointSelector:
    matchLabels: {}
  ingress:
    # In-namespace trust domain.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: clickhouse-operator
    # Gateway-API ingress (reserved `ingress` identity) and kubelet probes
    # (reserved `health`).
    - fromEntities:
        - ingress
        - health
    # The monitoring scrape domain.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
    # The operator serves an admission webhook (9443) and metrics (8080) that
    # the API server and node-local scrapers call.
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
            - {port: "9443", protocol: TCP}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: clickhouse-operator
    # Operator -> ClickHouse pods (langfuse's OLAP cluster). 9000/9001 http,
    # 9009/9440 interserver + secure interserver, 8123 http-alt, 2181 keeper.
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - {port: "2181", protocol: TCP}
            - {port: "8123", protocol: TCP}
            - {port: "9000", protocol: TCP}
            - {port: "9001", protocol: TCP}
            - {port: "9009", protocol: TCP}
            - {port: "9440", protocol: TCP}
    # The Kubernetes API (entity, control-plane VIP, in-cluster Service CIDR —
    # all three addressing forms are live in this cluster).
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    - toCIDRSet:
        - cidr: 10.30.0.10/32
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    - toCIDRSet:
        - cidr: 172.21.0.0/16
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
