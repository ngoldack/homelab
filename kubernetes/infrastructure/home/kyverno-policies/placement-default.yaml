# Placement default: ordinary workloads land on the EFFICIENCY worker.
#
# Why a mutation policy and not a per-manifest edit: ~55 manifests across the
# tree steer home placement with `topology.homelab/site: home`, and BOTH home
# workers carry that label. There is no "which worker" in the manifests at all
# — placement between the two has been decided by scheduler scoring, which
# favours the emptier node, and that is the performance node. Adding a
# nodeSelector to every manifest would pin today's workloads and nothing else:
# the next workload added lands wherever scoring puts it. So the default is
# expressed once, where every new workload passes through.
#
# This is the ONLY mutating policy in this file set (all 14 sibling policies are
# validate rules), and the whole design is shaped by two measured facts about
# that:
#
#   1. Availability: `kyverno/helmrelease.yaml` sets
#      `features.forceFailurePolicyIgnore.enabled: true`, so a mutation that
#      fails to apply is silently ignored — a typo in a mutate field name
#      raises no admission error, it just stops working. Every field and patch
#      shape below was therefore driven through fixtures with the cluster's
#      Kyverno CLI (v1.19.1) and observed, not inferred.
#   2. AUTOGEN DOES NOT CARRY THIS RULE. Kyverno's autogen only regenerates
#      rules whose mutation it can mechanically translate, and a JSON patch
#      (6902) mutate that matches on Pod is excluded outright — verified by
#      measurement: a Deployment routed through this policy reports "Mutation
#      has been applied successfully" and then renders with no affinity at all.
#      Since Flux applies Deployments/StatefulSets/DaemonSets rather than Pods,
#      relying on autogen here would have made the policy a no-op on very
#      nearly every workload in the cluster. The controller kinds are therefore
#      spelled out as their own rules, each with the pod-template path written
#      literally.
#
# WHY A PREFERENCE AND NOT A PIN. `preferredDuringSchedulingIgnoredDuringExecution`
# is additive and non-binding: it cannot override a hard constraint, so a pod
# pinned to `node.kubernetes.io/instance-type=gpu-worker` (BuildKit), to
# `workload.hermes.io/sandbox=true` (the kata RuntimeClass carries that
# nodeSelector itself), to `hardware/igpu=...` (immich ML) or to
# `workload/media=true` (jellyfin) is unaffected — those selectors admit exactly
# one node, the preference has nothing left to reorder, and they stay managed
# where they are declared. It also cannot make anything unschedulable: when the
# efficiency worker cannot fit the pod, the scheduler falls back to the
# performance worker, which is the intended overflow. A required affinity or a
# nodeSelector would instead break that fallback and strand pods, because the
# efficiency worker is the BUSY node here (10 E-cores / 28 GiB, measured at
# ~71% of its cpu requests and ~72% of its actual memory) and the performance
# worker is the idle one.
#
# THE PATCH SHAPE is one operational op:
#     add /…/preferredDuringSchedulingIgnoredDuringExecution/-
# Three alternatives were measured against fixtures and rejected:
#   * `patchStrategicMerge` CREATES the absent intermediate keys, but because
#     this is unsupported on the mutation it REPLACES the whole array: a
#     fixture carrying an existing `topology.homelab/site` preference came back
#     with only the new term. (It is also the form that would have made autogen
#     work — the tradeoff documented above.)
#   * `add` at `/spec/affinity` (or at the array path) with a full value
#     REPLACES that member. On a pod that has `affinity` but no `nodeAffinity`
#     — authentik's required one-server-per-node podAntiAffinity, the hindsight
#     workers' spread, the hermes agent StatefulSets — that would wipe the
#     existing term, i.e. delete a load-bearing constraint to add a preference.
#   * splitting the work across two rules separated by a presence precondition
#     DOUBLE-APPLIES: preconditions are evaluated against the object as it
#     arrived, so both rules fire and the pod gets two identical terms.
# The single `-/` op instead appends to an existing list and creates the
# missing `/spec/affinity` and `/spec/affinity/nodeAffinity` levels on the way
# — verified on a no-affinity pod (term created), on a pod with an existing
# preferred term (existing term RETAINED, new one appended) and on a pod
# carrying only podAntiAffinity (anti-affinity intact, preference added).
#
# Not migrated here, because their placement is not a preference and the
# preference cannot disturb them anyway:
#   * volume-topology pinning — the `nvmeof` storage classes
#     (truenas-fast-nvmeof and the four per-app ones) are
#     volumeBindingMode: WaitForFirstConsumer, i.e. bound to whichever node
#     first scheduled the pod, so a CNPG instance's node is decided by its
#     volume. Every `nfs` class is Immediate and therefore node-agnostic,
#     including truenas-fast-nfs-immich-cache.
#   * the deliberate residents — BuildKit and the Kata sandboxes, pinned by the
#     hard selectors above.
#
# SCOPE. Workloads only. The sibling validate policies' platform-namespace
# exclusion list applies here too: those planes are pinned for their own
# reasons, and the CNI/CSI DaemonSets must keep running on BOTH workers — a
# class preference on them would skew the performance node's coverage.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: prefer-efficiency-worker-placement
  annotations:
    policies.kyverno.io/title: Prefer the efficiency worker for ordinary workloads
    policies.kyverno.io/category: Platform
    policies.kyverno.io/severity: low
    # Belt and braces: this policy does not rely on autogen (see the header),
    # and saying so explicitly stops a future reader from "fixing" it by
    # removing the explicit controller rules.
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  # A mutation policy has no validationFailureAction, and background scanning
  # is off: this must only ever run on admission, never re-evaluate stored
  # objects.
  background: false
  rules:
    # One rule per kind, each with the pod template path written literally.
    # They share the same match/exclude/precondition/mutate shape; Kyverno has
    # no loop construct for this, and the duplication is the price of not
    # depending on autogen.
    - name: prefer-efficiency-pods
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces: &app-namespaces
                - authentik
                - paperless
                - immich
                - langfuse
                - hindsight
                - headlamp
                - hermes
                - agentgateway
                - aigateway
                - registry
                - talos-backup
                - unpoller
                - homelab-infra-metrics
                - otel
                - valkey-operator-system
                - clickhouse-operator
                - seaweedfs-operator
                - matrix
                - books
                - media
                - monitoring
      # Leave an explicit performance request untouched. The condition-object
      # shape (`key`/`operator`/`value`) is the one the sibling policies use —
      # a bare `{{ … }}` string carries no operator to evaluate. An absent
      # nodeSelector key yields '', which is NotIn the list, so ordinary
      # workloads still get the preference.
      #
      # Note this reads the POD TEMPLATE for the controller rules below, which
      # is where a workload's nodeSelector lives.
      preconditions:
        any:
          - key: "{{ request.object.spec.nodeSelector.\"node.homelab/class\" || '' }}"
            operator: NotIn
            value:
              - performance
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/affinity/nodeAffinity/preferredDuringSchedulingIgnoredDuringExecution/-
            value:
              weight: 100
              preference:
                matchExpressions:
                  - key: node.homelab/class
                    operator: In
                    values:
                      - efficiency
    - name: prefer-efficiency-deployments
      match:
        any:
          - resources:
              kinds:
                - Deployment
              namespaces: *app-namespaces
      preconditions:
        any:
          - key: "{{ request.object.spec.template.spec.nodeSelector.\"node.homelab/class\" || '' }}"
            operator: NotIn
            value:
              - performance
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/template/spec/affinity/nodeAffinity/preferredDuringSchedulingIgnoredDuringExecution/-
            value:
              weight: 100
              preference:
                matchExpressions:
                  - key: node.homelab/class
                    operator: In
                    values:
                      - efficiency
    - name: prefer-efficiency-statefulsets
      match:
        any:
          - resources:
              kinds:
                - StatefulSet
              namespaces: *app-namespaces
      preconditions:
        any:
          - key: "{{ request.object.spec.template.spec.nodeSelector.\"node.homelab/class\" || '' }}"
            operator: NotIn
            value:
              - performance
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/template/spec/affinity/nodeAffinity/preferredDuringSchedulingIgnoredDuringExecution/-
            value:
              weight: 100
              preference:
                matchExpressions:
                  - key: node.homelab/class
                    operator: In
                    values:
                      - efficiency
    - name: prefer-efficiency-daemonsets
      match:
        any:
          - resources:
              kinds:
                - DaemonSet
              namespaces: *app-namespaces
      preconditions:
        any:
          - key: "{{ request.object.spec.template.spec.nodeSelector.\"node.homelab/class\" || '' }}"
            operator: NotIn
            value:
              - performance
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/template/spec/affinity/nodeAffinity/preferredDuringSchedulingIgnoredDuringExecution/-
            value:
              weight: 100
              preference:
                matchExpressions:
                  - key: node.homelab/class
                    operator: In
                    values:
                      - efficiency
    - name: prefer-efficiency-jobs
      match:
        any:
          - resources:
              kinds:
                - Job
              namespaces: *app-namespaces
      preconditions:
        any:
          - key: "{{ request.object.spec.template.spec.nodeSelector.\"node.homelab/class\" || '' }}"
            operator: NotIn
            value:
              - performance
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/template/spec/affinity/nodeAffinity/preferredDuringSchedulingIgnoredDuringExecution/-
            value:
              weight: 100
              preference:
                matchExpressions:
                  - key: node.homelab/class
                    operator: In
                    values:
                      - efficiency
    - name: prefer-efficiency-cronjobs
      match:
        any:
          - resources:
              kinds:
                - CronJob
              namespaces: *app-namespaces
      preconditions:
        any:
          - key: "{{ request.object.spec.jobTemplate.spec.template.spec.nodeSelector.\"node.homelab/class\" || '' }}"
            operator: NotIn
            value:
              - performance
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/jobTemplate/spec/template/spec/affinity/nodeAffinity/preferredDuringSchedulingIgnoredDuringExecution/-
            value:
              weight: 100
              preference:
                matchExpressions:
                  - key: node.homelab/class
                    operator: In
                    values:
                      - efficiency
