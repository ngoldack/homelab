apiVersion: v1
kind: ConfigMap
metadata:
  name: localai-monitoring-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  localai-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "title": "LLM Tokens Per Second",
          "type": "timeseries",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "editorMode": "code",
              "expr": "rate(localai_tokens_generated_total[5m])",
              "legendFormat": "{{model}}",
              "range": true,
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "title": "LocalAI Total Generations",
          "type": "timeseries",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "editorMode": "code",
              "expr": "sum(localai_request_duration_seconds_count) by (model)",
              "legendFormat": "{{model}}",
              "range": true,
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["ai", "localai"],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "LocalAI Monitoring Dashboard",
      "uid": "localai-metrics-dashboard",
      "version": 1
    }
