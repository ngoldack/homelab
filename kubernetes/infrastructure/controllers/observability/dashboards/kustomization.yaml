apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: node-summary-dashboard
    files:
      - node-summary.json
  - name: k8s-overview-dashboard
    files:
      - k8s-overview.json
  - name: ai-platform-summary-dashboard
    files:
      - ai-platform-summary.json
  - name: container-logs-dashboard
    files:
      - container-logs.json

generatorOptions:
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_dashboard_folder: "Homelab"
  disableNameSuffixHash: true
