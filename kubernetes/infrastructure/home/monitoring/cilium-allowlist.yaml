# monitoring allowlists.
#
# This namespace is the cluster's scrape hub, so its egress rule is the one
# deliberately broad rule in the rollout: vmagent (and the VM operator's own
# service-discovery scrapes) must reach every exporter in every namespace.
# It is bounded by PORT rather than by peer — `toEntities: [cluster]` plus the
# explicit exporter port list below — so it cannot reach arbitrary services on
# arbitrary ports, and it is still subject to the destination namespace's own
# ingress allowlist once that namespace is migrated (Cilium allows are the
# union, but a destination that denies monitoring on its port still blocks it).
---
# Grafana: the only user-facing workload. Its edge route backends
# authentik-proxy (the outpost), so the operative inbound path is the outpost
# pod in the authentik namespace; the Gateway (`ingress`) rule is kept because
# the outpost is configured with the app's route URL and may hairpin through
# envoy. Both are needed for login to work end to end.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-grafana-allowlist
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: monitoring-victoria-metrics-k8s-stack
      app.kubernetes.io/name: grafana
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - fromEntities:
        - health
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # vmagent scrapes grafana's own metrics; same-namespace scrape domain.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Grafana supports the authentik OIDC login and, at container start,
    # preinstalls the community plugin image list (GF_PLUGINS_PREINSTALL_SYNC
    # fetches it from grafana.com) — both are internet HTTPS.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Grafana's NATIVE OIDC login (auth.generic_oauth -> /login/generic_oauth,
    # NOT the edge outpost): auth_url/token_url/api_url are the edge hostnames
    # (https://authentik.ngoldack.de/...), so the token and userinfo calls
    # traverse the Gateway and Cilium checks THIS pod's egress against the
    # route's BACKEND — the portal-bridge pod in the authentik namespace. The
    # `world:443` rule above does NOT cover that (the backend is an in-cluster
    # pod), and without this rule the edge answers 403 "Access denied" and the
    # login dies after the callback with:
    #   [auth.oauth.token.exchange] failed to exchange code to token:
    #   oauth2: cannot fetch token: 403 Forbidden / Response: Access denied
    #
    # This rule was deleted in error by ace5820 ("drop the unreachable tetragon
    # endpoint"), which removed it as dead config while cleaning up a VIP
    # allowance. Verified with a probe pod carrying grafana's own labels:
    # 403 Access denied without it, a real authentik response with it. The
    # authentik side's ingress half (../authentik/cilium-allowlist.yaml
    # admits fromEndpoints namespace=monitoring) was never removed, so this
    # one rule is the whole gap.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
    # Its datasources live in this same namespace: vmsingle for metrics
    # (query), vlsingle for logs, alertmanager for the alert UI.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - {port: "8428", protocol: TCP}
            - {port: "9428", protocol: TCP}
            - {port: "9093", protocol: TCP}
    # Grafana 13 stores dashboards/provisioning as Kubernetes CRs
    # (grafana.app/*) and reads them through the API — without this egress the
    # dashboards and alert rules stop reconciling.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    - toCIDRSet:
        - cidr: 10.30.0.10/32
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    - toCIDRSet:
        - cidr: 172.21.0.0/16
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
---
# The scrape/monitoring workloads: vmagent, vmalert, kube-state-metrics, the
# VictoriaMetrics operator, vlsingle and vlagent. Their common need is
# reaching exporters and the API server for service discovery.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-scrapers-allowlist
  namespace: monitoring
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - vmagent
          - vmalert
          - vmalertmanager
          - vmauth
          - vmsingle
          - victoria-metrics-operator
          - kube-state-metrics
          - vlsingle
          - vlagent
  ingress:
    # The monitoring namespace is one scrape domain: vmagent/vmalert/vmauth
    # scrape and query each other and grafana, so in-namespace traffic is
    # allowed wholesale here (a rule without toPorts allows all ports). This
    # is what keeps the stack's own targets up — the alternative is repeating
    # the exporter port list on every workload in the namespace.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
    # Health probes from kubelet.
    - fromEntities:
        - health
    # Headlamp's Prometheus plugin queries vlsingle (9428) directly for its
    # "Show Prometheus metrics" graphs — the destination half of the headlamp
    # egress rule in ../headlamp/cilium-allowlist.yaml. The source half is
    # required too; without it the query is dropped (fail-closed, by design).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: headlamp
      toPorts:
        - ports:
            - {port: "9428", protocol: TCP}
    # The VictoriaMetrics operator runs an admission webhook on 9443; the API
    # server calls it from the node, i.e. as kube-apiserver/host/remote-node —
    # the same triple the cert-manager webhooks needed.
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - {port: "9443", protocol: TCP}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Service discovery + API-server metrics need the API; all three
    # addressing forms (entity, control-plane VIP, in-cluster Service CIDR).
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    - toCIDRSet:
        - cidr: 10.30.0.10/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    - toCIDRSet:
        - cidr: 172.21.0.0/16
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # The exporter port set, to any in-cluster endpoint plus the nodes
    # themselves. Ports are exactly the ones the scrape objects and the
    # VictoriaMetrics stack address:
    #   8080/8081  kube-state-metrics, VM operator, flux controllers
    #   8081/8082  immich server telemetry
    #   5000       zot registry
    #   7979       external-dns
    #   9100       node-exporter
    #   9121       valkey exporter
    #   9187       CNPG instance exporter
    #   9300       authentik server
    #   9402       cert-manager controller
    #   9428/9429  vlsingle / vlagent
    #   9962/9963  cilium agent / operator
    #   8080       llmkube llama-server (--metrics)
    #   10250      kubelet (node-level metrics)
    #   8427/8428/8429  vmauth / vmsingle query+insert (the stack's own
    #                   internal data path: vmagent writes, vmalert and grafana
    #                   query, vmauth fronts them)
    #   9093       alertmanager (vmalert -> vmalertmanager)
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - {port: "10250", protocol: TCP}
            - {port: "3000", protocol: TCP}
            # Component metrics added with the Kyverno/Tetragon/CrowdSec
            # monitoring: Kyverno's four controller metrics services (8000),
            # Tetragon + its operator (2112/2113 — the DS is hostNetwork, so
            # these targets are node IPs and only this egress side can gate
            # them), CrowdSec LAPI/agent (6060). Without these the scrapes
            # discover targets but every one reports up=0.
            - {port: "8000", protocol: TCP}
            - {port: "2112", protocol: TCP}
            - {port: "2113", protocol: TCP}
            - {port: "6060", protocol: TCP}
            - {port: "5000", protocol: TCP}
            - {port: "7979", protocol: TCP}
            - {port: "8080", protocol: TCP}
            - {port: "8081", protocol: TCP}
            - {port: "8082", protocol: TCP}
            - {port: "8427", protocol: TCP}
            - {port: "8428", protocol: TCP}
            - {port: "8429", protocol: TCP}
            - {port: "8435", protocol: TCP}
            - {port: "8888", protocol: TCP}
            - {port: "8889", protocol: TCP}
            - {port: "9093", protocol: TCP}
            - {port: "9100", protocol: TCP}
            - {port: "9121", protocol: TCP}
            - {port: "9130", protocol: TCP}
            - {port: "9153", protocol: TCP}
            - {port: "9187", protocol: TCP}
            - {port: "9300", protocol: TCP}
            - {port: "9402", protocol: TCP}
            - {port: "9428", protocol: TCP}
            - {port: "9429", protocol: TCP}
            - {port: "9962", protocol: TCP}
            - {port: "9963", protocol: TCP}
            # cilium-agent's Hubble metrics endpoint (VMPodScrape
            # cilium-hubble) — the agents expose it on every node.
            - {port: "9965", protocol: TCP}
---
# node-exporter runs in the host network namespace; it is still selected here
# so that, once every namespace is locked, its own probes and any local scrape
# path stay open. It needs nothing but health probes.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-node-exporter-allowlist
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus-node-exporter
  ingress:
    - fromEntities:
        - health
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9100"
              protocol: TCP
---
# Alertmanager's external delivery path, and the only workload in this
# namespace with a reason to reach the public internet.
#
# The scrapers allowlist above already selects vmalertmanager matching on
# this same app.kubernetes.io/name (the pod shares the scrape domain's
# in-namespace, API-server and DNS rules), but that policy deliberately
# carries no `toEntities: world` egress — so until this policy existed the
# deny-all baseline in cilium-default-deny.yaml made every off-cluster
# destination unreachable and the external receivers configured in
# alertmanager-config.sops.yaml could never be contacted. This is a separate
# CNP rather than a rule inside the scrapers allowlist because a rule there
# would grant world egress to every workload that policy selects (vmagent,
# vmsingle, vlsingle, the operator, ...): only Alertmanager posts alerts to
# third-party endpoints, so only Alertmanager gets the exemption.
#
# Labels read off the live pod before writing this:
#   app.kubernetes.io/name=vmalertmanager
#   app.kubernetes.io/instance=monitoring-victoria-metrics-k8s-stack
#   managed-by=vm-operator (not matchable as a stable key, so not used)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-alertmanager-allowlist
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmalertmanager
      app.kubernetes.io/instance: monitoring-victoria-metrics-k8s-stack
  egress:
    # DNS first: without it the webhook URLs cannot even be resolved.
    # Repeated from the scrapers allowlist so this policy is self-contained
    # (Cilium unions all policies selecting the endpoint, so the duplicate
    # rule is redundant but harmless).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Alert delivery to the external receivers (the ntfy topics in
    # alertmanager-config.sops.yaml). 443 is the live path; 80 is included
    # for the redirect hop a receiver may answer with — without it that
    # redirect fails and the delivery shows up as a failed notification
    # rather than a delivered one. The port set, not the peer, is the bound:
    # this pod can POST nothing but HTTP(S) off-cluster.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
