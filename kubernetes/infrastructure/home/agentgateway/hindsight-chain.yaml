# Hindsight's LLM chain: Synthetic gpt-oss-120b, no fallback.
#
# OpenRouter was removed from this chain on 2026-09-22 for cost: hindsight's
# extraction/consolidation load is high-volume, and the chain's OpenRouter leg
# was serving nearly all of it while the Synthetic leg sat held off by the
# proxy's rate-limit detector, so the fallback had become the main spend.
#
# The failover MECHANISM is kept because its remaining shapes are still real:
#   - `groups` is what policy-hindsight-health.yaml targets;
#   - more than one provider in group 1 is intra-group failover — the gateway
#     tries the next provider in the group before moving on — so a second
#     Synthetic key makes the chain resilient without leaving the provider.
#
# The rate-limit/backpressure case is NOT solved here and is tracked
# separately: synthetic-proxy refuses a key it judges rate-limited (503, the
# shape this chain's health policy evicts on) and nothing else serves
# hindsight, so that refusal surfaces to the client. The proxy's
# HOLD_OFF_FAILOVER clock is what bounds how long it lasts.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: hindsight-chain
  namespace: agentgateway
spec:
  ai:
    groups:
      - providers:
          - name: synthetic-gpt-oss
            host: synthetic-proxy.agentgateway.svc.cluster.local
            port: 8080
            path: /v1/chat/completions
            openai:
              model: hf:openai/gpt-oss-120b
            policies:
              auth:
                secretRef:
                  name: synthetic-key
