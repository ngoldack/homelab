# authentik.ngoldack.de on the edge: the portal must be reachable for
# external login redirects; no outpost in front — the portal IS the auth.
#
# The LAN twin route (httproutes.yaml) was retired with the split-horizon
# design; the cross-namespace ReferenceGrant below is what the edge
# headlamp/grafana routes need to reach authentik-proxy.
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-edge-routes-to-authentik
  namespace: authentik
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: headlamp
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: monitoring
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: hindsight
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: phoenix
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: aigateway
  to:
    - group: ""
      kind: Service
      name: authentik-proxy
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-edge
  namespace: authentik
spec:
  parentRefs:
    - name: edge
      namespace: network
      sectionName: https-apex
  hostnames:
    - authentik.ngoldack.de
  rules:
    - backendRefs:
        # portal-bridge, NOT authentik-server — edge envoy (host-netns) only
        # reaches node-local pods; see portal-bridge.yaml. Brute-force defense
        # for this route is authentik's built-in ReputationPolicy (bound in
        # seed.yaml) — CrowdSec edge enforcement was removed 2026-09-13.
        - name: portal-bridge-cloud
          port: 9100
