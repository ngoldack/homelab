apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-gateway
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: monitoring
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.158.x"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    mode: deployment
    replicaCount: 1
    # Stable in-cluster DNS name (otel-gateway.monitoring.svc) for app exporters.
    fullnameOverride: otel-gateway

    # contrib distro: includes tail_sampling, prometheusremotewrite, k8sattributes.
    image:
      repository: otel/opentelemetry-collector-contrib

    presets:
      kubernetesAttributes:
        enabled: true

    config:
      exporters:
        # Traces -> Grafana Tempo (OTLP gRPC).
        otlp/tempo:
          endpoint: "tempo.monitoring.svc.cluster.local:4317"
          tls:
            insecure: true
        # Traces -> Arize Phoenix (LLM-specific view). kagent routes here via the
        # gateway so agent traces land in BOTH Tempo (infra correlation) and
        # Phoenix (LLM analysis).
        otlp/phoenix:
          endpoint: "phoenix.phoenix.svc.cluster.local:4317"
          tls:
            insecure: true
        # Metrics -> VictoriaMetrics.
        prometheusremotewrite:
          endpoint: "http://victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/write"
          tls:
            insecure: true
        # Logs -> Loki (OTLP over HTTP).
        otlphttp/loki:
          endpoint: "http://loki.monitoring.svc.cluster.local:3100/otlp"
          tls:
            insecure: true

      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
        # Cluster-wide scrape of pods annotated prometheus.io/scrape=true (single
        # gateway instance => no duplicate scraping). Captures vLLM, Tetragon,
        # cert-manager, CNPG, Trivy, Hubble (once each exposes + annotates
        # /metrics) -> VictoriaMetrics, so vmalert has data to alert on.
        # VERIFY-BEFORE-DEPLOY: the k8sattributes preset grants pod read RBAC; if
        # the prometheus receiver needs more (services/endpoints), extend the
        # chart clusterRole.
        prometheus:
          config:
            scrape_configs:
              - job_name: kubernetes-pods
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                    action: keep
                    regex: "true"
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                    action: replace
                    target_label: __metrics_path__
                    regex: (.+)
                  - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                    action: replace
                    regex: ([^:]+)(?::\d+)?;(\d+)
                    replacement: $$1:$$2
                    target_label: __address__
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod

      processors:
        batch: {}
        memory_limiter:
          check_interval: 1s
          limit_percentage: 75
          spike_limit_percentage: 15
        # Tail-based sampling: always keep errors and slow spans, sample the rest.
        tail_sampling:
          decision_wait: 10s
          num_traces: 50000
          policies:
            - name: errors
              type: status_code
              status_code:
                status_codes: [ERROR]
            - name: slow
              type: latency
              latency:
                threshold_ms: 1000
            - name: baseline
              type: probabilistic
              probabilistic:
                sampling_percentage: 10

      service:
        pipelines:
          traces:
            receivers: [otlp]
            processors: [memory_limiter, k8sattributes, tail_sampling, batch]
            exporters: [otlp/tempo, otlp/phoenix]
          metrics:
            receivers: [otlp, prometheus]
            processors: [memory_limiter, k8sattributes, batch]
            exporters: [prometheusremotewrite]
          logs:
            receivers: [otlp]
            processors: [memory_limiter, k8sattributes, batch]
            exporters: [otlphttp/loki]

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
