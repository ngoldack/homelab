# Immich. The chart is bjw-s app-template based, so each component nests its
# workload under <component>.controllers.main.containers.main.
#
# Reached at https://immich.ngoldack.de on the LAN — see httproute.yaml. The
# name resolves only in local DNS, so nothing is published to the internet
# despite the certificate being a real Let's Encrypt one.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: flux-system
spec:
  interval: 1h
  timeout: 20m
  chart:
    spec:
      chart: immich
      version: "0.12.0"
      sourceRef:
        kind: HelmRepository
        name: immich
      interval: 1h
  targetNamespace: immich
  # Without this Flux names the release <targetNamespace>-<name>, i.e.
  # "immich-immich", and every object inherits that stutter:
  # immich-immich-server, immich-immich-valkey. That is not just ugly — the
  # Service names are what REDIS_HOSTNAME below has to match, so the stutter
  # would have to be encoded in the config too. Pinning the release name keeps
  # the objects as immich-server / immich-valkey / immich-machine-learning.
  releaseName: immich
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    immich:
      persistence:
        library:
          # The PVC from library-pvc.yaml. The chart would otherwise create its
          # own, with a generated name and the default StorageClass.
          existingClaim: immich-library
      metrics:
        # OFF because this flag renders a prometheus-operator ServiceMonitor
        # (monitoring.coreos.com/v1), and those CRDs are not installed here —
        # the monitoring stack is VictoriaMetrics, whose operator uses its own
        # VMServiceScrape kind. With it on, the Helm install fails outright:
        #   no matches for kind "ServiceMonitor" in version
        #   "monitoring.coreos.com/v1"
        #
        # The VM operator can convert ServiceMonitors, but only if the
        # prometheus-operator CRDs are installed alongside it, which is a whole
        # second CRD set to own for one chart's benefit. Scraping Immich is
        # instead a VMServiceScrape added here later — vmagent runs with
        # selectAllByDefault, so such an object is picked up with no further
        # wiring.
        enabled: false

    # Valkey (Redis) is DISABLED by default in this chart, and Immich does not
    # start without it — it uses it for the job queues behind uploads,
    # thumbnail generation and ML processing. Enabling it is not optional.
    valkey:
      enabled: true

    server:
      enabled: true
      controllers:
        main:
          containers:
            main:
              # Pinned ahead of the chart. immich-charts 0.12.0 is the newest
              # release (May 2026) and still carries appVersion v2.6.3, while
              # upstream Immich is on v3.2.0 (Sep 2026) — the chart has never
              # tracked 3.x. The chart sets no image tag of its own, so without
              # this it silently deploys the 4-month-old appVersion.
              #
              # Verified compatible with this deployment before bumping, since
              # v3.0.0/v3.1.0 are flagged breaking:
              #   - v3 REMOVED pgvecto.rs and errors out on it. This cluster
              #     already runs VectorChord (vchord), which is its successor
              #     and the recommended path — see ../immich/postgres.yaml.
              #   - v3 requires an x86-64-v2 CPU or better (numpy bump). The
              #     nodes are i9-13900HX, far above that baseline.
              #   - The remaining breaking changes are API/mobile-level
              #     (class-validator to zod, removed DTOs); the migration guide
              #     states only a few environment variables were removed, and
              #     none of the DB_*/REDIS_HOSTNAME values used here.
              # Bump this tag deliberately, and drop it once the chart ships a
              # 3.x appVersion of its own.
              image:
                tag: v3.2.0
              env:
                # CNPG publishes the generated credentials in the
                # <cluster>-app Secret. Referencing its keys means the password
                # is never written to this repo, and a CNPG-driven rotation is
                # picked up by restarting the pod rather than editing git.
                DB_HOSTNAME: immich-database-rw
                DB_PORT: "5432"
                DB_USERNAME:
                  valueFrom:
                    secretKeyRef:
                      name: immich-database-app
                      key: username
                DB_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      name: immich-database-app
                      key: password
                DB_DATABASE_NAME:
                  valueFrom:
                    secretKeyRef:
                      name: immich-database-app
                      key: dbname
                REDIS_HOSTNAME: immich-valkey
      # Keep the server on the LAN: it mounts the library from the NAS, which
      # the Hetzner ingress node cannot reach.
      defaultPodOptions:
        nodeSelector:
          topology.homelab/site: home

    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              # Pinned ahead of the chart. immich-charts 0.12.0 is the newest
              # release (May 2026) and still carries appVersion v2.6.3, while
              # upstream Immich is on v3.2.0 (Sep 2026) — the chart has never
              # tracked 3.x. The chart sets no image tag of its own, so without
              # this it silently deploys the 4-month-old appVersion.
              #
              # Verified compatible with this deployment before bumping, since
              # v3.0.0/v3.1.0 are flagged breaking:
              #   - v3 REMOVED pgvecto.rs and errors out on it. This cluster
              #     already runs VectorChord (vchord), which is its successor
              #     and the recommended path — see ../immich/postgres.yaml.
              #   - v3 requires an x86-64-v2 CPU or better (numpy bump). The
              #     nodes are i9-13900HX, far above that baseline.
              #   - The remaining breaking changes are API/mobile-level
              #     (class-validator to zod, removed DTOs); the migration guide
              #     states only a few environment variables were removed, and
              #     none of the DB_*/REDIS_HOSTNAME values used here.
              # Bump this tag deliberately, and drop it once the chart ships a
              # 3.x appVersion of its own.
              image:
                tag: v3.2.0
              env:
                DB_HOSTNAME: immich-database-rw
                DB_PORT: "5432"
                DB_USERNAME:
                  valueFrom:
                    secretKeyRef:
                      name: immich-database-app
                      key: username
                DB_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      name: immich-database-app
                      key: password
                DB_DATABASE_NAME:
                  valueFrom:
                    secretKeyRef:
                      name: immich-database-app
                      key: dbname
                REDIS_HOSTNAME: immich-valkey
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  memory: 8Gi
      # The media worker, NOT the P100 box. The P100 is reserved for LLM
      # inference, so Immich's CLIP and face-recognition models run here
      # instead. This node carries dedicated=media:NoSchedule, and without the
      # matching toleration the pod silently stays Pending forever rather than
      # reporting an error.
      #
      # Inference is on CPU for now. This node is the Intel box, so OpenVINO
      # acceleration is available as a follow-up — it needs the
      # -openvino image variant plus access to /dev/dri, which in turn needs
      # either an Intel device plugin or a hostPath with the namespace's
      # PodSecurity relaxed. Deliberately not bundled into this change.
      defaultPodOptions:
        nodeSelector:
          node.kubernetes.io/instance-type: media-worker
        tolerations:
          - key: dedicated
            operator: Equal
            value: media
            effect: NoSchedule
      persistence:
        # Model cache. The chart defaults this to an emptyDir, which means
        # re-downloading several GB of CLIP/face models on every pod restart.
        cache:
          enabled: true
          type: persistentVolumeClaim
          storageClass: truenas-fast-nfs-immich-cache
          accessMode: ReadWriteOnce
          size: 20Gi
