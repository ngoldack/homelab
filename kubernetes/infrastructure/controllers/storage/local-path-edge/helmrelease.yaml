# local-path-provisioner (edge) — second local-path-provisioner instance whose PVs
# land ON the Hetzner edge node, exposed through the `local-storage-edge`
# StorageClass. Mirrors storage/local-path but scoped to the edge so edge-pinned
# workloads (e.g. CrowdSec's decisions DB) get disposable node-local storage there.
# Reuses the existing `local-path` HelmRepository (no new source).
#
# VERIFY-BEFORE-DEPLOY: pin the chart version (track the same chart as
# storage/local-path). The provisioner is a Deployment (not a DaemonSet); the
# nodeSelector/tolerations below pin that controller pod to the edge node, and
# because consumers are also edge-pinned + WaitForFirstConsumer, the helper pods
# that create the on-disk paths run on the edge node too. VERIFY the chart's value
# keys for node pinning (top-level nodeSelector/tolerations) match this chart.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-edge
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: storage
  chart:
    spec:
      chart: local-path-provisioner
      version: "0.0.x"
      sourceRef:
        kind: HelmRepository
        name: local-path
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  values:
    storageClass:
      create: true
      name: local-storage-edge
      defaultClass: false
      reclaimPolicy: Delete
      volumeBindingMode: WaitForFirstConsumer

    # Node-local, disposable PVs created ON the Hetzner edge node only.
    pathPattern: "{{ .PVC.Namespace }}-{{ .PVC.Name }}"

    # Pin the provisioner to the edge node so PVs are created there.
    nodeSelector:
      node-role: edge
    tolerations:
      - key: node-role
        value: edge
        effect: NoSchedule
