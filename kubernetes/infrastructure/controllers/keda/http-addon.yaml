# KEDA HTTP add-on — adds scale-from-zero for HTTP workloads on top of KEDA core.
# An interceptor proxy sits in front of the target Service: when the target is at
# zero replicas it HOLDS the incoming request, tells KEDA to scale the Deployment
# up, waits for it to become ready, then forwards the request. This is what lets
# the heaviest workload on the AI node (qwen3-coder-80b) idle at zero replicas and
# wake on demand. Same kedacore HelmRepository as KEDA core.
#
# VERIFY-BEFORE-DEPLOY:
#   - Pin the chart version (0.10.x is a placeholder; confirm against the repo).
#   - vLLM 80B model load is MINUTES. The interceptor's response/stream timeouts
#     almost certainly need raising above their sub-second defaults or the first
#     (cold) request will time out. The relevant values differ by chart version
#     (e.g. interceptor.responseHeaderTimeout / KEDA_RESPONSE_HEADER_TIMEOUT and
#     the request/stream timeouts) — tune on a live cluster, watching the
#     interceptor logs, before relying on this.
#   - LiteLLM keeps num_retries: 2, so a request that arrives mid-cold-start is
#     retried; combined with the interceptor hold this should bridge the wake-up,
#     but the very first hit after a long idle may still surface a timeout.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda-add-ons-http
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: keda
  # The add-on registers an external scaler with KEDA core; core must exist first.
  dependsOn:
    - name: keda
  chart:
    spec:
      chart: keda-add-ons-http
      version: "0.10.x"
      sourceRef:
        kind: HelmRepository
        name: keda
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Keep the interceptor always-on (it must be reachable to wake the backend).
    interceptor:
      replicas:
        min: 1
        max: 2
