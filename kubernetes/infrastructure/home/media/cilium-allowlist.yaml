#  allowlist — namespace-scoped zero-trust policy (stage 1: the namespace
# is one trust domain; everything crossing the namespace boundary is denied
# unless named below). The cross-namespace edges below are the ones observed as
# live traffic on this cluster; add a rule here (and on the peer's side) rather
# than widening the boundary when a new integration appears.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: media-allowlist
  namespace: media
spec:
  endpointSelector:
    matchLabels: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
    - fromEntities:
        - ingress
        - health
    # The monitoring rule is gone: no VMPodScrape (or any scrape object) exists
    # for media, so it only opened every port to the monitoring namespace for
    # nothing — re-add the rule together with the scrape object if one appears.
    # This namespace's SSO-gated UIs are reached through the authentik proxy
    # outpost, which only fronts the backends httproutes.yaml sends to
    # authentik-proxy: seerr:80 (container 5055), sabnzbd:8080, sonarr:8989,
    # radarr:7878, prowlarr:9696 (jellyfin stays direct on 8096), plus the
    # books stack's bindery:8787, grimmory:6060 and pyload:8000.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - port: "5055"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "8989"
              protocol: TCP
            - port: "7878"
              protocol: TCP
            - port: "9696"
              protocol: TCP
            - port: "8787"
              protocol: TCP
            - port: "6060"
              protocol: TCP
            - port: "8000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
    # Internet egress for indexers/Usenet/torrent traffic — arbitrary remote
    # ports, so this rule is port-open by design (the download path's VPN leg
    # rides a macvlan interface outside Cilium's datapath anyway). Deliberate
    # exception to the port-scoping rule, reviewed 2026-09-17.
    - toEntities:
        - world
