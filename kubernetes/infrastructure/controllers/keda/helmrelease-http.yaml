apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda-add-ons-http
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: keda
  dependsOn:
    - name: keda
  chart:
    spec:
      chart: keda-add-ons-http
      version: "0.10.x"
      sourceRef:
        kind: HelmRepository
        name: keda
      interval: 1h
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values:
    # HTTP interceptor buffers the first request and scales the target from zero.
    interceptor:
      replicas:
        min: 1
        max: 2
    scaler:
      replicas: 1
