# CrowdSec — local detection engine (chart 0.24.2 / app v1.8.1, pinned).
#
# Scope: detection only. The LAPI holds decisions and the agent (DaemonSet)
# parses container logs from the node's /var/log/pods. No bouncer is deployed
# (see namespace.yaml for the reasoning) and the Console enrolment stays off —
# decisions never leave the cluster.
#
# The agent's first feed is authentik: it is the cluster's authentication
# front door and its logs carry the client IP of every request. The custom
# parser in config.parsers.s01-parse labels those lines so scenarios can act on
# them; because the parser's pattern is matched against authentik's escaped
# JSON request lines, verify it against live traffic after rollout with
# `cscli metrics` (acquisition lines parsed > 0) before adding scenarios on top.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: flux-system
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: crowdsec
      version: "0.24.2"
      sourceRef:
        kind: HelmRepository
        name: crowdsec
      interval: 1h
  targetNamespace: crowdsec
  releaseName: crowdsec
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Talos runs containerd; the chart defaults to docker and would look for
    # the wrong socket.
    container_runtime: containerd
    lapi:
      enabled: true
      # No persistent volumes: this cluster has no default StorageClass, and
      # the LAPI's volume holds bouncer API keys — of which there are none in a
      # detection-only deployment. Decisions and config are rebuilt on restart,
      # which is the documented trade for keeping the deployment stateless.
      persistentVolume:
        data:
          enabled: false
        config:
          enabled: false
    agent:
      enabled: true
      # Log acquisitions. The chart's pod-name shorthand builds
      # /var/log/containers/<podName>_<namespace>_*.log — those files do exist
      # on this node, but the shorthand takes an EXACT pod name and Deployment
      # pods carry a -<replicaset>-<id> suffix, so `podName: authentik-server`
      # matched nothing (the chart's own values example passes a glob like
      # `ingress-nginx-controller-*` for exactly this reason). Explicit file
      # datasources over the pod-log directory are unambiguous and carry the
      # label the parser filters on.
      hostVarLog: true
      # The review found the agent DaemonSet could not schedule on the node
      # hosting half the authentik pods: that node carries the Kata sandbox's
      # `dedicated:NoSchedule` taint. A node-log reader belongs on every node,
      # same as node-exporter/vlagent, so it tolerates everything.
      tolerations:
        - operator: Exists
      additionalAcquisition:
        - source: file
          filenames:
            - /var/log/pods/authentik_authentik-server-*/*/*.log
            - /var/log/pods/authentik_authentik-worker-*/*/*.log
          labels:
            type: authentik
    config:
      parsers:
        s01-parse:
          authentik.yaml: |
            name: local/authentik
            description: "Parse authentik's JSON request log lines"
            filter: "evt.Line.Labels.type == 'authentik'"
            nodes:
              # Each line is CRI-wrapped ("<timestamp> stdout F {...}"), and in
              # the log file the request span's fields are NOT escaped (only the
              # nested http_headers JSON is), so this is a plain match on
              # "path" + "remote" — verified against a real line from the
              # authentik server pod.
              - grok:
                  pattern: '"path":"%{DATA:request_path}","remote":"::ffff:%{IPV4:source_ip}"'
                  apply_on: Line.Raw
                statics:
                  - meta: log_type
                    value: authentik_http_request
                  - meta: service
                    value: authentik
                  - meta: source_ip
                    expression: "evt.Parsed.source_ip"
                  - meta: request_path
                    expression: "evt.Parsed.request_path"
        s00-raw:
          authentik-raw.yaml: |
            name: local/authentik-raw
            description: "Label authentik container log lines so the parse stage can see them"
            filter: "evt.Line.Labels.type == 'authentik'"
            nodes:
              - statics:
                  - meta: log_type
                    value: authentik_raw
