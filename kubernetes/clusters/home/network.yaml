# Contains the `network` Namespace, external-dns (moved here from
# infra-controllers so it lands in the same apply pass as its Namespace and
# Secret — see kubernetes/infrastructure/cloud/network/kustomization.yaml),
# the ClusterIssuer/Certificate that need cert-manager's CRDs, and the
# Gateway that needs the Gateway API CRDs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: network
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/infrastructure/home/network
  prune: true
  wait: true
  dependsOn:
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
