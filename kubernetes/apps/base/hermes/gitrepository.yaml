# Flux Git source for the (community, unofficial) Hermes Agent Helm chart.
# Neither Hermes nor this chart is published to a Helm/OCI repo, so we reference
# the chart's Git repo. Pinned to a commit because the repo has no release tags.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: hermes-agent-chart
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/ultraworkers/hermes-agent-helm-chart
  ref:
    commit: e3b685d4d0288668a37216435742cd0a659ebc6c
