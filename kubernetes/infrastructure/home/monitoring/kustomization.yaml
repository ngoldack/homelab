apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
  - httproute.yaml

# One ConfigMap per vendored dashboard. The Grafana sidecar (enabled in
# helmrelease.yaml) watches every namespace for ConfigMaps carrying
# grafana_dashboard: "1" and drops their contents into Grafana's provisioning
# directory — so this is the whole wiring; no operator, no CRDs.
#
# disableNameSuffixHash is on because the sidecar keys off the label, not the
# name, and a hash-suffixed name churns on every content change for no benefit.
configMapGenerator:
  - name: grafana-dashboard-node-exporter-full
    namespace: monitoring
    files: [dashboards/node-exporter-full.json]
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        # Grafana dashboards are full of ${datasource}, ${__interval} and
        # friends. Flux's postBuild.substituteFrom runs envsubst over every
        # manifest in this Kustomization and, in strict mode, fails on any
        # ${...} it cannot resolve — so vendoring a dashboard broke the whole
        # monitoring reconcile with:
        #   envsubst error: variable not set (strict mode): "datasource"
        # This annotation is Flux's supported opt-out per resource. It must be
        # on every dashboard ConfigMap, not just the one that happened to fail
        # first.
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: grafana-dashboard-victoriametrics
    namespace: monitoring
    files: [dashboards/victoriametrics.json]
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        # Grafana dashboards are full of ${datasource}, ${__interval} and
        # friends. Flux's postBuild.substituteFrom runs envsubst over every
        # manifest in this Kustomization and, in strict mode, fails on any
        # ${...} it cannot resolve — so vendoring a dashboard broke the whole
        # monitoring reconcile with:
        #   envsubst error: variable not set (strict mode): "datasource"
        # This annotation is Flux's supported opt-out per resource. It must be
        # on every dashboard ConfigMap, not just the one that happened to fail
        # first.
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: grafana-dashboard-vmagent
    namespace: monitoring
    files: [dashboards/vmagent.json]
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        # Grafana dashboards are full of ${datasource}, ${__interval} and
        # friends. Flux's postBuild.substituteFrom runs envsubst over every
        # manifest in this Kustomization and, in strict mode, fails on any
        # ${...} it cannot resolve — so vendoring a dashboard broke the whole
        # monitoring reconcile with:
        #   envsubst error: variable not set (strict mode): "datasource"
        # This annotation is Flux's supported opt-out per resource. It must be
        # on every dashboard ConfigMap, not just the one that happened to fail
        # first.
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: grafana-dashboard-vmalert
    namespace: monitoring
    files: [dashboards/vmalert.json]
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        # Grafana dashboards are full of ${datasource}, ${__interval} and
        # friends. Flux's postBuild.substituteFrom runs envsubst over every
        # manifest in this Kustomization and, in strict mode, fails on any
        # ${...} it cannot resolve — so vendoring a dashboard broke the whole
        # monitoring reconcile with:
        #   envsubst error: variable not set (strict mode): "datasource"
        # This annotation is Flux's supported opt-out per resource. It must be
        # on every dashboard ConfigMap, not just the one that happened to fail
        # first.
        kustomize.toolkit.fluxcd.io/substitute: disabled

generatorOptions:
  disableNameSuffixHash: true
