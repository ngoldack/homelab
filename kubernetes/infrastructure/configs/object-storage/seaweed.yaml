# In-cluster, S3-compatible object storage (SeaweedFS), managed by the
# seaweedfs-operator. Replaces the previous MinIO Tenant + Crossplane setup.
#
# - master/volume/filer/S3 run in this namespace; volume data sits on the fast
#   NVMe-oF block tier (TrueNAS) for max performance (the S3 API abstracts the
#   underlying volume files, so block single-attach is ideal).
# - The standalone S3 gateway (spec.s3) exposes the S3 API + embedded IAM on
#   port 8333 at the in-cluster Service `seaweedfs-s3.seaweedfs.svc:8333`.
# - Per-app buckets/users/credentials are declared as namespaced CRDs in each
#   app (Bucket / S3Identity / S3Credentials), permitted to reference this
#   cluster by the ResourceReferenceGrant alongside this CR.
apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  # renovate: datasource=docker depName=chrislusf/seaweedfs
  image: chrislusf/seaweedfs:3.99
  master:
    replicas: 1
    volumeSizeLimitMB: 30000
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  volume:
    replicas: 1
    storageClassName: tns-fast-nvmeof
    requests:
      storage: 250Gi
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  filer:
    replicas: 1
    # Filer metadata store (leveldb) on the fast block tier; small but
    # latency-sensitive (many small writes).
    persistence:
      enabled: true
      storageClassName: tns-fast-nvmeof
      resources:
        requests:
          storage: 10Gi
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # Standalone, independently-scalable S3 gateway with embedded IAM (the
  # preferred path; filer-embedded S3 is deprecated upstream).
  s3:
    replicas: 1
    iam: true
    service:
      type: ClusterIP
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 256Mi
