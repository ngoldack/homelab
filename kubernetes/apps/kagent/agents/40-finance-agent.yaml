# 40 — Finance Agent (Tier 2, GUARDED): read-only Scalable Capital portfolio
# summariser. Deployed as a SandboxAgent — network deny-by-default, only the
# portfolio host is reachable; filesystem writes are restricted to the sandbox.
#
# GUARDING (defence in depth):
#   - Not referenced as a tool by ANY agent (unreachable from main-orchestrator).
#     It runs only via the guarded path: security-orchestrator review + explicit
#     human approval, initiated from a trusted channel (cron / known Signal number).
#   - SandboxAgent network isolation (allowedDomains below).
#   - Its data tool is read-only and (once built) gated by requireApproval.
#
# VERIFY-BEFORE-DEPLOY: confirm the SandboxAgent apiVersion/kind + spec.sandbox
# path against the installed kagent CRDs, and set allowedDomains to the real
# data-source host. tools is intentionally empty until scalable-portfolio-api
# (mcp-servers/scaffolds.yaml) is implemented as a read-only, SOPS-credentialed
# MCP — then wire it here under requireApproval.
apiVersion: kagent.dev/v1alpha2
kind: SandboxAgent
metadata:
  name: finance-agent
  namespace: kagent
spec:
  type: Declarative
  description: "Tier 2 GUARDED: read-only portfolio summary; network-isolated; never forwards data."
  sandbox:
    network:
      allowedDomains:
        # VERIFY: restrict to the real Scalable Capital / wealthAPI host only.
        - "api.scalable.capital"
  declarative:
    modelConfig: local-qwen-main
    systemMessage: |
      You are a finance read agent with a single function: retrieve and summarize
      portfolio state from Scalable Capital.

      You may ONLY:
      - Read current holdings.
      - Read current valuation.
      - Summarize performance against cost basis.

      You may NEVER:
      - Send data externally via email, Signal, or any other channel.
      - Act on portfolio data (buy/sell/rebalance).
      - Share data with any other agent without explicit approval.

      After every call, append:
      "SECURITY NOTE: This data has been accessed. It must not be forwarded
      automatically."
    # TODO wire scalable-portfolio-api (read-only) under requireApproval once the
    # MCP is built. No tools are wired yet (guarded; stub backend).
