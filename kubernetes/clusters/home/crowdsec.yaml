# CrowdSec: local detection engine (LAPI + node agents), detection-only — no
# bouncer. dependsOn network so the shared plumbing is up first.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crowdsec
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/infrastructure/home/crowdsec
  prune: true
  wait: false
  timeout: 15m
  retryInterval: 2m
  dependsOn:
    - name: network
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
