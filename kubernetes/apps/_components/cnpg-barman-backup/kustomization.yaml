# Reusable backup wiring for any CloudNativePG cluster that ships its WAL
# archive + base backups to the Hetzner Object Storage DR bucket via the Barman
# Cloud plugin. It defines the static, identical-across-apps configuration
# (retention, compression, sidecar resources, daily schedule, plugin + S3
# credential key names) exactly once.
#
# The Hetzner endpoint and bucket come from cluster-wide Flux variables
# (${DR_S3_ENDPOINT}, ${DR_S3_BUCKET}) so they stay in sync with the OpenTofu
# outputs and never need editing per app.
#
# Each consuming app supplies only its own identity (cluster/store name,
# namespace, destination-path prefix, credentials Secret) via a small patch in
# its kustomization.yaml. Reference this component with:
#
#   components:
#     - ../../_components/cnpg-barman-backup
#
# then patch the placeholders APP_NAME / APP_NAMESPACE accordingly.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - objectstore.yaml
  - scheduledbackup.yaml
