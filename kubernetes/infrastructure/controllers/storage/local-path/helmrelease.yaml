apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: storage
  chart:
    spec:
      chart: local-path-provisioner
      version: "0.0.x"
      sourceRef:
        kind: HelmRepository
        name: local-path
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  values:
    storageClass:
      create: true
      name: local-storage
      defaultClass: false
      reclaimPolicy: Delete
      volumeBindingMode: WaitForFirstConsumer

    # Node-local, disposable PVs for non-persistent / small scratch workloads only.
    pathPattern: "{{ .PVC.Namespace }}-{{ .PVC.Name }}"
