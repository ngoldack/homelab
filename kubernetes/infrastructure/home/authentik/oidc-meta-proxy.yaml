# In-cluster OIDC metadata for the kube-apiserver.
#
# Why this exists: the apiserver's JWT authenticator runs in-process, so it
# fetches the issuer's discovery document and JWKS from its node's host
# network. That path to the public edge vhost is broken for node-origin
# clients (verified live: 503 "upstream connect error ... connection timeout"
# from the control-plane node, while browser traffic and pod traffic get 200),
# so every OIDC token was rejected with a JWT-authenticator failure even
# though the issuer, audience, signing key and claims were all correct.
#
# This namespace already had the answer for pods: fetch authentik in-cluster,
# never from the edge (see ../agentgateway/policy-jwt.yaml — the gateway's
# remoteJWKS points at authentik-server, not at the public URL). The apiserver
# cannot take a bare JWKS URL, only a discovery URL, so this proxy serves
# authentik's own document with two deliberate adjustments:
#   * Host is rewritten to the public hostname, because authentik derives the
#     `issuer` from the request Host — the token's `iss` claim is the public
#     URL, so the document the apiserver sees must advertise that same issuer.
#   * `jwks_uri` is rewritten to this proxy, so the key fetch stays in-cluster
#     instead of following the public URL back out through the broken path.
# Plain HTTP is fine: the apiserver takes the issuer separately (the
#
# Envoy, not nginx: the nginx image's entrypoint chowns its cache dirs and
# needs CAP_CHOWN, which the audit's drop-all-capabilities posture removes —
# the pod crash-looped with "chown ... Operation not permitted". The distroless
# Envoy image runs as uid 65532 with no entrypoint scripts, so it starts clean
# under the same hardening, and it serves the same two paths via static config
# (a response_body Lua rewrite replaces sub_filter; it works on any body, not
# just exact JSON spacing).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oidc-meta-proxy-config
  namespace: authentik
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 127.0.0.1, port_value: 9901}
    static_resources:
      listeners:
        - name: http
          address:
            socket_address: {address: 0.0.0.0, port_value: 8080}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: oidc_meta
                    use_remote_address: true
                    route_config:
                      name: local
                      virtual_hosts:
                        - name: oidc-meta
                          domains: ["*"]
                          # authentik derives the advertised `issuer` scheme
                          # from X-Forwarded-Proto; in-cluster the downstream
                          # hop is plain HTTP, which advertises `http://` —
                          # while kube-apiserver is configured with
                          # https://authentik.ngoldack.de/... and rejects any
                          # token whose iss mismatches (tofu/home/talos.tf
                          # oidc-issuer-url). Force https on the upstream hop.
                          request_headers_to_add:
                            - header: {key: x-forwarded-proto, value: "https"}
                              append: false
                          routes:
                            # The discovery document: authentik's own, with the
                            # public Host so its `issuer` matches the tokens.
                            - match: {path: "/application/o/headlamp/.well-known/openid-configuration"}
                              route:
                                cluster: authentik
                                host_rewrite_literal: authentik.ngoldack.de
                            # The keys, straight from authentik in-cluster.
                            - match: {path: "/jwks/headlamp"}
                              route:
                                cluster: authentik
                                prefix_rewrite: "/application/o/headlamp/jwks/"
                                host_rewrite_literal: authentik.ngoldack.de
                    http_filters:
                      # Rewrite authentik's jwks_uri to this proxy in the
                      # discovery response body, so the key fetch stays
                      # in-cluster. A plain gsub on the URL is robust to JSON
                      # spacing and survives authentik response tweaks.
                      - name: envoy.filters.http.lua
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                          default_source_code:
                            inline_string: |
                              -- Rewrite authentik's jwks_uri to this proxy in the
                              -- discovery response body, so the key fetch stays
                              -- in-cluster. The version from 7b48556 never ran:
                              -- its YAML block had mixed indentation (yaml-cpp
                              -- parse error) and the Lua referenced a
                              -- nonexistent global "env". The filter API hands
                              -- the handler to each callback; no cross-request
                              -- state is needed because the response headers
                              -- still carry the request path.
                              function envoy_on_request(request_handle)
                                -- The discovery document may come back
                                -- gzip'd; body() would then return compressed
                                -- bytes and the gsub would miss. Strip the
                                -- encodings so response rewriting sees plain
                                -- text.
                                request_handle:headers():remove("accept-encoding")
                              end
                              function envoy_on_response(response_handle)
                                local r = response_handle
                                if tostring(r:headers():get(":status") or "") ~= "200" then
                                  return
                                end
                                -- NOTE: response headers carry no :path, so
                                -- the earlier "only rewrite the discovery
                                -- document" check NEVER passed and the
                                -- jwks_uri rewrite never fired. The proxy
                                -- only routes the two authentik paths anyway
                                -- and the JWKS body contains no URL to
                                -- rewrite, so gsub is unconditional here.
                                local body = r:body():getBytes(0, r:body():length())
                                body = string.gsub(body,
                                  "https://authentik%.ngoldack%.de/application/o/headlamp/jwks/",
                                  "http://oidc-meta.authentik.svc.cluster.local/jwks/headlamp")
                                r:body():setBytes(body)
                              end
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: authentik
          connect_timeout: 3s
          type: STRICT_DNS
          dns_lookup_family: V4_ONLY
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: authentik
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: authentik-server.authentik.svc.cluster.local
                          port_value: 80
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oidc-meta-proxy
  namespace: authentik
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc-meta-proxy
  namespace: authentik
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: oidc-meta-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oidc-meta-proxy
    spec:
      # Envoy here never touches the Kubernetes API; a dedicated SA with no
      # RBAC + no token mount keeps the pod off the namespace default SA
      # (Kyverno disallow-default-serviceaccount) with zero privileges.
      serviceAccountName: oidc-meta-proxy
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      containers:
        - name: envoy
          image: docker.io/envoyproxy/envoy@sha256:eb2c01c13125d1629637cb4e4cce7207009fb7cc2c8027f9742758549d15b6f4
          command:
            - /usr/local/bin/envoy
            - -c
            - /etc/envoy/envoy.yaml
            - --service-cluster
            - oidc-meta
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9901
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            # The distroless image runs as uid 65532 by default and listens on
            # 8080 (non-privileged). No capabilities are needed.
          volumeMounts:
            - name: conf
              mountPath: /etc/envoy
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 192Mi
      volumes:
        - name: conf
          configMap:
            name: oidc-meta-proxy-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: oidc-meta
  namespace: authentik
spec:
  selector:
    app.kubernetes.io/name: oidc-meta-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
