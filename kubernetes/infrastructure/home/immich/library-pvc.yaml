# The photo/video library. Named explicitly rather than letting a chart derive
# it, so it reads as "immich-library" everywhere it appears.
#
# On the tank pool: this is bulk media that grows without bound, and it does
# not belong on the small fast pool next to databases. Its own StorageClass
# puts it at tank/k8s/immich-library/... on the NAS.
#
# 4 TiB (~4.4 TB). The class allows volume expansion, so this can still grow
# later without recreating — but growing does NOT retro-apply the StorageClass's
# snapshot schedule, which the driver only reads when the volume is first
# created. That is why this was sized up by recreating the (empty) PVC rather
# than expanding it: the same operation also picks up the daily snapshot task.
#
# On NFS the driver sets a ZFS refquota, which is thin — the dataset consumes
# only what is actually written, so this does not reserve 4 TiB on the tank
# pool up front.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: immich
spec:
  accessModes:
    # ReadWriteMany: the server and the machine-learning pods are scheduled
    # independently (ML is pinned to the GPU node, the server is not), so the
    # library has to be mountable from more than one node at once. NFS
    # supports this; a block class would not.
    - ReadWriteMany
  storageClassName: truenas-tank-nfs-immich-library
  resources:
    requests:
      storage: 4Ti
