apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  # .yaml suffix is mandatory: the chart only
  # discovers keys ending in .yaml.
  00-homelab.yaml: |
    version: 1
    metadata:
      name: homelab-edge-ingress
    # context keeps the long default-mapping names on single lines so the
    # !Find flow nodes stay under the 120-char lint limit
    context:
      sm_openid: "authentik default OAuth Mapping: OpenID 'openid'"
      sm_profile: "authentik default OAuth Mapping: OpenID 'profile'"
      sm_email: "authentik default OAuth Mapping: OpenID 'email'"
      sm_groups: "authentik default OAuth Mapping: OpenID 'groups'"
    entries:
      # ---------- headlamp: native OIDC federation (NOT the outpost proxy) ----------
      # Headlamp does its own OIDC handshake against authentik (per-user
      # identity inside the UI); the outpost proxy breaks that callback, same
      # lesson as langfuse/grafana. Provider declared BEFORE the app (ordering
      # rule). The client secret arrives via !File from the dedicated
      # seed-secrets-headlamp volume (/secrets-headlamp) and MUST match
      # ../headlamp/oidc-headlamp.sops.yaml's OIDC_CLIENT_SECRET. The redirect
      # URI is headlamp's OIDC callback path.
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: headlamp-oidc
        attrs:
          client_id: headlamp-oidc
          client_type: confidential
          client_secret: !File /secrets-headlamp/client_secret
          # grant_types MUST be pinned (see grafana-oidc): an empty model
          # default [] denies every OIDC login.
          issuer_mode: per_provider
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: https://headlamp.ngoldack.de/oidc-callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [name, !Context sm_openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, !Context sm_profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, !Context sm_email]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, !Context sm_groups]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: headlamp
        attrs:
          name: headlamp
          meta_name: Headlamp
          meta_launch_url: https://headlamp.ngoldack.de/
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, headlamp-oidc]]
      # ---------- hindsight control-plane UI behind the edge outpost ----------
      # The owning application is what gives the outpost its vhost (learned
      # the hard way with grafana-proxy: without it the outpost silently
      # falls back to the default provider for every Host). The provider MUST
      # be defined before the app that !Finds it — earlier in this file broke
      # the whole blueprint (same ordering rule as the outpost entries).
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: hindsight-ui-proxy
        attrs:
          mode: proxy
          internal_host: http://hindsight-control-plane.hindsight.svc.cluster.local:3000/
          external_host: https://hindsight-ui.ngoldack.de/
          cookie_domain: ngoldack.de
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: hindsight-ui
        attrs:
          name: hindsight-ui
          meta_name: Hindsight (memory UI)
          meta_launch_url: https://hindsight-ui.ngoldack.de/
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, hindsight-ui-proxy]]
      # ---------- phoenix UI behind the edge outpost (proxy path) ----------
      # Same two-way wiring as hindsight/grafana: edge route -> outpost ->
      # phoenix UI. The provider MUST precede the app !Finding it. The
      # internal_host points at phoenix-svc:6006 (the chart serves the UI on
      # the app port; no separate 8080). Outpost-proxy only: research confirmed
      # Phoenix is an OAuth2 authorization server (not an OIDC consumer), so a
      # grafana-style native federation is not possible — the outpost gates the
      # whole UI.
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: phoenix-proxy
        attrs:
          mode: proxy
          internal_host: http://phoenix-svc.phoenix.svc.cluster.local:6006/
          external_host: https://phoenix.ngoldack.de/
          cookie_domain: ngoldack.de
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: phoenix-edge
        attrs:
          name: phoenix-edge
          meta_name: Phoenix (LLM traces, edge)
          meta_launch_url: https://phoenix.ngoldack.de/
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, phoenix-proxy]]
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: grafana-proxy
        attrs:
          mode: proxy
          internal_host: http://monitoring-victoria-metrics-k8s-stack-grafana.monitoring.svc.cluster.local/
          external_host: https://grafana.ngoldack.de/
          cookie_domain: ngoldack.de
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # ---------- grafana via OIDC (app federates, no outpost) ----------
      # authentik ships NO groups scope mapping (verified live: the default
      # set is openid/profile/email/proxy-outpost/entitlements/...); define
      # one so Grafana's role_attribute_path sees membership.
      - model: authentik_core.application
        state: present
        identifiers:
          name: grafana-edge
        attrs:
          slug: grafana-edge
          meta_icon: application/default
          launch_url: https://grafana.ngoldack.de/
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, grafana-proxy]]
      # ---------- aigateway machine auth (client_credentials) ----------
      # M2M Bearer tokens for the AI Gateway's public route (llm.ngoldack.de).
      # A machine client POSTs to authentik's token endpoint with
      # grant_type=client_credentials and receives a JWT access token, which
      # the EAG SecurityPolicy validates against authentik's JWKS. No browser,
      # no redirect, no session. grant_types MUST be pinned (see grafana-oidc:
      # an empty default [] denies every grant); client_credentials only —
      # this app issues NO interactive logins. The secret arrives via !File
      # from the seed-secrets-aigateway volume and pairs with
      # ../authentik/oidc-aigateway.sops.yaml (authentik side).
      # RS256 signing keypair, referenced by signing_key below. MUST exist:
      # without signing_key authentik falls back to HS256 (client_secret),
      # /application/o/aigateway/jwks/ returns {} forever and the EAG
      # SecurityPolicy has nothing to verify against (same root cause as
      # langfuse's empty JWKS). Created once via CertificateBuilder in
      # ak shell; the seed only references it — consumer side is
      # ../aigateway/jwt.yaml.
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: aigateway-oidc
        attrs:
          client_id: aigateway-oidc
          client_type: confidential
          client_secret: !File /secrets-aigateway/client_secret
          # Serializer requires redirect_uris even for client_credentials
          # (machine flow has no redirect) — an empty list satisfies it.
          redirect_uris: []
          issuer_mode: per_provider
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, aigateway-oidc-signing]]
          grant_types:
            - client_credentials
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [name, !Context sm_openid]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: aigateway
        attrs:
          name: aigateway
          meta_name: AI Gateway (M2M)
          meta_launch_url: https://llm.ngoldack.de/
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, aigateway-oidc]]
      - model: authentik_outposts.outpost
        state: present
        identifiers:
          name: edge-outpost
        attrs:
          type: proxy
          managed: null
          # serializer requires config; {} = OutpostConfig dataclass defaults.
          config: {}
          providers:
            - !Find [authentik_providers_proxy.proxyprovider, [name, grafana-proxy]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, hindsight-ui-proxy]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, phoenix-proxy]]
      # grafana behind the SAME edge outpost (proxy provider; the edge envoy
      # cannot dial grafana's home pod directly — pod->pod only, measured
      # 20/20). Distinct from the OIDC federation below, which serves the
      # LAN-direct path; grafana's own login page simply shows authentik.
      - model: authentik_providers_oauth2.scopemapping
        state: present
        identifiers:
          name: "authentik default OAuth Mapping: OpenID 'groups'"
        attrs:
          description: Groups membership for downstream role mapping
          scope_name: groups
          expression: |-
            {
              "groups": [
                group.name for group in request.user.ak_groups.all()
              ]
            }
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: grafana-oidc
        attrs:
          client_id: grafana
          client_type: confidential
          client_secret: !File /secrets/client_secret
          # grant_types MUST be pinned. OAuth2Provider.grant_types is a PG
          # ArrayField defaulting to [] — when it is empty every OIDC login is
          # denied: authorize.py check_grant logs "Invalid grant_type for
          # provider" and errors.py maps it to oauthlib's "The request is
          # otherwise malformed". The importer's partial update does NOT reset
          # undeclared fields on an existing entry, so this guards re-creation
          # (fresh provider -> model default []), which is how grants vanish.
          # Do NOT add response_types: it is not in the serializer's fields, so
          # the importer silently ignores it — response types derive from the
          # grants above.
          issuer_mode: per_provider
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.ngoldack.de/login/generic_oauth
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [name, !Context sm_openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, !Context sm_profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, !Context sm_email]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, !Context sm_groups]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: grafana
        attrs:
          name: grafana
          meta_name: Grafana
          meta_launch_url: https://grafana.ngoldack.de/
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, grafana-oidc]]
      # langfuse: native OIDC federation (NOT the outpost proxy — the proxy
      # pattern breaks the OIDC callback for an app that does its own auth
      # handshake). Mirrors grafana-oidc above; the client secret arrives via
      # !File from the dedicated seed-secrets-langfuse volume (/secrets-langfuse)
      # and MUST match langfuse-secret.sops.yaml's AUTH_AUTHENTIK_CLIENT_SECRET.
      # The redirect URI is langfuse's own callback path, per the chart's
      # AUTH_AUTHENTIK_* wiring.
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: langfuse-oidc
        attrs:
          # client_id MUST match the AUTH_AUTHENTIK_CLIENT_ID env in
          # langfuse/helmrelease.yaml (langfuse-oidc): NextAuth sends it to
          # authentik's authorize/token endpoints, so a mismatch breaks the
          # handshake with invalid_client. The application slug below
          # (langfuse) is what shapes the issuer /application/o/langfuse.
          client_id: langfuse-oidc
          client_type: confidential
          client_secret: !File /secrets-langfuse/client_secret
          # grant_types MUST be pinned (see the grafana-oidc comment): an empty
          # model default [] denies every OIDC login.
          issuer_mode: per_provider
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: https://langfuse.ngoldack.de/api/auth/callback/authentik
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [name, !Context sm_openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, !Context sm_profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, !Context sm_email]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, !Context sm_groups]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: langfuse
        attrs:
          name: langfuse
          meta_name: Langfuse
          meta_launch_url: https://langfuse.ngoldack.de/
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, langfuse-oidc]]
      # ---------- MFA (admin-gated) ----------
      # Phase 1 (non-breaking): creates the MFA authentication flow, the
      # enrollment chain, and the akadmin/users groups. NOTHING is re-pointed
      # at the MFA flow yet (default-authentication-flow stays authoritative),
      # so there is zero lockout risk. Follows the official blueprint pattern
      # (docs: customize/blueprints/v1/example.md) — !KeyOf for in-file refs,
      # attrs omitted when the default is fine.
      #
      # ORDER MATTERS: !KeyOf/!Find resolve only against entries processed
      # EARLIER in the document, so the enrollment flow + its stages are
      # declared before the MFA flow that configures them.
      # ---- enrollment flow (webauthn -> totp -> recovery) ----
      - id: enroll-flow
        model: authentik_flows.flow
        state: present
        identifiers:
          slug: default-authenticator-enrollment
        attrs:
          name: default-authenticator-enrollment
          title: Enroll MFA
          designation: stage_configuration
      - id: webauthn-enroll
        model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
        state: present
        identifiers:
          name: webauthn-enroll
        attrs:
          friendly_name: Security key / passkey
      - id: totp-enroll
        model: authentik_stages_authenticator_totp.authenticatortotpstage
        state: present
        identifiers:
          name: totp-enroll
        attrs:
          friendly_name: Authenticator app
          digits: 6
      - id: recovery-enroll
        model: authentik_stages_authenticator_static.authenticatorstaticstage
        state: present
        identifiers:
          name: recovery-enroll
        attrs:
          friendly_name: Recovery codes
      - id: enroll-user-write
        model: authentik_stages_user_write.userwritestage
        state: present
        identifiers:
          name: enroll-user-write
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          order: 10
          stage: !KeyOf webauthn-enroll
          target: !KeyOf enroll-flow
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          order: 20
          stage: !KeyOf totp-enroll
          target: !KeyOf enroll-flow
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          order: 30
          stage: !KeyOf recovery-enroll
          target: !KeyOf enroll-flow
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          order: 40
          stage: !KeyOf enroll-user-write
          target: !KeyOf enroll-flow
      # ---- MFA authentication flow (own stages, stacked) ----
      - id: mfa-flow
        model: authentik_flows.flow
        state: present
        identifiers:
          slug: default-authentication-flow-mfa
        attrs:
          name: default-authentication-flow-mfa
          title: MFA authentication
          designation: authentication
      - id: mfa-password
        model: authentik_stages_password.passwordstage
        state: present
        identifiers:
          name: mfa-password
        attrs:
          backends:
            - authentik.core.auth.InbuiltBackend
      - id: mfa-validate
        model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        state: present
        identifiers:
          name: mfa-validate
        attrs:
          device_classes: [webauthn, totp, static]
          # ENFORCED (2026-09-16): users without a device are routed into
          # enrollment before they can proceed — MFA is mandatory for every
          # login. configuration_stages MUST list a setup stage matching each
          # allowed device_class (akadmin's passkey was enrolled against the
          # stock webauthn setup stage); a mismatch strands the user.
          not_configured_action: configure
          # 2026.8 routes unconfigured users to these enrollment STAGES (M2M).
          # Match the stock stage the device was enrolled against.
          configuration_stages:
            - !Find [authentik_flows.stage, [name, default-authenticator-webauthn-setup]]
            - !Find [authentik_flows.stage, [name, default-authenticator-totp-setup]]
            - !Find [authentik_flows.stage, [name, default-authenticator-static-setup]]
      - id: mfa-identification
        model: authentik_stages_identification.identificationstage
        state: present
        identifiers:
          name: mfa-identification
        attrs:
          user_fields: [email, username]
      # ENFORCEMENT on the STOCK flow: default-authentication-mfa-validation
      # (order 30 of default-authentication-flow) is the validate stage every
      # provider actually reaches, since all providers keep
      # authentication_flow=default-authentication-flow. 'configure' routes
      # unenrolled users into MFA enrollment instead of skipping — MFA is
      # mandatory. device_classes/configuration_stages pinned to the webauthn/
      # totp/static trio (the classes the config stages can enroll; duo/sms/
      # email removed — no backend for them, a listed class with no matching
      # setup stage strands the user at login). Full-update serializer: every
      # live attr must be restated or a re-created stage loses it.
      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        state: present
        identifiers:
          name: default-authentication-mfa-validation
        attrs:
          not_configured_action: configure
          device_classes: [webauthn, totp, static]
          configuration_stages:
            - !Find [authentik_flows.stage, [name, default-authenticator-webauthn-setup]]
            - !Find [authentik_flows.stage, [name, default-authenticator-totp-setup]]
            - !Find [authentik_flows.stage, [name, default-authenticator-static-setup]]
      - id: mfa-login
        model: authentik_stages_user_login.userloginstage
        state: present
        identifiers:
          name: mfa-login
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          order: 10
          stage: !KeyOf mfa-identification
          target: !KeyOf mfa-flow
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          order: 20
          stage: !KeyOf mfa-password
          target: !KeyOf mfa-flow
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          order: 30
          stage: !KeyOf mfa-validate
          target: !KeyOf mfa-flow
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          order: 100
          stage: !KeyOf mfa-login
          target: !KeyOf mfa-flow
      # ---- groups: akadmin (privileged) + users (zero default access) ----
      - id: akadmin-group
        model: authentik_core.group
        state: present
        identifiers:
          name: akadmin
        attrs:
          is_superuser: true
          # Membership is REQUIRED: when Phase-3 PolicyBindings gate providers
          # to this group, an empty group would deny every user (incl.
          # akadmin) from every app — the lockout this rollout must avoid.
          users: [!Find [authentik_core.user, [username, akadmin]]]
      - model: authentik_core.group
        state: present
        identifiers:
          name: users
      # ---- registration: open self-service signup, landing in `users` ----
      # New registrants are auto-joined to the `users` group (above), which
      # binds to nothing, so they get zero app access until an admin adds
      # them to a real group. The login page reaches this flow via the
      # 'Sign up' link (IdentificationStage.enrollment_flow) on the stock
      # authentication flow's identification stage.
      - id: reg-flow
        model: authentik_flows.flow
        state: present
        identifiers:
          slug: home-registration
        attrs:
          name: home-registration
          title: Register
          designation: stage_configuration
      # PromptStage.fields is an M2M to Prompt rows (ids), not inline dicts:
      # declare each field with a UNIQUE name — field_key is NOT unique in
      # authentik (stock rows share username/email/password across flows), so
      # keying on it would resolve to those shared rows and mutate them.
      - id: reg-field-username
        model: authentik_stages_prompt.prompt
        state: present
        identifiers:
          name: home-registration-field-username
        attrs:
          field_key: username
          label: Username
          type: username
          required: true
          order: 10
      - id: reg-field-name
        model: authentik_stages_prompt.prompt
        state: present
        identifiers:
          name: home-registration-field-name
        attrs:
          field_key: name
          label: Name
          type: text
          required: true
          order: 20
      - id: reg-field-email
        model: authentik_stages_prompt.prompt
        state: present
        identifiers:
          name: home-registration-field-email
        attrs:
          field_key: email
          label: Email
          type: email
          required: true
          order: 30
      - id: reg-field-password
        model: authentik_stages_prompt.prompt
        state: present
        identifiers:
          name: home-registration-field-password
        attrs:
          field_key: password
          label: Password
          type: password
          required: true
          order: 40
      - id: reg-field-password-repeat
        model: authentik_stages_prompt.prompt
        state: present
        identifiers:
          name: home-registration-field-password-repeat
        attrs:
          field_key: password_repeat
          label: Repeat password
          type: password
          required: true
          order: 50
      - id: reg-prompt
        model: authentik_stages_prompt.promptstage
        state: present
        identifiers:
          name: home-registration-prompt
        attrs:
          fields:
            - !KeyOf reg-field-username
            - !KeyOf reg-field-name
            - !KeyOf reg-field-email
            - !KeyOf reg-field-password
            - !KeyOf reg-field-password-repeat
      - id: reg-user-write
        model: authentik_stages_user_write.userwritestage
        state: present
        identifiers:
          name: home-registration-user-write
        attrs:
          # The default group: every registrant lands here and inherits
          # nothing, until an admin adds them to a gating group.
          create_users_group: !Find [authentik_core.group, [name, users]]
          # Inactive until the email-verification stage (order 30) confirms
          # the address; its activate_user_on_success flips the account on.
          create_users_as_inactive: true
      # Email verification as a separate step AFTER user creation: a token
      # mail goes to the address captured by the prompt; the link completes
      # the flow's remaining stages. Global SMTP settings (EMAIL__* env from
      # the authentik-config Secret) are used; the account activates only on
      # successful token validation.
      - id: reg-email-verify
        model: authentik_stages_email.emailstage
        state: present
        identifiers:
          name: home-registration-email-verification
        attrs:
          use_global_settings: true
          activate_user_on_success: true
          token_expiry: "hours=48"
          subject: "Aktiviere deinen ngoldack.de Account"
          # Model default is password_reset.html, which renders NO activation
          # link (the sent mail's only hrefs were goauthentik.io footer).
          # account_confirmation.html renders {{ url }} with the flow token.
          template: email/account_confirmation.html
      - id: reg-mfa
        model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        state: present
        identifiers:
          name: home-registration-mfa-enrollment
        attrs:
          # Registration is a fresh user with NO devices: 'configure' routes
          # them into the SAME enrollment stages the login flow uses. Classes
          # must match the login-time stage exactly (webauthn/totp/static —
          # duo/sms/email would strand: no setup stage exists for them).
          not_configured_action: configure
          device_classes: [webauthn, totp, static]
          configuration_stages:
            - !Find [authentik_flows.stage, [name, default-authenticator-webauthn-setup]]
            - !Find [authentik_flows.stage, [name, default-authenticator-totp-setup]]
            - !Find [authentik_flows.stage, [name, default-authenticator-static-setup]]
      - id: reg-login
        model: authentik_stages_user_login.userloginstage
        state: present
        identifiers:
          name: home-registration-login
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          order: 10
          stage: !KeyOf reg-prompt
          target: !KeyOf reg-flow
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          order: 20
          stage: !KeyOf reg-user-write
          target: !KeyOf reg-flow
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          order: 30
          stage: !KeyOf reg-email-verify
          target: !KeyOf reg-flow
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          order: 40
          stage: !KeyOf reg-mfa
          target: !KeyOf reg-flow
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          order: 100
          stage: !KeyOf reg-login
          target: !KeyOf reg-flow
      # Expose the 'Sign up' link on the login page by pointing the stock
      # authentication flow's identification stage at the registration flow.
      # Every other attr is pinned to its live value because the blueprint
      # serializer validates a FULL update: a standalone enrollment_flow entry
      # is rejected ("When no user fields are selected..."), and the values
      # must not be left to defaults. password_stage stays null — the flow
      # binds PasswordStage as its own stage (order 20); inlining it here
      # would double-prompt every SSO login.
      - model: authentik_stages_identification.identificationstage
        state: present
        identifiers:
          name: default-authentication-identification
        attrs:
          user_fields: [email, username]
          password_stage: null
          case_insensitive_matching: true
          show_matched_user: true
          pretend_user_exists: true
          enable_remember_me: false
          enrollment_flow: !Find [authentik_flows.flow, [slug, home-registration]]
      # ---- Phase 3a: gate every app to the akadmin group ----
      # Zero-default-access: a fresh registrant lands in the `users` group,
      # which binds to NOTHING here, so they see no app. Only akadmin
      # (bound to every app below) can access. PolicyBinding has no natural
      # key; the composite identifier is (target, order) per authentik's
      # convention — unique per application. `negate: false` + `enabled: true`
      # make the binding grant access to group members.
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, headlamp]]
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, akadmin]]
          negate: false
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, hindsight-ui]]
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, akadmin]]
          negate: false
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, phoenix-edge]]
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, akadmin]]
          negate: false
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, grafana-edge]]
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, akadmin]]
          negate: false
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, grafana]]
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, akadmin]]
          negate: false
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, langfuse]]
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, akadmin]]
          negate: false
      # paperless: native OIDC federation, mirrors langfuse-oidc above; the
      # client secret arrives via !File from the dedicated
      # seed-secrets-paperless volume (/secrets-paperless) and MUST match
      # paperless-oidc.sops.yaml's client_secret. The redirect URI is
      # paperless-ngx's own allauth callback path.
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: paperless-oidc
        attrs:
          client_id: paperless
          client_type: confidential
          client_secret: !File /secrets-paperless/client_secret
          # grant_types MUST be pinned (see the grafana-oidc comment): an empty
          # model default [] denies every OIDC login.
          issuer_mode: per_provider
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: https://paperless.ngoldack.de/accounts/oidc/authentik/login/callback/
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [name, !Context sm_openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, !Context sm_profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, !Context sm_email]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, !Context sm_groups]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: paperless
        attrs:
          name: paperless
          meta_name: Paperless
          meta_launch_url: https://paperless.ngoldack.de/
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, paperless-oidc]]
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, paperless]]
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, akadmin]]
          negate: false
      # ---- login brute-force defense (ReputationPolicy) ----
      # Declarative home for the live-created `homelab-login-bruteforce` policy
      # AND its flow-level binding. The policy is re-imported idempotently here;
      # the binding is NOT declared: a PolicyBinding's natural identifier is the
      # unique (policy, target, order) set, and a `state: present` binding whose
      # identifiers don't resolve to the existing row forces a blind CREATE that
      # collides with the live binding — which aborts the WHOLE blueprint import
      # the moment the blueprint file's hash changes (every future seed edit
      # would break). The binding therefore persists live only (set once via the
      # UI/manually, negate=true so clean clients' score 0 <= -5 = False negates
      # to True = applicable; suspicious IPs blocked). See commits 50cd960
      # (same drop-for-health fix) and 3a725a4 (which re-added it and re-latent-
      # bugged the seed).
      - model: authentik_policies_reputation.reputationpolicy
        state: present
        identifiers:
          name: homelab-login-bruteforce
        attrs:
          check_ip: true
          check_username: true
          threshold: -5
      # ---- base URL / brand domain ----
      # The "base URL not configured" banner clears once the default Brand has
      # its real domain (authentik derives base_url from it; env AUTHENTIK_BASE_URL
      # is NOT read). Required for correct OIDC + MFA redirect URIs.
      - model: authentik_brands.brand
        state: present
        identifiers:
          domain: authentik.ngoldack.de
        attrs:
          domain: authentik.ngoldack.de
          default: true
