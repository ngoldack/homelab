apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orchestrator
  namespace: hermes
spec:
  serviceName: orchestrator
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agents
      app.kubernetes.io/instance: orchestrator
  template:
    metadata:
      # Rolls the pod when the profile configs change: the seed initContainer
      # only re-copies config.yaml/SOUL.md when `config-rev` differs from the
      # marker on the volume, so the annotation is what makes a ConfigMap edit
      # take effect. Same mechanism as ../hermes/statefulset.yaml.
      annotations:
        hermes.ngoldack.de/config-rev: "2"
      labels:
        app.kubernetes.io/name: hermes-agents
        app.kubernetes.io/instance: orchestrator
        hermes.ngoldack.de/sandbox: "true"
    spec:
      serviceAccountName: hermes
      terminationGracePeriodSeconds: 300
      # Placement: pin all four profiles to the sandbox-capable node (the only
      # node labelled workload.hermes.io/sandbox), because the Kanban board is
      # one SQLite file on the shared volume and every writer — the dispatcher
      # and the workers it spawns — should share one NFS client.
      # `database.journal_mode: delete` is the backstop if a pod ever lands
      # elsewhere. That node is also where the sandbox runtime and the parent
      # gateway already run.
      nodeSelector:
        workload.hermes.io/sandbox: "true"
      # Belt and braces: keep the four pods together even if the node selector
      # is ever relaxed. PREFERRED, not required — a required rule with a
      # self-matching label selector deadlocks the first pod.
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: hermes-agents
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: registry.ngoldack.de/hermes-agent-sandbox-plugin@sha256:6fc70c6494090978f050c1d74294ef47b3597de6e4561088be6fcbb2b1087ba5
          env:
            - name: HERMES_HOME
              value: /opt/data/profiles/orchestrator
            - name: HERMES_PROFILE
              value: orchestrator
            # The SINGLE shared board: the orchestrator dispatches from it and every
            # messaging agent creates its cards on it. One file, one dispatcher.
            - name: HERMES_KANBAN_DB
              value: /opt/data/kanban/kanban.db
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: OPENAI_API_KEY
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-agents-secret
                  key: API_SERVER_KEY
            - name: API_SERVER_PORT
              value: "8702"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: HERMES_API_TIMEOUT
              value: "600"
            # The image's entrypoint supervises the web dashboard as a child
            # process and the dashboard REFUSES to bind on 0.0.0.0 unless an
            # auth provider is registered — so without these it exits instantly
            # and the supervision loop restarts it every ~2s, burning ~0.5 core
            # per pod and flooding the log (measured: 560-630m per agent vs 8m
            # for the parent gateway, which has this same env). The dashboard is
            # inert here (no Service, no HTTPRoute, and the Cilium allowlist
            # admits only the API ports from `health`), it simply has to be
            # allowed to bind. Same three keys the parent gateway uses.
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
            - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: HERMES_DASHBOARD_BASIC_AUTH_SECRET
            - name: HERMES_LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: HERMES_LANGFUSE_PUBLIC_KEY
            - name: HERMES_LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: HERMES_LANGFUSE_SECRET_KEY
            - name: HERMES_LANGFUSE_BASE_URL
              value: http://langfuse-web.langfuse.svc.cluster.local:3000
            - name: HERMES_LANGFUSE_CAPTURE
              value: sanitized
            - name: HERMES_LANGFUSE_MAX_CHARS
              value: "12000"
            # Hindsight memory (plugin client env: the server-side TENANT_* names are
            # NOT client variables). Isolation = per-profile bank + per-profile bearer key.
            - name: HINDSIGHT_MODE
              value: local_external
            - name: HINDSIGHT_API_URL
              value: http://hindsight-api.hindsight.svc.cluster.local:8888
            # agent_sandbox terminal backend (Kata sandboxes).
            - name: AGENT_SANDBOX_ROUTER_URL
              value: http://sandbox-router-svc.agent-sandbox-system.svc.cluster.local:8080
            - name: AGENT_SANDBOX_ROUTER_TOKEN_FILE
              value: /opt/data/router-token
            - name: AGENT_SANDBOX_EGRESS_HMAC_SECRET_FILE
              value: /opt/data/egress-hmac
            - name: TERMINAL_ENV
              value: agent_sandbox
            - name: AGENT_SANDBOX_GATEWAY_ID
              value: orchestrator
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            # Requests are trimmed to fit FOUR of these gateways plus the parent
            # gateway and the sandbox runtime on one node (the shared SQLite
            # board wants them co-located; the sandbox node is the only one
            # labelled workload.hermes.io/sandbox=true). The limits are
            # untouched: these are guarantees, not caps, and real sandbox work
            # happens in the Kata microVMs, not in this container.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: 8702
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  curl -s -o /dev/null --max-time 3 http://127.0.0.1:8702/v1/models
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8702
            periodSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: router-token
              mountPath: /opt/data/router-token
              subPath: token
              readOnly: true
            - name: egress-hmac
              mountPath: /opt/data/egress-hmac
              subPath: EGRESS_HMAC_SECRET
              readOnly: true
            - name: tmp
              mountPath: /tmp
      initContainers:
        # Profile seeder. For ALL FOUR profiles it writes, under
        # /opt/data/profiles/<name>/:
        #   config.yaml + SOUL.md  — revision-aware (config-rev): the profile's
        #                            config and its identity file (Hermes loads
        #                            $HERMES_HOME/SOUL.md as identity slot #1).
        #   .env                   — rewritten whenever it changes: the headless
        #                            worker env (LLM key, sandbox plumbing,
        #                            memory bank + tenant key). Messaging
        #                            credentials deliberately stay out of it; only
        #                            the owning pod's env carries those.
        # All four exist everywhere because a Kanban worker may be spawned by the
        # orchestrator on any pod and resolves its home as <root>/profiles/<assignee>.
        - name: seed-profile
          image: registry.ngoldack.de/hermes-agent-sandbox-plugin@sha256:6fc70c6494090978f050c1d74294ef47b3597de6e4561088be6fcbb2b1087ba5
          command: ["/bin/sh", "-c"]
          env:
            - name: HERMES_CONFIG_REV
              valueFrom:
                configMapKeyRef:
                  name: hermes-agents-config
                  key: config-rev
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: OPENAI_API_KEY
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-agents-secret
                  key: API_SERVER_KEY
            - name: HERMES_LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: HERMES_LANGFUSE_PUBLIC_KEY
            - name: HERMES_LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: HERMES_LANGFUSE_SECRET_KEY
            - name: HINDSIGHT_D_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-agents-secret
                  key: HINDSIGHT_D_API_KEY
            - name: HINDSIGHT_C_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-agents-secret
                  key: HINDSIGHT_C_API_KEY
            - name: HINDSIGHT_L_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-agents-secret
                  key: HINDSIGHT_L_API_KEY
          args:
            - |
              set -eu
              ROUTER_URL='http://sandbox-router-svc.agent-sandbox-system.svc.cluster.local:8080'
              umask 077
              mkdir -p /opt/data/kanban
              # 1. every profile's config.yaml + SOUL.md, on EVERY pod: the
              #    orchestrator spawns each task's worker locally and the worker
              #    resolves its config from <root>/profiles/<assignee>, so all
              #    four profiles must exist wherever a worker can be started.
              seed_profile() {
                p="$1"; d="/opt/data/profiles/$p"; mkdir -p "$d"
                rev="$HERMES_CONFIG_REV"
                if [ "$(cat "$d/.config-rev" 2>/dev/null || true)" != "$rev" ]; then
                  [ -f "$d/config.yaml" ] && cp "$d/config.yaml" "$d/config.yaml.bak"
                  cp "/opt/boot/$p.yaml" "$d/config.yaml"
                  cp "/opt/boot/$p.soul.md" "$d/SOUL.md"
                  printf '%s\n' "$rev" > "$d/.config-rev"
                fi
              }
              seed_profile orchestrator
              seed_profile dave
              seed_profile chad
              seed_profile lindner
              write_env() {
                p="$1"; bank="$2"; hkey="$3"; sandbox="$4"
                d="/opt/data/profiles/$p"; mkdir -p "$d"
                {
                  printf 'HERMES_PROFILE=%s\n' "$p"
                  printf 'HERMES_KANBAN_DB=/opt/data/kanban/kanban.db\n'
                  printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
                  printf 'API_SERVER_KEY=%s\n' "$API_SERVER_KEY"
                  printf 'HERMES_API_TIMEOUT=600\n'
                  printf 'HERMES_LANGFUSE_PUBLIC_KEY=%s\n' "$HERMES_LANGFUSE_PUBLIC_KEY"
                  printf 'HERMES_LANGFUSE_SECRET_KEY=%s\n' "$HERMES_LANGFUSE_SECRET_KEY"
                  printf 'HERMES_LANGFUSE_BASE_URL=http://langfuse-web.langfuse.svc.cluster.local:3000\n'
                  printf 'HERMES_LANGFUSE_CAPTURE=sanitized\n'
                  printf 'HERMES_LANGFUSE_MAX_CHARS=12000\n'
                  printf 'HINDSIGHT_MODE=local_external\n'
                  printf 'HINDSIGHT_API_URL=http://hindsight-api.hindsight.svc.cluster.local:8888\n'
                  [ -n "$bank" ] && printf 'HINDSIGHT_BANK_ID=%s\n' "$bank"
                  [ -n "$hkey" ] && printf 'HINDSIGHT_API_KEY=%s\n' "$hkey"
                  if [ "$sandbox" = "true" ]; then
                    printf 'AGENT_SANDBOX_ROUTER_URL=%s\n' "$ROUTER_URL"
                    printf 'AGENT_SANDBOX_ROUTER_TOKEN_FILE=/opt/data/router-token\n'
                    printf 'AGENT_SANDBOX_EGRESS_HMAC_SECRET_FILE=/opt/data/egress-hmac\n'
                    printf 'AGENT_SANDBOX_GATEWAY_ID=%s\n' "$p"
                    printf 'TERMINAL_ENV=agent_sandbox\n'
                  fi
                } > "$d/.env.new"
                chmod 600 "$d/.env.new"
                mv "$d/.env.new" "$d/.env"
              }
              # 2. every profile's headless env: the orchestrator spawns workers for
              #    dave/chad/lindner on THIS pod, so those profile dirs and their
              #    worker env must exist here too. No messaging credentials here.
              write_env orchestrator "" "" false
              write_env dave nicolas-core "$HINDSIGHT_D_API_KEY" true
              write_env chad nicolas-dev "$HINDSIGHT_C_API_KEY" true
              write_env lindner nicolas-finance "$HINDSIGHT_L_API_KEY" false
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10000
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: boot-config
              mountPath: /opt/boot
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-agents-data
        - name: boot-config
          configMap:
            name: hermes-agents-config
            items:
              - key: orchestrator.yaml
                path: orchestrator.yaml
              - key: orchestrator.soul.md
                path: orchestrator.soul.md
              - key: dave.yaml
                path: dave.yaml
              - key: dave.soul.md
                path: dave.soul.md
              - key: chad.yaml
                path: chad.yaml
              - key: chad.soul.md
                path: chad.soul.md
              - key: lindner.yaml
                path: lindner.yaml
              - key: lindner.soul.md
                path: lindner.soul.md
        - name: router-token
          secret:
            secretName: hermes-secret
            items:
              - key: AGENT_SANDBOX_ROUTER_TOKEN
                path: token
        - name: egress-hmac
          secret:
            secretName: hermes-secret
            items:
              - key: EGRESS_HMAC_SECRET
                path: EGRESS_HMAC_SECRET
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
