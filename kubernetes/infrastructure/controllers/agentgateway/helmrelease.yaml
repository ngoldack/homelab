# agentgateway CRDs (group agentgateway.dev/v1alpha1), installed ahead of the
# controller as a separate chart, exactly as upstream ships them. The main
# agentgateway HelmRelease below dependsOn this one so the CRDs always land
# first.
#
# Both releases live in flux-system and deploy into the agentgateway-system
# targetNamespace. The `agentgateway` OCI HelmRepository they reference is
# declared centrally in controllers/sources.yaml (not inline here).
#
# VERIFY-BEFORE-DEPLOY: confirm the current OCI chart versions and the CRD
# apiVersions against the official agentgateway FluxCD install guide
# (https://agentgateway.dev) before rolling this out.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway-crds
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: agentgateway-system
  chart:
    spec:
      chart: agentgateway-crds
      # VERIFY-BEFORE-DEPLOY: pin to an exact published tag once confirmed.
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: agentgateway
      interval: 1h
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: agentgateway-system
  dependsOn:
    - name: agentgateway-crds
  chart:
    spec:
      chart: agentgateway
      # VERIFY-BEFORE-DEPLOY: pin to an exact published tag once confirmed.
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: agentgateway
      interval: 1h
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
  # VERIFY-BEFORE-DEPLOY: keep chart defaults for now. Confirm the exact values
  # schema against the published agentgateway chart before overriding anything.
  # agentgateway ships a GatewayClass `agentgateway` (controller name
  # agentgateway.dev/agentgateway) out of the box, so no values are required to
  # bring up a working control plane.
  values: {}
