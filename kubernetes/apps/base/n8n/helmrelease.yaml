apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: n8n
  chart:
    spec:
      chart: n8n
      version: "1.16.x"
      sourceRef:
        kind: HelmRepository
        name: community-charts
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values:
    # ── Database: external CloudNativePG ────────────────────────────────────
    db:
      type: postgresdb
    postgresql:
      enabled: false
    externalPostgresql:
      host: n8n-postgres-rw.n8n.svc.cluster.local
      port: 5432
      username: n8n
      database: n8n
      existingSecret: n8n-app-secrets

    # ── Queue mode backed by the Valkey operator instance ───────────────────
    redis:
      enabled: false
    externalRedis:
      host: n8n-valkey.n8n.svc.cluster.local
      port: 6379
      database: 0

    worker:
      mode: queue
      count: 2

    main:
      count: 1

    # n8n encryption key (key name N8N_ENCRYPTION_KEY) from the SOPS secret.
    existingEncryptionKeySecret: n8n-app-secrets

    timezone: "Europe/Berlin"

    # Public webhook/editor base URL on the NetBird mesh.
    # TODO: set to your NetBird-resolvable n8n hostname.
    extraEnvVars:
      WEBHOOK_URL: "https://n8n.netbird.example.com/"
      N8N_PROTOCOL: "https"
      N8N_HOST: "n8n.netbird.example.com"

    # No object storage; n8n stores binary data in the database/filesystem.
    minio:
      enabled: false
