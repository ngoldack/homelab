  nfs.rootSquash: "false"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
---
# Per-PVC StorageClasses.
#
# Layout is always {pool}/k8s/{protocol}/{namespace}/{app}/pvc-<uid>, so a
# dataset identifies itself on the NAS without cross-referencing anything:
#   fast/k8s/nfs/immich/database/pvc-<uid>
#   tank/k8s/nfs/immich/library/pvc-<uid>
# Classes are named truenas-{pool}-{protocol}-{namespace}-{app} to match.
#
# This costs roughly one StorageClass per PVC, which is worth stating plainly:
# datasetPath is a StorageClass parameter, so a per-PVC path needs a per-PVC
# class. There is no cheaper mechanism. The leaf cannot carry the meaning
# either — the driver derives it from the CSI request name
# (volumeName := SanitizeVolumeName(req.Name) in pkg/driver/controller.go),
# which the external-provisioner generates as pvc-<uid>. The provisioner runs
# with --extra-create-metadata, so the PVC's name and namespace ARE in the
# parameters map, but the driver reads no csi.storage.k8s.io/* key, and its
# dataset Comment is hardcoded to "CSI volume <path>" with no override.
#
# Adding a workload means adding a class here. To map a UUID back from the
# cluster side:
#   kubectl get pv -o custom-columns=PV:.metadata.name,NS:.spec.claimRef.namespace,CLAIM:.spec.claimRef.name

