# JWT authentication for the AI Gateway's public route (llm.ngoldack.de).
#
# Clients mint a Bearer token from authentik's client_credentials grant
# (provider aigateway-oidc in ../authentik/seed.yaml) and send it as
#   Authorization: Bearer <access_token>
# EAG validates the JWT against authentik's published JWKS before any model
# routing happens — a bad or missing token is 401 at the gateway, not at a
# model backend.
#
# The policy attaches to the aigateway Gateway, so EVERY route on it
# (deepseek/*, local, default, small, vision, free) demands a token. The LAN
# VIP (10.30.0.201) and the public edge route share this requirement: one
# auth story, no per-route drift.
#
# remoteJWKS points at the edge-exposed authentik host — the same URL any
# external OIDC client would use for discovery. authentik derives the issuer
# from the request host (no AUTHENTIK_HOST pinned; issuer_mode: per_provider),
# so the JWT's `iss` claim is https://authentik.ngoldack.de/application/o/
# aigateway/ when the client authenticates against the edge portal, matching
# the issuer below. The provider signs with the aigateway-oidc-signing RSA
# keypair (see seed.yaml): without it authentik falls back to HS256 and this
# policy would have nothing to verify.
# remoteJWKS points at the IN-CLUSTER authentik service, not the public edge
# host. The JWKS document is provider-scoped and host-independent (same signing
# key either way), and fetching it in-cluster removes an external dependency
# from every single authenticated request: with the edge URL, a slow or
# rebooting edge made jwt_authn fail closed ("Jwks remote fetch is failed") and
# every client got 401. The `issuer` stays the public URL because that is the
# value authentik stamps into the token's `iss` claim and Envoy compares it
# exactly.
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: aigateway-jwt
  namespace: aigateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: aigateway
  jwt:
    providers:
      - name: authentik
        issuer: https://authentik.ngoldack.de/application/o/aigateway/
        remoteJWKS:
          uri: http://authentik-server.authentik.svc.cluster.local/application/o/aigateway/jwks/
