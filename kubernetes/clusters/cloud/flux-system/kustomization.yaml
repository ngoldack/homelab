apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
patches:
  # Cloud uses a non-default Kubernetes cluster domain (cloud.cluster.local,
  # see tofu/cloud/terraform.tfvars) so it can be told apart from home's once
  # ClusterMesh is in place. Flux's generated component manifests hardcode
  # the default "cluster.local" in these controller args, which breaks
  # in-cluster service DNS lookups (NXDOMAIN) on a non-default domain.
  - target:
      kind: Deployment
      name: helm-controller
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - --events-addr=http://notification-controller.$(RUNTIME_NAMESPACE).svc.cloud.cluster.local./
          - --watch-all-namespaces=true
          - --log-level=info
          - --log-encoding=json
          - --enable-leader-election
  - target:
      kind: Deployment
      name: kustomize-controller
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - --events-addr=http://notification-controller.$(RUNTIME_NAMESPACE).svc.cloud.cluster.local./
          - --watch-all-namespaces=true
          - --log-level=info
          - --log-encoding=json
          - --enable-leader-election
  - target:
      kind: Deployment
      name: source-controller
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - --events-addr=http://notification-controller.$(RUNTIME_NAMESPACE).svc.cloud.cluster.local./
          - --watch-all-namespaces=true
          - --log-level=info
          - --log-encoding=json
          - --enable-leader-election
          - --storage-path=/data
          - --storage-adv-addr=source-controller.$(RUNTIME_NAMESPACE).svc.cloud.cluster.local.
