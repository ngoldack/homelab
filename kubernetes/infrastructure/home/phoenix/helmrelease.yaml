# Arize Phoenix — self-hosted LLM observability (OTLP tracing, evals, prompt
# management), pinned to the chart's current release. A single Python server
# serves the UI, the HTTP API, the OTLP collectors and the gRPC endpoint, with
# Postgres holding every byte of durable state.
#
# Deployment path: the upstream Helm chart with its bundled
# groundhog2k/postgres subchart DISABLED (postgresql.enabled: false) — every
# relational store here runs on the CNPG operator (phoenix-database). This is
# the chart's documented "Strategy 3: external database": database.postgres.*
# supplies host/port/db/user, and the password is injected as
# PHOENIX_POSTGRES_PASSWORD from postgres-credentials.sops.yaml through
# auth.secret[].valueFrom, never into this committed values block (the bundled
# chart's default password path would otherwise put it in plaintext here).
#
# auth.enableAuth is FALSE: the assignment explicitly defers SSO to the
# integration owner, and leaving the chart default (auth on, admin/admin)
# would ship a hardcoded credential on a LAN-exposed UI that stores LLM
# traces. The LAN-only HTTPRoute (publish=lan on the trusted .200 VIP) is the
# only gate until OIDC is wired — the same trust model as the hindsight API's
# deliberate auth-less LAN surface. PHOENIX_SECRET / PHOENIX_ADMIN_SECRET stay
# chart-generated (persisted in the phoenix-secret Secret) so re-enabling auth
# later needs no re-bootstrap.
#
# Ports: UI + OTLP/HTTP share 6006 (Phoenix accepts spans at /v1/traces on the
# app port; there is no separate 4318 listener), OTLP/gRPC 4317, Prometheus
# /metrics 9090 (PHOENIX_ENABLE_PROMETHEUS=true) so vm-scrapes.yaml has
# something to collect. Working dir is the chart-default emptyDir on /data —
# nothing durable lives there (state is in Postgres), only in-flight
# exports/session files which do not survive a pod restart.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: phoenix
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: phoenix-helm
      version: "12.0.11"
      sourceRef:
        kind: HelmRepository
        name: phoenix
      interval: 1h
  targetNamespace: phoenix
  releaseName: phoenix
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # We route via Gateway API HTTPRoute; the chart's default Ingress is
    # unneeded and would render with an empty host.
    ingress:
      enabled: false
    # External DB (Strategy 3). Disables the subchart and its PVC.
    postgresql:
      enabled: false
    persistence:
      enabled: false
    service:
      type: ClusterIP
      # The chart only emits labels on the Service when at least one of
      # server.labels/service.labels is set; an explicit label both triggers
      # the built-in `app: phoenix` label that vm-scrapes.yaml selects on, and
      # tags the service for the component convention.
      labels:
        app.kubernetes.io/component: phoenix
    # Pin to home: the traces originate from home LLM workloads (qwen3-27b,
    # hindsight) and the CNPG cluster is pinned there, so this keeps ingestion
    # and its DB on the same site instead of crossing KubeSpan.
    deployment:
      nodeSelector:
        topology.homelab/site: home
    server:
      enablePrometheus: true
    database:
      postgres:
        host: phoenix-database-rw
        port: 5432
        db: phoenix
        user: phoenix
    auth:
      enableAuth: false
      createSecret: true
      name: phoenix-secret
      # PHOENIX_SECRET / PHOENIX_ADMIN_SECRET are chart-generated (random,
      # persisted in the phoenix-secret Secret). PHOENIX_POSTGRES_PASSWORD is
      # wired to the CNPG bootstrap secret so the one password has one owner.
      secret:
        - key: PHOENIX_SECRET
          value: ""
        - key: PHOENIX_ADMIN_SECRET
          value: ""
        - key: PHOENIX_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: phoenix-database-credentials
              key: password
