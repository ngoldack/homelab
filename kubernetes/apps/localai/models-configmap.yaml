apiVersion: v1
kind: ConfigMap
metadata:
  name: localai-models
  namespace: localai
data:
  fast.yaml: |
    name: fast
    backend: llama-cpp
    parameters:
      model: qwen2.5-coder-7b-q8.gguf
    threads: 8
    f16: true
  smart.yaml: |
    name: smart
    backend: llama-cpp
    parameters:
      model: llama-3.3-70b-q4.gguf
    threads: 8
    f16: true
