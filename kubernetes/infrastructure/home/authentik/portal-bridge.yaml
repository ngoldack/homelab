# Portal bridges: pod-netns nginx hops, one per site, each fronting the
# node-local server via authentik-server-local (see that file for why).
#
# Why bridges exist at all: the gateway data plane is host-netns
# cilium-envoy, and cross-site pod reachability over KubeSpan+VXLAN is the
# flaky layer (verified live: host→remote-pod fails outright; pod→remote-pod
# ~50%). Each bridge is a LOCAL backend for its site's envoy and a
# local-socket-LB client of the server — no cross-site hop survives on the
# request path. The outpost reaches authentik the same way (its
# AUTHENTIK_HOST points at the -local Service).
#
# arm64-safe image; the cloud side tolerates the ingress taint.
apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-bridge-config
  namespace: authentik
data:
  nginx.conf: |
    events {}
    http {
      resolver 172.21.0.10 valid=10s ipv6=off;
      server {
        listen 9100;
        location / {
          set $upstream http://authentik-server-local.authentik.svc.cluster.local;
          proxy_pass $upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-bridge-home
  namespace: authentik
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-bridge
      portal.ngoldack.de/site: home
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-bridge
        portal.ngoldack.de/site: home
    spec:
      nodeSelector:
        topology.homelab/site: home
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.29-alpine
          args: ["nginx", "-c", "/etc/nginx/nginx.conf", "-fg"]
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
      volumes:
        - name: conf
          configMap:
            name: portal-bridge-config
---
apiVersion: v1
kind: Service
metadata:
  name: portal-bridge-home
  namespace: authentik
spec:
  selector:
    app.kubernetes.io/name: portal-bridge
    portal.ngoldack.de/site: home
  ports:
    - name: http
      port: 9100
      targetPort: 9100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-bridge-cloud
  namespace: authentik
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-bridge
      portal.ngoldack.de/site: cloud
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-bridge
        portal.ngoldack.de/site: cloud
    spec:
      nodeSelector:
        topology.homelab/site: cloud
      tolerations:
        - key: dedicated
          value: ingress
          effect: NoSchedule
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.29-alpine
          args: ["nginx", "-c", "/etc/nginx/nginx.conf", "-fg"]
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
      volumes:
        - name: conf
          configMap:
            name: portal-bridge-config
---
apiVersion: v1
kind: Service
metadata:
  name: portal-bridge-cloud
  namespace: authentik
spec:
  selector:
    app.kubernetes.io/name: portal-bridge
    portal.ngoldack.de/site: cloud
  ports:
    - name: http
      port: 9100
      targetPort: 9100
