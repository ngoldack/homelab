apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: authentik-gateway
  namespace: authentik
  annotations:
    # cert-manager issues the listener certificate via the production ClusterIssuer.
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  gatewayClassName: cilium
  listeners:
    # HTTP listener kept for ACME HTTP-01 solver and HTTP->HTTPS redirect.
    - name: http
      protocol: HTTP
      port: 80
      hostname: "auth.example.com"  # TODO: set to your public Authentik FQDN
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "auth.example.com"  # TODO: set to your public Authentik FQDN
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: authentik-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: authentik
spec:
  parentRefs:
    - name: authentik-gateway
  hostnames:
    - auth.example.com  # TODO: set to your public Authentik FQDN
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authentik-server
          port: 80
