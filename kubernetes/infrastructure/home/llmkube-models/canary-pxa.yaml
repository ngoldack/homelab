# PXA canary InferenceServices for the qwen36-35b A/B (2026-09-20).
#
# Three canaries, ONE image (registry.ngoldack.de/pxa:2026.09.13-rc3, digest → Step 1
# build Job status.imageDigest), each with its own dedicated KV slot PVC — never the
# production llama-kv-cache claim. All share the production qwen36-35b Model (same
# weights file) or the pxa-specialized Models in canary-pxa-models.yaml.
#
# DORMANT at rest (replicas: 0 — llmkube phase Stopped, same pattern as qwen3-27b).
# One canary is scaled to replicas: 1 at a time during the authorized bench window
# (git-driven, never kubectl-patch: Flux would revert a live patch).
#
# Serving config mirrors qwen36.yaml 1:1 (ctx 32768, KV q8_0/q8_0, FA on, parallel 1,
# runtimeClassName nvidia, P100 nodeSelector). Specialized models additionally run
# `--jinja --reasoning off` (rc3 no-think template; omitting it causes thinking loops
# on this Qwen family).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-kv-cache-pxa-canary
  namespace: llmkube-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-fast-nfs-llmkube-models
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-kv-cache-pxa-fusion4
  namespace: llmkube-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-fast-nfs-llmkube-models
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-kv-cache-pxa-coder
  namespace: llmkube-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-fast-nfs-llmkube-models
  resources:
    requests:
      storage: 20Gi
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen36-35b-pxa-canary
  namespace: llmkube-system
spec:
  modelRef: qwen36-35b
  replicas: 1
  image: registry.ngoldack.de/pxa:2026.09.13-rc3@sha256:9bf9824d5b02fd3a03d39153e3ef1eca310828e4abcb21c82bbd6b43bef665dc
  runtimeClassName: nvidia
  nodeSelector:
    hardware/gpu.model: Tesla-P100
  contextSize: 32768
  flashAttention: true
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  parallelSlots: 1
  endpoint:
    port: 8080
    type: ClusterIP
  resources:
    gpu: 1
    gpuMemory: "16Gi"
    cpu: "4"
    memory: "8Gi"
  extraArgs:
    - --kv-unified
    - --slot-save-path
    - /var/lib/llama/kv-canary
  extraVolumes:
    - name: kv-canary
      persistentVolumeClaim:
        claimName: llama-kv-cache-pxa-canary
  extraVolumeMounts:
    - name: kv-canary
      mountPath: /var/lib/llama/kv-canary
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: pxa-fusion4-35b-canary
  namespace: llmkube-system
spec:
  modelRef: pxa-fusion4-35b
  replicas: 0
  image: registry.ngoldack.de/pxa:2026.09.13-rc3@sha256:9bf9824d5b02fd3a03d39153e3ef1eca310828e4abcb21c82bbd6b43bef665dc
  runtimeClassName: nvidia
  nodeSelector:
    hardware/gpu.model: Tesla-P100
  contextSize: 32768
  flashAttention: true
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  parallelSlots: 1
  endpoint:
    port: 8080
    type: ClusterIP
  resources:
    gpu: 1
    gpuMemory: "16Gi"
    cpu: "4"
    memory: "8Gi"
  extraArgs:
    - --kv-unified
    - --slot-save-path
    - /var/lib/llama/kv-fusion4
    - --jinja
    - --reasoning
    - off
  extraVolumes:
    - name: kv-fusion4
      persistentVolumeClaim:
        claimName: llama-kv-cache-pxa-fusion4
  extraVolumeMounts:
    - name: kv-fusion4
      mountPath: /var/lib/llama/kv-fusion4
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: pxa-coder-35b-canary
  namespace: llmkube-system
spec:
  modelRef: pxa-coder-35b
  replicas: 0
  image: registry.ngoldack.de/pxa:2026.09.13-rc3@sha256:9bf9824d5b02fd3a03d39153e3ef1eca310828e4abcb21c82bbd6b43bef665dc
  runtimeClassName: nvidia
  nodeSelector:
    hardware/gpu.model: Tesla-P100
  contextSize: 32768
  flashAttention: true
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  parallelSlots: 1
  endpoint:
    port: 8080
    type: ClusterIP
  resources:
    gpu: 1
