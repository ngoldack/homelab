apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-cloud
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/infrastructure/cloud
  prune: true
  wait: true
  timeout: 15m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
