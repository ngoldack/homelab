# LLM backends for the agentgateway — the AgentgatewayBackend resources.
#
# Replaces the aigateway (Envoy AI Gateway) lane's per-model backends:
# - aigateway/synthetic.yaml -> `synthetic` (host api.synthetic.new:443,
#   OpenAI-compatible /v1 — mirrored verbatim from the old EG Backend fqdn).
# - aigateway/models.yaml    -> `openrouter` (host openrouter.ai:443, the
#   OpenAI-compatible /api/v1 path the old lane expressed as
#   schema {name: OpenAI, prefix: /api/v1}).
# - chat-chain's per-tier Synthetic providers -> `synthetic-small`,
#   `synthetic-large`, `synthetic-hf-deepseek`: the three provider stanzas
#   chat-chain lists as priority groups, each promoted to a single-provider
#   backend so a client can PIN a tier instead of walking the chain. Exposed
#   as /v1/synthetic-{small,large,deepseek} in routes.yaml; the stanzas are
#   verbatim copies, so edit chat-chain.yaml and here together.
# - local P100 inference     -> `local-p100` (the P100's llmkube
#   InferenceService is reached through the in-cluster `llama-kv-broker`
#   Service, which owns the per-session slot restore/save choreography and
#   proxies every /v1 request; custom-provider backendRef is namespace-LOCAL
#   per the CRD, so the cross-namespace Service is declared as an FQDN host
#   instead — CRD validation: "custom providers must specify exactly one of
#   backendRef or host and port").
#
# Auth: policies.auth.secretRef resolves the Authorization header from the
# named Secret ("Credential source for the authorization value, defaulting
# to ... the `Authorization` key" — CRD docs). TLS: policies.tls.sni pins
# SNI; the destination hostname alone would set the same SNI, but pinning
# makes the intent explicit (the old lane used BackendTLSPolicy hostname).
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: local-p100
  namespace: agentgateway
spec:
  ai:
    # spec.ai carries only `groups` (priority-ordered provider lists) — a
    # single backend is a one-provider group.
    groups:
      - providers:
          - name: local-p100
            custom:
              # llama.cpp (llmkube qwen36-35b InferenceService) is OpenAI-
              # compatible; format path mirrors the old lane's /v1 prefix.
              formats:
                - type: Completions
                  path: /v1/chat/completions
              # Cost-catalog/telemetry identity: this is a llama.cpp backend.
              providerOverride: llama.cpp
            host: llama-kv-broker.llmkube-system.svc.cluster.local
            port: 8080
            policies:
              ai:
                routes:
                  # "Models" route type is not implemented for custom providers
                  # (proxy 501s); the passthrough route sends /v1/models to
                  # llama.cpp untouched.
                  "/v1/models": "Passthrough"
                  "/v1/chat/completions": "Completions"
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: openrouter
  namespace: agentgateway
spec:
  ai:
    groups:
      - providers:
          - name: openrouter
            openai: {}
            host: openrouter.ai
            port: 443
            # OpenRouter is OpenAI-compatible but under /api/v1, not /v1.
            path: /api/v1/chat/completions
            policies:
              auth:
                secretRef:
                  name: openrouter-key
              tls:
                sni: openrouter.ai
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: synthetic
  namespace: agentgateway
spec:
  ai:
    groups:
      - providers:
          - name: synthetic
            openai: {}
            host: api.synthetic.new
            port: 443
            path: /v1/chat/completions
            policies:
              auth:
                secretRef:
                  name: synthetic-key
              tls:
                sni: api.synthetic.new

---
# Per-tier Synthetic paths. Each of these is one of chat-chain's priority
# groups promoted to a single-provider backend, so a client that wants a
# specific tier can select it by path (routes.yaml) instead of walking the
# chain. Provider stanzas are verbatim copies of chat-chain's — the model
# strings are synthetic.new's tier aliases (`syn:*` = Synthetic's own models,
# `hf:*` = HuggingFace-hosted).
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: synthetic-small
  namespace: agentgateway
spec:
  ai:
    groups:
      - providers:
          - name: synthetic-small
            host: api.synthetic.new
            port: 443
            path: /v1/chat/completions
            openai:
              model: syn:small:text
            policies:
              auth:
                secretRef:
                  name: synthetic-key
              tls:
                sni: api.synthetic.new
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: synthetic-large
  namespace: agentgateway
spec:
  ai:
    groups:
      - providers:
          - name: synthetic-large
            host: api.synthetic.new
            port: 443
            path: /v1/chat/completions
            openai:
              model: syn:large:text
            policies:
              auth:
                secretRef:
                  name: synthetic-key
              tls:
                sni: api.synthetic.new
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: synthetic-hf-deepseek
  namespace: agentgateway
spec:
  ai:
    groups:
      - providers:
          - name: synthetic-hf-deepseek
            host: api.synthetic.new
            port: 443
            path: /v1/chat/completions
            openai:
              model: hf:deepseek-ai/DeepSeek-V4.1-Flash
            policies:
              auth:
                secretRef:
                  name: synthetic-key
              tls:
                sni: api.synthetic.new
