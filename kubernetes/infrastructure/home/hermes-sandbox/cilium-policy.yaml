# hermes-sandbox Cilium policies — default-deny baseline plus the two keeps.
#
# Cilium default-deny semantics (same pattern as agent-sandbox/cilium-*.yaml):
# every endpoint starts OPEN; the FIRST policy rule that selects an endpoint
# (its endpointSelector matches) and carries an ingress and/or egress section
# flips that endpoint to default-deny for the matching direction. The
# default-deny doc therefore carries one empty rule per direction, and the
# allow docs below carve out exactly the traffic sandboxes emit and accept:
# a wildcard DNS backstop, one egress-class doc per profile, and the ingress
# allowlist. Every field is grounded in `kubectl explain
# ciliumnetworkpolicy.spec --recursive` of the installed cilium.io/v2 CRD.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-sandbox-default-deny
  namespace: hermes-sandbox
spec:
  description: >-
    Deny-all traffic baseline for every pod in hermes-sandbox. The egress
    and ingress-router allow docs are the only exceptions; the egressDeny
    rules below additionally keep management-plane ranges dropped with a
    labeled verdict even if a future allow rule ever mentions them.
  endpointSelector:
    matchLabels: {}
  ingress:
    - {}
  egress:
    - {}
  egressDeny:
    # RFC1918 + link-local are the networks this cluster's management planes
    # (Talos, Proxmox, Kubernetes API, host metadata services) live on.
    # Explicit deny beats allow: these ranges stay dropped and the verdict
    # stays labeled (Hubble-observable) no matter what any allow rule says.
    # 172.20.0.0/16 + 172.21.0.0/16 (node + k8s service subnets) are
    # excepted because legitimately allowed flows live there: cluster DNS,
    # kube-apiserver egress and Router-to-sandbox traffic.
    - toCIDRSet:
        - cidr: 10.0.0.0/8
        - cidr: 192.168.0.0/16
        - cidr: 169.254.169.254/32
        - cidr: 172.16.0.0/12
          except:
            - 172.20.0.0/16
            - 172.21.0.0/16
    # openrouter.ai / api.openrouter.ai MUST stay unreachable. The installed
    # cilium.io/v2 CRD has no FQDN-scoped field under egressDeny (verified
    # `kubectl explain ciliumnetworkpolicy.spec.egressDeny`), so a named deny
    # cannot be expressed; they are instead STRICTLY absent from the egress
    # allowlist, which lands every attempt on default-deny. Allowing these
    # FQDNs therefore requires a deliberate, reviewable edit.
---
# hermes-sandbox egress allowlist — the only network a sandbox may emit.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-sandbox-egress-allowlist
  namespace: hermes-sandbox
spec:
  description: >-
    Backstop egress allowlist: cluster DNS + the hermes-egress forward proxy
    for every pod in hermes-sandbox, including any pod that no per-profile
    class doc covers (a sandbox provisioned before the
    workload.hermes.io/profile label existed must keep working across this
    change). Phase 3 has landed: sandbox egress is DNS + proxy 3128 ONLY —
    every other destination is default-deny (the egressDeny doc above keeps
    the management-plane ranges explicitly dropped). This doc stays a
    wildcard on purpose and must never grow beyond DNS + the proxy; anything
    added here would be a bypass of the egress guard.
  endpointSelector:
    matchLabels: {}
  egress:
    - toEndpoints:
        # The hermes-egress forward proxy: the sandbox's ONLY mediated
        # internet path. Keyed on the proxy pods' labels plus the virtual
        # namespace label (cross-namespace endpoint matching, repo pattern
        # from this file's ingress docs). 3128 is the CONNECT listener; the
        # authorizer's /check rides the PROXY pod's same-namespace callout,
        # never a sandbox connection.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes-egress
            app.kubernetes.io/component: forward-proxy
      toPorts:
        - ports:
            - port: "3128"
              protocol: TCP
    # Cluster DNS is the sandbox's other allowed egress (it resolves
    # hostnames itself and hands them to the proxy; the authorizer never
    # resolves). Keyed on the k8s-app label Cilium recognizes for kube-dns.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # DNS-only by design — an FQDN-scoped rule cannot work here: the Cilium DNS
    # proxy is not in transparent mode (tofu/home/cilium.tf), so no policy
    # engine sees the resolved IPs and an FQDN allow would never learn the
    # identity it is meant to permit. A direct internet egress allow would be
    # a BYPASS of the hermes-egress guard (the authorizer is the only thing
    # that decides which hosts a session may touch), so the reachable set is
    # DNS + proxy, and the plugin's injected sandbox facts tell the model the
    # same.
---
# Egress class `dns-plus-proxy` — profile `go` (template hermes-go).
#
# WHY a class doc per profile: reachability is a property of the PROFILE, not
# of the namespace. Phase 3 has landed the hermes-egress forward proxy: the
# toolchain profiles sit on "DNS + proxy 3128 only", while hermes-offline gets
# the strictest class (DNS + a proxy that denies every CONNECT for it — its
# policy allowlist is empty). One doc per profile keeps "what may profile X
# reach?" a single grep.
#
# WHY it repeats the wildcard backstop's rules instead of relying on them:
# this doc IS the class definition (an endpointSelector with no rules would
# define nothing), so the allowed set has to be written here. Cilium computes
# the effective allow set as the UNION of the rules of every policy selecting
# the endpoint, so the duplicates change nothing — both docs allow exactly
# cluster DNS + the forward proxy.
#
# NOTHING MAY WIDEN EGRESS BEYOND DNS + THE PROXY from this file: the
# hermes-egress guard is the only mediated internet path (the authorizer
# decides which host/port a session may touch, Cilium drops everything else),
# so an added CIDR/world/FQDN rule here would be a BYPASS of that guard, not
# an allowance. The FQDN caveat still applies (no transparent DNS proxy =>
# FQDN rules are inert), and new dependency mirrors belong in the authorizer's
# policy ConfigMap (hermes-egress/policy-configmap.yaml), never here.
#
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-sandbox-class-dns-plus-proxy-go
  namespace: hermes-sandbox
spec:
  description: >-
    Egress class dns-plus-proxy for profile go: cluster DNS + the
    hermes-egress forward proxy, nothing else.
  endpointSelector:
    matchLabels:
      workload.hermes.io/profile: go
  egress:
    # The forward proxy: the ONLY mediated internet path. Keyed on the
    # proxy pods' labels + the virtual namespace label (cross-namespace
    # endpoint matching, same pattern as this file's ingress docs).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes-egress
            app.kubernetes.io/component: forward-proxy
      toPorts:
        - ports:
            - port: "3128"
              protocol: TCP
    # Cluster DNS — keyed on the k8s-app label Cilium recognizes for
    # kube-dns, the same peer as the wildcard backstop above.
---
# Egress class `dns-plus-proxy` — profile `core` (template hermes-core).
#
# Same class, same allowance pair as the go doc above (see it for the union
# semantics); only the profile differs. A claim that carries no profile label
# lands on the wildcard backstop instead — same reachability, but with no
# class of its own.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-sandbox-class-dns-plus-proxy-core
  namespace: hermes-sandbox
spec:
  description: >-
    Egress class dns-plus-proxy for profile core: cluster DNS + the
    hermes-egress forward proxy, nothing else.
  endpointSelector:
    matchLabels:
      workload.hermes.io/profile: core
  egress:
    - toEndpoints:
        # Same proxy peer pair as the go doc (see it for the identity
        # matching rationale) — duplicates by union semantics.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes-egress
            app.kubernetes.io/component: forward-proxy
      toPorts:
        - ports:
            - port: "3128"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Egress class `dns-plus-proxy` — profile `offline` (template hermes-offline).
#
# The profile with the STRICTEST mediated set: it keeps the same network peers
# as every other profile (DNS + the proxy on 3128) — removing DNS would break
# name resolution without adding any guard — but the hermes-egress policy
# ConfigMap gives `offline` an EMPTY allowlist, so every CONNECT the proxy
# accepts for it is denied by the authorizer (the whole point of having a
# profile that declares it fetches nothing: its egress is DNS + a guarded
# door that is closed). The class list is enforced here, not by the template
# (the CRD's spec.networkPolicy is K8s-NetworkPolicy-shaped and additive next
# to Cilium, which is why every template sets networkPolicyManagement:
# Unmanaged).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-sandbox-class-dns-plus-proxy-offline
  namespace: hermes-sandbox
spec:
  description: >-
    Egress class dns-plus-proxy for profile offline: cluster DNS + the
    hermes-egress proxy, whose policy allowlist for offline is EMPTY — every
    CONNECT is denied, so the mediated door is closed.
  endpointSelector:
    matchLabels:
      workload.hermes.io/profile: offline
  egress:
    - toEndpoints:
        # The proxy: reachable so DNS resolution + the deny-by-policy path
        # behave exactly like every other profile (fail-closed with the same
        # failure modes), while the authorizer's empty allowlist for offline
        # denies every CONNECT.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes-egress
            app.kubernetes.io/component: forward-proxy
      toPorts:
        - ports:
            - port: "3128"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# hermes-sandbox ingress allowlist — the only callers of sandbox APIs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-sandbox-ingress-router
  namespace: hermes-sandbox
spec:
  description: >-
    The only ingress a sandbox accepts: the sandbox-router reaching the
    runtime REST port (8080) and the Hermes gateway reaching the runtime
    gRPC ProcessService (9090, exec). Cilium v2 has no namespaceSelector —
    cross-namespace matching uses the k8s:io.kubernetes.pod.namespace
    virtual label combined with the peer's real pod labels (repo pattern
    from agent-sandbox/cilium-router.yaml).
  endpointSelector:
    matchLabels: {}
  ingress:
    # Identity match on the Router itself, not on its namespace: the labels
    # below are the vendored Deployment's own selector and pod-template
    # labels (agent-sandbox/upstream/sandbox-router/deployment.yaml).
    # Matching the namespace alone would admit every pod in it —
    # agent-sandbox-system enforces PSA baseline, and PSA constrains HOW a
    # pod runs, never WHICH workloads exist, so the namespace label does not
    # narrow the peer set. 8080 is the Router's REST proxy port and the only
    # runtime API it may reach.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agent-sandbox-system
            app.kubernetes.io/name: sandbox-router
            app.kubernetes.io/component: sandbox-router
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Direct gRPC exec (user-approved fallback: sandboxd v1.0.2 has no HTTP
    # exec route and the Go router cannot proxy gRPC). The Hermes gateway is
    # the only pod that mounts the router token and owns claims, so only its
    # namespace is admitted, and only on the ProcessService port: only the
    # gateway may exec into a sandbox.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
