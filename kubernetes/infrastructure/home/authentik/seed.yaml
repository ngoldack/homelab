apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  # .yaml suffix is mandatory: the chart only
  # discovers keys ending in .yaml.
  00-homelab.yaml: |
    version: 1
    metadata:
      name: homelab-edge-ingress
    entries:
      # ---------- headlamp behind the edge outpost ----------
      - model: authentik_core.application
        state: present
        identifiers:
          slug: headlamp
        attrs:
          name: headlamp
          meta_name: Headlamp (edge)
          meta_launch_url: https://headlamp.ngoldack.de/
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: headlamp-proxy
        attrs:
          mode: proxy
          internal_host: http://headlamp-headlamp.headlamp.svc.cluster.local/
          external_host: https://headlamp.ngoldack.de/
          cookie_domain: ngoldack.de
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      - model: authentik_outposts.outpost
        state: present
        identifiers:
          name: edge-outpost
        attrs:
          type: proxy
          managed: null
          providers:
            - !Find [authentik_providers_proxy.proxyprovider, [name, headlamp-proxy]]
      # ---------- grafana via OIDC (app federates, no outpost) ----------
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: grafana-oidc
        attrs:
          client_id: grafana
          client_type: confidential
          client_secret: !File /secrets/client_secret
          redirect_uris:
            - https://grafana.ngoldack.de/login/generic_oauth
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [name, scope|openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, scope|profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, scope|email]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, scope|groups]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: grafana
        attrs:
          name: grafana
          meta_name: Grafana
          meta_launch_url: https://grafana.ngoldack.de/
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, grafana-oidc]]
