# Operational, in-cluster buckets. External name defaults to metadata.name; set
# bucketName explicitly so the S3 bucket is stable regardless of CR renames.
apiVersion: minio.crossplane.io/v1
kind: Bucket
metadata:
  name: vllm-models
spec:
  forProvider:
    bucketName: vllm-models
    region: us-east-1
  providerConfigRef:
    name: minio-provider
---
apiVersion: minio.crossplane.io/v1
kind: Bucket
metadata:
  name: authentik-media
spec:
  forProvider:
    bucketName: authentik-media
    region: us-east-1
  providerConfigRef:
    name: minio-provider
