# Health/eviction policies for the agent chains (agent-chains.yaml).
#
# DELIBERATELY MINIMAL. All of the 429-flavour reasoning that used to live here
# — which 429 means "fail over" and which is the transient concurrency case —
# now lives in the proxy that fronts every Synthetic provider
# (image-builds/synthetic-proxy). That proxy reads Synthetic's answer, decides,
# remembers the decision per API key, and reports the Synthetic leg as plain
# UNHEALTHY (503) when it must not be used again. The body/header sniffing, and
# the response-body buffering it required, are gone from this file.
#
# So the contract is one line: the proxy said the leg is unhealthy -> evict the
# provider. The chains in agent-chains.yaml each have ONE group now (the
# OpenRouter fallback was removed 2026-09-22), so eviction no longer moves the
# request to another provider; it just stops the gateway hammering this one
# while the proxy holds its key off. The request that triggered it surfaces as
# that 503. Anything that is not a 5xx is left alone — including Synthetic's
# transient parallel-limit 429, which the proxy deliberately passes through
# untouched.
#
# duration: 5m — deliberately matched to the proxy's HOLD_OFF_FAILOVER, so both
# lapse together and the next request re-probes Synthetic. The proxy holds a bad
# key off for its own window and answers 503 locally WITHOUT touching Synthetic, so
# this eviction only has to stop the gateway hammering in the meantime. Traffic
# returns to Synthetic within minutes of the proxy's hold-off lapsing instead of
# waiting out a stale hour, and only one probe per eviction window reaches
# Synthetic because the proxy short-circuits the rest.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: general-purpose-health
  namespace: agentgateway
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: general-purpose-chain
  backend:
    health:
      unhealthyCondition: >-
        response.code >= 500
      eviction:
        duration: 5m
        consecutiveFailures: 1
