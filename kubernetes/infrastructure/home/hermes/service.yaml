# hermes — ClusterIP service for the private OpenAI-compatible API server
# (port 8642, bearer API_SERVER_KEY). No public route in v1.
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: hermes
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hermes
  ports:
    - name: api
      port: 8642
      targetPort: 8642
      protocol: TCP
    # Hermes Desktop remote backend (dashboard); reachable via operator
    # port-forward only — no public route in v1.
    - name: dashboard
      port: 9119
      targetPort: 9119
      protocol: TCP
