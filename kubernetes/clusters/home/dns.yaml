# Technitium DNS Server — the LAN split-horizon resolver replacing UniFi's
# internal DNS. dependsOn network (LB-IPAM pool + L2 announcement policy) and
# infra-controllers (the truenas StorageClass its PVC binds to).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dns
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/infrastructure/home/technitium
  prune: true
  wait: true
  timeout: 15m
  retryInterval: 2m
  dependsOn:
    - name: network
    - name: infra-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
