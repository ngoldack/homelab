# SeaweedFS operator (github.com/seaweedfs/seaweedfs-operator) — provides the
# Seaweed CR (S3-compatible object store) for Langfuse's blob storage. Applies
# before the langfuse app so its Seaweed/S3 backend can reference the store.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seaweedfs-operator
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/infrastructure/home/seaweedfs-operator
  prune: true
  wait: true
  timeout: 5m
  retryInterval: 2m
  dependsOn:
    - name: cert-manager
    - name: cluster-vars
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars