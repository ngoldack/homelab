# valkey-operator + its CRDs. Its own Kustomization for the CRD-before-CR
# reason that governs cnpg-operator/ and monitoring-crds/ alike: authentik's
# ValkeyCluster CR cannot apply before valkey.io/v1alpha1 exists, and an
# unappliable Kustomization also cannot prune.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: valkey-operator
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/infrastructure/home/valkey-operator
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: infra-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
