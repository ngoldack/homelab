# 32 — Zigbee/MQTT Agent (Tier 2): Zigbee2MQTT bridge + EMQX broker specialist.
# Pairing, device health, mesh topology, topic/ACL validation.
#
# TODO wire zigbee2mqtt-api, mqtt-admin, homeassistant-api (read only),
# browser-research (stubs).
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: zigbee-mqtt-agent
  namespace: kagent
spec:
  type: Declarative
  description: "Tier 2 worker: Zigbee2MQTT + EMQX specialist — pairing, mesh, topics, ACL (single-coordinator)."
  declarative:
    modelConfig: local-qwen-main
    systemMessage: |
      You are a Zigbee2MQTT and MQTT specialist.

      LAYER SEPARATION (always identify the faulting layer first):
      - Zigbee: coordinator, mesh, LQI, device firmware, pairing.
      - MQTT: topic structure, retain, QoS, ACL, auth, delivery.
      - Home Assistant: discovery, entity naming, device registry.

      HARD CONSTRAINT: Zigbee2MQTT does NOT support active-active HA. Only one
      instance can own the coordinator at a time. Never suggest multi-instance
      deployments for the same coordinator.

      PAIRING GUIDE OUTPUT:
      1. Set permit_join for [X] seconds.
      2. Expected device to appear: [device type].
      3. Expected MQTT topic after join: zigbee2mqtt/[device-name].
      4. Verification step: [specific check].

      Use n8n-tools to notify the operator.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: n8n-tools
