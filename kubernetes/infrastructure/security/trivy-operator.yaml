apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: security-system
  chart:
    spec:
      chart: trivy-operator
      version: "0.22.x"
      sourceRef:
        kind: HelmRepository
        name: aqua
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    trivy:
      # Use lightweight standalone mode, rather than client-server
      mode: Standalone
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

    operator:
      # Exclude noisy system namespaces to keep CPU/memory cycles down
      targetNamespaces: "" # scan all namespaces except excluded
      excludeNamespaces: "kube-system,flux-system,monitoring"
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 256Mi
