apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: kserve-vllm-whisper
  namespace: vllm
spec:
  supportedModelFormats:
    - name: whisper
      version: "1"
      autoSelect: true
  containers:
    - name: kserve-container
      image: vllm/vllm-openai-cpu:v0.22.1-x86_64
      command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
      args:
        - "--model"
        - "$(storageUri)"
        - "--port"
        - "8080"
        # Whisper is an encoder-decoder STT model exposed via /v1/audio/transcriptions.
        - "--task"
        - "transcription"
        # Emit request traces over OTLP gRPC to the otel-gateway (-> Tempo).
        - "--otlp-traces-endpoint"
        - "http://otel-gateway.monitoring.svc.cluster.local:4317"
      securityContext:
        capabilities:
          add: ["SYS_NICE"]
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      ports:
        - containerPort: 8080
          protocol: TCP
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
