# The media stack, all on one app-template release (releaseName `media`, hence
# Services `media-jellyfin`, `media-sonarr`, ... and the HTTPRoute backends).
#
# Two pods families live here:
#
#   playback   jellyfin (+ jellyseerr for requests) — LAN-resident media
#              servers, no VLAN attachment, reached on the LAN VIP.
#   automation sabnzbd, prowlarr, sonarr, radarr, bazarr — the download chain.
#              Every one of these carries a macvlan interface on VLAN 2080
#              (UniFi "Obfuscated", auto-VPN-routed) so indexer queries and
#              usenet traffic leave through the VPN, and a vlan-routes init
#              container that moves the pod's default route onto it while
#              keeping cluster traffic on eth0. See ../media/nad-vlan-2080.yaml
#              and vlan-routes-configmap.yaml.
#
# Everything shares /data (the media-library PVC): downloads land in
# /data/usenet/complete and Sonarr/Radarr import into /data/media/{tv,movies}
# by hardlink — which is only possible on ONE filesystem, the reason the
# downloads directory is not a separate volume.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: media
  namespace: flux-system
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: app-template
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: media
      interval: 1h
  targetNamespace: media
  releaseName: media
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Everything reads/writes TrueNAS NFS, which only the LAN workers can
    # reach; jellyfin additionally pulls onto the iGPU node via its own
    # nodeSelector below (overriding this default).
    defaultPodOptions:
      nodeSelector:
        topology.homelab/site: home
    controllers:
      jellyfin:
        type: deployment
        pod:
          # Pull onto the single node with the passthrough iGPU (QuickSync):
          # Jellyfin transcodes with it via /dev/dri (mount below).
          nodeSelector:
            workload/media: "true"
        containers:
          main:
            image:
              repository: jellyfin/jellyfin
              tag: "12.1"
            env:
              TZ: Europe/Berlin
              # Advertised to clients so apps auto-discover the right URL
              # instead of the cluster-internal address. {app}.{namespace}.svc
              # is the repo's canonical service URL scheme (see
              # network/certificate.yaml, *.svc.${CLUSTER_DOMAIN}).
              JELLYFIN_PublishedServerUrl: https://jellyfin.media.svc.${CLUSTER_DOMAIN}
            ports:
              - name: http
                containerPort: 8096
            # Intel QuickSync: the node's iGPU is passed through to
            # wk-main-efficiency (hostpci intel-igpu, i915 extension in the
            # image) and shows up as /dev/dri — mounted below via hostPath,
            # no privileged mode needed (the image runs as root).
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 4Gi
            # Generous: first boot initializes the library DB and the first
            # transcode can take a while (mirrors immich/paperless posture).
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
      jellyseerr:
        type: deployment
        containers:
          main:
            image:
              repository: fallenbagel/jellyseerr
              tag: "2.7.3"
            env:
              TZ: Europe/Berlin
            ports:
              - name: http
                containerPort: 5055
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
      sabnzbd:
        type: deployment
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: '[{"name":"vlan-2080","ips":["10.20.80.205/24"]}]'
        initContainers:
          vlan-routes:
            image:
              repository: ghcr.io/nicolaka/netshoot
              tag: v0.16
            command: ["sh", "/scripts/attach.sh"]
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
        containers:
          main:
            image:
              repository: linuxserver/sabnzbd
              tag: "5.1.3"
            env:
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
              TZ: Europe/Berlin
            ports:
              - name: http
                containerPort: 8080
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
      sonarr:
        type: deployment
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: '[{"name":"vlan-2080","ips":["10.20.80.201/24"]}]'
        initContainers:
          vlan-routes:
            image:
              repository: ghcr.io/nicolaka/netshoot
              tag: v0.16
            command: ["sh", "/scripts/attach.sh"]
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
        containers:
          main:
            image:
              repository: linuxserver/sonarr
              tag: "4.0.19"
            env:
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
              TZ: Europe/Berlin
            ports:
              - name: http
                containerPort: 8989
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
      radarr:
        type: deployment
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: '[{"name":"vlan-2080","ips":["10.20.80.202/24"]}]'
        initContainers:
          vlan-routes:
            image:
              repository: ghcr.io/nicolaka/netshoot
              tag: v0.16
            command: ["sh", "/scripts/attach.sh"]
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
        containers:
          main:
            image:
              repository: linuxserver/radarr
              tag: "6.3.0"
            env:
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
              TZ: Europe/Berlin
            ports:
              - name: http
                containerPort: 7878
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
      prowlarr:
        type: deployment
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: '[{"name":"vlan-2080","ips":["10.20.80.203/24"]}]'
        initContainers:
          vlan-routes:
            image:
              repository: ghcr.io/nicolaka/netshoot
              tag: v0.16
            command: ["sh", "/scripts/attach.sh"]
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
        containers:
          main:
            image:
              repository: linuxserver/prowlarr
              tag: "2.5.2"
            env:
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
              TZ: Europe/Berlin
            ports:
              - name: http
                containerPort: 9696
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
      bazarr:
        type: deployment
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: '[{"name":"vlan-2080","ips":["10.20.80.204/24"]}]'
        initContainers:
          vlan-routes:
            image:
              repository: ghcr.io/nicolaka/netshoot
              tag: v0.16
            command: ["sh", "/scripts/attach.sh"]
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
        containers:
          main:
            image:
              repository: linuxserver/bazarr
              tag: "1.6.1"
            env:
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
              TZ: Europe/Berlin
            ports:
              - name: http
                containerPort: 6767
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
    service:
      jellyfin:
        controller: jellyfin
        ports:
          http:
            port: 8096
      jellyseerr:
        controller: jellyseerr
        ports:
          http:
            port: 5055
      sabnzbd:
        controller: sabnzbd
        ports:
          http:
            port: 8080
      sonarr:
        controller: sonarr
        ports:
          http:
            port: 8989
      radarr:
        controller: radarr
        ports:
          http:
            port: 7878
      prowlarr:
        controller: prowlarr
        ports:
          http:
            port: 9696
      bazarr:
        controller: bazarr
        ports:
          http:
            port: 6767
    persistence:
      # The route-script ConfigMap, mounted into every VLAN pod's init
      # container (not the app container — nothing else needs it).
      vlan-routes:
        type: configMap
        name: vlan-routes
        advancedMounts:
          sabnzbd:
            vlan-routes:
              - path: /scripts
          sonarr:
            vlan-routes:
              - path: /scripts
          radarr:
            vlan-routes:
              - path: /scripts
          prowlarr:
            vlan-routes:
              - path: /scripts
          bazarr:
            vlan-routes:
              - path: /scripts
      library:
        type: persistentVolumeClaim
        existingClaim: media-library
        advancedMounts:
          sabnzbd:
            main:
              - path: /data
          sonarr:
            main:
              - path: /data
          radarr:
            main:
              - path: /data
          bazarr:
            main:
              - path: /data
          jellyfin:
            main:
              # Read-only: Jellyfin plays the library, it never writes to it.
              - path: /media
                readOnly: true
      jellyfin-config:
        type: persistentVolumeClaim
        existingClaim: jellyfin-config
        advancedMounts:
          jellyfin:
            main:
              - path: /config
      # Jellyfin's transcode scratch: deliberately NOT on NFS (transcodes are
      # throwaway, high-churn and would hammer the NAS).
      jellyfin-cache:
        type: emptyDir
        sizeLimit: 20Gi
        advancedMounts:
          jellyfin:
            main:
              - path: /cache
      # QuickSync device: the node's passthrough iGPU. Exposes card0 +
      # renderD128; Jellyfin picks VAAPI/QSV up from the container's
      # transcoding menu (no privileged mode, the image runs as root).
      dri:
        type: hostPath
        hostPath: /dev/dri
        hostPathType: Directory
        advancedMounts:
          jellyfin:
            main:
              - path: /dev/dri
      jellyseerr-config:
        type: persistentVolumeClaim
        existingClaim: jellyseerr-config
        advancedMounts:
          jellyseerr:
            main:
              - path: /config
      sabnzbd-config:
        type: persistentVolumeClaim
        existingClaim: sabnzbd-config
        advancedMounts:
          sabnzbd:
            main:
              - path: /config
      sonarr-config:
        type: persistentVolumeClaim
        existingClaim: sonarr-config
        advancedMounts:
          sonarr:
            main:
              - path: /config
      radarr-config:
        type: persistentVolumeClaim
        existingClaim: radarr-config
        advancedMounts:
          radarr:
            main:
              - path: /config
      prowlarr-config:
        type: persistentVolumeClaim
        existingClaim: prowlarr-config
        advancedMounts:
          prowlarr:
            main:
              - path: /config
      bazarr-config:
        type: persistentVolumeClaim
        existingClaim: bazarr-config
        advancedMounts:
          bazarr:
            main:
              - path: /config
