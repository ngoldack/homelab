# faster-whisper large-v3-turbo served by vLLM (CPU backend) as a plain
# Deployment, exposing /v1/audio/transcriptions for STT (Home Assistant voice,
# n8n voice triggers). Always-warm, small footprint, reached directly over its Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
  namespace: vllm
  labels:
    app.kubernetes.io/name: whisper
    app.kubernetes.io/part-of: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: whisper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whisper
        app.kubernetes.io/part-of: vllm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        ai: "true"
      tolerations:
        - key: "ai"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      initContainers:
        - name: fetch-model
          image: amazon/aws-cli:2.34.63
          command:
            - /bin/sh
            - -c
            - >-
              aws --endpoint-url "$AWS_ENDPOINT_URL"
              s3 sync "s3://vllm-models/whisper-large-v3-turbo" /models/whisper
          env:
            - name: AWS_ENDPOINT_URL
              value: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: vllm-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: vllm
          image: vllm/vllm-openai-cpu:v0.23.0-x86_64
          command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - "--model"
            - "/models/whisper"
            - "--served-model-name"
            - "whisper"
            - "--port"
            - "8080"
            # Whisper is an encoder-decoder STT model exposed via
            # /v1/audio/transcriptions.
            - "--task"
            - "transcription"
            - "--device=cpu"
            - "--dtype=bfloat16"
            - "--otlp-traces-endpoint"
            - "http://otel-gateway.monitoring.svc.cluster.local:4317"
          env:
            # Pin Whisper to the top cores, isolated from the chat/coding models.
            - name: VLLM_CPU_OMP_THREADS_BIND
              value: "22-23"
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "2"
          securityContext:
            capabilities:
              add: ["SYS_NICE"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: "2"
              memory: "3Gi"
            limits:
              cpu: "4"
              memory: "6Gi"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: models
          emptyDir:
            sizeLimit: 10Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: whisper
  namespace: vllm
  labels:
    app.kubernetes.io/name: whisper
    app.kubernetes.io/part-of: vllm
spec:
  selector:
    app.kubernetes.io/name: whisper
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
