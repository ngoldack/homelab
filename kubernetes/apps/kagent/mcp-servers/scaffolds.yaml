  namespace: kagent
spec:
  description: "STUB: Home Assistant API (read states, write automations). Build/deploy hass-mcp + SOPS token."
  protocol: STREAMABLE_HTTP
  url: "http://homeassistant-mcp.homeassistant.svc.cluster.local:8080/mcp"
  timeout: 30s
  terminateOnClose: true
