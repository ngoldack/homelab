# hermes-go — the Go profile SandboxTemplate: the pod shape every sandbox in
# hermes-sandbox is built from, and the one the warm pool adopts today.
#
# WHY: every sandbox must be a Kata-isolated, credential-less, non-root pod
# label-pinned to the shared Kata-capable worker; the ValidatingAdmissionPolicy
# (agent-sandbox/policies/secure-hermes-sandbox) enforces exactly this shape,
# so the template defines the one shape that passes. Every field is grounded
# in `kubectl explain sandboxtemplate.spec --recursive` of the installed
# v1beta1 CRD.
#
# ONE OF A FIXED PROFILE SET: hermes-go (here) + hermes-core and hermes-offline
# (sandbox-templates-profiles.yaml). No profile exists for Python: the runtime
# image below ships no Python interpreter. A profile is identified by the
# workload.hermes.io/profile label, carried on the template, on every pod the
# template stamps and (set by Hermes) on the claim; that label is the key the
# per-profile Cilium network classes (cilium-policy.yaml) and the Kyverno
# allowlist (kyverno-policies/policies.yaml, hermes-sandbox-profile-allowlist)
# select on. Hermes chooses a profile by NAME only — it never supplies image,
# runtimeClassName, namespace, serviceAccount, mounts or network policy.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: hermes-go
  namespace: hermes-sandbox
  # Profile identity on the template object itself (see sandbox-templates-profiles.yaml).
  labels:
    workload.hermes.io/profile: go
spec:
  # Cilium owns every sandbox packet (cilium-policy.yaml); the controller
  # must not overlay its own network-policy bookkeeping on top.
  networkPolicyManagement: Unmanaged
  # No environment injection: sandboxd only surfaces SANDBOX_*-prefixed vars
  # over its metadata endpoint, so the template must not seed anything extra.
  envVarsInjectionPolicy: Disallowed
  # No volume claims: sandboxes get exactly the two emptyDirs below — nothing
  # that could carry host or cluster state into a session.
  volumeClaimTemplatesPolicy: Disallowed
  podTemplate:
    metadata:
      # The profile identity the pod carries: this is what the per-profile
      # Cilium egress classes select on (cilium-policy.yaml), so it must be on
      # the POD, not only on this template object.
      labels:
        workload.hermes.io/profile: go
    spec:
      # Kata is the only runtime (RuntimeClass `kata`); a runc fallback would
      # silently drop the isolation boundary, so the admission policy rejects
      # any other runtimeClassName.
      runtimeClassName: kata
      # Sandboxes hold no cluster credentials — nothing to mount, ever.
      automountServiceAccountToken: false
      # Label-pin to the (mixed-use) sandbox node. The label only attracts;
      # there is no taint, so other workloads still schedule there too.
      nodeSelector:
        workload.hermes.io/sandbox: "true"
      # Non-root 10001 end to end (image user, pod and container security
      # contexts) so nothing in a session can escalate via a UID mismatch.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          # Digest-pinned zot ref — manifest digest of hermes-sandbox-runtime:1.0.3
          # (build-hermes-sandbox-runtime-2be5991); re-pin by bumping that Job.
          image: registry.ngoldack.de/hermes-sandbox-runtime@sha256:8317b00f8aa3801b9dc5746f18178a0f4ec3df1e1b51a24e8468b1a3352117f1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # sandboxd listeners: 8080 REST FilesystemService, 9090 gRPC
          # ProcessService (TCP only).
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "5Gi"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      # The only writable paths (matching the image layout): task state in
      # /workspace, scratch in /tmp — emptyDirs, gone with the pod.
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: "20Gi"
        - name: tmp
          emptyDir:
            sizeLimit: "2Gi"
