# gVisor (runsc) RuntimeClass. The Talos `ghcr.io/siderolabs/gvisor` system
# extension on the worker pools (tofu/variables.tf) installs runsc + the
# containerd-shim-runsc-v1 and registers the `runsc` containerd runtime handler.
# This RuntimeClass exposes that handler to Kubernetes, so a workload can opt into
# gVisor syscall sandboxing with `spec.runtimeClassName: gvisor`.
#
# All schedulable nodes (both worker pools) carry the extension and the control
# plane is tainted NoSchedule, so no scheduling.nodeSelector is required. If a
# non-gVisor worker pool is ever added, add a node label + scheduling block here.
#
# NOTE: kagent Agent Substrate ships its OWN runsc inside privileged worker pods
# and does NOT consume this RuntimeClass. This is for plain pods that process
# untrusted input (e.g. document parsing) and want host-level sandboxing.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
