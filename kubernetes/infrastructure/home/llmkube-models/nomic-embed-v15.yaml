# nomic-embed-text-v1.5 (f16) on the Tesla P100 — the fleet's embedding endpoint.
#
# 768-dim mean-pooled vectors, 8192-token trained maximum, served over
# llama.cpp's OpenAI-compatible POST /v1/embeddings on port 8080. This service
# shares the single P100 with the qwen36-35b chat model: the device plugin's
# time-slicing advertises nvidia.com/gpu: 2 so both pods can open the whole
# device, which means VRAM is budgeted here by hand (see nvidia/helmrelease.yaml).
#
# `--pooling mean` in extraArgs is LOAD-BEARING, not decoration: llmkube's
# embedding mode injects `--pooling last` for embedding Models, and flags passed
# through extraArgs win over the operator's own (verified in llmkube v0.9.25
# internal/controller/runtime_llamacpp_args.go). Omit it and every similarity
# score silently degrades to last-token pooling.
#
# llmkube stages the GGUF into the shared model cache PVC mounted at /models, so
# llama-server is handed /models/<cacheKey>/nomic-embed-text-v1.5.f16.gguf — the
# source URL below is a prefetch input, never a runtime fetch (hence prefetch).
#
# Embedding mode also auto-appends `--cache-ram 0`. llama.cpp's host-side prompt
# cache exists for completion (it keeps the prompt prefix for the next token),
# which is meaningless for a one-shot embedding request and would only pin RAM.
#
# contextSize 8192 is the architecture's trained maximum and the largest VRAM
# consumer after the weights: qwen36-35b already holds ~15 GiB of the P100's
# 16 GiB, so the ~137M f16 parameters (~0.27 GiB) plus the 8192-token KV must
# fit the ~1.3 GiB that remains. layers: -1 keeps the model fully GPU-resident.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: nomic-embed-v15
  namespace: llmkube-system
spec:
  source: https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.f16.gguf
  format: gguf
  quantization: F16
  prefetch: true
  prefetchTolerations:
    - key: dedicated
      operator: Equal
      value: nvidia
      effect: NoSchedule
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      count: 1
      vendor: nvidia
      memory: "16Gi"
      layers: -1
  resources:
    cpu: "4"
    memory: "4Gi"
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: nomic-embed-v15
  namespace: llmkube-system
spec:
  modelRef: nomic-embed-v15
  replicas: 1
  # Same P100-patched mainline image as the chat service; the embedding endpoint
  # is a llama.cpp server flag, not a different engine.
  image: registry.ngoldack.de/llama-p100:0.4.0-p100
  # REQUIRED: without the nvidia RuntimeClass the pod schedules onto the GPU node
  # but never gets /dev/nvidia* bind-mounted and runs CPU-only.
  runtimeClassName: nvidia
  nodeSelector:
    hardware/gpu.model: Tesla-P100
  tolerations:
    - key: dedicated
      operator: Equal
      value: nvidia
      effect: NoSchedule
  mode: embedding
  # The model's trained maximum; going higher would silently truncate inputs
  # while still costing KV cache.
  contextSize: 8192
  # Single slot: embeddings are one-shot, and llama.cpp otherwise splits the
  # context across slots, shrinking what a single request may carry.
  parallelSlots: 1
  extraArgs:
    - --pooling
    - mean
  endpoint:
    port: 8080
    type: ClusterIP
  resources:
    gpu: 1
    gpuMemory: "16Gi"
    cpu: "2"
    memory: "4Gi"
