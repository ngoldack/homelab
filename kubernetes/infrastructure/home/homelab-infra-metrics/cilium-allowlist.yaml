# unpoller allowlist — namespace-scoped zero-trust policy: the namespace is one
# trust domain, everything crossing the boundary is denied unless named here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unpoller-allowlist
  namespace: unpoller
spec:
  endpointSelector:
    matchLabels: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: unpoller
    - fromEntities:
        - ingress
        - health
    # vmagent scrapes unpoller's :9130 exporter.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: unpoller
    # The UniFi controller API on the LAN.
    - toEntities:
        - world
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
