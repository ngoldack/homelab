# hermes Cilium policies — default-deny in + out; the gateway's ONLY egress
# is cluster DNS, the sandbox Router (files, agent-sandbox-system), the
# adopted sandbox pods (gRPC exec, hermes-sandbox:9090) and the model API.
# No ingress is needed in v1: the API server is reached via kubectl exec /
# in-pod loops and nothing in-cluster calls the gateway.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-default-deny
  namespace: hermes
spec:
  description: >-
    Deny-all baseline for the gateway pod. The allow doc below carves out
    exactly the egress Hermes needs; nothing is permitted inbound.
  endpointSelector:
    matchLabels: {}
  ingress:
    - {}
  egress:
    - {}
---
# hermes egress allowlist — DNS, Router (files), sandbox pods (gRPC exec),
# and the model API only. Deliberately NOT the Kubernetes API, Talos, Proxmox
# or any management plane: the gateway cannot create pods, exec, port-forward
# or read secrets even if network access were granted.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-egress-allowlist
  namespace: hermes
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Router REST for file transfer (v2 scoped tokens).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agent-sandbox-system
            app.kubernetes.io/name: sandbox-router
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Direct gRPC exec into adopted sandboxes (user-approved fallback).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes-sandbox
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Kubernetes API for SandboxClaim lifecycle ONLY (approved claim-RBAC:
    # the in-cluster SDK creates/reads/deletes claims; no other k8s verbs).
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # kube-apiserver is served on the k8s Service CIDR; entity resolution may
    # race, so allow the service subnet explicitly (same pattern as the
    # router's own allowlist).
    - toCIDRSet:
        - cidr: 172.21.0.0/16
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # Model API. toFQDNs is INERT in this cluster: cilium's DNS proxy runs
    # without transparent mode (tofu/home/cilium.tf — split-horizon DNS LB
    # conflict), so FQDN rules never learn IPs (empty `cilium fqdn cache`).
    # CIDR it instead: OpenRouter is served from Cloudflare anycast ranges.
    # OPS: revisit via the internal AI gateway (aigateway) when Hermes
    # supports an OpenAI-compatible base_url; the sandbox stack's github /
    # proxy.golang.org toFQDNs rules have the same latent inertness.
    - toCIDRSet:
        - cidr: 104.18.0.0/15
        - cidr: 172.64.0.0/13
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # PyPI for Hermes lazy-dep installs (faster-whisper, edge-tts, …).
    - toCIDRSet:
        - cidr: 151.101.0.0/16  # Fastly anycast (pypi.org simple index)
        - cidr: 146.75.0.0/16   # Fastly anycast (files.pythonhosted.org)
        - cidr: 199.232.0.0/16  # Fastly anycast (additional edge ranges)
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Model catalog + app update fetches (advisory; keeps the dashboard's
    # model list and update banner working). GitHub raw content ranges.
    - toCIDRSet:
        - cidr: 185.199.108.0/22
        - cidr: 185.199.109.0/22
        - cidr: 185.199.110.0/22
        - cidr: 185.199.111.0/22
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
