# Envoy Gateway control plane (data-plane of Envoy AI Gateway). Chart
# gateway-helm v1.8.1 (oci://docker.io/envoyproxy/gateway-helm) per the
# agent-router v1.1.0 compatibility matrix. Installed in its own namespace
# (envoy-gateway-system) exactly as the agent-router prerequisites doc shows,
# with the AI-Gateway-specific values baked inline:
#   - config.envoyGateway.extensionManager.hooks (xdsTranslator) so the
#     ai-gateway-controller can fine-tune the xDS Envoy programs.
#   - extensionManager.service.fqdn -> ai-gateway-controller.<aigateway>.
#     IMPORTANT: this is COLLECTED from the ai-gateway-helm release; the
#     ai-gateway-controller Service name is hardcoded by that chart
#     (fullnameOverride: ai-gateway-controller).
#
# This release renders GatewayClass-agnostic resources only (ServiceAccount
# "envoy-gateway", Deployment "envoy-gateway", etc.). The actual GatewayClass
# + Gateway + EnvoyProxy CRs live in gateway.yaml / envoyproxy.yaml so the
# data-plane LB Service gets a LAN VIP.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: gateway-helm
      version: "v1.8.1"
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
      interval: 1h
  targetNamespace: envoy-gateway-system
  releaseName: envoy-gateway
  install:
    createNamespace: true
    # The standard + Envoy CRDs come from the separate gateway-crds-helm
    # release (crds-helmrelease.yaml in this lane) plus tofu's gateway-api-crds.
    # This chart's bundled crds/ (gateway-api bundle v1.5.1) would otherwise
    # collide with tofu's v1.6.1 copies (tcproutes storedVersions rejection).
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  values:
    createNamespace: true
    config:
      envoyGateway:
        gateway:
          controllerName: gateway.envoyproxy.io/gatewayclass-controller
        logging:
          level:
            default: info
        provider:
          type: Kubernetes
        extensionApis:
          # Backend API for AI service backends (gateway.envoyproxy.io/v1alpha1
          # Kind: Backend) — required by the AIServiceBackend CR.
          enableBackend: true
        # AI Gateway needs to fine-tune xDS resources generated by Envoy
        # Gateway (from the agent-router envoy-gateway-values.yaml manifest).
        extensionManager:
          hooks:
            xdsTranslator:
              translation:
                listener:
                  includeAll: true
                route:
                  includeAll: true
                cluster:
                  includeAll: true
                secret:
                  includeAll: true
              post:
                - Translation
                - Cluster
                - Route
          service:
            fqdn:
              hostname: ai-gateway-controller.aigateway.svc.cluster.local
              port: 1063
    deployment:
      pod:
        nodeSelector:
          topology.homelab/site: home
    service:
      type: ClusterIP
    # The Envoy data-plane pods are NOT pinned here — that is done on the
    # EnvoyProxy CR (envoyproxy.yaml), which is where EnvoyGateway applies
    # data-plane pod scheduling.
