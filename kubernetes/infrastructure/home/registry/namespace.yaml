# Zot — the cluster's own OCI registry.
#
# No PodSecurity exemption here, deliberately. Zot is an ordinary unprivileged
# HTTP server: no host mounts, no namespaces to nest, nothing baseline
# forbids. It inherits Talos's cluster-wide "baseline" default and that is
# correct — unlike ../buildkit/, which genuinely needs the exemption and says
# why. If this namespace ever starts needing one, that is a signal something
# is wrong, not a step to take.
apiVersion: v1
kind: Namespace
metadata:
  name: registry
  labels:
    # Pod Security Admission: audit+warn at `restricted`, enforcement left to
    # Talos' cluster default (`baseline`). What actually surfaces drift here is
    # the `warn` level (kubectl warnings) and Kyverno's PolicyReports — NOT the
    # `audit` level: this cluster runs no API audit policy (Talos leaves audit
    # logging off and nothing in tofu/ configures it), so `audit:` records
    # nothing today. Reported-only on purpose besides: a live check on
    # 2026-09-17 found almost every workload violating `restricted`
    # (runAsNonRoot, seccompProfile, capabilities.drop, allowPrivilegeEscalation)
    # and Kyverno's four policies do not cover those fields, so
    # `enforce: restricted` needs those securityContexts added workload by
    # workload first.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # Lets registry.${CLUSTER_DOMAIN}'s HTTPRoute attach to the public Gateway
    # in ../network/. The Gateway's allowedRoutes selector requires this exact
    # label; without it the route is silently rejected with NotAllowedByListeners
    # rather than failing to apply.
    gateway.ngoldack.de/public-ingress: "true"
