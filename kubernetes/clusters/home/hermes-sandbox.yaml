# hermes-sandbox — the Kata sandbox namespace + RuntimeClass + runtime
# template/warm pool. wait:true: hermes (the gateway) applies only after the
# warm pool reports a ready sandbox; a half-provisioned template must never
# feed the gateway.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes-sandbox
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/infrastructure/home/hermes-sandbox
  prune: true
  wait: true
  timeout: 20m
  retryInterval: 2m
  dependsOn:
    - name: agent-sandbox
    - name: network
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars