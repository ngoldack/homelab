apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cluster-vars.yaml
  # cert-manager before network: network's ClusterIssuer/Certificate need
  # cert-manager's CRDs Established first, expressed as a dependsOn edge in
  # network.yaml. There is deliberately no gateway-api-crds Kustomization —
  # tofu owns those CRDs (see tofu/home/gateway-api-crds.tf), because
  # cilium-operator checks for them once at startup and Flux cannot run before
  # the CNI.
  - cert-manager.yaml
  - infrastructure.yaml
  - network.yaml
  # Split in two so the CRD-before-CR edge is explicit: monitoring.yaml
  # dependsOn monitoring-crds, which dependsOn infra-controllers.
  - monitoring-crds.yaml
  - monitoring.yaml
  # metrics-server: the Kubernetes Metrics API (metrics.k8s.io) provider that
  # Headlamp's native per-pod usage column reads. Depends on infra-controllers
  # for the shared HelmRepository (sources.yaml).
  - metrics-server.yaml
  # Immich and its database operator.
  - cnpg-operator.yaml
  - immich.yaml
  # The cluster's own OCI registry, the in-cluster image builder, and the
  # one-shot Jobs that drive it. Three Kustomizations rather than one so a
  # long-running or failed build cannot hold up the builder or the registry,
  # and so image-builds can wait on both being ready.
  - registry.yaml
  - buildkit.yaml
  - image-builds.yaml
  # Identity provider + edge authorizer. valkey-operator before authentik
  # (CRD-before-CR); authentik additionally dependsOn network for the edge
  # Gateway its routes attach to.
  - valkey-operator.yaml
  - authentik.yaml
  # Self-hosted Matrix homeserver (ESS: Synapse + MAS + Element Web) + its
  # CNPG store. Depends on authentik (the MAS upstream OIDC provider), the
  # cnpg operator, network (the HTTPRoutes' Gateway) and cert-manager.
  - matrix.yaml
  # Hindsight agent memory: local LLM + CNPG/pgvector, LAN-only surface.
  - hindsight.yaml
  # LLM AI gateway (agentgateway.dev control plane). CRD-before-CR split.
  - agentgateway-crds.yaml
  - agentgateway.yaml
  # VPN egress pool: five ProtonVPN WireGuard tunnels behind one ClusterIP
  # Service that load-balances across whichever tunnels report Ready. Raw
  # manifests, no CRDs, and deliberately NO dependsOn edge from the LLM lane:
  # a dead VPN must never hold up another lane's reconciliation. The consumer
  # (synthetic-proxy) is pointed at the Service by its own env instead.
  - vpn-egress.yaml
  # Paperless-ngx document management (app-template chart on CNPG + valkey +
  # TrueNAS storage); app-template entry, no monitoring-crds dependency.
  - paperless.yaml
  # Langfuse LLM platform infra process: the app HelmRelease + OIDC wiring sits
  # here (its CNPG/valkey/secrets raw infras are its own Kustomization, and it
  # depends on the clickhouse/seaweedfs operators listed above).
  - langfuse.yaml
  # LibreChat LLM chat front-end: Helm chart + bundled MongoDB/Meilisearch,
  # LLM traffic through the agentgateway static-key scope, authentik OIDC,
  # edge route chat.ngoldack.de. Depends on agentgateway/authentik/network.
  - librechat.yaml
  # Langfuse LLM platform infra: ClickHouse + SeaweedFS operators (used as the
  # OLAP/blob stores; postgres + valkey come from the existing CNPG/valkey ops).
  - clickhouse-operator.yaml
  - seaweedfs-operator.yaml
  # Agent Sandbox (controller + authenticated Router, self-contained CRDs) is
  # the base; hermes-sandbox (Kata RuntimeClass + template/warm pool) depends
  # on it; hermes (the gateway StatefulSet) depends on both.
  - agent-sandbox.yaml
  - hermes-sandbox.yaml
  - hermes.yaml
  # Multi-agent Hermes expansion (the Kanban orchestrator + dave/chad/lindner
  # Matrix agents): shares the hermes namespace, ServiceAccount and hermes
  # secret; depends on hermes + matrix + hindsight + the sandbox stack.
  - hermes-agents.yaml
  # Hermes egress guard: Envoy forward proxy + authorizer + reaper mediating
  # sandbox internet access (CRD-free raw manifests; depends on the sandbox
  # namespace it polices and the Kyverno policies enforcing quarantine).
  - hermes-egress.yaml
  # Non-k8s homelab metrics -> VictoriaMetrics (PVE/PBS/TrueNAS/UDM) + unpoller.
  - homelab-infra-metrics.yaml
  # Automated CNPG restore drills: restore the latest backup into a
  # throwaway Cluster, assert an invariant, report, delete. Inert until this
  # entry exists, and it needs the CNPG CRDs + the VictoriaMetrics import
  # endpoint, expressed as dependsOn edges in the file itself.
  - cnpg-restore-drills.yaml
  # Daily rescan of the image digests actually running in the cluster
  # (trivy per digest -> image_scan_cve metrics + the rules-image-scan alerts).
  # Reports only; the build-time gate stays in image-builds/.
  - image-scan.yaml
  # Multus secondary-CNI meta-plugin: prerequisite for the media namespace's
  # VLAN 2080 macvlan attachments (no CRD/Gateway deps of its own).
  - multus.yaml
# Media stack: Jellyfin/Seerr + the *arr download chain, with the
  # download pods' egress VPN-routed via VLAN 2080.
  - media.yaml
  # Self-hosted GitHub Actions runner for this repo: performs the post-merge
  # Flux reconcile from inside the cluster, so no laptop holds a kubeconfig or
  # types `flux reconcile` after a merge. Nothing depends on it.
  - github-runner.yaml
  # Admission policy engine (Kyverno, audit-only policies + PSA labels). No
  # app depends on it: it observes rather than gates.
  - kyverno.yaml
  # The policies are a separate Kustomization so the kyverno.io CRDs exist
  # before the ClusterPolicy objects are applied (CRD-before-CR ordering).
  - kyverno-policies.yaml
  # eBPF runtime security (observability-first). Like Kyverno it observes
  # rather than gates, so nothing depends on it.
  - tetragon.yaml
  # Tetragon's tracing policies (CRD-before-CR split, as above).
  - tetragon-policies.yaml
  # CrowdSec: local detection engine, detection-only (no bouncer — see the
  # namespace file for why the Cilium-Gateway stack has no remediation path).
  - crowdsec.yaml
  # Flux's own namespace policies (default-deny + allowlist). There is
  # deliberately NO cluster-wide floor here — a CCNP deny broke every Gateway
  # route on 2026-09-17 and was rolled back; see
  # infrastructure/home/security-baseline/kustomization.yaml for the evidence.
  - security-baseline.yaml
