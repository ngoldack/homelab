apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: monitoring
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.158.x"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    mode: daemonset
    # Single node-local agent for the whole VictoriaMetrics stack: ships pod logs
    # (filelog) -> VictoriaLogs, host/pod metrics -> VictoriaMetrics, and OTLP
    # traces -> VictoriaTraces. No separate gateway tier in the v0 MVP.
    #
    # Must run on EVERY node including tainted ones, or those nodes' logs are lost.
    tolerations:
      - operator: Exists

    # contrib distro: includes filelog, hostmetrics, k8sattributes,
    # prometheusremotewrite (the chart requires image.repository to be set).
    image:
      repository: otel/opentelemetry-collector-contrib

    # Node name for the prometheus receiver's node-filter relabel (below), so
    # each DaemonSet agent scrapes only the annotated pods on its own node.
    extraEnvs:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName

    presets:
      logsCollection:
        enabled: true
      hostMetrics:
        enabled: true
      kubernetesAttributes:
        enabled: true

    config:
      exporters:
        # Metrics -> VictoriaMetrics
        prometheusremotewrite:
          endpoint: "http://victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/write"
          tls:
            insecure: true
        # Logs -> VictoriaLogs (OTLP ingestion; otlphttp appends /v1/logs).
        otlphttp/victorialogs:
          endpoint: "http://victoria-logs-single-server.monitoring.svc.cluster.local:9428/insert/opentelemetry"
          tls:
            insecure: true
        # Traces -> VictoriaTraces (OTLP ingestion; otlphttp appends /v1/traces).
        # VERIFY-BEFORE-DEPLOY: confirm VictoriaTraces' OTLP path + port (young project).
        otlphttp/victoriatraces:
          endpoint: "http://victoria-traces.monitoring.svc.cluster.local:10428/insert/opentelemetry"
          tls:
            insecure: true

      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
        # Scrape pods annotated prometheus.io/scrape (llama.cpp /metrics via the
        # LLMKube InferenceServices, agentgateway in v1, etc.) and remote-write
        # them to VictoriaMetrics. Node-filtered so each DaemonSet agent only
        # scrapes pods on its own node — no duplicate series.
        prometheus:
          config:
            scrape_configs:
              - job_name: kubernetes-pods
                scrape_interval: 30s
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_node_name]
                    action: keep
                    regex: ${env:NODE_NAME}
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                    action: keep
                    regex: "true"
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                    action: replace
                    target_label: __metrics_path__
                    regex: (.+)
                  - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                    action: replace
                    regex: ([^:]+)(?::\d+)?;(\d+)
                    replacement: $$1:$$2
                    target_label: __address__
                  - source_labels: [__meta_kubernetes_namespace]
                    action: replace
                    target_label: namespace
                  - source_labels: [__meta_kubernetes_pod_name]
                    action: replace
                    target_label: pod

      processors:
        batch: {}
        memory_limiter:
          check_interval: 1s
          limit_percentage: 75
          spike_limit_percentage: 15

      service:
        pipelines:
          metrics:
            receivers: [otlp, hostmetrics, prometheus]
            processors: [memory_limiter, k8sattributes, batch]
            exporters: [prometheusremotewrite]
          logs:
            receivers: [otlp, filelog]
            processors: [memory_limiter, k8sattributes, batch]
            exporters: [otlphttp/victorialogs]
          traces:
            receivers: [otlp]
            processors: [memory_limiter, k8sattributes, batch]
            exporters: [otlphttp/victoriatraces]

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
