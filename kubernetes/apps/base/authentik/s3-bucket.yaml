apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik-s3
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: authentik
  dependsOn:
    - name: authentik
      namespace: flux-system
  chart:
    spec:
      chart: minio
      version: "17.x"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
  values:
    statefulset:
      replicaCount: 0
    provisioning:
      enabled: true
      endpoint: "http://truenas.home:9000"
      extraEnvVars:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: rustfs-admin-credentials
              key: root-user
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rustfs-admin-credentials
              key: root-password
      policies:
        - name: authentik-policy
          statements:
            - resources: ["arn:aws:s3:::authentik-media", "arn:aws:s3:::authentik-media/*"]
              effect: Allow
              actions: ["s3:*"]
      usersExistingSecrets:
        - authentik-s3-credentials
      buckets:
        - name: authentik-media
          versioning: Suspended
          quota:
            type: set
            size: 20GiB
