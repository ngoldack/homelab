# LAN split-horizon resolver: CoreDNS answering ngoldack.de with the internal
# VIP (10.30.0.200) for EVERY hostname, all others forwarded upstream.
#
# Why it exists: the public zone flips edge-served names (headlamp, authentik,
# grafana) to the Hetzner address. LAN clients must keep the direct,
# auth-free VIP path — this resolver is how. The UniFi gateway needs ONE
# conditional forward (DNS Policies → Forward → ngoldack.de → 10.30.0.201);
# it is a manual step or a UniFi Integration-API call (no API key in the
# secret store yet), and until it exists LAN clients take the edge path —
# working, just slower (the graceful-degradation branch of the design).
#
# Why a static zone file instead of an external-dns webhook: every
# record here is a mirror of the internal Gateway — the answer for ALL names
# under the zone is the same VIP — so it is config, not state. ConfigMap
# edits land with the same PR that adds the HTTPRoute, are reviewable, and
# remove the unbound-control TLS machinery entirely. CoreDNS's file plugin
# reloads on ConfigMap refresh with zero extra components.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-config
  namespace: internal-dns
data:
  Corefile: |
    ngoldack.de:53 {
        # TTL comes from $TTL inside the zone file; the file plugin itself
        # takes only the root path (no ttl parameter — parsing dies on it).
        file /etc/coredns/db.ngoldack.de
        errors
        log
        health :8080 {
            lameduck 5s
        }
        ready
        prometheus :9153
    }
    .:53 {
        forward . /etc/resolv.conf
        cache 30
        errors
        health :8081
        prometheus :9253
    }
  db.ngoldack.de: |
    $TTL 5
    @   IN  SOA ns.internal-dns.svc.cluster.local. hostmaster.internal-dns.svc.cluster.local. (
            2026091301 3600 600 604800 5 )
    @       IN  NS  ns.internal-dns.cel.local.

    ; keep sorted with the route PRs; the VIP is the internal Gateway's
    ; address from network/lb-ipam.yaml + gateway.yaml
    ns                  IN  A   10.30.0.200
    immich              IN  A   10.30.0.200
    grafana             IN  A   10.30.0.200
    registry            IN  A   10.30.0.200
    headlamp            IN  A   10.30.0.200
    authentik           IN  A   10.30.0.200
    *.svc               IN  A   10.30.0.200
    svc                 IN  A   10.30.0.200

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-dns
  namespace: internal-dns
  labels:
    app.kubernetes.io/name: internal-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: internal-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: internal-dns
    spec:
      nodeSelector:
        topology.homelab/site: home
      containers:
        - name: coredns
          image: coredns/coredns:1.14.7
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - name: dns
              containerPort: 5353
              protocol: UDP
            - name: health
              containerPort: 8080
            - name: metrics
              containerPort: 9153
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
          # Measured on Talos 1.13/containerd: every hardened field tried
          # (allowPrivilegeEscalation:false, runAsNonRoot, capabilities.drop
          # ALL — each individually) makes `exec /coredns` EPERM for
          # docker.io/coredns/coredns. No container securityContext here;
          # re-test exec before hardening this block back.
          # (Zone key mounts flat at /etc/coredns/<key> — file plugin path
          # must match that layout.)
      volumes:
        - name: config
          configMap:
            name: coredns-config
---
# The privileged port (53) is NOT requested: the Service maps 53 -> 5353,
# so the pod never binds anything <1024.
apiVersion: v1
kind: Service
metadata:
  name: internal-dns
  namespace: internal-dns
  labels:
    # REQUIRED by the L2 announcement policy (serviceSelector scope=internal):
    # without it no home node ARPs for the VIP and the resolver has no
    # LAN-reachable address at all.
    dns.ngoldack.de/scope: internal
  annotations:
    lbipam.cilium.io/ips: "10.30.0.201"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: internal-dns
  ports:
    - name: dns
      port: 53
      protocol: UDP
      targetPort: 5353
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 5353
