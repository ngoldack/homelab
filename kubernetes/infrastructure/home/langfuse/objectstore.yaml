---
# Barman Cloud ObjectStore for langfuse's CNPG cluster. Backup destination is
# the shared Hetzner Objects bucket; credentials come from the per-app SOPS
# secret langfuse-backup-s3-credentials (created alongside this manifest, not
# yet listed in kustomization until now). serverName is intentionally absent:
# the plugin-barman-cloud CRD forbids it (Barman derives the server name).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: langfuse-backup-store
  namespace: langfuse
spec:
  retentionPolicy: "30d"
  configuration:
    # v2: the cluster was re-initialized (its system identifier, …244057,
    # differs from the completed backup at .../langfuse/langfuse-database/base/
    # 20260916T021700, …245722). The WALs the previous incarnation left under
    # .../langfuse/ make barman's empty-archive check fail — it refuses to
    # continue an archive it did not start — which blocked WAL archiving
    # entirely (`Expected empty archive`, retried every second, last_archived
    # NULL). A fresh destination is the sanctioned fix; the old prefix is left
    # byte-for-byte intact and is still the only way to restore that
    # incarnation.
    destinationPath: s3://home-cnpg-backups-7cd4e906/langfuse-v2/
    endpointURL: https://fsn1.your-objectstorage.com
    s3Credentials:
      accessKeyId:
        name: langfuse-backup-s3-credentials
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: langfuse-backup-s3-credentials
        key: AWS_SECRET_ACCESS_KEY
      region:
        name: langfuse-backup-s3-credentials
        key: AWS_REGION
    wal:
      compression: gzip
  instanceSidecarConfiguration:
    # Hetzner Objects (S3-compatible) requires disabling the AWS SDK's newer
    # data-integrity checksum defaults, which otherwise break uploads with
    # x-amz-content-sha256 errors (documented plugin-barman-cloud/object_stores
    # contingency for S3-compatible endpoints).
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
