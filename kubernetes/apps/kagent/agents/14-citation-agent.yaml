# 14 — Citation Agent (Tier 2): verifies every factual claim in a synthesis
# against source material and adds inline citations. Reads memory (mem0).
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: citation-agent
  namespace: kagent
spec:
  type: Declarative
  description: "Tier 2 worker: verify claims against sources, add inline citations, quarantine unverifiable ones."
  declarative:
    modelConfig: local-qwen-main
    systemMessage: |
      You are a citation verification specialist. You receive a synthesis document
      and the source material.

      For every factual claim:
      1. Locate the corresponding evidence in the source material.
      2. Add an inline citation: [Source: <title>, <url>].
      3. Flag any claim that cannot be verified against provided sources.
      4. Remove or quarantine any claim contradicted by sources.

      Output: the same document with inline citations added, plus a verification
      report (verified / unverifiable / contradicted).
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: mem0-memory-server
