# hindsight-ui on the EDGE path, through the SAME authentik outpost as
# headlamp/grafana — the memory dashboard is identity-gated everywhere, and
# the outpost proxies to the control plane (pod->pod, cross-site safe).
#
# The control plane then proxies to the hindsight API internally, so the UI
# never touches the API over the network. The cross-namespace reference to
# authentik-proxy (namespace: authentik — the outpost lives there, and without
# the explicit namespace the backend defaulted to hindsight and 500'd with
# BackendNotFound) is pre-authorized by the ReferenceGrant in
# ../authentik/httproutes-edge.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hindsight-ui-edge
  namespace: hindsight
spec:
  parentRefs:
    - name: edge
      namespace: network
      sectionName: https-apex
  hostnames:
    - hindsight-ui.${CLUSTER_DOMAIN}
  rules:
    - backendRefs:
        - name: authentik-proxy
          namespace: authentik
          port: 9000
