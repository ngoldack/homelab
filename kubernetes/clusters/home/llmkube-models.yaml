# The Qwen3.8-27B Model and InferenceService.
#
# wait: false deliberately. The model is a ~13GB download into the shared
# cache and the NAS currently sustains single-digit MB/s, so the first
# reconcile can take the better part of an hour. With wait: true a healthy but
# slow prefetch would be reported as a failed Kustomization and retried from
# the top, re-downloading each time.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llmkube-models
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/infrastructure/home/llmkube-models
  prune: true
  wait: false
  timeout: 20m
  retryInterval: 5m
  dependsOn:
    - name: llmkube
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
