# browserless — self-hosted Browserless OSS Chromium, reached ONLY from the
# Hermes gateway over CDP as its browser backend. Exactly THREE concurrent
# Chromium processes in ONE replica (concurrency is in-process; a second replica
# would give 6, not 3).
#
# Deliberately NOT exposed on the edge Gateway: no HTTPRoute here, no
# gateway.ngoldack.de/*-ingress label, so a route could not attach. Browserless
# has no built-in SSO and its debugger UI is unauthenticated beyond the token,
# so a public listener is out of the question.
#
# PSA restricted is enforced, not merely audited: measured live 2026-09-23
# against ghcr.io/browserless/chromium:v2.56.7, Chromium launches and serves CDP
# with ALL capabilities dropped, no-new-privileges, a read-only rootfs and only
# /tmp + /dev/shm writable — no privileged container and no seccomp override.
apiVersion: v1
kind: Namespace
metadata:
  name: browserless
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
