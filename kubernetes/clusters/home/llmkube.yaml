# LLMKube operator + its CRDs. Its own Kustomization so llmkube-models.yaml
# can dependsOn it — the Model and InferenceService CRs cannot apply before
# the CRDs are established, and a Kustomization that fails to apply also
# cannot prune, so a mistake here would wedge more than just this app.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llmkube
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/infrastructure/home/llmkube
  prune: true
  wait: true
  timeout: 15m
  dependsOn:
    - name: infra-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
