apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tetragon
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: kube-system
  chart:
    spec:
      chart: tetragon
      version: "1.1.2"
      sourceRef:
        kind: HelmRepository
        name: tetragon-cilium
      interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Essential for Talos Linux kernel tracing 
    extraHostPathMounts:
      - name: sys-kernel-tracing
        mountPath: /sys/kernel/tracing
        hostPath: /sys/kernel/tracing

    # Container Runtime Interface Integration
    tetragon:
      cri:
        enabled: true
        socketHostPath: "/run/containerd/containerd.sock"

    # Runtime Hook customization for Read-Only filesystems like Talos
    rthooks:
      enabled: true
      interface: "nri-hook"
      installDir: "/run/tetragon"
