apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - sources.yaml
  - truenas-csi
  - nvidia
  - node-taints
  # headlamp only. NOT network or external-dns: those are applied by their own
  # Flux Kustomization (clusters/home/network.yaml) so their CRD ordering can be
  # expressed, and network/kustomization.yaml already includes ../external-dns —
  # listing it here too is a duplicate-resource-id build failure.
  - headlamp
