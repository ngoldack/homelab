# synthetic-proxy — the per-key health/quota guard in front of Synthetic.
#
# WHY: Synthetic's 429s are three different conditions (transient
# parallel-limit, a slow-clearing generic rate limit, and hard quota
# exhaustion) and only the last two mean "do not use this key for a while".
# Discriminating them by sniffing response bodies inside the gateway is
# fragile. This service instead asks Synthetic's authoritative /v2/quotas
# endpoint with the SAME key the gateway injects, keeps per-caller state, and
# refuses the request itself (429 with the "exceeded your subscription rate
# limits" body and NO Retry-After) when the key is rate-limited or out of
# quota — which is exactly what policy-agent-chains-health.yaml /
# policy-hindsight-health.yaml evicts on. A 503 is returned when Synthetic is
# unreachable (also evicted, via the CEL's >= 500 clause).
#
# NO SECRET: the Deployment mounts no Secret and sets no key env. The gateway
# injects the Authorization header (policies.auth.secretRef: synthetic-key)
# into every upstream request; the proxy hashes it (SHA-256) to key its state
# map and forwards the raw value. A state dump therefore yields no credential.
#
# WHY the backends point here: agent-chains.yaml, backends.yaml, chat-chain.yaml
# and hindsight-chain.yaml repoint each Synthetic provider at
# synthetic-proxy.agentgateway.svc.cluster.local:8080 (plaintext, no
# policies.tls). The proxy then reaches api.synthetic.new:443 itself.
#
# CILIUM: the namespace-wide allowlist (cilium-allowlist.yaml,
# endpointSelector {}) admits in-namespace ingress (the data plane's calls),
# cluster DNS, and — for the Synthetic leg — egress to the vpn-egress namespace
# on :8888. That last edge is load-bearing: HTTPS_PROXY below sends the upstream
# request through the vpn-egress Service, and Cilium needs the rule on BOTH sides
# (vpn-egress admits this namespace in its own allowlist). With one side missing
# the connection is dropped silently, and the symptom is indistinguishable from a
# broken VPN.
#
# The namespace's `world:443` rule is no longer used by this pod: its only
# upstream (Synthetic) leaves through the vpn-egress pool, and OTLP export goes
# to langfuse:3000 in-cluster. The rule is kept deliberately rather than deleted
# blind — see the note in cilium-allowlist.yaml.
---
# Dedicated ServiceAccount (repo convention + the cluster's
# disallow-default-serviceaccount policy: a pod must never run as `default`).
# The proxy makes no Kubernetes API call, so the token is not mounted at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: synthetic-proxy
  namespace: agentgateway
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetic-proxy
  namespace: agentgateway
  labels:
    app.kubernetes.io/name: synthetic-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synthetic-proxy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxSurge 0 (repo convention) forces maxUnavailable >= 1; the proxy is
      # stateless besides an in-memory cache, so a brief gap is safe.
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synthetic-proxy
    spec:
      # Dedicated SA (see the ServiceAccount above); the token is not mounted.
      serviceAccountName: synthetic-proxy
      automountServiceAccountToken: false
      nodeSelector:
        topology.homelab/site: home
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: synthetic-proxy
          # Pinned by manifest digest (Docker-Content-Digest of
          # registry.ngoldack.de/synthetic-proxy:0.1.0-7ccb99f, built from this
          # revision's sources through buildkitd:1234 by build Job
          # build-synthetic-proxy-s11). Re-pin after every rebuild — the new
          # digest is printed by image-builds/synthetic-proxy.yaml.
          #
          # This build adds DisableKeepAlives, which is what makes the
          # vpn-egress pool rotate per request instead of pinning the proxy to
          # one exit. The previous digest (…f0e36b03769243e6, tag 0.1.0-545e576)
          # is the rollback: repin it and the Synthetic leg goes back to a
          # direct connection with keep-alives on.
          image: registry.ngoldack.de/synthetic-proxy@sha256:f33662dd76212cc1fdb7b12e128ccb54ad66ab950fbe5daca7ea809e9e92cf8d
          ports:
            - name: http
              containerPort: 8080
          env:
            # Defaults are compiled in; they are spelled out here so the
            # effective configuration is visible in the manifest. A malformed
            # value is a CrashLoopBackOff (config.go fails fast).
            - name: SYNTHETIC_UPSTREAM
              value: https://api.synthetic.new:443
            - name: SYNTHETIC_QUOTA_PATH
              value: /v2/quotas
            - name: HEALTH_PROBE_PATH
              value: /v1/models
            - name: LPORT
              value: "8080"
            # Verdict freshness: a key's last verdict is reused for this long
            # before it is re-evaluated on the next request. This is also the
            # anti-poke guarantee — the proxy issues no unprompted request to
            # Synthetic, so a key sitting out its rate-limit recovery window is
            # never prodded (which is what kept the 429 state alive before).
            - name: QUOTA_POLL_SECONDS
              value: "300"
            # TWO clocks, because one number cannot serve both cases, and the
            # difference is measured rather than theoretical.
            #
            # HOLD_OFF_FAILOVER (the failover flavours: a spent allowance, the
            # generic rate-limit state). This is the LONG no-poke window the
            # operator established: that state only clears after a long stretch
            # with no new request, so re-probing early both wastes the attempt
            # and holds the window open. Measured 2026-09-21 with a 10m value:
            # the window lapsed at 10m02s and the very next burst was STILL
            # 429, so the proxy burned 14059 refusals re-confirming a state it
            # was itself keeping open. The proxy is the only component that
            # pokes Synthetic, so a long hold-off is what stopped the endless
            # 429s.
            #
            # 1h -> 5m on 2026-09-22, when OpenRouter was removed from
            # hindsight-chain and the agent chains: this clock no longer means
            # "how long a caller stays on a fallback", it means "how long the
            # caller is offline", so the two clocks serve opposite goals and
            # must agree. The long window above was measured under the old
            # topology, where the cost of re-probing was one wasted OpenRouter
            # call; with a single provider it is an outage. 5m matches the
            # gateway's eviction duration, so both lapse together and
            # re-probing is normal operation rather than the thing holding the
            # window open.
            # NOTE: a shorter window does re-poke Synthetic more often while it
            # recovers, which is exactly what the 1h value avoided — that trade
            # is deliberate.
            - name: HOLD_OFF_FAILOVER
              value: 5m
            # UNHEALTHY_AFTER (transient only: transport unreachability, a 5xx
            # from Synthetic). Short, so a blip does not park the chain. The
            # parallel-limit 429 is not held off at all — it is passed through.
            - name: UNHEALTHY_AFTER
              value: 2m
            # Time-to-first-byte from Synthetic. Without it, a connection that
            # is accepted but never answered hangs the request indefinitely —
            # the gateway holds a retry slot with no status code to retry on,
            # and the client waits forever (the "endless" failure mode rather
            # than a fast error). Bounds the wait for HEADERS only, so a long
            # SSE completion still streams for as long as it needs; raising it
            # is safe for slow models, lowering it trades patience for a
            # quicker failover.
            - name: UPSTREAM_HEADER_TIMEOUT
              value: 60s
            # The Synthetic leg leaves through the vpn-egress pool: five
            # WireGuard tunnels (PL / BE / NL / DE-fra / DE-ber) behind one
            # ClusterIP Service, each running gluetun's HTTP CONNECT proxy. The
            # Service IS the load balancer — Cilium hands every new connection a
            # random *Ready* tunnel — and because http.go disables keep-alives,
            # each request is a new connection and therefore a fresh exit, so
            # requests genuinely arrive at Synthetic from five different source
            # IPs.
            #
            # Go reads this once, at the first proxied request, and caches it: a
            # live `kubectl set env` is NOT picked up by a running process, the
            # value has to be in the container env (it is) and the pod restarted.
            - name: HTTPS_PROXY
              value: http://vpn-egress.vpn-egress.svc.cluster.local:8888
            # Keep anything in-cluster off the tunnel. The only upstream today is
            # api.synthetic.new, so this is insurance rather than load-bearing:
            # it stops a future in-cluster upstream from being sent out through a
            # Proton exit. (The vpn-egress pods also keep the cluster CIDRs out
            # of their tunnels, so a request that did go this way would fail
            # rather than quietly take the long way round.)
            - name: NO_PROXY
              value: localhost,127.0.0.1,.svc,.svc.cluster.local
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # readOnlyRootFilesystem: true — the Go runtime may still want a
            # writable temp dir, so give it one (repo convention).
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: synthetic-proxy
  namespace: agentgateway
  labels:
    app.kubernetes.io/name: synthetic-proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: synthetic-proxy
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
