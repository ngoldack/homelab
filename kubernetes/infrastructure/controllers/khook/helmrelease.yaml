# khook (kagent-dev) — watches the Kubernetes event bus and fires kagent Agent
# prompts reactively (no polling/cron). Provides the Khook CRD. Chart shipped as
# an OCI artifact.
#
# VERIFY-BEFORE-DEPLOY: confirm the OCI chart path/version and the Khook CRD
# apiVersion against the upstream project (github.com/kagent-dev/khook).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: khook
  namespace: flux-system
spec:
  type: oci
  interval: 2h
  url: oci://ghcr.io/kagent-dev/khook/helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: khook
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: kagent
  chart:
    spec:
      chart: khook
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: khook
      interval: 1h
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
