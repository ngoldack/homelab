# The bootstrap logic, mounted into the Job at /scripts/bootstrap.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-bots-bootstrap-script
  namespace: matrix
data:
  bootstrap.sh: |
    #!/bin/sh
    # matrix-bots-bootstrap — configure the Hermes bot accounts in MAS, idempotently.
    #
    # The executable form of the "Bot accounts" runbook step. It:
    #   * ensures dave/chad/lindner/marius exist (registering any that do not),
    #   * mints one Matrix access token per bot with a stable device id, so the
    #     device — and the E2EE crypto store on the PVC — survives a rotation,
    #   * creates the shared private room on #agent-hq and records its IMMUTABLE id
    #     (the allowlist wants the id: aliases can be re-pointed, ids cannot),
    #   * publishes all of it as the Secret `matrix-bots-bootstrap`, which the
    #     operator copies into hermes-agents/secret.sops.yaml. Nothing is printed:
    #     tokens are captured here and written straight to that Secret.
    #
    # Two facts about this stack shape the implementation:
    #   * the MAS image ships NO SHELL, and its merged config + secrets exist only
    #     inside its own pod — so every mas-cli call goes through `kubectl exec`
    #     into that pod;
    #   * MAS itself is the authority on whether a user exists (the CLI has no user
    #     listing and this build does not serve /register/available — it 404s), so
    #     existence is probed with the token call, which answers "User not found".
    #
    # Re-running is safe: an existing account is left alone and an existing token in
    # the output Secret is reused. REISSUE=true mints new tokens, which invalidates
    # the ones the running agents hold until they are rolled.
    set -eu

    NS_MATRIX="${NS_MATRIX:-matrix}"
    MAS_DEPLOY="${MAS_DEPLOY:-matrix-matrix-authentication-service}"
    MAS_CFG="${MAS_CFG:-/conf/mas-config.yaml}"
    SYNAPSE="${SYNAPSE:-http://matrix-synapse.matrix.svc.cluster.local:8008}"
    BOTS="${BOTS:-dave chad lindner}"
    OUTPUT_SECRET="${OUTPUT_SECRET:-matrix-bots-bootstrap}"
    ROOM_ALIAS_LOCALPART="${ROOM_ALIAS_LOCALPART:-agent-hq}"
    ROOM_NAME="${ROOM_NAME:-Agent HQ}"
    SERVER_NAME="${SERVER_NAME:-matrix.ngoldack.de}"
    OPERATOR_MXID="${OPERATOR_MXID:-}"
    REISSUE="${REISSUE:-false}"

    log() { printf '%s %s\n' "$(date -u +%H:%M:%S)" "$*"; }

    # mas-cli reaches the homeserver through the same in-cluster Service the
    # runtime uses, and that single hop can blip: a 2026-09-22 run died inside
    # register-user with "error sending request … operation timed out" while
    # the very same call answered normally moments later. A transport error is
    # therefore retried; an application answer ("User not found") is passed
    # straight back to the caller, which branches on it.
    MAS_RETRIES="${MAS_RETRIES:-4}"
    mas() {
      attempt=1
      while :; do
        if mas_out="$(kubectl -n "$NS_MATRIX" exec "deploy/$MAS_DEPLOY" -- \
                        mas-cli --config "$MAS_CFG" "$@" 2>&1)"; then
          printf '%s\n' "$mas_out"; return 0
        fi
        case "$mas_out" in
          *"error sending request"*|*"operation timed out"*|*"timed out"*|\
          *"error trying to connect"*|*"connection refused"*|*"connection reset"*)
            if [ "$attempt" -ge "$MAS_RETRIES" ]; then
              printf '%s\n' "$mas_out"; return 1
            fi
            log "mas-cli transport error (attempt $attempt/$MAS_RETRIES) — retrying in 5s"
            attempt=$((attempt + 1)); sleep 5 ;;
          *) printf '%s\n' "$mas_out"; return 1 ;;
        esac
      done
    }

    # Values already recorded, so a re-run does not churn tokens.
    existing_secret="$(kubectl -n "$NS_MATRIX" get secret "$OUTPUT_SECRET" -o json 2>/dev/null || true)"
    have_key() { printf '%s' "$existing_secret" | grep -q "\"$1\":" 2>/dev/null; }
    read_key() {
      kubectl -n "$NS_MATRIX" get secret "$OUTPUT_SECRET" -o "jsonpath={.data.$1}" | base64 -d
    }

    rand_pw() {
      head -c 24 /dev/urandom | base64 | tr -d '\n=+/' | cut -c1-24
    }

    out="$(mktemp)"
    printf 'BOOTSTRAP_AT=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$out"

    log "target: $SYNAPSE (ns $NS_MATRIX), bots: $BOTS"

    # ---------------------------------------------------------------- accounts ---
    for bot in $BOTS; do
      # The Secret key suffix is NOT the bot's name: the StatefulSets read
      # MATRIX_D_/MATRIX_C_/MATRIX_L_ (see hermes-agents/*.yaml), so the mapping is
      # explicit here. Getting this wrong is silent — the pods would simply find no
      # token and the operator would be copying values nobody reads.
      case "$bot" in
        dave)    upper=D ;;
        chad)    upper=C ;;
        lindner) upper=L ;;
        marius)  upper=M ;;
        *)       upper="$(printf '%s' "$bot" | tr '[:lower:]' '[:upper:]')" ;;
      esac
      # A stable device id keeps the bot's Matrix device (and its E2EE crypto store
      # on the PVC) the same across token rotations.
      device="hermes-$bot"

      if [ "$REISSUE" != "true" ] && have_key "MATRIX_${upper}_ACCESS_TOKEN"; then
        log "$bot: reusing the token already recorded in $OUTPUT_SECRET"
        printf 'MATRIX_%s_ACCESS_TOKEN=%s\n' "$upper" "$(read_key "MATRIX_${upper}_ACCESS_TOKEN")" >> "$out"
        printf 'MATRIX_%s_DEVICE_ID=%s\n' "$upper" "$(read_key "MATRIX_${upper}_DEVICE_ID")" >> "$out"
        continue
      fi

      log "$bot: asking MAS for a token (device $device)"
      tok_out="$(mas manage issue-compatibility-token "$bot" "$device" 2>&1)" || true
      case "$tok_out" in
        *"User not found"*)
          log "$bot: no such account yet — registering it"
          if ! reg_out="$(mas manage register-user --yes --ignore-password-complexity \
                            --no-admin --display-name "$bot" --password "$(rand_pw)" "$bot" 2>&1)"; then
            log "FATAL: register-user failed for $bot:"; printf '%s\n' "$reg_out" | tail -5; exit 1
          fi
          printf 'MATRIX_%s_STATUS=created\n' "$upper" >> "$out"
          tok_out="$(mas manage issue-compatibility-token "$bot" "$device" 2>&1)" || true
          ;;
        *)
          printf 'MATRIX_%s_STATUS=existed\n' "$upper" >> "$out"
          ;;
      esac

      # The CLI logs the token to stderr inside a tracing line
      # ("…INFO … Compatibility token issued: mct_… compat_access_token.id=…"), so
      # take the field after the marker rather than "the last word" — a naive
      # whitespace-stripping capture yields the whole log line and Synapse answers
      # 401 to it.
      token="$(printf '%s\n' "$tok_out" \
        | sed -n 's/.*Compatibility token issued: \([^ ][^ ]*\).*/\1/p' | tail -1)"
      case "$token" in
        "") log "FATAL: no token for $bot:"; printf '%s\n' "$tok_out" | tail -3; exit 1 ;;
      esac
      [ "${#token}" -gt 20 ] || { log "FATAL: token for $bot looks too short"; exit 1; }
      printf 'MATRIX_%s_ACCESS_TOKEN=%s\n' "$upper" "$token" >> "$out"
      printf 'MATRIX_%s_DEVICE_ID=%s\n' "$upper" "$device" >> "$out"
    done

    # ------------------------------------------------------------------- room ----
    # The alias is the human-facing name; the room ID is what the allowlist pins.
    alias_escaped="%23${ROOM_ALIAS_LOCALPART}:${SERVER_NAME}"
    room_id="$(curl -fsS -m 10 "$SYNAPSE/_matrix/client/v3/directory/room/$alias_escaped" \
      | jq -r '.room_id // empty' 2>/dev/null || true)"
    if [ -n "$room_id" ]; then
      log "room #$ROOM_ALIAS_LOCALPART already exists: reusing it"
    else
      dave_token="$(grep '^MATRIX_D_ACCESS_TOKEN=' "$out" | cut -d= -f2-)"
      [ -n "$dave_token" ] || { log "FATAL: dave's token is required to create the room"; exit 1; }
      invite_json='[]'
      [ -n "$OPERATOR_MXID" ] && invite_json="[\"$OPERATOR_MXID\"]"
      log "creating room #$ROOM_ALIAS_LOCALPART ($ROOM_NAME)"
      payload="{\"name\":\"$ROOM_NAME\",\"preset\":\"private_chat\","
      payload="$payload\"visibility\":\"private\",\"invite\":$invite_json,"
      payload="$payload\"room_alias_name\":\"$ROOM_ALIAS_LOCALPART\"}"
      room_id="$(curl -fsS -m 20 -X POST \
        -H "Authorization: Bearer $dave_token" -H 'Content-Type: application/json' \
        -d "$payload" "$SYNAPSE/_matrix/client/v3/createRoom" | jq -r '.room_id // empty')"
      [ -n "$room_id" ] || { log "FATAL: room creation returned no room_id"; exit 1; }
    fi
    log "room id: $room_id (this is what MATRIX_ALLOWED_ROOMS pins)"
    printf 'MATRIX_ALLOWED_ROOMS=%s\n' "$room_id" >> "$out"

    # Membership. Each bot JOINS with its own token: the adapters reject invites
    # from senders outside MATRIX_ALLOWED_USERS (the bot-loop guard, working as
    # designed — a bot-issued invite reads as "unauthorized user"), and a
    # private_chat room is invite-only, so a plain self-join is refused too (403).
    # The room is therefore opened for the joins and closed again immediately after,
    # which leaves exactly the intended end state: an invite-only room whose members
    # are the four bots plus the invited human.
    room_enc="$(printf '%s' "$room_id" | sed 's/!/%21/')"
    dave_token="$(grep '^MATRIX_D_ACCESS_TOKEN=' "$out" | cut -d= -f2-)"
    [ -n "$dave_token" ] || { log "FATAL: dave's token is needed to manage the room"; exit 1; }

    set_join_rule() {   # $1 = public|invite
      curl -s -o /dev/null -m 15 -X PUT -H "Authorization: Bearer $dave_token" \
        -H 'Content-Type: application/json' -d "{\"join_rule\":\"$1\"}" \
        "$SYNAPSE/_matrix/client/v3/rooms/$room_enc/state/m.room.join_rules"
    }

    joined=""
    refused=""
    for bot in $BOTS; do
      case "$bot" in
        dave)    upper=D ;;
        chad)    upper=C ;;
        lindner) upper=L ;;
        marius)  upper=M ;;
        *)       upper="$(printf '%s' "$bot" | tr '[:lower:]' '[:upper:]')" ;;
      esac
      tok="$(grep "^MATRIX_${upper}_ACCESS_TOKEN=" "$out" | cut -d= -f2-)"
      [ -n "$tok" ] || continue
      code="$(curl -s -o /dev/null -w '%{http_code}' -m 15 -X POST \
        -H "Authorization: Bearer $tok" -H 'Content-Type: application/json' -d '{}' \
        "$SYNAPSE/_matrix/client/v3/join/$room_enc")"
      case "$code" in
        200) joined="$joined $bot"; log "$bot: joined the room" ;;
        403) refused="$refused $bot" ;;
        *)   log "$bot: join returned HTTP $code" ;;
      esac
    done

    if [ -n "$refused" ]; then
      log "opening the room briefly to admit:$refused"
      set_join_rule public
      for bot in $refused; do
        case "$bot" in
          dave) upper=D ;; chad) upper=C ;; lindner) upper=L ;; marius) upper=M ;;
          *) upper="$(printf '%s' "$bot" | tr '[:lower:]' '[:upper:]')" ;;
        esac
        tok="$(grep "^MATRIX_${upper}_ACCESS_TOKEN=" "$out" | cut -d= -f2-)"
        code="$(curl -s -o /dev/null -w '%{http_code}' -m 15 -X POST \
          -H "Authorization: Bearer $tok" -H 'Content-Type: application/json' -d '{}' \
          "$SYNAPSE/_matrix/client/v3/join/$room_enc")"
        log "$bot: join after opening -> HTTP $code"
      done
    fi
    # Invite-only from here on: the members are already inside.
    set_join_rule invite

    # Invite the human (the bots are members, so nobody has to accept a bot invite).
    if [ -n "$OPERATOR_MXID" ]; then
      invite_code="$(curl -s -o /dev/null -w '%{http_code}' -m 15 -X POST \
        -H "Authorization: Bearer $dave_token" -H 'Content-Type: application/json' \
        -d "{\"user_id\":\"$OPERATOR_MXID\"}" \
        "$SYNAPSE/_matrix/client/v3/rooms/$room_enc/invite")"
      log "operator invite ($OPERATOR_MXID): HTTP $invite_code"
    fi

    # Who is in the room now — the proof that the wiring worked end to end.
    members="$(curl -s -m 15 -H "Authorization: Bearer $dave_token" \
      "$SYNAPSE/_matrix/client/v3/rooms/$room_enc/joined_members" \
      | jq -r '.joined | keys[]' 2>/dev/null | tr '\n' ' ')"
    log "room members: $members"

    # --------------------------------------------------------------- publish -----
    # The Job owns exactly one Secret; the operator copies these into
    # hermes-agents/secret.sops.yaml and can then delete it.
    kubectl -n "$NS_MATRIX" create secret generic "$OUTPUT_SECRET" \
      --from-env-file="$out" --dry-run=client -o yaml | kubectl apply -f - >/dev/null
    rm -f "$out"

    count="$(kubectl -n "$NS_MATRIX" get secret "$OUTPUT_SECRET" -o jsonpath='{.data}' \
      | tr ',' '\n' | wc -l | tr -d ' ')"
    log "wrote $OUTPUT_SECRET ($count values)"
    log "next: copy them into hermes-agents/secret.sops.yaml, roll the agents, delete the Secret."
