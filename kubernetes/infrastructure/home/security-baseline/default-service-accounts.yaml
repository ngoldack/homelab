# Per-namespace `default` ServiceAccount hardening.
#
# WHAT: for each infrastructure namespace whose `default` ServiceAccount carries
# NO RoleBinding/ClusterRoleBinding and whose pods show no Kubernetes API usage,
# this file sets `automountServiceAccountToken: false` on that namespace's
# `default` SA.
#
# WHY: a pod that does not name a ServiceAccount runs as `default` and gets a
# projected token at /var/run/secrets/kubernetes.io/serviceaccount/. The Phase-1
# inventory (2026-09-18, kubeconfig-home.yaml) read every RoleBinding and
# ClusterRoleBinding in the cluster: 158 bindings naming 100 distinct
# ServiceAccount subjects, and NOT ONE of them is `default`. A `default` token
# therefore grants no resource permission whatsoever - it only authenticates the
# holder as system:serviceaccount:<ns>:default, i.e. as a member of
# `system:authenticated` and `system:serviceaccounts`, which carry the standard
# bootstrap bindings (system:discovery, system:basic-user,
# system:public-info-viewer, system:service-account-issuer-discovery). Removing
# the token removes a readable in-pod credential without removing a single
# permission: pure blast-radius reduction.
#
# HOW THE LIST WAS DERIVED (all read-only, live):
#   1. Bindings: `kubectl get rolebinding,clusterrolebinding -A -o json`, then
#      subjects of kind ServiceAccount named `default` -> zero hits anywhere.
#      The binding test never vetoed a namespace.
#   2. Pods: `kubectl get pods -A -o json`; for each namespace the pods whose
#      serviceAccountName is unset or `default`, then their container command,
#      args and env were read for API access (kubectl, kubernetes.default,
#      in-cluster config, KUBERNETES_* env, informer/watch patterns) -> no hits.
#   3. Universe: the 30 live namespaces carrying a Flux label
#      (kustomize.toolkit.fluxcd.io/name) plus flux-system = 31. Of those, 3 are
#      out of scope for this unit and 1 is a retired lane with no workloads (see
#      the skip list), leaving 25 hardened by the original census. browserless
#      and searxng were added on 2026-09-23 with the same two tests applied and
#      the same result, for 27. (Two more namespaces, nvidia-device-plugin and
#      llmkube-system, were hardened by this file until 2026-09-22, when the
#      local-LLM lane they belonged to was removed.)
#
# SKIPPED DELIBERATELY, with reasons:
#   * hermes, hermes-sandbox, agent-sandbox-system - out of scope for this unit
#     (the agent/sandbox plane, owned by the Hermes capability work). The control
#     there is already stronger and pod-level:
#     ../agent-sandbox/policies/validating-admission-policy.yaml
#     (secure-hermes-sandbox) denies any sandbox Pod that does not itself set
#     `spec.automountServiceAccountToken: false`, so the SA-level field would add
#     nothing.
#   * kube-system, kube-public, kube-node-lease - out of scope (system
#     namespaces). Worth knowing what runs as `kube-system/default` today: the
#     debug pods `hosttest` and the two `node-debugger-talos-bno-yij-*`
#     (hostNetwork+hostPID+hostIPC, privileged, hostPath /) - the one place a
#     `default` token may legitimately be wanted.
#   * aigateway - retired Envoy AI Gateway lane. The namespace still carries a
#     stale `kustomize.toolkit.fluxcd.io/name: aigateway` label but no such
#     Kustomization exists among the 36 live ones, and the namespace holds zero
#     resources. There is a mechanical reason as well: an SA object for a
#     namespace that is later deleted makes kustomize-controller fail this whole
#     Kustomization on every reconcile.
#   * cilium-secrets, default, reach-test - no workloads and no Flux
#     Kustomization. The same three (plus aigateway) are already scoped out of
#     intra-namespace-allow.yaml for exactly that reason.
#
# WHAT THIS DOES NOT DO:
#   * It does not touch running pods: automountServiceAccountToken is evaluated at
#     Pod CREATE time, so existing pods keep the token they already hold until
#     they restart. Nothing here is a live revocation.
#   * It does not block a future legitimate need: a Pod-level
#     `automountServiceAccountToken: true` wins over the ServiceAccount field, so a
#     workload that genuinely needs the API (and ships the RBAC for it) can opt
#     back in without editing this file.
#   * It does not create a floor for new namespaces. A namespace not listed here
#     keeps the Kubernetes default and still projects the token - the same "no
#     automatic floor" caveat the CNP situation documents in kustomization.yaml
#     beside this file. Adding a namespace here is therefore a deliberate act;
#     browserless/searxng were added when this file gained them, each with the
#     pod-level field set too, so the two agree rather than relying on either.
#   * 6 of the original 25 namespaces had pods that ran as `default` at the last
#     census (2026-09-18: authentik 7, buildkit 5, crowdsec 5, langfuse 4,
#     paperless 1, talos-backup 1). They are hardened on purpose: no binding, and
#     no API usage in their specs/args/env, so the token was already useless to
#     them. browserless and searxng are the same class: their pods pick up this
#     SA-level field and additionally name a dedicated ServiceAccount and set
#     automountServiceAccountToken: false on the pod spec, so this is
#     belt-and-braces on one control rather than a distinct one.
#
# RE-VERIFY (read-only; both commands must agree with the comments above):
#   kubectl get rolebinding,clusterrolebinding -A -o json | jq -r \
#     '.items[].subjects[]? | select(.kind=="ServiceAccount")
#      | "\(.namespace)/\(.name)"' | sort -u | grep -x '.*/default'
#     -> no output: nothing in the cluster binds a `default` SA.
#   kubectl get sa -A -o json | jq -r '.items[]
#     | select(.metadata.name=="default")
#     | "\(.metadata.namespace) \(.automountServiceAccountToken)"'
#     -> these 27 namespaces read `false` once Flux applies this file.

---
# agentgateway: 3 pod(s), none running as `default` - each runs on its own dedicated ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: agentgateway
# Pods that do not name a ServiceAccount run as this one; without this field the
# kubelet projects a token into each of them.
automountServiceAccountToken: false
---
