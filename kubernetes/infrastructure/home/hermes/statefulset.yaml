# hermes — hardened single-replica Hermes gateway running the agent_sandbox
# terminal backend. Holds NO Kubernetes credentials beyond its own claim
# RBAC (approved scoped grant in rbac.yaml): it talks to the sandbox-router
# for files (v2 scoped tokens), gRPC-execs into adopted sandboxes directly
# (user-approved fallback), and calls the agentgateway data plane for the
# model.
#
# Hardening (restricted PSA): runAsNonRoot (hermes uid 10000), fsGroup
# 10000, RuntimeDefault seccomp, drop ALL caps, read-only rootfs, /tmp
# emptyDir, no hostPath/sockets/kubeconfig. s6-overlay is bypassed in the
# image, whose entrypoint runs the gateway and supervises the dashboard in the
# same unprivileged container (the pod passes no argv, so the command line
# cannot drift), and readiness checks both listeners; Kubernetes supervises
# the single replica. /opt/data/config.yaml is seeded revision-aware from the
# hermes-config key "config-rev".
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: hermes
spec:
  serviceName: hermes
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
      annotations:
        # Bump together with the hermes-config key config-rev: a change here
        # rolls the pod and re-seeds /opt/data/config.yaml.
        hermes.ngoldack.de/config-rev: "3"
    spec:
      serviceAccountName: hermes
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        fsGroup: 10000
        # The data PVC holds thousands of files on a slow NFS-class backend:
        # a recursive fsGroup chown on every pod start costs minutes of
        # downtime per rollout (observed twice live), and the volume's
        # ownership is already correct after the first pass.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hermes
          image: registry.ngoldack.de/hermes-agent-sandbox-plugin@sha256:246a3c50471e5b3c62a87eaab62bbedec9a8874979af4ca4d118ab6f7f7aed37
          # No args: the image entrypoint owns the command line (it starts the
          # gateway and supervises the dashboard); declaring args here would be
          # silently ignored.
          env:
            # LLM credential for the agentgateway custom provider
            # (config.yaml custom_providers -> OPENAI_API_KEY convention).
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: OPENAI_API_KEY
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: API_SERVER_KEY
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_PORT
              value: "8642"
            - name: AGENT_SANDBOX_ROUTER_URL
              value: http://sandbox-router-svc.agent-sandbox-system.svc.cluster.local:8080
            - name: AGENT_SANDBOX_ROUTER_TOKEN_FILE
              value: /opt/data/router-token
            # Enforce the sandboxed backend even if config.yaml is later
            # rewritten by the app (TERMINAL_ENV is the hard override).
            - name: TERMINAL_ENV
              value: agent_sandbox
            # Stable claim-ownership id for the agent_sandbox plugin; without
            # it ownership falls back to the pod hostname.
            - name: AGENT_SANDBOX_GATEWAY_ID
              value: hermes
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
            - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: HERMES_DASHBOARD_BASIC_AUTH_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: 8642
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            # Both listeners must answer: the API (401 without a bearer key is
            # a healthy answer, curl returns 0 without -f) and the dashboard.
            # A single container has one readiness probe, so this checks both.
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  curl -s -o /dev/null --max-time 3 http://127.0.0.1:8642/v1/models &&
                  curl -s -o /dev/null --max-time 3 http://127.0.0.1:9119/
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8642
            periodSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: router-token
              mountPath: /opt/data/router-token
              subPath: token
              readOnly: true
            - name: tmp
              mountPath: /tmp
      initContainers:
        - name: seed-config
          image: registry.ngoldack.de/hermes-agent-sandbox-plugin@sha256:246a3c50471e5b3c62a87eaab62bbedec9a8874979af4ca4d118ab6f7f7aed37
          command: ["/bin/sh", "-c"]
          env:
            - name: HERMES_CONFIG_REV
              valueFrom:
                configMapKeyRef:
                  name: hermes-config
                  key: config-rev
          args:
            - |
              set -eu
              mkdir -p /opt/data
              current="$(cat /opt/data/.config-rev 2>/dev/null || true)"
              if [ "$current" != "$HERMES_CONFIG_REV" ]; then
                if [ -f /opt/data/config.yaml ]; then
                  cp /opt/data/config.yaml /opt/data/config.yaml.bak
                fi
                cp /opt/boot/config.yaml /opt/data/config.yaml
                printf '%s\n' "$HERMES_CONFIG_REV" > /opt/data/.config-rev
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10000
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: boot-config
              mountPath: /opt/boot
              readOnly: true
      volumes:
        - name: boot-config
          configMap:
            name: hermes-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: router-token
          secret:
            secretName: hermes-secret
            items:
              - key: AGENT_SANDBOX_ROUTER_TOKEN
                path: token
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: truenas-fast-nfs
        resources:
          requests:
            storage: 10Gi
