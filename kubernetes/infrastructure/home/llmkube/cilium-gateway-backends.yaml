# Gateway ingress, narrowed to the pods that actually back an AgentgatewayBackend.
#
# WHY this exists: cilium-allowlist.yaml admits the WHOLE agentgateway namespace to
# THIS WHOLE namespace (stage-1 granularity). That is broader than the traffic that
# exists — the gateway only ever reaches the three backend targets named below — so
# this policy is the per-workload replacement, and the namespace-wide `agentgateway`
# ingress term is removed from the allowlist in the follow-up commit. Until that
# removal lands this policy is purely additive (the broad term still permits the same
# flows), which is deliberate: the direct gateway-to-model path stays open until the
# broker hop is proven end to end.
#
# The three selected pods, and nothing else:
#   - llama-kv-broker  — the qwen36-35b hop (AgentgatewayBackend/local-p100);
#                        the raw qwen36-35b Service is deliberately NOT selectable.
#   - qwen3-27b        — its own backend target (currently dormant, 0 replicas).
#   - nomic-embed-v15  — the embeddings backend target.
# Port 8080 only; the model servers and the broker all listen there and nowhere else.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llmkube-gateway-backends
  namespace: llmkube-system
spec:
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - llama-kv-broker
          - qwen3-27b
          - nomic-embed-v15
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentgateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
