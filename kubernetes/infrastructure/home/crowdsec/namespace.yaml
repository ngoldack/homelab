# CrowdSec's namespace. Detection-only deployment: LAPI + node agents.
#
# There is deliberately no bouncer here. CrowdSec publishes bouncers for
# nginx/Traefik/HAProxy and for host firewalls; this cluster's ingress is
# Cilium Gateway (Envoy), for which the official project ships no remediation
# component, and the one community Cilium bouncer would require cluster-wide
# CiliumNetworkPolicy write access from a single-maintainer project — not a
# trade worth making for automatic bans in a homelab. Decisions therefore
# surface as alerts/metrics for a human (or a future reviewed bouncer) to act
# on, which is exactly what the previous edge-enforcement attempt was rolled
# back for lacking.
apiVersion: v1
kind: Namespace
metadata:
  name: crowdsec
