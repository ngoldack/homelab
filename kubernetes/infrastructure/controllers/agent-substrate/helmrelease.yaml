# kagent Agent Substrate — the gVisor (runsc) runtime substrate backing kagent
# SandboxAgents. Two charts, installed CRDs-first: `substrate-crds` then
# `substrate` (which dependsOn the CRDs), exactly as upstream ships them.
#
# Both releases live in flux-system and deploy into the ate-system
# targetNamespace. The `agent-substrate` OCI HelmRepository they reference is
# declared centrally in controllers/sources.yaml (not inline here).
#
# !!! EXPERIMENTAL !!! substrate is OSS (Apache-2.0) but upstream flags it
# EXPERIMENTAL. VERIFY-BEFORE-DEPLOY: confirm OCI chart paths + versions, CRD
# apiVersions, and EVERY values key below against the published substrate chart
# (`helm show values oci://ghcr.io/kagent-dev/substrate/helm/substrate`).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate-crds
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: ate-system
  chart:
    spec:
      chart: substrate-crds
      # VERIFY-BEFORE-DEPLOY: pin to an exact published tag once confirmed.
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: agent-substrate
      interval: 1h
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: ate-system
  dependsOn:
    - name: substrate-crds
  chart:
    spec:
      chart: substrate
      # VERIFY-BEFORE-DEPLOY: pin to an exact published tag once confirmed.
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: agent-substrate
      interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # !!! EXPERIMENTAL — VERIFY-BEFORE-DEPLOY: confirm value keys against the
    # published substrate chart. Every key below is a best-effort guess; the
    # values schema is NOT confirmed. Diff against the chart and correct the
    # paths before deploying. Kept deliberately minimal.
    #
    # Disable the bundled rustfs S3 server — SandboxAgent snapshots go to the
    # in-cluster SeaweedFS S3 instead.
    rustfs:
      enabled: false
    # atelet: privileged DaemonSet driving the ateom-gvisor (runsc) workers and
    # shipping snapshots to object storage. Select the S3 backend and point it at
    # SeaweedFS (keys from the operator-generated substrate-s3-credentials Secret).
    # VERIFY-BEFORE-DEPLOY: the env-list key may be `env` / `extraEnv` / nested
    # under a different component path.
    atelet:
      env:
        - name: ATE_STORAGE_BACKEND
          value: "s3"
        - name: AWS_ENDPOINT_URL
          value: "http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333"
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: substrate-s3-credentials
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: substrate-s3-credentials
              key: AWS_SECRET_ACCESS_KEY
    # ate-api: point its Valkey/Redis client at the in-namespace Valkey CR rather
    # than any bundled Redis. VERIFY-BEFORE-DEPLOY: real key path unknown.
    ateApi:
      redis:
        host: "substrate-valkey.ate-system.svc.cluster.local"
        port: 6379
    # Don't let the chart spin up its own Redis — the Valkey CR above provides it.
    redis:
      enabled: false
