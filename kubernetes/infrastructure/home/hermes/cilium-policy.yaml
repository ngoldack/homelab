# hermes Cilium policies — default-deny inbound + outbound. The gateway's
# only egress is the explicit allowlist in the second document below:
# cluster DNS, the sandbox Router :8080, adopted sandbox pods :9090, the
# Kubernetes API 443/6443 (SandboxClaim lifecycle only), agentgateway :80,
# the authentik issuer host 443 (dashboard OIDC), and two public-internet
# rules on 443 (PyPI + GitHub fetches). Ingress is exactly one grant: the
# edge Gateway serving the dashboard port for hermes.ngoldack.de. The API
# port 8642 stays closed: it is reached via kubectl exec / in-pod loops and
# nothing in-cluster calls the gateway.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-default-deny
  namespace: hermes
spec:
  description: >-
    Deny-all baseline for the gateway pod. The allow doc below carves out
    exactly the egress Hermes needs; nothing is permitted inbound.
  endpointSelector:
    matchLabels: {}
  ingress:
    - {}
  egress:
    - {}
---
# hermes allowlist — the complete grant set, one rule per destination.
# Ingress (exactly one):
#   * cilium ingress entity    9119       — the edge Gateway serving
#     hermes.ngoldack.de (dashboard). The dashboard authenticates the user
#     itself via OIDC; port 8642 is deliberately NOT granted, so the
#     OpenAI-compatible API cannot be reached from the edge.
# Egress:
#   * kube-dns (kube-system)   UDP/TCP 53 — cluster DNS
#   * sandbox-router           8080       — Router REST file transfer
#   * hermes-sandbox pods      9090       — gRPC exec into adopted sandboxes
#   * kube-apiserver           443/6443   — SandboxClaim lifecycle only:
#     network reach to the API server exists, but its use is the in-cluster
#     SDK's claim CRUD (RBAC is scoped to that), not a management plane
#   * agentgateway             80         — in-cluster model API
#   * PyPI / Fastly anycast    443        — Hermes lazy dep installs
#   * GitHub raw content       443        — dashboard model catalogue +
#     update-banner fetches
# The PyPI and GitHub rules are the widest grants in this set: plain CIDR
# sets on 443, not FQDN-scoped.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-allowlist
  namespace: hermes
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
  ingress:
    # The edge Gateway reaches this pod as the cilium "ingress" entity (its
    # envoy data plane), health checks as "health" — the same shape as
    # ../../langfuse/cilium-allowlist.yaml.
    - fromEntities:
        - ingress
        - health
      toPorts:
        - ports:
            - port: "9119"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Router REST for file transfer (v2 scoped tokens).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agent-sandbox-system
            app.kubernetes.io/name: sandbox-router
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Direct gRPC exec into adopted sandboxes (user-approved fallback).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes-sandbox
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Kubernetes API for SandboxClaim lifecycle ONLY (approved claim-RBAC:
    # the in-cluster SDK creates/reads/deletes claims; no other k8s verbs).
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # Explicit ClusterIP of svc/kubernetes alongside toEntities:
    # kube-apiserver: entity resolution can race on apiserver endpoint
    # churn, and the /32 pins the API's virtual IP instead of the whole
    # service CIDR.
    - toCIDRSet:
        - cidr: 172.21.0.1/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # Model API — internal AI gateway (agentgateway data plane, ns
    # agentgateway). Hermes config.yaml points custom provider 'agentgateway'
    # at agentgateway.agentgateway.svc:80/v1, so egress is to that namespace's
    # proxy endpoints on :80 instead of the old OpenRouter Cloudflare ranges.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentgateway
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # PyPI for Hermes lazy-dep installs (faster-whisper, edge-tts, …) —
    # widest grant in this set: three Fastly anycast /16s on 443, not
    # FQDN-scoped.
    - toCIDRSet:
        - cidr: 151.101.0.0/16  # Fastly anycast (pypi.org simple index)
        - cidr: 146.75.0.0/16   # Fastly anycast (files.pythonhosted.org)
        - cidr: 199.232.0.0/16  # Fastly anycast (additional edge ranges)
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Model catalogue + app update fetches (advisory; keeps the dashboard's
    # model list and update banner working) — four GitHub raw-content /22s
    # on 443, not FQDN-scoped.
    - toCIDRSet:
        - cidr: 185.199.108.0/22
        - cidr: 185.199.109.0/22
        - cidr: 185.199.110.0/22
        - cidr: 185.199.111.0/22
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Dashboard OIDC (discovery, authorization-code token exchange, ID-token
    # JWKS) all go to the issuer host, which MUST stay the browser-visible
    # URL (https://authentik.ngoldack.de/application/o/hermes-dashboard/) so
    # the ID token's `iss` matches what the browser used. From inside the pod
    # that hostname resolves to the Hetzner edge address (verified: getent
    # hosts in the gateway pod → 2.28.31.116), and toFQDNs rules are inert in
    # this cluster, so the /32 is the only workable form.
    - toCIDRSet:
        - cidr: 2.28.31.116/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
