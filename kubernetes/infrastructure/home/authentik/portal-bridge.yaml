# Portal bridge for the edge path.
#
# Why it exists: Cilium's gateway data plane is the host-netns
# cilium-envoy DaemonSet, and host-origin traffic reaches ONLY node-local
# pods on this cluster (bidirectionally verified live: hetzner-host→home-pod
# and home-host→hetzner-pod both fail; the earlier 10.30.0.21 "503 only on
# hetzner" pattern was the same law plus an endpoint lottery). The outpost
# never noticed because it is a regular pod — and pods reach ClusterIPs
# across sites over the overlay+KubeSpan fine.
#
# So the edge authentik route terminates here instead of at the server
# directly: a pod-netns nginx on the Hetzner node that proxies to the
# in-cluster Service. One extra hop, ~zero maintenance, and the only
# component that ever needs it is this portal route — every other edge app
# goes through the outpost, which already solves it the same way.
#
# arm64 image; sits next to the outpost behind the same taint.
apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-bridge-config
  namespace: authentik
data:
  nginx.conf: |
    events {}
    http {
      resolver 172.21.0.10 valid=10s ipv6=off;
      server {
        listen 9100;
        # WebSocket upgrade pass-through for the flow UI
        proxy_http_version 1.1;
        location / {
          set $upstream http://authentik-server.authentik.svc.cluster.local;
          proxy_pass $upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $http_connection;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-bridge
  namespace: authentik
  labels:
    app.kubernetes.io/name: portal-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-bridge
    spec:
      nodeSelector:
        topology.homelab/site: cloud
      tolerations:
        - key: dedicated
          value: ingress
          effect: NoSchedule
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.29-alpine
          args: ["-c", "/etc/nginx/nginx.conf", "-fg"]
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
      volumes:
        - name: conf
          configMap:
            configMap:
              name: portal-bridge-config
---
apiVersion: v1
kind: Service
metadata:
  name: portal-bridge
  namespace: authentik
spec:
  selector:
    app.kubernetes.io/name: portal-bridge
  ports:
    - name: http
      port: 9100
      targetPort: 9100
