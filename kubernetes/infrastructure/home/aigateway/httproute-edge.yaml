# llm.ngoldack.de on the EDGE path — the PUBLIC route to the AI Gateway.
#
# Always points at the Envoy AI Gateway's data plane (the envoy-aigateway-*
# Service in envoy-gateway-system), never at a model backend directly. The
# model choice is made by the client through x-ai-eg-model + "model" in the
# body (see models.yaml / local.yaml / synthetic.yaml for the wired names:
# deepseek/*, local, default, small, vision).
#
# Auth: EAG's SecurityPolicy (jwt.yaml) validates the client's Bearer token
# against authentik's JWKS — the aigateway-oidc client_credentials provider in
# ../authentik/seed.yaml mints those tokens. The old authentik-outpost Basic
# path was retired: the outpost's M2M auth rejected every programmatic
# credential (Basic attribute, API token) and only ever served browser
# sessions.
#
# Cross-namespace: the backendRef to envoy-gateway-system is pre-authorized by
# the ReferenceGrant in ../network/envoy-gateway-referencegrant.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: local-llm-edge
  namespace: aigateway
spec:
  parentRefs:
    - name: edge
      namespace: network
      sectionName: https-apex
  hostnames:
    - llm.${CLUSTER_DOMAIN}
  rules:
    - backendRefs:
        - name: envoy-aigateway-aigateway-d6fc2393
          namespace: envoy-gateway-system
          port: 80
