apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: localai
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: localai
  chart:
    spec:
      chart: localai
      version: "3.5.0"
      sourceRef:
        kind: HelmRepository
        name: localai
      interval: 1h
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values:
    # Run only on worker-ai tainted node
    nodeSelector:
      ai: "true"
    tolerations:
      - key: "ai"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

    # CPU-only configuration
    gpus: 0
    resources:
      requests:
        cpu: "4"
        memory: "8Gi"
      limits:
        cpu: "8"
        memory: "16Gi"

    # Storage for huggingface/downloaded files
    persistence:
      enabled: true
      storageClass: tns-csi-fast-nfs
      size: 50Gi

    # Mount the custom models ConfigMap to /build/models
    extraVolumes:
      - name: models-config
        configMap:
          name: localai-models
    extraVolumeMounts:
      - name: models-config
        mountPath: /build/models

    # Enable OpenTelemetry Instrumentation & metrics support
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318"
      # Expose Prometheus compatible metrics endpoint natively
      METRICS: "true"
