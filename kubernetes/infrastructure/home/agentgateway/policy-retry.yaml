# Retry policy for the key-authenticated routes: when a backend answers 429
# or 500, retry up to 3 times (attempts counts the initial attempt, so 4 = one try plus 3 retries)
# after 1s. Retries prefer a different backend, so combined with the health
# policies' eviction this produces transparent failover — the client never
# sees the first error. Without eviction, a retry loops onto the same
# failing group.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: key-route-retry
  namespace: agentgateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: local-llm-key
  traffic:
    retry:
      attempts: 4
      backoff: 1s
      # 503 is synthetic-proxy's "this leg is unhealthy" signal: it rewrites
      # failover-worthy upstream answers AND its own local refusals to 503, and
      # the health policy evicts on `response.code >= 500`. So 503 MUST be
      # retried here, or the in-flight failover never happens and the client
      # sees the 503 instead of the OpenRouter answer. 502/504 are the same
      # class. 429 stays for a transient parallel-limit answer, which the proxy
      # deliberately passes through untouched.
      codes:
        - 429
        - 500
        - 502
        - 503
        - 504
