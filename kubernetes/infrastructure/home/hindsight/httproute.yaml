# LAN-only exposure of the Hindsight API on the internal Gateway
# (10.30.0.200); the LAN external-dns instance owns the record (publish=lan).
# hindsight.ngoldack.de → API :8888.
#
# The control-plane UI does NOT expose a LAN route anymore: hindsight-ui lives
# on the edge behind the authentik outpost (httproutes-edge.yaml) — one
# identity-gated path everywhere, consistent with headlamp/grafana.
#
# The API has no auth layer of its own (multi-tenant auth is a custom
# TenantExtension), so it stays on the trusted network; agents reach it via
# ClusterIP (Teleport routes 10.30.0.0/24), the LAN VIP is convenience only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hindsight-api
  namespace: hindsight
  labels:
    dns.ngoldack.de/publish: lan
spec:
  parentRefs:
    - name: public
      namespace: network
      sectionName: https-apex
  hostnames:
    - hindsight.${CLUSTER_DOMAIN}
  rules:
    - backendRefs:
        - name: hindsight-api
          port: 8888
