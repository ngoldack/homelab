# Firecrawl workloads: api + queue worker + nuq worker (all the same image,
# differing only by entrypoint and FLY_PROCESS_GROUP) and the playwright
# scraping microservice. RabbitMQ is intentionally omitted (NUQ_RABBITMQ_URL
# unset) so queueing runs Postgres-only; extract/prefetch workers are skipped.
#
# Self-hosted Firecrawl bypasses auth (USE_DB_AUTHENTICATION=false), so the api
# is reachable in-cluster with no token. Images are :latest (upstream publishes
# no semver tags).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firecrawl-api
  namespace: firecrawl
  labels:
    app.kubernetes.io/name: firecrawl-api
    app.kubernetes.io/part-of: firecrawl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: firecrawl-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: firecrawl-api
        app.kubernetes.io/part-of: firecrawl
    spec:
      containers:
        - name: api
          image: ghcr.io/firecrawl/firecrawl:latest
          command: ["node", "--max-old-space-size=6144", "dist/src/index.js"]
          envFrom:
            - configMapRef:
                name: firecrawl-config
            - secretRef:
                name: firecrawl-secrets
          env:
            - name: FLY_PROCESS_GROUP
              value: app
          ports:
            - name: http
              containerPort: 3002
          readinessProbe:
            httpGet:
              path: /v0/health/readiness
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /v0/health/liveness
              port: 3002
            initialDelaySeconds: 40
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "7Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: firecrawl-api
  namespace: firecrawl
  labels:
    app.kubernetes.io/name: firecrawl-api
    app.kubernetes.io/part-of: firecrawl
spec:
  selector:
    app.kubernetes.io/name: firecrawl-api
  ports:
    - name: http
      port: 3002
      targetPort: 3002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firecrawl-worker
  namespace: firecrawl
  labels:
    app.kubernetes.io/name: firecrawl-worker
    app.kubernetes.io/part-of: firecrawl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: firecrawl-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: firecrawl-worker
        app.kubernetes.io/part-of: firecrawl
    spec:
      containers:
        - name: worker
          image: ghcr.io/firecrawl/firecrawl:latest
          command: ["node", "--max-old-space-size=3072", "dist/src/services/queue-worker.js"]
          envFrom:
            - configMapRef:
                name: firecrawl-config
            - secretRef:
                name: firecrawl-secrets
          env:
            - name: FLY_PROCESS_GROUP
              value: worker
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firecrawl-nuq-worker
  namespace: firecrawl
  labels:
    app.kubernetes.io/name: firecrawl-nuq-worker
    app.kubernetes.io/part-of: firecrawl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: firecrawl-nuq-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: firecrawl-nuq-worker
        app.kubernetes.io/part-of: firecrawl
    spec:
      containers:
        - name: nuq-worker
          image: ghcr.io/firecrawl/firecrawl:latest
          command: ["node", "--max-old-space-size=3072", "dist/src/services/worker/nuq-worker.js"]
          envFrom:
            - configMapRef:
                name: firecrawl-config
            - secretRef:
                name: firecrawl-secrets
          env:
            - name: FLY_PROCESS_GROUP
              value: nuq-worker
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
---
# Playwright scraping microservice (separate image). The api/workers reach it
# via PLAYWRIGHT_MICROSERVICE_URL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firecrawl-playwright
  namespace: firecrawl
  labels:
    app.kubernetes.io/name: firecrawl-playwright
    app.kubernetes.io/part-of: firecrawl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: firecrawl-playwright
  template:
    metadata:
      labels:
        app.kubernetes.io/name: firecrawl-playwright
        app.kubernetes.io/part-of: firecrawl
    spec:
      containers:
        - name: playwright
          image: ghcr.io/firecrawl/playwright-service:latest
          env:
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        # Chromium needs more than the default 64MB /dev/shm.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: firecrawl-playwright
  namespace: firecrawl
  labels:
    app.kubernetes.io/name: firecrawl-playwright
    app.kubernetes.io/part-of: firecrawl
spec:
  selector:
    app.kubernetes.io/name: firecrawl-playwright
  ports:
    - name: http
      port: 3000
      targetPort: 3000
