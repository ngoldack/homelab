apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: security-system
  chart:
    spec:
      chart: trivy-operator
      version: "0.33.x"
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Expose the operator's findings metrics (trivy_image_vulnerabilities, enabled
    # by default via operator.metricsFindingsEnabled) to the cluster-wide OTel
    # prometheus scrape (helmrelease-otel-gateway) -> VictoriaMetrics -> vmalert.
    # The operator serves /metrics on container port 8080.
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
      prometheus.io/path: "/metrics"
    trivy:
      # Use lightweight standalone mode, rather than client-server
      mode: Standalone
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

    operator:
      # Exclude noisy system namespaces to keep CPU/memory cycles down
      targetNamespaces: ""  # scan all namespaces except excluded
      excludeNamespaces: "kube-system,flux-system,monitoring"
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 256Mi
