# Hindsight — agent memory that learns (vectorize-io/hindsight, MIT).
# Self-hosted after the Hindsight Cloud credits ran out; the client just
# repoints base_url.
# LLM: OpenRouter DIRECT (2026-09-16) — single model
# ~deepseek/deepseek-v4-flash-latest at low reasoning effort, strictly JSON
# via STRICT_SCHEMA. The prior 3-member failover chain (incl. the local
# qwen3-27b leg) made startup verification cross the chart's 30s liveness
# budget, crash-looping the API pod mid-boot — removed 2026-09-13. The
# in-cluster Envoy AI Gateway hop (model "chat") was removed 2026-09-16
# because the aigateway controller is crash-looping and its routes 500;
# restore it once the gateway is healthy (see the api env block).
#
# Embeddings + reranker stay on the chart defaults (LOCAL bge-small-en-v1.5 /
# ms-marco-MiniLM in-process on CPU): they are small, they run per-pod, and
# they need no GPU. The model files (~200 MB) re-download into the container
# cache on pod restart — accepted; the alternative is a RWO PVC that pins the
# pods to one node for a 30-second download.
# DB: CNPG (hindsight-database + the Database CR that owns vector/pg_trgm),
# password shared with the chart via existingSecret (key postgres-password).
# The chart's bundled ankane/pgvector subchart is OFF — every relational store
# here runs on the CNPG operator.
#
# metrics.serviceMonitor stays false: those are prometheus-operator CRDs this
# cluster does not have (the stack is VictoriaMetrics); VMServiceScrapes in
# monitoring/ scrape api:8888 and worker:8889 directly.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hindsight
  namespace: flux-system
spec:
  interval: 1h
  # 20m, not 10m: a worker boots in 2-5 min (sentence_transformers model
  # download), and two simultaneous worker restarts under the 10m budget
  # marked the install/upgrade stalled — the remediation then DELETED the
  # sts before the workers ever finished, and every retry churned the same
  # way (2026-09-18 outage: repeated install-fail/delete cycles from 17:00).
  timeout: 20m
  chart:
    spec:
      chart: hindsight
      version: "0.9.2"
      sourceRef:
        kind: HelmRepository
        name: hindsight
      interval: 1h
  targetNamespace: hindsight
  releaseName: hindsight
  install:
    createNamespace: false
    remediation:
      # 0: a failed install wait must NOT trigger remediation (which
      # deleted the worker sts mid-boot and caused the 17:00-19:00 churn).
      # A failed install leaves the resources running; the next reconcile
      # upgrades them instead of reinstalling from scratch.
      retries: 0
  upgrade:
    remediation:
      # Once the release latches "failed" (a transient sts-health blip marked
      # every history entry failed across the model swap), a plain retry won't
      # move off it because there's no "last successful" to roll back to.
      # Force replacement of the current (failed) revision's helm state on the
      # next reconcile; the deployed resources are already healthy.
      remediateLastFailure: true
      retries: 3
  # No dependsOn here: 'cnpg-operator' is a Flux Kustomization, not a
  # HelmRelease — the entry Kustomization (clusters/home/hindsight.yaml)
  # already waits on it for the CRDs.
  values:
    existingSecret: hindsight-env
    postgresql:
      enabled: false
      external:
        host: hindsight-database-rw
        port: 5432
        database: hindsight
        username: hindsight
    api:
      # Conservative cpu REQUEST (500m chart default vs ~284m free on the sole
      # untolerated home node talos-3bi) was stalling the API replacement pod
      # at 97% node cpu requests. The API is latency-sensitive I/O (recall),
      # not CPU-bound: request 200m (same as the workers) so it schedules;
      # limits stay generous for burst.
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          cpu: 2
          memory: 4Gi
      env:
        HINDSIGHT_API_LLM_PROVIDER: openai
        # agentgateway synthetic OVER (2026-09-18): telemetry-tracer OpenAI-compatible API.
        # The retryable synthetic model hf/openai/gpt-oss-120b is pulled from the
        # agentgateway backend named synthetic (api.synthetic.new), verified on
        # 2026-09-16. The base URL stays OpenAI-compatible (/v1/...), the model
        # name matches the backend's openai.model stanza.
        HINDSIGHT_API_LLM_BASE_URL: http://agentgateway.agentgateway.svc.cluster.local:80/v1/key/synthetic-gpt-oss
        HINDSIGHT_API_LLM_MODEL: hf:openai/gpt-oss-120b
        # Static-key auth (X-Api-Key) via the /v1/key/* route scope: no JWT
        # expiry to rotate. HINDSIGHT_API_LLM_DEFAULT_HEADERS lives in
        # secret.sops.yaml (envFrom injects every key into the pod): the
        # gateway policy reads the key from X-Api-Key; the SDK's own
        # Authorization: Bearer header is harmless on this backend (verified
        # live: both headers together do not clobber the upstream credential).
        # Reasoning LOW + STRICT_SCHEMA so extraction is fast and JSON-only.
        HINDSIGHT_API_LLM_REASONING_EFFORT: "low"
        HINDSIGHT_API_LLM_STRICT_SCHEMA: "true"
        # Extraction bundles a large system schema + chunk; raise timeout.
        HINDSIGHT_API_LLM_TIMEOUT: "600"
        HINDSIGHT_API_LLM_CONNECT_TIMEOUT: "15"
        # Audit logging enabled so ingest paths are visible.
        HINDSIGHT_API_AUDIT_LOG_ENABLED: "true"
        HINDSIGHT_API_RETAIN_LLM_REASONING_EFFORT: "low"
        HINDSIGHT_API_CONSOLIDATION_LLM_REASONING_EFFORT: "medium"
    worker:
      # Dedicated workers (not the API's internal one): retain/consolidation
      # LLM chains are long and must not starve recall latency on the API pod.
      enabled: true
      # Ingest throughput scaling: a single worker serializes every
      # retain/consolidation chain — the measured bottleneck (LLM call ~3s but
      # end-to-end 9-14s/diff; 212s under contention). 2 allow two parallel
      # chains while keeping the home CPU pool schedulable (the 3-worker setup
      # saturated talos-3bi, stalling API/worker rollouts at 98% cpu requests).
      # Chart default is 2.
      replicaCount: 2
      # Memory raised twice on 2026-09-18: first to 3Gi (OOM during
      # sentence_transformers load), then to 5Gi — after the outage backlog
      # re-fired, each worker claimed up to 20 retained tasks per poll and
      # OOM-killed (exit 137) ~5s after starting the polling loop, with
      # connection verification already passed. The api (4Gi) drains the
      # same queue without OOM; 5Gi covers the burst. cpu stays 1000m.
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 5Gi
      # Spread the 2 worker replicas across the two home nodes (podAntiAffinity):
      # both can otherwise co-schedule on one 10-core node and, being burstable
      # to 1000m each, compete for CPU during retain bursts — the exact
      # contention that showed 212s/diff. Workers are I/O-bound on OpenRouter, so
      # spreading only helps; preferred (not required) so placement still works if
      # one home node is full.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: worker
                topologyKey: kubernetes.io/hostname
      # env written out IN FULL (not `*llm-env`): a YAML anchor substitutes the
      # whole map and cannot be appended to. The worker needs the same model
      # config (the chart does NOT merge api.env into the worker) PLUS its
      # batch/poll tunables.
      env:
        HINDSIGHT_API_LLM_PROVIDER: openai
        # agentgateway synthetic OVER (2026-09-18): same model as the api.
        HINDSIGHT_API_LLM_BASE_URL: http://agentgateway.agentgateway.svc.cluster.local:80/v1/key/synthetic-gpt-oss
        HINDSIGHT_API_LLM_MODEL: hf:openai/gpt-oss-120b
        # Static-key auth (X-Api-Key) via the /v1/key/* route scope: no JWT
        # expiry to rotate. HINDSIGHT_API_LLM_DEFAULT_HEADERS lives in
        # secret.sops.yaml (envFrom injects every key into the pod): the
        # gateway policy reads the key from X-Api-Key; the SDK's own
        # Authorization: Bearer header is harmless on this backend (verified
        # live: both headers together do not clobber the upstream credential).
        HINDSIGHT_API_LLM_REASONING_EFFORT: "low"
        HINDSIGHT_API_LLM_STRICT_SCHEMA: "true"
        HINDSIGHT_API_LLM_TIMEOUT: "600"
        HINDSIGHT_API_LLM_CONNECT_TIMEOUT: "15"
        # Tasks claimed per poll cycle to match 2 replica balance.
        HINDSIGHT_API_WORKER_BATCH_SIZE: "20"
        # Audit logging enabled for the worker too.
        HINDSIGHT_API_AUDIT_LOG_ENABLED: "true"
        HINDSIGHT_API_RETAIN_LLM_REASONING_EFFORT: "low"
        HINDSIGHT_API_CONSOLIDATION_LLM_REASONING_EFFORT: "medium"
    controlPlane:
      enabled: true
    nodeSelector:
      topology.homelab/site: home
    podDisruptionBudget:
      enabled: false
