# Synthetic models via the AI Gateway — three downstream routes.
#
# Synthetic (https://synthetic.new) is OpenAI-compatible at
# https://api.synthetic.new/v1 (verified: GET /v1/models returns the model
# list; POST /v1/chat/completions expects an Authorization header). Like the
# OpenRouter backends in models.yaml, an OpenAI-compatible provider with a
# custom path is expressed as schema {name: OpenAI, prefix: /v1}.
#
# Downstream model tokens (what clients send as "model" and in the
# x-ai-eg-model header; EAG routes on that header):
#   - default  -> syn:large:text       (GLM-5.3-Flash, 524k ctx, has vision)
#   - small    -> syn:small:text       (GLM-4.7-Flash, 196k ctx, text only)
#   - large    -> hf:deepseek-ai/DeepSeek-V4.1-Flash (524k ctx, vision)
#   - vision   -> hf:moonshotai/Kimi-K3 (524k ctx, vision)
#
# "default" is the plain-OpenAI-SDK default chat model; "small" is the cheap
# text tier; "vision" pins Kimi-K3 explicitly for image input even though
# syn:large:text also accepts images.
#
# Auth: BackendSecurityPolicy reads the Synthetic key from the synthetic-key
# Secret (key "apiKey", the only key the CRD accepts). Decrypted from
# synthetic-key.sops.yaml in this same aigateway/ tree.
#
# TLS: the backend is external, so the EG Backend is paired with a
# BackendTLSPolicy against the system CA (wellKnownCACertificates: System).

# ---- Synthetic upstream backend (Envoy Gateway) ----
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: synthetic
  namespace: aigateway
spec:
  endpoints:
    - fqdn:
        hostname: api.synthetic.new
        port: 443
---
# TLS for the upstream against the system trust store.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: synthetic-tls
  namespace: aigateway
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: synthetic
  validation:
    wellKnownCACertificates: System
    hostname: api.synthetic.new

# ---- AI service backend (EAG) ----
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: synthetic
  namespace: aigateway
spec:
  schema:
    name: OpenAI
    prefix: /v1
  backendRef:
    name: synthetic
    kind: Backend
    group: gateway.envoyproxy.io

# ---- Auth: Synthetic API key ----
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: synthetic-key
  namespace: aigateway
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: synthetic
  type: APIKey
  apiKey:
    secretRef:
      name: synthetic-key
      namespace: aigateway

# ---- Routes: map the three downstream model tokens ----
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: synthetic
  namespace: aigateway
spec:
  parentRefs:
    - name: aigateway
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: default
      backendRefs:
        - name: synthetic
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: small
      backendRefs:
        - name: synthetic
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: large
      backendRefs:
        - name: synthetic
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: vision
      backendRefs:
        - name: synthetic
