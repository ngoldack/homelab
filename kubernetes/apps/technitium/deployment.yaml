# Technitium DNS Server — SINGLE plain authoritative DNS on the Hetzner edge (NO HA).
# Serves the authoritative zone(s) for ${DOMAIN} and is the RFC-2136 dynamic-update
# target for external-dns-internal (technitium.dns.svc.cluster.local:53). It is NOT a
# public recursive nameserver: ClusterIP only, no hostPort — port 53 stays in-cluster.
#
# VERIFY-BEFORE-DEPLOY:
#   - Pin a real `technitium/dns-server` tag (GPL-3.0). The tag below is a placeholder;
#     confirm the current stable release on Docker Hub before deploying.
#   - The env only SEEDS the primary domain + the admin password on first boot. The
#     TSIG key (consumed by external-dns-internal: Secret `technitium-tsig`, alg
#     hmac-sha256) and the zone itself (primary zone for ${DOMAIN} with dynamic
#     UPDATE + zone-transfer/AXFR enabled for the TSIG key) MUST be configured in
#     Technitium on first boot via the admin UI (:5380) or API. They are not seeded here.
#   - securityContext below runs non-root + binds :53 via NET_BIND_SERVICE. The upstream
#     image historically runs as root; if it fails to start or bind :53, relax
#     runAsNonRoot/runAsUser (fsGroup already grants the PVC to gid 1000).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: technitium
  namespace: dns
  labels:
    app.kubernetes.io/name: technitium
spec:
  replicas: 1
  strategy:
    # Single RWO PVC on a single edge node — never run two pods against it at once.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: technitium
  template:
    metadata:
      labels:
        app.kubernetes.io/name: technitium
    spec:
      nodeSelector:
        node-role: edge
      tolerations:
        - key: node-role
          value: edge
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: technitium
          # renovate: datasource=docker depName=technitium/dns-server
          image: technitium/dns-server:13.6.0
          env:
            # Seeds the server's primary domain (NS hostname) on first boot only.
            - name: DNS_SERVER_DOMAIN
              value: ns1.${DOMAIN}
            # Admin password for the :5380 web console / API (first-boot seed).
            - name: DNS_SERVER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: technitium-admin
                  key: admin-password
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: web
              containerPort: 5380
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 5380
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 5380
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            # Technitium persists its config AND all zone data under /etc/dns.
            - name: config
              mountPath: /etc/dns
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              # Bind the privileged DNS port (53) as a non-root user.
              add:
                - NET_BIND_SERVICE
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: technitium-config
