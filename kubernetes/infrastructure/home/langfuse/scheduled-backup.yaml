---
# Scheduled CNPG backups for langfuse via the Barman Cloud plugin. Schedule is
# a 6-field CNPG cron (sec min hour dom mon dow): daily at 02:17 UTC.
# method: plugin routes backups through the barman-cloud plugin named below.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: langfuse-daily-backup
  namespace: langfuse
spec:
  cluster:
    name: langfuse-database
  schedule: "0 17 2 * * *"
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
