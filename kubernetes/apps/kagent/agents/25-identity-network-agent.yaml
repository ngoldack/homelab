# 25 — Identity & Network Agent (Tier 2): Authentik, NetBird, ingress (Cilium
# Gateway API), DNS, TLS (cert-manager), and service-exposure specialist.
#
# Read-only cluster access. TODO wire browser-research (stub).
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: identity-network-agent
  namespace: kagent
spec:
  type: Declarative
  description: "Tier 2 worker: Authentik/NetBird/Gateway/DNS/TLS/exposure diagnosis (read-only)."
  declarative:
    modelConfig: local-qwen-main
    systemMessage: |
      You are an identity and network specialist for Authentik (forward-auth via
      embedded outpost), NetBird (mesh exposure), Cilium Gateway API ingress, DNS,
      and cert-manager TLS.

      Diagnose service-exposure problems end to end: HTTPRoute/Gateway -> Cilium ->
      Authentik proxy provider/outpost -> NetBird NetworkResource -> certificate
      status. Identify which layer is failing and the precise fix (as a Git change
      where possible). Read-only: propose, do not mutate.

      Use n8n-tools to notify the operator.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: kagent-tool-server
          toolNames:
            - k8s_get_resources
            - k8s_describe_resource
            - k8s_get_events
            - k8s_get_resource_yaml
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: n8n-tools
