# kagent CRDs, installed ahead of the controller (separate chart, as upstream
# ships them). HelmRelease ordering: the controller HelmRelease dependsOn this.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent-crds
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: kagent
  chart:
    spec:
      chart: kagent-crds
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: kagent
      interval: 1h
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: kagent
  dependsOn:
    - name: kagent-crds
  chart:
    spec:
      chart: kagent
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: kagent
      interval: 1h
  install:
    createNamespace: true
  values:
    # Defensive: pin restricted-PSA-compliant security contexts on the chart's
    # own pods (controller/UI) so the `kagent` namespace can enforce
    # pod-security.kubernetes.io/enforce: restricted regardless of chart-default
    # drift. (Chart v0.9.x defaults already comply; the tool server, bundled
    # postgres, and kmcp set their own compliant contexts.)
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    # LLM comes directly from the in-cluster vLLM model Services (LiteLLM was
    # removed). A dedicated ModelConfig CRD (apps/kagent) sets the baseUrl; the
    # provider block here just satisfies the chart default (vLLM needs no auth).
    providers:
      default: openAI
      openAI:
        provider: OpenAI
        model: "qwen3-coder-80b"
        apiKeySecretRef: kagent-vllm
        apiKeySecretKey: OPENAI_API_KEY
    # kagent keeps its own (bundled, dev-grade) Postgres for controller/agent
    # state - its own instance, not shared. Long-term/semantic memory is
    # delegated to Mem0 (MCP), so pgvector is not required here.
    database:
      postgres:
        vectorEnabled: false
        bundled:
          enabled: true
          storage: 2Gi
    # Tool server (subchart kagent-tools): the component that runs kubectl/helm.
    # By DEFAULT the chart grants it cluster-admin (*/*/*). Disable the chart RBAC
    # and bind our own scoped ClusterRole instead (tool-server-rbac.yaml). The SA
    # is still created by the chart. tokenPassthrough stays false so this SA is
    # the privilege boundary; trim the loaded tool families to what we use.
    kagent-tools:
      rbac:
        create: false
      tools:
        enabledTools: ["k8s", "helm", "utils"]
        k8s:
          tokenPassthrough: false
    ui:
      replicas: 1
    # Trim the bundled fleet of built-in agents/tools that need external APIs or
    # aren't used here. (Also required for restricted PSA: bundled demo agents
    # ship no securityContext and the controller only copies SC from the Agent CR,
    # so they cannot pass `restricted` — we run our own SC-hardened agents.)
    k8s-agent:
      enabled: false
    querydoc:
      enabled: false
    grafana-mcp:
      enabled: false
    istio-agent:
      enabled: false
    kgateway-agent:
      enabled: false
    argo-rollouts-agent:
      enabled: false
    promql-agent:
      enabled: false
    observability-agent:
      enabled: false
    helm-agent:
      enabled: false
    cilium-policy-agent:
      enabled: false
    cilium-manager-agent:
      enabled: false
    cilium-debug-agent:
      enabled: false
    # Emit OpenTelemetry traces to the OTel gateway, which fans them out to BOTH
    # Tempo (infra trace correlation) and Phoenix (LLM-specific analysis).
    otel:
      tracing:
        enabled: true
        exporter:
          otlp:
            endpoint: "otel-gateway.monitoring.svc.cluster.local:4317"
            protocol: "grpc"
            insecure: true
    # Agent Substrate (gVisor) wiring so SandboxAgents (finance/mail) can run.
    # EXPERIMENTAL. VERIFY-BEFORE-DEPLOY: all key paths below are unconfirmed —
    # diff against `helm show values` for the installed kagent chart; Helm ignores
    # unknown values, so a wrong path silently no-ops (substrate stays off).
    controller:
      substrate:
        enabled: true
        ateApiEndpoint: "http://ate-api.ate-system.svc.cluster.local:8080"
    substrateWorkerPool:
      create: true
      ateomImage: "ghcr.io/kagent-dev/substrate/ateom-gvisor:0.x"
