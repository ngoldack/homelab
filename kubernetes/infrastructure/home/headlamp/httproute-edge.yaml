# Headlamp via native OIDC — the ONLY path (LAN twin route retired with the
# split-horizon design; the cluster-admin-bound UI is identity-gated
# everywhere). Headlamp does its OWN OIDC handshake against authentik, so
# this backend is headlamp's Service directly (NOT the authentik outpost —
# the outpost proxy would break headlamp's OIDC callback). Unauthenticated
# requests are redirected by headlamp to authentik itself.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp-edge
  namespace: headlamp
spec:
  parentRefs:
    - name: edge
      namespace: network
      sectionName: https-apex
  hostnames:
    - headlamp.ngoldack.de
  rules:
    - backendRefs:
        - name: headlamp-headlamp
          port: 80
