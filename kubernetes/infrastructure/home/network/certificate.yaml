# Single wildcard certificate for all services: {app}.{namespace}.svc.{domain}.
# One cert serves every app, so no per-app issuance is needed. Stored in the
# `network` namespace next to the Cilium Gateway that references it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-svc-tls
  namespace: network
spec:
  secretName: wildcard-svc-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  # Both levels. "*.${CLUSTER_DOMAIN}" covers immich.ngoldack.de; a wildcard
  # matches exactly ONE label, so it does NOT cover anything under svc. — hence
  # keeping "*.svc.${CLUSTER_DOMAIN}" alongside it rather than replacing it, so
  # existing svc. names keep working while shorter names become possible.
  dnsNames:
    - "*.${CLUSTER_DOMAIN}"
    - "*.svc.${CLUSTER_DOMAIN}"
    - "${CLUSTER_DOMAIN}"
