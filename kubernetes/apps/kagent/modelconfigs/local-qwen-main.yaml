# Primary reasoning/tool-use model: the in-cluster qwen3-coder-80b vLLM
# Deployment, reached directly over its Service (LiteLLM was removed). vLLM needs
# no auth; the kagent-vllm secret carries the dummy key the OpenAI client wants.
#
# VERIFY-BEFORE-DEPLOY: confirm the ModelConfig apiVersion/fields against the
# installed kagent CRDs (group kagent.dev; spec targets v1alpha2).
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: local-qwen-main
  namespace: kagent
spec:
  model: "qwen3-coder-80b"
  provider: OpenAI
  openAI:
    baseUrl: "http://qwen3-coder-80b.vllm.svc.cluster.local/v1"
  apiKeySecret: kagent-vllm
  apiKeySecretKey: OPENAI_API_KEY
# TODO(spec): add a `local-embedding-model` ModelConfig pointing at the TEI
# embeddings Service once kagent-native pgvector memory is enabled (memory is
# currently handled by Mem0, which embeds via vLLM directly).
