apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Flux's own namespace: the reconciliation plane gets an allowlist like any
  # other workload namespace, so it is inside the cluster-wide deny floor.
  - flux-system-cilium.yaml
  # The floor itself: every workload namespace not listed as a system
  # namespace is denied in both directions, including namespaces that do not
  # exist yet.
  - cluster-default-deny.yaml
