# Arize Phoenix (OSS) — LLM trace observability. A single container backed by its
# own Postgres (PHOENIX_SQL_DATABASE_URL); ingests OpenTelemetry traces from
# kagent (and any other OTLP source) and serves a trace/eval UI. Replaces the
# heavier Langfuse v3 stack (no ClickHouse / Redis / S3 needed).
#
# Ports: 6006 = web UI + OTLP/HTTP (/v1/traces); 4317 = OTLP/gRPC collector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  namespace: phoenix
  labels:
    app.kubernetes.io/name: phoenix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: phoenix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phoenix
    spec:
      containers:
        - name: phoenix
          # renovate: datasource=docker depName=arizephoenix/phoenix
          image: arizephoenix/phoenix:version-17.10.0
          envFrom:
            - secretRef:
                name: phoenix-secrets
          env:
            - name: PHOENIX_PORT
              value: "6006"
            - name: PHOENIX_GRPC_PORT
              value: "4317"
            - name: PHOENIX_WORKING_DIR
              value: /mnt/data
          ports:
            - name: http
              containerPort: 6006
            - name: otlp-grpc
              containerPort: 4317
          readinessProbe:
            httpGet:
              path: /healthz
              port: 6006
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /mnt/data
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix
  namespace: phoenix
  labels:
    app.kubernetes.io/name: phoenix
spec:
  selector:
    app.kubernetes.io/name: phoenix
  ports:
    - name: http
      port: 6006
      targetPort: 6006
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
