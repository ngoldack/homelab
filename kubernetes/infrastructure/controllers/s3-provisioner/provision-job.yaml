# Replaces the deprecated Bitnami MinIO chart. A plain Job runs the MinIO client
# (mc) against the external TrueNAS RustFS S3 endpoint to create every bucket,
# IAM user and least-privilege policy the cluster needs. The Job is idempotent and
# self-GCs (ttlSecondsAfterFinished); Flux recreates it on the next reconcile, so
# edits to the script or users secret converge automatically.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: s3-provision-script
  namespace: s3-provisioner
data:
  provision.sh: |
    #!/bin/sh
    set -eu

    echo ">> configuring mc alias for ${RUSTFS_ENDPOINT}"
    mc alias set rfs "${RUSTFS_ENDPOINT}" "${ROOT_USER}" "${ROOT_PASSWORD}"

    # --- buckets -----------------------------------------------------------
    for b in authentik-media vllm-models cnpg-backups-rustfs k8s-backups-rustfs; do
      echo ">> ensuring bucket ${b}"
      mc mb --ignore-existing "rfs/${b}"
    done

    # --- helper: create a bucket-scoped policy, the user, then attach -------
    # usage: provision_user <policy> <bucket> <access_key> <secret_key>
    provision_user() {
      policy="$1"; bucket="$2"; ak="$3"; sk="$4"
      [ -z "${ak}" ] && { echo "!! missing access key for ${policy}, skipping"; return 0; }
      cat > "/tmp/${policy}.json" <<JSON
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:*"],
          "Resource": ["arn:aws:s3:::${bucket}", "arn:aws:s3:::${bucket}/*"]
        }
      ]
    }
    JSON
      echo ">> policy ${policy} -> ${bucket}"
      mc admin policy create rfs "${policy}" "/tmp/${policy}.json" 2>/dev/null || \
        mc admin policy create rfs "${policy}" "/tmp/${policy}.json" || true
      echo ">> user ${ak}"
      mc admin user add rfs "${ak}" "${sk}" || true
      mc admin policy attach rfs "${policy}" --user "${ak}" 2>/dev/null || true
    }

    provision_user authentik-media-rw authentik-media "${AUTHENTIK_MEDIA_ACCESS_KEY}" "${AUTHENTIK_MEDIA_SECRET_KEY}"
    provision_user vllm-models-rw vllm-models "${VLLM_ACCESS_KEY}" "${VLLM_SECRET_KEY}"
    provision_user k8s-backups-rw k8s-backups-rustfs "${VELERO_ACCESS_KEY}" "${VELERO_SECRET_KEY}"
    provision_user k8s-backups-rw k8s-backups-rustfs "${TALOS_ACCESS_KEY}" "${TALOS_SECRET_KEY}"
    provision_user cnpg-backups-rw cnpg-backups-rustfs "${KHOJ_ACCESS_KEY}" "${KHOJ_SECRET_KEY}"
    provision_user cnpg-backups-rw cnpg-backups-rustfs "${AUTHENTIK_BACKUP_ACCESS_KEY}" "${AUTHENTIK_BACKUP_SECRET_KEY}"
    provision_user cnpg-backups-rw cnpg-backups-rustfs "${N8N_ACCESS_KEY}" "${N8N_SECRET_KEY}"

    echo ">> s3 provisioning complete"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-provision
  namespace: s3-provisioner
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3-provision
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          # renovate: datasource=docker depName=quay.io/minio/mc
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/provision.sh"]
          env:
            - name: RUSTFS_ENDPOINT
              value: "http://nas-main.server:9000"
            - name: ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: rustfs-admin-credentials
                  key: root-user
            - name: ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rustfs-admin-credentials
                  key: root-password
          envFrom:
            - secretRef:
                name: s3-provisioner-users
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
            - name: mc-config
              mountPath: /.mc
      volumes:
        - name: scripts
          configMap:
            name: s3-provision-script
        - name: tmp
          emptyDir: {}
        - name: mc-config
          emptyDir: {}
