apiVersion: v1
kind: Namespace
metadata:
  name: pandoc
---
# Pandoc (pandoc-server) — fully open-source (GPL-2.0+) document generation,
# replacing Carbone (which is CCL/source-available with paywalled features). It
# converts agent-produced Markdown/HTML into DOCX / PPTX / ODT / HTML with a
# `reference-doc` for styling — the natural fit for AI-generated reports. PDF is
# produced by the already-deployed Gotenberg (this image ships no LaTeX).
# No enterprise tier, no license key, no paid modules.
#
# Sandboxed under gVisor (runsc): it parses untrusted documents and a Haskell
# binary is runsc-friendly.
#
# VERIFY-BEFORE-DEPLOY: confirm the pandoc-server binary is in pandoc/core and the
# port (3030) + health path (/version); pin the image tag. Pandoc has NO XLSX
# writer (spreadsheets are out of scope — see apps/kagent/agents/17).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pandoc
  namespace: pandoc
  labels:
    app.kubernetes.io/name: pandoc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pandoc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pandoc
    spec:
      runtimeClassName: gvisor
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pandoc-server
          # renovate: datasource=docker depName=pandoc/core
          image: pandoc/core:3.10
          command: ["pandoc-server"]
          ports:
            - name: http
              containerPort: 3030
          readinessProbe:
            httpGet:
              path: /version
              port: 3030
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pandoc
  namespace: pandoc
  labels:
    app.kubernetes.io/name: pandoc
spec:
  selector:
    app.kubernetes.io/name: pandoc
  ports:
    - name: http
      port: 3030
      targetPort: 3030
