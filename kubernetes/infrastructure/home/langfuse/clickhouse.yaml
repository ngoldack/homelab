# Minimal ClickHouseCluster (clickhouse-operator v0.0.7) for langfuse: a single
# non-replicated server on the home node.
#
# Field names verified against the live CRD (`kubectl get crd
# clickhouseclusters.clickhouse.com`). NOTE this operator's API differs from
# the Altinity one: no configuration/templates sections; the client-facing
# Service is `<name>-clickhouse-headless.<ns>.svc.cluster.local`.
#
# `keeperClusterRef` references the operator-managed KeeperCluster named
# `langfuse` (the ClickHouseCluster CR does not run Keeper itself; the
# KeeperCluster CR is owned by the clickhouse-operator Kustomization). Required
# by schema — every ClickHouseCluster points at a coordinator KeeperCluster.
#
# Password: `spec.settings.defaultUserPassword` is intentionally OMITTED. The
# operator then renders the `default` ClickHouse user with `no_password`
# (templates/users.yaml.tmpl), which is exactly the passwordless access
# langfuse expects (clickhouse.auth.username: default, no password). Setting
# it would instead emit a CLICKHOUSE_DEFAULT_USER_PASSWORD env via
# secretKeyRef/configMapKeyRef into the server container.
#
# Storage: a single 5Gi PVC claim on the homelab truenas-fast-nfs StorageClass,
# consistent with the other home workloads.
apiVersion: clickhouse.com/v1alpha1
kind: ClickHouseCluster
metadata:
  name: langfuse
  namespace: langfuse
spec:
  shards: 1
  replicas: 1
  containerTemplate:
    image:
      repository: clickhouse/clickhouse-server
      # 26.4 is the langfuse-k8s chart's recommended server version for
      # Langfuse v4: the app's ClickHouse migrations (e.g. 0039_create_events_full)
      # use full-text index syntax `TYPE text(tokenizer = ...)` that ClickHouse
      # 25.7 cannot parse ("Expected literal"), which left migration 39 dirty
      # and web/worker crash-looping. Keeper must stay version-aligned
      # (keeper.yaml).
      hash: "sha256:c7796a1335d14385c052f10061cf719f4a368a908432ec25980860b1333e9ccd"
    # Small/normal resources: modest requests with a memory ceiling that suits
    # the single-node home cluster.
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 2Gi
  podTemplate:
    nodeSelector:
      topology.homelab/site: home
  keeperClusterRef:
    name: langfuse
  dataVolumeClaimSpec:
    resources:
      requests:
        storage: 5Gi
    storageClassName: truenas-fast-nfs
