apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: authentik
  chart:
    spec:
      chart: authentik
      version: "2026.5.2"
      sourceRef:
        kind: HelmRepository
        name: authentik
      interval: 1h
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values:
    # Disable embedded stateful services in favor of cloud-native operators
    postgresql:
      enabled: false
    redis:
      enabled: false

    # Core Authentik configuration. The chart maps authentik.* onto AUTHENTIK_* settings.
    authentik:
      postgresql:
        host: "authentik-postgres-rw.authentik.svc.cluster.local"
        name: "authentik"
        user: "authentik"
        port: 5432
      redis:
        host: "authentik-valkey.authentik.svc.cluster.local"
        port: 6379
      email:
        host: "localhost"
        port: 25
        use_tls: false

    # Secrets are injected via env so they can reference SOPS-managed Kubernetes
    # Secrets instead of being inlined as plaintext values.
    # global.env applies to both the server and worker deployments.
    global:
      env:
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-postgres-app
              key: password
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: secret-key
        # ── Media storage on RustFS (S3-compatible) ────────────────────────────
        # Bucket + authentik-media-rw user are provisioned by the central
        # s3-provisioner Job. ENDPOINT overrides region/USE_SSL; SECURE_URLS=false
        # because the RustFS endpoint is served over plain HTTP on the LAN.
        - name: AUTHENTIK_STORAGE__BACKEND
          value: s3
        - name: AUTHENTIK_STORAGE__S3__BUCKET_NAME
          value: authentik-media
        - name: AUTHENTIK_STORAGE__S3__ENDPOINT
          value: http://nas-main.server:9000
        - name: AUTHENTIK_STORAGE__S3__CUSTOM_DOMAIN
          value: nas-main.server:9000/authentik-media
        - name: AUTHENTIK_STORAGE__S3__SECURE_URLS
          value: "false"
        - name: AUTHENTIK_STORAGE__S3__ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-media-s3
              key: access-key
        - name: AUTHENTIK_STORAGE__S3__SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-media-s3
              key: secret-key

    server:
      replicas: 1

    worker:
      replicas: 1

    # Application proxy providers/outpost are imported from a chart-native blueprint
    # ConfigMap so they are reliably discovered and imported by the worker.
    blueprints:
      configMaps:
        - perplexity-stack-proxy-blueprint
