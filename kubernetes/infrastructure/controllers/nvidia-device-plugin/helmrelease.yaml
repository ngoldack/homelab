# NVIDIA device plugin — advertises the worker-ai node's GPUs to Kubernetes as
# `nvidia.com/gpu` resources so Ollama + the ASR service can request them. The
# driver itself comes from the Talos nonfree-kmod-nvidia extension; this is just
# the k8s-facing plugin (NOT the full GPU Operator, which would try to manage
# drivers that Talos already provides via extensions).
#
# Pinned to the AI node by the ai=true label + toleration, and run under the
# nvidia RuntimeClass so the plugin container can reach the driver/NVML.
#
# VERIFY-BEFORE-DEPLOY: pin the chart version against the nvdp repo; confirm the
# plugin sees the P100s (`kubectl describe node` shows nvidia.com/gpu: 3).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: nvidia-device-plugin
  chart:
    spec:
      chart: nvidia-device-plugin
      version: "0.17.x"
      sourceRef:
        kind: HelmRepository
        name: nvidia-device-plugin
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Run the plugin under the nvidia containerd runtime so it can reach NVML.
    runtimeClassName: nvidia
    # Only the GPU node carries the ai=true label + NoSchedule taint.
    nodeSelector:
      ai: "true"
    tolerations:
      - key: ai
        value: "true"
        effect: NoSchedule
