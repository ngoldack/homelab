# Wildcard certificate for *.${DOMAIN}, issued via Hetzner DNS-01 and stored as a
# Secret in the traefik namespace for the edge Gateway to terminate TLS with.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-tls
  namespace: traefik
spec:
  secretName: wildcard-tls
  issuerRef:
    name: letsencrypt-hetzner-dns
    kind: ClusterIssuer
  commonName: "*.${DOMAIN}"
  dnsNames:
    - "*.${DOMAIN}"
    - "${DOMAIN}"
