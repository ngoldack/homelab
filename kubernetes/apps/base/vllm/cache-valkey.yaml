# Shared Valkey for the AI serving stack:
#   - LMCache remote KV backend (LMCACHE_REMOTE_URL) for the vLLM models, and
#   - LiteLLM's response cache (see apps/base/litellm).
# Provisioned by the Valkey operator; volume on the fast NVMe-oF tier per the
# storage conventions.
apiVersion: valkey.io/v1alpha1
kind: Valkey
metadata:
  name: vllm-cache-valkey
  namespace: vllm
spec:
  replicas: 1
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: tns-fast-nvmeof
        resources:
          requests:
            storage: 8Gi
