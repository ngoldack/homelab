# victoria-metrics-stack-values.yaml

fullnameOverride: vm

# Use VMSingle (single-node, good for homelab)
# Set vmsingle.enabled=false and vmcluster.enabled=true for HA later
vmsingle:
  enabled: true
  spec:
    retentionPeriod: "30d"
    storage:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi

vmcluster:
  enabled: false

# VMAgent scrapes metrics and sends to VMSingle
vmagent:
  enabled: true
  spec:
    selectAllByDefault: true

# VMAlert for alerting rules
vmalert:
  enabled: true

# Alertmanager
alertmanager:
  enabled: true

# Grafana
grafana:
  enabled: true
  persistence:
    enabled: true
    size: 2Gi
  adminPassword: changeme   # change this!
  ingress:
    enabled: false          # enable later when you have ingress controller
  sidecar:
    datasources:
      enabled: true
    dashboards:
      enabled: true

# Node metrics
prometheus-node-exporter:
  enabled: true

# Kubernetes state metrics
kube-state-metrics:
  enabled: true

# Default dashboards (Kubernetes cluster, nodes, pods etc.)
defaultDashboards:
  enabled: true
