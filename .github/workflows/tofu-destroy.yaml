name: OpenTofu Destroy

# DANGER: tears down managed infrastructure. Manual dispatch ONLY, gated behind
# the protected "production" GitHub Environment, and requires the operator to
# type the exact confirmation string below to proceed.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy-production" to confirm'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tofu-state
  cancel-in-progress: false

jobs:
  destroy:
    name: OpenTofu Destroy
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: tofu
    steps:
      - name: Validate Confirmation Input
        working-directory: .
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "destroy-production" ]; then
            echo "::error::Confirmation string did not match. Aborting."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to NetBird VPN Mesh
        uses: Alemiz112/netbird-connect@v1
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}

      - name: Setup Age Decryption Key
        run: |
          set -euo pipefail
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.7.2

      - name: Install SOPS & yq
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/sops \
            https://github.com/getsops/sops/releases/latest/download/sops-v3.9.1.linux.amd64
          sudo chmod +x /usr/local/bin/sops
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: OpenTofu Init
        env:
          SOPS_AGE_KEY_FILE: /home/runner/.config/sops/age/keys.txt
        run: |
          set -euo pipefail
          passphrase="$(sops -d secret.sops.yaml | yq '.state_encryption_passphrase')"
          export TF_ENCRYPTION="key_provider \"pbkdf2\" \"statekey\" { passphrase = \"${passphrase}\" }"
          tofu init -lockfile=readonly

      - name: OpenTofu Destroy
        env:
          SOPS_AGE_KEY_FILE: /home/runner/.config/sops/age/keys.txt
        run: |
          set -euo pipefail
          passphrase="$(sops -d secret.sops.yaml | yq '.state_encryption_passphrase')"
          export TF_ENCRYPTION="key_provider \"pbkdf2\" \"statekey\" { passphrase = \"${passphrase}\" }"
          tofu destroy -auto-approve -no-color -input=false
