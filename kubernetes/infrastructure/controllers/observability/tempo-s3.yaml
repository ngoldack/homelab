# SeaweedFS S3 wiring for Tempo trace storage: an IAM identity + generated
# credentials Secret (tempo-s3-credentials, AWS_*-named keys consumed via
# extraEnvFrom in helmrelease-tempo.yaml) and the tempo-traces bucket owned by
# that identity. Replaces the previous Crossplane-provisioned MinIO user/bucket.
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: tempo
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: tempo
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  identityRef:
    name: tempo
  secretRef:
    name: tempo-s3-credentials
    accessKeyField: AWS_ACCESS_KEY_ID
    secretKeyField: AWS_SECRET_ACCESS_KEY
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: tempo-traces
spec:
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  reclaimPolicy: Retain
  owner: tempo
  access:
    - user: tempo
      actions: [Read, Write, List, Tagging, Admin]
