name: Validate Homelab Configs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-tofu:
    name: OpenTofu Linters & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.6.2

      - name: OpenTofu Format Check
        run: tofu fmt -check
        working-directory: tofu

      - name: OpenTofu Init (syntax only, no backend)
        run: tofu init -backend=false
        working-directory: tofu

      - name: OpenTofu Validate
        run: tofu validate
        working-directory: tofu

      - name: Run Trivy TF Security Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          ignore-unfixed: true
          exit-code: '0' # Set to 1 to block PRs on security issues
          severity: 'CRITICAL,HIGH'

  validate-kubernetes:
    name: Kubernetes & Flux Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21'

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Validate Kustomization File Structures
        run: |
          echo "==== Validating Production Cluster ===="
          kustomize build kubernetes/clusters/production > /dev/null

          echo "==== Validating Infrastructure ===="
          kustomize build kubernetes/infrastructure > /dev/null

          echo "==== Validating Cilium ===="
          kustomize build kubernetes/infrastructure/cilium > /dev/null

          echo "==== Validating Cert-manager ===="
          kustomize build kubernetes/infrastructure/cert-manager > /dev/null

          echo "==== Validating Apps Directory ===="
          kustomize build kubernetes/apps > /dev/null

      - name: Lint YAML Files
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint

  flux-dry-run:
    name: Flux Custom Resource Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify No Decrypted SOPS Secrets Committed
        run: |
          echo "Scanning workspace for unencrypted SOPS files..."
          # Look for any .sops.yaml files that lack sops encryption metadata (no "sops:" or "ENC[")
          unencrypted_files=0
          while IFS= read -r f; do
            if ! grep -q -E "sops:|ENC\[" "$f"; then
              echo "Error: Unencrypted secret file detected: $f"
              unencrypted_files=$((unencrypted_files + 1))
            fi
          done < <(find . -name "*.sops.yaml")
          if [ $unencrypted_files -gt 0 ]; then
             echo "Security validation failed. One or more .sops.yaml secret files contain raw plaintext keys."
             exit 1
          fi
          echo "All .sops.yaml files are securely encrypted!"

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Dry-run and Validate Flux Manifests
        run: |
          flux install --dry-run
