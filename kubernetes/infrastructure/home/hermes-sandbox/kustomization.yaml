# hermes-sandbox — Kata sandbox namespace: PSA-restricted namespace, the
# Kata RuntimeClass, the runtime image template + warm pool, and Cilium
# default-deny (sandboxes may only talk to DNS + approved mirrors/endpoints).
# Order matters: namespace first (references below assume it exists).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  # Template before warm pool: the pool's sandboxTemplateRef must resolve.
  - sandbox-template.yaml
  - sandbox-warm-pool.yaml
  # Cilium last: the default-deny baseline locks the namespace's traffic and
  # references nothing, so it can never apply ahead of its dependencies.
  - cilium-policy.yaml