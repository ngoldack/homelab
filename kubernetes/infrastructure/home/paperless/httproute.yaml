# paperless.ngoldack.de on the EDGE path, uploaded from the LAN or the edge —
# one route, since the wildcard certificate covers both and the request lands
# on the same Gateway VIP. Paperless speaks native OIDC (via the
# PAPERLESS_SOCIALACCOUNT_PROVIDERS block in paperless-env.sops.yaml, backed by
# the authentik OIDC provider in seed.yaml), so unlike phoenix there is no
# authentik outpost in front — the edge route backends the paperless web
# Service directly (paperless-web:8000) and authentik handles the login
# handshake in-app. Same-namespace backend (this route lives in paperless, the
# Service in paperless), so no ReferenceGrant is needed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperless-edge
  namespace: paperless
spec:
  parentRefs:
    - name: edge
      namespace: network
      sectionName: https-apex
  hostnames:
    - paperless.${CLUSTER_DOMAIN}
  rules:
    - backendRefs:
        - name: paperless-web
          port: 8000
