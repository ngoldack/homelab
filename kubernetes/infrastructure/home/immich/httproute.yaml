# Immich in a browser, on the LAN.
#
# Reached at https://immich.svc.ngoldack.de, which resolves — via local DNS on
# the UniFi gateway, not public DNS — to the Gateway's LAN VIP 10.30.0.200.
# Remote access is UniFi Teleport: a Teleport client lands on the LAN like any
# other local device, so the same name and the same certificate work from
# anywhere without exposing anything to the internet.
#
# The certificate is the real Let's Encrypt wildcard for *.svc.ngoldack.de, so
# there are no browser warnings despite nothing being publicly reachable.
# cert-manager solves DNS-01 through its Hetzner webhook, which needs neither a
# public A record nor an inbound port.
#
# An earlier version of this route pointed DNS at the Hetzner ingress node
# instead. That could not work: Envoy ran in that node's host network
# namespace and could not reach pods on the LAN nodes at all, so every request
# returned 503 while the backend answered 200 in-cluster — and even had it
# worked, traffic would have crossed the WAN twice to reach a service in the
# same room as the client.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: immich
spec:
  parentRefs:
    - name: public
      namespace: network
      sectionName: https-wildcard
  hostnames:
    - immich.svc.ngoldack.de
  rules:
    - backendRefs:
        - name: immich-server
          port: 2283
