# Creates the extensions inside the phoenix database (CNPG Database CR, the
# immich/hindsight pattern). Phoenix stores embeddings as vectors and matches
# text with trigram indexes; the app role is not a superuser, so the operator
# creates both with ensure: present.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: phoenix-database
  namespace: phoenix
spec:
  name: phoenix
  owner: phoenix
  cluster:
    name: phoenix-database
  extensions:
    - name: vector
      ensure: present
    - name: pg_trgm
      ensure: present
