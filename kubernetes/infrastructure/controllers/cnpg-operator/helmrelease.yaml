apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-operator
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: cnpg-system
  chart:
    spec:
      chart: cloudnative-pg
      # 0.28.x => operator 1.29.x, comfortably above the 1.26.x minimum required by
      # the Barman Cloud CNPG-I plugin (kubernetes/infrastructure/controllers/cnpg-barman-plugin).
      version: "0.28.x"
      sourceRef:
        kind: HelmRepository
        name: cnpg
      interval: 1h
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values: {}
