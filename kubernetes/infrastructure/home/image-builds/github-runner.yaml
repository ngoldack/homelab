# Build the self-hosted GitHub Actions runner image (actions-runner + flux CLI).
#
# WHY THIS IMAGE — the CI job runs `flux reconcile` from inside the cluster, so
# the runner needs the flux CLI; the upstream actions-runner image ships none,
# and PSA restricted makes a job-time install impossible. See
# github-runner/dockerfile for the full reasoning and the base pins.
#
# BUILD SHAPE — self-contained: the Dockerfile and its entrypoint are the only
# inputs and both ship as the ConfigMap `github-runner-dockerfile`. That
# ConfigMap directory is passed as BOTH --local context and --local dockerfile,
# which is why this Job needs no `--opt=context=...git#<sha>` pin and can be
# committed in the same change as the files it builds.
#
# RE-BUILDING: Jobs are immutable. Bump the Job name suffix, the --output tag,
# and the base digests in github-runner/dockerfile together; Flux prunes the
# old Job. -2 added kubectl (the upstream runner image has none and the
# workflow's annotate/wait steps need it).
apiVersion: batch/v1
kind: Job
metadata:
  name: build-github-runner-2
  namespace: buildkit
spec:
  backoffLimit: 2
  # Two small public base images and one COPY; the registry cache makes a
  # rebase incremental. Short by this directory's standards, generous here.
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        topology.homelab/site: home
      containers:
        - name: buildctl
          # Same version as the daemon (chart 1.8.0 -> appVersion v0.31.0).
          image: moby/buildkit:v0.31.0
          command:
            - buildctl
          args:
            - --addr=tcp://buildkitd:1234
            - --tlscacert=/certs/ca.crt
            - --tlscert=/certs/tls.crt
            - --tlskey=/certs/tls.key
            - build
            - --frontend=dockerfile.v0
            # Context and Dockerfile are both the ConfigMap mount — those two
            # files are the entire build input.
            - --local=context=/dockerfile
            - --local=dockerfile=/dockerfile
            # configMapGenerator keys files by basename, so the Dockerfile is
            # the lowercase `dockerfile` key — same shape as build-llama-p100.
            - --opt=dockerfilekey=dockerfile
            # Pushes to the cluster's own Zot (../registry/), same TLS setup as
            # the other images in this directory.
            - --output=type=image,name=registry.ngoldack.de/github-runner:2,push=true
            # export and import MUST name the same ref, or nothing is reused.
            - --export-cache=type=registry,ref=registry.ngoldack.de/github-runner:buildcache,mode=max
            - --import-cache=type=registry,ref=registry.ngoldack.de/github-runner:buildcache
            - --progress=plain
          env:
            - name: DOCKER_CONFIG
              value: /docker
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: docker
              mountPath: /docker
              readOnly: true
            - name: dockerfile
              mountPath: /dockerfile
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: buildctl-client-tls
        - name: docker
          secret:
            secretName: registry-credentials
            items:
              - key: .dockerconfigjson
                path: config.json
        - name: dockerfile
          configMap:
            # Generated by configMapGenerator in this directory's
            # kustomization.yaml from github-runner/dockerfile and
            # github-runner/runner-entrypoint.sh.
            name: github-runner-dockerfile
