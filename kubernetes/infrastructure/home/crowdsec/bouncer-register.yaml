# Registers the envoy bouncer's API key with the LAPI, once. The key itself is
# pre-declared in bouncer-key.sops.yaml (generated at commit time) — unlike the
# authentik outpost token, nothing here is minted server-side, so the Job only
# has to PUBLISH a known value, not read one back. That is why it runs cscli
# in the crowdsec image against the LAPI and needs no ServiceAccount/RBAC:
# cscli authenticates with the LAPI's own machine credentials (mounted from the
# config PVC) and the bouncer record lands in the LAPI's data PVC, which
# persists it. A one-shot Job, not a CronJob, because the key is immutable and
# durable; nothing rotates to re-publish.
#
# Idempotency is the same get-then-add idiom the chart's own docker-start
# script uses (register_bouncer): list first, add only when absent. A retry
# after a crash, or a re-apply, is a no-op.
apiVersion: batch/v1
kind: Job
metadata:
  name: crowdsec-bouncer-register
  namespace: crowdsec
spec:
  # Let the completed Job linger briefly for logs, then let it be garbage
  # collected. Flux will never re-run a completed Job; that is fine (see the
  # one-shot rationale above).
  ttlSecondsAfterFinished: 300
  # Generous: the Job is applied in the same reconcile as the LAPI HelmRelease
  # it needs, and must ride out the LAPI's config-PVC creation + first boot.
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowdsec-bouncer-register
    spec:
      restartPolicy: OnFailure
      # Mounts the LAPI's config PVC (truenas-fast-nfs) to read cscli's machine
      # credentials, so this must land where the truenas-csi node plugin runs.
      nodeSelector:
        topology.homelab/site: home
      containers:
        - name: register
          image: crowdsecurity/crowdsec:v1.8.1
          env:
            - name: BOUNCER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: crowdsec-bouncer-key
                  key: API_KEY
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eu
              # The LAPI writes cscli's machine credentials to its config PVC
              # on first boot (local_api_credentials.yaml) and stages config.yaml
              # alongside. Wait for both before touching anything.
              for i in $(seq 1 60); do
                if [ -s /etc/crowdsec/local_api_credentials.yaml ] && \
                   [ -s /etc/crowdsec/config.yaml ]; then
                  break
                fi
                sleep 5
              done
              test -s /etc/crowdsec/local_api_credentials.yaml
              test -s /etc/crowdsec/config.yaml
              # The creds ship pointing at url: http://localhost:8080 — right
              # for cscli INSIDE the LAPI pod, wrong here. Re-point every
              # attempt (the LAPI also rewrites this line at its own boot, so
              # a one-shot edit can race); the in-place edit is harmless to the
              # LAPI because the Service URL resolves back to the LAPI itself.
              for i in $(seq 1 60); do
                sed -i \
                  's|^url:.*|url: http://crowdsec-service.crowdsec.svc.cluster.local:8080|' \
                  /etc/crowdsec/local_api_credentials.yaml
                if cscli -c /etc/crowdsec/config.yaml bouncers list -o json >/dev/null 2>&1; then
                  break
                fi
                sleep 5
              done
              if cscli -c /etc/crowdsec/config.yaml bouncers list -o json \
                | grep -q 'envoy-bouncer'; then
                echo "envoy-bouncer already registered; nothing to do"
                exit 0
              fi
              cscli -c /etc/crowdsec/config.yaml bouncers add envoy-bouncer --key "$BOUNCER_API_KEY"
              echo "envoy-bouncer registered"
          volumeMounts:
            - name: crowdsec-config
              mountPath: /etc/crowdsec
      volumes:
        - name: crowdsec-config
          persistentVolumeClaim:
            claimName: crowdsec-config-pvc
