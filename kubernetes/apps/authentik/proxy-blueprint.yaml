apiVersion: v1
kind: ConfigMap
metadata:
  name: perplexity-stack-proxy-blueprint
  namespace: authentik
data:
  perplexity-stack-proxy.yaml: |
    version: 1
    metadata:
      name: "Perplexity Stack SSO Applications"
    entries:
      # ── n8n proxy provider + application (forward-auth) ────────────────────
      - model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: n8n-proxy
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          external_host: https://n8n.netbird.${DOMAIN}
          internal_host: http://n8n.n8n.svc.cluster.local:5678
          internal_host_ssl_validation: false
          mode: proxy
      - model: authentik_core.application
        identifiers:
          slug: n8n
        attrs:
          name: n8n
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, n8n-proxy]]

      # ── SearXNG proxy provider + application (forward-auth) ────────────────
      - model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: searxng-proxy
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          external_host: https://searxng.netbird.${DOMAIN}
          internal_host: http://searxng.searxng.svc.cluster.local:8080
          internal_host_ssl_validation: false
          mode: proxy
      - model: authentik_core.application
        identifiers:
          slug: searxng
        attrs:
          name: SearXNG
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, searxng-proxy]]

      # ── Phoenix proxy provider + application (forward-auth) ────────────────
      - model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: phoenix-proxy
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          external_host: https://phoenix.netbird.${DOMAIN}
          internal_host: http://phoenix.phoenix.svc.cluster.local:6006
          internal_host_ssl_validation: false
          mode: proxy
      - model: authentik_core.application
        identifiers:
          slug: phoenix
        attrs:
          name: Phoenix
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, phoenix-proxy]]

      # ── Home Assistant proxy provider + application (forward-auth) ─────────
      - model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: homeassistant-proxy
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          external_host: https://homeassistant.netbird.${DOMAIN}
          internal_host: http://home-assistant.homeassistant.svc.cluster.local:8080
          internal_host_ssl_validation: false
          mode: proxy
      - model: authentik_core.application
        identifiers:
          slug: homeassistant
        attrs:
          name: Home Assistant
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, homeassistant-proxy]]

      # ── Grafana OAuth2 provider + application ──────────────────────────────
      # Grafana drives the OIDC flow itself (generic_oauth), so it is reached
      # directly over the NetBird mesh and redirects back to its own callback.
      # The client secret is injected from the authentik-secrets Secret via the
      # AUTHENTIK_GRAFANA_CLIENT_SECRET env var on the worker (!Env tag).
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: grafana-oauth
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: grafana
          client_secret: !Env AUTHENTIK_GRAFANA_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.netbird.${DOMAIN}/login/generic_oauth
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, grafana-oauth]]

      # ── Open WebUI OAuth2 / OIDC provider + application ────────────────────
      # Open WebUI drives the OIDC flow itself, reached over its own Cilium
      # Gateway at chat.${DOMAIN} (same mechanism as auth.${DOMAIN}). The client
      # secret is injected via AUTHENTIK_OPENWEBUI_CLIENT_SECRET (!Env) and
      # mirrored into the knowledge namespace's open-webui-secrets.
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: open-webui-oauth
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: open-webui
          client_secret: !Env AUTHENTIK_OPENWEBUI_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://chat.${DOMAIN}/oauth/oidc/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        identifiers:
          slug: open-webui
        attrs:
          name: Open WebUI
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, open-webui-oauth]]

      # ── agentgateway MCP OAuth2 provider (machine client_credentials) ──────
      # Issues the JWTs agentgateway validates on kagent MCP traffic. Agents use
      # client_credentials (no redirect). Long token validity because the bearer
      # is a static Secret with no native refresh — rotate manually/CronJob.
      # VERIFY-BEFORE-DEPLOY: confirm access_token_validity format + that
      # client_credentials is enabled for this provider in your Authentik version.
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: agentgateway-mcp
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: agentgateway-mcp
          client_secret: !Env AUTHENTIK_AGENTGATEWAY_CLIENT_SECRET
          access_token_validity: "weeks=2"
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        identifiers:
          slug: agentgateway-mcp
        attrs:
          name: agentgateway MCP
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, agentgateway-mcp]]

      # ── Attach the proxy providers to the embedded outpost ─────────────────
      # Only forward-auth (proxy) providers belong on the outpost; OAuth2
      # providers are consumed directly by the apps and are intentionally
      # excluded here. The embedded outpost is exposed over the NetBird mesh.
      - model: authentik_outposts.outpost
        identifiers:
          name: "authentik Embedded Outpost"
        attrs:
          type: proxy
          providers:
            - !Find [authentik_providers_proxy.proxyprovider, [name, n8n-proxy]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, searxng-proxy]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, phoenix-proxy]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, homeassistant-proxy]]
