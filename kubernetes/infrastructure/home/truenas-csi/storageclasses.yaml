# Books stack (../media/mariadb.yaml): MariaDB's data directory for Grimmory's
# catalogue. Block storage for the same reason the other databases use it —
# InnoDB wants block semantics (fsync latency, no NFS attribute cache or
# locking layer) — and the zvol's parent dataset carries the 6h/14d snapshots.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-fast-nvmeof-media-grimmory-database
provisioner: csi.truenas.io
parameters:
  protocol: "nvmeof"
  pool: "fast"
  datasetPath: "k8s/nvmeof/media/grimmory-database"
  compression: "LZ4"
  volblocksize: "16K"
  snapshot.schedule: "0 */6 * * *"
  snapshot.naming: "auto-%Y-%m-%d_%H-%M"
  snapshot.retention: "14"
  snapshot.retentionUnit: "DAY"
  snapshot.recursive: "false"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
# Books stack (../media/books.yaml): pyLoad's /config — plugin settings,
# accounts, the download queue and its accounts.conf.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-fast-nfs-media-pyload
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  pool: "fast"
  datasetPath: "k8s/nfs/media/pyload"
  compression: "LZ4"
  snapshot.schedule: "0 */6 * * *"
  snapshot.naming: "auto-%Y-%m-%d_%H-%M"
  snapshot.retention: "14"
  snapshot.retentionUnit: "DAY"
  snapshot.recursive: "false"
  nfs.mountOptions: "hard,nfsvers=4.1"
  nfs.rootSquash: "false"
  forceDelete: "false"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
