apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: monitoring
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.100.x"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    mode: daemonset

    presets:
      logsCollection:
        enabled: true
      hostMetrics:
        enabled: true
      kubernetesAttributes:
        enabled: true

    config:
      exporters:
        prometheusremotewrite:
          endpoint: "http://victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/write"
          tls:
            insecure: true
        otlp/loki:
          endpoint: "http://loki-single-binary.monitoring.svc.cluster.local:3100"
          tls:
            insecure: true

      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

      processors:
        batch: {}
        memory_limiter:
          check_interval: 1s
          limit_percentage: 75
          spike_limit_percentage: 15

      service:
        pipelines:
          metrics:
            receivers: [otlp, hostmetrics]
            processors: [memory_limiter, k8sattributes, batch]
            exporters: [prometheusremotewrite]
          logs:
            receivers: [otlp, filelog]
            processors: [memory_limiter, k8sattributes, batch]
            exporters: [otlp/loki]

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
