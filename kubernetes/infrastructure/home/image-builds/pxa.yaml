# Build the PXA engine (poisonxa16/pxa v2026.09.13-rc3) for the P100.
#
# WHY THIS IMAGE — A/B canary engine for the qwen36-35b slot-restore + performance
# benchmark (docs/pxa-qwen36-benchmark-results.md). pxa is a llama.cpp fork lineage
# (Pascal/Volta-first: P100/1080 Ti/V100) carrying the PXQ low-bit MoE codecs and
# kernels. ghcr.io/poisonxa16/pxa is NOT anonymously pullable (401), so the image is
# built from source: the Dockerfile below self-clones the pinned rc3 commit, so the
# operator context is only provenance; nothing is COPY'd from it.
#
# BUILD SHAPE — self-contained, like build-llama-p100-5ac8471: the Dockerfile ships
# as a ConfigMap (pxa-dockerfile), mounted at /dockerfile; --local dockerfile + the
# dockerfilekey mechanism. Jobs are immutable: bump the Job name suffix, the tag and
# the commit pin together on rebuild.
apiVersion: batch/v1
kind: Job
metadata:
  name: build-pxa-3c5b80d
  namespace: buildkit
spec:
  backoffLimit: 2
  # Clone + CUDA compile of the pxa engine on a single arch. Generous like the
  # llama-p100 Job; the registry buildcache makes rebases incremental.
  activeDeadlineSeconds: 10800
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        topology.homelab/site: home
      containers:
        - name: buildctl
          # Same version as the daemon (chart 1.8.0 -> appVersion v0.31.0).
          image: moby/buildkit:v0.31.0
          command:
            - buildctl
          args:
            - --addr=tcp://buildkitd:1234
            - --tlscacert=/certs/ca.crt
            - --tlscert=/certs/tls.crt
            - --tlskey=/certs/tls.key
            - build
            - --frontend=dockerfile.v0
            # Provenance only — the Dockerfile self-clones its real source at
            # the pinned commit and never COPYs from this context.
            - --opt=context=https://github.com/poisonxa16/pxa.git#3c5b80d918d690f51a856cd0d35edb9b9f828121
            # Our Dockerfile (pxa recipe, engine-only), from the ConfigMap below.
            - --local=dockerfile=/dockerfile
            - --opt=dockerfilekey=dockerfile
            # Single Pascal arch — the entire point of this engine.
            - --opt=build-arg:CUDA_ARCHS=60
            # Pushes to the cluster's own Zot (../registry/), same TLS setup as
            # the llama-p100/ik images.
            - --output=type=image,name=registry.ngoldack.de/pxa:2026.09.13-rc3,push=true
            # Dedicated cache ref so this engine's layers don't collide with
            # llama-p100's/ik's buildcache.
            - --export-cache=type=registry,ref=registry.ngoldack.de/pxa:buildcache,mode=max
            - --import-cache=type=registry,ref=registry.ngoldack.de/pxa:buildcache
            - --progress=plain
          env:
            - name: DOCKER_CONFIG
              value: /docker
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: docker
              mountPath: /docker
              readOnly: true
            - name: dockerfile
              mountPath: /dockerfile
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: buildctl-client-tls
        - name: docker
          secret:
            secretName: registry-credentials
            items:
              - key: .dockerconfigjson
                path: config.json
        - name: dockerfile
          configMap:
            # Generated by configMapGenerator in this directory's
            # kustomization.yaml from pxa/dockerfile.
            name: pxa-dockerfile
