# NetBird mesh exposure for Grafana's OIDC (generic_oauth) login.
#
# Unlike the forward-auth (proxy) apps, Grafana drives the OAuth2 flow itself,
# so the browser must reach Grafana directly. This NetworkResource publishes the
# in-namespace grafana Service onto the NetBird network; the DNS record is
# <metadata.name>.<router dnsZone> => grafana.netbird.${DOMAIN}, matching the
# redirect_uri and root_url configured for the Authentik "grafana" provider.
#
# The shared router (perplexity-stack-router) and the "perplexity-stack" group
# are defined alongside Authentik (kubernetes/apps/base/authentik/netbird.yaml);
# the group is referenced here by name since it lives in another namespace.
apiVersion: netbird.io/v1alpha1
kind: NetworkResource
metadata:
  name: grafana
spec:
  networkRouterRef:
    name: perplexity-stack-router
    namespace: authentik
  serviceRef:
    name: grafana
  groups:
    - name: perplexity-stack
