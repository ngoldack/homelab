# Default-deny baseline for the drill namespaces — same semantics as the
# cnpg-system/paperless pilots: selecting an endpoint with an ingress/egress
# section flips that direction to default-deny, and an empty rule whitelists
# no peer. The allowlists in cilium-allowlist.yaml are the only exceptions.
#
# The control namespace runs the drill driver (a Kubernetes-API client and
# nothing else); the six *-drill namespaces run a recovered CNPG cluster that
# must reach exactly one external thing — the S3 endpoint its backups live on.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpg-restore-drills-default-deny
  namespace: cnpg-restore-drills
spec:
  description: >-
    Deny-all ingress and egress for every endpoint in cnpg-restore-drills. The
    allowlist in cilium-allowlist.yaml is the only exception.
  endpointSelector:
    matchLabels: {}
  ingress:
    - {}
  egress:
    - {}
---
