# Intra-namespace communication: allowed by default, in both directions, for
# every workload namespace.
#
# Operator requirement (2026-09-17): pods inside a namespace must always be
# able to talk to each other. The zero-trust boundary this cluster enforces is
# the NAMESPACE boundary — cross-namespace traffic is denied unless a rule in
# an app's own cilium-allowlist.yaml names the peer, port and direction.
#
# The nine namespaces that carry per-workload allowlists (paperless, immich,
# hindsight, headlamp, monitoring, network, cert-manager, registry, buildkit)
# restricted sibling-to-sibling traffic as a side effect of enumerating their
# cross-namespace edges; this file restores the default for them, and is a
# no-op for the namespace-scoped policies that already allowed it inline.
#
# Deliberately EXCLUDED: `hermes-sandbox` — the Kata-isolated tenant space where
# untrusted agent code runs. Peer-to-peer networking between sandboxes was never
# a feature there (the gateway reaches a sandbox through the Router, and each
# sandbox carries a scoped Ed25519 claim token), so allowing it would widen the
# one boundary the sandbox design is built on. Say the word and this is a
# one-line addition.
#
# Also excluded: the Kubernetes/Cilium-owned namespaces (kube-*, cilium-secrets),
# plus `default`, `reach-test` and `aigateway`, which host no workloads.
#
# NOTE: this is a namespace CiliumNetworkPolicy list, NOT a
# CiliumClusterwideNetworkPolicy — a cluster-wide policy is enforced inside the
# Gateway's Envoy and breaks every route (see the rollback note in
# kustomization.yaml next to this file).
---
# Intra-namespace traffic is allowed by default: this namespace is one trust
# domain, so a pod may reach any sibling pod on any port. Cross-namespace
# traffic stays denied unless a specific allowlist rule names it — that is the
# boundary this cluster's policy is actually about.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent-sandbox-system-intra-namespace-allow
  namespace: agent-sandbox-system
spec:
  endpointSelector:
    matchLabels: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agent-sandbox-system
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agent-sandbox-system
    # DNS (see the header note).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
---
