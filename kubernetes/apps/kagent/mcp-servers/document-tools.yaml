# MCP wrappers for the document-tooling services (apps/gotenberg, apps/docling,
# apps/pandoc). These are the "wrap" layer the research/document agents will
# consume once a bridge exists.
#
# Corrected to the verified kagent schema (RemoteMCPServer, kagent.dev/v1alpha2).
#
# VERIFY-BEFORE-DEPLOY: gotenberg, docling-serve and pandoc expose REST APIs, NOT
# MCP, so each needs an MCP endpoint in front of it before these become healthy:
#   - docling  -> run the official docling MCP server (docling-mcp) against
#                 docling-serve and point the URL at it.
#   - gotenberg/pandoc -> front with a generic OpenAPI->MCP bridge (or a small
#                 MCP server) exposing /mcp.
# They are intentionally NOT referenced by any Agent (so failed tool discovery
# cannot break an agent). Wire them into document-ingest-agent / document-author-
# agent / the pdf+spreadsheet specialists once these resolve. Tracked in
# docs/ai-home-automation-roadmap.md.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: docling
  namespace: kagent
spec:
  description: "Docling document parsing (PDF/DOCX/XLSX/PPTX/HTML). NEEDS docling-mcp bridge."
  protocol: STREAMABLE_HTTP
  url: "http://docling.docling.svc.cluster.local:5001/mcp"
  timeout: 1m0s
  terminateOnClose: true
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: gotenberg
  namespace: kagent
spec:
  description: "Gotenberg HTML/Markdown/Office -> PDF. NEEDS OpenAPI->MCP bridge."
  protocol: STREAMABLE_HTTP
  url: "http://gotenberg.gotenberg.svc.cluster.local:3000/mcp"
  timeout: 1m0s
  terminateOnClose: true
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: pandoc
  namespace: kagent
spec:
  description: "Pandoc Markdown -> DOCX/PPTX/ODT/HTML (fully OSS, GPL). NEEDS OpenAPI->MCP bridge."
  protocol: STREAMABLE_HTTP
  url: "http://pandoc.pandoc.svc.cluster.local:3030/mcp"
  timeout: 1m0s
  terminateOnClose: true
