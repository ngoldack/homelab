# Per-agent SPIFFE identity. The spire-controller-manager turns this into one
# registration entry per matching pod, minting a SPIFFE ID
#   spiffe://homelab.local/ns/kagent/sa/<agent-serviceaccount>
# for every kagent declarative-agent pod (selected by the homelab.io/kagent-agent
# label from the Phase 1 hardening patch).
#
# Agents obtain their SVID by mounting the csi.spiffe.io workload-API socket
# (no privilege required). NOTE: agentgateway has no SPIFFE support today, so
# agent->MCP mTLS via SVID is not yet consumable — this establishes per-agent
# identity now for future SPIFFE-aware consumers. className must match the
# controller-manager class set in the spire HelmRelease values.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: kagent-agents
spec:
  className: spire
  spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}"
  podSelector:
    matchLabels:
      homelab.io/kagent-agent: "true"
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: kagent
  ttl: "1h"
  jwtTtl: "5m"
  autoPopulateDNSNames: true
