# One scrape object per metrics-emitting workload, all in this single file so
# the monitoring Kustomization (which already dependsOn monitoring-crds) ships
# the CRs after the VM operator CRDs exist. vmagent runs selectAllByDefault
# (see helmrelease.yaml), so a scrape object in any namespace is adopted with
# no label wiring; each object below pins namespaceSelector.matchNames to the
# workload's own namespace to be unambiguous about discovery.

# ---- immich: server exposes OpenTelemetry PrometheusExporter endpoints on
# 8081 (api) and 8082 (microservices) once IMMICH_TELEMETRY_INCLUDE is set on
# the server container (../immich/helmrelease.yaml). Pod-level scrape, since
# the Service only carries :2283.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: immich-server
  namespace: immich
spec:
  namespaceSelector:
    matchNames: [immich]
  selector:
    matchLabels:
      app.kubernetes.io/instance: immich
      app.kubernetes.io/name: server
  podMetricsEndpoints:
    - port: "8081"
    - port: "8082"
---
# ---- zot registry: metrics on the HTTP port once
# extensions.metrics.enable is set (../registry/helmrelease.yaml).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: zot
  namespace: registry
spec:
  namespaceSelector:
    matchNames: [registry]
  selector:
    matchLabels:
      app.kubernetes.io/name: zot
  endpoints:
    - port: "5000"
---
# ---- CloudNativePG. Each instance pod ALWAYS serves Prometheus metrics on
# :9187 (container port name "metrics"); the operator's deprecated
# monitoring.enablePodMonitor would only emit a prometheus-operator PodMonitor
# whose CRD is not installed here, so we scrape the pods directly and leave
# the Cluster CRs untouched.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: authentik-database
  namespace: authentik
spec:
  namespaceSelector:
    matchNames: [authentik]
  selector:
    matchLabels:
      cnpg.io/cluster: authentik-database
  podMetricsEndpoints:
    - port: "9187"
      # Expose the CNPG cluster name as a metric label so backup-age rules
      # can match per cluster (the plugin's barman_cloud_* and the core
      # exporter's pg_wal_archive_status series carry no cluster label of
      # their own).
      relabelConfigs:
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
          targetLabel: cluster
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: immich-database
  namespace: immich
spec:
  namespaceSelector:
    matchNames: [immich]
  selector:
    matchLabels:
      cnpg.io/cluster: immich-database
  podMetricsEndpoints:
    - port: "9187"
      relabelConfigs:
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
          targetLabel: cluster
---
