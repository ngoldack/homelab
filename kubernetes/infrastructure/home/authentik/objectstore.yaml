---
# Barman Cloud ObjectStore for authentik's CNPG cluster. Backup destination is
# the shared Hetzner Objects bucket; credentials come from the per-app SOPS
# secret authentik-backup-s3-credentials. serverName is intentionally absent:
# the plugin-barman-cloud CRD forbids it (Barman derives the server name).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: authentik-backup-store
  namespace: authentik
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://home-cnpg-backups-7cd4e906/authentik/
    endpointURL: https://fsn1.your-objectstorage.com
    s3Credentials:
      accessKeyId:
        name: authentik-backup-s3-credentials
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: authentik-backup-s3-credentials
        key: AWS_SECRET_ACCESS_KEY
      region:
        name: authentik-backup-s3-credentials
        key: AWS_REGION
    wal:
      compression: gzip
  instanceSidecarConfiguration:
    # Hetzner Objects (S3-compatible) requires disabling the AWS SDK's newer
    # data-integrity checksum defaults, which otherwise break uploads with
    # x-amz-content-sha256 errors (plugin-barman-cloud object_stores
    # contingency for S3-compatible endpoints).
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
