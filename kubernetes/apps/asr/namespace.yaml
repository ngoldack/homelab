apiVersion: v1
kind: Namespace
metadata:
  name: asr
  labels:
    # The qwenllm/qwen3-asr image runs as root; GPU access via the nvidia
    # RuntimeClass. Talos enforces baseline cluster-wide.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
