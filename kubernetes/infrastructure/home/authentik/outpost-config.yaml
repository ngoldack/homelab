# Outpost static config (NO secret material). The AUTHENTIK_TOKEN lives in
# the authentik-outpost-live Secret, which the outpost-token CronJob creates
# by asking the server's ORM for the edge-outpost's own token — see
# outpost-token.yaml. Split this way because the token cannot be declared
# here: its identifier embeds the Outpost row's uuid, generated server-side.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-outpost-config
  namespace: authentik
# WARNING: nothing watches this ConfigMap for changes — after editing it you
# MUST restart the consuming Deployments (kubectl rollout restart), or they keep
# running the old config (2026-09-19: -local Service rename left the outpost,
# both portal bridges and oidc-meta proxy on stale configs -> 502 / auth loop).
data:
  AUTHENTIK_HOST: http://authentik-server.authentik.svc.cluster.local
  AUTHENTIK_HOST_BROWSER: https://authentik.ngoldack.de
  AUTHENTIK_INSECURE: "false"
