# Barman Cloud object store for the khoj-postgres cluster (pgvector embeddings).
# WAL archive + base backups land in the Hetzner Object Storage DR bucket under the
# cnpg/khoj prefix, enabling point-in-time recovery (PITR). Referenced from
# cnpg-cluster.yaml .spec.plugins.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: khoj-backup-store
  namespace: khoj
spec:
  retentionPolicy: "14d"
  configuration:
    # Bucket name must match tofu var.hetzner_dr_bucket_name.
    destinationPath: s3://ngoldack-homelab-dr/cnpg/khoj
    # Hetzner S3 endpoint for the chosen location.
    endpointURL: https://fsn1.your-objectstorage.com
    s3Credentials:
      accessKeyId:
        name: khoj-backup-s3
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: khoj-backup-s3
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
