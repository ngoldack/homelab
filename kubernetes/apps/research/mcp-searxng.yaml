# mcp-searxng (isokoliuk/mcp-searxng, MIT) — the core "moving part" of the deep
# research pipeline. A single HTTP-native MCP server that gives BOTH web search
# (searxng_web_search) and page fetch (web_url_read) against our in-cluster
# SearXNG. Restricted-PSA compliant (Node, deps baked into the image).
#
# Reached by the kagent research agents via the `searxng-mcp` RemoteMCPServer
# (apps/kagent/mcp-servers) at http://mcp-searxng.research.svc:3000/mcp.
#
# VERIFY-BEFORE-DEPLOY: pin a real image tag/digest (avoid :latest); confirm the
# HTTP path (/mcp) and the exact tool names exposed by the running server.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-searxng
  namespace: research
  labels:
    app.kubernetes.io/name: mcp-searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-searxng
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-searxng
          # renovate: datasource=docker depName=isokoliuk/mcp-searxng
          image: isokoliuk/mcp-searxng:latest
          env:
            - name: SEARXNG_URL
              value: "http://searxng.searxng.svc.cluster.local:8080"
            # Enable Streamable HTTP transport (default is stdio).
            - name: MCP_HTTP_PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-searxng
  namespace: research
  labels:
    app.kubernetes.io/name: mcp-searxng
spec:
  selector:
    app.kubernetes.io/name: mcp-searxng
  ports:
    - name: http
      port: 3000
      targetPort: 3000
