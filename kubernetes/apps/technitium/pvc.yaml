# Technitium DNS config + zones (vendored raw manifests; the community chart is
# unmaintained). Single PVC holds the server config and all authoritative zone
# data. Edge-local disposable storage: a destroyed edge node means re-seeding the
# zones + TSIG key (see deployment.yaml VERIFY note) — acceptable for a single,
# non-HA authoritative server.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: technitium-config
  namespace: dns
  labels:
    app.kubernetes.io/name: technitium
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage-edge
  resources:
    requests:
      storage: 2Gi
