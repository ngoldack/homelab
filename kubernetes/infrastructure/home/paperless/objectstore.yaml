# Barman Cloud ObjectStore for paperless-ngx's CNPG cluster. WAL archive +
# base backups land under the app's prefix in the dedicated CNPG backup
# bucket (bucket name is globally unique on Hetzner and carries the
# tofu-applied random suffix — see tofu/home/backups.tf). Credentials +
# region come from the per-app SOPS secret. serverName is intentionally
# absent: the plugin-barman-cloud CRD forbids it (Barman derives the server
# name from the cluster, and recovery overrides it via the Cluster plugin
# parameter).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: paperless-backup-store
  namespace: paperless
spec:
  # Barman retention (expired base backups + WAL are pruned by the plugin's
  # sidecar retention loop). This — not the Cluster's deprecated
  # spec.backup.retentionPolicy — is where plugin retention lives.
  retentionPolicy: "30d"
  configuration:
    # v2: the cluster was re-initialized (system identifier …0881881 vs the
    # DONE backup under .../paperless/paperless-database/base/20260916T022900,
    # whose systemid is …198425). The previous incarnation's WALs under
    # .../paperless/ make barman refuse to continue the archive ("Expected
    # empty archive" every second), so WAL archiving never started and the
    # daily base backups for this incarnation stayed FAILED/STARTED. Fresh
    # destination is the sanctioned fix; the old prefix is left intact.
    destinationPath: s3://home-cnpg-backups-7cd4e906/paperless-v2/
    endpointURL: https://fsn1.your-objectstorage.com
    s3Credentials:
      accessKeyId:
        name: paperless-backup-s3-credentials
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: paperless-backup-s3-credentials
        key: AWS_SECRET_ACCESS_KEY
      # Hetzner region — boto3 signs with it; it is a secret reference, not a
      # literal on the ObjectStore.
      region:
        name: paperless-backup-s3-credentials
        key: AWS_REGION
    wal:
      compression: gzip
  instanceSidecarConfiguration:
    # Hetzner Objects (S3-compatible) needs the AWS SDK's newer data-integrity
    # checksum defaults disabled or uploads fail with x-amz-content-sha256
    # errors (documented contingency in the plugin docs for S3-compatible
    # endpoints).
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
