apiVersion: v1
kind: Namespace
metadata:
  name: falco
  labels:
    # Falco's DaemonSet is privileged + hostPID and bind-mounts /proc, /dev and
    # /sys to attach the modern eBPF probe. Talos enforces the baseline PSA level
    # cluster-wide, so this namespace must opt into privileged or the pods are
    # rejected at admission.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
