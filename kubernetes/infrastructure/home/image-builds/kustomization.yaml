# One-shot image build Jobs, driven by the builder in ../buildkit/.
#
# Separate from ../buildkit/ so that re-pinning a build does not churn the
# builder's own Kustomization, and so a failed Job cannot block the builder
# from reconciling — a Flux Kustomization that cannot apply also cannot prune.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - hermes-sandbox-runtime.yaml
  - hermes-agent-sandbox-plugin.yaml
  - github-runner.yaml
  - hermes-egress-authorizer.yaml
  - hermes-egress-reaper.yaml
  - synthetic-proxy.yaml
  - cosign-key.sops.yaml

# The github-runner build has no remote context: this ConfigMap directory is
# BOTH the context and the Dockerfile local, and its two keys are the entire
# build input (see github-runner.yaml). disableNameSuffixHash is on because the
# Job references the ConfigMap by the exact name `github-runner-dockerfile`.
configMapGenerator:
  - name: github-runner-dockerfile
    namespace: buildkit
    files:
      - github-runner/dockerfile
      - github-runner/runner-entrypoint.sh
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true
