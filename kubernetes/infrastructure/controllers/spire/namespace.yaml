apiVersion: v1
kind: Namespace
metadata:
  name: spire-system
  labels:
    # The spire-agent DaemonSet and spiffe-csi-driver are privileged/hostPath
    # workloads. Talos enforces the baseline PSA profile cluster-wide, so this
    # namespace must opt into privileged for those pods to schedule.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
