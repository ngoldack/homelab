apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crossplane
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: crossplane-system
  chart:
    spec:
      chart: crossplane
      # Pinned: provider-minio (crossplane-runtime v1.18) requires crossplane >= v1.9.0.
      version: "1.20.8"
      sourceRef:
        kind: HelmRepository
        name: crossplane-stable
      interval: 1h
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values: {}
