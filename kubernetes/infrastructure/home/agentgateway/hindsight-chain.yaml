# Hindsight's LLM chain: synthetic ONLY, via the proxy.
#
# WHY there is no fallback group. This chain used to carry a second priority
# group pointing at OpenRouter (openai/gpt-oss-120b, pinned to the cheap
# akashml/bf16 endpoint), which meant every synthetic failure silently moved
# hindsight's queue — its bulk retain/consolidation fan-out — onto a paid leg.
# Removed 2026-09-21 at the operator's direction: hindsight runs on synthetic
# only.
#
# WHY there is no health policy either (the sibling chains each have one, and
# hindsight deliberately does not). Eviction exists to make a chain move to its
# NEXT priority group; with a single group there is nothing to move to, so
# evicting could only make the gateway refuse to try at all. That decision now
# belongs entirely to the proxy in front of synthetic
# (image-builds/synthetic-proxy), which holds a bad key off locally and answers
# its own 429/503 without the gateway having to remember anything — see
# agentgateway/synthetic-proxy.yaml and policy-agent-chains-health.yaml for the
# reasoning on the chains that DO still fail over.
#
# The provider is a verbatim copy of the synthetic-hf-openai-gpt-oss-120b
# provider in backends.yaml (keep in sync): same host/port/path, the same
# `hf:` model string, and the shared synthetic-key secret.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: hindsight-chain
  namespace: agentgateway
spec:
  ai:
    groups:
      - providers:
          - name: synthetic-gpt-oss
            host: synthetic-proxy.agentgateway.svc.cluster.local
            port: 8080
            path: /v1/chat/completions
            openai:
              model: hf:openai/gpt-oss-120b
            policies:
              auth:
                secretRef:
                  name: synthetic-key
