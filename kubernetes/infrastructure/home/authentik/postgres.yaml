# Authentik's Postgres, CloudNativePG like every other relational store here.
#
# The app role/database are named authentik (not the CNPG default "app") and
# the password comes from OUR secret (postgres-credentials.sops.yaml) via
# bootstrap.initdb.secret — nothing is auto-generated, so the same literal
# password serves both this secret and AUTHENTIK_POSTGRESQL__PASS in
# secret.sops.yaml. If the two ever drift, django fails auth at startup
# loudly; that is the safer failure mode than a silently rotating secret.
#
# NFS again mirrors the immich-database tradeoff (see that file): the
# block-class (nvmeof) path is still unusable cluster-wide, so PG waits on
# NFS with the same caveats, smaller footprint.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-database
  namespace: authentik
spec:
  instances: 2
  minSyncReplicas: 1
  maxSyncReplicas: 1
  # Destructive storage-class migration via restore-from-backup (the same
  # procedure run as the first destructive restore drill): storageClassName
  # is immutable on a bound PVC, so moving the data dir from the generic
  # truenas-fast-nfs dataset (no snapshot schedule) to the dedicated
  # truenas-fast-nfs-authentik-database class (6h/14d TrueNAS snapshot task)
  # requires recreating the volume — bootstrap.recovery rebuilds it from the
  # Barman backup + archived WAL instead of a manual dump/restore. If this
  # ever needs to run again, flip bootstrap.recovery.recoveryTarget.targetTime
  # to a moment covered by archived WAL.
  bootstrap:
    recovery:
      source: authentik-source
  externalClusters:
    - name: authentik-source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: authentik-backup-store
          serverName: authentik-database
  affinity:
    nodeSelector:
      topology.homelab/site: home
  storage:
    size: 5Gi
    storageClass: truenas-fast-nfs-authentik-database
  # WAL archiving was deliberately withheld while the restore ran (the
  # plugin's barman-cloud-check-wal-archive refuses setup while the remote
  # archive is ahead of the restoring instance) and is re-enabled here, now
  # that the restore-from-backup onto truenas-fast-nfs-authentik-database is
  # complete. Backups: ObjectStore spec.retentionPolicy "30d";
  # spec.backup.retentionPolicy stays absent (in-tree-Barman-only, ignored by
  # the plugin).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik-backup-store
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  postgresql:
    parameters:
      # Force a WAL segment switch every 60s so archived WAL trails the
      # primary by at most ~1 minute regardless of write volume — without
      # it a quiet database leaves its newest WAL unarchived until the
      # 16 MiB segment fills (first restore drill died exactly on this:
      # "recovery ended before configured recovery target was reached").
      archive_timeout: "60"
