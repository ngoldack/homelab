# browserless — ClusterIP only. No HTTPRoute, no edge Gateway attachment. The
# CDP WebSocket rides this same port.
apiVersion: v1
kind: Service
metadata:
  name: browserless
  namespace: browserless
  labels:
    app.kubernetes.io/name: browserless
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: browserless
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
