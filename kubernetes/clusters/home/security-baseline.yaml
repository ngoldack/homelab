# The cluster-wide zero-trust baseline is deliberately *per namespace*: this
# Kustomization carries Flux's own namespace policies (default-deny + allowlist
# in flux-system-cilium.yaml), NOT a cluster-wide CiliumClusterwideNetworkPolicy.
# A CCNP floor was trialled on 2026-09-17 and rolled back the same day because
# Cilium enforces it inside the Gateway's Envoy — every route answered 403
# "Access denied"; the evidence is recorded in
# infrastructure/home/security-baseline/kustomization.yaml.
#
# dependsOn network only (ordering intent for a network-policy layer). There is
# deliberately no monitoring-crds dependency here: this Kustomization ships no
# VMRules — policy-violation alerting lives with the rest of the rules in
# infrastructure/home/monitoring/rules.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: security-baseline
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/infrastructure/home/security-baseline
  prune: true
  wait: false
  timeout: 10m
  retryInterval: 2m
  dependsOn:
    - name: network
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
