# Qwen3-ASR — speech recognition, replacing Whisper. Runs on the 3rd P100 (the
# other two are Ollama's).
#
# IMPORTANT PASCAL CONSTRAINT: Qwen3-ASR's fast/OpenAI-compatible serving path is
# vLLM (`qwen-asr-serve`), which does NOT run on Pascal - the very reason we left
# vLLM. So this uses the TRANSFORMERS backend instead (PyTorch supports Pascal;
# flash-attn is deliberately NOT enabled - it needs Ampere+). The official image
# exposes that backend only through the `qwen-asr-demo` Gradio app, so this serves
# a Gradio UI + programmatic Gradio API on :8000 - NOT an OpenAI
# /v1/audio/transcriptions endpoint. Therefore it is intentionally NOT a LiteLLM
# alias; consumers (e.g. Home Assistant) integrate via the Gradio API or a small
# adapter.
#
# VERIFY-BEFORE-DEPLOY: pin the image tag; confirm `qwen-asr-demo` is the entry
# CLI in the image and the flags below; first start downloads the 1.7B weights
# (~4GB) into the PVC; if transformers eager/sdpa attention is too slow on P100,
# consider the 0.6B checkpoint. If you need a true OpenAI STT API, a faster-whisper
# server (Pascal-friendly, OpenAI-compatible) would slot in as a LiteLLM alias.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: asr-models
  namespace: asr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: tns-fast-nfs
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-asr
  namespace: asr
  labels:
    app.kubernetes.io/name: qwen3-asr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qwen3-asr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen3-asr
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        ai: "true"
      tolerations:
        - key: ai
          value: "true"
          effect: NoSchedule
      containers:
        - name: qwen3-asr
          # renovate: datasource=docker depName=qwenllm/qwen3-asr
          image: qwenllm/qwen3-asr:latest
          command: ["qwen-asr-demo"]
          args:
            - "--asr-checkpoint"
            - "Qwen/Qwen3-ASR-1.7B"
            - "--backend"
            - "transformers"
            - "--cuda-visible-devices"
            - "0"
            - "--ip"
            - "0.0.0.0"
            - "--port"
            - "8000"
          env:
            # Persist the downloaded weights in the PVC (no re-download on restart).
            - name: HF_HOME
              value: /models
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 12Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: asr-models
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-asr
  namespace: asr
  labels:
    app.kubernetes.io/name: qwen3-asr
spec:
  selector:
    app.kubernetes.io/name: qwen3-asr
  ports:
    - name: http
      port: 80
      targetPort: 8000
