apiVersion: v1
kind: Namespace
metadata:
  name: research
  labels:
    # Baseline PSA: the mcp-searxng pod is restricted-compliant, but gpt-researcher
    # runs as root by default, so the namespace floor is baseline. (Talos enforces
    # baseline cluster-wide anyway.)
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
