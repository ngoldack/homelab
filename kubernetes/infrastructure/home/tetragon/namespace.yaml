# Tetragon's namespace. No gateway labels (nothing routes to it).
#
# PSA: privileged, explicitly. Talos enforces Kubernetes' `baseline` level by
# default, and Tetragon is a privileged eBPF daemon (hostNetwork, hostPID,
# hostPath mounts for /proc and the BPF maps) — baseline rejects all three, so
# without this the daemonset never gets pods admitted. Same labels as the other
# host-level namespaces in this repo (buildkit, monitoring, media).
#
# This is exactly the case Kyverno's pod-hardening policies exclude by
# namespace; the compensating control is that Tetragon's own network policy is
# the tightest in the cluster (DNS + the API, nothing else).
apiVersion: v1
kind: Namespace
metadata:
  name: tetragon
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
