apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: changeme@example.com  # TODO: set to your real ACME contact email
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      # Standard HTTP-01 solver (Cilium Ingress/Gateway API or Nginx)
      - http01:
          ingress:
            ingressClassName: cilium
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: changeme@example.com  # TODO: set to your real ACME contact email
    privateKeySecretRef:
      name: letsencrypt-production-key
    solvers:
      - http01:
          ingress:
            ingressClassName: cilium

# Alternative: DNS-01 can be configured here if utilizing Cloudflare or similar DNS providers
# spec:
#   acme:
#     ...
#     solvers:
#       - dns01:
#           cloudflare:
#             email: user@example.com
