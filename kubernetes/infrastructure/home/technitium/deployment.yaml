# Technitium DNS Server — the LAN split-horizon resolver replacing UniFi's
# internal DNS (see README "Ingress"). Authoritative for the internal
# ngoldack.de primary zone (LAN answers) + recursive/forwarder for everything
# else. LAN-only: exposed on VIP 10.30.0.203, no public route.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: technitium
  namespace: dns
  labels:
    app.kubernetes.io/name: technitium
    app.kubernetes.io/component: dns
    app.kubernetes.io/instance: technitium
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: technitium
  template:
    metadata:
      labels:
        app.kubernetes.io/name: technitium
        app.kubernetes.io/component: dns
        app.kubernetes.io/instance: technitium
    spec:
      nodeSelector:
        topology.homelab/site: home
      # Single-instance stateful DNS: ZFS snapshots are the backup; do not run
      # replicas against one SQLite data dir.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: technitium
                topologyKey: kubernetes.io/hostname
      containers:
        - name: dns-server
          image: docker.io/technitium/dns-server:15.4.0
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: web
              containerPort: 5380
              protocol: TCP
          env:
            # Self identity + web-console admin (first boot only; env-init is
            # skipped once the config file exists).
            - name: DNS_SERVER_DOMAIN
              value: dns.${CLUSTER_DOMAIN}
            - name: DNS_SERVER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: technitium-admin
                  key: password
            # LAN-only recursion as defense in depth (the RFC1918 VIP has no
            # WAN path anyway, but never accept recursion from elsewhere).
            - name: DNS_SERVER_RECURSION
              value: AllowOnlyForPrivateNetworks
            # Upstream for non-zone queries over DoT.
            - name: DNS_SERVER_FORWARDERS
              value: "1.1.1.1, 9.9.9.9"
            - name: DNS_SERVER_FORWARDER_PROTOCOL
              value: Tls
            - name: DNS_SERVER_PREFER_IPV6
              value: "false"
            - name: DNS_SERVER_LOG_USING_LOCAL_TIME
              value: "true"
            # Persist logs on the same PVC (subpath under config dir).
            - name: DNS_SERVER_LOG_FOLDER_PATH
              value: /etc/dns/logs
          volumeMounts:
            - name: data
              mountPath: /etc/dns
          livenessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 53
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dns-data
