# hermes-sandbox — the Kata sandbox namespace + RuntimeClass + runtime
# template/warm pool. wait:true + the healthCheckExprs below: hermes (the
# gateway) applies only after the warm pool reports a ready sandbox; a
# half-provisioned template must never feed the gateway. The SandboxWarmPool
# CRD exposes no conditions, so the gate is an explicit CEL expression
# (status.readyReplicas vs spec.replicas) — without it kstatus cannot see an
# unready pool and the Kustomization would report Ready regardless.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes-sandbox
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/infrastructure/home/hermes-sandbox
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: extensions.agents.x-k8s.io/v1beta1
      kind: SandboxWarmPool
      current: "status.readyReplicas == spec.replicas"
      failed: "status.readyReplicas == 0"
  timeout: 20m
  retryInterval: 2m
  dependsOn:
    - name: agent-sandbox
    - name: network
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
