# Khoj runs with --anonymous-mode, trusting the Authentik proxy for auth. This
# policy stops any other pod from reaching Khoj directly (which would grant
# unauthenticated admin) by only allowing ingress from the Authentik namespace
# (the embedded outpost) and the node (kubelet probes).
#
# Egress is intentionally left unrestricted: Khoj must reach its CNPG Postgres,
# LiteLLM, SearXNG, the Playwright MCP server, and the internet (model downloads).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: khoj
  namespace: khoj
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: khoj
  ingress:
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - port: "42110"
              protocol: TCP
