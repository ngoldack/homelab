# Firecrawl's purpose-built Postgres (nuq-postgres). This is NOT vanilla
# Postgres: the image ships pg_cron, pgcrypto, and the full nuq schema + ~25
# scheduled maintenance jobs that the Firecrawl queue depends on. It is run as-is
# (kept in sync upstream) instead of CloudNativePG, which would require
# hand-porting that schema. Single replica, persistent volume on the fast tier.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nuq-postgres
  namespace: firecrawl
  labels:
    app.kubernetes.io/name: nuq-postgres
    app.kubernetes.io/part-of: firecrawl
spec:
  serviceName: nuq-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nuq-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nuq-postgres
        app.kubernetes.io/part-of: firecrawl
    spec:
      containers:
        - name: postgres
          image: ghcr.io/firecrawl/nuq-postgres:latest
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firecrawl-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: tns-fast-nvmeof
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nuq-postgres
  namespace: firecrawl
  labels:
    app.kubernetes.io/name: nuq-postgres
    app.kubernetes.io/part-of: firecrawl
spec:
  selector:
    app.kubernetes.io/name: nuq-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
