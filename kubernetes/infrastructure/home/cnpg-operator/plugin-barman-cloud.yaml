# CloudNativePG Barman Cloud plugin. Installs the ObjectStore CRD
# (objectstores.barmancloud.cnpg.io/v1) so object stores can be provisioned
# for CNPG clusters. The chart ships the ObjectStore CRD and requires
# cert-manager (already present).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: plugin-barman-cloud
      version: "0.8.0"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
      interval: 1h
  targetNamespace: cnpg-system
  install:
    createNamespace: false
  values:
    # Keep the plugin on the LAN nodes. It only talks to the API server, but
    # the Hetzner ingress node is a small arm64 box reserved for ingress and
    # everything else in this cluster is pinned the same way.
    nodeSelector:
      topology.homelab/site: home
