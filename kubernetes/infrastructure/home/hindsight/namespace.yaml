apiVersion: v1
kind: Namespace
metadata:
  name: hindsight
  labels:
    # Pod Security Admission: audit+warn at `restricted`, enforcement left to
    # Talos' cluster default (`baseline`). Reported-only on purpose: a live
    # check on 2026-09-17 found almost every workload in these namespaces
    # violating `restricted` (runAsNonRoot, seccompProfile, capabilities.drop,
    # allowPrivilegeEscalation) and Kyverno's four audit policies do not cover
    # those fields — so `enforce: restricted` needs those securityContexts added
    # workload by workload first; clean policy reports alone are not the gate.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # Split surface by design:
    # - edge-ingress: the control-plane UI is served by the edge Gateway
    #   behind the authentik outpost (hindsight-ui-edge.yaml) — identity-gated
    #   everywhere, WAN hairpin included.
    # - public-ingress (LAN .200): the API only, publish=lan. The API has no
    #   auth layer of its own (multi-tenant auth is a custom TenantExtension),
    #   so it stays on the trusted network; agents reach it via ClusterIP
    #   (Teleport routes it) and the LAN VIP is for convenience.
    gateway.ngoldack.de/public-ingress: "true"
    gateway.ngoldack.de/edge-ingress: "true"
