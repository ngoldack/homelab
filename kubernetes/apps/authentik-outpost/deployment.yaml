# Authentik proxy outpost on the Hetzner edge — a first-party ForwardAuth endpoint
# for edge-routed Traefik HTTPRoutes (see middleware.yaml). Authentik CORE stays in
# the homelab; this is only the stateless outpost. It dials back to the core at
# AUTHENTIK_HOST and authenticates with a per-outpost API token.
#
# VERIFY-BEFORE-DEPLOY:
#   - Pin the proxy image to the SAME version as the running Authentik core
#     (chart authentik 2026.5.2 today). Outpost <-> core versions must match.
#   - Create the proxy outpost + its API token in the Authentik UI / blueprint and
#     store the token in the `authentik-outpost` Secret (key `token`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-outpost
  namespace: authentik-outpost
  labels:
    app.kubernetes.io/name: authentik-outpost
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-outpost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-outpost
    spec:
      nodeSelector:
        node-role: edge
      tolerations:
        - key: node-role
          value: edge
          effect: NoSchedule
      containers:
        - name: proxy
          # renovate: datasource=docker depName=ghcr.io/goauthentik/proxy
          image: ghcr.io/goauthentik/proxy:2026.5.2
          env:
            # Authentik core (homelab) — reached over TLS.
            - name: AUTHENTIK_HOST
              value: https://auth.${DOMAIN}
            - name: AUTHENTIK_INSECURE
              value: "false"
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: authentik-outpost
                  key: token
          ports:
            - name: http
              containerPort: 9000
            - name: metrics
              containerPort: 9300
          readinessProbe:
            httpGet:
              path: /outpost.goauthentik.io/ping
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /outpost.goauthentik.io/ping
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
