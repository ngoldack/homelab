# OpenTelemetry Collector helmrelease for Langfuse traces via the agentgateway.
#
# Chart version 0.127.2 from the official open-telemetry helm charts.
# The collector exposes OTLP traces at grpc:4317 and http:4318, sends traces
# to Langfuse (langfuse-web's /api/public/otel), and exposes metrics on 8888
# for scraping.
#
# Its otlphttp sending_queue is backed by the filestorage extension on the
# otel-collector-queue PVC (otel-collector-queue-pvc.yaml), so a Langfuse
# outage or a collector restart spools spans on disk instead of dropping them.
# That single-writer bbolt queue is why the release is pinned to one Recreate
# replica.
# LANGFUSE_AUTH is base64("<public key>:<secret key>"), the Basic credential
# for Langfuse's OTLP intake; the pair lives in langfuse-otel.sops.yaml
# (stringData.PUBLIC_KEY / SECRET_KEY / AUTH), never in cleartext here.
# The OpenTelemetry Collector binary expands ${env:LANGFUSE_AUTH} in config by default.

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-telemetry
  namespace: flux-system
spec:
  interval: 1h
  url: https://open-telemetry.github.io/opentelemetry-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  targetNamespace: agentgateway
  releaseName: otel-collector
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.127.2"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
      interval: 1h
  values:
    mode: deployment
    # One replica, Recreate: the exporter's filestorage queue (bbolt) has exactly
    # one writer, so a rollout must never overlap two collectors on the same
    # ReadWriteOnce queue directory.
    replicaCount: 1
    rollout:
      strategy: Recreate
    image:
      repository: otel/opentelemetry-collector-contrib
    command:
      name: otelcol-contrib
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    # The image runs as uid 10001; the TrueNAS NFS queue volume is root-owned, so
    # the queue directory is group-owned by the collector's uid (fsGroupChangePolicy
    # keeps the recursive chown off the hot path on restart).
    podSecurityContext:
      fsGroup: 10001
      fsGroupChangePolicy: OnRootMismatch
    extraVolumes:
      - name: otelcol-queue
        persistentVolumeClaim:
          claimName: otel-collector-queue
    extraVolumeMounts:
      - name: otelcol-queue
        mountPath: /var/lib/otelcol/queue
    extraEnvs:
      - name: LANGFUSE_AUTH
        valueFrom:
          secretKeyRef:
            name: langfuse-otel
            key: AUTH
    config:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      extensions:
        # Persistent queue backing: spans that cannot be exported right now
        # (Langfuse restart, network blip, rolling update of langfuse-web) wait
        # on disk instead of living only in the exporter's memory queue.
        file_storage:
          directory: /var/lib/otelcol/queue
          timeout: 10s
          create_directory: true
          directory_permissions: "0770"
          compaction:
            # The persistent-queue workload is exactly the one the contrib docs
            # name for rebound compaction: the bbolt file grows while Langfuse is
            # unreachable and must give the space back once it drains.
            on_rebound: true
            on_start: true
            directory: /var/lib/otelcol/queue/compaction
            cleanup_on_start: true
      exporters:
        otlphttp:
          endpoint: http://langfuse-web.langfuse.svc.cluster.local:3000/api/public/otel
          headers:
            Authorization: "Basic $${env:LANGFUSE_AUTH}"
            # Langfuse v4 realtime ingestion. Without it the deployment falls
            # back to the slow path (its docs: up to 10 minutes of lag), which
            # makes the traces look missing right after a call.
            x-langfuse-ingestion-version: "4"
          # Langfuse is behind langfuse-web; a transient 5xx must not drop
          # spans, so the exporter retries out of a queue instead of giving up.
          retry_on_failure:
            enabled: true
          sending_queue:
            enabled: true
            # On-disk queue, so a collector restart (or a rollout) resumes the
            # pending spans instead of dropping them.
            storage: file_storage
      service:
        extensions: [file_storage, health_check]
        pipelines:
          traces:
            receivers: [otlp]
            exporters: [otlphttp]
        telemetry:
          metrics:
            address: 0.0.0.0:8888
  # x-langfuse-ingestion-version: 4 — realtime ingestion on Langfuse v4
  # (without it ingestion can lag up to 10 minutes).
  # retry_on_failure + sending_queue: Langfuse is behind langfuse-web; a
  # transient 5xx must not drop spans.
  #
  # NOTE: $$ escapes the ${env:VAR} so Flux's strict envsubst (postBuild)
  # passes it through literally; the COLLECTOR then expands it at startup
  # from the LANGFUSE_AUTH env injected via extraEnvs above.
