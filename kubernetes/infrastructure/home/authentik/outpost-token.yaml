# Publishes the edge outpost's API token to the cluster.
#
# Why a CronJob: the 2026.x outpost model self-manages its service user +
# token server-side — Outpost.token is a get-or-create keyed on the row's
# uuid, so no blueprint/git file can pre-declare the value, and no public
# API returns the raw key. The ORM inside the server image is the only
# supported door. `ak manage shell` connects straight to Postgres/redis via
# the same authentik-config secret the server uses (no HTTP dependency on
# the server pod being up).
#
# Idempotent: re-running reads the same key and rewrites the Secret; if the
# token is ever rotated in the UI, the next run republishes it. Cron every
# 15m keeps convergence fast after any authentik change; cost is one short
# python run against the local DB.
#
# RBAC is namespaced: get/create/update of the single
# authentik-outpost-live secret, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: outpost-token
  namespace: authentik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: outpost-token
  namespace: authentik
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["authentik-outpost-live"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: outpost-token
  namespace: authentik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: outpost-token
subjects:
  - kind: ServiceAccount
    name: outpost-token
    namespace: authentik
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: outpost-token
  namespace: authentik
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        metadata:
          labels:
            app.kubernetes.io/name: outpost-token
        spec:
          serviceAccountName: outpost-token
          restartPolicy: Never
          nodeSelector:
            topology.homelab/site: home
          envFrom:
            - secretRef:
                name: authentik-config
          containers:
            - name: publish
              image: ghcr.io/goauthentik/server:2026.8.2
              command: ["/ak"]
              args:
                - manage
                - shell
                - -c
                - |
                  from authentik.outposts.models import Outpost
                  from kubernetes import client, config
                  import base64
                  o = Outpost.objects.get(name="edge-outpost")
                  key = o.token.key
                  config.load_incluster_config()
                  api = client.CoreV1Api()
                  body = client.V1Secret(
                      metadata=client.V1ObjectMeta(name="authentik-outpost-live"),
                      string_data={"AUTHENTIK_TOKEN": key},
                      type="Opaque",
                  )
                  try:
                      api.patch_namespaced_secret("authentik-outpost-live",
                                                  "authentik", body)
                  except client.exceptions.ApiException as e:
                      if e.status == 404:
                          api.create_namespaced_secret("authentik", body)
                      else:
                          raise
                  print("outpost token published")
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
