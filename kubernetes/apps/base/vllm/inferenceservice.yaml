apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llama-8b
  namespace: vllm
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    # Scale-from-zero is driven by the KEDA http-add-on interceptor (see
    # http-scaledobjects.yaml), not by KServe's own autoscaler.
    serving.kserve.io/autoscalerClass: none
    serving.kserve.io/secretName: vllm-s3-credentials
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  predictor:
    minReplicas: 0
    maxReplicas: 1
    nodeSelector:
      ai: "true"
    tolerations:
      - key: "ai"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    model:
      modelFormat:
        name: huggingface
      storageUri: "s3://vllm-models/llama-3.1-8b"
      runtime: kserve-vllmserver
      args:
        # ── CPU-only (current) ────────────────────────────────────────
        # Upgrade path for Intel Arc Pro B65:
        #   - change --device=cpu  → --device=xpu
        #   - change --dtype=bfloat16 → --dtype=float16
        #   - add resources.limits: gpu.intel.com/i915: "1"
        - "--device=cpu"
        - "--dtype=bfloat16"
        - "--max-model-len=4096"
        - "--max-num-batched-tokens=2048"
        - "--max-num-seqs=64"
      env:
        # Bind to the 8 P-cores (logical 0-15); reserve 1 core for the framework.
        - name: VLLM_CPU_OMP_THREADS_BIND
          value: "0-15"
        - name: VLLM_CPU_NUM_OF_RESERVED_CPU
          value: "1"
        - name: VLLM_CPU_KVCACHE_SPACE
          value: "8"
      resources:
        requests:
          cpu: "8"
          memory: "20Gi"
        limits:
          cpu: "14"
          memory: "28Gi"
      # Model weights are staged on fast NFS for local caching after the MinIO cold start.
      storageSpec:
        storageClassName: tns-fast-nfs
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
