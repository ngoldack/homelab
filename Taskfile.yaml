version: '3'

# Thin convenience wrapper around the Dagger module in .dagger.
# The same commands run in CI via .github/workflows (dagger/dagger-for-github),
# so `task check` locally is identical to the required branch-protection gate.
#
# Secrets are sourced from the environment as Dagger secrets (env://NAME).
# Put SOPS_AGE_KEY / NETBIRD_SETUP_KEY / KUBECONFIG_DATA in .env (gitignored).

dotenv:
  - .env

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  # -------------------------
  # Validation (offline, no secrets) - mirrors CI
  # -------------------------

  check:
    desc: Run every offline validation gate (the required CI gate)
    cmds:
      - dagger call check

  lint:
    desc: yamllint + actionlint
    cmds:
      - dagger call lint

  sops:check:
    desc: Assert every *.sops.yaml file is encrypted
    cmds:
      - dagger call sops-check

  tofu:validate:
    desc: OpenTofu fmt + init (no backend) + validate
    cmds:
      - dagger call tofu-validate

  tofu:security:
    desc: Trivy IaC config scan of tofu/
    cmds:
      - dagger call tofu-security

  k8s:validate:
    desc: kustomize build + kubeconform + Flux invariants
    cmds:
      - dagger call kube-validate

  # -------------------------
  # Live infrastructure (needs SOPS_AGE_KEY + NETBIRD_SETUP_KEY in env)
  # -------------------------

  tofu:plan:
    desc: Plan against live infrastructure (read-only)
    cmds:
      - >-
        dagger call tofu-plan
        --sops-age-key=env://SOPS_AGE_KEY
        --netbird-setup-key=env://NETBIRD_SETUP_KEY

  tofu:apply:
    desc: Apply against live infrastructure
    cmds:
      - >-
        dagger call tofu-apply
        --sops-age-key=env://SOPS_AGE_KEY
        --netbird-setup-key=env://NETBIRD_SETUP_KEY

  tofu:destroy:
    desc: Destroy all managed infrastructure (requires explicit confirmation)
    cmds:
      - >-
        dagger call tofu-destroy --confirm=destroy-production
        --sops-age-key=env://SOPS_AGE_KEY
        --netbird-setup-key=env://NETBIRD_SETUP_KEY

  tofu:output:
    desc: Print all OpenTofu outputs
    cmds:
      - dagger call tofu-output --sops-age-key=env://SOPS_AGE_KEY

  tofu:kubeconfig:
    desc: Extract kubeconfig from state to kubeconfig.yaml
    cmds:
      - >-
        dagger call kubeconfig --sops-age-key=env://SOPS_AGE_KEY
        export --path=kubeconfig.yaml

  tofu:talosconfig:
    desc: Extract talosconfig from state to talosconfig.yaml
    cmds:
      - >-
        dagger call talosconfig --sops-age-key=env://SOPS_AGE_KEY
        export --path=talosconfig.yaml

  flux:reconcile:
    desc: Force Flux to reconcile (git source + all Kustomizations)
    cmds:
      - >-
        dagger call flux-reconcile
        --kubeconfig=env://KUBECONFIG_DATA
        --netbird-setup-key=env://NETBIRD_SETUP_KEY

  # -------------------------
  # Secrets (interactive editing stays on the host via SOPS directly)
  # -------------------------

  secrets:edit:
    desc: Open a SOPS file in your editor (decrypts, edits, re-encrypts)
    cmds:
      - sops {{.CLI_ARGS}}

  secrets:decrypt:
    desc: 'Decrypt a SOPS file to stdout (e.g. task secrets:decrypt -- tofu/secret.sops.yaml)'
    cmds:
      - dagger call secrets-decrypt --sops-age-key=env://SOPS_AGE_KEY --path={{.CLI_ARGS}}
