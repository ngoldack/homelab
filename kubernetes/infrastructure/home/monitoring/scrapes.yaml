# ---- paperless is the FIFTH CNPG cluster (authentik, immich, hindsight and
# langfuse above; ../paperless/postgres.yaml + objectstore.yaml +
# scheduled-backup.yaml). Without its own scrape no series carries
# cluster="paperless-database" (the relabeled value is the CNPG cluster name),
# so an absent series — not a zero — makes every data-protection alert in
# ../monitoring/rules.yaml blind for it: the rules match on {cluster!=""} (or
# per-cluster equality) and simply have nothing to evaluate.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: paperless-database
  namespace: paperless
spec:
  namespaceSelector:
    matchNames: [paperless]
  selector:
    matchLabels:
      cnpg.io/cluster: paperless-database
  podMetricsEndpoints:
    - port: metrics
      relabelConfigs:
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
          targetLabel: cluster
---
# ---- external-dns (both the LAN and edge instances share the
# app.kubernetes.io/name=external-dns service label, so one scrape covers
# both) on the metrics port 7979.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: external-dns
  namespace: network
spec:
  namespaceSelector:
    matchNames: [network]
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  endpoints:
    # Both Services (external-dns and external-dns-edge) name their 7979
    # metrics port "http" — the second port is http-webhook:8080 — so the
    # endpoint must use the name: the numeric form renders
    # `keep __meta_kubernetes_endpoint_port_name regex: "7979"` and matches
    # nothing, which is why job network/external-dns had no up series.
    - port: http
---
# ---- cert-manager controller only (the task scopes to the controller; the
# cainjector/webhook emit on 9402/10250 but their Services are not prometheus
# ports we rely on).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  namespaceSelector:
    matchNames: [cert-manager]
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
  endpoints:
    # The controller Service exposes 9402 under the NAME
    # tcp-prometheus-servicemonitor (the pod's container port is http-metrics,
    # but the Service port name is what discovery sees). vmagent keeps targets
    # on __meta_kubernetes_endpoint_port_name, so the numeric form never
    # resolves — job cert-manager/cert-manager had no up series.
    - port: tcp-prometheus-servicemonitor
---
# ---- Flux controllers: source/kustomize/helm/notification controllers all
# label their pods app.kubernetes.io/part-of=flux and serve :8080 (container
# port name http-prom). There is no Service, so this is a pod scrape.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: flux-controllers
  namespace: flux-system
spec:
  namespaceSelector:
    matchNames: [flux-system]
  selector:
    matchLabels:
      app.kubernetes.io/part-of: flux
  podMetricsEndpoints:
    # Discovery matches the container port NAME
    # (__meta_kubernetes_pod_container_port_name): the numeric "8080" matched
    # no port name and discovered zero targets.
    - port: http-prom
---
# ---- authentik server pods serve django-prometheus metrics on :9300 (the
# container port "metrics"); the chart does not create a metrics Service, so
# this is a pod scrape.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: authentik-server
  namespace: authentik
spec:
  namespaceSelector:
    matchNames: [authentik]
  selector:
    matchLabels:
      app.kubernetes.io/part-of: authentik
      app.kubernetes.io/component: server
  podMetricsEndpoints:
    # Discovery matches the container port NAME
    # (__meta_kubernetes_pod_container_port_name): the numeric "9300" matched
    # no port name and discovered zero targets.
    - port: metrics
---
# ---- llmkube llama.cpp qwen3-27b: the llama-server runs with --metrics on
# :8080 (the InferenceService Service of the same name exposes it).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: qwen3-27b
  namespace: llmkube-system
spec:
  namespaceSelector:
    matchNames: [llmkube-system]
  selector:
    matchLabels:
      app: qwen3-27b
  endpoints:
    # The InferenceService Service names its 8080 port "http", so the numeric
    # form discovered nothing (job serviceScrape/llmkube-system/qwen3-27b has
    # no up series; the Service also has no ready endpoints right now because
    # no model pod is scheduled, so the name is the only form that can
    # resolve once one is).
    - port: http
---
# ---- cilium agent (9962, default prometheus-serve-addr) and operator
# (9963, container port name "prometheus"). Both live in kube-system and have
# no scrapeable Service of their own, so these are pod scrapes.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cilium-agent
  namespace: kube-system
spec:
  namespaceSelector:
    matchNames: [kube-system]
  selector:
    matchLabels:
      k8s-app: cilium
  podMetricsEndpoints:
    # Discovery matches the container port NAME
    # (__meta_kubernetes_pod_container_port_name): the numeric "9962" matched
    # no port name and discovered zero targets.
    - port: prometheus
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cilium-operator
  namespace: kube-system
spec:
  namespaceSelector:
    matchNames: [kube-system]
  selector:
    matchLabels:
      io.cilium/app: operator
  podMetricsEndpoints:
    # Discovery matches the container port NAME
    # (__meta_kubernetes_pod_container_port_name): the numeric "9963" matched
    # no port name and discovered zero targets.
    - port: prometheus
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cilium-hubble
  namespace: kube-system
spec:
  namespaceSelector:
    matchNames: [kube-system]
  selector:
    matchLabels:
      k8s-app: cilium
  podMetricsEndpoints:
    - port: hubble-metrics
---
# ---- valkey (authentik's cache/broker): the valkey-operator runs an
# oliver006/redis_exporter sidecar on :9121 whenever ValkeyCluster
# spec.exporter.enabled is true (it is — ../authentik/valkey.yaml).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: valkey
  namespace: authentik
spec:
  namespaceSelector:
    matchNames: [authentik]
  selector:
    matchLabels:
      app.kubernetes.io/component: valkey-node
  podMetricsEndpoints:
    # Discovery matches the container port NAME
    # (__meta_kubernetes_pod_container_port_name): the numeric "9121" matched
    # no port name and discovered zero targets.
    - port: metrics
---
# ---- kyverno: all four controller metrics Services (kyverno-svc-metrics for
# the admission controller, plus the background/cleanup/reports controllers)
# expose :8000 under the endpoint port NAME "metrics-port" and share the label
# app.kubernetes.io/part-of=kyverno, so ONE object covers the controllers (the
# external-dns entry above is the precedent for one object over several
# Services). The two other Services carrying that label — kyverno-svc and
# kyverno-cleanup-controller, the :443 webhooks — expose only an "https"
# endpoint port, so discovery finds no "metrics-port" target there and they
# are skipped. Port NAME rather than number, per the note at the top of this
# file: vmagent keeps targets on __meta_kubernetes_endpoint_port_name, so a
# numeric "8000" here discovers exactly nothing.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: kyverno
  namespace: kyverno
spec:
  namespaceSelector:
    matchNames: [kyverno]
  selector:
    matchLabels:
      app.kubernetes.io/part-of: kyverno
  endpoints:
    - port: metrics-port
---
# ---- tetragon: the agent DaemonSet's metrics Service ("tetragon") serves
# :2112 and tetragon-operator-metrics serves :2113. Both Services name their
# endpoint port "metrics" (verified on the live Endpoints objects, not just
# the Service spec), so the port NAME form is what discovery needs here too.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: tetragon
  namespace: tetragon
spec:
  namespaceSelector:
    matchNames: [tetragon]
  selector:
    matchLabels:
      app.kubernetes.io/name: tetragon
  endpoints:
    - port: metrics
      # node talos-bno-yij holds the control-plane VIP and its hostNetwork
      # tetragon pod advertises 10.30.0.10 as its host address, so that
      # endpoint is only reachable from the node holding the VIP: scraping it
      # from vmagent on any other node fails at the connection level (verified:
      # no Cilium policy drop, just "can't connect"), leaving one permanently
      # down target. The other three nodes publish the same agent metrics, so
      # the endpoint is dropped rather than kept as perpetual noise.
      relabelConfigs:
        - sourceLabels: [__address__]
          regex: "10\\.30\\.0\\.10:2112"
          action: drop
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: tetragon-operator-metrics
  namespace: tetragon
spec:
  namespaceSelector:
    matchNames: [tetragon]
  selector:
    matchLabels:
      app.kubernetes.io/name: tetragon-operator
  endpoints:
    - port: metrics
---
# ---- crowdsec: the LAPI (crowdsec-service) and the per-node agent
# (crowdsec-agent-service) both serve Prometheus metrics on :6060 under the
# endpoint port NAME "metrics". The LAPI Service also exposes the :8080
# decision API under the name "lapi" — only "metrics" is scraped. NOTE the
# selector: these two Services carry only app=crowdsec-<name> in their
# metadata (the k8s-app/type labels exist solely in their pod selectors, which
# a VMServiceScrape never sees), so each object matches its own Service by
# that `app` label.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: crowdsec-lapi
  namespace: crowdsec
spec:
  namespaceSelector:
    matchNames: [crowdsec]
  selector:
    matchLabels:
      app: crowdsec-service
  endpoints:
    - port: metrics
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: crowdsec-agent
  namespace: crowdsec
spec:
  namespaceSelector:
    matchNames: [crowdsec]
  selector:
    matchLabels:
      app: crowdsec-agent-service
  endpoints:
    - port: metrics
---
# ---- llama-kv-broker: the slot-choreography broker in front of the
# qwen36-35b serving Service serves Prometheus text at /metrics on the SAME
# :8080 its proxy traffic already listens on (so this is a service scrape,
# not a pod scrape, against the broker's own ClusterIP Service).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: llama-kv-broker
  namespace: llmkube-system
spec:
  namespaceSelector:
    matchNames: [llmkube-system]
  selector:
    matchLabels:
      app: llama-kv-broker
  endpoints:
    # The broker's Service names its 8080 port "http", and service-scrape
    # discovery keeps targets on __meta_kubernetes_endpoint_port_name, so the
    # numeric form would discover nothing here either (same lesson as the
    # qwen3-27b block above). No Cilium change accompanies this object: the
    # namespace-wide allowlist in ../llmkube/cilium-allowlist.yaml already
    # admits monitoring into llmkube-system on :8080.
    - port: http
