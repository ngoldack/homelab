# VMServiceScrapes so vmagent (selectAllByDefault) collects the Hindsight
# Prometheus metrics: /metrics on the api (8888) and the worker (8889);
# the control plane (Next.js) exposes none.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: hindsight-api
  namespace: hindsight
spec:
  endpoints:
    # Discovery matches the port NAME (__meta_kubernetes_endpoint_port_name):
    # the numeric "8888" matched no port name and discovered zero targets.
    - port: http
  selector:
    matchLabels:
      app.kubernetes.io/component: api
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: hindsight-worker
  namespace: hindsight
spec:
  endpoints:
    # Discovery matches the port NAME (__meta_kubernetes_endpoint_port_name):
    # the numeric "8889" matched no port name and discovered zero targets.
    - port: http
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
