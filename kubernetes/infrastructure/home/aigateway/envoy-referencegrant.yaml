# Cross-namespace ReferenceGrant: the aigateway edge HTTPRoute
# (local-llm-edge, in the aigateway namespace) points its backendRef at the
# Envoy AI Gateway's data-plane Service in envoy-gateway-system. Without this
# grant the reference is not permitted and the route's ResolvedRefs condition
# goes RefNotPermitted (edge 500s).
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-aigateway-edge-route-to-eag-envoy
  namespace: envoy-gateway-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: aigateway
  to:
    - group: ""
      kind: Service
      name: envoy-aigateway-aigateway-d6fc2393
